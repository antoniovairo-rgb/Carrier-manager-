    // Genera texture maglia con numero e colletto V
    const mkJerseyTex=(colHex,num=10)=>{
      const cv=document.createElement('canvas');cv.width=256;cv.height=256;
      const cx=cv.getContext('2d');
      const c3=new THREE.Color(colHex);const lum=c3.r*0.299+c3.g*0.587+c3.b*0.114;
      const light=lum>0.45;
      cx.fillStyle=colHex;cx.fillRect(0,0,256,256);
      // striscia petto
      cx.fillStyle=light?'rgba(0,0,0,0.18)':'rgba(255,255,255,0.15)';
      cx.fillRect(0,60,256,22);
      // colletto V
      cx.fillStyle=light?'rgba(0,0,0,0.55)':'rgba(255,255,255,0.35)';
      cx.beginPath();cx.moveTo(96,0);cx.lineTo(160,0);cx.lineTo(128,52);cx.closePath();cx.fill();
      // numero
      cx.fillStyle=light?'rgba(255,255,255,0.92)':'rgba(0,0,0,0.80)';
      cx.font='bold 88px sans-serif';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillText(String(num),128,155);
      return new THREE.CanvasTexture(cv);
    };
    const mkChar=(colHex,isUser=false,idx=0)=>{
      const g=new THREE.Group();
      const skins=[0xcfa07a,0xd4956a,0x8d5524,0xf1c27d,0xe8b89a];
      const skinCol=skins[idx%skins.length];
      const hairCols=[0x150900,0x3b1e0a,0x7a4a1e,0xd4a847,0x111111];
      const hairCol=hairCols[idx%hairCols.length];
      const jerseyNums=[7,9,10,11,3,4,5,6,8,2,1];
      const jerseyTex=mkJerseyTex(colHex,jerseyNums[idx%jerseyNums.length]);
      const jM=new THREE.MeshPhongMaterial({map:jerseyTex,shininess:55});
      const shortsM=new THREE.MeshPhongMaterial({color:0x0d1226,shininess:8});
      const skM=new THREE.MeshPhongMaterial({color:skinCol,shininess:20});
      const hM=new THREE.MeshPhongMaterial({color:hairCol,shininess:5});
      const sockM=new THREE.MeshPhongMaterial({color:0xf0f0f0,shininess:15});
      const bootM=new THREE.MeshPhongMaterial({color:0x0a0a0a,shininess:42});
      const eyeM=new THREE.MeshBasicMaterial({color:0x060606});
      const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m;};

      // TESTA grande — FIFA Street style (r=0.40, più grande per leggibilità)
      add(new THREE.SphereGeometry(0.40,24,18),skM,0,2.18,0);
      // capelli a calotta
      const hrGeo=new THREE.SphereGeometry(0.415,18,12,0,Math.PI*2,0,Math.PI*0.50);
      const hr=new THREE.Mesh(hrGeo,hM);hr.position.set(0,2.22,0);g.add(hr);
      // occhi + sopracciglia
      [-0.15,0.15].forEach(ex=>{
        add(new THREE.SphereGeometry(0.065,10,8),eyeM,ex,2.18,0.34);
        const br=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.028,0.04),hM);br.position.set(ex,2.30,0.342);br.rotation.x=-0.18;g.add(br);
      });
      // naso
      const ns=new THREE.Mesh(new THREE.SphereGeometry(0.048,8,6),skM);ns.scale.set(0.75,0.6,1.1);ns.position.set(0,2.09,0.368);g.add(ns);
      // bocca
      add(new THREE.BoxGeometry(0.12,0.028,0.032),new THREE.MeshPhongMaterial({color:0x8b3a3a,shininess:5}),0,1.97,0.370);

      // COLLO
      add(new THREE.CylinderGeometry(0.13,0.15,0.16,8),skM,0,1.88,0);
      // SPALLE (box ampio per look atletico)
      add(new THREE.BoxGeometry(1.04,0.20,0.44),jM,0,1.78,0);
      // TORSO (tapered jersey con texture)
      add(new THREE.CylinderGeometry(0.28,0.35,0.86,10),jM,0,1.35,0);
      // PANTALONCINI corsi
      add(new THREE.CylinderGeometry(0.35,0.33,0.28,10),shortsM,0,0.90,0);

      // GAMBA SINISTRA — tutto il gruppo swingha dall'anca
      const legL=new THREE.Group();legL.position.set(-0.18,1.04,0);
      const lLth=new THREE.Mesh(new THREE.CylinderGeometry(0.135,0.122,0.42,8),shortsM);lLth.position.y=-0.21;legL.add(lLth);
      const lLkn=new THREE.Mesh(new THREE.SphereGeometry(0.118,8,6),skM);lLkn.position.y=-0.44;legL.add(lLkn);
      const lLsh=new THREE.Mesh(new THREE.CylinderGeometry(0.112,0.100,0.44,8),skM);lLsh.position.y=-0.68;legL.add(lLsh);
      // calzettone lungo (copre stinco superiore)
      const lLsk=new THREE.Mesh(new THREE.CylinderGeometry(0.108,0.104,0.30,8),sockM);lLsk.position.y=-0.76;legL.add(lLsk);
      const lLbt=new THREE.Mesh(new THREE.BoxGeometry(0.23,0.12,0.36),bootM);lLbt.position.set(0,-1.00,0.05);legL.add(lLbt);
      g.add(legL);
      // GAMBA DESTRA
      const legR=new THREE.Group();legR.position.set(0.18,1.04,0);
      const lRth=new THREE.Mesh(new THREE.CylinderGeometry(0.135,0.122,0.42,8),shortsM);lRth.position.y=-0.21;legR.add(lRth);
      const lRkn=new THREE.Mesh(new THREE.SphereGeometry(0.118,8,6),skM);lRkn.position.y=-0.44;legR.add(lRkn);
      const lRsh=new THREE.Mesh(new THREE.CylinderGeometry(0.112,0.100,0.44,8),skM);lRsh.position.y=-0.68;legR.add(lRsh);
      const lRsk=new THREE.Mesh(new THREE.CylinderGeometry(0.108,0.104,0.30,8),sockM);lRsk.position.y=-0.76;legR.add(lRsk);
      const lRbt=new THREE.Mesh(new THREE.BoxGeometry(0.23,0.12,0.36),bootM);lRbt.position.set(0,-1.00,0.05);legR.add(lRbt);
      g.add(legR);

      // BRACCIO SINISTRO — leggermente aperto (atletico)
      const armL=new THREE.Group();armL.position.set(-0.56,1.78,0);armL.rotation.z=0.18;
      const aLu=new THREE.Mesh(new THREE.CylinderGeometry(0.092,0.082,0.48,8),jM);aLu.position.y=-0.24;armL.add(aLu);
      const aLel=new THREE.Mesh(new THREE.SphereGeometry(0.082,8,6),jM);aLel.position.y=-0.50;armL.add(aLel);
      const aLf=new THREE.Mesh(new THREE.CylinderGeometry(0.074,0.064,0.40,8),skM);aLf.position.y=-0.72;armL.add(aLf);
      g.add(armL);
      // BRACCIO DESTRO
      const armR=new THREE.Group();armR.position.set(0.56,1.78,0);armR.rotation.z=-0.18;
      const aRu=new THREE.Mesh(new THREE.CylinderGeometry(0.092,0.082,0.48,8),jM);aRu.position.y=-0.24;armR.add(aRu);
      const aRel=new THREE.Mesh(new THREE.SphereGeometry(0.082,8,6),jM);aRel.position.y=-0.50;armR.add(aRel);
      const aRf=new THREE.Mesh(new THREE.CylinderGeometry(0.074,0.064,0.40,8),skM);aRf.position.y=-0.72;armR.add(aRf);
      g.add(armR);

      if(isUser){const rg=new THREE.Mesh(new THREE.TorusGeometry(0.70,0.07,6,28),new THREE.MeshBasicMaterial({color:0xe8c547}));rg.rotation.x=Math.PI/2;rg.position.y=0.06;g.add(rg);}
      g._legL=legL;g._legR=legR;g._armL=armL;g._armR=armR;
      g._animPhase=idx*1.2;
      g.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});
      return g;
    };

    const pMesh=mkChar(homeCol,true,0);pMesh.visible=false;scene.add(pMesh);
    const bMesh=new THREE.Mesh(new THREE.SphereGeometry(0.22,14,10),new THREE.MeshLambertMaterial({color:0xffffff}));bMesh.castShadow=true;bMesh.visible=false;scene.add(bMesh);
    const patchMat=new THREE.MeshLambertMaterial({color:0x222222});
    [[0,0.22,0],[0.16,0.15,0],[0,0.12,0.18],[-0.16,0.15,0]].forEach(([x,y,z])=>{const p=new THREE.Mesh(new THREE.SphereGeometry(0.075,6,5),patchMat);p.position.set(x,y,z);bMesh.add(p);});
    // Carica pallone GLB reale (bianco/nero pentagoni) e sostituisce il pallone procedurale
    // Pallone GLB reale
    loadGLB('Simple%20soccer%20football.glb').then(gltf=>{
      const r=sr.current;if(!r.scene)return;
      const ball=gltf.scene.clone(true);
      ball.scale.setScalar(0.30);ball.visible=r.bMesh.visible;ball.position.copy(r.bMesh.position);
      ball.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
      r.scene.remove(r.bMesh);r.scene.add(ball);r.bMesh=ball;
    }).catch(()=>{});
    const oMeshes=(opponents||[]).map((opp,i)=>{const m=mkChar(oppCol,false,i+1);const p=toThree(opp.x,opp.y);m.position.set(p.x,0,p.z);m.rotation.y=Math.PI;m.visible=false;scene.add(m);return m;});

    // Background players — simplified char (body + head), all 22 + referee
    const mkBgChar=(colHex,isRef=false)=>{
      const g=new THREE.Group();
      const jM=new THREE.MeshLambertMaterial({color:isRef?0xf5a800:new THREE.Color(colHex)});
      const sM=new THREE.MeshLambertMaterial({color:0x1a1a2e});
      const skM=new THREE.MeshLambertMaterial({color:0xdba88a});
      // Gambe
      [-0.15,0.15].forEach(xo=>{const lg=new THREE.Mesh(new THREE.CylinderGeometry(0.095,0.095,0.62,6),skM);lg.position.set(xo,0.31,0);g.add(lg);});
      // Pantaloncini
      const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.29,0.23,0.28,7),sM);sh.position.y=0.68;g.add(sh);
      // Torso
      const bd=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.29,0.72,7),jM);bd.position.y=1.04;g.add(bd);
      // Testa
      const hd=new THREE.Mesh(new THREE.SphereGeometry(0.24,9,7),skM);hd.position.y=1.56;g.add(hd);
      if(isRef){const fl=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.07,0.2),new THREE.MeshLambertMaterial({color:0xff0000}));fl.position.set(0.3,0.75,0);g.add(fl);}
      g.castShadow=true;return g;
    };
    const bgMeshes=(allPlayers||[]).map(p=>{const isRef=p.team==="ref";const col=p.team==="home"?homeCol:p.team==="away"?oppCol:"#000";const m=mkBgChar(col,isRef);const pos=toThree(p.x,p.y);m.position.set(pos.x,0,pos.z);m.rotation.y=p.team==="away"?Math.PI:0;m.visible=false;scene.add(m);return m;});

    sr.current={scene,camera,renderer,pMesh,bMesh,oMeshes,bgMeshes,zh,camTarget:new THREE.Vector3(-12,40,-70),lookAt:new THREE.Vector3(8,2,2)};

    const _hCol=homeCol,_oCol=oppCol;
    loadGLB('player.glb').then(gltf=>{
      const r=sr.current;if(!r.scene)return;
      const SKINS=[0xcfa07a,0xd4956a,0x8d5524,0xf1c27d,0xe8b89a];
      const jogClip=gltf.animations.find(a=>a.name==='Jog_Fwd_Loop')||gltf.animations[0];
      const idleClip=gltf.animations.find(a=>a.name==='Idle_Loop')||jogClip;
      const mixers=[];
      // Pre-calcola bounding box globale del template per calibrare Y su tutte le mesh
      const _templateBox=new THREE.Box3().setFromObject(gltf.scene);
      const _gMinY=_templateBox.min.y,_gRange=(_templateBox.max.y-_templateBox.min.y)||1;
      const mkFootballer=(colHex,isUser=false,idx=0)=>{
        const clone=typeof THREE.SkeletonUtils!=='undefined'?THREE.SkeletonUtils.clone(gltf.scene):gltf.scene.clone(true);
        const skinCol=new THREE.Color(SKINS[idx%SKINS.length]);
        const jerCol=new THREE.Color(colHex);
        const shortsCol=new THREE.Color(isUser?0x1a1a2e:0x2d1b00);
        const bootCol=new THREE.Color(isUser?0x111111:0x3a1a00);
        const sockCol=new THREE.Color(isUser?0xffffff:0xeeeeee);
        clone.traverse(node=>{
          if(!node.isSkinnedMesh&&!node.isMesh)return;
          node.castShadow=true;node.receiveShadow=true;
          const geo=node.geometry.clone();
          const pos=geo.attributes.position;
          // Applica la matrice world del nodo per ottenere Y globale
          const mat=new THREE.Matrix4();node.updateWorldMatrix(true,false);mat.copy(node.matrixWorld);
          const cols=new Float32Array(pos.count*3);
          const tmp=new THREE.Vector3();
          for(let i=0;i<pos.count;i++){
            tmp.fromBufferAttribute(pos,i).applyMatrix4(mat);
            const t2=(tmp.y-_gMinY)/_gRange;
            let c;
            if(t2<0.10)c=bootCol;
            else if(t2<0.18)c=sockCol;
            else if(t2<0.50)c=skinCol;
            else if(t2<0.60)c=shortsCol;
            else if(t2<0.82)c=jerCol;
            else c=skinCol;
            cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
          }
          geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
          node.geometry=geo;
          node.material=new THREE.MeshPhongMaterial({vertexColors:true,shininess:30,specular:new THREE.Color(0x222222),...(node.isSkinnedMesh?{skinning:true}:{})});
        });
        const box=new THREE.Box3().setFromObject(clone);
        const h=box.max.y-box.min.y;
        if(h>0.1)clone.scale.setScalar(2.2/h);
        const mx=new THREE.AnimationMixer(clone);
        const clip=isUser?idleClip:jogClip;
        if(clip){const ac=mx.clipAction(clip);ac.timeScale=isUser?0.9:0.85+idx*0.04;ac.time=idx*0.7;ac.play();}
        mixers.push(mx);
        if(isUser){const rg=new THREE.Mesh(new THREE.TorusGeometry(0.70,0.07,6,28),new THREE.MeshBasicMaterial({color:0xe8c547}));rg.rotation.x=Math.PI/2;rg.position.y=0.06;clone.add(rg);}
        return clone;
      };
      const oldP=r.pMesh;const newP=mkFootballer(_hCol,true,0);
      newP.visible=oldP.visible;newP.position.copy(oldP.position);newP.rotation.copy(oldP.rotation);
      r.scene.remove(oldP);r.scene.add(newP);r.pMesh=newP;
      r.oMeshes=r.oMeshes.map((old,i)=>{
        const nm=mkFootballer(_oCol,false,i+1);
        nm.visible=old.visible;nm.position.copy(old.position);nm.rotation.copy(old.rotation);
        r.scene.remove(old);r.scene.add(nm);return nm;
      });
      r.mixers=mixers;
    }).catch(()=>{});

    let animId,t=0;
    const animate=()=>{
      animId=requestAnimationFrame(animate);t+=0.016;
      const r=sr.current;const w=wRef.current;
      if(w.active){
        // Cinematic walkout orbit — wider radius, higher altitude
        w.angle+=0.005;w.progress+=0.0035;
        camera.position.set(Math.cos(w.angle)*80,35+Math.sin(w.angle*0.6)*5,Math.sin(w.angle)*80);
        camera.lookAt(0,4,0);
        if(w.progress>=1){w.active=false;cbRef.current?.();}
      }else{
        // Smooth follow
        camera.position.lerp(r.camTarget,r.actionZoom?0.12:0.045);camera.lookAt(r.lookAt);
      }
      if(r.bMesh&&r.bMesh.visible){
        // Ball tracks player position every frame (not just on React state update)
        if(r.playerPos){r.bMesh.position.x=r.playerPos.x+Math.sin(t*1.4)*0.18;r.bMesh.position.z=r.playerPos.z+Math.cos(t*1.1)*0.12;}
        r.bMesh.position.y=0.22+Math.abs(Math.sin(t*2.8))*0.22;r.bMesh.rotation.y+=0.07;
      }
      // Animazione gambe/braccia — pivot all'anca/spalla, fase desincronizzata per giocatore
      const animChar=(m,speed,amp)=>{
        if(!m||!m.visible)return;
        const ph=m._animPhase||0;
        if(m._legL){m._legL.rotation.x=Math.sin(t*speed+ph)*amp;m._legR.rotation.x=-Math.sin(t*speed+ph)*amp;}
        if(m._armL){m._armL.rotation.x=-Math.sin(t*speed+ph)*amp*0.45;m._armR.rotation.x=Math.sin(t*speed+ph)*amp*0.45;}
      };
      animChar(r.pMesh,5.0,0.72);
      r.oMeshes?.forEach((m,i)=>{
        animChar(m,4.2+i*0.12,0.60);
        if(m.visible){
          m.position.y=Math.sin(t*1.1+(m._animPhase||0))*0.018;
          // Avversari si girano verso il giocatore
          if(r.pMesh&&r.pMesh.visible){const dx=r.pMesh.position.x-m.position.x;const dz=r.pMesh.position.z-m.position.z;m.rotation.y=Math.atan2(dx,dz);}
        }
      });
      r.bgMeshes?.forEach((m,i)=>{if(m.visible){m.position.y=Math.sin(t*0.7+i*1.9)*0.012;}});
      r.mixers?.forEach(mx=>mx.update(0.016));
      renderer.render(scene,camera);
    };
    animate();sr.current.stopAnim=()=>cancelAnimationFrame(animId);


    return()=>{
      ro.disconnect();
      sr.current.mixers?.forEach(mx=>mx.stopAllAction());
      sr.current.stopAnim?.();
      sr.current.scene?.traverse(obj=>{
        if(obj.geometry)obj.geometry.dispose();
        const mats=obj.material?Array.isArray(obj.material)?obj.material:[obj.material]:[];
        mats.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});
      });
      renderer.dispose();
      if(mount.contains(renderer.domElement))mount.removeChild(renderer.domElement);
    };
  },[]);// eslint-disable-line

  useEffect(()=>{
    const r=sr.current;if(!r.pMesh)return;
    const isMatch=matchPhase!=="walkout";
    r.pMesh.visible=isMatch;r.bMesh.visible=isMatch;r.oMeshes?.forEach(m=>m.visible=isMatch);r.bgMeshes?.forEach(m=>m.visible=isMatch);
    if(matchPhase==="walkout"){wRef.current.active=true;wRef.current.angle=-Math.PI*0.15;wRef.current.progress=0;}
  },[matchPhase]);

  useEffect(()=>{
    const r=sr.current;if(!r.pMesh||!r.bMesh)return;
    const{x,z}=toThree(playerX,playerY);
    r.pMesh.position.x=x;r.pMesh.position.z=z;r.pMesh.rotation.y=Math.PI/2;
    r.playerPos={x,z}; // used by animate loop for continuous ball tracking
    r.bMesh.position.x=x;r.bMesh.position.z=z;
    r.actionZoom=actionZoom; // used for lerp speed in animate loop
    if(actionZoom){
      // Spalla — camera bassa, vicina, quasi di spalle al giocatore
      r.camTarget.set(x-11,4.5,z+2.5);
      r.lookAt.set(x+20,1.2,z);
    }else{
      const camX=x*0.45-8;
      r.camTarget.set(camX,26,-56);
      r.lookAt.set(camX+10,0,2);
    }
  },[playerX,playerY,actionZoom]);

  useEffect(()=>{
    const r=sr.current;if(!r.zh)return;
    const zd=ZONES[zone];if(!zd){r.zh.material.opacity=0;return;}
    const x1=zd.x[0]-50,x2=zd.x[1]-50;
    r.zh.scale.x=x2-x1;r.zh.position.x=(x1+x2)/2;
    const zc={propria:0x6366f1,difesa:0x3b82f6,centro:0x10b981,trequarti:0xf59e0b,bordo:0xef4444,area:0xdc2626};
    r.zh.material.color.setHex(zc[zone]||0xe8c547);r.zh.material.opacity=0.20;
  },[zone]);

  return<div ref={mountRef} style={{width:"100%",height:"clamp(300px, 72vh, 700px)",borderRadius:"0 0 12px 12px",overflow:"hidden",background:"#050810"}}/>;
}

/* ========================================
   D-PAD  (W/↑ = avanti) — pulsanti grandi
======================================== */
function DPad({onMove,dark=false,size=42}){
  const SZ=size;
  const btn=(lbl,dx,dy)=>(
    <button onPointerDown={e=>{e.preventDefault();onMove(dx,dy);}}
      style={{width:SZ,height:SZ,borderRadius:9,
        background:dark?"rgba(0,0,0,0.52)":"rgba(30,42,60,0.08)",
        border:dark?"1px solid rgba(255,255,255,0.18)":"1px solid "+TH.cardBorder,
        color:dark?"#fff":TH.text,fontSize:16,cursor:"pointer",
        display:"flex",alignItems:"center",justifyContent:"center",
        userSelect:"none",WebkitUserSelect:"none",touchAction:"none",
        fontWeight:600,
        boxShadow:dark?"none":TH.shadow}}>
      {lbl}
    </button>
  );
  return(
    <div style={{display:"grid",gridTemplateColumns:`${SZ}px ${SZ}px ${SZ}px`,gridTemplateRows:`${SZ}px ${SZ}px ${SZ}px`,gap:4,userSelect:"none",flexShrink:0}}>
      <div/>{btn("▲",+2.5,0)}<div/>
      {btn("◀",0,-2.5)}<div style={{display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:7,height:7,borderRadius:"50%",background:dark?"rgba(255,255,255,0.12)":"rgba(0,0,0,0.1)"}}/></div>{btn("▶",0,+2.5)}
      <div/>{btn("▼",-2.5,0)}<div/>
    </div>
  );
}

/* ========================================
   AI UI COMPONENTS
======================================== */
function ScoutReportScreen({report,opponent,onClose,loading}){
  if(loading)return(
    <Card style={{padding:24,textAlign:"center",marginBottom:10}}>
      <div style={{fontSize:28,marginBottom:6,animation:"pulse 1.2s infinite"}}>🔍</div>
      <div style={{fontSize:13,color:TH.muted}}>Scout in osservazione…</div>
      <div style={{fontSize:10,color:TH.faint,marginTop:4}}>Analisi tattica di {opponent?.n||"avversario"} in corso</div>
    </Card>
  );
  if(!report)return null;
  const dc=report.difficulty>72?TH.danger:report.difficulty>48?TH.warning:TH.success;
  const diffLabel=report.difficulty>72?"🔴 Molto difficile":report.difficulty>55?"🟡 Difficile":report.difficulty>38?"🟢 Abbordabile":"🔵 Accessibile";
  const prestige=opponent?.p||65;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:10}}>
      {/* Header */}
      <Card style={{padding:"14px 16px",background:"linear-gradient(135deg,#0f172a,#1a1f2e)",border:"1px solid rgba(255,255,255,0.08)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>

/* Groups roster [{name,role,num?}] into formation rows ATT→MID→DEF→GK */
function rosterRows(roster){
  const gk=[],def=[],mid=[],att=[];
  roster.forEach((p,i)=>{
    const r=(p.role||"").toUpperCase();
    const entry={...p,num:p.num||i+1};
    if(r==="GK"||r==="POR"||r.includes("PORTIERE"))gk.push(entry);
    else if(r==="DEF"||r.includes("DIFENSORE")||r.includes("TERZINO"))def.push(entry);
    else if(r==="MID"||r==="CEN"||r.includes("CENTROCAMPISTA")||r.includes("MEDIANO")||r.includes("TREQUARTISTA")||r.includes("MEZZALA"))mid.push(entry);
    else att.push(entry); // Ala, Centravanti, ATT, etc.
  });
  return[att,mid,def,gk].filter(r=>r.length>0);
}

/* Single team formation column */
function TeamFormation({team,roster,isHome,kitCol}){
  const col=kitCol||team?.c||team?.col||"#3b82f6";

      {rows.map((row,ri)=>(

          {row.map((pl,pi)=>{

    </div>
  );
}

/* WALKOUT OVERLAY */
function WalkoutOverlay({homeTeam,homeRoster,opponent,isHome=true,matchWeek,onDone,weather}){
  const STEPS=88;
  const [tick,setTick]=useState(0);
  useEffect(()=>{if(tick>=STEPS)return;const t=setTimeout(()=>setTick(n=>n+1),50);return()=>clearTimeout(t);},[tick]);
  useEffect(()=>{if(tick>=STEPS)onDone();},[tick,onDone]);
  const col=homeTeam?.c||homeTeam?.col||"#22c55e";
  const roster=homeRoster||[{name:"Portiere",role:"GK"},{name:"Difensore 2",role:"DEF"},{name:"Difensore 3",role:"DEF"},{name:"Terzino S.",role:"DEF"},{name:"Terzino D.",role:"DEF"},{name:"Mediano",role:"MID"},{name:"Centrocampista",role:"MID"},{name:"Mezzala",role:"MID"},{name:"Ala Sinistra",role:"ATT"},{name:"Ala Destra",role:"ATT"},{name:"Centravanti",role:"ATT"}];
  const visible=Math.min(11,Math.floor((tick/STEPS)*13));
  const pct=Math.round((tick/STEPS)*100);
  // Stadium & atmosphere
  const venueTeam=isHome?homeTeam:opponent;
  const stadiumName=getStadiumName(venueTeam);
  const crowd=calcAttendance(venueTeam,"career");

// Kit contrast helpers
const hexToRgb=h=>{const s=h.replace('#','');const n=parseInt(s.length===3?s.split('').map(c=>c+c).join(''):s,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};};
const colorDist=(a,b)=>{const A=hexToRgb(a),B=hexToRgb(b);return Math.sqrt((A.r-B.r)**2+(A.g-B.g)**2+(A.b-B.b)**2);};
// Returns a contrasting kit color for the away team (alt kits: white, black, red, yellow, cyan)
const ALT_KITS=['#f0f0f0','#111111','#e53e3e','#f6c90e','#00bcd4','#e91e63','#ff5722'];
const resolveKitConflict=(homeCol,awayCol)=>{
  if(!homeCol||!awayCol)return awayCol||'#ef4444';
  if(colorDist(homeCol,awayCol)>80)return awayCol; // enough contrast
  // find the most distinct alt kit from homeCol
  return ALT_KITS.reduce((best,k)=>colorDist(homeCol,k)>colorDist(homeCol,best)?k:best,'#f0f0f0');
};

/* ========================================
   LIVE MATCH  (req #3,#4,#5,#6,#8)
======================================== */
function LiveMatch({player,opponent,context="career",onMatchEnd,isMatchHome=true}){
  const [numHL]=useState(()=>context==="trial"?rng(2,3):rng(2,4));
  const [hlTimes]=useState(()=>{const step=Math.floor(82/numHL)||12;return Array.from({length:numHL},(_,i)=>8+step*i+rng(0,Math.max(1,step-4)));});
  const [situations]=useState(()=>seededShuffle([...SITUATIONS],(player.season||1)*1000+(player.week||1)*13).slice(0,numHL));
  const [stadium]=useState(()=>pick(STADIUMS));
  // day or night — seeded by week so same match is always same time
  const [timeOfDay]=useState(()=>(player.week||1)%2===0?"night":"day");
  // Sprint 16 — weather seeded by week + club (winter weeks get bad weather bonus)
  const [weather]=useState(()=>{
    const wk=player.week||1;const isWinter=wk<=10||wk>=33;
    const seed=hashStr((player.club?.id||"x")+wk+(player.season||1));
    const pool=WEATHER_TYPES.map(wt=>({...wt,w:isWinter&&["rain","storm","snow","fog"].includes(wt.id)?wt.w*3:wt.w}));
    let tot=pool.reduce((s,e)=>s+e.w,0);let r=(seed%10000)/10000*tot;
    for(const wt of pool){r-=wt.w;if(r<=0)return wt;}return pool[0];
  });
  // Sprint 16 — crowd chant overlay state
  const [crowdChant,setCrowdChant]=useState(null); // {text,type,key}
  // Sprint 17
  const [momentum,setMomentum]=useState(50); // 0=away dominance, 100=home dominance
  const momentumRef=useRef(50);

  const heatPointsRef=useRef([]); // {x,y}[] — sampled every 4 playing ticks
  const [showHeatMap,setShowHeatMap]=useState(false);
  const gkDiveRef=useRef(null); // GK dive direction for rigore
  // context-aware realistic attendance
  const [attendance]=useState(()=>calcAttendance(context==="trial"?null:(player.club||opponent),context));
  // responsive layout: narrow = stacked vertically
  const [isNarrow,setIsNarrow]=useState(()=>window.innerWidth<430);
  useEffect(()=>{const fn=()=>setIsNarrow(window.innerWidth<430);window.addEventListener("resize",fn);return()=>window.removeEventListener("resize",fn);},[]);
  // persistent seeded rosters for both teams
  const [homeRoster]=useState(()=>{const r=generateTeamRoster(player.club||opponent,player.season||1);r[10]={name:player.name,role:"Centravanti"};return r;});
  const [awayRoster]=useState(()=>generateTeamRoster(opponent,player.season||1));
  // 22 players + referee — generated once per match
  const [matchPlayers,setMatchPlayers]=useState(()=>{
    const j=(x,y,d=4)=>({x:clamp(x+rng(-d,d),3,97),y:clamp(y+rng(-d,d),3,97)});
    return[
      // Home team (10 outfield + GK, protagonist is separate)
      {...j(8,50),team:"home",gk:true},{...j(18,12),team:"home"},{...j(18,38),team:"home"},
      {...j(18,62),team:"home"},{...j(18,88),team:"home"},{...j(38,25),team:"home"},
      {...j(38,50),team:"home"},{...j(38,75),team:"home"},{...j(55,22),team:"home"},{...j(55,78),team:"home"},
      // Away team (11)
      {...j(95,50),team:"away"},{...j(82,12),team:"away"},{...j(82,38),team:"away"},
      {...j(82,62),team:"away"},{...j(82,88),team:"away"},{...j(62,25),team:"away"},
      {...j(62,50),team:"away"},{...j(62,75),team:"away"},{...j(48,20),team:"away"},
      {...j(48,50),team:"away"},{...j(48,80),team:"away"},
      // Referee removed — not needed for gameplay
    ];
  });

  // AI states
  const [oppTactic,setOppTactic]=useState(null);
  const oppTacticRef=useRef(null);
  useEffect(()=>{oppTacticRef.current=oppTactic;},[oppTactic]);
  const [oppTacticLoading,setOppTacticLoading]=useState(false);
  const [scoutReport,setScoutReport]=useState(null);
  const [scoutLoading,setScoutLoading]=useState(false);
  const [showScout,setShowScout]=useState(false);
  const [aiCommentary,setAiCommentary]=useState(null);

  const [clock,setClock]=useState(0);
  const [score,setScore]=useState({home:0,away:0});
  const [phase,setPhase]=useState(context==="trial"?"playing":"matchday");
  const [hlIdx,setHlIdx]=useState(0);
  // position resets to situation startZone on each new highlight
  const [pPos,setPPos]=useState(()=>getStartPos(situations[0])||{x:58,y:50});
  const pPosRef=useRef({x:58,y:50});
  useEffect(()=>{pPosRef.current=pPos;},[pPos]);
  const [mStats,setMStats]=useState({goals:0,assists:0,rb:0});
  const [energy,setEnergy]=useState(100);
  const [coms,setComs]=useState([]);
  const [outcome,setOutcome]=useState(null);
  const [chosenAct,setChosenAct]=useState(null);
  const [selectedActionIdx,setSelectedActionIdx]=useState(0);
  // Possession: based on player OVR vs opponent prestige (read directly from prop, not from oppPrestige var)
  const [possession,setPossession]=useState(()=>{
    const opp=opponent?.p||opponent?.prestige||65;
    const diff=(player.ovr||65)-opp;
    return clamp(Math.round(50+diff*0.28+rng(-5,5)),22,78);
  });
  const possessionRef=useRef(50);
  useEffect(()=>{possessionRef.current=possession;},[possession]);
  const [ballPos,setBallPos]=useState({x:50,y:50});
  const ballPosRef=useRef({x:50,y:50});
  useEffect(()=>{ballPosRef.current=ballPos;},[ballPos]);
  const [mxStats,setMxStats]=useState({shots:0,oppShots:0,fouls:0,corners:0});
  const [waveEvent,setWaveEvent]=useState(null);
  const [actionEffect,setActionEffect]=useState(null);
  const [screenFlash,setScreenFlash]=useState(null);
  const [floatGoal,setFloatGoal]=useState(null);
  const [movesLeft,setMovesLeft]=useState(0);
  const [pressureBar,setPressureBar]=useState(1);
  const [paused,setPaused]=useState(false);
  const pressureRef=useRef(1);
  const [defDist,setDefDist]=useState(100); // 0=on you 100=far
  const defDistRef=useRef(100);
  const movesLeftRef=useRef(0);
  const moveCoolRef=useRef(0);
  const driftTargetsRef=useRef(null);
  const velRef=useRef({});
  const DRIFT_PRESETS={
    // index 0 = home GK (always fixed in goal centre), indices 1-9 = home outfield
    attack:    [{x:5,y:50},{x:22,y:18},{x:22,y:38},{x:22,y:62},{x:22,y:82},{x:42,y:25},{x:42,y:75},{x:62,y:22},{x:62,y:50},{x:62,y:78}],
    attack_goal:[{x:5,y:50},{x:22,y:18},{x:22,y:38},{x:22,y:62},{x:22,y:82},{x:38,y:20},{x:38,y:80},{x:55,y:15},{x:65,y:50},{x:55,y:85}],
    wide_right: [{x:5,y:50},{x:22,y:18},{x:22,y:38},{x:22,y:62},{x:22,y:82},{x:42,y:25},{x:42,y:75},{x:60,y:85},{x:68,y:70},{x:72,y:90}],
    midfield:  [{x:5,y:50},{x:22,y:18},{x:22,y:38},{x:22,y:62},{x:22,y:82},{x:42,y:25},{x:42,y:50},{x:42,y:75},{x:55,y:30},{x:55,y:70}],
    retreat:   [{x:5,y:50},{x:12,y:25},{x:12,y:50},{x:12,y:75},{x:25,y:15},{x:25,y:50},{x:25,y:85},{x:35,y:30},{x:35,y:55},{x:35,y:70}],
    defend_goal:[{x:5,y:50},{x:8,y:20},{x:8,y:45},{x:8,y:55},{x:8,y:80},{x:18,y:30},{x:18,y:50},{x:18,y:70},{x:28,y:38},{x:28,y:62}],
    opp_goal:  [{x:5,y:50},{x:72,y:18},{x:72,y:38},{x:72,y:62},{x:72,y:82},{x:62,y:25},{x:62,y:75},{x:50,y:22},{x:50,y:50},{x:50,y:78}],
  };

  const keysRef=useRef(new Set());
  const moveRef=useRef(null);
  const zone=getZone(pPos.x);
  const oppPrestige=opponent?.p||opponent?.prestige||65;
  const opponents=useRef([{x:76,y:35},{x:82,y:50},{x:79,y:65}]);

  const addCom=useCallback((text,color,t)=>{setComs(p=>[{text,color,t:t??clock},...p].slice(0,16));},[clock]);

  // Load scout report on mount (career matches only)
  useEffect(()=>{
    if(context==="trial")return;
    setScoutLoading(true);
    generateScoutReport(opponent,player.stats,player.matchHistory||[],player).then(r=>{setScoutReport(r);setScoutLoading(false);});
  },[]);// eslint-disable-line

  // Async handler: load opponent tactic then go to formations
  const handleGoToFormations=async()=>{
    setOppTacticLoading(true);
    setPhase("formations");
    const tactic=await generateOpponentTactic(opponent,player.stats,player.week||1);
    setOppTactic(tactic);
    setOppTacticLoading(false);
    // save tactic to player via callback if available (handled by parent via onMatchEnd context)
    console.log("[CPM-AI] Opponent tactic:",tactic);
  };

  // reset position + selectedActionIdx when highlight changes
  useEffect(()=>{
    if(phase==="hl_move"||phase==="hl_intro"){
      const sp=getStartPos(situations[hlIdx]);
      setPPos(sp);
    }
    if(phase==="hl_choose"){
      setSelectedActionIdx(0);
      // Sprint 17: if rigore, pre-compute GK dive direction
      if(situations[hlIdx]?.text?.includes("RIGORE")){
        const dirs=["tl","tc","tr","bl","bc","br"];
        const w=[18,8,18,22,12,22];let r=Math.random()*100;
        for(let i=0;i<dirs.length;i++){r-=w[i];if(r<=0){gkDiveRef.current=dirs[i];break;}}
        if(!gkDiveRef.current)gkDiveRef.current="bc";
      }
    }
  },[hlIdx,phase]);// eslint-disable-line

  // hl_intro auto-advance → hl_move after 2.5s (tap/key to skip)
  useEffect(()=>{
    if(phase!=="hl_intro"||paused)return;
    const mm=situations[hlIdx]?.maxMoves??1;
    const go=()=>{movesLeftRef.current=mm;setMovesLeft(mm);moveCoolRef.current=0;pressureRef.current=1;setPressureBar(1);defDistRef.current=80+Math.random()*20;setDefDist(defDistRef.current);setPhase("hl_move");};
    const t=setTimeout(go,2500);
    const onKey=e=>{if(e.key===" "||e.key==="Enter"){clearTimeout(t);go();}};
    document.addEventListener("keydown",onKey);
    return()=>{clearTimeout(t);document.removeEventListener("keydown",onKey);};
  },[phase,hlIdx,situations,paused]);// eslint-disable-line

  // Pressure timer during hl_move — depletes over ~8s, auto-advances on expiry
  useEffect(()=>{
    if(phase!=="hl_move"||paused)return;
    const sit=situations[hlIdx];
    if(sit?.lockMovement||sit?.maxMoves===0)return; // no pressure on penalty/free kick
    const TOTAL=8000,STEP=100;
    const iv=setInterval(()=>{
      // Defender closes in
      const speed=0.025+(oppPrestige/99)*0.02; // faster for better teams
      defDistRef.current=Math.max(0,defDistRef.current-speed*STEP/10);
      setDefDist(defDistRef.current);
      // Pressure drains faster when defender is on you
      const pressureMult=defDistRef.current<25?2.2:defDistRef.current<50?1.5:1;
      pressureRef.current=Math.max(0,pressureRef.current-(STEP/TOTAL)*pressureMult);
      setPressureBar(pressureRef.current);
      if(pressureRef.current<=0){clearInterval(iv);setPhase("hl_choose");}
    },STEP);
    return()=>clearInterval(iv);
  },[phase,hlIdx,situations,paused]);// eslint-disable-line

  // Continuous AI pressing during all HL phases — opponents and teammates always move
  useEffect(()=>{
    if(!["hl_intro","hl_move","hl_choose"].includes(phase)||paused)return;
    const sit=situations[hlIdx];
    const isDef=sit?.type==="def";
    const isNearGoal=["area","bordo"].includes(sit?.zones?.[0]);
    const pressingMs=isNearGoal?550:isDef?700:650;
    const iv=setInterval(()=>{
      // Rigore / punizione: area libera, avversari in fila fuori dal box
      if(sit?.lockMovement){
        setMatchPlayers(prev=>prev.map((pl,idx)=>{
          if(pl.team==="ref")return pl;
          if(pl.team==="away"){
            const ai=idx-10; // 0..10
            // Away GK stays in goal during set pieces (penalty/free kick)
            if(ai===0)return{...pl,x:clamp(pl.x+(95-pl.x)*0.15,88,98),y:clamp(pl.y+(50-pl.y)*0.12,35,65)};
            return{...pl,
              x:clamp(pl.x+(74+Math.random()*4-pl.x)*0.32,64,81),
              y:pl.y+((8+ai*8)-pl.y)*0.28};
          }else{
            // Home GK stays in goal during set pieces
            if(idx===0)return{...pl,x:clamp(pl.x+(3-pl.x)*0.15,2,8),y:clamp(pl.y+(50-pl.y)*0.12,35,65)};
            return{...pl,
              x:clamp(pl.x+((76+Math.random()*12)-pl.x)*0.25,68,91),
              y:pl.y+((10+idx*7)-pl.y)*0.20};
          }
        }));
        return;
      }
      setMatchPlayers(prev=>prev.map((pl,idx)=>{
        if(pl.team==="ref")return pl;
        const r=(Math.random()-0.5)*3.5;
        if(pl.team==="away"){
          const ai=idx-10;
          // Away GK: stays in goal, tracks ball laterally
          if(ai===0){const tyStep=clamp((pPos.y-pl.y)*0.08,-2,2);return{...pl,x:clamp(pl.x,88,98),y:clamp(pl.y+tyStep,28,72)};}
          const dpx=pPos.x-pl.x,dpy=pPos.y-pl.y;
          const dist=Math.sqrt(dpx*dpx+dpy*dpy);
          if(dist>28){
            const step=Math.min(7,dist*0.2);
            return{...pl,x:clamp(pl.x+dpx/dist*step+r,isDef?5:40,97),y:clamp(pl.y+dpy/dist*step*0.6+r,3,97)};
          }else{
            const angle=(idx*1.57+Math.random()*0.8);
            const spread=10+Math.random()*10;
            return{...pl,x:clamp(pPos.x+Math.cos(angle)*spread+r,isDef?5:40,97),y:clamp(pPos.y+Math.sin(angle)*spread+r,3,97)};
          }
        }else{
          // Home GK: stays in goal, tracks ball laterally
          if(idx===0){const tyStep=clamp((pPos.y-pl.y)*0.06,-1.5,1.5);return{...pl,x:clamp(pl.x,2,8),y:clamp(pl.y+tyStep,30,70)};}
          const supportX=clamp(pPos.x-(5+Math.random()*15)+r,3,85);
          const supportY=clamp(pPos.y+(Math.random()-0.5)*30+r,3,97);
          return{...pl,x:pl.x+(supportX-pl.x)*0.12,y:pl.y+(supportY-pl.y)*0.08};
        }
      }));
    },pressingMs);
    return()=>clearInterval(iv);
  },[phase,hlIdx,situations,pPos.x,pPos.y,paused]);// eslint-disable-line

  // Formation drift during playing phase — ball-reactive + patrol oscillation
  useEffect(()=>{
    if(phase!=="playing"||paused)return;
    let tick=0;
    const iv=setInterval(()=>{
      tick++;
      const poss=possessionRef.current;
      const ball=ballPosRef.current; // ball.x 0-100 (0=home goal, 100=away goal)
      const T=tick*0.55;
      // depth modulated by opp tactic pressure: high-press = deeper line
      const pressBias=(oppTacticRef.current?.pressure||50)/100*8-4; // -4..+4
      const awayDepth=clamp(62+(poss-50)*0.4+(ball.x-50)*0.25+pressBias,48,92);
      const homeDepth=clamp(38-(poss-50)*0.3-(ball.x-50)*0.18,8,55);
      // lateral anchor: players cluster around ball Y
      const ballY=ball.y;
      setMatchPlayers(prev=>prev.map((pl,idx)=>{
        if(pl.team==="ref")return pl;
        if(pl.team==="away"){
          const ai=idx-10;
          let tx,ty;
          if(ai===0){tx=97;ty=clamp(50+(ballY-50)*0.35,30,70);}
          else if(ai<=4){const off=[-28,-9,9,28][ai-1];tx=awayDepth+4;ty=clamp(ballY+off,8,92);}
          else if(ai<=7){const off=[-18,0,18][ai-5];tx=awayDepth-14;ty=clamp(ballY+off,6,94);}
          else{const off=[-14,14,0][ai-8];tx=awayDepth-30;ty=clamp(ballY+off,5,95);}
          tx+=Math.sin(T+ai*1.7)*5;
          ty+=Math.cos(T*0.9+ai*1.2)*6;
          const va=velRef.current[idx]||{vx:0,vy:0};
          const nvxa=clamp(va.vx*0.70+(tx-pl.x)*0.14,-6,6);
          const nvya=clamp(va.vy*0.70+(ty-pl.y)*0.11,-6,6);
          velRef.current[idx]={vx:nvxa,vy:nvya};
          return{...pl,x:clamp(pl.x+nvxa,44,98),y:clamp(pl.y+nvya,3,97)};
        }else{
          const hi=idx;
          let tx,ty;
          if(hi===0){
            // GK: stays within goal posts (game_y 36-64), minimal lateral tracking
            tx=3;ty=clamp(50+(ballY-50)*0.10,38,62);
          }else{
            if(hi<=4){const off=[-28,-9,9,28][hi-1];tx=homeDepth-4;ty=clamp(ballY+off,8,92);}
            else if(hi<=7){const off=[-18,0,18][hi-5];tx=homeDepth+12;ty=clamp(ballY+off,6,94);}
            else{
              const off=[-14,14,0][hi-8];
              const runBonus=poss>60?clamp((poss-60)*0.5,0,12):0;
              tx=homeDepth+26+runBonus;
              ty=clamp(ballY+off+(poss>60?off>0?6:-6:0),5,95);
            }
            tx+=Math.sin(T*0.85+hi*1.5)*4;
            ty+=Math.cos(T*0.75+hi*1.1)*5;
          }
          const vh=velRef.current[idx]||{vx:0,vy:0};
          const nvxh=clamp(vh.vx*0.70+(tx-pl.x)*0.12,-6,6);
          const nvyh=clamp(vh.vy*0.70+(ty-pl.y)*0.10,-6,6);
          velRef.current[idx]={vx:nvxh,vy:nvyh};
          if(hi===0)return{...pl,x:clamp(pl.x+nvxh,2,12),y:clamp(pl.y+nvyh,33,67)};
          return{...pl,x:clamp(pl.x+nvxh,2,92),y:clamp(pl.y+nvyh,3,97)};
        }
      }));
    },300);
    return()=>clearInterval(iv);
  },[phase,paused]);

  // Flash cleanup
  useEffect(()=>{
    if(!screenFlash)return;
    const t=setTimeout(()=>setScreenFlash(null),screenFlash.dur+100);
    return()=>clearTimeout(t);
  },[screenFlash]);

  useEffect(()=>{
    if(!floatGoal)return;

    return()=>clearTimeout(t);
  },[floatGoal]);

  // Clock — more commentary, possession updates
  useEffect(()=>{
    if(phase!=="playing"||paused)return;
    const iv=setInterval(()=>{
      setClock(c=>{
        const nx=c+1;
        if(nx>=90){setPhase("ended");return 90;}
        if(hlIdx<hlTimes.length&&nx>=hlTimes[hlIdx]){setPhase("hl_intro");return nx;}
        // Commentary ~30% chance per tick (1 every ~3 min average)
        if(Math.random()<0.30){
          const eligible=BG_MATCH.filter(e=>!e.minClock||nx>=e.minClock);
          const ev=wPick(eligible);
          if(ev.ef==="team_goal")setScore(s=>({...s,home:s.home+1}));
          if(ev.ef==="opp_goal"){setScore(s=>({...s,away:s.away+1}));setPossession(p=>clamp(p-4,20,80));setScreenFlash({col:"rgba(239,68,68,0.22)",dur:500});}
          if(ev.poss){
            setPossession(p=>clamp(p+(ev.poss||0),20,80));
            const isHomeGain=ev.poss>0;
            const ball=ballPosRef.current;
            setMatchPlayers(prev=>prev.map((pl,idx)=>{
              if(pl.team==="ref")return pl;
              if(pl.team==="away"){
                const ai=idx-10; // 0=GK,1-4=DEF,5-7=MID,8-10=FWD
                // Away GK: lateral tracking only, stays in goal
                if(ai===0){const tyGk=clamp((ball.y-pl.y)*0.12,-2,2);return{...pl,x:clamp(pl.x,90,98),y:clamp(pl.y+tyGk,30,70)};}
                // when home gains ball, away pushes up to press; when away gains, they advance
                let txBias=isHomeGain?-3:4;
                let tyBias=(ball.y-pl.y)*0.15; // track ball laterally
                if(ai<=4){txBias*=0.7;} // DEF: moderate press
                else if(ai<=7){txBias*=1.0;} // MID: full press
                else{txBias*=1.3;} // FWD: aggressive press
                const jitter=(Math.random()-0.5)*2;
                return{...pl,x:clamp(pl.x+txBias+jitter,44,98),y:clamp(pl.y+tyBias+(Math.random()-0.5)*3,3,97)};
              }else{
                // Home GK: lateral tracking only, stays in goal
                if(idx===0){const tyGk=clamp((ball.y-pl.y)*0.12,-2,2);return{...pl,x:clamp(pl.x,2,8),y:clamp(pl.y+tyGk,30,70)};}
                // home team: when home gains ball, push forward
                const shift=isHomeGain?Math.random()*3+1:-Math.random()*3-1;
                const tyBias=(ball.y-pl.y)*0.1;
                return{...pl,x:clamp(pl.x+shift,2,90),y:clamp(pl.y+tyBias+(Math.random()-0.5)*3,3,97)};
              }
            }));
          }
          if(ev.bpos)setBallPos(ev.bpos);
          if(ev.ms)setMxStats(s=>({shots:s.shots+(ev.ms.shots||0),oppShots:s.oppShots+(ev.ms.oppShots||0),fouls:s.fouls+(ev.ms.fouls||0),corners:s.corners+(ev.ms.corners||0)}));
          if(ev.pd&&DRIFT_PRESETS[ev.pd])driftTargetsRef.current=DRIFT_PRESETS[ev.pd];
          if(ev.ef==="team_goal"||ev.ef==="opp_goal")setWaveEvent({t:Date.now(),home:ev.ef==="team_goal"});
          // Sprint 16+22 — crowd chant triggers with match-state awareness
          const clubShortName=player.club?.a||player.club?.n||player.club?.name||"la squadra";
          const chantFor=(type,dur=2800)=>{const pool=CROWD_CHANTS[type]||CROWD_CHANTS.home;const t=pick(pool);setCrowdChant({text:t.replace(/\[CLUB\]/g,clubShortName),type,key:Date.now()});setTimeout(()=>setCrowdChant(null),dur);};
          if(ev.ef==="team_goal"){
            setTimeout(()=>chantFor("goal",3800),200);
            // If winning or comeback, add extra energy chant
            setScore(prev=>{setTimeout(()=>{if(prev.home>prev.away)chantFor("winning",2400);else if(prev.home<prev.away)chantFor("comeback",2600);},1800);return prev;});
          }else if(ev.ef==="opp_goal"){
            setTimeout(()=>chantFor("danger",2400),200);
            setScore(prev=>{setTimeout(()=>{if(prev.home<prev.away)chantFor("losing",2600);},1200);return prev;});
          }else if(ev.ms?.shots>0&&Math.random()<0.45)chantFor("near_miss",2000);
          else if(ev.ms?.fouls>0&&Math.random()<0.5)chantFor("foul",1800);
          else if(nx>75&&score.home>score.away&&Math.random()<0.12)chantFor("winning",2500);
          else if(nx>75&&score.home<score.away&&Math.random()<0.10)chantFor("comeback",2600);
          else if(Math.random()<0.04)chantFor("home",2500); // ambient home chant ~every 25s
          else if(nx===45)chantFor("half",2000);
          // Sprint 17: momentum swings from BG events
          if(ev.ef==="team_goal")setMomentum(m=>clamp(m+25,0,100));
          else if(ev.ef==="opp_goal")setMomentum(m=>clamp(m-25,0,100));
          else if(ev.ms?.shots>0)setMomentum(m=>clamp(m+4,0,100));
          else if(ev.ms?.oppShots>0)setMomentum(m=>clamp(m-4,0,100));
          // Resolve {H},{H2},{A} name tokens from rosters
          const hAbbr=player.club?.a||player.club?.id?.slice(0,3).toUpperCase()||"HOME";
          const aAbbr=opponent?.a||opponent?.id?.slice(0,3).toUpperCase()||"AWAY";
          const hN=homeRoster[Math.floor(Math.random()*(homeRoster.length-1))].name.split(" ").pop()+" ("+hAbbr+")";
          const hN2=homeRoster[Math.floor(Math.random()*(homeRoster.length-1))].name.split(" ").pop()+" ("+hAbbr+")";
          const aN=awayRoster[Math.floor(Math.random()*awayRoster.length)].name.split(" ").pop()+" ("+aAbbr+")";
          const evTxt=ev.txt.replace(/{H2}/g,hN2).replace(/{H}/g,hN).replace(/{A}/g,aN);
          const cColor=ev.ef==="team_goal"?"#16a34a":ev.ef==="opp_goal"?"#dc2626":TH.faint;
          addCom(evTxt,cColor,nx);
        }
        // Possession drift + momentum drift every ~8 ticks
        if(nx%8===0){
          setPossession(p=>clamp(p+rng(-2,2),20,80));
          setMomentum(m=>clamp(Math.round(m+(50-m)*0.08),0,100));
        }
        // Heat map: sample player position every 4 ticks
        if(nx%4===0){
          heatPointsRef.current.push({x:pPosRef.current.x,y:pPosRef.current.y});
          if(heatPointsRef.current.length>300)heatPointsRef.current.shift();
        }
        return nx;
      });
    },300);
    return()=>clearInterval(iv);
  },[phase,hlIdx,addCom,oppPrestige,player.ovr,paused]);

  // Ball attachment — sync ballPos to pPos during highlight phases so ball stays on player
  useEffect(()=>{
    if(["hl_intro","hl_move","hl_choose","hl_result"].includes(phase)){

    }
  },[pPos.x,pPos.y,phase]);

  // Idle drift — player keeps moving during "playing" phase, formation-aware
  useEffect(()=>{
    if(phase!=="playing"||paused)return;
    const pos=player.position||"ATT";
    const isGK=["POR","GK","Portiere"].includes(pos);
    const isDef=["DC","TD","TS","DEF","Difensore","Terzino"].includes(pos);
    const isMid=["CC","CEN","MED","MID","TC","Centrocampista","Mediano","Trequartista"].includes(pos);
    const iv=setInterval(()=>{
      setPPos(p=>{
        const dt=driftTargetsRef.current;
        let nx,ny;
        if(dt){
          // Protagonist smoothly tracks role-appropriate formation slots each 500ms tick
          // GK→slot 0, DEF→slots 1-4, MID→slots 5-7, ATT→slots 8-9
          const slots=isGK?[0]:isDef?[1,2,3,4]:isMid?[5,6,7]:[8,9];
          const tgX=slots.reduce((s,i)=>s+(dt[i]?.x||50),0)/slots.length;
          const tgY=slots.reduce((s,i)=>s+(dt[i]?.y||50),0)/slots.length;
          // 6% pull per 500ms tick — matches canvas livePos lerp speed
          nx=clamp(p.x+(tgX-p.x)*0.06+rng(-1,1),3,97);
          ny=clamp(p.y+(tgY-p.y)*0.06+rng(-1.5,1.5),3,97);
        }else{
          // No preset yet — fall back to original role-based ranges
          if(isGK){nx=clamp(p.x+rng(-1,1),10,24);ny=clamp(p.y+rng(-1.5,1.5),35,65);}
          else if(isDef){nx=clamp(p.x+rng(-1.5,1.5),18,38);ny=clamp(p.y+rng(-2,2),15,85);}
          else if(isMid){nx=clamp(p.x+rng(-2,2),35,65);ny=clamp(p.y+rng(-2.5,2.5),15,85);}
          else{nx=clamp(p.x+rng(-2,2),52,80);ny=clamp(p.y+rng(-2.5,2.5),15,85);}
        }
        return{x:nx,y:ny};
      });
    },500);
    return()=>clearInterval(iv);
  },[phase,player.position,paused]);// eslint-disable-line

  const selectedActionIdxRef=useRef(0);

  // Movement RAF — keyboard input with movesLeft check, 400ms cooldown per move
  const lastKbdMoveRef=useRef(0);
  useEffect(()=>{
    if(phase!=="hl_move"&&phase!=="hl_choose"){if(moveRef.current)cancelAnimationFrame(moveRef.current);return;}
    const sit=situations[hlIdx];
    const mz=sit?.moveZone||{x:[0,100],y:[0,100]};
    const loop=()=>{
      const k=keysRef.current;let dx=0,dy=0;
      if(k.has("ArrowUp")   ||k.has("w"))dx=+2.5;
      if(k.has("ArrowDown") ||k.has("s"))dx=-2.5;
      if(k.has("ArrowRight")||k.has("d"))dy=+2.5;
      if(k.has("ArrowLeft") ||k.has("a"))dy=-2.5;
      if(!sit?.lockMovement&&(dx||dy)&&(phase==="hl_move"||phase==="hl_choose")){
        const now=Date.now();

          lastKbdMoveRef.current=now;
          setPPos(p=>({x:clamp(p.x+dx,mz.x[0],mz.x[1]),y:clamp(p.y+dy,mz.y[0],mz.y[1])}));

  const handleDPad=(dx,dy)=>{
    if(phase!=="hl_move"&&phase!=="hl_choose")return;

    setDefDist(defDistRef.current);

    const nm=Math.max(0,movesLeftRef.current-1);

    if(phase==="hl_move")setTimeout(()=>setPhase("hl_choose"),200);
  };

  const handleAction=useCallback((action)=>{
    if(phase!=="hl_choose")return;
    const defPenalty=defDistRef.current<25?0.15:defDistRef.current<50?0.08:0;
    // Sprint 16: weather modifier on success rate
    const wef=weather?.ef||{};
    const weatherPenalty=(action.stat==="passaggio"&&wef.pass?(-wef.pass/100):0)+
                         (action.stat==="tiro"&&wef.tiro?(-wef.tiro/100):0)+
                         (action.stat==="velocità"&&wef.spd?(-wef.spd/100):0);
    const rate=Math.max(0.05,succRate(action,player.stats,pPos.x,oppPrestige)/100-defPenalty-weatherPenalty);
    const adapt=adaptiveDifficulty(player);
    const ok=Math.random()<clamp((rate/adapt)+(Math.random()-.5)*.12,0.05,0.72);
    const key=ok?action.rew:action.fail;
    const txt=pick(OUTCOME_TX[key]||["Azione completata."]);
    setEnergy(e=>clamp(e-action.nrg,0,100));
    setMStats(s=>{let{goals,assists,rb}={...s};if(ok){if(key==="goal"){goals++;rb+=5;setScore(sc=>({...sc,home:sc.home+1}));}if(key==="assist"){assists++;rb+=3;setScore(sc=>({...sc,home:sc.home+1}));}if(!["goal","assist"].includes(key))rb+=1;}else{if(key==="goal_against"){rb-=3;setScore(sc=>({...sc,away:sc.away+1}));}if(key==="miss_easy")rb-=2;}return{goals,assists,rb};});
    addCom(txt,ok?"#16a34a":"#dc2626",clock);
    setAiCommentary(null);
    // Visual feedback
    if(ok&&key==="goal"){
      setScreenFlash({col:"rgba(255,255,255,0.45)",dur:400});
      setFloatGoal({text:"⚽ GOL!",col:"#f59e0b",key:Date.now()});
    } else if(ok&&key==="assist"){
      setScreenFlash({col:"rgba(34,197,94,0.3)",dur:350});
      setFloatGoal({text:"🎯 ASSIST!",col:"#22c55e",key:Date.now()});
    } else if(ok&&key==="recovery"){
      setScreenFlash({col:"rgba(59,130,246,0.3)",dur:300});
    } else if(!ok&&(key==="miss_easy"||key==="goal_against")){
      setScreenFlash({col:"rgba(239,68,68,0.35)",dur:400});
    }
    // Particle effect based on action outcome
    const shotActions=["tiro","shot","cross","punizione","rigore","volée","colpo di testa","tiro a giro","tocco sotto"];
    const tackleActions=["tackle","contrasto","intercetta","pressing","anticipo","recupero","scivolata"];
    const isShot=shotActions.some(w=>action.label?.toLowerCase().includes(w));
    const isTackle=tackleActions.some(w=>action.label?.toLowerCase().includes(w));
    if(ok&&key==="goal")setActionEffect({type:"goal",key:Date.now()});
    else if(isShot&&ok)setActionEffect({type:"spark",col:homeKitCol,key:Date.now()});
    else if(isShot&&!ok)setActionEffect({type:"spark",col:"#ef4444",key:Date.now()});
    else if(isTackle)setActionEffect({type:"dust",key:Date.now()});
    setOutcome({text:txt,ok,actionLabel:action.label});setChosenAct(action);
    setMomentum(m=>clamp(m+(ok?10:-8),0,100));
    setPhase("hl_result");
    // Generate AI commentary async (non-blocking)
    generateHighlightCommentary(situations[hlIdx],action,{ok},player.stats,zone).then(c=>{
      if(c?.commentary)setAiCommentary(c);
    });
  },[phase,player.stats,pPos.x,clock,addCom,oppPrestige]);

  const RIGORE_DIRS={tl:"alto sinistra",tc:"alto centro",tr:"alto destra",bl:"basso sinistra",bc:"basso centro",br:"basso destra"};
  const RIGORE_ARROWS={tl:"↖",tc:"⬆",tr:"↗",bl:"↙",bc:"⬇",br:"↘"};
  const RIGORE_LABELS={tl:"Alto SX",tc:"Alto CTR",tr:"Alto DX",bl:"Basso SX",bc:"Basso CTR",br:"Basso DX"};
  const handleRigore=(dir)=>{
    if(phase!=="hl_choose")return;

      setMomentum(m=>clamp(m-15,0,100));

        setMomentum(m=>clamp(m-10,0,100));

    setPhase("hl_result");
  };
  const handleContinue=()=>{const nx=hlIdx+1;if(nx>=numHL){setPhase("ended");}else{setHlIdx(nx);setOutcome(null);setChosenAct(null);setPhase("playing");}};
  const handleEnd=()=>{
    const rbCapped=Math.min(mStats.rb,20);
    const resultBonus=score.home>score.away?0.35:score.home===score.away?0.0:-0.30;
    const raw=clamp(5.8+rbCapped*0.115+resultBonus,4.0,10.0);
    onMatchEnd({goals:mStats.goals,assists:mStats.assists,homeScore:score.home,awayScore:score.away,won:score.home>score.away,drew:score.home===score.away,opponent:opponent?.name||opponent?.n,oppAbbr:opponent?.abbr||opponent?.a,oppCol:opponent?.col||opponent?.c,rating:Math.round(raw*10)/10,context,oppTactic:oppTactic||null,scoutReport:scoutReport||null,homeRoster});
  };

  // Keyboard — direct closure calls; re-registers when phase/hlIdx/situations change.
  // handleAction/handleContinue/handleEnd called via closure (no TDZ: closures resolve
  // variable references at call-time, not at function-creation time).
  useEffect(()=>{
    const sit=situations[hlIdx];
    const onD=e=>{
      keysRef.current.add(e.key);
      // Pause toggle: Escape or P during active match
      if((e.key==="Escape"||e.key==="p"||e.key==="P")&&["playing","hl_intro","hl_move","hl_choose","hl_result"].includes(phase)){
        e.preventDefault();e.stopImmediatePropagation();setPaused(v=>!v);return;
      }
      if(paused)return; // block all other input while paused
      if((phase==="hl_move"||phase==="hl_choose")&&["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d"].includes(e.key))e.preventDefault();
      // In hl_move: 0/1/2/3 skip movement and go straight to action
      if(phase==="hl_move"&&(["0","1","2","3"].includes(e.key)||e.key==="Numpad0")){
        e.preventDefault();
        const idx=e.key==="0"||e.key==="Numpad0"?0:parseInt(e.key)-1;
        if(sit?.actions[idx])pendingActionRef.current=sit.actions[idx];
        setPhase("hl_choose");
        return;
      }
      if(phase==="hl_choose"){
        if(["1","2","3"].includes(e.key)){
          e.preventDefault();
          const idx=parseInt(e.key)-1;
          if(sit?.actions[idx])handleAction(sit.actions[idx]);
          return;
        }
        if(e.key==="0"||e.key==="Numpad0"){
          e.preventDefault();
          if(sit?.actions[0])handleAction(sit.actions[0]);
          return;
        }
        if(e.key==="Enter"||e.key===" "){
          e.preventDefault();
          if(sit?.actions[0])handleAction(sit.actions[0]);
          return;
        }
      }
      if(phase==="hl_intro"&&(e.key===" "||e.key==="Enter")){e.preventDefault();return;}
      if(phase==="hl_result"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();handleContinue();return;}
      if(phase==="ended"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();handleEnd();return;}
      if((phase==="matchday"||phase==="formations")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();setPhase(p=>p==="matchday"?"formations":"walkout");return;}
      if(e.key==="0"||e.key==="Numpad0"){
        e.preventDefault();

    document.addEventListener("keyup",onU);

  },[phase,hlIdx,situations,paused]);// eslint-disable-line

  // Fire pending action when hl_choose becomes active (from 0/1/2/3 in hl_move)

  },[phase,handleAction]);// eslint-disable-line

    if(phase!=="hl_result"||paused)return;
    const t=setTimeout(handleContinue,1000);
    return()=>clearTimeout(t);
  },[phase,hlIdx,paused]);// eslint-disable-line

  // Auto-tackle: if player takes too long in hl_choose, defender steals
  useEffect(()=>{
    if(phase!=="hl_choose"||paused)return;
    const sit=situations[hlIdx];
    if(!sit)return;
    if(sit.lockMovement)return; // no auto-tackle for set pieces (penalty/free kick)
    // Delay scales with defDist: far defender = more time (6-10s), close = less (3-5s)
    const baseDelay=defDistRef.current>60?9000:defDistRef.current>35?6000:4000;
    const t=setTimeout(()=>{
      // Find worst action (lowest success) and fail it — defender tackles
      const actions=sit.actions||[];
      if(!actions.length)return;
      const worst=actions.reduce((a,b)=>succRate(a,player.stats,pPos.x,oppPrestige)<=succRate(b,player.stats,pPos.x,oppPrestige)?a:b);
      const tackleTexts=["Il difensore anticipa e recupera palla.","Intervento difensivo! Palla persa.","Il pressing paga: il difensore chiude l'azione.","Troppo lento — il marcatore intercetta."];
      const txt=pick(tackleTexts);
      addCom(txt,"#f87171",clock);
      setScreenFlash({col:"rgba(239,68,68,0.3)",dur:400});
      setOutcome({text:txt,ok:false,actionLabel:worst.label});
      setChosenAct(worst);
      setPhase("hl_result");
    },baseDelay);
    return()=>clearTimeout(t);
  },[phase,hlIdx,situations,clock,paused]);// eslint-disable-line

  const curSit=situations[hlIdx];
  const winning=score.home>score.away,losing=score.home<score.away;
  const pct=Math.round((clock/90)*100);
  const show3D=["playing","hl_move","hl_choose","hl_result","hl_intro"].includes(phase);
  const matchPhase3D=["walkout","hl_move","hl_choose","hl_result","hl_intro","playing"].includes(phase)?phase:"match";
  // Kit conflict resolution — away team gets alt kit if colors too similar
  const homeKitCol=player.club?.col||player.club?.c||"#22c55e";
  const awayKitCol=resolveKitConflict(homeKitCol,opponent?.col||opponent?.c||"#ef4444");

  return(
    <div style={{width:"100%"}}>
      {phase==="matchday"&&!showScout&&(()=>{
        const mw=context==="trial"?1:calcMatchWeight(player,opponent?.id||opponent?.n,player.standings||[],player.week||1);
        const drby=isDerby(player.club?.id,opponent?.id);
        const isExCl=(player.history||[]).some(h=>h.club===opponent?.n||h.clubId===opponent?.id)||(player.worldMemory||[]).some(m=>m.type==="ex_club"&&m.clubId===opponent?.id);
        const rivalMatch=player.rival&&(player.rival.club?.id===opponent?.id||player.rival.club?.n===opponent?.n);
        const mCtx=drby?`${drby.e} ${drby.name}`:isExCl?"🏠 Ritorno al passato — ex squadra":rivalMatch?`🆚 La squadra di ${player.rival?.name||"il tuo rivale"}`:(mw>=8)?"Partita decisiva per il titolo":(mw>=6)?"Scontro diretto in classifica":null;
        return<MatchdayCard homeTeam={player.club||opponent} awayTeam={opponent} stadium={stadium} attendance={attendance} league={player.club?.lg||(player.club?.isU18||context==="trial"?"Primavera U18":null)} onContinue={handleGoToFormations} onSkip={()=>setPhase("playing")} scoutReport={scoutReport} scoutLoading={scoutLoading} onShowScout={()=>setShowScout(true)} matchWeight={mw} matchContext={mCtx}/>;
      })()}
      {phase==="matchday"&&showScout&&<ScoutReportScreen report={scoutReport} opponent={opponent} loading={scoutLoading} onClose={()=>setShowScout(false)}/>}
      {phase==="formations"&&<FormationView homeTeam={player.club||opponent} awayTeam={opponent} player={player} homeRoster={homeRoster} awayRoster={awayRoster} onContinue={()=>setPhase("walkout")} onSkip={()=>setPhase("playing")} oppTactic={oppTactic} oppTacticLoading={oppTacticLoading} homeKitCol={homeKitCol} awayKitCol={awayKitCol}/>}

      {(show3D||phase==="walkout")&&(
        <Card style={{padding:0,overflow:"hidden",marginBottom:10}} shadow>
          {/* ── Scoreboard Premium ── */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 12px",borderBottom:"1px solid rgba(255,255,255,0.08)",background:"linear-gradient(135deg,#060d1e 0%,#0f1e3a 100%)"}}>

              <TeamBadge team={player.club||opponent} size={28}/>
              <div style={{minWidth:0}}>
                <div style={{fontSize:9,color:"rgba(255,255,255,0.55)",fontWeight:700,letterSpacing:.8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:70}}>{player.club?.n||player.club?.name||"Squadra"}</div>
                <div style={{fontSize:32,fontWeight:900,color:winning?"#4ade80":"#f1f5f9",lineHeight:1}}>{score.home}</div>
              </div>
            </div>
            {/* Centre — clock, possession, context */}
            <div style={{textAlign:"center",flex:"0 0 auto",padding:"0 8px"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5,marginBottom:2}}>
                {phase==="playing"&&!paused&&<div style={{width:6,height:6,borderRadius:"50%",background:"#ef4444",boxShadow:"0 0 6px #ef4444",animation:"pulse 1s infinite",flexShrink:0}}/>}
                {paused&&["playing","hl_intro","hl_move","hl_choose","hl_result"].includes(phase)&&<div style={{width:6,height:6,borderRadius:"50%",background:"#f59e0b",flexShrink:0}}/>}
                <div style={{padding:"2px 10px",borderRadius:14,fontSize:12,fontWeight:900,background:winning?"rgba(34,197,94,0.18)":losing?"rgba(239,68,68,0.18)":"rgba(255,255,255,0.09)",color:winning?"#4ade80":losing?"#f87171":"#f1f5f9",letterSpacing:.5}}>
                  {phase==="walkout"?"🏃":phase==="ended"?"FT":`${clock}'`}
                </div>
                <div style={{fontSize:11}} title={weather?.name}>{weather?.e||(timeOfDay==="day"?"☀️":"🌙")}</div>
                {["playing","hl_intro","hl_move","hl_choose","hl_result"].includes(phase)&&(
                  <button onClick={()=>setPaused(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,padding:"2px 4px",color:"rgba(255,255,255,0.6)",lineHeight:1}} title={paused?"Riprendi (P)":"Pausa (P)"}>

              <div style={{height:5,background:"rgba(255,255,255,0.08)",borderRadius:3,overflow:"hidden",display:"flex",width:80}}>

              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:7,color:"rgba(255,255,255,0.28)",marginTop:2,width:80}}>

              <div style={{height:4,background:"rgba(255,255,255,0.06)",borderRadius:3,overflow:"hidden",display:"flex",width:80,marginTop:4}}>

          {/* ── Field + Panel: responsive layout ── */}

              {phase==="walkout"&&<WalkoutOverlay homeTeam={player.club||opponent} homeRoster={homeRoster} opponent={opponent} isHome={isMatchHome} matchWeek={player.week} onDone={()=>setPhase("playing")} weather={weather}/>}

              {crowdChant&&<div key={crowdChant.key} style={{position:"absolute",bottom:"10%",left:0,right:0,textAlign:"center",fontSize:15,fontWeight:900,color:crowdChant.type==="goal"?"#4ade80":crowdChant.type==="danger"?"#f87171":crowdChant.type==="foul"?"#fb923c":"#f8fafc",textShadow:"0 2px 14px rgba(0,0,0,0.85)",animation:"chantPulse 2.8s ease-out forwards",zIndex:22,pointerEvents:"none",letterSpacing:1,textTransform:"uppercase",padding:"0 12px"}}>{crowdChant.text}</div>}
              {/* Pause overlay */}
              {paused&&["playing","hl_intro","hl_move","hl_choose","hl_result"].includes(phase)&&(
                <div style={{position:"absolute",inset:0,background:"rgba(5,8,20,0.78)",backdropFilter:"blur(4px)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:30,cursor:"pointer"}} onClick={()=>setPaused(false)}>
                  <div style={{fontSize:38,marginBottom:6,filter:"drop-shadow(0 0 16px rgba(245,158,11,0.8))"}}>⏸</div>

                </div>

              {/* HL intro stays on field as cinematic overlay */}
              {phase==="hl_intro"&&curSit&&(
                <div style={{position:"absolute",inset:0,background:"rgba(5,8,20,0.88)",backdropFilter:"blur(6px)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:8,padding:"0 14px",cursor:"pointer"}} onClick={()=>{const mm=situations[hlIdx]?.maxMoves??1;movesLeftRef.current=mm;setMovesLeft(mm);moveCoolRef.current=0;pressureRef.current=1;setPressureBar(1);setPhase("hl_move");}}>
                  <div style={{fontSize:22,marginBottom:8}}>⚽</div>
                  <div style={{fontSize:15,fontWeight:900,color:"#f59e0b",textAlign:"center",marginBottom:8,textShadow:"0 0 20px #f59e0b"}}>{curSit.text}</div>
                  {curSit.intro&&<div style={{fontSize:11,color:"rgba(255,255,255,0.75)",textAlign:"center",fontStyle:"italic",marginBottom:10,lineHeight:1.4}}>{curSit.intro}</div>}
                  <div style={{fontSize:9,color:"rgba(255,255,255,0.3)",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>{curSit.type==="def"?"🛡️ DIFESA":"⚔️ ATTACCO"}</div>
                  <div style={{width:90,height:2,background:"rgba(255,255,255,0.15)",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",background:"#f59e0b",animation:"shrinkBar 2.5s linear forwards"}}/></div>
                  <div style={{fontSize:8,color:"rgba(255,255,255,0.2)",marginTop:6}}>Tocca / Enter per iniziare</div>
                </div>
              )}
              {/* Progress bar inside field bottom */}
              {show3D&&<div style={{position:"absolute",bottom:0,left:0,right:0,height:3,background:"rgba(255,255,255,0.1)"}}>
                <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,"+TH.success+","+TH.warning+")",transition:"width .3s"}}/>
              </div>}

              {/* ── MOBILE ACTION OVERLAY (hl_choose) — bottom-right corner inside canvas ── */}
              {isNarrow&&phase==="hl_choose"&&curSit&&(
                <div style={{position:"absolute",bottom:0,right:0,width:"44%",zIndex:10,
                  background:"rgba(0,0,0,0.22)",
                  padding:"8px 5px 12px",borderTopLeftRadius:12,
                  display:"flex",flexDirection:"column",gap:4}}>
                  <div style={{fontSize:7,color:defDist<25?"#f87171":defDist<50?"#f97316":"#4ade80",fontWeight:700,textAlign:"center",marginBottom:2}}>
                    {defDist<25?"⚠️ addosso":defDist<50?"🏃 pressione":"✓ spazio"}</div>
                  {curSit.text?.includes("RIGORE")?(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4}}>
                      {["tl","tc","tr","bl","bc","br"].map(dir=>(
                        <button key={dir} onClick={()=>handleRigore(dir)}
                          style={{padding:"8px 2px",background:"rgba(0,0,0,0.6)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:7,color:"#fff",cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:2,touchAction:"manipulation"}}>
                          <span style={{fontSize:14}}>{RIGORE_ARROWS[dir]}</span>
                          <span style={{fontSize:7,color:"rgba(255,255,255,0.5)"}}>{RIGORE_LABELS[dir]}</span>
                        </button>
                      ))}
                    </div>
                  ):curSit.actions.map((a,i)=>{
                    const defPenalty=defDist<25?15:defDist<50?8:0;
                    const rate=Math.max(5,succRate(a,player.stats,pPos.x,oppPrestige)-defPenalty);
                    const rc=rate>70?"#4ade80":rate>50?"#f59e0b":"#f87171";
                    const isSel=i===selectedActionIdx;
                    return(
                      <button key={i} onClick={()=>handleAction(a)}
                        style={{padding:"10px 5px",background:isSel?"rgba(37,99,235,0.60)":"rgba(0,0,0,0.45)",
                          border:isSel?"1.5px solid rgba(96,165,250,0.70)":"1px solid rgba(255,255,255,0.18)",
                          borderRadius:8,color:"#fff",cursor:"pointer",fontFamily:"inherit",
                          display:"flex",flexDirection:"column",alignItems:"center",gap:2,width:"100%",
                          touchAction:"manipulation"}}>
                        <div style={{fontSize:9,fontWeight:isSel?700:400,color:"#e2e8f0",textAlign:"center",lineHeight:1.3}}>{a.label}</div>
                        <div style={{fontSize:14,fontWeight:900,color:rc,lineHeight:1}}>{rate}%</div>
                      </button>
                    );
                  })}
                  <div style={{fontSize:7,color:"rgba(255,255,255,0.22)",textAlign:"center"}}>1 · 2 · 3</div>
                </div>
              )}

              {/* ── MOBILE RESULT OVERLAY — bottom-right corner inside canvas ── */}
              {isNarrow&&phase==="hl_result"&&outcome&&(
                <div style={{position:"absolute",bottom:0,right:0,width:"44%",zIndex:10,
                  background:outcome.ok?"rgba(0,30,8,0.55)":"rgba(30,0,0,0.55)",
                  padding:"10px 7px 14px",borderTopLeftRadius:12,
                  display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
                  <div style={{fontSize:16}}>{outcome.ok?"✅":"❌"}</div>
                  <div style={{fontSize:11,fontWeight:900,color:outcome.ok?"#4ade80":"#f87171",textAlign:"center",lineHeight:1.3}}>{chosenAct?.label}</div>
                  <div style={{fontSize:8,color:"rgba(255,255,255,0.70)",textAlign:"center",lineHeight:1.4}}>{outcome.text}</div>
                  <div style={{fontSize:7,color:"rgba(255,255,255,0.22)",textAlign:"center"}}>Enter →</div>
                </div>
              )}
            </div>

            {/* RIGHT: info + action panel */}
            <div style={isNarrow?{position:"absolute",bottom:0,left:0,right:0,zIndex:5,background:"transparent",border:"none"}:{flex:1,display:"flex",flexDirection:"column",background:"#0f172a",borderLeft:"1px solid rgba(255,255,255,0.08)",minWidth:0,overflow:"hidden"}}>

              {/* Action zone — only during HL phases */}
              {(phase==="hl_move"||(phase==="hl_choose"&&movesLeft>0))&&curSit&&(
                <div style={{padding:"8px 10px",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
                  <div style={{color:"#f59e0b",fontSize:10,fontWeight:700,marginBottom:5}}>{clock}' — {curSit.text}</div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                    <DPad onMove={handleDPad} dark size={isNarrow?52:42}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:8,color:"rgba(255,255,255,0.4)",marginBottom:3}}>📍 {ZONES[zone]?.label} · WASD</div>
                      {curSit.maxMoves>0&&<div style={{fontSize:9,color:"#60a5fa",fontWeight:700,marginBottom:3}}>{"●".repeat(movesLeft)}{"○".repeat(Math.max(0,curSit.maxMoves-movesLeft))} {movesLeft} mov</div>}
                      {curSit.maxMoves>0&&(
                        <div style={{marginBottom:4}}>
                          <div style={{display:"flex",justifyContent:"space-between",fontSize:7,color:"rgba(255,255,255,0.3)",marginBottom:2}}><span>⏱ Pressione</span><span>{Math.round(pressureBar*100)}%</span></div>
                          <div style={{height:3,background:"rgba(255,255,255,0.12)",borderRadius:2}}>
