  const[matchIsHome,setMatchIsHome]=useState(true);
  const[lastMatch,setLastMatch]=useState(null);
  const[seasonEndData,setSeasonEndData]=useState(null);
  const[presentationData,setPresentationData]=useState(null);
  // Backward compat: auto-generate missing/stale calendar/standings for old saves
  useEffect(()=>{
    let changed=false;
    let newP={...player};
    const lc=getLeagueClubs(newP);
    // Regenerate standings if missing or league size changed (e.g. after club database expansion)
    if(!newP.standings||newP.standings.length===0||newP.standings.length!==lc.length){
      newP={...newP,standings:initStandings(lc)};
      changed=true;
    }
    if(!newP.calendar||newP.calendar.length===0){
      const seed=(newP.season||1)*777+hashStr(newP.club?.id||newP.club?.n||"u18");
      newP={...newP,calendar:generateSeasonCalendar(newP.club||{id:"u18",n:"U18"},lc,seed)};
      changed=true;
    }
    if(!newP.aiData){
      newP={...newP,aiData:{lastOpponentTactic:null,scoutReports:{},pressReports:{}}};
      changed=true;
    }
    if(!newP.trophies){
      newP={...newP,trophies:[]};
      changed=true;
    }
    if(!('transferListed' in newP)){
      newP={...newP,transferListed:false};
      changed=true;
    }
    if(!('trainedThisWeek' in newP)){
      newP={...newP,trainedThisWeek:false};
      changed=true;
    }
    if(!('seasonObjectives' in newP)){
      newP={...newP,seasonObjectives:generateSeasonObjectives(newP)};
      changed=true;
    }
    if(!('nationalCaps' in newP)){
      newP={...newP,nationalCaps:0,lastNationalSeason:0};
      changed=true;
    }
    if(!('clubPrestigeShifts' in newP)){
      newP={...newP,clubPrestigeShifts:{}};
      changed=true;
    }
    if(!('cup' in newP)){
      newP={...newP,cup:null};
      changed=true;
    }
    if(!('coach' in newP)){
      newP={...newP,coach:{name:"Mister "+pick(COACH_NAMES),style:"Bilanciato",trustMod:0}};
      changed=true;
    }
    if(!('archetype' in newP)){
      newP={...newP,archetype:ARCHETYPES[0]};
      changed=true;
    }
    if(!('goldenBoys' in newP)){
      newP={...newP,goldenBoys:[]};
      changed=true;
    }
    if(!('records' in newP)){
      newP={...newP,records:{topSeasonGoals:0,topSeasonAssists:0,topOvr:newP.ovr||60}};
      changed=true;
    }
    if(!('milestones' in newP)){
      // Pre-populate already-reached milestones to avoid notification spam on old saves
      newP={...newP,milestones:CAREER_MILESTONES.filter(m=>m.check(newP)).map(m=>m.id)};
      changed=true;
    }
    if(!('achievements' in newP)){newP={...newP,achievements:[]};changed=true;}
    if(!('rivalries' in newP)){newP={...newP,rivalries:[]};changed=true;}
    if(!('worldMemory' in newP)){newP={...newP,worldMemory:[]};changed=true;}
    if(!('dreamClub' in newP)){newP={...newP,dreamClub:null};changed=true;}
    // Generate rival when pro and none exists yet
    if(!('rival' in newP)||(newP.proStatus==="pro"&&!newP.rival&&newP.club)){
      newP={...newP,rival:(newP.proStatus==="pro"&&newP.club)?generateRival(newP):null};
      changed=true;
    }
    if(changed){setPlayer(newP);}
  },[]);// eslint-disable-line
  const[darkMode,setDarkMode]=useState(()=>localStorage.getItem("cpm-dark")==="1");
  // Mutate global TH in-place so module-scope components (Card, Btn, StatBar) pick up the theme
  Object.assign(TH,darkMode?TH_DARK:TH_LIGHT_ORIG);
  useEffect(()=>{document.body.style.background=TH.bg;},[darkMode]);
  const[notif,setNotif]=useState(null);
  const[weekEvent,setWeekEvent]=useState(null);
  const[transferOffer,setTransferOffer]=useState(null);
  const[weekLiveModal,setWeekLiveModal]=useState(null);   // {event, changes}
  const[showAdvanceConfirm,setShowAdvanceConfirm]=useState(false);
  const[showMatchPrompt,setShowMatchPrompt]=useState(null); // {md} — pending match prompt
  const[lastSaved,setLastSaved]=useState(null);           // timestamp
  const[nationalCallupData,setNationalCallupData]=useState(null);
  const[retirementData,setRetirementData]=useState(null);
  const[currentMatchDerby,setCurrentMatchDerby]=useState(null);
  const[interviewModal,setInterviewModal]=useState(null); // {q, paper, opponent, matchCtx}
  const[interviewFeedback,setInterviewFeedback]=useState(null); // {tone, label, ef} shown briefly
  const[coachModal,setCoachModal]=useState(null); // {dialogue, chosen} — Parla col Mister

  const notify=(msg,color=TH.primary)=>{setNotif({msg,color});setTimeout(()=>setNotif(null),2800);};

  // Sprint 19 — OVR milestone check (separate useEffect to avoid computing OVR outside setPlayer)
  useEffect(()=>{
    if(!player.ovr||!player.milestones)return;
    const ovrMs=CAREER_MILESTONES.filter(m=>m.id.startsWith("ovr")&&!player.milestones.includes(m.id)&&m.check(player));
    if(ovrMs.length===0)return;
    setPlayer(p=>({...p,milestones:[...(p.milestones||[]),...ovrMs.map(m=>m.id)]}));
    ovrMs.forEach((m,i)=>setTimeout(()=>setNotif({msg:m.txt,color:m.color}),400+i*2200));
  },[player.ovr]);// eslint-disable-line

  // Sprint 15 — apply chosen interview answer to player state
  const applyInterviewAnswer=(ans)=>{
    const ef=ans.ef||{};
    const toneLabel={diplomatico:"🤝 Diplomatico",diretto:"🔥 Diretto",umile:"🙏 Umile"}[ans.tone]||ans.tone;
    setPlayer(p=>({
      ...p,
      morale:clamp((p.morale||70)+(ef.m||0),0,100),
      popularity:clamp((p.popularity||20)+(ef.p||0),0,100),
      coachTrust:clamp((p.coachTrust||60)+(ef.t||0),0,100),
      form:clamp((p.form||70)+(ef.f||0),30,95),
      value:Math.max(0.5,(p.value||0.8)+(ef.v||0)),
      log:[`🎙️ [${ans.tone}] "${ans.txt.substring(0,45)}…"`,...(p.log||[])].slice(0,60),
    }));
    setInterviewFeedback({tone:ans.tone,label:toneLabel,ef});
    setInterviewModal(null);
    setTimeout(()=>setInterviewFeedback(null),2800);
  };

  // global keyboard shortcuts
  useEffect(()=>{
    const onKey=e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")return;
      const inModal=weekLiveModal||showAdvanceConfirm||showMatchPrompt||transferOffer;
      // ESC — close modals / go back
      if(e.key==="Escape"){
        e.preventDefault();
        if(screen==="match"){setScreen("dashboard");setTab("dashboard");}
        else if(screen==="postmatch"){setScreen("dashboard");setTab("dashboard");}
        else if(screen==="press"){setScreen("dashboard");setTab("dashboard");}
        else if(weekLiveModal){setWeekLiveModal(null);}
        else if(showMatchPrompt){setShowMatchPrompt(null);}
        else if(showAdvanceConfirm){setShowAdvanceConfirm(false);}
        else if(transferOffer){setTransferOffer(null);}
        return;
      }
      // Space / Enter — confirm top action
      if(e.key===" "||e.code==="Space"){
        e.preventDefault();
        if(weekLiveModal){setWeekLiveModal(null);}
        else if(showMatchPrompt){setShowMatchPrompt(null);startMatch();}
        else if(showAdvanceConfirm){doAdvanceWeek();}
        else if(screen==="postmatch"){setScreen("dashboard");setTab("dashboard");}
        else if(screen==="press"){setScreen("dashboard");setTab("dashboard");}
        return;
      }
      if(e.key==="Enter"){
        e.preventDefault();
        // Modals take priority
        if(weekLiveModal){setWeekLiveModal(null);return;}
        if(showMatchPrompt){setShowMatchPrompt(null);startMatch();return;}
        if(showAdvanceConfirm){doAdvanceWeek();return;}
        if(transferOffer){acceptTransfer();return;}
        // Screens
        if(screen==="postmatch"){setScreen("dashboard");setTab("dashboard");return;}
        if(screen==="press"){setScreen("dashboard");setTab("dashboard");return;}
        if(screen==="dashboard"){handleContinua();return;}
        return;
      }
      // Number shortcuts — 0 = advance week (with match check)
      if((e.key==="0"||e.code==="Numpad0")&&screen==="dashboard"&&!inModal){
        e.preventDefault();
        const md0=getThisWeekMatchday();
        if(md0&&player.weekLived){setShowMatchPrompt(md0);}else{setShowAdvanceConfirm(true);}
        return;
      }
      // Only process letter shortcuts when no modal and not in match
      if(inModal||screen==="match")return;
      const k=e.key.toUpperCase();
      // Tab shortcuts: 1-5 or letters
      if(k==="P"&&screen==="dashboard"){e.preventDefault();if(getThisWeekMatchday())startMatch();}
      else if(k==="A"&&screen==="dashboard"){e.preventDefault();const mdA=getThisWeekMatchday();if(mdA&&player.weekLived){setShowMatchPrompt(mdA);}else{setShowAdvanceConfirm(true);}}
      else if(k==="S"){e.preventDefault();doSave();}
      else if(k==="T"){e.preventDefault();goTab("training");}
      else if(k==="F"){e.preventDefault();goTab("standings");}
      else if(k==="C"){e.preventDefault();goTab("calendar");}
      else if(k==="R"){e.preventDefault();goTab("profile");}
      else if(k==="M"||k==="H"){e.preventDefault();goTab("dashboard");}
      // Arrow keys for tab switching
      else if(e.key==="ArrowLeft"&&!inModal){
        e.preventDefault();
        const tabs=["dashboard","calendar","standings","training","profile"];
        const cur=tabs.indexOf(tab);if(cur>0)goTab(tabs[cur-1]);
      }else if(e.key==="ArrowRight"&&!inModal){
        e.preventDefault();
        const tabs=["dashboard","calendar","standings","training","profile"];
        const cur=tabs.indexOf(tab);if(cur<tabs.length-1)goTab(tabs[cur+1]);
      }
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[screen,weekLiveModal,showAdvanceConfirm,showMatchPrompt,transferOffer,tab]);// eslint-disable-line

  const [lastPressReport,setLastPressReport]=useState(null);
  const onMatchEnd=result=>{

    // Injury: compute before setPlayer so we can notify after

    setPlayer(p=>{

      const formD=result.won?8:result.drew?2:-5;

  };

  // "Vivi la settimana" — applies events/form changes, does NOT advance week counter

  // advance week: calendar-driven, simulates missed matches; intercepts season end for rich screen

    const weekVal=player.week||1;

    if(!isInU18&&weekVal>38){
      const finalStandings=[...(player.standings||[])].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);

      setPlayer(p=>{

        if(p.rival){

          const lc=getLeagueClubs(p).filter(c=>c.id!==p.club?.id&&c.n!==p.club?.n&&c.id!==r.club?.id);

      {/* STANDINGS */}
      {tab==="standings"&&(()=>{
        const allLeagues=[...new Set(CLUBS.map(c=>c.lg).filter(Boolean))];
        const myLeague=player.club?.lg||(player.proStatus==="u18"?"U18 Primavera":"Serie A");
        const selLg=standingsLg||myLeague;
        const getRows=(lg)=>{
          if(lg===myLeague)return player.standings||[];
          const clubs=CLUBS.filter(c=>c.lg===lg);
          if(!clubs.length)return[];
          const seed=(player.season||1)*1000+hashStr(lg);
          let r=seed;const rand=()=>{r=((r*1664525+1013904223)&0xffffffff)>>>0;return r/0xffffffff;};
          const md=player.matches||10;
          return [...clubs].map(club=>{
            const base=Math.round((club.p||50)/99*md*0.55);
            const wins=clamp(base+Math.round((rand()-0.5)*4),0,md);
            const draws=clamp(Math.round(rand()*2),0,md-wins);
            const losses=Math.max(0,md-wins-draws);
            const gf=wins*2+draws+Math.round(rand()*4);
            const ga=losses*2+draws+Math.round(rand()*4);
            return{id:club.id,n:club.n,a:club.a,abbr:club.a,c:club.c,col:club.c,played:md,wins,draws,losses,gf,ga,gd:gf-ga,pts:wins*3+draws};
          }).sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
        };
        const rows=getRows(selLg);
        const N=rows.length;
        const ZONE_COLORS={cl:"#3b82f6",el:"#f97316",conf:"#22c55e",rel:"#ef4444",champ:"#f59e0b"};
        const zoneOf=(i)=>{if(i===0)return"champ";if(i<4)return"cl";if(i<6)return"el";if(i===6)return"conf";if(i>=N-3&&N>6)return"rel";return null;};

        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <div style={{overflowX:"auto",display:"flex",gap:6,paddingBottom:4}}>
            {allLeagues.map(lg=>(

            ))}
          </div>
          <Card>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>
              Classifica {selLg} — S.{season}{selLg!==myLeague&&<span style={{fontSize:8,color:TH.faint,marginLeft:4}}>(proiezione)</span>}
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead><tr>{["","#","Club","G","V","P","S","Gf","Gs","Diff","Pts"].map(h=><th key={h} style={{textAlign:h==="Club"?"left":"center",padding:"4px 3px",fontSize:9,color:TH.faint,textTransform:"uppercase",letterSpacing:.5,borderBottom:"1px solid "+TH.cardBorder}}>{h}</th>)}</tr></thead>
                <tbody>
                  {rows.map((t,i)=>{
                    const my=selLg===myLeague&&(t.id===player.club?.id||t.n===player.club?.n);
                    const zone=zoneOf(i);
                    const zc=zone?ZONE_COLORS[zone]:null;
                    return<tr key={t.id||t.n} style={{background:my?"#eff6ff":"transparent"}}>
                      <td style={{width:3,padding:0}}><div style={{width:3,height:28,background:zc||"transparent",borderRadius:1}}/></td>
                      <td style={{textAlign:"center",padding:"5px 3px",color:zone?zc:TH.muted,fontWeight:zone?700:400}}>{i+1}</td>
                      <td style={{padding:"5px 3px",fontWeight:my?700:400,color:my?TH.primary:TH.text,whiteSpace:"nowrap"}}><span style={{display:"inline-block",width:9,height:9,borderRadius:"50%",background:t.col||t.c,marginRight:3,verticalAlign:"middle"}}/>{t.abbr||t.a}{my&&" ★"}</td>
                      <td style={{textAlign:"center",padding:"5px 3px",color:TH.muted}}>{t.played}</td>
                      <td style={{textAlign:"center",padding:"5px 3px",color:TH.success}}>{t.wins}</td>
                      <td style={{textAlign:"center",padding:"5px 3px",color:TH.muted}}>{t.draws}</td>
                      <td style={{textAlign:"center",padding:"5px 3px",color:TH.danger}}>{t.losses}</td>
                      <td style={{textAlign:"center",padding:"5px 3px",color:TH.muted}}>{t.gf}</td>
                      <td style={{textAlign:"center",padding:"5px 3px",color:TH.muted}}>{t.ga}</td>
                      <td style={{textAlign:"center",padding:"5px 3px",color:t.gd>0?TH.success:t.gd<0?TH.danger:TH.muted}}>{t.gd>0?"+":""}{t.gd}</td>
                      <td style={{textAlign:"center",padding:"5px 3px",fontWeight:700,color:TH.warning}}>{t.pts}</td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"2px 10px",marginTop:8}}>
              {[["#f59e0b","🏆 Campione"],["#3b82f6","⬆ CL (1-4)"],["#f97316","🟠 EL (5-6)"],["#22c55e","🟢 Conf. (7)"],["#ef4444","⬇ Retrocesse"]].map(([c,l])=>(
                <span key={l} style={{fontSize:8,color:c,fontWeight:600}}>{l}</span>
              ))}
            </div>
          </Card>
        </div>
        );
      })()}

      {/* COPPA — standings tab */}
      {tab==="standings"&&(player.proStatus||"u18")==="pro"&&player.cup&&(
        <Card style={{marginTop:8}}>
          <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>🏆 Coppa Nazionale — S.{season}</div>
          {player.cup.eliminated?(
            <div style={{fontSize:11,color:TH.danger}}>❌ Eliminato al {["","R16","Quarti","Semifinale","Finale"][player.cup.round-1]||`Round ${player.cup.round-1}`}</div>

            <div style={{marginTop:8}}>

      {tab==="training"&&(

          <Card>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Sessione settimanale</div>

                {[
                  {id:"fisico",e:"💪",l:"Fisico",desc:"velocità +, fisico +",fatCost:14,fn:(st)=>({velocità:clamp(st.velocità+rng(1,2),1,99),fisico:clamp(st.fisico+rng(1,2),1,99)})},
                  {id:"tecnico",e:"⚽",l:"Tecnico",desc:"tecnica +, tiro +",fatCost:12,fn:(st)=>({tecnica:clamp(st.tecnica+rng(1,2),1,99),tiro:clamp(st.tiro+rng(1,2),1,99)})},
                  {id:"tattico",e:"🎯",l:"Tattico",desc:"passaggio +, posizionamento +",fatCost:10,fn:(st)=>({passaggio:clamp(st.passaggio+rng(1,2),1,99),posizionamento:clamp(st.posizionamento+rng(1,2),1,99)})},
                  {id:"recupero",e:"🧘",l:"Recupero",desc:"fatica −25, morale +8",fatCost:-25,fn:()=>({})},

              <Card style={{padding:"11px 14px",background:achieved?"linear-gradient(135deg,#78350f,#92400e)":"linear-gradient(135deg,#1e293b,#0f172a)",border:`1px solid ${achieved?"#f59e0b44":"rgba(255,255,255,0.08)"}`}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <TeamBadge team={player.dreamClub} size={36}/>
                  <div style={{flex:1}}>

                  <div style={{fontSize:20}}>{done?"✅":failed?"❌":"🎯"}</div>
                </div>
                {done&&<div style={{marginTop:8,fontSize:12,color:"#16a34a",fontWeight:700}}>{ch.reward} — SFIDA COMPLETATA!</div>}
                {failed&&<div style={{marginTop:8,fontSize:11,color:"#b91c1c"}}>Sfida fallita. Meglio la prossima!</div>}
              </Card>
            );
          })()}
          {/* Sprint 20 — Career card copy button in profile */}
          <Btn onClick={()=>{const txt=buildCareerCard(player);if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>notify("📋 Riepilogo copiato!",TH.success));}else{notify("Clipboard non disponibile",TH.warning);}}} v="ghost" fw style={{padding:"10px",fontSize:12}}>📋 Copia Riepilogo Carriera</Btn>
          <AISettingsCard player={player}/>
        </div>
      )}

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:600,zIndex:100}}>
      <div style={{background:"rgba(240,247,255,0.97)",borderTop:"1px solid "+TH.cardBorder,padding:"2px 8px",display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap",alignItems:"center"}}>
        {[{k:"Enter",l:"Gioca"},{k:"0",l:"Avanza"},{k:"Esc",l:"Indietro"},{k:"Spc",l:"Conferma"}].map(h=>(
          <span key={h.k} style={{fontSize:9,color:TH.muted,display:"flex",alignItems:"center",gap:3}}>
            <span style={{background:"#e2e8f0",borderRadius:3,padding:"1px 5px",fontFamily:"monospace",fontSize:9,color:TH.text}}>{h.k}</span>
            {h.l}
          </span>
        ))}
        {toggleLang&&<button onClick={toggleLang} style={{marginLeft:"auto",fontSize:9,background:"#e2e8f0",border:"none",borderRadius:4,padding:"2px 7px",cursor:"pointer",color:TH.text,fontWeight:700}}>🌐 {lang}</button>}
      </div>
      <div style={{background:TH.navBg,backdropFilter:"blur(12px)",borderTop:"1px solid "+TH.cardBorder,display:"flex",alignItems:"stretch"}}>
        {tabs.map(t=><button key={t.id} onClick={()=>goTab(t.id)} title={`${t.l} [${t.k}]`} style={{flex:1,padding:"10px 4px 6px",border:"none",background:"transparent",cursor:"pointer",fontFamily:"inherit",color:tab===t.id?TH.primary:TH.faint,borderTop:`2px solid ${tab===t.id?TH.primary:"transparent"}`,transition:"all .15s"}}><div style={{fontSize:17}}>{t.e}</div><div style={{fontSize:9,marginTop:1,letterSpacing:.3}}>{t.l}</div><div style={{fontSize:8,color:tab===t.id?TH.primary+"99":TH.faint+"88",marginTop:1,fontFamily:"monospace"}}>[{t.k}]</div></button>)}
        {toggleLang&&<button onClick={toggleLang} title="Cambia lingua / Change language" style={{padding:"6px 10px",border:"none",borderLeft:`1px solid ${TH.cardBorder}`,background:"transparent",cursor:"pointer",fontFamily:"inherit",color:TH.faint,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:1}}><div style={{fontSize:14}}>🌐</div><div style={{fontSize:8,marginTop:1,letterSpacing:.3,fontWeight:700}}>{lang}</div></button>}
      </div>
      </div>{/* end bottom nav wrapper */}
    </div>
  );
}

/* ========================================
   APP ROOT
======================================== */
function App(){
  const[phase,setPhase]=useState("loading");
  const[player,setPlayer]=useState(null);
  const[trials,setTrials]=useState([]);
  const[slots,setSlots]=useState([null,null,null]);
  const[currentSlot,setCurrentSlot]=useState(0);
  const[appMsg,setAppMsg]=useState(null);
  const[lang,setLang]=useState(()=>localStorage.getItem("cpm-lang")||"IT");
  const[legacyBonus,setLegacyBonus]=useState(null);
  const toggleLang=()=>{const nl=lang==="IT"?"EN":"IT";setLang(nl);localStorage.setItem("cpm-lang",nl);const msg=nl==="EN"?"Language: English 🇬🇧":"Lingua: Italiano 🇮🇹";setAppMsg({msg,color:"#2563eb"});setTimeout(()=>setAppMsg(null),2200);};

  const appNotify=(msg,color=TH.danger)=>{setAppMsg({msg,color});setTimeout(()=>setAppMsg(null),3500);};

  const refreshSlots=()=>storage.listSlots().then(s=>setSlots(s));
  useEffect(()=>{refreshSlots().then(()=>setPhase("home"));},[]);// eslint-disable-line

  const loadSave=async(slot=0)=>{
    const d=await storage.load(slot);
    if(d?.player){setPlayer(d.player);setCurrentSlot(slot);setPhase("career");}
    else appNotify("Salvataggio non valido o corrotto.");
  };
  const startNew=(slot=0)=>{setCurrentSlot(slot);setPhase("create");};
  const deleteSlot=async(slot)=>{await storage.del(slot);await refreshSlots();};
  const importSave=(file)=>{
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const d=JSON.parse(e.target.result);
        if(!d?.player?.name)throw new Error();
        const emptySlot=slots.findIndex(s=>!s);
        const slot=emptySlot>=0?emptySlot:0;
        await storage.save({phase:"career",player:d.player},slot);
        await refreshSlots();
        appNotify(`✅ Importato in Slot ${slot+1}`,TH.success);
      }catch{appNotify("File di salvataggio non valido o corrotto.");}
    };
    r.readAsText(file);
  };
  const onCreate=p=>{setPlayer(p);setPhase("trial");};
  const onTrials=r=>{setTrials(r);setPhase("offers");};
  const onChoose=club=>{
    // generate initial calendar + standings when first choosing a club
    const lc=U18_CLUBS;
    const seed=1*777+hashStr(club?.id||club?.n||"u18");
    const calendar=generateSeasonCalendar(club,lc,seed);
    const standings=initStandings(lc);
    const p={...player,club,calendar,standings,log:[`🏟️ Hai scelto ${club.name||club.n}!`]};
    setPlayer(p);setPhase("career");
    storage.save({phase:"career",player:p},currentSlot);
    refreshSlots();
  };
  const wrap=ch=>(
    <div className="cpm-root" style={{minHeight:"100vh",background:TH.bgGrad,color:TH.text,fontFamily:"'Barlow','Segoe UI',sans-serif",position:"relative"}}>
      <div style={{position:"fixed",bottom:6,right:8,zIndex:9999,fontSize:11,color:"#fff",pointerEvents:"none",letterSpacing:"0.05em",fontFamily:"monospace",background:"rgba(0,0,0,0.55)",padding:"2px 7px",borderRadius:6}}>CPM {GAME_VERSION}</div>
      <style>{`
        *{box-sizing:border-box;}
        .cpm-root{padding:12px 8px 100px;}
        @media(min-width:560px){.cpm-root{padding:14px 14px 100px;}}
        @media(min-width:900px){.cpm-root{padding:16px 28px 100px;}}
        @media(min-width:1280px){.cpm-root{padding:18px 48px 100px;}}
        /* Responsive page containers — replaces all fixed maxWidth */
        .cpm-page{width:100%;}
        @media(min-width:900px){.cpm-page{max-width:960px;margin:0 auto;}}
        @media(min-width:1280px){.cpm-page{max-width:1140px;}}
        /* Career main area */
        .cpm-career{width:100%;position:relative;padding-bottom:72px;}
        @media(min-width:900px){.cpm-career{max-width:1140px;margin:0 auto;}}
        /* Dashboard 2-column grid on desktop */
        .cpm-dash-grid{display:flex;flex-direction:column;gap:12px;}
        @media(min-width:900px){.cpm-dash-grid{display:grid;grid-template-columns:1fr 1fr;align-items:start;}}
        /* Offer cards grid */
        .cpm-offers{display:flex;flex-direction:column;gap:10px;}
        @media(min-width:900px){.cpm-offers{display:grid;grid-template-columns:1fr 1fr;}}
        /* ProTransition offers */
        .cpm-proto{display:flex;flex-direction:column;gap:8px;}
        @media(min-width:900px){.cpm-proto{display:grid;grid-template-columns:1fr 1fr;}}
        /* HomeScreen slots */
        .cpm-slots{display:flex;flex-direction:column;gap:8px;}
        @media(min-width:900px){.cpm-slots{display:grid;grid-template-columns:1fr 1fr 1fr;}}
        /* Create screen 2-col on desktop */
        .cpm-create{display:flex;flex-direction:column;gap:16px;}
        @media(min-width:900px){.cpm-create{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:20px;}}
        select option{background:#fff;}
        ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px;}
        button:hover:not(:disabled){filter:brightness(0.96);}
        button:active:not(:disabled){transform:scale(.97);}
        input,select{outline:none;}
        input:focus,select:focus{border-color:${TH.primary}!important;box-shadow:0 0 0 3px ${TH.primary}22!important;}
        /* Keyboard focus indicator — visible for keyboard users, hidden for mouse */
        :focus-visible{outline:2px solid ${TH.primary}!important;outline-offset:2px!important;}
        button:focus-visible{outline:2px solid ${TH.primary}!important;outline-offset:2px!important;}
        /* Shortcut badge */
        .kbd{display:inline-block;padding:1px 5px;border-radius:4px;background:#e2e8f0;color:#475569;font-size:9px;font-family:monospace;font-weight:700;letter-spacing:0.3px;border:1px solid #cbd5e1;}
        @keyframes slideIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
      `}</style>
      <Notif msg={appMsg?.msg} color={appMsg?.color}/>
      {ch}
    </div>
  );
  if(phase==="loading")return wrap(<div style={{textAlign:"center",paddingTop:80,color:TH.faint}}>Caricamento…</div>);
  if(phase==="home")return wrap(<HomeScreen slots={slots} onNew={startNew} onLoad={loadSave} onDelete={deleteSlot} onImport={importSave}/>);
  if(phase==="create")return wrap(<CreateScreen onCreate={onCreate} legacyBonus={legacyBonus} onClearLegacy={()=>setLegacyBonus(null)}/>);
  if(phase==="trial"&&player)return wrap(<TrialFlow player={player} onComplete={onTrials}/>);
  if(phase==="offers"&&player)return wrap(<OffersScreen player={player} trialStats={trials} onChoose={onChoose}/>);
  if(phase==="career"&&player)return wrap(<CareerApp player={player} currentSlot={currentSlot} onRefreshSlots={refreshSlots} lang={lang} toggleLang={toggleLang} onNewGamePlusCB={(bonus)=>{setLegacyBonus(bonus);setPhase("create");}}/>);
  return wrap(<div style={{textAlign:"center",color:TH.faint}}>Stato non riconosciuto.</div>);
}

// S10.4 — Dev 50-season headless simulation (run in browser console: runCPMTest50())
window.runCPMTest50=function(verbose=false){
  let p={name:"TestPlayer",age:17,season:1,week:1,weekLived:false,proStatus:"pro",ovr:70,goals:0,assists:0,matches:0,totalGoals:0,totalAssists:0,totalMatches:0,morale:70,fatigue:0,form:70,popularity:30,coachTrust:60,value:1.2,skillPoints:2,trophies:[],nationalCaps:0,lastNationalSeason:0,clubPrestigeShifts:{},cup:null,contract:{duration:2,wage:800,expiresAtSeason:3},stats:{velocità:72,tecnica:70,fisico:68,mentalità:68,tiro:74,passaggio:65,dribbling:70,posizionamento:70},club:{id:"juve",n:"Juventus",a:"JUV",p:95,c:"#000",c2:"#fff",nat:"🇮🇹",lg:"Serie A"},history:[],matchHistory:[],log:[],seasonObjectives:[],aiData:{pressReports:{},scoutReports:{},lastOpponentTactic:null}};
  const lc=CLUBS.filter(c=>c.lg==="Serie A");
  p.standings=initStandings(lc);p.calendar=generateSeasonCalendar(p.club,lc,p.season*7919);p.seasonObjectives=generateSeasonObjectives(p);
  const anomalies=[];const log=[];
  for(let s=1;s<=50;s++){
    p.season=s;p.week=1;p.goals=0;p.assists=0;p.matches=0;
    for(let w=1;w<=38;w++){
      p.week=w;
      const md=(p.calendar||[]).find(m=>m.week===w&&!m.played);
      if(md){
        const opp=lc.find(c=>c.id===md.opponentId)||lc[0];
        const sim=simulateMatch(p.club,opp,p.ovr,md.isHome);
        p.goals+=sim.won?rng(0,2):0;p.assists+=sim.won&&Math.random()<0.4?1:0;p.matches++;p.totalMatches++;p.totalGoals+=p.goals;
        p.standings=updateStandings(p.standings,p.club?.id,sim,p.clubPrestigeShifts||{});
        p.calendar=p.calendar.map(m=>m.week===w&&!m.played?{...m,played:true,result:sim}:m);
      }
    }
    // Age & decay
    p.age++;
    if(p.age>=28){const physK=['velocità','fisico'];const techK=['tiro','tecnica','dribbling'];const decP=p.age>=35?0.82:p.age>=32?0.62:0.28;if(Math.random()<decP){const dk=p.age>=31?(Math.random()<0.6?pick(physK):pick(techK)):pick(physK);p.stats[dk]=clamp(p.stats[dk]-1,1,99);}}
    p.ovr=calcOvr(p.stats);
    // Checks
    const ovrOK=p.ovr>=1&&p.ovr<=99;const ageOK=p.age<40||p.age>=40;const noNaN=!Object.values(p.stats).some(isNaN);
    const standOK=p.standings?.length===lc.length;
    if(!ovrOK||!noNaN||!standOK)anomalies.push({season:s,age:p.age,ovr:p.ovr,ovrOK,noNaN,standOK});
    if(verbose||s%10===0)log.push({s,age:p.age,ovr:Math.round(p.ovr),goals:p.goals,wage:p.contract?.wage});
    // New season
    const seed=(s+1)*7919+(s+1)*(s+1)*31;
    p.standings=initStandings(lc);p.calendar=generateSeasonCalendar(p.club,lc,seed);
    p.contract={...p.contract,duration:(p.contract?.duration||1)-1};
    if(p.age>=40){log.push({s,msg:"RITIRO CORRETTO a età "+p.age});break;}
  }
  console.log("=== CPM Test 50 Stagioni ===");console.table(log);
  if(anomalies.length)console.warn("ANOMALIE:",anomalies);else console.log("✅ NESSUNA ANOMALIA RILEVATA");
  return{log,anomalies};
};

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
requestAnimationFrame(window._hide);
</script>
