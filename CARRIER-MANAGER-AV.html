    scene.add(new THREE.HemisphereLight(0x88ccff,0x2a5c14,0.28));

    // Field
    const grass=new THREE.Mesh(new THREE.PlaneGeometry(104,68),new THREE.MeshLambertMaterial({color:0x2c6a1d}));grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;scene.add(grass);
    for(let i=0;i<8;i++){const m=new THREE.MeshLambertMaterial({color:i%2?0x2c6a1d:0x357a24});const s=new THREE.Mesh(new THREE.PlaneGeometry(13,68),m);s.rotation.x=-Math.PI/2;s.position.set(-45.5+i*13,0.01,0);scene.add(s);}
    const lM=new THREE.LineBasicMaterial({color:0xffffff,opacity:0.85,transparent:true});
    const ln=pts=>{const g=new THREE.BufferGeometry().setFromPoints(pts.map(([x,z])=>new THREE.Vector3(x,0.02,z)));scene.add(new THREE.Line(g,lM));};
    ln([[-50,-34],[50,-34],[50,34],[-50,34],[-50,-34]]);ln([[0,-34],[0,34]]);
    const cc=[];for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;cc.push([Math.cos(a)*9.15,Math.sin(a)*9.15]);}ln(cc);
    [-1,1].forEach(s=>{const gx=s*50,ix=gx-s*16.5,si=gx-s*5.5;ln([[gx,-20.16],[ix,-20.16],[ix,20.16],[gx,20.16]]);ln([[gx,-9.16],[si,-9.16],[si,9.16],[gx,9.16]]);});
    // Simple stands
    const stM=new THREE.MeshLambertMaterial({color:0x2a3a4a});
    [-38,38].forEach(z=>{const s=new THREE.Mesh(new THREE.BoxGeometry(108,9,9),stM);s.position.set(0,4.5,z);scene.add(s);});
    [-56,56].forEach(x=>{const s=new THREE.Mesh(new THREE.BoxGeometry(18,9,76),stM);s.position.set(x,4.5,0);scene.add(s);});
    // Goals
    const gM=new THREE.MeshLambertMaterial({color:0xf5f5f5});
    [-1,1].forEach(s=>{
      const gg=new THREE.Group();
      [-3.66,3.66].forEach(z=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.10,2.44,8),gM);p.position.set(0,1.22,z);p.castShadow=true;gg.add(p);});
      const cb=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,7.32,8),gM);cb.rotation.z=Math.PI/2;cb.position.y=2.44;gg.add(cb);
      const net=new THREE.Mesh(new THREE.PlaneGeometry(2.8,2.44),new THREE.MeshBasicMaterial({color:0xffffff,opacity:.08,transparent:true,side:THREE.DoubleSide}));net.rotation.y=Math.PI/2;net.position.set(s*1.4,1.22,0);gg.add(net);
      gg.position.x=s*51;scene.add(gg);
    });

    // Player factory — procedural, MeshPhong
    const mkP=(col,isUser=false)=>{
      const g=new THREE.Group();
      const jM=new THREE.MeshPhongMaterial({color:new THREE.Color(col),shininess:55});
      const sM=new THREE.MeshPhongMaterial({color:0x0d1226});
      const skM=new THREE.MeshPhongMaterial({color:0xcfa07a,shininess:18});
      const wh=new THREE.MeshPhongMaterial({color:0xfafafa});
      const bt=new THREE.MeshPhongMaterial({color:0x0a0a0a});
      const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m;};
      add(new THREE.SphereGeometry(0.27,10,7),skM,0,1.93,0);
      const hr=new THREE.Mesh(new THREE.SphereGeometry(0.30,10,6),new THREE.MeshPhongMaterial({color:0x2d1800}));hr.scale.y=0.62;hr.position.set(0,2.03,0);g.add(hr);
      add(new THREE.CylinderGeometry(0.09,0.11,0.13,7),skM,0,1.68,0);
      add(new THREE.CylinderGeometry(0.27,0.31,0.78,10),jM,0,1.22,0);
      add(new THREE.BoxGeometry(0.78,0.14,0.30),jM,0,1.58,0);
      add(new THREE.CylinderGeometry(0.28,0.24,0.28,9),sM,0,0.78,0);
      const mkArm=(sx)=>{const ag=new THREE.Group();ag.position.set(sx*0.45,1.58,0);const u=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.06,0.44,7),jM);u.position.y=-0.22;ag.add(u);const f=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.05,0.36,6),skM);f.position.y=-0.56;ag.add(f);g.add(ag);return ag;};
      const mkLeg=(sx)=>{const lg=new THREE.Group();lg.position.set(sx*0.155,0.78,0);const th=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.086,0.44,8),skM);th.position.y=-0.22;lg.add(th);const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.077,0.066,0.38,8),wh);sh.position.y=-0.57;lg.add(sh);const bk=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.086,0.28),bt);bk.position.set(0,-0.78,0.04);lg.add(bk);g.add(lg);return lg;};
      const aL=mkArm(-1),aR=mkArm(1),lL=mkLeg(-1),lR=mkLeg(1);
      if(isUser){const r=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.055,7,24),new THREE.MeshBasicMaterial({color:0xffd700}));r.rotation.x=Math.PI/2;r.position.y=0.03;g.add(r);}
      g._aL=aL;g._aR=aR;g._lL=lL;g._lR=lR;g._ph=0;
      g.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});
      return g;
    };

    // Formation 4-4-2
    const FA=[
      {r:'GK',x:-47,z:0},{r:'DEF',x:-30,z:-16},{r:'DEF',x:-30,z:-5.5},{r:'DEF',x:-30,z:5.5},{r:'DEF',x:-30,z:16},
      {r:'MID',x:-14,z:-16},{r:'MID',x:-14,z:-5.5},{r:'MID',x:-14,z:5.5},{r:'MID',x:-14,z:16},
      {r:'FWD',x:-4,z:-9},{r:'FWD',x:-4,z:9},
    ];
    const colA=player?.club?.c||'#2563eb',colB=opponent?.c||'#dc2626';
    const PS=[];
    FA.forEach((f,i)=>{
      const isU=(i===9);const mesh=mkP(colA,isU);mesh.position.set(f.x,0,f.z);scene.add(mesh);
      PS.push({pos:new THREE.Vector3(f.x,0,f.z),vel:new THREE.Vector3(),rot:0,team:'A',role:f.r,isU,hasBall:false,fx:f.x,fz:f.z,mesh});
    });
    FA.forEach((f,i)=>{
      const mx=-f.x;const mesh=mkP(colB);mesh.position.set(mx,0,f.z);mesh.rotation.y=Math.PI;scene.add(mesh);
      PS.push({pos:new THREE.Vector3(mx,0,f.z),vel:new THREE.Vector3(),rot:Math.PI,team:'B',role:f.r,isU:false,hasBall:false,fx:mx,fz:f.z,mesh});
    });
    const uP=PS.find(p=>p.isU);

    // Ball
    const bMat=new THREE.MeshPhongMaterial({color:0xfafafa,shininess:90});
    const bMesh=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,9),bMat);bMesh.castShadow=true;scene.add(bMesh);
    [[0,.22,0],[.17,.13,0],[-.17,.13,0],[0,.1,.18],[0,.1,-.18]].forEach(([x,y,z])=>{const pm=new THREE.Mesh(new THREE.SphereGeometry(0.065,6,5),new THREE.MeshPhongMaterial({color:0x111111}));pm.position.set(x,y,z);bMesh.add(pm);});
    const ball={pos:new THREE.Vector3(0,0.22,0),vel:new THREE.Vector3(),owner:PS.indexOf(uP),lastTouch:-1,cd:0};
    uP.hasBall=true;bMesh.position.copy(ball.pos);

    // Input
    const K=keysRef.current;
    const GAME_KEYS=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS','KeyE']);
    const onKD=e=>{K[e.code]=true;if(GAME_KEYS.has(e.code))e.preventDefault();};
    const onKU=e=>{K[e.code]=false;};
    window.addEventListener('keydown',onKD);window.addEventListener('keyup',onKU);
    renderer.domElement.addEventListener('click',()=>renderer.domElement.focus?.());
    renderer.domElement.setAttribute('tabindex','0');

    const G=gmRef.current;
    Object.assign(G,{scoreA:0,scoreB:0,time:0,pGoals:0,pAssists:0,pShots:0,pPasses:0,ended:false});
    const DUR=context==='trial'?210:270;
    const camT=new THREE.Vector3();
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

    const bestPass=(me)=>{let bs=-99,bt=null;PS.forEach(p=>{if(p.team!==me.team||p===me)return;const d=me.pos.distanceTo(p.pos);if(d>40)return;let mo=99;PS.forEach(q=>{if(q.team===me.team)return;const od=q.pos.distanceTo(p.pos);if(od<mo)mo=od;});const sc=mo-d*0.14;if(sc>bs){bs=sc;bt=p;}});return bt;};
    const doShoot=(me,idx)=>{const gx=me.team==='A'?51:-51;ball.vel.set((gx-me.pos.x)*0.44,2.2,-me.pos.z*0.22+(Math.random()-0.5)*1.8);ball.owner=-1;ball.lastTouch=idx;ball.cd=0.35;me.hasBall=false;};
    const doPass=(me,target,idx)=>{const d=new THREE.Vector3().subVectors(target.pos,ball.pos).normalize();ball.vel.copy(d.multiplyScalar(15+(Math.random()-0.5)));ball.owner=-1;ball.lastTouch=idx;ball.cd=0.2;me.hasBall=false;};

    // Pre-calcola i 2 presser più vicini alla palla per ogni squadra
    const pressers={A:new Set(),B:new Set()};
    function calcPressers(){
      ['A','B'].forEach(tm=>{
        pressers[tm].clear();
        const bO=ball.owner>=0?PS[ball.owner]:null;
        const opp=bO&&bO.team!==tm; // pressing when opp has ball
        if(!opp){return;} // don't press when own team has ball
        const dists=[];
        PS.forEach((p,i)=>{if(p.isU||p.team!==tm||p.role==='GK')return;dists.push([p.pos.distanceTo(ball.pos),i]);});
        dists.sort((a,b)=>a[0]-b[0]);
        dists.slice(0,2).forEach(([,i])=>pressers[tm].add(i));
      });
    }

    function aiTick(p,i){
      const oppGx=p.team==='A'?51:-51,myGx=p.team==='A'?-51:51;
      const bO=ball.owner>=0?PS[ball.owner]:null;const myBall=bO&&bO.team===p.team;
      const scoreDiff=p.team==='A'?G.scoreA-G.scoreB:G.scoreB-G.scoreA;
      const pressing=pressers[p.team]&&pressers[p.team].has(i);
      let tx=p.fx,tz=p.fz;
      if(ball.owner===i){
        if(p.role==='GK'){
          const t=bestPass(p);if(t)doPass(p,t,i);
          tx=myGx*0.91;tz=clamp(ball.pos.z*0.18,-4,4);
        } else {
          const dg=Math.abs(p.pos.x-oppGx);
          const shootChance=p.role==='ATT'?0.035:0.022;
          const passChance=0.014+(scoreDiff<0?0.01:0); // passing more when losing
          if(dg<26&&Math.abs(p.pos.z)<20&&Math.random()<shootChance){doShoot(p,i);}
          else if(Math.random()<passChance){const t=bestPass(p);if(t)doPass(p,t,i);}
          else{tx=oppGx;tz=p.pos.z*0.65;}
        }
      } else if(myBall){
        if(p.role==='GK'){tx=myGx*0.88;tz=0;}
        else if(p.role==='DEF'){tx=p.fx*0.80;tz=p.fz;}
        else if(p.role==='MID'){tx=Math.sign(oppGx)*clamp(Math.abs(p.fx)+14,10,42);tz=p.fz;}
        else{// ATT: run deep into opposition half
          tx=Math.sign(oppGx)*clamp(Math.abs(p.fx)+18,18,48);
          tz=p.fz+(Math.random()-0.5)*3; // slight stagger each tick
        }
      } else {
        if(p.role==='GK'){tx=myGx*0.91;tz=clamp(ball.pos.z*0.28,-5,5);}
        else if(pressing){
          // Aggressive: run directly at ball carrier
          tx=bO?bO.pos.x:ball.pos.x;
          tz=bO?bO.pos.z:ball.pos.z;
        } else {
          const bx=clamp(ball.pos.x,-50,50);
          // All non-pressing defenders shift toward ball side tighter
          const pullFactor=scoreDiff<0?0.55:0.42; // press harder when losing
          tx=p.fx+(bx-p.fx)*pullFactor;
          tz=p.fz+ball.pos.z*0.28;
        }
      }
      const toT=new THREE.Vector3(tx-p.pos.x,0,tz-p.pos.z);const td=toT.length();
      if(td>0.5){
        const spd=p.role==='GK'?4:pressing?8:6.5;
        toT.normalize().multiplyScalar(Math.min(spd,td*4));
        p.vel.lerp(toT,pressing?0.22:0.14);
      } else p.vel.multiplyScalar(0.55);
    }

    let animId,lastT=performance.now()/1000,tick=0;

    const resetKO=()=>{
      ball.pos.set(0,0.22,0);ball.vel.set(0,0,0);ball.owner=PS.indexOf(uP);ball.lastTouch=-1;ball.cd=0;
      PS.forEach(p=>{p.pos.set(p.fx,0,p.fz);p.vel.set(0,0,0);p.hasBall=p===uP;p.mesh.position.copy(p.pos);});
      setUi(u=>({...u,scoreA:G.scoreA,scoreB:G.scoreB}));
    };
    const endMatch=()=>{
      const r=clamp(Math.round(50+G.pGoals*15+G.pAssists*8+G.pShots*2+(G.scoreA>G.scoreB?10:0)),30,99);
      setUi(u=>({...u,time:"90'"}));
      setTimeout(()=>onMatchEnd({goals:G.pGoals,assists:G.pAssists,rating:r,shots:G.pShots,passes:G.pPasses,squadAGoals:G.scoreA,squadBGoals:G.scoreB}),1600);
    };

    const animate=()=>{
      animId=requestAnimationFrame(animate);
      const now=performance.now()/1000,dt=clamp(now-lastT,0,0.05);lastT=now;tick++;
      if(G.ended){renderer.render(scene,camera);return;}
      G.time+=dt;if(G.time>=DUR){G.ended=true;endMatch();return;}
      ball.cd=Math.max(0,ball.cd-dt);

      // User input — ISS-style: ↑/W verso porta avversaria, ↓/S indietro, ←/→/A/D laterale
      const dir=new THREE.Vector3();
      const fwd=uP.team==='A'?1:-1;
      if(K['ArrowUp']||K['KeyW'])dir.x+=fwd;if(K['ArrowDown']||K['KeyS'])dir.x-=fwd;
      if(K['ArrowLeft']||K['KeyA'])dir.z-=1;if(K['ArrowRight']||K['KeyD'])dir.z+=1;
      if(dir.lengthSq()>0){dir.normalize();uP.vel.addScaledVector(dir,22*dt);if(uP.vel.length()>7)uP.vel.normalize().multiplyScalar(7);}
      if(K['Space']&&!K._sw){
        if(uP.hasBall){
          const gx=uP.team==='A'?51:-51;
          if(Math.abs(uP.pos.x-gx)<32&&Math.abs(uP.pos.z)<20){G.pShots++;doShoot(uP,PS.indexOf(uP));}
          else{const t=bestPass(uP);if(t){G.pPasses++;doPass(uP,t,PS.indexOf(uP));}}
        }
      }
      K._sw=K['Space'];

      // Players
      calcPressers();
      PS.forEach((p,i)=>{
        if(!p.isU)aiTick(p,i);
        p.vel.multiplyScalar(0.80);
        p.pos.addScaledVector(p.vel,dt);
        p.pos.x=clamp(p.pos.x,-50,50);p.pos.z=clamp(p.pos.z,-33,33);
        // Hard GK zone — never crosses midfield
        if(p.role==='GK'){
          if(p.team==='A'){p.pos.x=clamp(p.pos.x,-50,-22);p.pos.z=clamp(p.pos.z,-10,10);}
          else{p.pos.x=clamp(p.pos.x,22,50);p.pos.z=clamp(p.pos.z,-10,10);}
        }
        const spd=p.vel.length();
        if(spd>0.4){const ta=Math.atan2(p.vel.x,p.vel.z),da=((ta-p.rot+Math.PI*3)%(Math.PI*2))-Math.PI;p.rot+=da*clamp(9*dt,0,1);}
        p.mesh.position.copy(p.pos);p.mesh.rotation.y=p.rot;
        const m=p.mesh;
        if(spd>0.3){m._ph=(m._ph||0)+spd*dt*2.8;const amp=clamp(spd*0.11,0,0.72);m._lL.rotation.x=Math.sin(m._ph)*amp;m._lR.rotation.x=-Math.sin(m._ph)*amp;m._aL.rotation.x=-Math.sin(m._ph)*amp*0.44;m._aR.rotation.x=Math.sin(m._ph)*amp*0.44;}
        else{m._lL.rotation.x*=0.84;m._lR.rotation.x*=0.84;m._aL.rotation.x*=0.84;m._aR.rotation.x*=0.84;}
        if(ball.owner===i){ball.pos.set(p.pos.x+Math.sin(p.rot)*0.46,0.22,p.pos.z+Math.cos(p.rot)*0.46);ball.vel.set(0,0,0);}
      });

      // Ball free physics
      if(ball.owner<0){
        ball.vel.multiplyScalar(0.968);ball.vel.y-=9.8*dt;
        ball.pos.addScaledVector(ball.vel,dt);
        if(ball.pos.y<0.22){ball.pos.y=0.22;ball.vel.y=Math.abs(ball.vel.y)*0.45;if(Math.abs(ball.vel.y)<0.7)ball.vel.y=0;}
        if(Math.abs(ball.pos.z)>33.6){ball.vel.z*=-0.65;ball.pos.z=Math.sign(ball.pos.z)*33.6;}
        if(Math.abs(ball.pos.x)>51&&Math.abs(ball.pos.z)<3.7&&ball.pos.y<2.5){
          const sc=ball.pos.x>0?'A':'B';
          if(sc==='A'){G.scoreA++;if(ball.lastTouch>=0&&PS[ball.lastTouch]?.team==='A'&&PS[ball.lastTouch]?.isU)G.pGoals++;}
          else G.scoreB++;
          resetKO();return;
        }
        PS.forEach((p,i)=>{
          if(ball.owner>=0)return;
          if(ball.cd>0&&i===ball.lastTouch)return;
          if(p.pos.distanceTo(ball.pos)<0.92){ball.owner=i;p.hasBall=true;PS.forEach((q,j)=>{if(j!==i)q.hasBall=false;});}
        });
      }
      bMesh.position.copy(ball.pos);bMesh.rotation.y+=0.07;

      // Camera follow
      // Camera ISS-style: laterale fissa, segue solo X del giocatore
      camT.x+=(uP.pos.x-camT.x)*3*dt;
      camera.position.set(camT.x,30,-55);camera.lookAt(camT.x,0,8);

      // UI tick
      if(tick%28===0){const t90=Math.floor(G.time*90/DUR);setUi({scoreA:G.scoreA,scoreB:G.scoreB,time:t90+"'"});}
      renderer.render(scene,camera);
    };
    animate();

    return()=>{
      G.ended=true;
      window.removeEventListener('keydown',onKD);window.removeEventListener('keyup',onKU);
      cancelAnimationFrame(animId);renderer.dispose();
      if(mount.contains(renderer.domElement))mount.removeChild(renderer.domElement);
    };
  },[]);// eslint-disable-line

  const abbA=player?.club?.a||player?.club?.abbr||'TUA',abbB=opponent?.a||opponent?.abbr||'OPP';
  return(
    <div style={{position:'relative',borderRadius:12,overflow:'hidden',background:'#1b2d45'}}>
      <div ref={mountRef} style={{width:'100%',display:'block'}}/>
      <div style={{position:'absolute',top:0,left:0,right:0,display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 20px',background:'rgba(0,0,0,0.62)',color:'#fff',fontFamily:'monospace',zIndex:1}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:24,height:24,borderRadius:4,background:player?.club?.c||TH.primary}}/>
          <span style={{fontSize:12,opacity:.75}}>{abbA}</span>
          <span style={{fontSize:30,fontWeight:900,color:'#7dd3fc'}}>{ui.scoreA}</span>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:14,fontWeight:700}}>{ui.time}</div>
          <div style={{fontSize:9,color:'#64748b',marginTop:1}}>WASD muovi · SPAZIO passa/tira</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:30,fontWeight:900,color:'#fca5a5'}}>{ui.scoreB}</span>
          <span style={{fontSize:12,opacity:.75}}>{abbB}</span>
          <div style={{width:24,height:24,borderRadius:4,background:opponent?.c||'#dc2626'}}/>
        </div>
      </div>
    </div>
  );
}

/* ========================================
   FOOTBALL MATCH 2D — SENSIBLE SOCCER STYLE
======================================== */
function FootballMatch2D({playerData,squadAColor,squadBColor,duration,testMode,onMatchEnd}){
  const containerRef=React.useRef(null);
  const gameRef=React.useRef(null);
  React.useEffect(()=>{
    if(!containerRef.current||typeof Phaser==='undefined'){
      if(onMatchEnd)setTimeout(()=>onMatchEnd({goals:1,assists:0,rating:6.8,squadAGoals:2,squadBGoals:1,playerGoals:1,playerAssists:0,playerShots:4,playerShotsOnTarget:2,playerPasses:20,playerPassAccuracy:75,playerTackles:2,playerTacklesWon:1,playerIntercepts:0,possessionPercent:52,duration:300,result:'WIN'}),2000);
      return;
    }
    // ── Layout constants (vertical portrait field) ──
    const W=500,H=800;
    const HDR=44,ST=44,COMM=68,CTRL=36;
    const FX=ST,FY=HDR,FW=W-ST*2,FH=H-HDR-COMM-CTRL; // FW=412, FH=652
    const CX=FX+FW/2,CY=FY+FH/2;
    const GOAL_W=90,PLAYER_R=10,BALL_R=6;
    const MATCH_DUR=testMode?180:(duration||300);
    const COL_A=squadAColor||'#0066cc';
    const COL_B=squadBColor||'#cc0000';
    // ny=0→top of field (team A defends), ny=1→bottom (team A attacks)
    const FORM=[
      {role:'GK', nx:0.50,ny:0.06},
      {role:'DEF',nx:0.20,ny:0.21},{role:'DEF',nx:0.40,ny:0.19},{role:'DEF',nx:0.60,ny:0.19},{role:'DEF',nx:0.80,ny:0.21},
      {role:'MID',nx:0.18,ny:0.42},{role:'MID',nx:0.40,ny:0.40},{role:'MID',nx:0.62,ny:0.40},{role:'MID',nx:0.82,ny:0.42},
      {role:'FWD',nx:0.35,ny:0.68},{role:'FWD',nx:0.65,ny:0.68}
    ];
    const mkPos=(mirror)=>FORM.map(p=>({role:p.role,fx:FX+p.nx*FW,fy:FY+(mirror?1-p.ny:p.ny)*FH}));
    const POS_A=mkPos(false),POS_B=mkPos(true);

      drawPlayer(g,p){

      update(time,delta){
        if(this.over)return;
        if(this.goalLock>0){this.goalLock-=delta;return;}
        const dt=Math.min(delta/1000,0.05);
        this.mtime+=dt;
        this.cheerTime=Math.max(0,this.cheerTime-dt);
        if(!this.halfDone&&this.mtime>=MATCH_DUR/2){
          this.halfDone=true;this.resetBall(false);this.addComm('neutral');
        }
        if(this.mtime>=MATCH_DUR){this.doEnd();return;}
        for(const p of this.px){p.tackleCD=Math.max(0,p.tackleCD-dt);p.passCD=Math.max(0,p.passCD-dt);}

        if(this.mode==='narrative'){
          // Auto-sim 2x speed
          if(this.mtime-this.lastCommT>10+Math.random()*8)this.addComm(this.holder?'attack':'neutral');
          for(let s=0;s<2;s++){
            if(this.goalLock>0)break;
            this.doAI(dt/2);this.doPhysics(dt/2);this.updatePoss(dt/2);this.checkGoals();
          }
          this.checkNarrativeKA();
          this.drawNarrative(time);
          this.doUI();
        } else {
          // KEY MOMENT: interactive play
          this.kmTimer-=dt;
          if(this.mtime-this.lastCommT>18+Math.random()*12)this.addComm(this.holder?'attack':'neutral');
          if(this.keyAction){
            this.keyAction.timer-=dt;
            this.drawKeyAction();
            if(Phaser.Input.Keyboard.JustDown(this.k1))this.resolveKeyAction(0);
            else if(Phaser.Input.Keyboard.JustDown(this.k2))this.resolveKeyAction(1);
            else if(Phaser.Input.Keyboard.JustDown(this.k3))this.resolveKeyAction(2);
            else if(this.keyAction.timer<=0)this.resolveKeyAction(1);
            this.doDraw(time);this.doUI();return;
          }
          if(this.kmTimer<=0){this.exitKeyMoment();return;}
          this.checkKeyAction();
          this.autoSwitch();
          this.doInput(dt);
          this.doAI(dt);
          this.doPhysics(dt);
          this.updatePoss(dt);
          this.checkGoals();
          this.doDraw(time);
          this.doUI();
        }
      }
      checkNarrativeKA(){
        if(this.mtime-this.lastKAT<18)return;
        if(!this.holder)return;
        const isAtk=this.holder.team==='A'&&this.by>FY+FH*0.58;
        const isDef=this.holder.team==='B'&&this.by<FY+FH*0.38;
        if(isAtk&&Math.random()<0.024){this.enterKeyMoment(true);return;}
        if(isDef&&Math.random()<0.016){this.enterKeyMoment(false);}
      }
      enterKeyMoment(isAtk){
        this.mode='keymoment';
        this.kmTimer=11;
        this.lastKAT=this.mtime;
        for(const t of this.numTxts)t.setVisible(true);
        this.autoSwitch();

        const bg=this.add.graphics().setDepth(92);
        bg.fillStyle(0x000000,0.65);bg.fillRect(0,0,W,H);
        const msg=isAtk?'⚽  OCCASIONE DA GOL!':'🛡  PERICOLO IN DIFESA!';
        const t1=this.add.text(W/2,CY-18,msg,{fontFamily:'"Courier New",monospace',fontSize:'22px',fontStyle:'bold',color:isAtk?'#ffee00':'#ff4444',stroke:'#000',strokeThickness:5}).setOrigin(0.5).setDepth(93);
        const t2=this.add.text(W/2,CY+16,'Prendi il controllo! WASD + SPAZIO',{fontFamily:'"Courier New",monospace',fontSize:'11px',color:'#e2e8f0',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setDepth(93);
        this.kmFlashObjs=[bg,t1,t2];
        this.time.delayedCall(1100,()=>{this.kmFlashObjs.forEach(o=>o.destroy());this.kmFlashObjs=[];});
      }
      exitKeyMoment(){
        this.mode='narrative';
        this.kmTimer=0;
        for(const t of this.numTxts)t.setVisible(false);
        this.gameGfx.clear();
        this.kaGfx.clear().setAlpha(0);
        this.kaTxts.forEach(t=>{if(t&&t.destroy)t.destroy();});this.kaTxts=[];
        this.keyAction=null;
      }
      drawNarrative(time){
        const g=this.gameGfx;g.clear();
        this.drawCrowd(time);
        const cA=Phaser.Display.Color.HexStringToColor(COL_A).color;
        const cB=Phaser.Display.Color.HexStringToColor(COL_B).color;
        // Zone tint based on ball position
        const atkY=FY+FH*0.62,defY=FY+FH*0.38;
        if(this.by>atkY){
          const zc=this.holder&&this.holder.team==='A'?cA:cB;
          g.fillStyle(zc,0.10);g.fillRect(FX,atkY,FW,FY+FH-atkY);
        } else if(this.by<defY){
          const zc=this.holder&&this.holder.team==='B'?cB:cA;
          g.fillStyle(zc,0.10);g.fillRect(FX,FY,FW,defY-FY);
        }
        // Formation cluster auras
        let axS=0,ayS=0,bxS=0,byS=0,na=0,nb=0;
        for(const p of this.px){if(p.team==='A'){axS+=p.x;ayS+=p.y;na++;}else{bxS+=p.x;byS+=p.y;nb++;}}
        if(na){g.fillStyle(cA,0.08);g.fillCircle(axS/na,ayS/na,58);}
        if(nb){g.fillStyle(cB,0.08);g.fillCircle(bxS/nb,byS/nb,58);}
        // Player dots
        for(const p of this.px){
          const c=p.team==='A'?cA:cB;
          g.fillStyle(c,0.78);g.fillCircle(p.x,p.y,p.role==='GK'?7:5.5);
          if(p.hasBall){g.lineStyle(2.5,0xffee00,0.95);g.strokeCircle(p.x,p.y,9);}
          if(p.isHuman){g.lineStyle(2,0x00ff88,1);g.strokeCircle(p.x,p.y,10);}
        }
        // Ball glow + ball
        const bx=this.bx,by2=this.by;
        const pulse=0.5+0.5*Math.sin(time/180);
        g.fillStyle(0xffffff,0.08+0.07*pulse);g.fillCircle(bx,by2,16+pulse*5);
        g.fillStyle(0xffffff,0.5);g.fillCircle(bx,by2,BALL_R+1);
        g.fillStyle(0xffffff,1);g.fillCircle(bx,by2,BALL_R);
        g.lineStyle(1,0xaaaaaa,0.5);g.strokeCircle(bx,by2,BALL_R);
        // Possession bar
        const pp=this.posA/this.posTotal;
        const bw=240,bbarY=FY+FH+COMM+CTRL/2-4;
        g.fillStyle(0x1a2a1a);g.fillRoundedRect(W/2-bw/2,bbarY,bw,8,4);
        if(pp>0){g.fillStyle(cA);g.fillRoundedRect(W/2-bw/2,bbarY,bw*pp,8,4);}
        if(pp<1){g.fillStyle(cB);g.fillRoundedRect(W/2-bw/2+bw*pp,bbarY,bw*(1-pp),8,4);}
      }
      autoSwitch(){
        if(this.human.hasBall)return;
        let best=this.human,bd=Infinity;
        for(const p of this.px){if(p.team!=='A')continue;const d=Math.hypot(p.x-this.bx,p.y-this.by);if(d<bd){bd=d;best=p;}}
        if(best!==this.human){this.human.isHuman=false;best.isHuman=true;this.human=best;}
      }
      doInput(dt){
        const p=this.human;
        const up=this.kW.isDown||this.kUp.isDown,dn=this.kS.isDown||this.kDn.isDown;
        const lt=this.kA.isDown||this.kLt.isDown,rt=this.kD.isDown||this.kRt.isDown;
        const ACC=750,FRIC=4.5;
        let ax=0,ay=0;if(lt)ax-=ACC;if(rt)ax+=ACC;if(up)ay-=ACC;if(dn)ay+=ACC;
        p.vx+=ax*dt;p.vy+=ay*dt;
        p.vx*=Math.pow(0.01,dt*FRIC);p.vy*=Math.pow(0.01,dt*FRIC);
        this.clampSpd(p);
        if(Phaser.Input.Keyboard.JustDown(this.kSp)){
          const near=Math.hypot(p.x-this.bx,p.y-this.by)<24;
          if(p.hasBall||near){
            if(!p.hasBall){if(this.holder)this.holder.hasBall=false;this.holder=p;p.hasBall=true;}
            const dg=Math.hypot(CX-p.x,(FY+FH)-p.y); // distance to bottom goal
            if(dg<220||p.role==='FWD'){this.doShoot(p,CX,FY+FH,true);}
            else{const tgt=this.bestPass(p);if(tgt)this.doPass(p,tgt,true);else this.doShoot(p,CX,FY+FH,true);}
          }
        }
        if(Phaser.Input.Keyboard.JustDown(this.kE)){
          const opp=this.nearOpp(p,'A');
          if(opp&&Math.hypot(opp.x-p.x,opp.y-p.y)<30){
            this.pstats.tackles++;
            if(Math.random()<0.55){
              this.pstats.tacklesWon++;
              if(opp.hasBall){opp.hasBall=false;this.holder=null;const ang=Math.atan2(p.y-opp.y,p.x-opp.x);this.bvx=Math.cos(ang)*155+p.vx*0.4;this.bvy=Math.sin(ang)*155+p.vy*0.4;}
            }
          }
        }
      }
      doAI(dt){
        const bt=this.holder?this.holder.team:null;
        for(const p of this.px){
          if(p.isHuman)continue;
          const myhb=bt===p.team,ihb=p.hasBall;
          const gy=p.team==='A'?FY+FH:FY; // attacking goal y
          const myGY=p.team==='A'?FY:FY+FH; // own goal y
          if(ihb){
            const dg=Math.hypot(CX-p.x,gy-p.y);
            if(dg<210&&p.passCD<=0&&p.role!=='GK'){this.doShoot(p,CX,gy,false);p.passCD=1.8;}
            else if(p.passCD<=0){
              const tgt=this.bestPass(p);
              if(tgt&&Math.random()<0.65){this.doPass(p,tgt,false);p.passCD=0.7;}
              else{p.tx=CX*0.3+p.x*0.7;p.ty=gy*0.3+p.y*0.7;}
            }
          } else if(myhb){
            if(p.role==='GK'){
              p.ty=myGY+(p.team==='A'?PLAYER_R+5:-(PLAYER_R+5));
              p.tx=CX+(this.bx-CX)*0.28;
              p.tx=Math.max(CX-GOAL_W*0.48,Math.min(CX+GOAL_W*0.48,p.tx));
            } else if(p.role==='DEF'){
              p.tx=p.fx*0.7+this.bx*0.3;p.ty=p.fy*0.6+this.by*0.4;
              if(p.team==='A')p.ty=Math.min(p.ty,CY-12);else p.ty=Math.max(p.ty,CY+12);
            } else if(p.role==='MID'){
              const oy=p.team==='A'?60:-60;
              p.tx=p.fx*0.5+this.bx*0.5;p.ty=this.by+oy*(0.5+Math.random()*0.5);
            } else {
              const ry=p.team==='A'?Math.min(this.by+130,FY+FH-35):Math.max(this.by-130,FY+35);
              p.ty=ry;p.tx=p.fx*0.4+this.bx*0.6;
            }
          } else {
            if(p.role==='GK'){
              p.ty=myGY+(p.team==='A'?PLAYER_R+5:-(PLAYER_R+5));
              p.tx=CX+(this.bx-CX)*0.22;
              p.tx=Math.max(CX-GOAL_W*0.48,Math.min(CX+GOAL_W*0.48,p.tx));
            } else if(p.role==='DEF'){
              const opp=this.nearOpp(p,p.team);
              if(opp){
                const oy2=p.team==='A'?FY+65:FY+FH-65;
                p.tx=opp.x*0.55+p.fx*0.45;p.ty=opp.y*0.5+oy2*0.5;
                if(p.team==='A')p.ty=Math.min(p.ty,CY-5);else p.ty=Math.max(p.ty,CY+5);
              }else{p.tx=p.fx;p.ty=p.fy;}
            } else if(p.role==='MID'){
              const db=Math.hypot(p.x-this.bx,p.y-this.by);
              if(db<200){p.tx=this.bx;p.ty=this.by;}else{p.tx=p.fx;p.ty=p.fy*0.6+this.by*0.4;}
            } else {
              const db=Math.hypot(p.x-this.bx,p.y-this.by);
              if(db<170){p.tx=this.bx;p.ty=this.by;}else{p.tx=p.fx*0.65+this.bx*0.35;p.ty=p.fy*0.65+this.by*0.35;}
            }
          }
          p.tx=Math.max(FX+12,Math.min(FX+FW-12,p.tx));
          p.ty=Math.max(FY+12,Math.min(FY+FH-12,p.ty));
          const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
          const ACC2=560,FRIC2=3.5;
          if(d>4){p.vx+=(dx/d)*ACC2*dt;p.vy+=(dy/d)*ACC2*dt;}
          p.vx*=Math.pow(0.01,dt*FRIC2);p.vy*=Math.pow(0.01,dt*FRIC2);
          this.clampSpd(p);
          if(!myhb&&!ihb&&p.tackleCD<=0&&p.role!=='GK'){
            const opp=this.nearOpp(p,p.team);
            if(opp&&opp.hasBall&&Math.hypot(opp.x-p.x,opp.y-p.y)<27){
              p.tackleCD=2.2;
              if(Math.random()<0.45){opp.hasBall=false;this.holder=null;const ang=Math.atan2(p.y-opp.y,p.x-opp.x);this.bvx=Math.cos(ang)*125+(Math.random()-0.5)*40;this.bvy=Math.sin(ang)*125+(Math.random()-0.5)*40;}
            }
          }
        }
      }
      clampSpd(p){const spd=Math.hypot(p.vx,p.vy);if(spd>p.maxSpd){const r=p.maxSpd/spd;p.vx*=r;p.vy*=r;}}
      bestPass(passer){
        let best=null,bs=-Infinity;
        for(const p of this.px){
          if(p===passer||p.team!==passer.team||p.role==='GK')continue;
          // forward = toward attacking goal (higher y for A, lower y for B)
          const fwd=passer.team==='A'?p.y:(FY+FH-p.y);
          const md=this.nearOppDist(p,passer.team);
          const dist=Math.hypot(p.x-passer.x,p.y-passer.y);
          if(dist>370)continue;
          const score=fwd*0.22+md*1.8-dist*0.08;
          if(score>bs){bs=score;best=p;}
        }
        return best;
      }
      nearOpp(player,ownTeam){
        const ot=ownTeam==='A'?'B':'A';let best=null,bd=Infinity;
        for(const p of this.px){if(p.team!==ot)continue;const d=Math.hypot(p.x-player.x,p.y-player.y);if(d<bd){bd=d;best=p;}}
        return best;
      }
      nearOppDist(player,ownTeam){const o=this.nearOpp(player,ownTeam);return o?Math.hypot(o.x-player.x,o.y-player.y):999;}
      doShoot(player,gx,gy,isHuman){
        if(player.hasBall){player.hasBall=false;this.holder=null;}
        const spread=28,tgx=gx+(Math.random()-0.5)*spread; // horizontal scatter
        const dx=tgx-this.bx,dy=gy-this.by,d=Math.hypot(dx,dy)||1;
        const spd=380+Math.random()*110;
        this.bvx=(dx/d)*spd;this.bvy=(dy/d)*spd;this.lastKick=player;
        if(isHuman){this.pstats.shots++;if(Math.abs(tgx-CX)<GOAL_W/2)this.pstats.shotsOnTarget++;}
        if(isHuman)this.addComm('shot');
      }
      doPass(from,to,isHuman){
        if(from.hasBall){from.hasBall=false;this.holder=null;}
        const dx=to.x-this.bx,dy=to.y-this.by,d=Math.hypot(dx,dy)||1;
        const spd=Math.min(275+d*0.4,475);const acc=0.82+Math.random()*0.35;
        this.bvx=(dx/d)*spd*acc;this.bvy=(dy/d)*spd*acc;this.lastKick=from;
        if(isHuman){this.pstats.passAttempts++;if(Math.random()<0.82)this.pstats.passes++;}
      }
      doPhysics(dt){
        const FRIC=1.2,BOUNCE=0.55;
        for(const p of this.px){
          if(!p.hasBall){p.x+=p.vx*dt;p.y+=p.vy*dt;}
          else{p.x+=p.vx*dt;p.y+=p.vy*dt;const ang=Math.atan2(p.vy||0.001,p.vx||0.001);this.bx=p.x+Math.cos(ang)*(PLAYER_R+BALL_R+1);this.by=p.y+Math.sin(ang)*(PLAYER_R+BALL_R+1);this.bvx=p.vx;this.bvy=p.vy;}
          p.x=Math.max(FX+PLAYER_R,Math.min(FX+FW-PLAYER_R,p.x));
          p.y=Math.max(FY+PLAYER_R,Math.min(FY+FH-PLAYER_R,p.y));
        }
        if(!this.holder){
          this.bx+=this.bvx*dt;this.by+=this.bvy*dt;
          this.bvx*=Math.pow(0.02,dt*FRIC);this.bvy*=Math.pow(0.02,dt*FRIC);
          // Left/right walls: always bounce
          if(this.bx<FX+BALL_R){this.bx=FX+BALL_R;this.bvx=Math.abs(this.bvx)*BOUNCE;}
          if(this.bx>FX+FW-BALL_R){this.bx=FX+FW-BALL_R;this.bvx=-Math.abs(this.bvx)*BOUNCE;}
          // Top (team B attacks here → team B scores) / Bottom (team A attacks → team A scores)
          if(this.by<FY-BALL_R){
            if(this.bx>CX-GOAL_W/2&&this.bx<CX+GOAL_W/2)this.doGoal('B');
            else{this.by=FY+BALL_R+1;this.bvy=Math.abs(this.bvy)*BOUNCE;}
          }
          if(this.by>FY+FH+BALL_R){
            if(this.bx>CX-GOAL_W/2&&this.bx<CX+GOAL_W/2)this.doGoal('A');
            else{this.by=FY+FH-BALL_R-1;this.bvy=-Math.abs(this.bvy)*BOUNCE;}
          }
        }
        for(let i=0;i<this.px.length;i++){
          for(let j=i+1;j<this.px.length;j++){
            const a=this.px[i],b=this.px[j];
            const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy);
            const mn=PLAYER_R*2-1;
            if(dd<mn&&dd>0.01){const push=(mn-dd)*0.42,nx=dx/dd,ny2=dy/dd;a.x-=nx*push;a.y-=ny2*push;b.x+=nx*push;b.y+=ny2*push;}
          }
        }
      }
      updatePoss(dt){
        if(this.holder){if(this.holder.team==='A')this.posA+=dt;else this.posB+=dt;this.posTotal=this.posA+this.posB||1;return;}
        let closest=null,cd=PLAYER_R+BALL_R+4;
        for(const p of this.px){const d=Math.hypot(p.x-this.bx,p.y-this.by);if(d<cd){cd=d;closest=p;}}
        if(closest){
          if(this.holder&&this.holder.team!==closest.team&&closest.team==='A')this.pstats.intercepts++;
          closest.hasBall=true;this.holder=closest;
        }
      }
      checkGoals(){
        if(this.holder||this.goalLock>0)return;
        if(this.by<FY-12&&this.bx>CX-GOAL_W/2&&this.bx<CX+GOAL_W/2)this.doGoal('B');
        if(this.by>FY+FH+12&&this.bx>CX-GOAL_W/2&&this.bx<CX+GOAL_W/2)this.doGoal('A');
      }
      doGoal(team){
        if(this.goalLock>0)return;this.goalLock=1400;
        if(team==='A'){this.scoreA++;if(this.lastKick&&this.lastKick.isHuman)this.pstats.goals++;}
        else this.scoreB++;
        this.cheerTime=6; // crowd cheers for 6 seconds
        this.addComm('goal');
        // Flash white then fade
        this.tweens.add({targets:this.flashGfx,alpha:{from:0.8,to:0},duration:400,ease:'Power2'});
        // GOAL text — Sensible Soccer style: all caps, blocky
        const gcol=team==='A'?COL_A:COL_B;
        const gbg=this.add.graphics().setDepth(98);
        gbg.fillStyle(0x000000,0.78);gbg.fillRect(0,CY-38,W,76);
        const gtxt=this.add.text(W/2,CY,'G O A L !',{
          fontSize:'52px',fontFamily:'"Courier New",monospace',color:gcol,
          fontStyle:'bold',stroke:'#000000',strokeThickness:6
        }).setOrigin(0.5).setDepth(99);
        const gscr=this.add.text(W/2,CY+34,`${this.scoreA}  –  ${this.scoreB}`,{
          fontSize:'22px',fontFamily:'"Courier New",monospace',color:'#ffffff',stroke:'#000',strokeThickness:3
        }).setOrigin(0.5).setDepth(99);
        this.time.delayedCall(1000,()=>{gtxt.destroy();gscr.destroy();gbg.destroy();});
        this.time.delayedCall(900,()=>this.resetBall(true));
      }
      resetBall(resetPlayers){
        for(const p of this.px)p.hasBall=false;this.holder=null;this.lastKick=null;
        this.bx=CX;this.by=CY;
        this.bvx=(Math.random()-0.5)*14;this.bvy=(Math.random()>0.5?1:-1)*24; // mostly vertical
        if(resetPlayers)for(const p of this.px){p.x=p.fx;p.y=p.fy;p.vx=0;p.vy=0;}
      }
      doDraw(time){
        const g=this.gameGfx;g.clear();
        // All players using drawPlayer
        for(const p of this.px)this.drawPlayer(g,p);
        // ── Ball ──
        const bx=this.bx,by=this.by;
        g.fillStyle(0x000000,0.3);g.fillEllipse(bx+1,by+3,13,5);
        g.fillStyle(0xffffff);g.fillCircle(bx,by,BALL_R);
        g.fillStyle(0x111111,0.85);g.fillCircle(bx,by,BALL_R*0.36);
        const pents=[[0,-1],[0.95,-0.31],[0.59,0.81],[-0.59,0.81],[-0.95,-0.31]];
        pents.forEach(([px2,py2])=>{g.fillCircle(bx+px2*BALL_R*0.72,by+py2*BALL_R*0.72,BALL_R*0.24);});
        g.lineStyle(1.2,0x888888,0.6);g.strokeCircle(bx,by,BALL_R);
        // ── Possession bar (bottom controls area) ──
        const pp=this.posA/this.posTotal;
        const bw=240,bbarY=FY+FH+COMM+CTRL/2-4;
        g.fillStyle(0x1a2a1a);g.fillRoundedRect(W/2-bw/2,bbarY,bw,8,4);
        if(pp>0){const ca=Phaser.Display.Color.HexStringToColor(COL_A).color;g.fillStyle(ca);g.fillRoundedRect(W/2-bw/2,bbarY,bw*pp,8,4);}
        if(pp<1){const cb=Phaser.Display.Color.HexStringToColor(COL_B).color;g.fillStyle(cb);g.fillRoundedRect(W/2-bw/2+bw*pp,bbarY,bw*(1-pp),8,4);}
        // Number texts follow players
        for(let i=0;i<this.px.length;i++){
          const p=this.px[i];
          this.numTxts[i].setPosition(p.x+Math.cos(p._la||0)*3,p.y+3);
        }
        // Crowd animation
        this.drawCrowd(time);
      }
      doUI(){
        const m=Math.floor(this.mtime/60),s=Math.floor(this.mtime%60);
        this.timeTxt.setText(`${m}:${s.toString().padStart(2,'0')}`);
        this.scoreTxt.setText(`${this.scoreA}   ${this.scoreB}`);
        const pp=Math.round(this.posA/this.posTotal*100);
        if(this.mode==='narrative'){
          this.humanTxt.setText(`⚙ AUTO  · POSS ${pp}%`);
        } else {
          const rn=this.human.role==='GK'?'GK':this.human.role==='DEF'?'DEF':this.human.role==='MID'?'MID':'FWD';
          const tr=Math.ceil(this.kmTimer);
          this.humanTxt.setText(`▶ #${this.human.num} ${rn}  · ⏱${tr}s`);
        }
        if(this.commLog.length>0)this.commTxt.setText(this.commLog[0]);
        if(this.commLog.length>1)this.commTxt2.setText(this.commLog[1]);
        else this.commTxt2.setText('');
      }
      doEnd(){
        if(this.over)return;this.over=true;
        const result=this.scoreA>this.scoreB?'WIN':this.scoreA<this.scoreB?'LOSS':'DRAW';
        const pp=(this.posA/this.posTotal*100).toFixed(1);
        const pa=this.pstats.passAttempts>0?(this.pstats.passes/this.pstats.passAttempts*100).toFixed(1):'0';
        const rating=parseFloat(Math.max(5,Math.min(10,6+this.pstats.goals*0.6+this.pstats.assists*0.3+(result==='WIN'?0.5:result==='LOSS'?-0.3:0))).toFixed(1));
        const stats={squadAGoals:this.scoreA,squadBGoals:this.scoreB,playerGoals:this.pstats.goals,playerAssists:this.pstats.assists,playerShots:this.pstats.shots,playerShotsOnTarget:this.pstats.shotsOnTarget,playerPasses:this.pstats.passes,playerPassAccuracy:parseFloat(pa),playerTackles:this.pstats.tackles,playerTacklesWon:this.pstats.tacklesWon,playerIntercepts:this.pstats.intercepts,possessionPercent:parseFloat(pp),duration:MATCH_DUR,result,goals:this.pstats.goals,assists:this.pstats.assists,rating};
        const cb=this.registry.get('onMatchEnd');
        if(cb)setTimeout(()=>cb(stats),600);
      }
    }

    const config={type:Phaser.AUTO,width:W,height:H,parent:containerRef.current,backgroundColor:'#0d1117',scene:FMatch,audio:{noAudio:true},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:W,height:H}};
    const game=new Phaser.Game(config);
    gameRef.current=game;
    game.registry.set('onMatchEnd',onMatchEnd||function(){});
    return()=>{if(gameRef.current){gameRef.current.destroy(true);gameRef.current=null;}};
  },[]);// eslint-disable-line

  return <div ref={containerRef} style={{width:'100%',maxWidth:500,margin:'0 auto',borderRadius:8,overflow:'hidden',background:'#0a0f1a'}}/>;
}

function TrialFlow({player:initPlayer,onComplete}){
  const[player,setPlayer]=useState(initPlayer),[trialNum,setTrialNum]=useState(0),[results,setResults]=useState([]),[phase,setPhase]=useState("pre");
  const opp={id:"trial",n:"Selezione Regionale",name:"Selezione Regionale",a:"REG",abbr:"REG",p:52,c:"#64748b",col:"#64748b",c2:"#fff",nat:"🇮🇹"};
  const onMatchEnd=r=>{const res={goals:r.goals,assists:r.assists,rating:r.rating};const nr=[...results,res];setResults(nr);setPlayer(p=>({...p,totalGoals:(p.totalGoals||0)+r.goals,totalAssists:(p.totalAssists||0)+r.assists,totalMatches:(p.totalMatches||0)+1}));setPhase("post");if(trialNum>=2)setTimeout(()=>onComplete(nr),300);};
  useEffect(()=>{
    if(phase==="match")return;
    const h=e=>{
      if(e.key!=="Enter"&&e.key!==" ")return;
      if(e.target.tagName==="INPUT"||e.target.tagName==="BUTTON")return;
      e.preventDefault();
      if(phase==="pre"){setPhase("match");}
      else if(phase==="post"){const done=trialNum>=2;if(!done){setTrialNum(n=>n+1);setPhase("pre");}}
    };
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[phase,trialNum]);// eslint-disable-line
  if(phase==="match")return<div style={{width:"100%"}}><div style={{textAlign:"center",marginBottom:8}}><div style={{display:"inline-block",padding:"4px 16px",borderRadius:20,background:"#eff6ff",border:"1px solid #bfdbfe",fontSize:11,color:TH.primary,fontWeight:700}}>🎯 PROVINO {trialNum+1}/3</div></div><LiveMatch player={player} opponent={opp} context="trial" onMatchEnd={onMatchEnd}/></div>;
  if(phase==="post"){const last=results[results.length-1],done=trialNum>=2;return <div style={{width:"100%"}}><Card style={{textAlign:"center",padding:"22px",maxWidth:520,margin:"0 auto"}}><div style={{fontSize:10,color:TH.warning,letterSpacing:2,marginBottom:8}}>PROVINO {trialNum+1} COMPLETATO</div><div style={{display:"flex",justifyContent:"center",gap:18,marginBottom:14,fontSize:16}}><span>⚽<strong>{last.goals}</strong></span><span>🎯<strong>{last.assists}</strong></span><span>⭐<strong style={{color:TH.warning}}>{last.rating}</strong></span></div>{done?<div style={{color:TH.success,fontSize:12,marginBottom:14}}>✅ Provini completati!</div>:<div style={{color:TH.muted,fontSize:12,marginBottom:14}}>Provino {trialNum+2}/3 in arrivo. <span style={{color:TH.faint}}>[Enter]</span></div>}<Btn onClick={done?()=>{}:()=>{setTrialNum(n=>n+1);setPhase("pre");}} v={done?"success":"primary"} fw style={{padding:"12px"}}>{done?"⏳ Calcolo offerte...":` Provino ${trialNum+2} →`}</Btn></Card></div>;}
  return <div style={{width:"100%",textAlign:"center"}}><div style={{marginBottom:22}}><div style={{fontSize:10,color:TH.warning,letterSpacing:2,marginBottom:8}}>PROVINO {trialNum+1} DI 3</div><div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:14}}>{[0,1,2].map(i=><div key={i} style={{width:30,height:30,borderRadius:"50%",background:i<trialNum?TH.success:i===trialNum?TH.warning:"#e2e8f0",border:`2px solid ${i<trialNum?TH.success:i===trialNum?TH.warning:"transparent"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:i<=trialNum?"#fff":TH.faint}}>{i<trialNum?"✓":i+1}</div>)}</div><h2 style={{fontSize:18,fontWeight:900,margin:"0 0 6px",color:TH.text}}>Provino vs {opp.n}</h2><p style={{color:TH.muted,fontSize:12}}>{trialNum>0?`Hai già segnato ${results.reduce((a,r)=>a+r.goals,0)} gol.`:"Mostra le tue qualità."}</p></div><Btn onClick={()=>setPhase("match")} fw style={{padding:"14px",fontSize:15}}>⚡ Inizia il provino <span style={{opacity:0.6,fontSize:12}}>[Enter]</span></Btn></div>;
}

/* ========================================
   CAREER APP  (req #9,#10,#12,#13,#14)
======================================== */
function CareerApp({player:init,currentSlot=0,onRefreshSlots}){
  const[player,setPlayer]=useState(init);
  const[tab,setTab]=useState("dashboard");
  const[screen,setScreen]=useState("dashboard");
  const[matchOpp,setMatchOpp]=useState(null);
  const[lastMatch,setLastMatch]=useState(null);
  // Backward compat: auto-generate missing/stale calendar/standings for old saves
  useEffect(()=>{
    let changed=false;
    let newP={...player};
    const lc=getLeagueClubs(newP);
    // Regenerate standings if missing or league size changed (e.g. after club database expansion)
    if(!newP.standings||newP.standings.length===0||newP.standings.length!==lc.length){
      newP={...newP,standings:initStandings(lc)};
      changed=true;
    }
    if(!newP.calendar||newP.calendar.length===0){
      const seed=(newP.season||1)*777+hashStr(newP.club?.id||newP.club?.n||"u18");
      newP={...newP,calendar:generateSeasonCalendar(newP.club||{id:"u18",n:"U18"},lc,seed)};
      changed=true;
    }
    if(!newP.aiData){
      newP={...newP,aiData:{lastOpponentTactic:null,scoutReports:{},pressReports:{}}};
      changed=true;
    }
    if(changed){setPlayer(newP);}
  },[]);// eslint-disable-line
  const[notif,setNotif]=useState(null);
  const[weekEvent,setWeekEvent]=useState(null);
  const[transferOffer,setTransferOffer]=useState(null);
  const[weekLiveModal,setWeekLiveModal]=useState(null);   // {event, changes}
  const[showAdvanceConfirm,setShowAdvanceConfirm]=useState(false);
  const[showMatchPrompt,setShowMatchPrompt]=useState(null); // {md} — pending match prompt
  const[lastSaved,setLastSaved]=useState(null);           // timestamp

  const notify=(msg,color=TH.primary)=>{setNotif({msg,color});setTimeout(()=>setNotif(null),2800);};

  // global keyboard shortcuts
  useEffect(()=>{
    const onKey=e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")return;
      const inModal=weekLiveModal||showAdvanceConfirm||showMatchPrompt||transferOffer;
      // ESC — close modals / go back
      if(e.key==="Escape"){
        e.preventDefault();
        if(screen==="match"){setScreen("dashboard");setTab("dashboard");}
        else if(screen==="postmatch"){setScreen("dashboard");setTab("dashboard");}
        else if(screen==="press"){setScreen("dashboard");setTab("dashboard");}
        else if(weekLiveModal){setWeekLiveModal(null);}
        else if(showMatchPrompt){setShowMatchPrompt(null);}
        else if(showAdvanceConfirm){setShowAdvanceConfirm(false);}
        else if(transferOffer){setTransferOffer(null);}
        return;
      }
      // Space / Enter — confirm top action
      if(e.key===" "||e.code==="Space"){
        e.preventDefault();
        if(weekLiveModal){setWeekLiveModal(null);}
        else if(showMatchPrompt){setShowMatchPrompt(null);startMatch();}
        else if(showAdvanceConfirm){doAdvanceWeek();}
        else if(screen==="postmatch"){setScreen("dashboard");setTab("dashboard");}
        else if(screen==="press"){setScreen("dashboard");setTab("dashboard");}
        return;
      }
      if(e.key==="Enter"){
        e.preventDefault();
        // Modals take priority
        if(weekLiveModal){setWeekLiveModal(null);return;}
        if(showMatchPrompt){setShowMatchPrompt(null);startMatch();return;}
        if(showAdvanceConfirm){doAdvanceWeek();return;}
        if(transferOffer){acceptTransfer();return;}
        // Screens
        if(screen==="postmatch"){setScreen("dashboard");setTab("dashboard");return;}
        if(screen==="press"){setScreen("dashboard");setTab("dashboard");return;}
        if(screen==="dashboard"){handleContinua();return;}
        return;
      }
      // Number shortcuts — 0 = advance week (with match check)
      if((e.key==="0"||e.code==="Numpad0")&&screen==="dashboard"&&!inModal){
        e.preventDefault();
        const md0=getThisWeekMatchday();
        if(md0&&player.weekLived){setShowMatchPrompt(md0);}else{setShowAdvanceConfirm(true);}
        return;
      }
      // Only process letter shortcuts when no modal and not in match
      if(inModal||screen==="match")return;
      const k=e.key.toUpperCase();
      // Tab shortcuts: 1-5 or letters
      if(k==="P"&&screen==="dashboard"){e.preventDefault();if(getThisWeekMatchday())startMatch();}
      else if(k==="A"&&screen==="dashboard"){e.preventDefault();const mdA=getThisWeekMatchday();if(mdA&&player.weekLived){setShowMatchPrompt(mdA);}else{setShowAdvanceConfirm(true);}}
      else if(k==="S"){e.preventDefault();doSave();}
      else if(k==="T"){e.preventDefault();goTab("training");}
      else if(k==="F"){e.preventDefault();goTab("standings");}
      else if(k==="C"){e.preventDefault();goTab("calendar");}
      else if(k==="R"){e.preventDefault();goTab("profile");}
      else if(k==="M"||k==="H"){e.preventDefault();goTab("dashboard");}
      // Arrow keys for tab switching
      else if(e.key==="ArrowLeft"&&!inModal){
        e.preventDefault();
        const tabs=["dashboard","calendar","standings","training","profile"];
        const cur=tabs.indexOf(tab);if(cur>0)goTab(tabs[cur-1]);
      }else if(e.key==="ArrowRight"&&!inModal){
        e.preventDefault();
        const tabs=["dashboard","calendar","standings","training","profile"];
        const cur=tabs.indexOf(tab);if(cur<tabs.length-1)goTab(tabs[cur+1]);
      }
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[screen,weekLiveModal,showAdvanceConfirm,showMatchPrompt,transferOffer,tab]);// eslint-disable-line

  // Autosave — debounced 600ms to avoid redundant writes during rapid state updates
  const saveTimerRef=useRef(null);
  useEffect(()=>{
    if(saveTimerRef.current)clearTimeout(saveTimerRef.current);
    saveTimerRef.current=setTimeout(()=>{
      storage.save({phase:"career",player},currentSlot).then(ok=>{if(ok)setLastSaved(Date.now());});
    },600);
    return()=>{if(saveTimerRef.current)clearTimeout(saveTimerRef.current);};
  },[player]);// eslint-disable-line

  // Manual save
  const doSave=useCallback(async()=>{
    const ok=await storage.save({phase:"career",player},currentSlot);
    if(ok){setLastSaved(Date.now());notify("💾 Carriera salvata!",TH.success);if(onRefreshSlots)onRefreshSlots();}
    else notify("⚠️ Errore nel salvataggio.",TH.danger);
  },[player,currentSlot,onRefreshSlots]);// eslint-disable-line

  // Export to JSON
  const exportSave=()=>{
    const data={phase:"career",player,savedAt:Date.now(),saveVersion:SAVE_VERSION};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;
    a.download=`cpm-${player.name.replace(/\s/g,"-")}-S${player.season||1}.json`;
    a.click();URL.revokeObjectURL(url);
    notify("📁 File esportato!",TH.success);
  };

  const goTab=t=>{setTab(t);setScreen(t);};
  // only allow playing if current week has a scheduled match
  const getThisWeekMatchday=()=>{
    const cal=player.calendar||[];
    return cal.find(md=>md.week===(player.week||1)&&!md.played)||null;
  };
  const startMatch=()=>{
    if(player.injured){notify("Sei infortunato!",TH.danger);return;}
    const md=getThisWeekMatchday();
    if(!md){notify("Nessuna partita programmata questa settimana.",TH.warning);return;}
    const lc=getLeagueClubs(player);
    const opp=lc.find(c=>c.id===md.opponentId)||lc.find(c=>c.n===md.opponentName)||pick(lc.filter(c=>c.id!==player.club?.id&&c.n!==player.club?.n));
    if(!opp){notify("Nessun avversario disponibile.",TH.danger);return;}
    setMatchOpp(opp);setScreen("match");
  };

  // Anti-double-click / rapid-Enter guard
  const continuaBusyRef=useRef(false);

  // Smart "Continua" CTA — next logical step in the weekly flow
  // IMPORTANT: always shows match prompt when a pending match exists — never bypasses it
  const handleContinua=()=>{
    if(continuaBusyRef.current)return; // debounce rapid keypresses
    if(player.injured){notify("Sei infortunato — recupera prima di procedere.",TH.danger);return;}
    continuaBusyRef.current=true;
    setTimeout(()=>{continuaBusyRef.current=false;},600); // unlock after 600ms
    if(!player.weekLived){liveCurrentWeek();return;}
    const md=getThisWeekMatchday();
    if(md){setShowMatchPrompt(md);return;} // always ask: Gioca / Simula / Annulla
    doAdvanceWeek();
  };

  // Simulate current week's match then advance
  const simulateAndAdvance=()=>{
    setShowMatchPrompt(null);
    setPlayer(p=>{
      const md2=(p.calendar||[]).find(m=>m.week===(p.week||1)&&!m.played);
      if(!md2){return{...p,week:(p.week||1)+1,weekLived:false};}
      const lc=getLeagueClubs(p);
      const opp=lc.find(c=>c.id===md2.opponentId)||lc.find(c=>c.n===md2.opponentName)||pick(lc.filter(c=>c.id!==p.club?.id));
      if(!opp){return{...p,week:(p.week||1)+1,weekLived:false};}
      const sim=simulateMatch(p.club,opp,p.ovr||65,md2.isHome);
      const clubId=p.club?.id||p.club?.n;
      const newSt=updateStandings(p.standings||initStandings(lc),clubId,sim);
      const newCal=(p.calendar||[]).map(m=>m.week===(p.week||1)&&!m.played?{...m,played:true,result:{homeScore:sim.homeScore,awayScore:sim.awayScore,won:sim.won,drew:sim.drew},simulated:true}:m);
      const newHistory=[...(p.matchHistory||[]),{week:p.week||1,opponent:opp.n,oppAbbr:opp.a,oppCol:opp.c,homeScore:sim.homeScore,awayScore:sim.awayScore,goals:0,assists:0,rating:sim.rating,won:sim.won,drew:sim.drew,simulated:true}].slice(-200);
      const moD=sim.won?3:sim.drew?1:-2;
      notify(`Simulazione: ${sim.homeScore}–${sim.awayScore} vs ${opp.n}`,sim.won?TH.success:sim.drew?TH.warning:TH.danger);
      return{...p,standings:newSt,calendar:newCal,matchHistory:newHistory,matches:(p.matches||0)+1,morale:clamp(p.morale+moD,0,100),week:(p.week||1)+1,weekLived:false};
    });
  };

  const getContinuaState=()=>{
    if(player.injured)return{label:"🩹 Infortunato",sub:"recupero in corso",color:"#dc2626",disabled:true};
    if(!player.weekLived)return{label:"⚡ Vivi la Settimana",sub:"allenamento, eventi e crescita",color:TH.primary,disabled:false};
    const md=getThisWeekMatchday();
    if(md)return{label:`⚽ Gioca vs ${md.opponentName}`,sub:`${md.isHome?"🏟️ Casa":"✈️ Trasferta"} · W.${md.week}`,color:"#16a34a",disabled:false};
    return{label:"⏭️ Avanza Settimana",sub:`W.${player.week||1} → W.${(player.week||1)+1}`,color:TH.primary,disabled:false};
  };

  const [lastPressReport,setLastPressReport]=useState(null);
  const onMatchEnd=result=>{
    setLastMatch(result);
    // Generate press analysis async (non-blocking)
    generatePressAnalysis(result,{name:player.name,club:player.club?.n||player.club?.name||"–",goals:result.goals,assists:result.assists,rating:result.rating,oppPrestige:player.standings?undefined:(result.oppPrestige||65)}).then(press=>{
      setLastPressReport(press);
      setPlayer(p=>{
        const matchdayId=`S${p.season||1}W${p.week||1}`;
        const newAiData={...( p.aiData||{lastOpponentTactic:null,scoutReports:{},pressReports:{}}),pressReports:{...(p.aiData?.pressReports||{}),[matchdayId]:press}};
        return{...p,aiData:newAiData};
      });
    });
    setPlayer(p=>{
      let ns={...p.stats};
      if(Math.random()<.3&&p.age<22){const k=pick(Object.keys(p.stats));ns={...ns,[k]:clamp(p.stats[k]+1,1,99)};}
      if(result.goals>1&&Math.random()<.5)ns={...ns,tiro:clamp(ns.tiro+1,1,99)};
      if(result.assists>0&&Math.random()<.4)ns={...ns,passaggio:clamp(ns.passaggio+1,1,99)};
      const newOvr=calcOvr(ns);
      const moD=result.won?6:result.drew?2:-4;
      const logE=`⚽ vs ${result.opponent} (${result.homeScore}-${result.awayScore}) | ${result.goals}⚽ ${result.assists}🎯 | ${result.rating}★`;
      const newHistory=[...(p.matchHistory||[]),{week:p.week||1,opponent:result.opponent,oppAbbr:result.oppAbbr,oppCol:result.oppCol,homeScore:result.homeScore,awayScore:result.awayScore,goals:result.goals,assists:result.assists,rating:result.rating,won:result.won,drew:result.drew}].slice(-200);
      // update standings with player result + simulate other matches
      const clubId=p.club?.id||p.club?.n;
      const newStandings=updateStandings(p.standings||initStandings(getLeagueClubs(p)),clubId,result);
      // mark calendar entry as played
      const newCal=(p.calendar||[]).map(md=>md.week===(p.week||1)&&!md.played?{...md,played:true,result:{homeScore:result.homeScore,awayScore:result.awayScore,won:result.won,drew:result.drew}}:md);
      const matchdayId=`S${p.season||1}W${p.week||1}`;
      const baseAiData=p.aiData||{lastOpponentTactic:null,scoutReports:{},pressReports:{}};
      const newAiData={...baseAiData,
        lastOpponentTactic:result.oppTactic?{...result.oppTactic,week:p.week||1}:baseAiData.lastOpponentTactic,
        scoutReports:result.scoutReport?{...baseAiData.scoutReports,[matchdayId]:result.scoutReport}:baseAiData.scoutReports,
      };
      return{...p,stats:ns,ovr:newOvr,goals:p.goals+result.goals,assists:p.assists+result.assists,matches:p.matches+1,totalGoals:p.totalGoals+result.goals,totalAssists:p.totalAssists+result.assists,totalMatches:p.totalMatches+1,morale:clamp(p.morale+moD,0,100),fatigue:clamp(p.fatigue+rng(12,22),0,100),week:(p.week||1)+1,weekLived:false,log:[logE,...(p.log||[])].slice(0,60),matchHistory:newHistory,standings:newStandings,calendar:newCal,aiData:newAiData};
    });
    setScreen("postmatch");setTab("dashboard");
  };

  // "Vivi la settimana" — applies events/form changes, does NOT advance week counter
  const liveCurrentWeek=()=>{
    if(player.weekLived){notify("Hai già vissuto questa settimana. Avanza per passare alla prossima.",TH.warning);return;}
    setPlayer(p=>{
      if(p.week>38)return p; // nothing to do if season ended
      const ev=Math.random()<0.78?wPick(WEEKLY_EVENTS):null;
      let upd={weekLived:true};
      if(ev){
        const ef=ev.ef||{};
        const extras={
          morale:clamp((p.morale||70)+(ef.morale||0),0,100),
          fatigue:clamp((p.fatigue||0)+(ef.fatigue||0),0,100),
          form:clamp((p.form||70)+(ef.form||0),0,100),
          popularity:clamp((p.popularity||20)+(ef.popularity||0),0,100),
          coachTrust:clamp((p.coachTrust||60)+(ef.coachTrust||0),0,100),
          value:Math.max(0.5,(p.value||0.8)+(ef.value||0)),
        };
        const newStats={...p.stats};
        if(ef.tecnica)newStats.tecnica=clamp(p.stats.tecnica+(ef.tecnica),1,99);
        if(ef.velocità)newStats.velocità=clamp(p.stats.velocità+(ef.velocità),1,99);
        if(ef.tiro)newStats.tiro=clamp(p.stats.tiro+(ef.tiro),1,99);
        if(ef.passaggio)newStats.passaggio=clamp(p.stats.passaggio+(ef.passaggio),1,99);
        if(ef.fisico)newStats.fisico=clamp(p.stats.fisico+(ef.fisico),1,99);
        if(ef.posizionamento)newStats.posizionamento=clamp(p.stats.posizionamento+(ef.posizionamento),1,99);
        if(ef.mentalità)newStats.mentalità=clamp(p.stats.mentalità+(ef.mentalità),1,99);
        upd={...upd,...extras,stats:newStats,ovr:calcOvr(newStats),log:[ev.txt,...(p.log||[])].slice(0,60)};
        setTimeout(()=>setWeekLiveModal({event:ev,changes:{morale:ef.morale||0,form:ef.form||0,fatigue:ef.fatigue||0}}),50);
      }else{
        setTimeout(()=>setWeekLiveModal({event:{txt:"⚽ Settimana di allenamento regolare. Nessun evento particolare."},changes:{}}),50);
      }
      return{...p,...upd};

  // advance week: calendar-driven, simulates missed matches, resets season at week>38
  const doAdvanceWeek=()=>{
    setShowAdvanceConfirm(false);
    const isInU18=(player.proStatus||"u18")==="u18";
    const weekVal=player.week||1;
    if(isInU18&&weekVal>=38){
      const hist={season:player.season||1,club:player.club?.name||player.club?.n,goals:player.goals||0,assists:player.assists||0,matches:player.matches||0,ovr:player.ovr||60};
      setPlayer(p=>({...p,u18Seasons:(p.u18Seasons||0)+1,history:[...(p.history||[]),hist],log:[`🏁 Fine U18 S.${p.season||1}: ${p.goals||0}⚽ ${p.assists||0}🎯`,...(p.log||[])].slice(0,60)}));
      setScreen("proTransition");
      return;
    }
    setPlayer(p=>{
      if(p.week>38){
        // new season: reset stats, standings, calendar
        const hist={season:p.season,club:p.club?.name||p.club?.n,goals:p.goals,assists:p.assists,matches:p.matches,ovr:p.ovr};
        const newSeason=(p.season||1)+1;
        const lc=getLeagueClubs(p);
        const newStandings=initStandings(lc);
        const seed=newSeason*777+hashStr(p.club?.id||p.club?.n||"u18");
        const newCalendar=generateSeasonCalendar(p.club||{id:"u18",n:"U18"},lc,seed);
        const newContract={...p.contract,duration:(p.contract?.duration||1)-1,expiresAtSeason:p.contract?.expiresAtSeason||newSeason+1};
        return{...p,season:newSeason,age:p.age+1,week:1,weekLived:false,goals:0,assists:0,matches:0,fatigue:0,skillPoints:(p.skillPoints||0)+2,contract:newContract,history:[...(p.history||[]),hist],log:[`🏁 Fine S.${p.season}: ${p.goals}⚽ ${p.assists}🎯`,...(p.log||[])].slice(0,60),standings:newStandings,calendar:newCalendar,matchHistory:[]};
      }
      // if this week had a scheduled unplayed match, auto-simulate it
      const md=(p.calendar||[]).find(m=>m.week===(p.week||1)&&!m.played);
      let updP={...p};
      if(md){
        const lc=getLeagueClubs(p);
        const opp=lc.find(c=>c.id===md.opponentId)||lc.find(c=>c.n===md.opponentName);
        if(opp){
          const sim=simulateMatch(p.club,opp,p.ovr||65,md.isHome);
          const clubId=p.club?.id||p.club?.n;
          const newSt=updateStandings(p.standings||initStandings(getLeagueClubs(p)),clubId,sim);
          const newCal=(p.calendar||[]).map(m=>m.week===(p.week||1)&&!m.played?{...m,played:true,result:{homeScore:sim.homeScore,awayScore:sim.awayScore,won:sim.won,drew:sim.drew},simulated:true}:m);
          const newHistory=[...(p.matchHistory||[]),{week:p.week||1,opponent:opp.n,oppAbbr:opp.a,oppCol:opp.c,homeScore:sim.homeScore,awayScore:sim.awayScore,goals:0,assists:0,rating:sim.rating,won:sim.won,drew:sim.drew,simulated:true}].slice(-200);
          updP={...updP,standings:newSt,calendar:newCal,matchHistory:newHistory,matches:(p.matches||0)+1,goals:p.goals,assists:p.assists,morale:clamp(p.morale+(sim.won?3:sim.drew?1:-2),0,100)};
        }
      }
      if(Math.random()<0.08&&p.matches>3){const offer=generateTransferOffer(p);if(offer)setTransferOffer(offer);}
      if(p.injured&&(p.injuryWeeks||0)>0){return{...updP,week:(p.week||1)+1,weekLived:false,injuryWeeks:p.injuryWeeks-1,injured:p.injuryWeeks-1>0,fatigue:Math.max(0,(p.fatigue||0)-8)};}
      return{...updP,week:(p.week||1)+1,weekLived:false};
    });
    notify("⏭️ Settimana avanzata");
  };

      const base={...p,week:1,weekLived:false,season:newSeason,age:newAge,goals:0,assists:0,matches:0,matchHistory:[],fatigue:clamp((p.fatigue||0)-30,0,100),skillPoints:(p.skillPoints||0)+2,morale:clamp((p.morale||70)+(offer.moralBonus||0),0,100),contract:{duration:offer.duration||1,wage:offer.wage||500,expiresAtSeason:newSeason+(offer.duration||1)},standings:newStandings,calendar:newCalendar};
