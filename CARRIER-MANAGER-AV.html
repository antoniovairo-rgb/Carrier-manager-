                <div style={{background:player.weekLived?"linear-gradient(135deg,#334155,#374151)":"linear-gradient(135deg,#1e3a5f,#1e4d3a)",borderRadius:10,padding:"10px 12px",cursor:player.weekLived?"default":"pointer",opacity:player.weekLived?0.65:1}}
                  onClick={!player.weekLived?liveCurrentWeek:undefined}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>{player.weekLived?"✅ Settimana vissuta":"⚡ Vivi la Settimana"}</div>
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.5)"}}>W.{week}</div>
                  </div>
                </div>
                <button onClick={()=>{const mdBtn=getThisWeekMatchday();if(mdBtn&&player.weekLived){setShowMatchPrompt(mdBtn);}else{setShowAdvanceConfirm(true);}}} style={{width:"100%",padding:"9px 12px",borderRadius:10,border:`1px solid ${TH.cardBorder}`,background:TH.card,cursor:"pointer",fontFamily:"inherit",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:12,fontWeight:700,color:TH.text}}>⏭️ Avanza Settimana</span>
                  <span style={{display:"flex",alignItems:"center",gap:4}}>
                    <span className="kbd">A</span><span className="kbd">0</span>
                    <span style={{fontSize:10,color:TH.muted}}>W.{week}→{week+1}</span>
                  </span>
                </button>
              </div>
            </details>
            {/* Export */}
            <button onClick={exportSave} style={{width:"100%",padding:"7px",borderRadius:9,border:`1px solid ${TH.cardBorder}`,background:"transparent",cursor:"pointer",fontFamily:"inherit",fontSize:11,color:TH.faint,marginBottom:0}}>📁 Esporta salvataggio JSON</button>
            <div style={{height:3,background:"#e2e8f0",borderRadius:2,marginTop:10}}><div style={{height:"100%",width:`${(week/38)*100}%`,background:TH.success,borderRadius:2,transition:"width .4s"}}/></div>
          </Card>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[{l:"Morale",v:player.morale||70,e:"😄",c:((player.morale||70)>60)?TH.success:((player.morale||70)>30)?TH.warning:TH.danger},{l:"Forma",v:100-(player.fatigue||0),e:"💪",c:((player.fatigue||0)<40)?TH.success:((player.fatigue||0)<70)?TH.warning:TH.danger},{l:"Fiducia mister",v:player.coachTrust||60,e:"🤝",c:TH.primary},{l:"Popolarità",v:player.popularity||20,e:"⭐",c:TH.accent}].map(it=>(
              <Card key={it.l} style={{padding:"12px 14px"}}>
                <div style={{fontSize:18,marginBottom:3}}>{it.e}</div><div style={{fontSize:10,color:TH.muted,marginBottom:2}}>{it.l}</div>
                <div style={{fontSize:18,fontWeight:800,color:it.c}}>{it.v}</div>
                <div style={{height:3,background:"#e2e8f0",borderRadius:2,marginTop:5}}><div style={{height:"100%",width:`${it.v}%`,background:it.c,borderRadius:2}}/></div>
              </Card>
            ))}
          </div>
          {(player.log||[]).length>0&&<Card style={{padding:"12px 14px"}}><div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:6}}>Ultime notizie</div>{(player.log||[]).slice(0,5).map((e,i)=><div key={i} style={{fontSize:11,color:TH.text,padding:"3px 0",borderBottom:i<4?"1px solid "+TH.cardBorder:"none"}}>{e}</div>)}</Card>}
          <Card style={{padding:"10px 14px"}} shadow={false} bg="#f8fafc">
            <div style={{fontSize:9,color:TH.faint,textTransform:"uppercase",letterSpacing:1.5,marginBottom:6}}>⌨️ Scorciatoie tastiera</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {[["Enter/P","Gioca"],["A/0","Avanza sett."],["S","Salva"],["T","Allena"],["C","Calendario"],["F","Classifica"],["Esc","Indietro"],["←→","Cambia tab"]].map(([k,l])=>(
                <div key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:TH.muted}}>
                  <span className="kbd">{k}</span>{l}
                </div>
              ))}
            </div>
          </Card>
        </div>
      )}

      {/* CALENDAR  (BUG 4 — shows real scheduled matches) */}
      {tab==="calendar"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {/* Upcoming matches from calendar */}
          {(player.calendar||[]).length>0&&(()=>{
            const upcoming=(player.calendar||[]).filter(md=>md.week>=(week)&&!md.played).slice(0,5);
            const lc=getLeagueClubs(player);
            if(!upcoming.length)return null;
            return(
              <Card>
                <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Prossime partite</div>
                {upcoming.map((md,i)=>{
                  const opp=lc.find(c=>c.id===md.opponentId)||lc.find(c=>c.n===md.opponentName)||{n:md.opponentName,a:"???",c:"#888",c2:"#fff"};
                  const isCur=md.week===week;
                  return(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<upcoming.length-1?"1px solid "+TH.cardBorder:"none",background:isCur?"#eff6ff":"transparent",borderRadius:isCur?6:0,paddingLeft:isCur?8:0}}>
                      <div style={{width:28,height:28,flexShrink:0}}><TeamBadge team={opp} size={28}/></div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:isCur?700:500,color:isCur?TH.primary:TH.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {isCur&&"▶ "}{md.isHome?"🏟️":"✈️"} vs {md.opponentName}
                        </div>
                        <div style={{fontSize:10,color:TH.muted}}>Giornata {md.matchday} · W.{md.week}</div>
                      </div>
                      {isCur&&<Btn onClick={startMatch} v="green" style={{padding:"6px 12px",fontSize:11}}>Gioca →</Btn>}
                    </div>
                  );
                })}
              </Card>
            );
          })()}
          {/* Match history */}
          {(player.matchHistory||[]).length>0&&(
            <Card>
              <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Partite giocate — S.{season}</div>
              {[...(player.matchHistory||[])].reverse().slice(0,10).map((m,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 0",borderBottom:i<9?"1px solid "+TH.cardBorder:"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:m.won?TH.success:m.drew?TH.warning:TH.danger,flexShrink:0}}/>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:TH.text}}>vs {m.opponent}{m.simulated&&<span style={{fontSize:9,color:TH.faint,marginLeft:4}}>(sim.)</span>}</div>
                      <div style={{fontSize:10,color:TH.muted}}>W.{m.week}</div>
                    </div>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:13,fontWeight:700,color:TH.text}}>{m.homeScore}–{m.awayScore}</div>
                    <div style={{fontSize:9,color:TH.muted}}>⚽{m.goals} 🎯{m.assists}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:18,fontWeight:900,color:m.rating>=8?TH.success:m.rating>=6.5?TH.warning:TH.danger}}>{m.rating}</div>
                    <div style={{fontSize:9,color:TH.faint}}>voto</div>
                  </div>
                </div>
              ))}
            </Card>
          )}
          {/* Week grid — shows ⚽ on match weeks even if not yet played */}
          <Card>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Stagione {season} — calendario</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:3}}>
              {Array.from({length:38},(_,i)=>{
                const w=i+1,past=w<week,cur=w===week;
                const mh=(player.matchHistory||[]).find(m=>m.week===w);
                const calEntry=(player.calendar||[]).find(m=>m.week===w);
                const hasScheduled=!!calEntry;
                return<div key={w}
                  title={mh?`vs ${mh.opponent}: ${mh.homeScore}-${mh.awayScore}`:(calEntry?`vs ${calEntry.opponentName}${calEntry.isHome?" 🏟️":" ✈️"}`:"–")}
                  style={{borderRadius:6,padding:"5px 3px",textAlign:"center",fontSize:10,
                    background:cur?"#eff6ff":mh?mh.won?"#f0fdf4":mh.drew?"#fefce8":"#fff1f2":past?"#f8fafc":"transparent",
                    border:`1px solid ${cur?TH.primary:mh?mh.won?TH.success:mh.drew?TH.warning:TH.danger:past?TH.cardBorder:TH.cardBorder}`,
                    color:cur?TH.primary:mh?mh.won?TH.success:mh.drew?TH.warning:TH.danger:past?TH.faint:TH.faint,
                    fontWeight:cur||mh?700:400}}>
                  {w}
                  {mh?<div style={{fontSize:8,marginTop:1}}>{mh.won?"W":mh.drew?"D":"L"}</div>:hasScheduled?<div style={{fontSize:7,color:cur?TH.primary:TH.faint,marginTop:1}}>⚽</div>:null}
                </div>;
              })}
            </div>
          </Card>
        </div>
      )}

      {/* STANDINGS */}
      {tab==="standings"&&(
        <Card>
          <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>
            Classifica {player.club?.lg||(player.proStatus==="u18"?"U18 Primavera":"–")} — S.{season}
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <thead><tr>{["#","Club","G","V","P","S","Gf","Gs","Diff","Pts"].map(h=><th key={h} style={{textAlign:h==="Club"?"left":"center",padding:"4px 4px",fontSize:9,color:TH.faint,textTransform:"uppercase",letterSpacing:.5,borderBottom:"1px solid "+TH.cardBorder}}>{h}</th>)}</tr></thead>
              <tbody>
                {(player.standings||[]).map((t,i)=>{const my=t.id===player.club?.id||t.n===player.club?.n;return<tr key={t.id||t.n} style={{background:my?"#eff6ff":"transparent"}}><td style={{textAlign:"center",padding:"5px 4px",color:i<3?TH.warning:TH.muted,fontWeight:i<3?700:400}}>{i+1}</td><td style={{padding:"5px 4px",fontWeight:my?700:400,color:my?TH.primary:TH.text,whiteSpace:"nowrap"}}><span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",background:t.col||t.c,marginRight:4,verticalAlign:"middle"}}/>{t.abbr||t.a}{my&&" ★"}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.muted}}>{t.played}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.success}}>{t.wins}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.muted}}>{t.draws}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.danger}}>{t.losses}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.muted}}>{t.gf}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.muted}}>{t.ga}</td><td style={{textAlign:"center",padding:"5px 4px",color:t.gd>0?TH.success:t.gd<0?TH.danger:TH.muted}}>{t.gd>0?"+":""}{t.gd}</td><td style={{textAlign:"center",padding:"5px 4px",fontWeight:700,color:TH.warning}}>{t.pts}</td></tr>;})}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* TRAINING */}
      {tab==="training"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5}}>Attributi</div>{(player.skillPoints||0)>0&&<div style={{background:"#f3e8ff",color:TH.accent,padding:"3px 12px",borderRadius:20,fontSize:11,fontWeight:700}}>💡 {player.skillPoints} punti</div>}</div>
            {Object.entries(player.stats).map(([k,v])=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <div style={{flex:1}}><StatBar label={k} value={v}/></div>
                {(player.skillPoints||0)>0&&<button onClick={()=>upgradeSkill(k)} style={{width:24,height:24,borderRadius:"50%",border:"1px solid "+TH.accent,background:"#f3e8ff",color:TH.accent,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>}
              </div>
            ))}
          </Card>
          <Card>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:6}}>Allenamento libero</div>
            <p style={{fontSize:12,color:TH.muted,margin:"0 0 10px"}}>Migliora un attributo casuale (+fatica).</p>
            <Btn onClick={()=>{if((player.fatigue||0)>80){notify("Sei troppo stanco!",TH.danger);return;}const k=pick(Object.keys(player.stats));setPlayer(p=>{const ns={...p.stats,[k]:clamp(p.stats[k]+rng(1,2),1,99)};return{...p,stats:ns,ovr:calcOvr(ns),fatigue:clamp((p.fatigue||0)+10,0,100)};});notify(`Allenamento: ${k} +1!`,TH.success);}} fw>💪 Allenati (Fatica +10)</Btn>
          </Card>
        </div>
      )}

      {/* PROFILE  (req #12 – avatar/colori) */}
      {tab==="profile"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {/* U18 status banner */}
          {(player.proStatus||"u18")==="u18"&&(
            <Card bg="#eff6ff" border="#bfdbfe" style={{padding:"12px 14px"}}>
              <div style={{fontSize:10,color:TH.primary,textTransform:"uppercase",letterSpacing:1.5,fontWeight:700,marginBottom:8}}>🏫 Status Under 18</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                <div style={{background:"#dbeafe",borderRadius:8,padding:"8px 10px"}}>
                  <div style={{fontSize:9,color:TH.faint}}>STAGIONI U18</div>
                  <div style={{fontSize:20,fontWeight:900,color:TH.primary}}>{player.u18Seasons||0}<span style={{fontSize:12,color:TH.faint}}>/2</span></div>
                </div>
                <div style={{background:(player.u18Seasons||0)>=1?"#fee2e2":"#dcfce7",borderRadius:8,padding:"8px 10px"}}>
                  <div style={{fontSize:9,color:TH.faint}}>OBIETTIVO</div>
                  <div style={{fontSize:11,fontWeight:700,color:(player.u18Seasons||0)>=1?TH.danger:TH.success}}>{(player.u18Seasons||0)>=1?"⚠️ Transizione obbligatoria":"🎯 Valutazione fine stagione"}</div>
                </div>
              </div>
              <div style={{height:5,background:"#e2e8f0",borderRadius:3,overflow:"hidden",marginBottom:4}}>
                <div style={{height:"100%",width:`${(player.u18Seasons||0)*50}%`,background:(player.u18Seasons||0)>=1?"#ef4444":TH.warning,borderRadius:3}}/>
              </div>
              <div style={{fontSize:10,color:TH.muted}}>
                {(player.u18Seasons||0)===0&&"Prima stagione in Under 18. Ottieni risultati per attrarre offerte pro."}
                {(player.u18Seasons||0)===1&&"⚠️ Ultima stagione possibile in U18. Al termine DEVI passare al professionismo."}
              </div>
            </Card>
          )}
          {/* Pro status */}
          {(player.proStatus||"u18")!=="u18"&&(
            <Card bg="#f0fdf4" border="#bbf7d0" style={{padding:"12px 14px"}}>
              <div style={{fontSize:10,color:TH.success,textTransform:"uppercase",letterSpacing:1.5,fontWeight:700,marginBottom:4}}>✅ Calciatore professionista</div>
              <div style={{fontSize:11,color:TH.muted}}>Stagioni da pro: {Math.max(0,(player.season||1)-1-(player.u18Seasons||0))}</div>
            </Card>
          )}
          {/* Contract card */}
          {player.contract&&<Card style={{padding:"12px 14px"}}>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>📄 Contratto</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {[{l:"Stipendio",v:`€${player.contract.wage||"–"}/sett.`},{l:"Durata",v:`${player.contract.duration||"–"} stagion${player.contract.duration===1?"e":"i"}`},{l:"Scade stagione",v:`S.${player.contract.expiresAtSeason||"–"}`},{l:"Status",v:(player.proStatus||"u18")==="u18"?"Under 18":"Professionista"}].map(s=><div key={s.l} style={{background:"#f8fafc",borderRadius:8,padding:"7px",border:"1px solid "+TH.cardBorder}}><div style={{fontSize:9,color:TH.faint,marginBottom:2}}>{s.l}</div><div style={{fontSize:12,fontWeight:700,color:TH.text}}>{s.v}</div></div>)}
            </div>
          </Card>}
          <Card>
            <div style={{display:"flex",gap:14,alignItems:"center",marginBottom:14}}>
              <AvatarSVG id={player.avatarId||0} size={64}/>
              <div style={{flex:1}}>
                <h2 style={{margin:0,fontSize:17,fontWeight:900,color:TH.text}}>{player.name}</h2>
                <div style={{fontSize:11,color:TH.muted,marginTop:2}}>{player.nation} · Attaccante · Età {player.age}</div>
                <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:4,marginTop:2}}>
                  <span style={{fontSize:11,color:player.club?.col||player.club?.c||TH.primary,fontWeight:700}}>{player.club?.n||player.club?.name||"–"}</span>
                  {player.club?.transferType&&<span style={{fontSize:9,background:"#eff6ff",color:TH.primary,padding:"1px 7px",borderRadius:8,border:"1px solid #bfdbfe"}}>{player.club.transferType}</span>}
                  {player.club?.lg&&<span style={{fontSize:10,color:TH.muted}}>· {player.club.lg}</span>}
                  {player.club?.nat&&<span style={{fontSize:10}}>{player.club.nat}</span>}
                </div>
              </div>
              <OvrRing value={ovr} size={48}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
              {[{l:"Gol stag.",v:player.goals||0},{l:"Assist stag.",v:player.assists||0},{l:"Partite stag.",v:player.matches||0},{l:"Gol tot.",v:player.totalGoals||0},{l:"Assist tot.",v:player.totalAssists||0},{l:"Valore",v:`${player.value||0.8}M€`}].map(s=><div key={s.l} style={{background:"#f8fafc",borderRadius:8,padding:"7px",border:"1px solid "+TH.cardBorder}}><div style={{fontSize:9,color:TH.faint,marginBottom:2}}>{s.l}</div><div style={{fontSize:14,fontWeight:700,color:TH.text}}>{s.v}</div></div>)}
            </div>
          </Card>
          <Card>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Attributi</div>
            {Object.entries(player.stats).map(([k,v])=><StatBar key={k} label={k} value={v}/>)}
          </Card>
          {(player.history||[]).length>0&&<Card><div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Stagioni precedenti</div>{(player.history||[]).map((h,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:i<(player.history||[]).length-1?"1px solid "+TH.cardBorder:"none"}}><div><div style={{fontWeight:700,fontSize:12,color:TH.text}}>S.{h.season}</div><div style={{fontSize:10,color:TH.muted}}>{h.club}</div></div><div style={{display:"flex",gap:10,fontSize:11}}><span>⚽{h.goals}</span><span>🎯{h.assists}</span><span style={{color:TH.warning,fontWeight:700}}>{h.ovr}ovr</span></div></div>)}</Card>}
          <Card><div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Obiettivi</div>{[{l:"Prima partita",done:(player.totalMatches||0)>=1,e:"🎮"},{l:"10 gol",done:(player.totalGoals||0)>=10,e:"⚽"},{l:"50 gol",done:(player.totalGoals||0)>=50,e:"🔥"},{l:"OVR 80+",done:ovr>=80,e:"⭐"},{l:"OVR 90+",done:ovr>=90,e:"🌟"},{l:"5 stagioni",done:(player.season||1)>5,e:"📅"}].map(o=><div key={o.l} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid "+TH.cardBorder}}><span style={{fontSize:14}}>{o.e}</span><span style={{flex:1,fontSize:11,color:o.done?TH.text:TH.faint}}>{o.l}</span><span>{o.done?"✅":"⬜"}</span></div>)}</Card>
          <AISettingsCard player={player}/>
        </div>
      )}

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:600,zIndex:100}}>
      <div style={{background:"rgba(240,247,255,0.97)",borderTop:"1px solid "+TH.cardBorder,padding:"2px 8px",display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        {[{k:"Enter",l:"Gioca"},{k:"0",l:"Avanza"},{k:"Esc",l:"Indietro"},{k:"Spc",l:"Conferma"}].map(h=>(
          <span key={h.k} style={{fontSize:9,color:TH.muted,display:"flex",alignItems:"center",gap:3}}>
            <span style={{background:"#e2e8f0",borderRadius:3,padding:"1px 5px",fontFamily:"monospace",fontSize:9,color:TH.text}}>{h.k}</span>
            {h.l}
          </span>
        ))}
      </div>
      <div style={{background:TH.navBg,backdropFilter:"blur(12px)",borderTop:"1px solid "+TH.cardBorder,display:"flex"}}>
        {tabs.map(t=><button key={t.id} onClick={()=>goTab(t.id)} title={`${t.l} [${t.k}]`} style={{flex:1,padding:"10px 4px 6px",border:"none",background:"transparent",cursor:"pointer",fontFamily:"inherit",color:tab===t.id?TH.primary:TH.faint,borderTop:`2px solid ${tab===t.id?TH.primary:"transparent"}`,transition:"all .15s"}}><div style={{fontSize:17}}>{t.e}</div><div style={{fontSize:9,marginTop:1,letterSpacing:.3}}>{t.l}</div><div style={{fontSize:8,color:tab===t.id?TH.primary+"99":TH.faint+"88",marginTop:1,fontFamily:"monospace"}}>[{t.k}]</div></button>)}
      </div>
      </div>{/* end bottom nav wrapper */}
    </div>
  );
}

/* ========================================
   APP ROOT
======================================== */
function App(){
  const[phase,setPhase]=useState("loading");
  const[player,setPlayer]=useState(null);
  const[trials,setTrials]=useState([]);
  const[slots,setSlots]=useState([null,null,null]);
  const[currentSlot,setCurrentSlot]=useState(0);
  const[appMsg,setAppMsg]=useState(null);

  const appNotify=(msg,color=TH.danger)=>{setAppMsg({msg,color});setTimeout(()=>setAppMsg(null),3500);};

  const refreshSlots=()=>storage.listSlots().then(s=>setSlots(s));
  useEffect(()=>{refreshSlots().then(()=>setPhase("home"));},[]);// eslint-disable-line

  const loadSave=async(slot=0)=>{
    const d=await storage.load(slot);
    if(d?.player){setPlayer(d.player);setCurrentSlot(slot);setPhase("career");}
    else appNotify("Salvataggio non valido o corrotto.");
  };
  const startNew=(slot=0)=>{setCurrentSlot(slot);setPhase("create");};
  const deleteSlot=async(slot)=>{await storage.del(slot);await refreshSlots();};
  const importSave=(file)=>{
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const d=JSON.parse(e.target.result);
        if(!d?.player?.name)throw new Error();
        const emptySlot=slots.findIndex(s=>!s);
        const slot=emptySlot>=0?emptySlot:0;
        await storage.save({phase:"career",player:d.player},slot);
        await refreshSlots();
        appNotify(`✅ Importato in Slot ${slot+1}`,TH.success);
      }catch{appNotify("File di salvataggio non valido o corrotto.");}
    };
    r.readAsText(file);
  };
  const onCreate=p=>{setPlayer(p);setPhase("trial");};
  const onTrials=r=>{setTrials(r);setPhase("offers");};
  const onChoose=club=>{
    // generate initial calendar + standings when first choosing a club
    const lc=U18_CLUBS;
    const seed=1*777+hashStr(club?.id||club?.n||"u18");
    const calendar=generateSeasonCalendar(club,lc,seed);
    const standings=initStandings(lc);
    const p={...player,club,calendar,standings,log:[`🏟️ Hai scelto ${club.name||club.n}!`]};
    setPlayer(p);setPhase("career");
    storage.save({phase:"career",player:p},currentSlot);
    refreshSlots();
  };
  const wrap=ch=>(
    <div className="cpm-root" style={{minHeight:"100vh",background:TH.bgGrad,color:TH.text,fontFamily:"'Barlow','Segoe UI',sans-serif",position:"relative"}}>
      <div style={{position:"fixed",bottom:6,right:8,zIndex:9999,fontSize:10,color:"rgba(255,255,255,0.30)",pointerEvents:"none",letterSpacing:"0.04em",fontFamily:"monospace"}}>CPM {GAME_VERSION}</div>
      <style>{`
        *{box-sizing:border-box;}
        .cpm-root{padding:12px 8px 100px;}
        @media(min-width:560px){.cpm-root{padding:14px 14px 100px;}}
        @media(min-width:900px){.cpm-root{padding:16px 28px 100px;}}
        @media(min-width:1280px){.cpm-root{padding:18px 48px 100px;}}
        /* Responsive page containers — replaces all fixed maxWidth */
        .cpm-page{width:100%;}
        @media(min-width:900px){.cpm-page{max-width:960px;margin:0 auto;}}
        @media(min-width:1280px){.cpm-page{max-width:1140px;}}
        /* Career main area */
        .cpm-career{width:100%;position:relative;padding-bottom:72px;}
        @media(min-width:900px){.cpm-career{max-width:1140px;margin:0 auto;}}
        /* Dashboard 2-column grid on desktop */
        .cpm-dash-grid{display:flex;flex-direction:column;gap:12px;}
        @media(min-width:900px){.cpm-dash-grid{display:grid;grid-template-columns:1fr 1fr;align-items:start;}}
        /* Offer cards grid */
        .cpm-offers{display:flex;flex-direction:column;gap:10px;}
        @media(min-width:900px){.cpm-offers{display:grid;grid-template-columns:1fr 1fr;}}
        /* ProTransition offers */
        .cpm-proto{display:flex;flex-direction:column;gap:8px;}
        @media(min-width:900px){.cpm-proto{display:grid;grid-template-columns:1fr 1fr;}}
        /* HomeScreen slots */
        .cpm-slots{display:flex;flex-direction:column;gap:8px;}
        @media(min-width:900px){.cpm-slots{display:grid;grid-template-columns:1fr 1fr 1fr;}}
        /* Create screen 2-col on desktop */
        .cpm-create{display:flex;flex-direction:column;gap:16px;}
        @media(min-width:900px){.cpm-create{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:20px;}}
        select option{background:#fff;}
        ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px;}
        button:hover:not(:disabled){filter:brightness(0.96);}
        button:active:not(:disabled){transform:scale(.97);}
        input,select{outline:none;}
        input:focus,select:focus{border-color:${TH.primary}!important;box-shadow:0 0 0 3px ${TH.primary}22!important;}
        /* Keyboard focus indicator — visible for keyboard users, hidden for mouse */
        :focus-visible{outline:2px solid ${TH.primary}!important;outline-offset:2px!important;}
        button:focus-visible{outline:2px solid ${TH.primary}!important;outline-offset:2px!important;}
        /* Shortcut badge */
        .kbd{display:inline-block;padding:1px 5px;border-radius:4px;background:#e2e8f0;color:#475569;font-size:9px;font-family:monospace;font-weight:700;letter-spacing:0.3px;border:1px solid #cbd5e1;}
        @keyframes slideIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
      `}</style>
      <Notif msg={appMsg?.msg} color={appMsg?.color}/>
      {ch}
    </div>
  );
  if(phase==="loading")return wrap(<div style={{textAlign:"center",paddingTop:80,color:TH.faint}}>Caricamento…</div>);
  if(phase==="home")return wrap(<HomeScreen slots={slots} onNew={startNew} onLoad={loadSave} onDelete={deleteSlot} onImport={importSave}/>);
  if(phase==="create")return wrap(<CreateScreen onCreate={onCreate}/>);
  if(phase==="trial"&&player)return wrap(<TrialFlow player={player} onComplete={onTrials}/>);
  if(phase==="offers"&&player)return wrap(<OffersScreen player={player} trialStats={trials} onChoose={onChoose}/>);
  if(phase==="career"&&player)return wrap(<CareerApp player={player} currentSlot={currentSlot} onRefreshSlots={refreshSlots}/>);
  return wrap(<div style={{textAlign:"center",color:TH.faint}}>Stato non riconosciuto.</div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
requestAnimationFrame(window._hide);
</script>
</body>
</html>
