                              style={{padding:"10px 4px",background:"rgba(0,0,0,0.6)",border:"1px solid rgba(255,255,255,0.18)",borderRadius:8,color:"#fff",cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                              <span style={{fontSize:16}}>{RIGORE_ARROWS[dir]}</span>
                              <span style={{fontSize:8,color:"rgba(255,255,255,0.5)"}}>{RIGORE_LABELS[dir]}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    ):(curSit.actions||[]).map((a,i)=>{
                      // Defender proximity reduces success rate
                      const defPenalty=defDist<25?15:defDist<50?8:0;
                      const rate=Math.max(5,succRate(a,player.stats,pPos.x,oppPrestige)-defPenalty);
                      const rc=rate>70?"#4ade80":rate>50?"#f59e0b":"#f87171";
                      const isSel=i===selectedActionIdx;
                      return(
                        <button key={i} onClick={()=>handleAction(a)}
                          style={{padding:isNarrow?"12px 10px":"8px 10px",background:isSel?"rgba(37,99,235,0.45)":"rgba(0,0,0,0.52)",border:isSel?"1.5px solid rgba(96,165,250,0.45)":"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"#fff",cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between",transition:"all .1s",transform:isSel?"scale(1.02)":"scale(1)"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <div style={{width:18,height:18,borderRadius:"50%",background:isSel?"#2563eb":"rgba(255,255,255,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:900,color:isSel?"#fff":"rgba(255,255,255,0.5)",flexShrink:0}}>{i+1}</div>
                            <div style={{fontSize:11,fontWeight:isSel?700:400,color:"#e2e8f0",textAlign:"left"}}>{a.label}</div>
                          </div>
                          <div style={{fontSize:15,fontWeight:900,color:rc,flexShrink:0}}>{rate}%</div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {phase==="hl_result"&&outcome&&!isNarrow&&(
                <div style={{padding:"10px",background:outcome.ok?"rgba(5,50,20,0.7)":"rgba(50,5,5,0.7)",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
                  <div style={{fontSize:14,fontWeight:900,color:outcome.ok?"#4ade80":"#f87171",marginBottom:4}}>{outcome.ok?"✅":"❌"} {chosenAct?.label}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.8)",lineHeight:1.4,marginBottom:4}}>{outcome.text}</div>
                  {aiCommentary&&<div style={{fontSize:10,color:"rgba(255,255,255,0.55)",fontStyle:"italic",marginBottom:4}}>{aiCommentary.reaction} {aiCommentary.commentary}</div>}
                  <div style={{fontSize:9,color:"rgba(255,255,255,0.3)"}}>auto / Enter →</div>
                </div>
              )}

              {/* Stats grid — always visible */}
              <div style={{padding:"8px 10px",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 8px"}}>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:18,fontWeight:900,color:"#4ade80",lineHeight:1}}>{mStats.goals}</div>
                    <div style={{fontSize:7,color:"rgba(255,255,255,0.35)"}}>⚽ GOL</div>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:18,fontWeight:900,color:"#60a5fa",lineHeight:1}}>{mStats.assists}</div>
                    <div style={{fontSize:7,color:"rgba(255,255,255,0.35)"}}>🎯 ASSIST</div>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:13,fontWeight:700,color:energy>50?"#4ade80":energy>25?"#f59e0b":"#f87171",lineHeight:1}}>{energy}%</div>
                    <div style={{fontSize:7,color:"rgba(255,255,255,0.35)"}}>⚡ ENERG.</div>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#a78bfa",lineHeight:1.1}}>{mxStats.shots}–{mxStats.oppShots}</div>
                    <div style={{fontSize:7,color:"rgba(255,255,255,0.35)"}}>💥 TIRI</div>
                  </div>
                </div>
                <div style={{marginTop:5,fontSize:7,color:"rgba(255,255,255,0.25)"}}>
                  📍 {ZONES[zone]?.label||zone} &nbsp;·&nbsp; 🟡 {mxStats.fouls} &nbsp;·&nbsp; 🏳️ {mxStats.corners}
                </div>
              </div>

              {/* Heat map toggle */}
              <div style={{padding:"4px 10px",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                <button onClick={()=>setShowHeatMap(v=>!v)} style={{width:"100%",padding:"4px 8px",borderRadius:6,border:`1px solid ${showHeatMap?"rgba(251,146,60,0.5)":"rgba(255,255,255,0.1)"}`,background:showHeatMap?"rgba(251,146,60,0.12)":"transparent",cursor:"pointer",fontFamily:"inherit",fontSize:10,color:showHeatMap?"#fb923c":"rgba(255,255,255,0.35)",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                  🌡️ {showHeatMap?"Nascondi heatmap":"Mostra heatmap"}
                </button>
              </div>
              {/* Live commentary feed — hidden on mobile overlay */}
              <div style={{flex:1,padding:"6px 10px",overflowY:"auto",minHeight:0,display:isNarrow?"none":"block"}}>
                <div style={{fontSize:7,color:"rgba(255,255,255,0.3)",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>📻 CRONACA</div>
                {coms.length===0
                  ?<div style={{fontSize:9,color:"rgba(255,255,255,0.2)",fontStyle:"italic"}}>In attesa…</div>
                  :coms.slice(0,8).map((c,i)=>(
                    <div key={i} style={{fontSize:9,color:c.color,padding:"2px 0",borderBottom:i<7?"1px solid rgba(255,255,255,0.05)":"none",lineHeight:1.35}}>
                      <span style={{color:"rgba(255,255,255,0.25)",marginRight:4,fontSize:8,fontWeight:700}}>{c.t}'</span>{c.text}
                    </div>
                  ))
                }
              </div>

            </div>{/* end right panel */}
          </div>{/* end field+panel row */}
        </Card>
      )}


      {/* ENDED */}
      {phase==="ended"&&(
        <Card style={{textAlign:"center",padding:"22px"}}>
          <div style={{fontSize:10,color:TH.muted,letterSpacing:2,marginBottom:8}}>FISCHIO FINALE</div>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"center",gap:14,marginBottom:6}}>
            <span style={{fontSize:50,fontWeight:900,color:TH.success}}>{score.home}</span>
            <span style={{fontSize:20,color:TH.faint}}>–</span>
            <span style={{fontSize:50,fontWeight:900,color:TH.danger}}>{score.away}</span>
          </div>
          <p style={{color:TH.muted,fontSize:12,margin:"0 0 16px"}}>{player.club?.name||player.club?.n||"La tua squadra"} vs {opponent?.name||opponent?.n}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
            {[{l:"Gol",v:mStats.goals,e:"⚽"},{l:"Assist",v:mStats.assists,e:"🎯"}].map(s=>(
              <Card key={s.l} style={{padding:"10px 6px",textAlign:"center"}}>
                <div style={{fontSize:17,marginBottom:2}}>{s.e}</div><div style={{fontSize:24,fontWeight:900,color:TH.warning}}>{s.v}</div><div style={{fontSize:10,color:TH.muted}}>{s.l}</div>
              </Card>
            ))}
          </div>
          {(()=>{const rbC=Math.min(mStats.rb,20);const raw=clamp(5.8+rbC*0.115+(winning?0.35:losing?-0.30:0),4.0,10.0);const rating=Math.round(raw*10)/10;const rc=rating>=8?TH.success:rating>=6.5?TH.warning:TH.danger;return<div style={{marginBottom:18}}><div style={{fontSize:10,color:TH.muted,marginBottom:4}}>VALUTAZIONE</div><div style={{fontSize:52,fontWeight:900,color:rc,lineHeight:1}}>{rating}</div><div style={{fontSize:12,color:rc,marginTop:4}}>{rating>=9?"Prestazione storica!":rating>=8?"Eccellente!":rating>=7?"Buona partita":rating>=6?"Sufficiente":"Da migliorare"}</div></div>;})()}
          <Btn onClick={handleEnd} v={context==="trial"?"primary":"green"} fw style={{padding:"13px",fontSize:14}}>
            {context==="trial"?"📋 Risultati provino":"🏟️ Torna alla carriera"} <span className="kbd" style={{opacity:0.7,fontSize:11}}>Enter</span>
          </Btn>
        </Card>
      )}
    </div>
  );
}

/* ========================================
   PRO TRANSITION SCREEN  (U18 → professionismo)
======================================== */
function ProTransitionScreen({player,onChoose}){
  const{offers,forced,perf}=generateProContracts(player);
  const u18S=player.u18Seasons||0;
  const[selIdx,setSelIdx]=useState(0);
  useEffect(()=>{
    const h=e=>{
      if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();setSelIdx(i=>Math.min(offers.length-1,i+1));return;}
      if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();setSelIdx(i=>Math.max(0,i-1));return;}
      if(e.key==="Enter"){e.preventDefault();if(offers[selIdx])onChoose(offers[selIdx]);return;}
      if(["1","2","3"].includes(e.key)){const i=parseInt(e.key)-1;if(offers[i])onChoose(offers[i]);}
    };
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[offers,selIdx,onChoose]);// eslint-disable-line
  return(
    <div style={{width:"100%"}}>
      <div style={{textAlign:"center",marginBottom:14,paddingTop:6}}>
        <div style={{fontSize:44,marginBottom:6}}>🎓</div>
        <h1 style={{fontSize:19,fontWeight:900,margin:"0 0 4px",color:TH.text}}>Fine stagione Under 18</h1>
        <p style={{color:TH.muted,fontSize:12,margin:0}}>Stagione {u18S+1} in Under 18 completata</p>
      </div>
      {/* Player status card */}
      <Card style={{marginBottom:12,padding:"12px 14px"}} bg={forced?"#fff1f2":"#eff6ff"} border={forced?"#fecaca":"#bfdbfe"}>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <AvatarSVG id={player.avatarId||0} size={46}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:14,color:TH.text}}>{player.name} · Livello {player.ovr}</div>
            <div style={{fontSize:11,color:TH.muted}}>Under 18 · Età {player.age} · {player.nation}</div>
            <div style={{fontSize:11,color:TH.warning,marginTop:2}}>⚽ {player.goals} gol · 🎯 {player.assists} assist · {player.matches} gare</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:26,fontWeight:900,color:forced?TH.danger:TH.primary,lineHeight:1}}>{u18S+1}<span style={{fontSize:11,color:TH.faint,fontWeight:400}}>/2</span></div>
            <div style={{fontSize:9,color:TH.faint}}>stagioni U18</div>
          </div>
        </div>
        {forced&&<div style={{marginTop:10,padding:"8px 10px",background:"#fee2e2",borderRadius:8,fontSize:11,color:TH.danger,fontWeight:600}}>⚠️ Limite massimo raggiunto: non puoi restare in Under 18. Scegli il prossimo passo.</div>}
        {!forced&&u18S>=1&&<div style={{marginTop:8,fontSize:11,color:TH.warning,background:"#fef9c3",padding:"6px 10px",borderRadius:7}}>⏳ Questa è la tua ultima stagione U18 disponibile.</div>}
      </Card>
      {/* Progress bar U18 */}
      <div style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:TH.muted,marginBottom:3}}>
          <span>Stagioni Under 18: {u18S+1}/2</span>
          <span style={{color:forced?TH.danger:TH.primary}}>{forced?"Limite raggiunto":"Ancora disponibile"}</span>
        </div>
        <div style={{height:6,background:"#e2e8f0",borderRadius:3,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(u18S+1)*50}%`,background:forced?"#ef4444":TH.warning,borderRadius:3,transition:"width .5s"}}/>
        </div>
      </div>
      {/* Offers */}
      <div style={{fontSize:11,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Le tue opzioni</div>
      <div style={{fontSize:10,color:TH.faint,textAlign:"center",marginBottom:8}}>↑↓ seleziona · Enter / 1·2·3 scegli</div>
      <div className="cpm-proto">
        {offers.map((o,oi)=>{const isSel=oi===selIdx;return(
          <Card key={o.id} style={{marginBottom:8,padding:"12px 14px",outline:isSel?"2px solid "+TH.primary:"none",transition:"outline .1s"}}
          border={isSel?TH.primary:o.isMain?"#bfdbfe":o.isStayU18?"#fef9c3":TH.cardBorder}
          bg={o.isMain?"#eff6ff":o.isStayU18?"#fefce8":TH.card}>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <TeamBadge team={o.club||{col:"#888",col2:"#fff",n:"?"}} size={46}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:13,color:TH.text}}>{o.club?.n||o.club?.name}</div>
              <div style={{fontSize:11,color:o.isMain?TH.primary:o.isStayU18?TH.warning:TH.muted,fontWeight:600}}>{o.contractType}</div>
              <div style={{fontSize:10,color:TH.muted,marginTop:1}}>
                {o.role} · €{o.wage?Math.round(o.wage*52/1000*10)/10+"k/anno":"–"} · {o.duration} stagion{o.duration===1?"e":"i"}
              </div>
              <div style={{display:"flex",gap:5,marginTop:4,flexWrap:"wrap"}}>
                <span style={{fontSize:9,padding:"2px 6px",borderRadius:10,background:o.moralBonus>=0?"#dcfce7":"#fee2e2",color:o.moralBonus>=0?TH.success:TH.danger}}>
                  😄{o.moralBonus>=0?"+":""}{o.moralBonus}
                </span>
                <span style={{fontSize:9,padding:"2px 6px",borderRadius:10,background:"#f3e8ff",color:TH.accent}}>📈+{o.growthBonus}</span>
                {o.isLastChance&&<span style={{fontSize:9,padding:"2px 6px",borderRadius:10,background:"#fef9c3",color:TH.warning}}>⚠️ Ultima chance U18</span>}
                {o.isMain&&<span style={{fontSize:9,padding:"2px 6px",borderRadius:10,background:"#eff6ff",color:TH.primary}}>⭐ Consigliato</span>}
              </div>
            </div>
            <Btn onClick={()=>onChoose(o)} v={o.isMain?"primary":o.isStayU18?"secondary":"ghost"} style={{flexShrink:0,padding:"9px 12px",fontSize:12}}>
              {o.isStayU18?"Resta →":"Accetta →"}
            </Btn>
          </div>
        </Card>
      );})}
      <div style={{fontSize:10,color:TH.faint,textAlign:"center",marginTop:10}}>Scegli con cura — questa decisione definirà la tua carriera professionale.</div>
      </div>{/* end cpm-proto */}
    </div>
  );
}

/* ========================================
   SEASON END SCREEN  (Sprint 2 — B06/B05)
======================================== */
function SeasonEndScreen({data,player,onNewSeason,onRetire}){
  const{season,club,finalStandings,playerStats,champion,playerPos,isChampion}=data;
  const trophies=player.trophies||[];
  const numTeams=finalStandings?.length||18;
  const isRelegated=playerPos>=numTeams-3;
  const isPromoted=playerPos<=2;
  const bgColor=isChampion?"#fef9c3":isPromoted?"#f0fdf4":isRelegated?"#fff1f2":"#f8fafc";
  const borderColor=isChampion?"#fde68a":isPromoted?"#bbf7d0":isRelegated?"#fecaca":TH.cardBorder;
  const statusEmoji=isChampion?"🏆":isPromoted?"⬆️":isRelegated?"⬇️":"🏁";
  const statusLabel=isChampion?"CAMPIONE!":isPromoted?"ZONA PROMOZIONE":isRelegated?"ZONA RETROCESSIONE":"Fine stagione";

  // sorted standings already from doAdvanceWeek
  const sorted=finalStandings||[];
  const playerClubId=club?.id||club?.n;
  const isPlayerRow=t=>t.id===playerClubId||(t.n||t.name)===(club?.n||club?.name);

  const renderRow=(t,i)=>(
    <div key={t.id||i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",borderRadius:6,
      background:isPlayerRow(t)?"#eff6ff":i>=numTeams-3?"#fff1f2":i<3?"#fefce8":"transparent",
      borderLeft:i===0?"3px solid #fde68a":i>=numTeams-3?"3px solid #fca5a5":"3px solid transparent",
      marginBottom:2}}>
      <div style={{fontSize:11,fontWeight:700,color:i<3?TH.warning:TH.muted,width:18,textAlign:"right"}}>{i+1}</div>
      <div style={{flex:1,fontSize:11,fontWeight:isPlayerRow(t)?700:400,color:isPlayerRow(t)?TH.primary:TH.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
        {t.n||t.name}{isPlayerRow(t)?" 👈":""}
      </div>
      <div style={{fontSize:10,color:TH.muted,minWidth:60,textAlign:"right"}}>{t.played}G {t.gf}-{t.ga}</div>
      <div style={{fontSize:12,fontWeight:900,color:TH.text,minWidth:28,textAlign:"right"}}>{t.pts}</div>
    </div>
  );

  // Show top-3, player row if outside top-3, bottom-3 (with ellipsis separators)
  let rows=[];
  if(sorted.length>0){
    const topN=sorted.slice(0,3);
    const botN=sorted.slice(-3);
    const playerInTop=playerPos<3;
    const playerInBot=playerPos>=sorted.length-3;
    rows=[...topN.map((t,i)=>renderRow(t,i))];
    if(!playerInTop&&!playerInBot){
      rows.push(<div key="sep1" style={{textAlign:"center",fontSize:10,color:TH.faint,padding:"2px 0"}}>…</div>);
      rows.push(renderRow(sorted[playerPos],playerPos));
    }
    if(!playerInBot||(sorted.length<=6)){
      if(!playerInTop&&!playerInBot)rows.push(<div key="sep2" style={{textAlign:"center",fontSize:10,color:TH.faint,padding:"2px 0"}}>…</div>);
      botN.forEach((t,i)=>{ const ri=sorted.length-3+i; if(ri>2&&ri!==playerPos)rows.push(renderRow(t,ri)); });
    }else if(sorted.length>3){
      rows.push(<div key="sep2" style={{textAlign:"center",fontSize:10,color:TH.faint,padding:"2px 0"}}>…</div>);
      botN.forEach((t,i)=>{ const ri=sorted.length-3+i; if(ri>2)rows.push(renderRow(t,ri)); });
    }
  }

  return(
    <div style={{width:"100%"}}>
      <div style={{textAlign:"center",marginBottom:14,paddingTop:6}}>
        <div style={{fontSize:44,marginBottom:6}}>{statusEmoji}</div>
        <h1 style={{fontSize:20,fontWeight:900,margin:"0 0 4px",color:TH.text}}>Fine Stagione {season}</h1>
        <p style={{color:TH.muted,fontSize:12,margin:0}}>{club?.n||club?.name} · {club?.lg||"Pro"}</p>
      </div>

      {/* Status banner */}
      <Card style={{marginBottom:12,padding:"12px 16px"}} bg={bgColor} border={borderColor}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:13,fontWeight:900,color:TH.text}}>{statusEmoji} {statusLabel}</div>
          <div style={{fontSize:10,color:TH.muted}}>Pos. {playerPos+1}/{numTeams}</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,textAlign:"center"}}>
          {[{l:"Partite",v:playerStats.matches,e:"📅"},{l:"Gol",v:playerStats.goals,e:"⚽"},{l:"Assist",v:playerStats.assists,e:"🎯"},{l:"Livello",v:playerStats.ovr,e:"⭐"}].map(s=>(
            <div key={s.l}>
              <div style={{fontSize:20}}>{s.e}</div>
              <div style={{fontSize:22,fontWeight:900,color:TH.text}}>{s.v}</div>
              <div style={{fontSize:9,color:TH.muted}}>{s.l}</div>
            </div>
          ))}
        </div>
        {isChampion&&<div style={{marginTop:10,padding:"8px 12px",background:"#fef08a",borderRadius:8,fontSize:12,fontWeight:800,color:"#713f12",textAlign:"center"}}>🏆 Hai vinto la {club?.lg||"lega"}! Trofeo aggiunto all'albo d'oro!</div>}
      </Card>

      {/* Champion banner */}
      {champion&&!isChampion&&(
        <Card style={{marginBottom:12,padding:"10px 14px",textAlign:"center"}} bg="#fefce8" border="#fde68a">
          <div style={{fontSize:12,fontWeight:700,color:"#713f12"}}>🏆 Campione: <strong>{champion.n||champion.name}</strong> · {champion.pts} pt</div>
        </Card>
      )}

      {/* Standings */}
      {sorted.length>0&&(
        <Card style={{marginBottom:12,padding:"12px 14px"}}>
          <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>📊 Classifica finale</div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:12,fontSize:9,color:TH.faint,marginBottom:4,paddingRight:4}}>
            <span>PG GF-GA</span><span style={{minWidth:28,textAlign:"right"}}>PT</span>
          </div>
          {rows}
          <div style={{display:"flex",gap:10,marginTop:8,fontSize:9,flexWrap:"wrap"}}>
            <span style={{color:TH.warning}}>🟡 Top 3 · promozione</span>
            <span style={{color:TH.danger}}>🔴 Ultimi 3 · retrocessione</span>
          </div>
        </Card>
      )}

      {/* Albo d'oro */}
      {trophies.length>0&&(
        <Card style={{marginBottom:12,padding:"12px 14px"}}>
          <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>🏆 Albo d'oro</div>
          {trophies.map((t,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:i<trophies.length-1?"1px solid "+TH.cardBorder:"none"}}>
              <span style={{fontSize:16}}>🏆</span>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:700,color:TH.text}}>Stagione {t.season}</div>
                <div style={{fontSize:10,color:TH.muted}}>{t.club} · {t.league}</div>
              </div>
            </div>
          ))}
        </Card>
      )}

      {onRetire&&(player.age||17)>=35&&(
        <div style={{marginBottom:8,padding:"10px 14px",borderRadius:10,background:"#fef3c7",border:"1px solid #fde68a",textAlign:"center"}}>
          <div style={{fontSize:11,color:"#92400e",marginBottom:6}}>Hai {player.age} anni. Vuoi concludere qui la tua carriera?</div>

/* ========================================
   HOME SCREEN — slot salvataggio
======================================== */
function HomeScreen({onNew,onLoad,onDelete,onImport,slots}){
  const[confirmDel,setConfirmDel]=useState(null);
  const fmtDate=ts=>ts?new Date(ts).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"–";
  useEffect(()=>{
    const onKey=e=>{
      if(e.target.tagName==="INPUT"||confirmDel!==null)return;
      if(e.key==="Enter"){
        e.preventDefault();
        const firstFilled=slots.findIndex(Boolean);
        if(firstFilled>=0)onLoad(firstFilled);
        else{const firstEmpty=slots.findIndex(s=>!s);if(firstEmpty>=0)onNew(firstEmpty);}
      }
      if(["1","2","3"].includes(e.key)){
        const i=parseInt(e.key)-1;
        if(slots[i])onLoad(i);
        else onNew(i);
      }
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[slots,confirmDel,onLoad,onNew]);// eslint-disable-line
  const hasAny=slots.some(Boolean);
  return(
    <div style={{width:"100%"}}>
      {confirmDel!==null&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <Card style={{maxWidth:340,width:"100%",padding:"22px",textAlign:"center"}}>
            <div style={{fontSize:28,marginBottom:10}}>🗑️</div>
            <div style={{fontSize:14,fontWeight:700,marginBottom:6,color:TH.text}}>Eliminare il salvataggio?</div>
            <div style={{fontSize:12,color:TH.muted,marginBottom:18}}>I progressi della carriera nello slot {confirmDel+1} saranno persi per sempre.</div>
            <div style={{display:"flex",gap:10}}>
              <Btn onClick={()=>setConfirmDel(null)} v="secondary" fw>Annulla</Btn>
              <Btn onClick={()=>{onDelete(confirmDel);setConfirmDel(null);}} v="danger" fw>Elimina</Btn>
            </div>
          </Card>
        </div>
      )}
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:60,marginBottom:6}}>⚽</div>
        <h1 style={{fontSize:24,fontWeight:900,letterSpacing:-1,margin:"0 0 4px",color:TH.text}}>CAREER PLAYER MANAGER</h1>
        <p style={{color:TH.muted,fontSize:12,margin:0}}>Serie A Primavera · Carriera calciatore</p>
      </div>
      {/* Save slots */}
      <div className="cpm-slots" style={{marginBottom:14}}>
        {slots.map((s,i)=>s?(
          <Card key={i} border={TH.cardBorder} style={{padding:"12px 14px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <AvatarSVG id={s.avatarId} size={46}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:14,color:TH.text,marginBottom:1}}>{s.name}</div>
                <div style={{fontSize:11,color:TH.muted}}>{s.club} · S.{s.season} W.{s.week}/38</div>
                <div style={{fontSize:10,color:TH.faint,marginTop:1}}>💾 {fmtDate(s.savedAt)}</div>
              </div>
              <OvrRing value={s.ovr} size={40}/>
              <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0}}>
                <Btn onClick={()=>onLoad(i)} v="primary" style={{padding:"8px 14px",fontSize:13}}>Continua →</Btn>
                <button onClick={()=>setConfirmDel(i)} style={{padding:"5px",borderRadius:7,border:"1px solid "+TH.cardBorder,background:"transparent",cursor:"pointer",color:TH.faint,fontSize:11}}>🗑️ Elimina</button>
              </div>
            </div>
          </Card>
        ):(
          <div key={i} style={{border:`2px dashed ${TH.cardBorder}`,borderRadius:14,padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(255,255,255,0.4)"}}>
            <div style={{fontSize:12,color:TH.faint}}>Slot {i+1} — vuoto</div>
            <Btn onClick={()=>onNew(i)} v="secondary" style={{padding:"8px 14px",fontSize:13}}>⚡ Nuova carriera</Btn>

        <p style={{fontSize:12,color:TH.muted,margin:"0 0 12px",lineHeight:1.7}}>Crea il tuo calciatore, supera i provini e costruisci la tua carriera calcistica nei principali campionati europei.</p>
      </Card>}
      {/* BUG 1: "Nuova carriera" always visible even when slots are occupied */}
      {hasAny&&(
        <Card style={{marginBottom:10,padding:"12px 14px",background:"#eff6ff",border:"1px solid #bfdbfe"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:TH.primary}}>⚡ Nuova Carriera</div>
              <div style={{fontSize:10,color:TH.muted,marginTop:2}}>Scegli uno slot vuoto o sovrascrivine uno</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              {slots.map((s,i)=>(
                <button key={i} onClick={()=>onNew(i)} title={s?`Sovrascrive: ${s.name}`:`Slot ${i+1} vuoto`}
                  style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${s?"#fecaca":"#bfdbfe"}`,background:s?"#fee2e2":"#dbeafe",cursor:"pointer",fontSize:11,fontWeight:700,color:s?TH.danger:TH.primary}}>
                  {s?`⚠️S${i+1}`:`+S${i+1}`}
                </button>
              ))}
            </div>
          </div>
        </Card>
      )}
      <div style={{textAlign:"center",marginBottom:8,fontSize:10,color:TH.faint}}>
        <span className="kbd">1</span><span className="kbd">2</span><span className="kbd">3</span> slot · <span className="kbd">Enter</span> continua/nuova
      </div>
      {/* Import JSON */}
      <div style={{textAlign:"center",marginTop:6}}>
        <label style={{cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:TH.muted,padding:"8px 14px",border:"1px solid "+TH.cardBorder,borderRadius:9,background:TH.card}}>
          📂 Importa salvataggio (.json)
          <input type="file" accept=".json" style={{display:"none"}} onChange={e=>{if(e.target.files[0])onImport(e.target.files[0]);e.target.value="";}}/>
        </label>
      </div>
    </div>
  );
}

/* ========================================
   OFFERS SCREEN  (req #11 – clubs)
======================================== */
function OffersScreen({player,trialStats,onChoose}){
  const total=trialStats.reduce((a,m)=>a+m.goals,0),avg=Math.round(trialStats.reduce((a,m)=>a+m.rating,0)/trialStats.length*10)/10,perf=total*2+avg*5;
  const[offers]=useState(()=>[...U18_CLUBS].sort((a,b)=>{const sa=a.p+(Math.random()-.5)*30,sb=b.p+(Math.random()-.5)*30;return perf>50?sb-sa:sa-sb;}).slice(0,perf>50?3:2));
  const[selIdx,setSelIdx]=useState(0);
  useEffect(()=>{
    const onKey=e=>{
      if(["1","2","3"].includes(e.key)){const i=parseInt(e.key)-1;if(offers[i])onChoose(offers[i]);return;}
      if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();setSelIdx(i=>Math.min(offers.length-1,i+1));return;}
      if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();setSelIdx(i=>Math.max(0,i-1));return;}
      if(e.key==="Enter"){e.preventDefault();if(offers[selIdx])onChoose(offers[selIdx]);return;}
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[offers,selIdx,onChoose]);// eslint-disable-line
  return(
    <div style={{width:"100%"}}>
      <div style={{textAlign:"center",marginBottom:14}}><div style={{fontSize:32,marginBottom:6}}>📋</div><h1 style={{fontSize:18,fontWeight:900,margin:0,color:TH.text}}>Offerte ricevute</h1><p style={{color:TH.muted,fontSize:12,margin:"6px 0 0"}}>3 provini · {total} gol · Rating medio {avg}</p></div>
      <Card style={{marginBottom:12,padding:"12px 14px"}}>
        <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Riepilogo provini</div>
        <div style={{display:"flex",gap:6}}>{trialStats.map((t,i)=><div key={i} style={{flex:1,background:"#f8fafc",borderRadius:8,padding:"7px",textAlign:"center",border:"1px solid "+TH.cardBorder}}><div style={{fontSize:9,color:TH.faint,marginBottom:2}}>Provino {i+1}</div><div style={{fontSize:12,fontWeight:700,color:TH.text}}>⚽{t.goals} 🎯{t.assists}</div><div style={{fontSize:11,color:TH.warning,fontWeight:700}}>{t.rating}</div></div>)}</div>
      </Card>
      <div style={{fontSize:10,color:TH.faint,textAlign:"center",marginBottom:8}}>↑↓ seleziona · Enter / 1·2·3 scegli</div>
      <div className="cpm-offers" style={{marginBottom:12}}>
        {offers.map((club,i)=>{
          const isSel=i===selIdx;
          return(
            <Card key={club.id} border={isSel?"#2563eb":i===0?"#bfdbfe":undefined} bg={isSel?"#eff6ff":undefined} style={{outline:isSel?"2px solid #2563eb":"none",transition:"outline .1s"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <TeamBadge team={club} size={44}/>
                  <div><div style={{fontWeight:700,fontSize:14,color:TH.text}}>{club.name}</div><div style={{fontSize:11,color:TH.muted,marginTop:1}}>{club.nat} · Prestigio {club.p}</div></div>
                </div>
                <div style={{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                  {i===0&&<div style={{fontSize:9,color:TH.primary,fontWeight:700}}>⭐ TOP</div>}
                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                    <span className="kbd">{i+1}</span>
                    <Btn onClick={()=>onChoose(club)} v={isSel?"primary":i===0?"primary":"secondary"}>Scegli →</Btn>
                  </div>
                </div>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

/* ========================================
   FOOTBALL MATCH — 11v11 simulazione

function FootballMatch({player,opponent,context="career",onMatchEnd}){
  const mountRef=useRef(null);
  const keysRef=useRef({});
  const gmRef=useRef({scoreA:0,scoreB:0,time:0,pGoals:0,pAssists:0,pShots:0,pPasses:0,ended:false});
  const [ui,setUi]=useState({scoreA:0,scoreB:0,time:"0'"});

  useEffect(()=>{
    const mount=mountRef.current;if(!mount)return;
    const W=mount.clientWidth||window.innerWidth,H=Math.min(460,Math.round(W*0.58));
    mount.style.height=H+'px';
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b2d45);scene.fog=new THREE.Fog(0x1b2d45,95,185);
    const camera=new THREE.PerspectiveCamera(65,W/H,0.1,300);camera.position.set(0,30,-55);camera.lookAt(0,0,8);

    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff,0.44));
    const sun=new THREE.DirectionalLight(0xfff5e0,0.88);sun.position.set(22,65,28);sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-62;sun.shadow.camera.right=62;sun.shadow.camera.top=46;sun.shadow.camera.bottom=-46;scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x88ccff,0x2a5c14,0.28));

    // Field
    const grass=new THREE.Mesh(new THREE.PlaneGeometry(104,68),new THREE.MeshLambertMaterial({color:0x2c6a1d}));grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;scene.add(grass);
    for(let i=0;i<8;i++){const m=new THREE.MeshLambertMaterial({color:i%2?0x2c6a1d:0x357a24});const s=new THREE.Mesh(new THREE.PlaneGeometry(13,68),m);s.rotation.x=-Math.PI/2;s.position.set(-45.5+i*13,0.01,0);scene.add(s);}
    const lM=new THREE.LineBasicMaterial({color:0xffffff,opacity:0.85,transparent:true});
    const ln=pts=>{const g=new THREE.BufferGeometry().setFromPoints(pts.map(([x,z])=>new THREE.Vector3(x,0.02,z)));scene.add(new THREE.Line(g,lM));};
    ln([[-50,-34],[50,-34],[50,34],[-50,34],[-50,-34]]);ln([[0,-34],[0,34]]);
    const cc=[];for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;cc.push([Math.cos(a)*9.15,Math.sin(a)*9.15]);}ln(cc);
    [-1,1].forEach(s=>{const gx=s*50,ix=gx-s*16.5,si=gx-s*5.5;ln([[gx,-20.16],[ix,-20.16],[ix,20.16],[gx,20.16]]);ln([[gx,-9.16],[si,-9.16],[si,9.16],[gx,9.16]]);});
    // Simple stands
    const stM=new THREE.MeshLambertMaterial({color:0x2a3a4a});
    [-38,38].forEach(z=>{const s=new THREE.Mesh(new THREE.BoxGeometry(108,9,9),stM);s.position.set(0,4.5,z);scene.add(s);});
    [-56,56].forEach(x=>{const s=new THREE.Mesh(new THREE.BoxGeometry(18,9,76),stM);s.position.set(x,4.5,0);scene.add(s);});
    // Goals
    const gM=new THREE.MeshLambertMaterial({color:0xf5f5f5});
    [-1,1].forEach(s=>{
      const gg=new THREE.Group();
      [-3.66,3.66].forEach(z=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.10,2.44,8),gM);p.position.set(0,1.22,z);p.castShadow=true;gg.add(p);});
      const cb=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,7.32,8),gM);cb.rotation.z=Math.PI/2;cb.position.y=2.44;gg.add(cb);
      const net=new THREE.Mesh(new THREE.PlaneGeometry(2.8,2.44),new THREE.MeshBasicMaterial({color:0xffffff,opacity:.08,transparent:true,side:THREE.DoubleSide}));net.rotation.y=Math.PI/2;net.position.set(s*1.4,1.22,0);gg.add(net);
      gg.position.x=s*51;scene.add(gg);
    });

    // Player factory — procedural, MeshPhong
    const mkP=(col,isUser=false)=>{
      const g=new THREE.Group();
      const jM=new THREE.MeshPhongMaterial({color:new THREE.Color(col),shininess:55});
      const sM=new THREE.MeshPhongMaterial({color:0x0d1226});
      const skM=new THREE.MeshPhongMaterial({color:0xcfa07a,shininess:18});
      const wh=new THREE.MeshPhongMaterial({color:0xfafafa});
      const bt=new THREE.MeshPhongMaterial({color:0x0a0a0a});
      const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m;};
      add(new THREE.SphereGeometry(0.27,10,7),skM,0,1.93,0);
      const hr=new THREE.Mesh(new THREE.SphereGeometry(0.30,10,6),new THREE.MeshPhongMaterial({color:0x2d1800}));hr.scale.y=0.62;hr.position.set(0,2.03,0);g.add(hr);
      add(new THREE.CylinderGeometry(0.09,0.11,0.13,7),skM,0,1.68,0);
      add(new THREE.CylinderGeometry(0.27,0.31,0.78,10),jM,0,1.22,0);
      add(new THREE.BoxGeometry(0.78,0.14,0.30),jM,0,1.58,0);
      add(new THREE.CylinderGeometry(0.28,0.24,0.28,9),sM,0,0.78,0);
      const mkArm=(sx)=>{const ag=new THREE.Group();ag.position.set(sx*0.45,1.58,0);const u=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.06,0.44,7),jM);u.position.y=-0.22;ag.add(u);const f=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.05,0.36,6),skM);f.position.y=-0.56;ag.add(f);g.add(ag);return ag;};
      const mkLeg=(sx)=>{const lg=new THREE.Group();lg.position.set(sx*0.155,0.78,0);const th=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.086,0.44,8),skM);th.position.y=-0.22;lg.add(th);const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.077,0.066,0.38,8),wh);sh.position.y=-0.57;lg.add(sh);const bk=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.086,0.28),bt);bk.position.set(0,-0.78,0.04);lg.add(bk);g.add(lg);return lg;};
      const aL=mkArm(-1),aR=mkArm(1),lL=mkLeg(-1),lR=mkLeg(1);
      if(isUser){const r=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.055,7,24),new THREE.MeshBasicMaterial({color:0xffd700}));r.rotation.x=Math.PI/2;r.position.y=0.03;g.add(r);}
      g._aL=aL;g._aR=aR;g._lL=lL;g._lR=lR;g._ph=0;
      g.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});
      return g;
    };

    // Formation 4-4-2
    const FA=[
      {r:'GK',x:-47,z:0},{r:'DEF',x:-30,z:-16},{r:'DEF',x:-30,z:-5.5},{r:'DEF',x:-30,z:5.5},{r:'DEF',x:-30,z:16},
      {r:'MID',x:-14,z:-16},{r:'MID',x:-14,z:-5.5},{r:'MID',x:-14,z:5.5},{r:'MID',x:-14,z:16},
      {r:'FWD',x:-4,z:-9},{r:'FWD',x:-4,z:9},
    ];
    const colA=player?.club?.c||'#2563eb',colB=opponent?.c||'#dc2626';
    const PS=[];
    FA.forEach((f,i)=>{
      const isU=(i===9);const mesh=mkP(colA,isU);mesh.position.set(f.x,0,f.z);scene.add(mesh);
      PS.push({pos:new THREE.Vector3(f.x,0,f.z),vel:new THREE.Vector3(),rot:0,team:'A',role:f.r,isU,hasBall:false,fx:f.x,fz:f.z,mesh});
    });
    FA.forEach((f,i)=>{
      const mx=-f.x;const mesh=mkP(colB);mesh.position.set(mx,0,f.z);mesh.rotation.y=Math.PI;scene.add(mesh);
      PS.push({pos:new THREE.Vector3(mx,0,f.z),vel:new THREE.Vector3(),rot:Math.PI,team:'B',role:f.r,isU:false,hasBall:false,fx:mx,fz:f.z,mesh});
    });
    const uP=PS.find(p=>p.isU);

    // Ball
    const bMat=new THREE.MeshPhongMaterial({color:0xfafafa,shininess:90});
    const bMesh=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,9),bMat);bMesh.castShadow=true;scene.add(bMesh);
    [[0,.22,0],[.17,.13,0],[-.17,.13,0],[0,.1,.18],[0,.1,-.18]].forEach(([x,y,z])=>{const pm=new THREE.Mesh(new THREE.SphereGeometry(0.065,6,5),new THREE.MeshPhongMaterial({color:0x111111}));pm.position.set(x,y,z);bMesh.add(pm);});
    const ball={pos:new THREE.Vector3(0,0.22,0),vel:new THREE.Vector3(),owner:PS.indexOf(uP),lastTouch:-1,cd:0};
    uP.hasBall=true;bMesh.position.copy(ball.pos);

    // Input
    const K=keysRef.current;
    const GAME_KEYS=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS','KeyE']);
    const onKD=e=>{K[e.code]=true;if(GAME_KEYS.has(e.code))e.preventDefault();};
    const onKU=e=>{K[e.code]=false;};
    window.addEventListener('keydown',onKD);window.addEventListener('keyup',onKU);
    renderer.domElement.addEventListener('click',()=>renderer.domElement.focus?.());
    renderer.domElement.setAttribute('tabindex','0');

    const G=gmRef.current;
    Object.assign(G,{scoreA:0,scoreB:0,time:0,pGoals:0,pAssists:0,pShots:0,pPasses:0,ended:false});
    const DUR=context==='trial'?210:270;
    const camT=new THREE.Vector3();
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

    const bestPass=(me)=>{let bs=-99,bt=null;PS.forEach(p=>{if(p.team!==me.team||p===me)return;const d=me.pos.distanceTo(p.pos);if(d>40)return;let mo=99;PS.forEach(q=>{if(q.team===me.team)return;const od=q.pos.distanceTo(p.pos);if(od<mo)mo=od;});const sc=mo-d*0.14;if(sc>bs){bs=sc;bt=p;}});return bt;};
    const doShoot=(me,idx)=>{const gx=me.team==='A'?51:-51;ball.vel.set((gx-me.pos.x)*0.44,2.2,-me.pos.z*0.22+(Math.random()-0.5)*1.8);ball.owner=-1;ball.lastTouch=idx;ball.cd=0.35;me.hasBall=false;};
    const doPass=(me,target,idx)=>{const d=new THREE.Vector3().subVectors(target.pos,ball.pos).normalize();ball.vel.copy(d.multiplyScalar(15+(Math.random()-0.5)));ball.owner=-1;ball.lastTouch=idx;ball.cd=0.2;me.hasBall=false;};

    // Pre-calcola i 2 presser più vicini alla palla per ogni squadra
    const pressers={A:new Set(),B:new Set()};
    function calcPressers(){
      ['A','B'].forEach(tm=>{
        pressers[tm].clear();
        const bO=ball.owner>=0?PS[ball.owner]:null;
        const opp=bO&&bO.team!==tm; // pressing when opp has ball
        if(!opp){return;} // don't press when own team has ball
        const dists=[];
        PS.forEach((p,i)=>{if(p.isU||p.team!==tm||p.role==='GK')return;dists.push([p.pos.distanceTo(ball.pos),i]);});
        dists.sort((a,b)=>a[0]-b[0]);
        dists.slice(0,2).forEach(([,i])=>pressers[tm].add(i));
      });
    }

    function aiTick(p,i){
      const oppGx=p.team==='A'?51:-51,myGx=p.team==='A'?-51:51;
      const bO=ball.owner>=0?PS[ball.owner]:null;const myBall=bO&&bO.team===p.team;
      const scoreDiff=p.team==='A'?G.scoreA-G.scoreB:G.scoreB-G.scoreA;
      const pressing=pressers[p.team]&&pressers[p.team].has(i);
      let tx=p.fx,tz=p.fz;
      if(ball.owner===i){
        if(p.role==='GK'){
          const t=bestPass(p);if(t)doPass(p,t,i);
          tx=myGx*0.91;tz=clamp(ball.pos.z*0.18,-4,4);
        } else {
          const dg=Math.abs(p.pos.x-oppGx);
          const shootChance=p.role==='ATT'?0.035:0.022;
          const passChance=0.014+(scoreDiff<0?0.01:0); // passing more when losing
          if(dg<26&&Math.abs(p.pos.z)<20&&Math.random()<shootChance){doShoot(p,i);}
          else if(Math.random()<passChance){const t=bestPass(p);if(t)doPass(p,t,i);}
          else{tx=oppGx;tz=p.pos.z*0.65;}
        }
      } else if(myBall){
        if(p.role==='GK'){tx=myGx*0.88;tz=0;}
        else if(p.role==='DEF'){tx=p.fx*0.80;tz=p.fz;}
        else if(p.role==='MID'){tx=Math.sign(oppGx)*clamp(Math.abs(p.fx)+14,10,42);tz=p.fz;}
        else{// ATT: run deep into opposition half
          tx=Math.sign(oppGx)*clamp(Math.abs(p.fx)+18,18,48);
          tz=p.fz+(Math.random()-0.5)*3; // slight stagger each tick
        }
      } else {
        if(p.role==='GK'){tx=myGx*0.91;tz=clamp(ball.pos.z*0.28,-5,5);}
        else if(pressing){
          // Aggressive: run directly at ball carrier
          tx=bO?bO.pos.x:ball.pos.x;
          tz=bO?bO.pos.z:ball.pos.z;
        } else {
          const bx=clamp(ball.pos.x,-50,50);
          // All non-pressing defenders shift toward ball side tighter
          const pullFactor=scoreDiff<0?0.55:0.42; // press harder when losing
          tx=p.fx+(bx-p.fx)*pullFactor;
          tz=p.fz+ball.pos.z*0.28;
        }
      }
      const toT=new THREE.Vector3(tx-p.pos.x,0,tz-p.pos.z);const td=toT.length();
      if(td>0.5){
        const spd=p.role==='GK'?4:pressing?8:6.5;
        toT.normalize().multiplyScalar(Math.min(spd,td*4));
        p.vel.lerp(toT,pressing?0.22:0.14);
      } else p.vel.multiplyScalar(0.55);
    }

    let animId,lastT=performance.now()/1000,tick=0;

    const resetKO=()=>{
      ball.pos.set(0,0.22,0);ball.vel.set(0,0,0);ball.owner=PS.indexOf(uP);ball.lastTouch=-1;ball.cd=0;
      PS.forEach(p=>{p.pos.set(p.fx,0,p.fz);p.vel.set(0,0,0);p.hasBall=p===uP;p.mesh.position.copy(p.pos);});
      setUi(u=>({...u,scoreA:G.scoreA,scoreB:G.scoreB}));
    };
    const endMatch=()=>{
      const r=clamp(Math.round(50+G.pGoals*15+G.pAssists*8+G.pShots*2+(G.scoreA>G.scoreB?10:0)),30,99);
      setUi(u=>({...u,time:"90'"}));
      setTimeout(()=>onMatchEnd({goals:G.pGoals,assists:G.pAssists,rating:r,shots:G.pShots,passes:G.pPasses,squadAGoals:G.scoreA,squadBGoals:G.scoreB}),1600);
    };

    const animate=()=>{
      animId=requestAnimationFrame(animate);
      const now=performance.now()/1000,dt=clamp(now-lastT,0,0.05);lastT=now;tick++;
      if(G.ended){renderer.render(scene,camera);return;}
      G.time+=dt;if(G.time>=DUR){G.ended=true;endMatch();return;}
      ball.cd=Math.max(0,ball.cd-dt);

      // User input — ISS-style: ↑/W verso porta avversaria, ↓/S indietro, ←/→/A/D laterale
      const dir=new THREE.Vector3();
      const fwd=uP.team==='A'?1:-1;
      if(K['ArrowUp']||K['KeyW'])dir.x+=fwd;if(K['ArrowDown']||K['KeyS'])dir.x-=fwd;
      if(K['ArrowLeft']||K['KeyA'])dir.z-=1;if(K['ArrowRight']||K['KeyD'])dir.z+=1;
      if(dir.lengthSq()>0){dir.normalize();uP.vel.addScaledVector(dir,22*dt);if(uP.vel.length()>7)uP.vel.normalize().multiplyScalar(7);}
      if(K['Space']&&!K._sw){
        if(uP.hasBall){
          const gx=uP.team==='A'?51:-51;
          if(Math.abs(uP.pos.x-gx)<32&&Math.abs(uP.pos.z)<20){G.pShots++;doShoot(uP,PS.indexOf(uP));}
          else{const t=bestPass(uP);if(t){G.pPasses++;doPass(uP,t,PS.indexOf(uP));}}
        }
      }
      K._sw=K['Space'];

      // Players
      calcPressers();
      PS.forEach((p,i)=>{
        if(!p.isU)aiTick(p,i);
        p.vel.multiplyScalar(0.80);
        p.pos.addScaledVector(p.vel,dt);
        p.pos.x=clamp(p.pos.x,-50,50);p.pos.z=clamp(p.pos.z,-33,33);
        // Hard GK zone — never crosses midfield
        if(p.role==='GK'){
          if(p.team==='A'){p.pos.x=clamp(p.pos.x,-50,-22);p.pos.z=clamp(p.pos.z,-10,10);}
          else{p.pos.x=clamp(p.pos.x,22,50);p.pos.z=clamp(p.pos.z,-10,10);}
        }
        const spd=p.vel.length();
        if(spd>0.4){const ta=Math.atan2(p.vel.x,p.vel.z),da=((ta-p.rot+Math.PI*3)%(Math.PI*2))-Math.PI;p.rot+=da*clamp(9*dt,0,1);}
        p.mesh.position.copy(p.pos);p.mesh.rotation.y=p.rot;
        const m=p.mesh;
        if(spd>0.3){m._ph=(m._ph||0)+spd*dt*2.8;const amp=clamp(spd*0.11,0,0.72);m._lL.rotation.x=Math.sin(m._ph)*amp;m._lR.rotation.x=-Math.sin(m._ph)*amp;m._aL.rotation.x=-Math.sin(m._ph)*amp*0.44;m._aR.rotation.x=Math.sin(m._ph)*amp*0.44;}
        else{m._lL.rotation.x*=0.84;m._lR.rotation.x*=0.84;m._aL.rotation.x*=0.84;m._aR.rotation.x*=0.84;}
        if(ball.owner===i){ball.pos.set(p.pos.x+Math.sin(p.rot)*0.46,0.22,p.pos.z+Math.cos(p.rot)*0.46);ball.vel.set(0,0,0);}
      });

      // Ball free physics
      if(ball.owner<0){
        ball.vel.multiplyScalar(0.968);ball.vel.y-=9.8*dt;
        ball.pos.addScaledVector(ball.vel,dt);
        if(ball.pos.y<0.22){ball.pos.y=0.22;ball.vel.y=Math.abs(ball.vel.y)*0.45;if(Math.abs(ball.vel.y)<0.7)ball.vel.y=0;}
        if(Math.abs(ball.pos.z)>33.6){ball.vel.z*=-0.65;ball.pos.z=Math.sign(ball.pos.z)*33.6;}
        if(Math.abs(ball.pos.x)>51&&Math.abs(ball.pos.z)<3.7&&ball.pos.y<2.5){
          const sc=ball.pos.x>0?'A':'B';
          if(sc==='A'){G.scoreA++;if(ball.lastTouch>=0&&PS[ball.lastTouch]?.team==='A'&&PS[ball.lastTouch]?.isU)G.pGoals++;}
          else G.scoreB++;
          resetKO();return;
        }
        PS.forEach((p,i)=>{
          if(ball.owner>=0)return;
          if(ball.cd>0&&i===ball.lastTouch)return;
          if(p.pos.distanceTo(ball.pos)<0.92){ball.owner=i;p.hasBall=true;PS.forEach((q,j)=>{if(j!==i)q.hasBall=false;});}
        });
      }
      bMesh.position.copy(ball.pos);bMesh.rotation.y+=0.07;

      // Camera follow
      // Camera ISS-style: laterale fissa, segue solo X del giocatore
      camT.x+=(uP.pos.x-camT.x)*3*dt;
      camera.position.set(camT.x,30,-55);camera.lookAt(camT.x,0,8);

      // UI tick

      drawPlayer(g,p){

        const spd=Math.hypot(p.vx,p.vy);
        const ang=spd>10?Math.atan2(p.vy,p.vx):(p._la||0);
        if(spd>10){p._la=ang;p._st=(p._st||0)+0.4;}
        const cos=Math.cos(ang),sin=Math.sin(ang);
        const sc=Phaser.Display.Color.HexStringToColor(p.color).color;
        const kick=Math.sin(p._st||0)*3;
        g.fillStyle(0x000000,0.2);g.fillEllipse(x+1,y+4,16,6);
        // Legs
        g.lineStyle(3,0x111133,1);
        g.lineBetween(x-sin*2.5,y+cos*2.5,x-sin*2.5+cos*3+sin*kick,y+cos*2.5+sin*3-cos*kick);
        g.lineBetween(x+sin*2.5,y-cos*2.5,x+sin*2.5+cos*3-sin*kick,y-cos*2.5+sin*3+cos*kick);
        // Shirt
        g.fillStyle(sc);g.fillEllipse(x,y+1,13,10);
        g.lineStyle(1.5,0x00000066,1);g.strokeEllipse(x,y+1,13,10);
        // Shorts
        g.fillStyle(p.team==='A'?0xffffff:0x111111,0.88);g.fillEllipse(x,y+5,10,5);
        // Head
        const hx=x+cos*3.5,hy=y-5+sin;
        g.fillStyle(0xf0c08a);g.fillCircle(hx,hy,5.5);
        g.fillStyle(p.team==='A'?0x1a2a5e:0x3a0e0e);g.fillCircle(hx,hy-1.5,3.8);
        g.fillStyle(0xf0c08a);g.fillCircle(hx,hy+1.5,3.2);
        g.lineStyle(1.5,0x00000055,1);g.strokeCircle(hx,hy,5.5);
        if(p.hasBall){g.lineStyle(3,0xffee00,1);g.strokeCircle(x,y,13);}
        if(p.isHuman){g.lineStyle(2.5,0x00ff88,0.92);g.strokeCircle(x,y+1,15);g.lineStyle(1.5,0x00ff88,0.3);g.strokeCircle(x,y+1,20);}
      }
      update(time,delta){
        if(this.over)return;
        if(this.goalLock>0){this.goalLock-=delta;return;}
        const dt=Math.min(delta/1000,0.05);
        this.mtime+=dt;
        this.cheerTime=Math.max(0,this.cheerTime-dt);
        if(!this.halfDone&&this.mtime>=MATCH_DUR/2){
          this.halfDone=true;this.resetBall(false);this.addComm('neutral');
        }
        if(this.mtime>=MATCH_DUR){this.doEnd();return;}
        for(const p of this.px){p.tackleCD=Math.max(0,p.tackleCD-dt);p.passCD=Math.max(0,p.passCD-dt);}

        if(this.mode==='narrative'){
          // Auto-sim 2x speed
          if(this.mtime-this.lastCommT>10+Math.random()*8)this.addComm(this.holder?'attack':'neutral');
          for(let s=0;s<2;s++){
            if(this.goalLock>0)break;
            this.doAI(dt/2);this.doPhysics(dt/2);this.updatePoss(dt/2);this.checkGoals();
          }
          this.checkNarrativeKA();
          this.drawNarrative(time);
          this.doUI();
        } else {
          // KEY MOMENT: interactive play
          this.kmTimer-=dt;
          if(this.mtime-this.lastCommT>18+Math.random()*12)this.addComm(this.holder?'attack':'neutral');
          if(this.keyAction){
            this.keyAction.timer-=dt;
            this.drawKeyAction();
            if(Phaser.Input.Keyboard.JustDown(this.k1))this.resolveKeyAction(0);
            else if(Phaser.Input.Keyboard.JustDown(this.k2))this.resolveKeyAction(1);
            else if(Phaser.Input.Keyboard.JustDown(this.k3))this.resolveKeyAction(2);
            else if(this.keyAction.timer<=0)this.resolveKeyAction(1);
            this.doDraw(time);this.doUI();return;
          }
          if(this.kmTimer<=0){this.exitKeyMoment();return;}
          this.checkKeyAction();
          this.autoSwitch();
          this.doInput(dt);
          this.doAI(dt);
          this.doPhysics(dt);
          this.updatePoss(dt);
          this.checkGoals();
          this.doDraw(time);
          this.doUI();
        }
      }
      checkNarrativeKA(){
        if(this.mtime-this.lastKAT<18)return;

        const isAtk=this.holder.team==='A'&&this.by>FY+FH*0.58;
        const isDef=this.holder.team==='B'&&this.by<FY+FH*0.38;
        if(isAtk&&Math.random()<0.024){this.enterKeyMoment(true);return;}
        if(isDef&&Math.random()<0.016){this.enterKeyMoment(false);}
      }
      enterKeyMoment(isAtk){
        this.mode='keymoment';

        const t1=this.add.text(W/2,CY-18,msg,{fontFamily:'"Courier New",monospace',fontSize:'22px',fontStyle:'bold',color:isAtk?'#ffee00':'#ff4444',stroke:'#000',strokeThickness:5}).setOrigin(0.5).setDepth(93);
        const t2=this.add.text(W/2,CY+16,'Prendi il controllo! WASD + SPAZIO',{fontFamily:'"Courier New",monospace',fontSize:'11px',color:'#e2e8f0',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setDepth(93);

      exitKeyMoment(){

      }
      drawNarrative(time){
        const g=this.gameGfx;g.clear();

        const cA=Phaser.Display.Color.HexStringToColor(COL_A).color;

        for(const p of this.px){

          if(p.isHuman){g.lineStyle(2,0x00ff88,1);g.strokeCircle(p.x,p.y,10);}
        }
        // Ball glow + ball
        const bx=this.bx,by2=this.by;
        const pulse=0.5+0.5*Math.sin(time/180);

        g.fillStyle(0xffffff,0.5);g.fillCircle(bx,by2,BALL_R+1);
        g.fillStyle(0xffffff,1);g.fillCircle(bx,by2,BALL_R);
        g.lineStyle(1,0xaaaaaa,0.5);g.strokeCircle(bx,by2,BALL_R);
        // Possession bar
        const pp=this.posA/this.posTotal;
        const bw=240,bbarY=FY+FH+COMM+CTRL/2-4;
        g.fillStyle(0x1a2a1a);g.fillRoundedRect(W/2-bw/2,bbarY,bw,8,4);
        if(pp>0){g.fillStyle(cA);g.fillRoundedRect(W/2-bw/2,bbarY,bw*pp,8,4);}
        if(pp<1){g.fillStyle(cB);g.fillRoundedRect(W/2-bw/2+bw*pp,bbarY,bw*(1-pp),8,4);}
      }
      autoSwitch(){
        if(this.human.hasBall)return;
        let best=this.human,bd=Infinity;
        for(const p of this.px){if(p.team!=='A')continue;const d=Math.hypot(p.x-this.bx,p.y-this.by);if(d<bd){bd=d;best=p;}}
        if(best!==this.human){this.human.isHuman=false;best.isHuman=true;this.human=best;}
      }
      doInput(dt){
        const p=this.human;
        const up=this.kW.isDown||this.kUp.isDown,dn=this.kS.isDown||this.kDn.isDown;
        const lt=this.kA.isDown||this.kLt.isDown,rt=this.kD.isDown||this.kRt.isDown;
        const ACC=750,FRIC=4.5;
        let ax=0,ay=0;if(lt)ax-=ACC;if(rt)ax+=ACC;if(up)ay-=ACC;if(dn)ay+=ACC;
        p.vx+=ax*dt;p.vy+=ay*dt;
        p.vx*=Math.pow(0.01,dt*FRIC);p.vy*=Math.pow(0.01,dt*FRIC);
        this.clampSpd(p);
        if(Phaser.Input.Keyboard.JustDown(this.kSp)){
          const near=Math.hypot(p.x-this.bx,p.y-this.by)<24;
          if(p.hasBall||near){
            if(!p.hasBall){if(this.holder)this.holder.hasBall=false;this.holder=p;p.hasBall=true;}
            const dg=Math.hypot(CX-p.x,(FY+FH)-p.y); // distance to bottom goal
            if(dg<220||p.role==='FWD'){this.doShoot(p,CX,FY+FH,true);}
            else{const tgt=this.bestPass(p);if(tgt)this.doPass(p,tgt,true);else this.doShoot(p,CX,FY+FH,true);}
          }
        }
        if(Phaser.Input.Keyboard.JustDown(this.kE)){
          const opp=this.nearOpp(p,'A');
          if(opp&&Math.hypot(opp.x-p.x,opp.y-p.y)<30){
            this.pstats.tackles++;
            if(Math.random()<0.55){
              this.pstats.tacklesWon++;
              if(opp.hasBall){opp.hasBall=false;this.holder=null;const ang=Math.atan2(p.y-opp.y,p.x-opp.x);this.bvx=Math.cos(ang)*155+p.vx*0.4;this.bvy=Math.sin(ang)*155+p.vy*0.4;}
            }
          }
        }
      }
      doAI(dt){
        const bt=this.holder?this.holder.team:null;
        for(const p of this.px){
          if(p.isHuman)continue;
          const myhb=bt===p.team,ihb=p.hasBall;
          const gy=p.team==='A'?FY+FH:FY; // attacking goal y
          const myGY=p.team==='A'?FY:FY+FH; // own goal y
          if(ihb){
            const dg=Math.hypot(CX-p.x,gy-p.y);
            if(dg<210&&p.passCD<=0&&p.role!=='GK'){this.doShoot(p,CX,gy,false);p.passCD=1.8;}
            else if(p.passCD<=0){
              const tgt=this.bestPass(p);
              if(tgt&&Math.random()<0.65){this.doPass(p,tgt,false);p.passCD=0.7;}
              else{p.tx=CX*0.3+p.x*0.7;p.ty=gy*0.3+p.y*0.7;}
            }
          } else if(myhb){
            if(p.role==='GK'){
              p.ty=myGY+(p.team==='A'?PLAYER_R+5:-(PLAYER_R+5));
              p.tx=CX+(this.bx-CX)*0.28;
              p.tx=Math.max(CX-GOAL_W*0.48,Math.min(CX+GOAL_W*0.48,p.tx));
            } else if(p.role==='DEF'){
              p.tx=p.fx*0.7+this.bx*0.3;p.ty=p.fy*0.6+this.by*0.4;
              if(p.team==='A')p.ty=Math.min(p.ty,CY-12);else p.ty=Math.max(p.ty,CY+12);
            } else if(p.role==='MID'){
              const oy=p.team==='A'?60:-60;
              p.tx=p.fx*0.5+this.bx*0.5;p.ty=this.by+oy*(0.5+Math.random()*0.5);
            } else {
              const ry=p.team==='A'?Math.min(this.by+130,FY+FH-35):Math.max(this.by-130,FY+35);
              p.ty=ry;p.tx=p.fx*0.4+this.bx*0.6;
            }
          } else {
            if(p.role==='GK'){
              p.ty=myGY+(p.team==='A'?PLAYER_R+5:-(PLAYER_R+5));
              p.tx=CX+(this.bx-CX)*0.22;
              p.tx=Math.max(CX-GOAL_W*0.48,Math.min(CX+GOAL_W*0.48,p.tx));
            } else if(p.role==='DEF'){
              const opp=this.nearOpp(p,p.team);
              if(opp){
                const oy2=p.team==='A'?FY+65:FY+FH-65;
                p.tx=opp.x*0.55+p.fx*0.45;p.ty=opp.y*0.5+oy2*0.5;
                if(p.team==='A')p.ty=Math.min(p.ty,CY-5);else p.ty=Math.max(p.ty,CY+5);
              }else{p.tx=p.fx;p.ty=p.fy;}
            } else if(p.role==='MID'){
              const db=Math.hypot(p.x-this.bx,p.y-this.by);
              if(db<200){p.tx=this.bx;p.ty=this.by;}else{p.tx=p.fx;p.ty=p.fy*0.6+this.by*0.4;}
            } else {
              const db=Math.hypot(p.x-this.bx,p.y-this.by);
              if(db<170){p.tx=this.bx;p.ty=this.by;}else{p.tx=p.fx*0.65+this.bx*0.35;p.ty=p.fy*0.65+this.by*0.35;}
            }
          }
          p.tx=Math.max(FX+12,Math.min(FX+FW-12,p.tx));
          p.ty=Math.max(FY+12,Math.min(FY+FH-12,p.ty));
          const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
          const ACC2=560,FRIC2=3.5;
          if(d>4){p.vx+=(dx/d)*ACC2*dt;p.vy+=(dy/d)*ACC2*dt;}
          p.vx*=Math.pow(0.01,dt*FRIC2);p.vy*=Math.pow(0.01,dt*FRIC2);
          this.clampSpd(p);
          if(!myhb&&!ihb&&p.tackleCD<=0&&p.role!=='GK'){
            const opp=this.nearOpp(p,p.team);
            if(opp&&opp.hasBall&&Math.hypot(opp.x-p.x,opp.y-p.y)<27){
              p.tackleCD=2.2;
              if(Math.random()<0.45){opp.hasBall=false;this.holder=null;const ang=Math.atan2(p.y-opp.y,p.x-opp.x);this.bvx=Math.cos(ang)*125+(Math.random()-0.5)*40;this.bvy=Math.sin(ang)*125+(Math.random()-0.5)*40;}
            }
          }
        }
      }
      clampSpd(p){const spd=Math.hypot(p.vx,p.vy);if(spd>p.maxSpd){const r=p.maxSpd/spd;p.vx*=r;p.vy*=r;}}
      bestPass(passer){
        let best=null,bs=-Infinity;
        for(const p of this.px){
          if(p===passer||p.team!==passer.team||p.role==='GK')continue;
          // forward = toward attacking goal (higher y for A, lower y for B)
          const fwd=passer.team==='A'?p.y:(FY+FH-p.y);
          const md=this.nearOppDist(p,passer.team);
          const dist=Math.hypot(p.x-passer.x,p.y-passer.y);
          if(dist>370)continue;
          const score=fwd*0.22+md*1.8-dist*0.08;
          if(score>bs){bs=score;best=p;}
        }
        return best;
      }
      nearOpp(player,ownTeam){
        const ot=ownTeam==='A'?'B':'A';let best=null,bd=Infinity;
        for(const p of this.px){if(p.team!==ot)continue;const d=Math.hypot(p.x-player.x,p.y-player.y);if(d<bd){bd=d;best=p;}}
        return best;
      }
      nearOppDist(player,ownTeam){const o=this.nearOpp(player,ownTeam);return o?Math.hypot(o.x-player.x,o.y-player.y):999;}
      doShoot(player,gx,gy,isHuman){
        if(player.hasBall){player.hasBall=false;this.holder=null;}
        const spread=28,tgx=gx+(Math.random()-0.5)*spread; // horizontal scatter
        const dx=tgx-this.bx,dy=gy-this.by,d=Math.hypot(dx,dy)||1;
        const spd=380+Math.random()*110;
        this.bvx=(dx/d)*spd;this.bvy=(dy/d)*spd;this.lastKick=player;
        if(isHuman){this.pstats.shots++;if(Math.abs(tgx-CX)<GOAL_W/2)this.pstats.shotsOnTarget++;}
        if(isHuman)this.addComm('shot');
      }
      doPass(from,to,isHuman){
        if(from.hasBall){from.hasBall=false;this.holder=null;}
        const dx=to.x-this.bx,dy=to.y-this.by,d=Math.hypot(dx,dy)||1;
        const spd=Math.min(275+d*0.4,475);const acc=0.82+Math.random()*0.35;
        this.bvx=(dx/d)*spd*acc;this.bvy=(dy/d)*spd*acc;this.lastKick=from;
        if(isHuman){this.pstats.passAttempts++;if(Math.random()<0.82)this.pstats.passes++;}
      }
      doPhysics(dt){
        const FRIC=1.2,BOUNCE=0.55;
        for(const p of this.px){
          if(!p.hasBall){p.x+=p.vx*dt;p.y+=p.vy*dt;}
          else{p.x+=p.vx*dt;p.y+=p.vy*dt;const ang=Math.atan2(p.vy||0.001,p.vx||0.001);this.bx=p.x+Math.cos(ang)*(PLAYER_R+BALL_R+1);this.by=p.y+Math.sin(ang)*(PLAYER_R+BALL_R+1);this.bvx=p.vx;this.bvy=p.vy;}
          p.x=Math.max(FX+PLAYER_R,Math.min(FX+FW-PLAYER_R,p.x));
          p.y=Math.max(FY+PLAYER_R,Math.min(FY+FH-PLAYER_R,p.y));
        }
        if(!this.holder){
          this.bx+=this.bvx*dt;this.by+=this.bvy*dt;
          this.bvx*=Math.pow(0.02,dt*FRIC);this.bvy*=Math.pow(0.02,dt*FRIC);
          // Left/right walls: always bounce
          if(this.bx<FX+BALL_R){this.bx=FX+BALL_R;this.bvx=Math.abs(this.bvx)*BOUNCE;}
          if(this.bx>FX+FW-BALL_R){this.bx=FX+FW-BALL_R;this.bvx=-Math.abs(this.bvx)*BOUNCE;}
          // Top (team B attacks here → team B scores) / Bottom (team A attacks → team A scores)
          if(this.by<FY-BALL_R){
            if(this.bx>CX-GOAL_W/2&&this.bx<CX+GOAL_W/2)this.doGoal('B');
            else{this.by=FY+BALL_R+1;this.bvy=Math.abs(this.bvy)*BOUNCE;}
          }
          if(this.by>FY+FH+BALL_R){
            if(this.bx>CX-GOAL_W/2&&this.bx<CX+GOAL_W/2)this.doGoal('A');
            else{this.by=FY+FH-BALL_R-1;this.bvy=-Math.abs(this.bvy)*BOUNCE;}
          }
        }
        for(let i=0;i<this.px.length;i++){
          for(let j=i+1;j<this.px.length;j++){
            const a=this.px[i],b=this.px[j];
            const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy);
            const mn=PLAYER_R*2-1;
            if(dd<mn&&dd>0.01){const push=(mn-dd)*0.42,nx=dx/dd,ny2=dy/dd;a.x-=nx*push;a.y-=ny2*push;b.x+=nx*push;b.y+=ny2*push;}
          }
        }
      }
      updatePoss(dt){
        if(this.holder){if(this.holder.team==='A')this.posA+=dt;else this.posB+=dt;this.posTotal=this.posA+this.posB||1;return;}
        let closest=null,cd=PLAYER_R+BALL_R+4;
        for(const p of this.px){const d=Math.hypot(p.x-this.bx,p.y-this.by);if(d<cd){cd=d;closest=p;}}
        if(closest){
          if(this.holder&&this.holder.team!==closest.team&&closest.team==='A')this.pstats.intercepts++;
          closest.hasBall=true;this.holder=closest;
        }
      }
      checkGoals(){
        if(this.holder||this.goalLock>0)return;
        if(this.by<FY-12&&this.bx>CX-GOAL_W/2&&this.bx<CX+GOAL_W/2)this.doGoal('B');
        if(this.by>FY+FH+12&&this.bx>CX-GOAL_W/2&&this.bx<CX+GOAL_W/2)this.doGoal('A');
      }
      doGoal(team){
        if(this.goalLock>0)return;this.goalLock=1400;
        if(team==='A'){this.scoreA++;if(this.lastKick&&this.lastKick.isHuman)this.pstats.goals++;}
        else this.scoreB++;
        this.cheerTime=6; // crowd cheers for 6 seconds
        this.addComm('goal');
        // Flash white then fade
        this.tweens.add({targets:this.flashGfx,alpha:{from:0.8,to:0},duration:400,ease:'Power2'});
        // GOAL text — Sensible Soccer style: all caps, blocky
        const gcol=team==='A'?COL_A:COL_B;
        const gbg=this.add.graphics().setDepth(98);
        gbg.fillStyle(0x000000,0.78);gbg.fillRect(0,CY-38,W,76);
        const gtxt=this.add.text(W/2,CY,'G O A L !',{
          fontSize:'52px',fontFamily:'"Courier New",monospace',color:gcol,
          fontStyle:'bold',stroke:'#000000',strokeThickness:6
        }).setOrigin(0.5).setDepth(99);
        const gscr=this.add.text(W/2,CY+34,`${this.scoreA}  –  ${this.scoreB}`,{
          fontSize:'22px',fontFamily:'"Courier New",monospace',color:'#ffffff',stroke:'#000',strokeThickness:3
        }).setOrigin(0.5).setDepth(99);
        this.time.delayedCall(1000,()=>{gtxt.destroy();gscr.destroy();gbg.destroy();});
        this.time.delayedCall(900,()=>this.resetBall(true));
      }
      resetBall(resetPlayers){
        for(const p of this.px)p.hasBall=false;this.holder=null;this.lastKick=null;
        this.bx=CX;this.by=CY;
        this.bvx=(Math.random()-0.5)*14;this.bvy=(Math.random()>0.5?1:-1)*24; // mostly vertical
        if(resetPlayers)for(const p of this.px){p.x=p.fx;p.y=p.fy;p.vx=0;p.vy=0;}
      }
      doDraw(time){
        const g=this.gameGfx;g.clear();
        // All players using drawPlayer
        for(const p of this.px)this.drawPlayer(g,p);
        // ── Ball ──
        const bx=this.bx,by=this.by;
        g.fillStyle(0x000000,0.3);g.fillEllipse(bx+1,by+3,13,5);
        g.fillStyle(0xffffff);g.fillCircle(bx,by,BALL_R);
        g.fillStyle(0x111111,0.85);g.fillCircle(bx,by,BALL_R*0.36);
        const pents=[[0,-1],[0.95,-0.31],[0.59,0.81],[-0.59,0.81],[-0.95,-0.31]];
        pents.forEach(([px2,py2])=>{g.fillCircle(bx+px2*BALL_R*0.72,by+py2*BALL_R*0.72,BALL_R*0.24);});
        g.lineStyle(1.2,0x888888,0.6);g.strokeCircle(bx,by,BALL_R);
        // ── Possession bar (bottom controls area) ──
        const pp=this.posA/this.posTotal;
        const bw=240,bbarY=FY+FH+COMM+CTRL/2-4;
        g.fillStyle(0x1a2a1a);g.fillRoundedRect(W/2-bw/2,bbarY,bw,8,4);
        if(pp>0){const ca=Phaser.Display.Color.HexStringToColor(COL_A).color;g.fillStyle(ca);g.fillRoundedRect(W/2-bw/2,bbarY,bw*pp,8,4);}
        if(pp<1){const cb=Phaser.Display.Color.HexStringToColor(COL_B).color;g.fillStyle(cb);g.fillRoundedRect(W/2-bw/2+bw*pp,bbarY,bw*(1-pp),8,4);}
        // Number texts follow players
        for(let i=0;i<this.px.length;i++){
          const p=this.px[i];
          this.numTxts[i].setPosition(p.x+Math.cos(p._la||0)*3,p.y+3);
        }
        // Crowd animation
        this.drawCrowd(time);
      }
      doUI(){
        const m=Math.floor(this.mtime/60),s=Math.floor(this.mtime%60);
        this.timeTxt.setText(`${m}:${s.toString().padStart(2,'0')}`);
        this.scoreTxt.setText(`${this.scoreA}   ${this.scoreB}`);
        const pp=Math.round(this.posA/this.posTotal*100);
        if(this.mode==='narrative'){
          this.humanTxt.setText(`⚙ AUTO  · POSS ${pp}%`);
        } else {
          const rn=this.human.role==='GK'?'GK':this.human.role==='DEF'?'DEF':this.human.role==='MID'?'MID':'FWD';
          const tr=Math.ceil(this.kmTimer);
          this.humanTxt.setText(`▶ #${this.human.num} ${rn}  · ⏱${tr}s`);
        }
        if(this.commLog.length>0)this.commTxt.setText(this.commLog[0]);
        if(this.commLog.length>1)this.commTxt2.setText(this.commLog[1]);
        else this.commTxt2.setText('');
      }
      doEnd(){
        if(this.over)return;this.over=true;
        const result=this.scoreA>this.scoreB?'WIN':this.scoreA<this.scoreB?'LOSS':'DRAW';
        const pp=(this.posA/this.posTotal*100).toFixed(1);
        const pa=this.pstats.passAttempts>0?(this.pstats.passes/this.pstats.passAttempts*100).toFixed(1):'0';
        const rating=parseFloat(Math.max(5,Math.min(10,6+this.pstats.goals*0.6+this.pstats.assists*0.3+(result==='WIN'?0.5:result==='LOSS'?-0.3:0))).toFixed(1));
        const stats={squadAGoals:this.scoreA,squadBGoals:this.scoreB,playerGoals:this.pstats.goals,playerAssists:this.pstats.assists,playerShots:this.pstats.shots,playerShotsOnTarget:this.pstats.shotsOnTarget,playerPasses:this.pstats.passes,playerPassAccuracy:parseFloat(pa),playerTackles:this.pstats.tackles,playerTacklesWon:this.pstats.tacklesWon,playerIntercepts:this.pstats.intercepts,possessionPercent:parseFloat(pp),duration:MATCH_DUR,result,goals:this.pstats.goals,assists:this.pstats.assists,rating};
        const cb=this.registry.get('onMatchEnd');
        if(cb)setTimeout(()=>cb(stats),600);
      }
    }

    const config={type:Phaser.AUTO,width:W,height:H,parent:containerRef.current,backgroundColor:'#0d1117',scene:FMatch,audio:{noAudio:true},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:W,height:H}};
    const game=new Phaser.Game(config);
    gameRef.current=game;
    game.registry.set('onMatchEnd',onMatchEnd||function(){});
    return()=>{if(gameRef.current){gameRef.current.destroy(true);gameRef.current=null;}};
  },[]);// eslint-disable-line

  return <div ref={containerRef} style={{width:'100%',maxWidth:500,margin:'0 auto',borderRadius:8,overflow:'hidden',background:'#0a0f1a'}}/>;
}

   TRIAL FLOW
======================================== */
function TrialFlow({player:initPlayer,onComplete}){
  const[player,setPlayer]=useState(initPlayer),[trialNum,setTrialNum]=useState(0),[results,setResults]=useState([]),[phase,setPhase]=useState("pre");
  const opp={id:"trial",n:"Selezione Regionale",name:"Selezione Regionale",a:"REG",abbr:"REG",p:52,c:"#64748b",col:"#64748b",c2:"#fff",nat:"🇮🇹"};
  const onMatchEnd=r=>{const res={goals:r.goals,assists:r.assists,rating:r.rating};const nr=[...results,res];setResults(nr);setPlayer(p=>({...p,totalGoals:(p.totalGoals||0)+r.goals,totalAssists:(p.totalAssists||0)+r.assists,totalMatches:(p.totalMatches||0)+1}));setPhase("post");if(trialNum>=2)setTimeout(()=>onComplete(nr),300);};
  useEffect(()=>{
    if(phase==="match")return;
    const h=e=>{
      if(e.key!=="Enter"&&e.key!==" ")return;
      if(e.target.tagName==="INPUT"||e.target.tagName==="BUTTON")return;
      e.preventDefault();
      if(phase==="pre"){setPhase("match");}
      else if(phase==="post"){const done=trialNum>=2;if(!done){setTrialNum(n=>n+1);setPhase("pre");}}
    };
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[phase,trialNum]);// eslint-disable-line
  if(phase==="match")return<div style={{width:"100%"}}><div style={{textAlign:"center",marginBottom:8}}><div style={{display:"inline-block",padding:"4px 16px",borderRadius:20,background:"#eff6ff",border:"1px solid #bfdbfe",fontSize:11,color:TH.primary,fontWeight:700}}>🎯 PROVINO {trialNum+1}/3</div></div><LiveMatch player={player} opponent={opp} context="trial" onMatchEnd={onMatchEnd}/></div>;
  if(phase==="post"){const last=results[results.length-1],done=trialNum>=2;return <div style={{width:"100%"}}><Card style={{textAlign:"center",padding:"22px",maxWidth:520,margin:"0 auto"}}><div style={{fontSize:10,color:TH.warning,letterSpacing:2,marginBottom:8}}>PROVINO {trialNum+1} COMPLETATO</div><div style={{display:"flex",justifyContent:"center",gap:18,marginBottom:14,fontSize:16}}><span>⚽<strong>{last.goals}</strong></span><span>🎯<strong>{last.assists}</strong></span><span>⭐<strong style={{color:TH.warning}}>{last.rating}</strong></span></div>{done?<div style={{color:TH.success,fontSize:12,marginBottom:14}}>✅ Provini completati!</div>:<div style={{color:TH.muted,fontSize:12,marginBottom:14}}>Provino {trialNum+2}/3 in arrivo. <span style={{color:TH.faint}}>[Enter]</span></div>}<Btn onClick={done?()=>{}:()=>{setTrialNum(n=>n+1);setPhase("pre");}} v={done?"success":"primary"} fw style={{padding:"12px"}}>{done?"⏳ Calcolo offerte...":` Provino ${trialNum+2} →`}</Btn></Card></div>;}
  return <div style={{width:"100%",textAlign:"center"}}><div style={{marginBottom:22}}><div style={{fontSize:10,color:TH.warning,letterSpacing:2,marginBottom:8}}>PROVINO {trialNum+1} DI 3</div><div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:14}}>{[0,1,2].map(i=><div key={i} style={{width:30,height:30,borderRadius:"50%",background:i<trialNum?TH.success:i===trialNum?TH.warning:"#e2e8f0",border:`2px solid ${i<trialNum?TH.success:i===trialNum?TH.warning:"transparent"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:i<=trialNum?"#fff":TH.faint}}>{i<trialNum?"✓":i+1}</div>)}</div><h2 style={{fontSize:18,fontWeight:900,margin:"0 0 6px",color:TH.text}}>Provino vs {opp.n}</h2><p style={{color:TH.muted,fontSize:12}}>{trialNum>0?`Hai già segnato ${results.reduce((a,r)=>a+r.goals,0)} gol.`:"Mostra le tue qualità."}</p></div><Btn onClick={()=>setPhase("match")} fw style={{padding:"14px",fontSize:15}}>⚡ Inizia il provino <span style={{opacity:0.6,fontSize:12}}>[Enter]</span></Btn></div>;
}

/* ========================================
   RETIREMENT UTILITIES + CAREER END SCREEN  (Sprint 9)
======================================== */
function calcLegacyScore(p){
  const goals=p.totalGoals||0;
  const assists=p.totalAssists||0;
  const trophies=(p.trophies||[]).length;
  const caps=p.nationalCaps||0;
  const history=p.history||[];
  const peakOvr=history.reduce((mx,h)=>Math.max(mx,h.ovr||0),p.ovr||60);
  const seasons=Math.max(0,(p.season||1)-1);
  let score=0;
  score+=Math.min(goals*2,300);
  score+=Math.min(assists,100);
  score+=trophies*80;
  score+=Math.min(caps*10,150);
  score+=clamp((peakOvr-65)*5,0,150);
  score+=Math.min(seasons*5,100);
  return Math.round(clamp(score,0,1000));
}
function getLegacyGrade(score){
  if(score>=900)return{label:"Leggenda Assoluta",e:"👑",color:"#7c3aed"};
  if(score>=750)return{label:"Campione",e:"🏆",color:"#b45309"};
  if(score>=600)return{label:"Professionista Eccellente",e:"⭐",color:"#0369a1"};
  if(score>=400)return{label:"Onesta Carriera",e:"✅",color:"#16a34a"};
  if(score>=200)return{label:"Carriera Solida",e:"💪",color:"#4b5563"};
  return{label:"Inizio Promettente",e:"🌱",color:"#6b7280"};
}
function generateRetirementBio(p,legacyScore){
  const name=p.name||"Il giocatore";
  const seasons=Math.max(0,(p.season||1)-1);
  const goals=p.totalGoals||0;
  const matches=p.totalMatches||0;
  const trophies=(p.trophies||[]).length;
  const caps=p.nationalCaps||0;
  const clubs=[...new Set((p.history||[]).map(h=>h.club).filter(Boolean))];
  const lastClub=p.club?.n||clubs[clubs.length-1]||"–";
  const grade=getLegacyGrade(legacyScore);
  let bio=`${name} ha disputato ${seasons} stagioni da professionista, realizzando ${goals} gol in ${matches} presenze.`;
  if(trophies>0)bio+=` Ha conquistato ${trophies} titolo${trophies>1?"":""}${trophies>1?" istituzionali":"istituzionale"}.`;
  if(caps>0)bio+=` ${caps} cap${caps>1?"s":""} con la Nazionale.`;
  if(clubs.length>1)bio+=` Ha vestito la maglia di ${clubs.slice(-3).join(", ")}.`;
  bio+=` Ultima squadra: ${lastClub}. Legacy score: ${legacyScore} — "${grade.label}".`;
  return bio;
}

const generateBio=(p)=>{
  const name=p.name||"Il giocatore";
  const nation=p.nation||"Italia";
  const age=p.age||18;
  const tg=p.totalGoals||0;
  const tm=p.totalMatches||0;
  const seasons=(p.season||1)-1;
  const club=p.club?.n||p.club?.name||"–";
  const trophies=(p.trophies||[]).length;
  const ovr=p.ovr||60;
  const isPro=p.proStatus==="pro";
  let lines=[];
  if(seasons===0||tm===0){
    lines.push(`${name} è un giovane calciatore ${nation} di ${age} anni che sta muovendo i suoi primi passi nel calcio professionistico.`);
  } else if(tg>=100){
    lines.push(`${name}, ${age} anni, ${nation}. Cento gol in carriera parlano da soli: è uno degli attaccanti più prolifici del suo campionato.`);
  } else if(tg>=50){
    lines.push(`${name} ha scritto con i gol le pagine più belle della sua storia: ${tg} reti in ${tm} presenze, un nome che i difensori temono.`);
  } else if(tg>=20){
    lines.push(`${name}, ${age} anni, ${nation}. Con ${tg} gol in ${tm} presenze si è già guadagnato un posto nel panorama calcistico.`);
  } else {
    lines.push(`${name} è un calciatore ${nation} di ${age} anni. Con ${tm} presenze alle spalle sta costruendo la sua storia nel calcio.`);
  }
  if(trophies>=3){lines.push(`Ha conquistato ${trophies} trofei, diventando un simbolo di vittoria per i club in cui ha militato.`);}
  else if(trophies===1){lines.push(`Ha già alzato il primo trofeo in carriera — sa cosa significa vincere.`);}
  else if(isPro&&seasons>1){lines.push(`Attualmente con il ${club}, è ancora a caccia del primo grande titolo.`);}
  if(ovr>=90){lines.push(`Valutazione tecnica ${ovr}/99: un fuoriclasse assoluto.`);}
  else if(ovr>=80){lines.push(`Valutazione tecnica ${ovr}/99: tra i migliori in circolazione.`);}
  else if(ovr>=70){lines.push(`Valutazione tecnica ${ovr}/99: giocatore solido e affidabile.`);}
  else{lines.push(`Valutazione tecnica ${ovr}/99: ampi margini di crescita davanti a sé.`);}
  return lines.join(" ");
};
function CareerApp({player:init,currentSlot=0,onRefreshSlots,lang="IT",toggleLang,onNewGamePlusCB}){
  const[player,setPlayer]=useState(init);
  const[tab,setTab]=useState("dashboard");
  const[screen,setScreen]=useState("dashboard");
  const[standingsLg,setStandingsLg]=useState(null); // null = use player's own league
