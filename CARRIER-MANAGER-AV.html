function AvatarSVG({id=0, size=60, border=false}) {
  const p = AVATARS[id%AVATARS.length];
  const Hair = () => {
    const f = p.hair;
    switch(p.style){
      case "bald": return null;
      case "short": return <ellipse cx="50" cy="24" rx="28" ry="16" fill={f}/>;
      case "long": return <><ellipse cx="50" cy="24" rx="28" ry="16" fill={f}/><path d="M23 32 Q17 62 24 80" stroke={f} strokeWidth="10" fill="none" strokeLinecap="round"/><path d="M77 32 Q83 62 76 80" stroke={f} strokeWidth="10" fill="none" strokeLinecap="round"/></>;
      case "afro": return <circle cx="50" cy="20" r="32" fill={f}/>;
      case "curly": return <><ellipse cx="50" cy="22" rx="30" ry="18" fill={f}/><circle cx="28" cy="34" r="10" fill={f}/><circle cx="72" cy="34" r="10" fill={f}/></>;
      case "slick": return <path d="M22 18 Q50 8 78 18 Q80 38 76 34 Q50 22 24 34 Z" fill={f}/>;
      case "medium": return <><ellipse cx="50" cy="24" rx="29" ry="16" fill={f}/><path d="M22 32 Q20 54 26 66" stroke={f} strokeWidth="8" fill="none" strokeLinecap="round"/><path d="M78 32 Q80 54 74 66" stroke={f} strokeWidth="8" fill="none" strokeLinecap="round"/></>;
      case "straight": default: return <ellipse cx="50" cy="24" rx="28" ry="14" fill={f}/>;
    }

    <svg viewBox="0 0 100 100" width={size} height={size} style={{borderRadius:"50%",display:"block",overflow:"hidden",border:border?"2px solid "+TH.primary:"none"}}>

      <rect x="44" y="65" width="12" height="12" rx="3" fill={p.skin}/>

      <ellipse cx="23" cy="50" rx="4" ry="7" fill={p.skin}/>
      <ellipse cx="77" cy="50" rx="4" ry="7" fill={p.skin}/>
      <path d="M33 38 Q40 35 45 38" stroke={p.hair} strokeWidth="2.5" fill="none" strokeLinecap="round"/>
      <path d="M55 38 Q60 35 67 38" stroke={p.hair} strokeWidth="2.5" fill="none" strokeLinecap="round"/>

}

/* ========================================
   PLAYER 3D VIEWER
======================================== */
function Player3DViewer({avatarData,clubColor="#2563eb",width="100%",height="280px",animate=true}){
  const containerRef=useRef(null);
  const stateRef=useRef({renderer:null,animId:null,isDragging:false,lastX:0,playerGroup:null,bodyMesh:null,t:0});

  useEffect(()=>{
    const el=containerRef.current;
    if(!el||!THREE)return;
    const sr=stateRef.current;
    const av=avatarData||AVATARS[0];

    // Scene
    const scene=new THREE.Scene();
    const w=el.clientWidth||220,h=el.clientHeight||220;
    const camera=new THREE.PerspectiveCamera(55,w/h,0.1,100);
    camera.position.set(0,1.2,4.5);
    camera.lookAt(0,0.5,0);

    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(w,h);
    renderer.setClearColor(0xf0f7ff,1);
    renderer.shadowMap.enabled=true;
    el.appendChild(renderer.domElement);
    sr.renderer=renderer;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff,0.7));
    const dLight=new THREE.DirectionalLight(0xffffff,0.9);
    dLight.position.set(4,8,6);
    dLight.castShadow=true;
    scene.add(dLight);

    // Helper: hex → THREE color
    const col=hex=>new THREE.Color(hex);
    const mat=hex=>new THREE.MeshPhongMaterial({color:col(hex)});
    const mesh=(geo,hex)=>{const m=new THREE.Mesh(geo,mat(hex));m.castShadow=true;m.receiveShadow=true;return m;};

    const group=new THREE.Group();
    group.position.set(0,-1.5,0);
    scene.add(group);
    sr.playerGroup=group;

    // Head
    const head=mesh(new THREE.SphereGeometry(0.55,24,24),av.skin||"#f5c5a3");
    head.position.set(0,2.55,0);
    group.add(head);

    // Hair
    if(av.style!=="bald"){
      const hair=mesh(new THREE.SphereGeometry(0.6,24,24),av.hair||"#2d1800");
      hair.scale.set(1,0.55,1);
      hair.position.set(0,2.85,0);
      group.add(hair);
    }

    // Eyes
    const eyeGeo=new THREE.SphereGeometry(0.08,8,8);
    const eyeMat=new THREE.MeshPhongMaterial({color:col(av.eye||"#5a3e2b")});
    const eyeL=new THREE.Mesh(eyeGeo,eyeMat);eyeL.position.set(-0.18,2.6,0.5);group.add(eyeL);
    const eyeR=new THREE.Mesh(eyeGeo,eyeMat);eyeR.position.set(0.18,2.6,0.5);group.add(eyeR);

    // Beard
    if(av.beard){
      const beardMat=new THREE.MeshPhongMaterial({color:col(av.hair||"#2d1800"),transparent:true,opacity:0.65});
      const beard=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.08,8,12),beardMat);
      beard.scale.set(1,0.5,1);
      beard.position.set(0,2.3,0.1);
      group.add(beard);
    }

    // Body / jersey
    const body=mesh(new THREE.CylinderGeometry(0.38,0.32,1.1,12),clubColor);
    body.position.set(0,1.55,0);
    group.add(body);
    sr.bodyMesh=body;

    // Arms
    const armGeo=new THREE.CylinderGeometry(0.14,0.12,0.9,8);
    const armMat=new THREE.MeshPhongMaterial({color:col(clubColor)});
    const armL=new THREE.Mesh(armGeo,armMat);armL.position.set(-0.52,1.6,0);armL.rotation.z=0.25;group.add(armL);
    const armR=new THREE.Mesh(armGeo,armMat);armR.position.set(0.52,1.6,0);armR.rotation.z=-0.25;group.add(armR);

    // Legs
    const legGeo=new THREE.CylinderGeometry(0.17,0.14,1.0,8);
    const legMat=new THREE.MeshPhongMaterial({color:col("#1e293b")});
    const legL=new THREE.Mesh(legGeo,legMat);legL.position.set(-0.2,0.55,0);group.add(legL);
    const legR=new THREE.Mesh(legGeo,legMat);legR.position.set(0.2,0.55,0);group.add(legR);

    // Animation loop
    const loop=()=>{
      sr.animId=requestAnimationFrame(loop);
      if(animate){
        sr.t=(sr.t||0)+0.016;
        if(sr.bodyMesh)sr.bodyMesh.scale.y=0.97+Math.sin(sr.t*Math.PI)*0.03;
        sr.playerGroup.rotation.y+=0.004;
      }
      renderer.render(scene,camera);
    };
    loop();

    // Mouse drag rotate
    const onDown=e=>{sr.isDragging=true;sr.lastX=e.clientX??e.touches?.[0]?.clientX??0;};
    const onMove=e=>{
      if(!sr.isDragging)return;
      const x=e.clientX??e.touches?.[0]?.clientX??0;
      sr.playerGroup.rotation.y+=(x-sr.lastX)*0.01;
      sr.lastX=x;
    };
    const onUp=()=>{sr.isDragging=false;};
    el.addEventListener("mousedown",onDown);
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseup",onUp);
    el.addEventListener("touchstart",onDown,{passive:true});
    window.addEventListener("touchmove",onMove,{passive:true});
    window.addEventListener("touchend",onUp);

    // Resize
    const ro=new ResizeObserver(()=>{
      const nw=el.clientWidth,nh=el.clientHeight;
      camera.aspect=nw/nh;camera.updateProjectionMatrix();
      renderer.setSize(nw,nh);
    });
    ro.observe(el);

    return()=>{
      cancelAnimationFrame(sr.animId);
      ro.disconnect();
      el.removeEventListener("mousedown",onDown);
      window.removeEventListener("mousemove",onMove);
      window.removeEventListener("mouseup",onUp);
      el.removeEventListener("touchstart",onDown);
      window.removeEventListener("touchmove",onMove);
      window.removeEventListener("touchend",onUp);
      renderer.dispose();
      if(renderer.domElement.parentNode===el)el.removeChild(renderer.domElement);
    };
  },[avatarData,clubColor,animate]);

  return <div ref={containerRef} style={{width,height,overflow:"hidden",borderRadius:14,cursor:"grab"}}/>;
}

const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rng(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const wPick=evts=>{const tot=evts.reduce((s,e)=>s+(e.w||1),0);let r=Math.random()*tot;for(const e of evts){r-=(e.w||1);if(r<=0)return e;}return evts[0];};
function baseStats(){return{velocità:clamp(rng(55,72),1,99),tecnica:clamp(rng(54,70),1,99),fisico:clamp(rng(50,68),1,99),mentalità:clamp(rng(50,68),1,99),tiro:clamp(rng(60,74),1,99),passaggio:clamp(rng(48,65),1,99),dribbling:clamp(rng(55,72),1,99),posizionamento:clamp(rng(55,70),1,99)};}
function calcOvr(s){return Math.round((s.tiro*2.5+s.tecnica*2+s.velocità*1.5+s.dribbling*1.5+s.posizionamento*1.5+s.mentalità+s.fisico+s.passaggio)/11.5);}
function succRate(action,stats,playerX,oppPrestige=65){
  const sv=stats[action.stat]||60;
  // Realistic base: even a skilled player has ~45% on a solo vs 65-prestige opponent
  const base=(sv/99)*0.44+0.09+(action.bon||0)*0.006+(playerX-50)/100*0.03;
  // Meaningful difficulty penalty
  const diffPenalty=Math.max(0,(oppPrestige-55)/180);
  // Hard cap at 72%: even tap-ins can be missed
  return Math.round(clamp(base-diffPenalty,0.05,0.72)*100);
}
// Adaptive difficulty: returns a 0-1 multiplier that makes opponent harder when player is performing well
function adaptiveDifficulty(player){
  const ovr=player.ovr||60;
  const goals=player.goals||0;
  const matches=player.matches||1;
  const gpg=goals/Math.max(matches,1);
  // Base: slightly harder than even odds
  let factor=1.0;
  // Many goals per game → tighten defence
  if(gpg>1.2)factor+=0.18;
  else if(gpg>0.8)factor+=0.10;
  // High OVR → face stronger pressing
  if(ovr>80)factor+=0.12;
  else if(ovr>72)factor+=0.06;
  // High morale → opponents motivated too
  const morale=player.morale||70;
  if(morale>85)factor+=0.05;
  return clamp(factor,0.85,1.35);
}
// opponent strength affects goal probability in background events
function oppGoalProb(oppPrestige,playerOvr){
  return clamp(0.02+(oppPrestige-60)/800,0.01,0.06);
}
// Returns clubs from player's current league (for standings + opponents)
function getLeagueClubs(player){
  const isU18=(player?.proStatus||"u18")==="u18"||(player?.club?.isU18&&!player?.club?.transferType);
  if(isU18||!player?.club)return U18_CLUBS;
  const lg=player.club.lg||player.club.league;
  if(lg){const lc=CLUBS.filter(c=>c.lg===lg);if(lc.length>=4)return lc;}
  const nat=player.club.nat;
  if(nat){const nc=CLUBS.filter(c=>c.nat===nat);if(nc.length>=4)return nc;}
  return CLUBS.slice(0,16);
}

function transferCredibility(playerOvr,playerSeasons,playerMatches,clubPrestige,currentPrestige){
  // Gap between club prestige and player level
  const playerLevel=clamp(playerOvr*0.9+playerSeasons*3+Math.min(playerMatches,50)*0.2,30,99);

  if(gap>22)return false; // club way too prestigious
  if(clubPrestige>88&&playerOvr<74)return false; // elite clubs don't sign low-OVR players
  if(clubPrestige>92&&playerOvr<79)return false;
  if(clubPrestige>95&&playerOvr<84)return false;
  if(playerSeasons<=1&&clubPrestige>72)return false; // no elite interest in first season
  if(playerSeasons<=2&&clubPrestige>82)return false;
  return true;
}
// generate transfer offer based on player OVR and prestige match
function generateTransferOffer(player){
  const pOvr=player.ovr||60;
  const seasons=player.season||1;
  const matches=player.totalMatches||0;
  const currentP=player.club?.p||60;

  // OVR-based prestige range
  let minP,maxP;
  if(pOvr<65){minP=40;maxP=65;}
  else if(pOvr<70){minP=50;maxP=72;}
  else if(pOvr<74){minP=58;maxP=80;}
  else if(pOvr<78){minP=65;maxP=86;}
  else if(pOvr<82){minP=72;maxP=92;}
  else if(pOvr<86){minP=80;maxP=97;}
  else{minP=88;maxP=99;}

  // Season cap: early career blocks elite clubs
  if(seasons<=1)maxP=Math.min(maxP,70);
  else if(seasons<=2)maxP=Math.min(maxP,80);
  else if(seasons<=3)maxP=Math.min(maxP,88);

  let candidates=CLUBS.filter(c=>{
    if(c.id===player.club?.id||c.n===player.club?.n)return false;
    if(c.p<minP||c.p>maxP)return false;
    return transferCredibility(pOvr,seasons,matches,c.p,currentP);
  });

  if(!candidates.length){
    // Fallback: find any reasonable club
    candidates=CLUBS.filter(c=>c.id!==player.club?.id&&c.p>=40&&c.p<=clamp(pOvr+10,50,78));
  }
  if(!candidates.length)return null;

  const club=pick(candidates);
  const types=["prestito","prestito con riscatto","trasferimento definitivo"];
  const type=pOvr<65?"prestito":pOvr<73?pick(types.slice(0,2)):pick(types);
  return{club,type,minutaggio:type.includes("prest")?rng(30,70):rng(50,90),moralBonus:rng(5,20),growthBonus:rng(5,15),prestigeRatio:club.p/Math.max(1,currentP)};
}
// Generate pro contract offers at end of U18 career
function generateProContracts(player){
  const ovr=player.ovr||60;
  const u18S=player.u18Seasons||0;
  const forced=u18S>=2; // max 2 seasons: MUST leave
  const perf=Math.min(10,(player.goals||0)*0.35+(player.matches||0)*0.12+(ovr-50)/6);
  const offers=[];
  // 1. Same club first pro contract (always available)
  const parentName=((player.club?.n||player.club?.name||"?")+"").replace(/\s+U18\s*$/i,"").trim();
  const parentClub={...(player.club||{}),n:parentName,name:parentName,isU18:false,p:(player.club?.p||55)+12};
  offers.push({id:"same_pro",club:parentClub,contractType:"Primo contratto professionistico",wage:rng(600,Math.max(700,ovr*22)),duration:rng(1,3),role:ovr>=72?"Titolare giovane":ovr>=65?"Giovane promessa":"Riserva/Giovane",moralBonus:14,growthBonus:perf>5?20:10,isMain:true});
  // 2. External club (credibility-filtered)
  if(perf>2||forced){
    // OVR < 65 → only lower-tier clubs; OVR 65-72 → mid; OVR 73+ → higher
    const extMaxP=ovr>=73?clamp(ovr+8,70,86):ovr>=65?clamp(ovr+5,62,78):clamp(ovr+2,50,68);
    const extMinP=ovr>=73?65:ovr>=65?52:40;
    const extPool=CLUBS.filter(c=>c.p>=extMinP&&c.p<=extMaxP&&c.id!==parentClub.id);
    if(extPool.length){
      const ext=pick(extPool);
      offers.push({id:"external",club:ext,contractType:ovr>=65?"Trasferimento definitivo":"Prestito annuale",wage:rng(400,ovr*16),duration:ovr>=65?rng(1,3):1,role:ovr>=70?"Titolare":"Titolare garantito",moralBonus:8,growthBonus:15});
    }
  }
  // 3. Loan to smaller club (always as fallback)
  const loanPool=CLUBS.filter(c=>c.p<68&&c.id!==parentClub.id);
  const loanClub=pick(loanPool.length?loanPool:CLUBS);
  offers.push({id:"loan_small",club:loanClub,contractType:"Prestito",wage:rng(300,900),duration:1,role:"Minutaggio garantito",moralBonus:4,growthBonus:10});
  // 4. Stay another year in U18 (ONLY if under limit)
  if(!forced){
    const isLast=u18S>=1;
    offers.push({id:"stay_u18",club:player.club,contractType:`Resta in Under 18 (${u18S+1}/2)`,wage:player.contract?.wage||200,duration:1,role:"Protagonista U18",moralBonus:-6,growthBonus:4,isStayU18:true,isLastChance:isLast});
  }
  return{offers,forced,perf:Math.round(perf*10)/10};
}

async function callClaudeAPI(systemPrompt,userMessage){
  const key=localStorage.getItem("cpm-api-key")||window.__CPM_API_KEY||"";
  if(!key){console.log("[CPM-AI] No API key. Set via Settings → AI o window.__CPM_API_KEY");return{success:false,error:"no_key"};}
  const now=Date.now();
  if(now-_lastClaudeCall<CLAUDE_MIN_INTERVAL){console.log("[CPM-AI] Rate limited");return{success:false,error:"rate_limited"};}
  _lastClaudeCall=now;
  try{
    console.log("[CPM-AI] →",userMessage.slice(0,80));
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:CLAUDE_MODEL,max_tokens:CLAUDE_MAX_TOKENS,system:systemPrompt,messages:[{role:"user",content:userMessage}]}),
      signal:AbortSignal.timeout(12000),
    });
    if(!resp.ok){const t=await resp.text().catch(()=>"");console.warn("[CPM-AI] HTTP",resp.status,t.slice(0,120));return{success:false,error:`http_${resp.status}`};}
    const data=await resp.json();
    const text=data.content?.[0]?.text||"";
    console.log("[CPM-AI] ←",text.slice(0,200));
    try{const m=text.match(/\{[\s\S]*\}/);if(m)return{success:true,data:JSON.parse(m[0])};}catch{}

  }catch(e){console.warn("[CPM-AI] Error:",e.message);return{success:false,error:e.message};}
}

function seededShuffle(arr,seed){
  const a=[...arr];let s=(seed*1664525+1013904223)>>>0;
  for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
// calendar-driven match scheduling
function generateSeasonCalendar(playerClub,leagueClubs,seed){
  if(!playerClub||!leagueClubs?.length)return[];
  const opps=leagueClubs.filter(c=>c.id!==playerClub.id&&c.n!==playerClub.n);
  if(!opps.length)return[];
  const s=seed||1;
  const h1=seededShuffle([...opps],s);
  const h2=seededShuffle([...opps],s+999);
  const all=[...h1,...h2];
  const cal=[];let week=1;
  for(let i=0;i<all.length&&week<=38;i++){
    cal.push({matchday:i+1,week,opponentId:all[i].id,opponentName:all[i].n||all[i].name,isHome:i<h1.length,played:false,result:null});
    week+=1+(i%3===2?1:0);
  }
  return cal;
}
// standings start at zero each season, updated incrementally via updateStandings
function initStandings(clubs){
  return[...clubs].map(c=>({...c,played:0,wins:0,draws:0,losses:0,gf:0,ga:0,gd:0,pts:0}));
}
// simulate all other matches when player matchday ends
function updateStandings(standings,playerClubId,playerResult){
  if(!standings?.length)return[];
  const s=standings.map(t=>({...t}));
  if(playerResult){
    const pt=s.find(t=>t.id===playerClubId||t.n===playerClubId);
    if(pt){
      pt.played++;pt.gf+=playerResult.homeScore;pt.ga+=playerResult.awayScore;
      if(playerResult.won){pt.wins++;pt.pts+=3;}else if(playerResult.drew){pt.draws++;pt.pts+=1;}else{pt.losses++;}
      pt.gd=pt.gf-pt.ga;
    }
  }
  const myId=playerClubId;
  const others=s.filter(t=>t.id!==myId&&t.n!==myId);
  for(let i=0;i+1<others.length;i+=2){
    const h=others[i],a=others[i+1];
    const diff=clamp(((h.p||65)-(a.p||65))/30,-1,1);
    const lambdaH=clamp(1.15+diff*0.4,0.25,2.3);
    const lambdaA=clamp(1.00-diff*0.35,0.20,2.1);
    const hG=poissonGoals(lambdaH);
    const aG=poissonGoals(lambdaA);
    h.played++;a.played++;h.gf+=hG;h.ga+=aG;h.gd=h.gf-h.ga;
    a.gf+=aG;a.ga+=hG;a.gd=a.gf-a.ga;
    if(hG>aG){h.wins++;h.pts+=3;a.losses++;}else if(hG<aG){a.wins++;a.pts+=3;h.losses++;}
    else{h.draws++;h.pts++;a.draws++;a.pts++;}
  }
  return s.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
// context-aware realistic attendance
function calcAttendance(homeClub,context){
  const ctx=context||"career";
  if(ctx==="trial")return rng(80,320);
  const p=homeClub?.p||homeClub?.prestige||60;
  const isU18=homeClub?.isU18;
  if(isU18)return rng(150,900);
  if(p>=93)return rng(40000,76000);
  if(p>=80)return rng(16000,42000);
  if(p>=68)return rng(7000,20000);
  if(p>=55)return rng(2500,8000);
  return rng(600,3000);
}
// Poisson-like integer: most matches end 0-0, 1-0, 1-1, 2-1, 2-0
function poissonGoals(lambda){
  // Knuth algorithm for Poisson sample, capped at 5
  const L=Math.exp(-lambda);let k=0,p=1;
  do{k++;p*=Math.random();}while(p>L&&k<6);
  return Math.max(0,k-1);
}
// Quick simulation for skipped/missed match weeks
function simulateMatch(playerClub,opponent,playerOvr,isHome=true){
  const homeFactor=isHome?0.15:-0.15;
  const diff=clamp((playerOvr||65)-(opponent?.p||65),-30,30);
  const lambdaH=clamp(1.15+diff/55+homeFactor,0.25,2.4);
  const lambdaA=clamp(1.00-diff/65-homeFactor,0.20,2.2);
  const hG=poissonGoals(lambdaH);
  const aG=poissonGoals(lambdaA);
  return{homeScore:hG,awayScore:aG,won:hG>aG,drew:hG===aG,goals:0,assists:0,rating:hG>aG?6.5:hG===aG?6.0:5.5,opponent:opponent?.n||opponent?.name,oppAbbr:opponent?.a||opponent?.abbr,oppCol:opponent?.c||opponent?.col,simulated:true};
}

function makeCrowdTex(homeBias,homeHex,awayHex,prestige=70){
  const W=512,H=320,c=document.createElement("canvas");c.width=W;c.height=H;
  const ctx=c.getContext("2d");
  // Gradient background — depth effect: darker at top
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,"#0e0e1c");gr.addColorStop(1,"#1a1a2e");
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  // Concrete step lines between rows
  const rows=Math.ceil(10+prestige/18),cols=Math.ceil(20+prestige/10);
  const rH=H/rows,cW=W/cols;
  for(let r=0;r<rows;r++){
    ctx.fillStyle="rgba(100,100,130,0.25)";ctx.fillRect(0,r*rH,W,1.5);
  }
  const SKINS=["#f5c5a3","#e8a870","#c8956a","#8B5030","#7c4a1e"];
  for(let r=0;r<rows;r++){
    for(let cl=0;cl<cols;cl++){
      const bx=cl*cW,by=r*rH;
      const x=bx+cW/2+(Math.random()-.5)*cW*0.22;
      const y=by+rH*0.7;
      const isH=Math.random()<homeBias;
      // Empty seat occasionally
      if(Math.random()<0.05){ctx.fillStyle="#303040";ctx.fillRect(bx+1,by+rH*0.72,cW-2,rH*0.28);continue;}
      // Seat
      ctx.fillStyle="#3a3a50";ctx.fillRect(bx+1,by+rH*0.72,cW-2,rH*0.28);
      // Body (jersey)
      ctx.fillStyle=isH?homeHex:awayHex;
      ctx.fillRect(x-cW*0.3,y-rH*0.08,cW*0.6,rH*0.42);
      // Head
      ctx.fillStyle=SKINS[Math.floor(Math.random()*SKINS.length)];
      ctx.beginPath();ctx.arc(x,y-rH*0.22,cW*0.23,0,Math.PI*2);ctx.fill();
      // Hair
      ctx.fillStyle=["#1a0800","#3d2000","#c0c0c0","#d4a820","#8B4513"][Math.floor(Math.random()*5)];
      ctx.beginPath();ctx.arc(x,y-rH*0.32,cW*0.23,Math.PI,Math.PI*2);ctx.fill();
      // Flag (rare)
      if(Math.random()<0.04){
        ctx.fillStyle="#aaaacc";ctx.fillRect(x+cW*0.1,y-rH*0.85,1.8,rH*0.65);
        ctx.fillStyle=isH?homeHex:awayHex;ctx.fillRect(x+cW*0.1,y-rH*0.85,cW*0.42,rH*0.2);
      }
      // Scarf
      if(Math.random()<0.07){ctx.fillStyle=isH?homeHex:awayHex;ctx.fillRect(x-cW*0.3,y+rH*0.05,cW*0.6,rH*0.1);}
    }
  }
  return new THREE.CanvasTexture(c);
}

function buildStadium(scene,homeHex,awayHex,stadCfg={prestige:65,style:0}){
  // Scale by prestige: XL(>88) / LG(>72) / MD(>55) / SM(<55)
  const p=typeof stadCfg==="number"?stadCfg:stadCfg.prestige||65;
  const style=typeof stadCfg==="object"?stadCfg.style||0:0;
  const xl=p>88,lg=p>72,md=p>55;
  const endZ=xl?64:lg?56:md?50:44;
  const sideX=xl?78:lg?70:md?64:58;
  const endH=xl?22:lg?16:md?13:10;
  const sideH=xl?20:lg?14:md?11:8;
  const endD=xl?28:lg?20:md?16:13;
  const sideD=xl?26:lg?20:md?16:13;
  const endW=xl?126:lg?118:md?110:100;
  const sideW=xl?84:lg?76:md?68:60;
  const crowdBias=xl?0.91:lg?0.80:md?0.65:0.50;
  // Style variation: 0=standard, 1=modern dark, 2=compact bowl, 3=traditional
  const roofOpacity=style===1?0.90:style===2?0.70:0.80;
  const roofColor=style===1?0x333344:style===3?0x888877:0x555566;
  const floodH=xl?32:lg?28:md?24:20; // floodlight pole height
  const cM=new THREE.MeshLambertMaterial({color:0x32323e});
  const stM=new THREE.MeshLambertMaterial({color:0x808088});
  const roofM=new THREE.MeshLambertMaterial({color:roofColor,transparent:true,opacity:roofOpacity});
  const hTex=makeCrowdTex(0.88,homeHex,awayHex,p);
  const aTex=makeCrowdTex(0.12,homeHex,awayHex,p);
  const mTex=makeCrowdTex(crowdBias,homeHex,awayHex,p);

  // Helper: create a tiered stand section
  const addStand=(cx,cz,rotY,standW,standD,standH,crowdTex)=>{
    const g=new THREE.Group();
    // Main crowd wall (slightly angled for perspective)
    const wallMat=new THREE.MeshLambertMaterial({color:0xffffff,map:crowdTex});
    const wall=new THREE.Mesh(new THREE.BoxGeometry(standW,standH,standD),wallMat);
    wall.position.set(0,standH/2,0);wall.receiveShadow=true;g.add(wall);
    // Concrete base strip
    const base=new THREE.Mesh(new THREE.BoxGeometry(standW+2,3,standD+3),cM);
    base.position.set(0,1.5,0);g.add(base);
    // Roof overhang
    const roof=new THREE.Mesh(new THREE.BoxGeometry(standW+8,0.8,standD*0.4),roofM);
    roof.position.set(0,standH+1.4,-(standD*0.3));g.add(roof);
    // Roof supports (pillars at edges)
    [-standW/2+4,standW/2-4].forEach(px=>{
      const pl=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,standH+2,8),stM);
      pl.position.set(px,standH/2+1,-(standD*0.28));g.add(pl);
    });
    // Fence rail at pitch-side bottom
    const fence=new THREE.Mesh(new THREE.BoxGeometry(standW,0.9,0.3),new THREE.MeshLambertMaterial({color:0x2a6038}));
    fence.position.set(0,0.45,-(standD/2+0.15));g.add(fence);
    g.position.set(cx,0,cz);g.rotation.y=rotY;
    scene.add(g);
  };

  // End stands (behind goals) — scaled by prestige
  addStand(0,-endZ,0,       endW,endD,endH,hTex); // Home end
  addStand(0, endZ,Math.PI, endW,endD,endH,aTex); // Away end
  // Side stands — scaled
  addStand(sideX, 0, Math.PI/2, sideW,sideD,sideH,mTex); // Right side
  addStand(-sideX,0,-Math.PI/2, sideW,sideD,sideH,mTex); // Left side
  // Corner sections — filled or open based on style
  const hasCorners=style!==3; // style 3 = traditional, open corners
  if(hasCorners)[[-sideX,-endZ,Math.PI/4],[sideX,-endZ,-Math.PI/4],[-sideX,endZ,3*Math.PI/4],[sideX,endZ,-3*Math.PI/4]].forEach(([x,z,ry])=>{
    const cH=Math.round((endH+sideH)/2)*0.8;
    const cm=new THREE.Mesh(new THREE.BoxGeometry(24,cH,24),new THREE.MeshLambertMaterial({color:0xffffff,map:mTex}));
    cm.position.set(x,cH/2,z);cm.rotation.y=ry;scene.add(cm);
    const cb=new THREE.Mesh(new THREE.BoxGeometry(24,2,24),cM);cb.position.set(x,1,z);scene.add(cb);
  });

  // Floodlights — TV broadcast: cool white, high intensity, aimed at pitch
  const lightColor=0xf4f8ff; // cool stadium white
  [[-sideX+8,-endZ+8],[sideX-8,-endZ+8],[-sideX+8,endZ-8],[sideX-8,endZ-8]].forEach(([x,z])=>{
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,floodH,8),stM);
    pole.position.set(x,floodH/2,z);pole.castShadow=true;scene.add(pole);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,8),stM);
    arm.position.set(x+(x>0?-4:4),floodH+2,z);scene.add(arm);
    // Floodlight head bank — bright white
    const head=new THREE.Mesh(new THREE.BoxGeometry(5,0.8,2.5),new THREE.MeshBasicMaterial({color:0xfffff0,emissive:0xfffff0}));
    head.position.set(x+(x>0?-4:4),floodH+2.5,z);scene.add(head);
    // SpotLight pointing down at pitch — focused beam, realistic TV look
    const spot=new THREE.SpotLight(lightColor,2.8,180,Math.PI/5,0.3,1.2);
    spot.position.set(x+(x>0?-5:5),floodH+5,z);
    spot.target.position.set(0,0,0);scene.add(spot);scene.add(spot.target);
    // Soft fill PointLight at lower intensity
    const fl=new THREE.PointLight(lightColor,1.0,280);fl.position.set(x+(x>0?-5:5),floodH+4,z);scene.add(fl);
  });

  // Goal nets (wireframe-style transparent planes)
  const netM=new THREE.MeshBasicMaterial({color:0xfafafa,transparent:true,opacity:0.14,side:THREE.DoubleSide,wireframe:false});
  [[-51,1],[ 51,-1]].forEach(([gx,sign])=>{
    // Back net
    const back=new THREE.Mesh(new THREE.PlaneGeometry(7.32,2.44),netM);
    back.rotation.y=Math.PI/2;back.position.set(gx+sign*1.6,1.22,0);scene.add(back);
    // Side nets
    [-3.66,3.66].forEach(gz=>{
      const side=new THREE.Mesh(new THREE.PlaneGeometry(2,2.44),netM);
      side.position.set(gx+sign*0.85,1.22,gz);scene.add(side);
    });
    // Top net
    const top=new THREE.Mesh(new THREE.PlaneGeometry(7.32,2),netM);
    top.rotation.x=Math.PI/2;top.position.set(gx+sign*0.85,2.44,-sign*0.5);scene.add(top);
  });

  // Advertising boards — alternate home/away colors, more realistic
  const hColor=new THREE.Color(homeHex),aColor=new THREE.Color(awayHex);
  const wColor=new THREE.Color(0xfafafa);
  const addAd=(ax,az,aw,ah,rotY,idx)=>{
    const col=idx%3===0?hColor:idx%3===1?aColor:wColor;
    const m=new THREE.Mesh(new THREE.BoxGeometry(aw,ah,0.22),new THREE.MeshLambertMaterial({color:col}));
    m.position.set(ax,ah/2,az);m.rotation.y=rotY;scene.add(m);
    // Small text-like stripe on top
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(aw,0.15,0.24),new THREE.MeshLambertMaterial({color:0x111111}));
    stripe.position.set(ax,ah+0.075,az);stripe.rotation.y=rotY;scene.add(stripe);
  };
  let idx=0;
  for(let i=-44;i<=44;i+=11){addAd(i,-33.2,9,1.3,0,idx++);addAd(i,33.2,9,1.3,Math.PI,idx++);}
  for(let i=-28;i<=28;i+=12){addAd(53.2,i,9,1.3,Math.PI/2,idx++);addAd(-53.2,i,9,1.3,-Math.PI/2,idx++);}

  // Corner flags (thicker, more visible)
  const flagMat=new THREE.MeshLambertMaterial({color:new THREE.Color(homeHex)});
  const poleMat=new THREE.MeshLambertMaterial({color:0xffffff});
  [[-50,-30],[-50,30],[50,-30],[50,30]].forEach(([fx,fz])=>{
    const fp=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.6,8),poleMat);fp.position.set(fx,0.8,fz);scene.add(fp);
    const flag=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.65),flagMat);
    flag.position.set(fx+(fx>0?-0.55:0.55),1.75,fz);flag.rotation.y=Math.PI/4;flag.castShadow=true;scene.add(flag);
  });

  // Player tunnel
  const tun=new THREE.Mesh(new THREE.BoxGeometry(6,4.5,3.5),new THREE.MeshLambertMaterial({color:0x181824}));
  tun.position.set(-71.5,2.25,-2);scene.add(tun);

  // Pitch perimeter track (orange)
  const trackMat=new THREE.MeshLambertMaterial({color:0xbb4c0a});
  const tN=new THREE.Mesh(new THREE.PlaneGeometry(106,5),trackMat);tN.rotation.x=-Math.PI/2;tN.position.set(0,0.02,-33);scene.add(tN);
  const tS=tN.clone();tS.position.z=33;scene.add(tS);
  const tE=new THREE.Mesh(new THREE.PlaneGeometry(4.5,62),trackMat);tE.rotation.x=-Math.PI/2;tE.position.set(53.5,0.02,0);scene.add(tE);
  const tW=tE.clone();tW.position.x=-53.5;scene.add(tW);
}

/* =====================================================
   PITCH CANVAS — Modern 2D portrait football renderer
   Goals at top/bottom (vertical Sensible Soccer style)
===================================================== */
const PC_PW=360,PC_PH=580,PC_FX=30,PC_FY=40,PC_FW=300,PC_FH=480;
const PC_FCX=PC_FX+PC_FW/2,PC_FCY=PC_FY+PC_FH/2;
function PitchCanvas({playerX,playerY,zone,homeCol,oppCol,opponents,matchPhase,onWalkoutDone,avatarId,actionZoom,allPlayers,homeClub,ballX,ballY,waveEvent,driftTargets,timeOfDay,attendance,actionEffect}){
  homeCol=homeCol||"#22c55e";oppCol=oppCol||"#ef4444";opponents=opponents||[];
  matchPhase=matchPhase||"match";actionZoom=actionZoom||false;allPlayers=allPlayers||[];
  const canvasRef=useRef(null);
  const stateRef=useRef({
    camX:PC_FCX,camY:PC_FCY,camZoom:1,
    walkProgress:0,walkDone:false,
    ballX:50,ballY:50,
    prevPX:50,prevPY:50,isMoving:false,movingTimer:0,
    particles:[],frameId:null,lastT:0,
    livePos:[],fogPhase:0,photoFlashT:0,
    netBulgeTop:0,netBulgeBot:0
  });
  const propsRef=useRef({playerX,playerY,zone,homeCol,oppCol,opponents,matchPhase,onWalkoutDone,avatarId,actionZoom,allPlayers,homeClub,ballX:ballX||50,ballY:ballY||50,waveEvent,driftTargets,timeOfDay:timeOfDay||"night",attendance:attendance||500});
  useEffect(()=>{propsRef.current={playerX,playerY,zone,homeCol,oppCol,opponents,matchPhase,onWalkoutDone,avatarId,actionZoom,allPlayers,homeClub,ballX:ballX||50,ballY:ballY||50,waveEvent,driftTargets,timeOfDay:timeOfDay||"night",attendance:attendance||500};},[playerX,playerY,zone,homeCol,oppCol,opponents,matchPhase,onWalkoutDone,avatarId,actionZoom,allPlayers,homeClub,ballX,ballY,waveEvent,driftTargets,timeOfDay,attendance]);

  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const s=stateRef.current;
    const PW=PC_PW,PH=PC_PH,FX=PC_FX,FY=PC_FY,FW=PC_FW,FH=PC_FH,FCX=PC_FCX,FCY=PC_FCY;

    // Portrait: field runs top-bottom, home attacks toward top (y decreases = forward)
    // game x=0-100 maps to canvas y (top=0 goal, bottom=100 goal)
    // game y=0-100 maps to canvas x (left=0, right=100)
    // so: canvasX = FX + gameY/100*FW,  canvasY = FY + gameX/100*FH
    const gx=gy_=>FX+gy_/100*FW;          // game y → canvas x
    const gy=gx_=>FY+FH*(1-gx_/100);      // game x → canvas y (home BOTTOM, attacks upward ↑)

    // Pre-bake grass texture
    const grassOff=document.createElement("canvas");grassOff.width=PW;grassOff.height=PH;
    const gc=grassOff.getContext("2d");
    // Horizontal stripes with subtle brightness variation per stripe
    const stripeH=FH/10;
    for(let i=0;i<10;i++){
      // alternate base colors + small random brightness offset per stripe
      const bVar=(((i*37+13)%7)-3)*2; // -6..+6 brightness nudge, deterministic
      const r1=26+bVar,g1=107+bVar,b1=40+bVar;
      const r2=29+bVar,g2=117+bVar,b2=48+bVar;
      gc.fillStyle=i%2===0?`rgb(${r1},${g1},${b1})`:`rgb(${r2},${g2},${b2})`;
      gc.fillRect(FX,FY+i*stripeH,FW,stripeH);
      // thin micro-noise line at each stripe boundary
      gc.fillStyle="rgba(0,0,0,0.06)";
      gc.fillRect(FX,FY+i*stripeH,FW,1);
    }
    // Vertical micro-noise (blade texture feel)
    for(let i=0;i<3200;i++){
      const nx=FX+Math.random()*FW,ny=FY+Math.random()*FH;
      gc.fillStyle=`rgba(0,0,0,${Math.random()*0.05})`;gc.fillRect(nx,ny,1,Math.random()<0.3?2:1);
    }
    // Radial centre-bright vignette (brighter centre, darker edges — stadium light feel)
    const pgv=gc.createRadialGradient(FCX,FCY,FH*0.08,FCX,FCY,FH*0.72);
    pgv.addColorStop(0,"rgba(255,255,255,0.04)");pgv.addColorStop(0.6,"rgba(0,0,0,0)");pgv.addColorStop(1,"rgba(0,0,0,0.28)");
    gc.fillStyle=pgv;gc.fillRect(FX,FY,FW,FH);

    // ── Crowd + stadium static pre-bake (Phase 3) ──────────────────────────────
    const crowdOff=document.createElement("canvas");crowdOff.width=PW;crowdOff.height=PH;
    const cctx=crowdOff.getContext("2d");
    let _crowdKey="";
    function bakeCrowd(hCol,oCol,fillRatio,isNight){
      const key=hCol+oCol+fillRatio.toFixed(2)+(isNight?"n":"d");
      if(key===_crowdKey)return;
      _crowdKey=key;
      cctx.clearRect(0,0,PW,PH);
      // Bowl background
      cctx.fillStyle=isNight?"#010208":"#02040b";cctx.fillRect(0,0,PW,PH);
      const bowlG=cctx.createRadialGradient(FCX,FCY,40,FCX,FCY,260);
      bowlG.addColorStop(0,"rgba(20,80,40,0.14)");bowlG.addColorStop(1,"rgba(0,0,0,0.6)");
      cctx.fillStyle=bowlG;cctx.fillRect(0,0,PW,PH);
      // Seat rows per stand zone
      function bakeSD(x,y,w,h,homeRatio){
        if(w<3||h<3)return;
        const cw=4,rh=4,cols=Math.ceil(w/cw),rows=Math.ceil(h/rh);

      cctx.fillStyle=lG;cctx.fillRect(0,FY,FX,FH);
      const rG=cctx.createLinearGradient(FX+FW,0,PW,0);rG.addColorStop(0,"#1a2840");rG.addColorStop(1,"#0d1520");
      cctx.fillStyle=rG;cctx.fillRect(FX+FW,FY,PW-FX-FW,FH);
      // Crowd dots (static snapshot — ola animation added per-frame on top)
      const dotW=fillRatio>0.6?3:fillRatio>0.3?4:5;
      const pal=["#e11d48","#f59e0b","#3b82f6","#10b981","#fff","#a855f7","#fbbf24","#ef4444"];
      [[FX,2,FW,FY-4],[FX,FY+FH+4,FW,PH-FY-FH-6]].forEach(([sx,sy,sw,sh])=>{
        if(sh<4)return;const cols=Math.floor(sw/dotW),rows=Math.floor(sh/dotW);
        for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){

          cctx.fillStyle=pal[(r*7+c*13)%pal.length];cctx.globalAlpha=0.52;

        }
      });
      [[2,FY,FX-4,FH],[FX+FW+4,FY,PW-FX-FW-6,FH]].forEach(([sx,sy,sw,sh])=>{
        if(sw<4)return;const cols=Math.floor(sw/dotW),rows=Math.floor(sh/dotW);
        for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
          if(((r*29+c*19)%100)/100>fillRatio)continue;

                 {col:"#7c3aed",t:"EA FC"},{col:"#0369a1",t:"PEPSI"},{col:"#c2410c",t:"BUDW"},

      ads.forEach((b,i)=>{

    function drawStadium(ctx,t){
      const p=propsRef.current;
      const hCol=p.homeCol||"#2563eb",oCol=p.oppCol||"#dc2626";
      const att=p.attendance||500;
      const fillRatio=Math.min(1,Math.max(0.15,(att-150)/75000*0.85+0.15));
      const isNight=p.timeOfDay==="night";
      // Draw pre-baked static crowd (invalidates when colours/fill change)
      bakeCrowd(hCol,oCol,fillRatio,isNight);
      ctx.drawImage(crowdOff,0,0);
      // ── Dynamic: ola wave + photo flashes (per-frame) ──
      const wEvt=p.waveEvent;
      const waveAge=wEvt?(Date.now()-wEvt.t):999999;
      const goalBurst=Math.max(0,1-waveAge/5000);
      const waveSpd=t*0.0012,waveAmp=4.5+goalBurst*14,waveAlpha=0.22+goalBurst*0.30;
      const flashCol=wEvt&&goalBurst>0.05?(wEvt.home?p.homeCol:"#ef4444"):"#fff";
      for(let wi=0;wi<Math.ceil(FW/5);wi++){
        const wx=FX+wi*5,wh=Math.max(0,Math.sin(waveSpd*3+wi*0.22)*waveAmp);
        if(wh>0.5){ctx.save();ctx.globalAlpha=waveAlpha;ctx.fillStyle=flashCol;ctx.fillRect(wx,2,5,Math.min(wh,FY-3));ctx.fillRect(wx,FY+FH+2,5,Math.min(wh,PH-FY-FH-4));ctx.restore();}
      }
      if(Math.random()<0.012+goalBurst*0.06){
        const fx=FX+Math.random()*FW,fy=2+Math.random()*(FY-5);
        const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,8);
        fg.addColorStop(0,"rgba(255,255,255,0.7)");fg.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle=fg;ctx.fillRect(fx-8,fy-8,16,16);
      }
      // Goal burst crowd colour overlay
      if(goalBurst>0.05){
        ctx.save();ctx.globalAlpha=goalBurst*0.18;ctx.fillStyle=flashCol;
        ctx.fillRect(FX,2,FW,FY-3);ctx.fillRect(FX,FY+FH+2,FW,PH-FY-FH-4);
        ctx.restore();
      }
    }

    function drawPitch(ctx){
      ctx.drawImage(grassOff,0,0);
      // Day/Night overlay
      const isNight=propsRef.current.timeOfDay==="night";
      if(isNight){
        // dark tint over pitch
        ctx.save();ctx.globalAlpha=0.30;ctx.fillStyle="#000a18";
        ctx.fillRect(FX,FY,FW,FH);ctx.restore();
        // floodlight cone glows at four corners — warm white
        [[FX,FY],[FX+FW,FY],[FX,FY+FH],[FX+FW,FY+FH]].forEach(([lx,ly])=>{
          const gr=ctx.createRadialGradient(lx,ly,0,lx,ly,FH*0.38);
          gr.addColorStop(0,"rgba(255,248,210,0.17)");
          gr.addColorStop(0.5,"rgba(255,248,210,0.05)");
          gr.addColorStop(1,"rgba(255,248,210,0)");
          ctx.fillStyle=gr;ctx.fillRect(FX-4,FY-4,FW+8,FH+8);
        });
      }
      // Border glow — brighter at night (floodlit edge)
      ctx.save();ctx.shadowColor=isNight?"#fffad0":"#00cc66";ctx.shadowBlur=isNight?14:10;
      ctx.strokeStyle="#fff";ctx.lineWidth=1.5;
      ctx.strokeRect(FX,FY,FW,FH);ctx.restore();
      // Centre line
      ctx.strokeStyle="rgba(255,255,255,0.78)";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(FX,FCY);ctx.lineTo(FX+FW,FCY);ctx.stroke();
      // Centre circle + dot
      ctx.beginPath();ctx.arc(FCX,FCY,FH*0.10,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(FCX,FCY,3,0,Math.PI*2);ctx.fill();
      // Corner arcs
      const cAR=FH*0.024;
      ctx.beginPath();ctx.arc(FX,FY,cAR,0,Math.PI/2);ctx.stroke();
      ctx.beginPath();ctx.arc(FX+FW,FY,cAR,Math.PI/2,Math.PI);ctx.stroke();
      ctx.beginPath();ctx.arc(FX,FY+FH,cAR,-Math.PI/2,0);ctx.stroke();
      ctx.beginPath();ctx.arc(FX+FW,FY+FH,cAR,Math.PI,-Math.PI/2);ctx.stroke();
      // Penalty areas (top and bottom)
      const paW=FW*0.56,paH=FH*0.16;
      const paX=FCX-paW/2;
      ctx.strokeRect(paX,FY,paW,paH);                   // top penalty area
      ctx.strokeRect(paX,FY+FH-paH,paW,paH);            // bottom penalty area
      // Goal areas
      const gaW=FW*0.30,gaH=FH*0.065;
      const gaX=FCX-gaW/2;
      ctx.strokeRect(gaX,FY,gaW,gaH);
      ctx.strokeRect(gaX,FY+FH-gaH,gaW,gaH);
      // Penalty arc (lunetta) — arc OUTSIDE penalty box
      const arcR=FH*0.095;
      ctx.beginPath();ctx.arc(FCX,FY+paH,arcR,Math.PI,0,true);ctx.stroke();  // top arc
      ctx.beginPath();ctx.arc(FCX,FY+FH-paH,arcR,0,Math.PI,true);ctx.stroke(); // bottom arc
      // Goals: net grid with optional bulge animation
      const gW=FW*0.28,gD=12,gX=FCX-gW/2;
      const bT=s.netBulgeTop||0,bB=s.netBulgeBot||0;
      function drawNet(gx2,gy2,w,h,bulge,dirY){
        // net fill
        ctx.save();ctx.fillStyle="rgba(255,255,255,0.07)";ctx.fillRect(gx2,gy2,w,h);
        // grid lines
        ctx.strokeStyle="rgba(255,255,255,0.32)";ctx.lineWidth=0.5;
        const COLS=10,ROWS=3;
        for(let c=0;c<=COLS;c++){
          const nx=gx2+c/COLS*w;
          const bx=bulge*Math.sin(c/COLS*Math.PI)*4;
          const backY=gy2+(dirY>0?h:0);const openY=gy2+(dirY>0?0:h);
          ctx.beginPath();ctx.moveTo(nx,openY);ctx.quadraticCurveTo(nx+bx,gy2+h*0.5,nx+bx,backY);ctx.stroke();
        }
        for(let r=0;r<=ROWS;r++){
          const t2=r/ROWS;
          const ny=gy2+(dirY>0?t2*h:(1-t2)*h);
          const pushY=bulge*dirY*t2*5;
          ctx.beginPath();ctx.moveTo(gx2,ny+pushY);ctx.lineTo(gx2+w,ny+pushY);ctx.stroke();
        }
        // frame (posts+crossbar)
        ctx.strokeStyle="rgba(255,255,255,0.55)";ctx.lineWidth=1;ctx.strokeRect(gx2,gy2,w,h);
        ctx.restore();
      }
      drawNet(gX,FY-gD,gW,gD,bT,-1);  // top goal (away net)
      drawNet(gX,FY+FH,gW,gD,bB,1);   // bottom goal (home net)
      // Goal posts — white, on top of net
      ctx.save();ctx.strokeStyle="#fff";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(gX,FY);ctx.lineTo(gX,FY-gD);ctx.lineTo(gX+gW,FY-gD);ctx.lineTo(gX+gW,FY);ctx.stroke();
      ctx.beginPath();ctx.moveTo(gX,FY+FH);ctx.lineTo(gX,FY+FH+gD);ctx.lineTo(gX+gW,FY+FH+gD);ctx.lineTo(gX+gW,FY+FH);ctx.stroke();
      ctx.restore();
      // Penalty spots
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(FCX,FY+FH*0.115,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(FCX,FY+FH*0.885,2,0,Math.PI*2);ctx.fill();
      // Corner arcs
      ctx.strokeStyle="rgba(255,255,255,0.6)";ctx.lineWidth=1;
      [[FX,FY,0,Math.PI*0.5],[FX+FW,FY,Math.PI*0.5,Math.PI],[FX,FY+FH,Math.PI*1.5,Math.PI*2],[FX+FW,FY+FH,Math.PI,Math.PI*1.5]]
        .forEach(([cx,cy,a1,a2])=>{ctx.beginPath();ctx.arc(cx,cy,8,a1,a2);ctx.stroke();});
      // Zone highlight — animated pulsing glow
      const z=propsRef.current.zone;
      const t2=propsRef.current._t||0;
      const zMap={propria:[0,25],difesa:[25,42],centro:[42,58],trequarti:[58,75],bordo:[75,88],area:[88,100]};
      const zCol={propria:"#6366f1",difesa:"#3b82f6",centro:"#10b981",trequarti:"#f59e0b",bordo:"#ef4444",area:"#dc2626"};
      if(zMap[z]){
        const[zx1,zx2]=zMap[z];
        const zy1=gy(zx2),zy2=gy(zx1),zh2=zy2-zy1;
        const pulse=0.08+Math.sin(t2*0.003)*0.06; // 0.02–0.14 alpha oscillation
        // gradient fill: stronger near player side
        const zGrad=ctx.createLinearGradient(FX,zy1,FX,zy1+zh2);
        zGrad.addColorStop(0,(zCol[z]||"#fff")+"00");
        zGrad.addColorStop(0.4,(zCol[z]||"#fff")+Math.round(pulse*255).toString(16).padStart(2,"0"));
        zGrad.addColorStop(1,(zCol[z]||"#fff")+"00");
        ctx.fillStyle=zGrad;
        ctx.fillRect(FX,zy1,FW,zh2);
        // dashed border
        const borderAlpha=0.3+Math.sin(t2*0.003+1)*0.18;
        ctx.save();ctx.setLineDash([6,4]);ctx.lineDashOffset=-(t2*0.04%10);
        ctx.strokeStyle=(zCol[z]||"#fff")+Math.round(borderAlpha*255).toString(16).padStart(2,"0");
        ctx.lineWidth=1.2;ctx.strokeRect(FX,zy1,FW,zh2);ctx.restore();
      }
    }

    // Player sprite — top-down jersey with head, motion blur, hero star
    function drawPlayer(ctx,cx,cy,col,col2,isHero,num,isMoving,facingDown,t){
      const R=isHero?11:7.5;
      const jw=R*1.0,jh=R*1.55,jr=R*0.26;

      // Motion blur trail (elongated shadow in "running" direction when moving)
      if(isMoving){
        ctx.save();ctx.globalAlpha=0.18;
        ctx.fillStyle=isHero?"#f59e0b":col;
        ctx.beginPath();ctx.ellipse(cx,cy+R*0.9,R*0.55,R*1.4,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }

      // Drop shadow (directional: slightly behind player)
      ctx.save();ctx.globalAlpha=0.32;ctx.fillStyle="#000";
      ctx.beginPath();ctx.ellipse(cx+(isMoving?1.5:0),cy+R*0.6,R*0.88,R*0.26,0,0,Math.PI*2);ctx.fill();ctx.restore();

      // Hero outer glow ring
      if(isHero){
        ctx.save();
        ctx.shadowColor="#f59e0b";ctx.shadowBlur=16;
        ctx.strokeStyle="#f59e0b";ctx.lineWidth=2.5;ctx.globalAlpha=0.88;
        ctx.beginPath();ctx.arc(cx,cy,R+6,0,Math.PI*2);ctx.stroke();
        // second inner ring (pulsing)
        const pulse=0.5+Math.sin((t||0)*0.004)*0.35;
        ctx.globalAlpha=pulse*0.45;ctx.lineWidth=1.2;
        ctx.beginPath();ctx.arc(cx,cy,R+10,0,Math.PI*2);ctx.stroke();
        ctx.restore();
      }

      // Jersey body
      ctx.fillStyle=isHero?"#f59e0b":col;
      ctx.beginPath();
      ctx.moveTo(cx-jw/2+jr,cy-jh/2);
      ctx.lineTo(cx+jw/2-jr,cy-jh/2);ctx.arcTo(cx+jw/2,cy-jh/2,cx+jw/2,cy-jh/2+jr,jr);
      ctx.lineTo(cx+jw/2,cy+jh/2-jr);ctx.arcTo(cx+jw/2,cy+jh/2,cx+jw/2-jr,cy+jh/2,jr);
      ctx.lineTo(cx-jw/2+jr,cy+jh/2);ctx.arcTo(cx-jw/2,cy+jh/2,cx-jw/2,cy+jh/2-jr,jr);
      ctx.lineTo(cx-jw/2,cy-jh/2+jr);ctx.arcTo(cx-jw/2,cy-jh/2,cx-jw/2+jr,cy-jh/2,jr);
      ctx.closePath();ctx.fill();
      // sleeves
      ctx.fillStyle=isHero?"#d97706":col;
      ctx.beginPath();ctx.ellipse(cx-jw/2-R*0.22,cy-jh*0.1,R*0.26,R*0.4,Math.PI*0.14,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx+jw/2+R*0.22,cy-jh*0.1,R*0.26,R*0.4,-Math.PI*0.14,0,Math.PI*2);ctx.fill();
      // collar
      ctx.fillStyle=isHero?"#fff":(col2||"rgba(255,255,255,0.9)");
      ctx.beginPath();ctx.ellipse(cx,cy-jh/2+R*0.18,R*0.36,R*0.19,0,0,Math.PI*2);ctx.fill();
      // jersey border
      ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=0.8;
      ctx.beginPath();
      ctx.moveTo(cx-jw/2+jr,cy-jh/2);
      ctx.lineTo(cx+jw/2-jr,cy-jh/2);ctx.arcTo(cx+jw/2,cy-jh/2,cx+jw/2,cy-jh/2+jr,jr);
      ctx.lineTo(cx+jw/2,cy+jh/2-jr);ctx.arcTo(cx+jw/2,cy+jh/2,cx+jw/2-jr,cy+jh/2,jr);
      ctx.lineTo(cx-jw/2+jr,cy+jh/2);ctx.arcTo(cx-jw/2,cy+jh/2,cx-jw/2,cy+jh/2-jr,jr);
      ctx.lineTo(cx-jw/2,cy-jh/2+jr);ctx.arcTo(cx-jw/2,cy-jh/2,cx-jw/2+jr,cy-jh/2,jr);
      ctx.closePath();ctx.stroke();
      // number

      ctx.textAlign="center";ctx.textBaseline="middle";

    function drawBall(ctx,bx,by,t){
      const spin=t*0.004;
      const R=5;
      // drop shadow — bigger and darker
      ctx.save();ctx.globalAlpha=0.38;ctx.fillStyle="#000";
      ctx.beginPath();ctx.ellipse(bx,by+R*0.65,R*0.82,R*0.28,0,0,Math.PI*2);ctx.fill();ctx.restore();
      // ball body
      ctx.fillStyle="#f0f0ea";ctx.beginPath();ctx.arc(bx,by,R,0,Math.PI*2);ctx.fill();
      // pentagon patches
      ctx.fillStyle="#1a1a1a";
      [[0,1],[1,0.3],[0.6,-0.8],[-0.6,-0.8],[-1,0.3]].forEach(([px,py])=>{
        const nx=Math.cos(spin)*px-Math.sin(spin)*py;
        const ny=Math.sin(spin)*px+Math.cos(spin)*py;
        ctx.beginPath();ctx.arc(bx+nx*(R*0.5),by+ny*(R*0.5),R*0.22,0,Math.PI*2);ctx.fill();
      });
      // specular highlight — top-left glint
      ctx.save();
      const specGrd=ctx.createRadialGradient(bx-R*0.32,by-R*0.34,0,bx-R*0.32,by-R*0.34,R*0.52);
      specGrd.addColorStop(0,"rgba(255,255,255,0.72)");
      specGrd.addColorStop(0.4,"rgba(255,255,255,0.18)");
      specGrd.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=specGrd;ctx.beginPath();ctx.arc(bx,by,R,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    function drawParticles(ctx){
      s.particles=s.particles.filter(p=>{
        p.life-=p.decay||0.025;p.x+=p.vx;p.y+=p.vy;
        if(p.type!=="spark")p.vy+=0.08; // gravity for confetti; sparks fly straight
        if(p.life<=0)return false;
        ctx.save();ctx.globalAlpha=p.life;
        if(p.type==="spark"){
          // elongated streak in direction of motion
          ctx.strokeStyle=p.col;ctx.lineWidth=p.r*p.life;
          ctx.beginPath();ctx.moveTo(p.x-p.vx*3,p.y-p.vy*3);ctx.lineTo(p.x,p.y);ctx.stroke();
        } else if(p.type==="dust"){
          // expanding grey puff
          const cr=p.r*(2-p.life)*2.5;
          ctx.fillStyle=p.col;
          ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,cr),0,Math.PI*2);ctx.fill();
        } else {
          ctx.fillStyle=p.col;
          ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();return true;
      });
    }
    // Spawn spark burst at canvas position (cx,cy) — used on shot/goal
    function spawnSparks(cx,cy,col,count){
      for(let i=0;i<count;i++){
        const ang=Math.random()*Math.PI*2;
        const spd=1.5+Math.random()*3.5;
        s.particles.push({type:"spark",x:cx,y:cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r:1.5+Math.random()*1.5,col,life:0.9+Math.random()*0.4,decay:0.04+Math.random()*0.02});
      }
    }
    // Spawn dust cloud at canvas position — used on tackle/recovery
    function spawnDust(cx,cy,count){
      for(let i=0;i<count;i++){
        const ang=Math.random()*Math.PI*2;
        const spd=0.4+Math.random()*1.2;
        s.particles.push({type:"dust",x:cx,y:cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd*0.5,r:1,col:`rgba(${180+Math.floor(Math.random()*30)},${160+Math.floor(Math.random()*30)},${120+Math.floor(Math.random()*20)},1)`,life:0.7+Math.random()*0.3,decay:0.022+Math.random()*0.015});
      }
    }

    function drawWalkout(ctx,t){
      const p=propsRef.current;
      s.walkProgress=Math.min(1,s.walkProgress+0.007);
      ctx.fillStyle="rgba(5,8,16,0.6)";ctx.fillRect(0,0,PW,PH);
      // Tunnel mouth at top of field
      const tX=FCX,tY=FY+30;
      ctx.fillStyle="#060d1c";ctx.beginPath();ctx.ellipse(tX,tY,28,38,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#f59e0b";ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(tX,tY,28,38,0,0,Math.PI*2);ctx.stroke();
      // Teams walking in two lines toward centre
      const np=Math.min(11,Math.floor(s.walkProgress*13));
      for(let i=0;i<np;i++){
        const prog=Math.min(1,(s.walkProgress*13-i)/8);
        const isHome=i%2===0;
        const offX=(isHome?-14:14);
        const wx=tX+offX;
        const wy=tY+(FCY-tY)*prog+i*6;
        const col=isHome?(p.homeCol||"#22c55e"):(p.oppCol||"#ef4444");
        drawPlayer(ctx,wx,wy,col,"#fff",false,i+1,prog>0.1,true,t);
      }
      // Protagonist last, alone in centre
      if(s.walkProgress>0.6){
        const pp=Math.min(1,(s.walkProgress-0.6)/0.4);
        const wx=tX;
        const wy=tY+(FCY-tY)*pp;
        drawPlayer(ctx,wx,wy,p.homeCol||"#22c55e","#f59e0b",true,10,pp>0.05,true,t);
      }
      ctx.fillStyle="#f59e0b";ctx.font="bold 16px sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.shadowColor="#f59e0b";ctx.shadowBlur=14;
      const hName=(p.homeClub&&(p.homeClub.n||p.homeClub.name))||"HOME";
      const aName=(p.opponents?.[0]?.name)||"AWAY";
      ctx.fillText(`⚽ ${hName}  vs  ${aName}`,PW/2,18);
      ctx.shadowBlur=0;
      // Confetti burst at end of walkout
      if(s.walkProgress>0.88){
        var cProg=(s.walkProgress-0.88)/0.12;
        var cPal=["#f59e0b","#22c55e","#3b82f6","#ef4444","#a855f7","#fff","#fbbf24"];
        for(var ci=0;ci<22;ci++){
          var cSeed=((ci*137)%100)/100;
          var cX=FCX-90+cSeed*180,cY=(FCY-30)-(cProg*100+ci*4)%90;
          ctx.save();ctx.globalAlpha=Math.max(0,0.9-cProg*0.6);ctx.fillStyle=cPal[ci%cPal.length];
          ctx.translate(cX,cY);ctx.rotate(cSeed*Math.PI);ctx.fillRect(-2,0,4,7);ctx.restore();
        }
      }
      if(s.walkProgress>=1&&!s.walkDone){s.walkDone=true;propsRef.current.onWalkoutDone&&propsRef.current.onWalkoutDone();}
    }

    // Shoulder-cam: draw a perspective-shifted view centered behind the hero
    function drawShoulderOverlay(ctx,cx,cy,col,col2,t){
      // Ground plane receding to a vanishing point above hero
      const vpX=cx,vpY=cy-80;
      // Grass quad (trapezoid)
      ctx.save();
      ctx.fillStyle="#1a6b2a";
      ctx.beginPath();ctx.moveTo(cx-160,cy+100);ctx.lineTo(cx+160,cy+100);ctx.lineTo(cx+60,vpY+10);ctx.lineTo(cx-60,vpY+10);ctx.closePath();ctx.fill();
      // Pitch lines
      ctx.strokeStyle="rgba(255,255,255,0.6)";ctx.lineWidth=1.5;
      for(let i=0;i<=4;i++){
        const fx=i/4;
        const x1=cx-160+320*fx,y1=cy+100;
        const x2=cx-60+120*fx,y2=vpY+10;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      }
      for(let j=0;j<=3;j++){
        const fy=j/3;
        const lx1=cx-160+fy*(cx-60-(cx-160)),ly1=(cy+100)+fy*(vpY+10-(cy+100));
        const rx1=cx+160+fy*(cx+60-(cx+160)),ry1=ly1;
        ctx.beginPath();ctx.moveTo(lx1,ly1);ctx.lineTo(rx1,ry1);ctx.stroke();
      }
      // Goal in distance
      const gHalfW=40*(1-0.6),gH=30*(1-0.6);
      const gpX=cx,gpY=vpY+5;
      ctx.strokeStyle="#fff";ctx.lineWidth=2.5;
      ctx.strokeRect(gpX-gHalfW*2.5,gpY-gH*1.5,gHalfW*5,gH*1.5);
      // Net
      ctx.strokeStyle="rgba(255,255,255,0.25)";ctx.lineWidth=0.5;
      for(let n=0;n<=4;n++){ctx.beginPath();ctx.moveTo(gpX-gHalfW*2.5+n*(gHalfW*5/4),gpY-gH*1.5);ctx.lineTo(gpX-gHalfW*2.5+n*(gHalfW*5/4),gpY);ctx.stroke();}
      ctx.restore();
      // Hero sprite, larger, at bottom of shoulder view
      drawPlayer(ctx,cx,cy+40,col,col2,true,10,s.isMoving,true,t);
    }

    function render(t){
      s.frameId=requestAnimationFrame(render);
      s.lastT=t;
      const p=propsRef.current;
      // Track hero movement for leg anim
      const dxM=Math.abs(p.playerX-s.prevPX),dyM=Math.abs(p.playerY-s.prevPY);
      if(dxM>0.05||dyM>0.05){s.isMoving=true;s.movingTimer=12;}
      else if(s.movingTimer>0){s.movingTimer--;if(s.movingTimer<=0)s.isMoving=false;}
      s.prevPX=p.playerX;s.prevPY=p.playerY;
      // Net bulge: decay over 1.5s, spike on fresh waveEvent
      const wEvtNow=p.waveEvent;
      if(wEvtNow){const age=Date.now()-wEvtNow.t;if(age<1500){const b=Math.max(0,1-age/1500);if(wEvtNow.home)s.netBulgeTop=b;else s.netBulgeBot=b;}else{s.netBulgeTop=Math.max(0,s.netBulgeTop-0.04);s.netBulgeBot=Math.max(0,s.netBulgeBot-0.04);}}else{s.netBulgeTop=Math.max(0,s.netBulgeTop-0.04);s.netBulgeBot=Math.max(0,s.netBulgeBot-0.04);}

      ctx.clearRect(0,0,PW,PH);
      const isShoulderZoom=p.actionZoom;

      if(isShoulderZoom){
        // --- Shoulder cam view ---
        const hcx=FCX,hcy=FCY; // always draw at canvas centre for shoulder
        drawStadium(ctx,t);
        drawShoulderOverlay(ctx,hcx,hcy,p.homeCol||"#22c55e","#f59e0b",t);
        // Hero sprite at center
        ctx.save();ctx.translate(hcx,hcy+24);drawPlayer(ctx,0,0,p.homeCol||"#22c55e","#f59e0b",true,10,s.isMoving,true,t);ctx.restore();
        // Opponents — translate to position first then scale around that point
        const oppList=p.opponents||[];
        oppList.slice(0,3).forEach((op,i)=>{
          const ds=0.62-i*0.08;
          const ox=hcx+(-44+i*44),oy=hcy-26-i*20;
          ctx.save();ctx.translate(ox,oy);ctx.scale(ds,ds);
          drawPlayer(ctx,0,0,p.oppCol||"#ef4444","#fff",false,i+2,false,false,t);
          ctx.restore();
        });
        // Ball near hero feet
        drawBall(ctx,hcx+8,hcy+28,t);
      } else {
        // --- Top-down full pitch view with contextual camera zoom ---
        const isHL=["hl_move","hl_choose","hl_result","hl_intro"].includes(p.matchPhase);
        // Zoom scales with zone: area/bordo = tightest, midfield/defence = wider
        const zoneZooms={area:1.65,bordo:1.50,trequarti:1.32,centro:1.22,difesa:1.18,propria:1.15};
        const baseHL=zoneZooms[p.zone]||1.22;
        // Extra boost if result just happened (cinematic freeze)
        const isResult=p.matchPhase==="hl_result";
        const targetZoom=isHL?(isResult?Math.min(baseHL+0.12,1.80):baseHL):1.0;
        // Camera follows player tightly in high-zoom zones
        const camLerpFactor=isHL?(p.zone==="area"||p.zone==="bordo"?0.07:0.05):0.06;
        const targetCX=isHL?gx(p.playerY):FCX;
        const targetCY=isHL?gy(p.playerX):FCY;
        const lerpS=camLerpFactor;
        s.camX+=(targetCX-s.camX)*lerpS;
        s.camY+=(targetCY-s.camY)*lerpS;
        s.camZoom+=(targetZoom-s.camZoom)*lerpS;

        ctx.save();
        ctx.translate(PW/2-s.camZoom*s.camX,PH/2-s.camZoom*s.camY);
        ctx.scale(s.camZoom,s.camZoom);

        propsRef.current._t=t;
        drawStadium(ctx,t);
        drawPitch(ctx);

        if(p.matchPhase!=="walkout"){
          const isHLph=["hl_move","hl_choose","hl_result","hl_intro"].includes(p.matchPhase);
          if(isHLph&&p.zone){
            const zM2={propria:[0,25],difesa:[25,42],centro:[42,58],trequarti:[58,75],bordo:[75,88],area:[88,100]};
            const zr2=zM2[p.zone];
            if(zr2){
              const y1=gy(zr2[1]),y2=gy(zr2[0]); // after inversion: y1<y2
              const zG=ctx.createLinearGradient(FX,y1,FX,y2);
              zG.addColorStop(0,"rgba(245,158,11,0)");
              zG.addColorStop(0.5,"rgba(245,158,11,0.09)");
              zG.addColorStop(1,"rgba(245,158,11,0)");
              ctx.fillStyle=zG;ctx.fillRect(FX,y1,FW,y2-y1);
            }
          }
          // All players with smooth livePos drift
          const allP=p.allPlayers||[];
          // Init or resize livePos array
          if(s.livePos.length!==allP.length){
            s.livePos=allP.map(function(pl){
              return{cx:gx(pl?pl.y||50:50),cy:gy(pl?pl.x||50:50)};
            });
          }
          // Apply drift targets from BG_MATCH pd field
          var dt=p.driftTargets;
          var isHLphase=["hl_move","hl_choose","hl_intro"].includes(p.matchPhase);
          allP.forEach(function(pl,i){
            if(!pl||!s.livePos[i])return;
            var hasDrift=dt&&dt[i];
            if(hasDrift){
              s.livePos[i].cx+=(gx(dt[i].y)-s.livePos[i].cx)*0.022;
              s.livePos[i].cy+=(gy(dt[i].x)-s.livePos[i].cy)*0.022;
            }else{
              var baseX2=gx(pl.y||50),baseY2=gy(pl.x||50);
              // HL: bigger oscillation (realistic micro-movement during action)
              var isHero=pl.isHero||pl.isPlayer;
              var oscAmp=isHLphase?(isHero?5:7):(pl.team==="away"||pl.team==="ref"?3:1.5);
              var oscFreq=isHLphase?(isHero?0.002:0.003):(pl.team==="away"?0.0007:0.0005);
              var oscPhase=isHero?0:(i*1.1);
              var osc2=Math.sin(t*oscFreq+oscPhase)*oscAmp;
              var oscX=Math.cos(t*oscFreq*0.7+oscPhase+1)*oscAmp*0.5;
              // faster lerp during HL so matchPlayers changes are visible quickly
              var lerpFactor=isHLphase?0.025:0.004;
              s.livePos[i].cx+=((baseX2+oscX)-s.livePos[i].cx)*lerpFactor;
              s.livePos[i].cy+=((baseY2+osc2)-s.livePos[i].cy)*lerpFactor;
            }
          });
          // Sort by canvasY for depth
          var sortedI=[...allP.map(function(pl,i){return{pl:pl,i:i};})];
          sortedI.sort(function(a,b){return(a.pl?a.pl.x||0:0)-(b.pl?b.pl.x||0:0);});
          sortedI.forEach(function(item){
            var pl=item.pl,i=item.i;
            if(!pl||!s.livePos[i])return;
            var isHero=pl.isHero||pl.isPlayer;
            var col=pl.team==="home"?(p.homeCol||"#22c55e"):pl.team==="ref"?"#f59e0b":(p.oppCol||"#ef4444");
            var col2=pl.team==="ref"?"#111":"#fff";
            drawPlayer(ctx,s.livePos[i].cx,s.livePos[i].cy,col,col2,isHero,i+1,s.isMoving&&isHero,true,t);
          });
          // Protagonist (always drawn separately on top)
          const heroCx=gx(p.playerY),heroCy=gy(p.playerX);
          // Check if hero already in allPlayers
          const heroInAll=(allP||[]).some(pl=>pl.isHero||pl.isPlayer);
          if(!heroInAll){
            drawPlayer(ctx,heroCx,heroCy,p.homeCol||"#22c55e","#f59e0b",true,10,s.isMoving,true,t);
          }
          // Ball — lerp toward BG_MATCH synced position
          var tBX=p.ballX!=null?p.ballX:p.playerX;
          var tBY=p.ballY!=null?p.ballY:p.playerY;
          s.ballX+=(tBX-s.ballX)*0.04;
          s.ballY+=(tBY-s.ballY)*0.04;
          drawBall(ctx,gx(s.ballY),gy(s.ballX),t);
          drawParticles(ctx);
        }
        ctx.restore();
      }

      if(p.matchPhase==="walkout"){
        drawWalkout(ctx,t);
      }

      // Vignette
      const vig=ctx.createRadialGradient(PW/2,PH/2,PH*0.25,PW/2,PH/2,PH*0.75);
      vig.addColorStop(0,"transparent");vig.addColorStop(1,"rgba(0,0,0,0.5)");
      ctx.fillStyle=vig;ctx.fillRect(0,0,PW,PH);
    }

    // Expose particle spawners so external useEffect can trigger them
    s.spawnSparks=spawnSparks;
    s.spawnDust=spawnDust;
    s.frameId=requestAnimationFrame(render);
    return()=>{cancelAnimationFrame(s.frameId);};
  },[]);

  useEffect(()=>{
    if(!actionEffect)return;
    const s=stateRef.current;
    if(!s.spawnSparks)return;
    // Convert game coords to canvas coords
    const cx=PC_FX+playerY/100*PC_FW;
    const cy=PC_FY+PC_FH*(1-playerX/100);
    if(actionEffect.type==="spark"){
      s.spawnSparks(cx,cy,actionEffect.col||"#f59e0b",18);
    } else if(actionEffect.type==="dust"){
      s.spawnDust(cx,cy,12);
    } else if(actionEffect.type==="goal"){
      s.spawnSparks(cx,cy,"#f59e0b",28);
      s.spawnSparks(cx,cy,"#fff",18);
    }
  },[actionEffect]);// eslint-disable-line

  useEffect(()=>{
    if(matchPhase==="ended"){
      const s=stateRef.current;
      for(let i=0;i<25;i++){
        const ang=Math.random()*Math.PI*2;
        s.particles.push({x:PC_FCX+Math.random()*80-40,y:PC_FCY+Math.random()*60-30,
          vx:Math.cos(ang)*2.5,vy:Math.sin(ang)*2.5-1.5,r:4+Math.random()*3,
          col:["#f59e0b","#ef4444","#22c55e","#fff","#a855f7"][Math.floor(Math.random()*5)],life:1});
      }
    }
  },[matchPhase]);

  return(
    <div style={{width:"100%",background:"#0a0e1a",borderRadius:"0 0 12px 12px",overflow:"hidden",display:"flex",justifyContent:"center"}}>
      <canvas ref={canvasRef} width={PC_PW} height={PC_PH}
        style={{display:"block",width:"min(100%,420px)",height:"auto",margin:"0 auto"}}/>
    </div>
  );
}

    // Alternating stripe pattern — subtle difference
    for(let i=0;i<10;i++){const sm=new THREE.MeshLambertMaterial({color:i%2?0x2e6617:0x245510});const s=new THREE.Mesh(new THREE.PlaneGeometry(10,60),sm);s.rotation.x=-Math.PI/2;s.position.set(-45+i*10,0.01,0);scene.add(s);}

    const lm=new THREE.LineBasicMaterial({color:0xffffff,opacity:0.85,transparent:true});
