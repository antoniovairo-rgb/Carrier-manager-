@keyframes shrinkBar{from{width:100%}to{width:0%}}
@keyframes fadeFlash{0%{opacity:1}100%{opacity:0}}
@keyframes blackCut{0%{opacity:0}18%{opacity:1}52%{opacity:1}100%{opacity:0}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}60%{opacity:1;transform:translateY(-30px) scale(1.1)}100%{opacity:0;transform:translateY(-60px) scale(0.9)}}
@keyframes goalDrop{0%{opacity:0;transform:translateY(-60px) scale(0.6)}18%{opacity:1;transform:translateY(6px) scale(1.08)}30%{transform:translateY(-3px) scale(0.97)}42%{transform:translateY(2px) scale(1.03)}55%{transform:translateY(0) scale(1)}80%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-20px) scale(1.05)}}
@keyframes goalShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-5px,3px)}20%{transform:translate(5px,-3px)}30%{transform:translate(-4px,4px)}40%{transform:translate(4px,-2px)}50%{transform:translate(-3px,3px)}60%{transform:translate(3px,-3px)}70%{transform:translate(-2px,2px)}80%{transform:translate(2px,-2px)}90%{transform:translate(-1px,1px)}}
@keyframes goalGlow{0%,100%{text-shadow:0 0 30px currentColor,0 0 60px currentColor}50%{text-shadow:0 0 60px currentColor,0 0 120px currentColor,0 0 8px #fff}}
@keyframes chantPulse{0%{opacity:0;transform:translateY(8px) scale(0.92)}15%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-6px) scale(0.95)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
@keyframes pressureDrop{0%{opacity:0;transform:translateY(-40px) scale(0.7)}20%{opacity:1;transform:translateY(4px) scale(1.06)}40%{transform:translateY(-2px) scale(0.98)}55%{transform:translateY(0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-15px) scale(1.04)}}
/* [6.72.0] collaudo PO «riduci l'effetto lampeggiante ai bordi»: pulse MOLTO più tenue (blur 18→9, spread 4→0, alpha 0.55→0.16) e lento */
@keyframes pressureBorderRed{0%,100%{box-shadow:inset 0 0 0px transparent}50%{box-shadow:inset 0 0 9px 0px rgba(239,68,68,0.16)}}

*{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;overflow:hidden;background:#2b0810;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
/* [7.176.0 collaudo PO «c'è modo di evitare che parta questa funzionalità? a volte anche in partita»] la UI di gioco NON è selezionabile: il long-press su Android apriva selezione testo + menu Copia/Condividi + scheda Google «tocca per cercare» (anche in partita). I campi di INPUT restano selezionabili (creazione nome, import save). */
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;}#root{height:100%;display:flex;flex-direction:column;background:#f0f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 44%, #6b1123 0%, #40101c 46%, #2b0810 80%);flex-direction:column;gap:14px;z-index:9999;font-family:sans-serif;}.sp{width:36px;height:36px;border:3px solid #e2e8f0;border-top:3px solid #8e1f33;border-radius:50%;animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes barPulse{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
@keyframes ballBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes logoIn{0%{opacity:0;transform:translateY(10px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes trophyRise{0%{opacity:0;transform:translateY(60px) scale(.5) rotate(-8deg)}55%{opacity:1;transform:translateY(-8px) scale(1.12) rotate(3deg)}75%{transform:translateY(2px) scale(.98) rotate(-1deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes trophyGlow{0%,100%{filter:drop-shadow(0 0 14px rgba(245,200,80,.7))}50%{filter:drop-shadow(0 0 36px rgba(245,200,80,1))}}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-10vh) rotate(0)}100%{opacity:.85;transform:translateY(108vh) rotate(720deg)}}
@keyframes fwBurst{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
@keyframes celebTitle{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.lrise{animation:logoIn .55s cubic-bezier(.2,.8,.2,1) both;}
.lrise .lb{transform-box:fill-box;transform-origin:50% 100%;animation:barPulse 1.5s ease-in-out infinite;}
.lrise .lb2{animation-delay:.16s;}.lrise .lb3{animation-delay:.32s;}
.lrise .lball{transform-box:fill-box;transform-origin:center;animation:ballBob 1.5s ease-in-out infinite .32s;}
@media(prefers-reduced-motion:reduce){.lrise .lb,.lrise .lball{animation:none;}}
/* [6.60.0] SPLASH «Set-Piece Strike» (design multi-agente) */
/* ===== KORWARD ELITE splash — "Set-Piece Strike" (sp3*) — K + pallone-o + rward · sottotitolo Elite ===== */
#ld .sp3stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 18px;}

/* faint static pitch motif behind wordmark (no animation, flash-safe) */
#ld .sp3pitch{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);width:min(560px,94vw);height:auto;opacity:.055;pointer-events:none;z-index:0;}

/* wordmark */
#ld .sp3mark{position:relative;z-index:1;display:inline-flex;align-items:center;line-height:1;color:#fff;
  font-size:clamp(40px,12.6vw,66px);
  animation:sp3recoil .86s ease-out both;}
#ld .sp3mark::before{content:"";position:absolute;top:-10%;left:0;width:44%;height:120%;
  background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.15) 50%,transparent 100%);
  transform:translateX(-150%) skewX(-16deg);pointer-events:none;
  animation:sp3sheen 1s ease-in-out 1.42s forwards;}

/* [6.69.0] "K" iniziale di Korward — hero sans 900 (era "elev" corsivo) */
#ld .sp3elev{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:900;
  margin-right:-.05em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);opacity:0;will-change:transform,opacity;
  animation:sp3elev .55s ease-out .12s forwards;}

/* [6.69.1] pallone-o accostato alla K (era troppo distante): margine sinistro negativo */
#ld .sp3oslot{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:.72em;height:.72em;margin:-.02em -.06em -.02em -.09em;}
#ld .sp3ball{position:relative;display:block;width:100%;height:100%;opacity:0;will-change:transform,opacity;
  animation:sp3fly .82s cubic-bezier(.22,.55,.3,1) both;}
#ld .sp3ballin{display:block;width:100%;height:100%;will-change:transform;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));
  animation:sp3bob 3.4s ease-in-out 1.3s infinite alternate;}

/* weighted-landing "socket" glow (grafted from assemble-plus) */
#ld .sp3socket{position:absolute;left:50%;top:50%;width:1.7em;height:1.7em;margin:-.85em 0 0 -.85em;border-radius:50%;
  pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(224,82,106,.55) 0%,rgba(163,38,58,0) 70%);
  opacity:0;transform:scale(.3);
  animation:sp3socket .8s ease-out .74s forwards;}

/* shockwave ring on impact */
#ld .sp3wave{position:absolute;left:50%;top:50%;width:.9em;height:.9em;border-radius:50%;
  border:2px solid rgba(255,255,255,.5);opacity:0;pointer-events:none;
  transform:translate(-50%,-50%) scale(.2);
  animation:sp3wave .75s ease-out .72s forwards;}

/* [6.69.0] "rward" — resto di Korward, hero sans 900 (era "RA") */
#ld .sp3ra{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:900;
  font-size:1em;letter-spacing:.005em;padding-left:.01em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);
  opacity:0;will-change:transform,opacity;
  animation:sp3ra .5s cubic-bezier(.2,.85,.3,1.3) .76s forwards;}
/* [6.69.1] sottotitolo "Elite" — SCRIPT stilizzato (KWScript/Great Vibes embedded) ambra, impilato sotto Korward */
#ld .sp3elite{position:relative;z-index:1;font-family:'KWScript','Segoe Script','Snell Roundhand','Apple Chancery',cursive;
  font-style:normal;font-weight:400;font-size:clamp(26px,7vw,42px);letter-spacing:.01em;color:#f59e0b;
  text-shadow:0 2px 6px rgba(0,0,0,.4);margin-top:-4px;line-height:1;opacity:0;will-change:transform,opacity;
  animation:sp3ra .5s cubic-bezier(.2,.85,.3,1.3) .95s forwards;}

#ld .sp3rule{position:relative;z-index:1;width:min(210px,58vw);height:3px;border-radius:3px;
  background:linear-gradient(90deg,transparent,#e0526a,#a3263a,transparent);transform:scaleX(0);opacity:0;
  animation:sp3rule .5s ease .96s forwards;}

#ld .sp3sub{position:relative;z-index:1;color:rgba(255,255,255,.72);font-family:sans-serif;font-weight:600;
  font-size:clamp(10px,2.9vw,13px);letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;
  opacity:0;animation:sp3sub .6s ease 1.06s forwards;}

/* [7.100.0] BARRA DI CARICAMENTO «paracula» — intrattiene il player durante il transpile Babel (~1-2s, a volte più) */
/* [7.102.0 collaudo PO «non parte lo "spingere percentuale" all'apertura, solo un istante dopo»] CAUSA: Babel
   transpila il gioco in-browser BLOCCANDO il main thread → qualsiasi animazione guidata da JS/setInterval si
   CONGELA durante l'attesa (partiva solo dopo). SOLUZIONE: la barra ora anima via CSS sul COMPOSITOR (transform:
   scaleX) → «spinge» anche mentre il main thread è bloccato; la % via @property+counter è sincronizzata. */
@property --sp3p{syntax:'<integer>';initial-value:0;inherits:false;}
#ld{transition:opacity .42s ease;}
#ld .sp3bar{position:relative;z-index:1;width:min(250px,66vw);margin-top:5px;opacity:0;animation:sp3sub .55s ease 1.2s forwards;}
#ld .sp3track{width:100%;height:5px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;}
#ld .sp3fill{height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,#a3263a,#e0526a 58%,#f0b33a);
  box-shadow:0 0 10px rgba(224,82,106,.55);transform-origin:left center;transform:scaleX(0);will-change:transform;
  animation:sp3grow 7s cubic-bezier(.12,.72,.2,1) .1s forwards;}
@keyframes sp3grow{to{transform:scaleX(.95);}}/* spinge in modo asintotico verso ~95% (paracula) — il 100% lo mette window._hide al mount */
#ld .sp3prow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px;}
#ld .sp3msg{color:rgba(255,255,255,.64);font-family:sans-serif;font-weight:600;font-size:clamp(9px,2.6vw,11px);
  letter-spacing:.01em;min-height:14px;transition:opacity .25s ease;}
#ld .sp3pct{color:#f0b33a;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;
  font-size:clamp(10px,2.8vw,12px);font-variant-numeric:tabular-nums;flex-shrink:0;
  --sp3p:0;counter-reset:sp3c var(--sp3p);animation:sp3count 7s cubic-bezier(.12,.72,.2,1) .1s forwards;}
#ld .sp3pct::after{content:counter(sp3c) "%";}
@keyframes sp3count{to{--sp3p:95;}}

/* ball flight: kicked from lower-left, arcs up, drops into the "o" */
@keyframes sp3fly{
  0%{opacity:0;transform:translate(-160px,10px) scale(.48) rotate(-40deg);}
  14%{opacity:1;}
  46%{transform:translate(-66px,-48px) scale(.78) rotate(300deg);}
  78%{transform:translate(3px,3px) scale(1.07) rotate(560deg);}
  88%{transform:translate(0,-6px) scale(.97) rotate(600deg);}
  100%{opacity:1;transform:translate(0,0) scale(1) rotate(620deg);}
}
@keyframes sp3bob{from{transform:translateY(0);}to{transform:translateY(-3px);}}
@keyframes sp3socket{
  0%{opacity:0;transform:scale(.3);}
  40%{opacity:.9;transform:scale(1.12);}
  100%{opacity:0;transform:scale(1.5);}
}
@keyframes sp3wave{
  0%{opacity:.55;transform:translate(-50%,-50%) scale(.2);}
  70%{opacity:.16;}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.7);}
}
@keyframes sp3ra{
  0%{opacity:0;transform:translateX(16px) scale(1.18);}
  60%{opacity:1;}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
@keyframes sp3elev{
  0%{opacity:0;transform:translateX(-22px);}
  100%{opacity:1;transform:translateX(0);}
}
@keyframes sp3recoil{
  0%,72%{transform:translateX(0);}
  77%{transform:translateX(-4px);}
  83%{transform:translateX(2px);}
  100%{transform:translateX(0);}
}
@keyframes sp3rule{0%{transform:scaleX(0);opacity:0;}100%{transform:scaleX(1);opacity:1;}}
@keyframes sp3sub{0%{opacity:0;letter-spacing:.62em;}100%{opacity:.72;letter-spacing:.5em;}}
@keyframes sp3sheen{0%{transform:translateX(-150%) skewX(-16deg);}100%{transform:translateX(330%) skewX(-16deg);}}

/* calm static fallback */
@media (prefers-reduced-motion: reduce){
  #ld .sp3mark,#ld .sp3mark::before,#ld .sp3elev,#ld .sp3ra,#ld .sp3elite,#ld .sp3ball,#ld .sp3ballin,
  #ld .sp3socket,#ld .sp3wave,#ld .sp3rule,#ld .sp3sub{animation:none!important;}
  #ld .sp3elev,#ld .sp3ra,#ld .sp3elite,#ld .sp3sub{opacity:1!important;transform:none!important;}
  #ld .sp3sub{opacity:.72!important;letter-spacing:.5em!important;}
  #ld .sp3ball{opacity:1!important;transform:none!important;}
  #ld .sp3ballin{transform:none!important;}
  #ld .sp3socket,#ld .sp3wave{display:none!important;}
  #ld .sp3mark::before{display:none!important;}
  #ld .sp3rule{transform:scaleX(1)!important;opacity:1!important;}
  #ld .sp3bar{animation:none!important;opacity:1!important;}
}
/* ===== UX/UI OVERHAUL · interaction layer (FASE 1) — classi opt-in per l'architettura inline-style ===== */
:root{--mo-fast:120ms;--mo-base:200ms;--mo-slow:320ms;--ease-std:cubic-bezier(.2,0,0,1);--ease-out:cubic-bezier(0,0,.2,1);}
.cpm-num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.cpm-int{transition:transform var(--mo-fast) var(--ease-out),box-shadow var(--mo-fast) var(--ease-out),background var(--mo-fast) var(--ease-out),border-color var(--mo-fast) var(--ease-out);}
.cpm-int:hover{transform:translateY(-1px);}
.cpm-int:active{transform:scale(.98);}
.cpm-press{transition:transform var(--mo-fast) var(--ease-out),filter var(--mo-fast) var(--ease-out);}
.cpm-press:hover{filter:brightness(1.06);}
.cpm-press:active{transform:scale(.97);}
.cpm-focus:focus-visible{outline:2px solid #8e1f33;outline-offset:2px;}
.cpm-fade{animation:cpmFade var(--mo-base) var(--ease-out) both;}
.cpm-rise{animation:cpmRise var(--mo-slow) var(--ease-out) both;}
@keyframes cpmFade{from{opacity:0}to{opacity:1}}
@keyframes cpmRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cpmSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes cpmShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@media(prefers-reduced-motion:reduce){.cpm-int,.cpm-press{transition:none;}.cpm-int:hover,.cpm-press:active,.cpm-int:active{transform:none;}.cpm-fade,.cpm-rise{animation:none;}}</style>

<script>
/* [7.100.0] LOADING BAR «paracula»: la % non conosce il progresso reale (Babel transpila il gioco in-browser),
   cosi avanza in modo ASINTOTICO verso un tetto crescente (sembra sempre progredire, non si inchioda mai) e
   SCATTA a 100% quando React monta (window._hide). Messaggi calcistici a rotazione per intrattenere il player. */
(function(){
  var fill=document.getElementById("sp3fill"),pct=document.getElementById("sp3pct"),msg=document.getElementById("sp3msg");
  var MSGS=["Gonfiamo i palloni…","Tagliamo l'erba del campo…","Convochiamo i tifosi…","Prepariamo gli spogliatoi…","Accendiamo i riflettori…","Stiriamo le maglie…","L'arbitro controlla i cartellini…","Riscaldamento in corso…","Il mister detta la formazione…","Lucidiamo i trofei in bacheca…","Segniamo le righe del campo…","Carichiamo la Curva Sud…"];
  // [7.102.0] barra + % animate via CSS (compositor/@property) → «spingono» anche mentre Babel blocca il main thread.
  //   Qui solo: rotazione messaggi (best-effort) + SNAP a 100% quando React monta (window._hide).
  var done=false,mi=0,mt=0;
  mt=setInterval(function(){ if(done||!msg)return; mi=(mi+1)%MSGS.length; msg.style.opacity="0"; setTimeout(function(){ if(done)return; msg.textContent=MSGS[mi]; msg.style.opacity=""; },240); },1150);
  window._hide=function(){
    if(done)return; done=true; try{clearInterval(mt);}catch(_e){}
    try{ if(fill){fill.style.animation="none";fill.style.transform="scaleX(1)";} if(pct){pct.style.animation="none";pct.style.setProperty("--sp3p","100");} }catch(_e){}
    if(msg){msg.style.opacity="";msg.textContent="Si scende in campo! ⚽";}
    var e=document.getElementById("ld"); if(e){ setTimeout(function(){ e.style.opacity="0"; setTimeout(function(){ e.style.display="none"; },440); },230); }
  };
  setTimeout(window._hide,15000);
})();
</script>
