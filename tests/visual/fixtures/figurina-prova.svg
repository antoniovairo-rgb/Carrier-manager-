<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700" role="img" aria-label="figurina di prova">
  <!-- [7.975] FIGURINA DI PROVA — ricalca la struttura dell'esempio del PO: cornice granata con angoli
       ornati, marchio in alto, ritratto al centro, fascia col nome e la riga ruolo/eta' a filo del bordo
       basso. Serve a provare il PERCORSO dell'arte (manifesto -> riquadro), non a sostituirla. -->
  <rect width="500" height="700" fill="#ffffff"/>
  <rect x="10" y="10" width="480" height="680" fill="none" stroke="#8e1f33" stroke-width="18"/>
  <path d="M10 10 h70 l-70 70 z M490 10 h-70 l70 70 z M10 690 h70 l-70 -70 z M490 690 h-70 l70 -70 z" fill="#8e1f33"/>
  <text x="250" y="66" text-anchor="middle" font-family="Barlow,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="7" fill="#8e1f33">KORWARD</text>
  <circle cx="250" cy="300" r="112" fill="#e7ebf2"/>
  <path d="M250 340 c-78 0 -128 52 -140 118 h280 c-12 -66 -62 -118 -140 -118 z" fill="#cfd7e3"/>
  <rect x="34" y="566" width="432" height="72" fill="#ffffff" stroke="#8e1f33" stroke-width="4"/>
  <text x="250" y="616" text-anchor="middle" font-family="Barlow,Arial,sans-serif" font-size="42" font-weight="900" fill="#7a1526">NOME COGNOME</text>
  <text x="250" y="666" text-anchor="middle" font-family="Barlow,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#8e1f33">RUOLO · ETA'</text>
</svg>
