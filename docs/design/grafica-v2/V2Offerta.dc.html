<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Offerta di trasferimento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <header style="position: relative; height: 270px; flex-shrink: 0; background: {{club}}; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0 18px, rgba(255,255,255,0) 18px 36px);"></div>
    <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(0deg, #0d0f14 0%, rgba(13,15,20,0) 45%);"></div>
    <span style="position: relative; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; background: rgba(0,0,0,0.3); border-radius: 999px; padding: 4px 12px;">Offerta ufficiale</span>
    <div style="position: relative; width: 84px; height: 84px; border-radius: 24px; background: #f4f1ea; color: {{club}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; box-shadow: 0 12px 28px rgba(0,0,0,0.35);">LIS</div>
    <span style="position: relative; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; text-transform: uppercase; line-height: 1;">FC Lisboa</span>
    <span style="position: relative; font-size: 13px; color: rgba(255,255,255,0.85);">Liga Lusitana · 1° · Coppa dei Campioni</span>
  </header>

  <main style="flex-grow: 1; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 6px 14px;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; min-height: 50px; border-bottom: 1px solid rgba(255,255,255,0.04);">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9aa3b2;">{{r.label}}</span>
          <span style="font-size: 14px; color: #9aa3b2; font-variant-numeric: tabular-nums;">{{r.now}}</span>
          <span style="font-size: 13px; color: #596273;" aria-hidden="true">→</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; color: {{r.color}};">{{r.next}}</span>
        </div>
      </sc-for>
    </section>

    <div style="border-left: 3px solid #e8b44a; padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #e8b44a;">Turati, il tuo procuratore</span>
      <span style="font-size: 15px; line-height: 1.4;">«Posto da titolare e Coppa dei Campioni: io la prenderei.»</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto;">
      <button type="button" style="min-height: 54px; border: 0; border-radius: 14px; background: #f4f1ea; color: #0d0f14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase;">Firma con il Lisboa</button>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button type="button" style="min-height: 50px; border-radius: 14px; border: 0; background: #262b37; color: #f4f1ea; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 15px;">Rilancia +15%</button>
        <button type="button" style="min-height: 50px; border-radius: 14px; border: 1px solid rgba(248,113,113,0.45); background: transparent; color: #fca5a5; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 15px;">Rifiuta</button>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#b91c1c"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { club: this.props.club ?? '#b91c1c', rows: [
      { label: 'Stipendio', now: '€22,2 mln', next: '€26,0 mln', color: '#4ade80' },
      { label: 'Durata', now: '2 st.', next: '3 st.', color: '#4ade80' },
      { label: 'Ruolo', now: 'Titolare', next: 'Titolare', color: '#f4f1ea' },
      { label: 'Livello', now: '4/5', next: '4/5', color: '#f4f1ea' }
    ] };
  }
}
</script>
</body>
</html>
