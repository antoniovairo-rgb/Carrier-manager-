<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Fine carriera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 22px 16px 16px; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #e8b44a;">Fine di un'era</span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 50px; text-transform: uppercase; line-height: 0.9;">Luca<br>Brandi</span>
    <span style="font-size: 13px; color: #9aa3b2;">16 stagioni · 6 club · ritirato a 33 anni</span>
    <span style="margin-top: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: #14110b; background: conic-gradient(from 210deg, #fbe7a1, #e8b44a, #9c6a12, #f5d27a, #fbe7a1); border-radius: 999px; padding: 6px 16px;">Leggenda assoluta</span>
  </div>

  <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 12px; background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 14px 4px;">
    <sc-for list="{{totals}}" as="k" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; align-items: center;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px; line-height: 1; color: {{k.color}};">{{k.v}}</span><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">{{k.label}}</span></div>
    </sc-for>
  </section>

  <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Il percorso</span>
    <div style="display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px;" role="img" aria-label="Stagioni per club">
      <sc-for list="{{clubs}}" as="c" hint-placeholder-count="6"><div style="flex-grow: {{c.n}}; background: {{c.color}};"></div></sc-for>
    </div>
    <sc-for list="{{clubs}}" as="c" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 30px; font-size: 14px;">
        <span style="width: 10px; height: 10px; border-radius: 3px; background: {{c.color}};"></span>
        <span style="font-weight: 600;">{{c.club}}</span>
        <span style="color: #9aa3b2; font-variant-numeric: tabular-nums;">{{c.seasons}}</span>
      </div>
    </sc-for>
  </section>

  <a href="#" style="margin-top: auto; min-height: 54px; border-radius: 14px; background: #f4f1ea; color: #0d0f14; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;">Leggi la lettera d'addio</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      totals: [
        { label: 'Presenze', v: '602', color: '#f4f1ea' }, { label: 'Gol', v: '319', color: '#e8b44a' }, { label: 'Assist', v: '119', color: '#f4f1ea' },
        { label: 'Trofei', v: '6', color: '#e8b44a' }, { label: 'OVR max', v: '90', color: '#f4f1ea' }, { label: 'Nazionale', v: '33', color: '#f4f1ea' }
      ],
      clubs: [
        { club: 'FC Cesenate', seasons: 'St. 1–6', color: '#0f766e', n: 6 },
        { club: 'FC Brenvar', seasons: 'St. 7–8', color: '#16a34a', n: 2 },
        { club: 'Istanbul', seasons: 'St. 9', color: '#d97706', n: 1 },
        { club: 'Manchester Rovers', seasons: 'St. 10–12', color: '#2563eb', n: 3 },
        { club: 'FC Valdenau', seasons: 'St. 13–16', color: '#8e1f33', n: 4 },
        { club: 'FC Lisboa (prestito)', seasons: 'St. 16', color: '#dc2626', n: 1 }
      ]
    };
  }
}
</script>
</body>
</html>
