<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Club su PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <aside style="width: 236px; flex-shrink: 0; background: #11141b; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; padding: 22px 14px; gap: 22px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: {{club}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px;">VAL</div>
      <div style="display: flex; flex-direction: column; line-height: 1.15;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.06em; text-transform: uppercase;">FC Valdenau</span><span style="font-size: 12px; color: #9aa3b2;">St. 14 · G11</span></div>
    </div>
    <nav aria-label="Schede" style="display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" style="min-height: 46px; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 15px; font-weight: {{t.weight}}; color: {{t.color}}; background: {{t.bg}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.dot}};"></span>{{t.label}}</a>
      </sc-for>
    </nav>
  </aside>

  <main style="flex-grow: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; min-width: 0;">
    <section style="position: relative; border-radius: 24px; overflow: hidden; background: {{club}}; padding: 26px 30px; display: flex; align-items: center; gap: 26px;">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 22px, rgba(255,255,255,0) 22px 44px);"></div>
      <div style="position: relative; width: 110px; height: 110px; border-radius: 30px; background: #f4f1ea; color: {{club}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; box-shadow: 0 14px 30px rgba(0,0,0,0.3);">VAL</div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; text-transform: uppercase; line-height: 0.95;">FC Valdenau</span>
        <span style="font-size: 16px; color: rgba(255,255,255,0.85);">Deutsche Liga · Stadio Am Wald</span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #fde68a;">Obiettivo: Coppa dei Campioni</span>
      </div>
      <sc-for list="{{meters}}" as="m" hint-placeholder-count="2">
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 86px; height: 86px; border-radius: 50%; background: {{m.ring}}; display: flex; align-items: center; justify-content: center;"><div style="width: 72px; height: 72px; border-radius: 50%; background: {{club}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px;">{{m.v}}</div></div><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;">{{m.label}}</span></div>
      </sc-for>
    </section>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; overflow: hidden;">
      <div style="padding: 14px 22px; border-bottom: 1px solid rgba(255,255,255,0.06);"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Rosa</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
        <sc-for list="{{mates}}" as="m" hint-placeholder-count="9">
          <div style="display: flex; align-items: center; gap: 14px; padding: 0 22px; min-height: 72px; border-bottom: 1px solid rgba(255,255,255,0.04); border-right: 1px solid rgba(255,255,255,0.04); background: {{m.bg}};">
            <span style="width: 40px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; color: {{m.numColor}};">{{m.num}}</span>
            <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;"><span style="font-weight: 600; font-size: 16px;">{{m.name}}</span><span style="font-size: 13px; color: #9aa3b2;">{{m.role}}</span></span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; padding: 2px 10px; border-radius: 8px; background: {{m.ovrBg}}; color: {{m.ovrFg}};">{{m.ovr}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#8e1f33"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const club = this.props.club ?? '#8e1f33';
    const T = [['Home', 'V2HomePC.dc.html'], ['Stagione', 'V2StagionePC.dc.html'], ['Club', 'V2ClubPC.dc.html', true], ['Carriera', 'V2CarrieraPC.dc.html'], ['Agente', 'V2AgentePC.dc.html'], ['Ufficio', 'V2UfficioPC.dc.html']];
    const tabs = T.map((t) => ({ label: t[0], href: t[1], weight: t[2] ? 700 : 500, color: t[2] ? '#0d0f14' : '#9aa3b2', bg: t[2] ? '#f4f1ea' : 'transparent', dot: t[2] ? club : 'transparent' }));
    const meters = [{ v: '100', label: 'Fiducia mister', ring: 'conic-gradient(#4ade80 0 100%, rgba(0,0,0,0.3) 0)' }, { v: '88', label: 'Tifosi', ring: 'conic-gradient(#e8b44a 0 88%, rgba(0,0,0,0.3) 0)' }];
    const list = [['1', 'J. Seifert', 'Portiere', 84], ['2', 'P. Krämer', 'Terzino destro', 79], ['5', 'M. Langer', 'Difensore centrale', 82], ['8', 'T. Pohl', 'Centrocampista', 85], ['10', 'L. Brandi', 'Attaccante · tu', 90], ['11', 'K. Theis', 'Ala destra', 83], ['14', 'A. Horn', 'Mediano', 80], ['19', 'F. Klein', 'Seconda punta', 81], ['23', 'R. Janke', 'Ala sinistra', 78]];
    const mates = list.map((m) => { const me = m[2].indexOf('tu') >= 0; return { num: m[0], name: m[1], role: m[2], ovr: m[3], bg: me ? 'rgba(232,180,74,0.10)' : 'transparent', numColor: me ? '#e8b44a' : '#596273', ovrBg: m[3] >= 85 ? '#e8b44a' : '#262b37', ovrFg: m[3] >= 85 ? '#0d0f14' : '#f4f1ea' }; });
    return { club, tabs, meters, mates };
  }
}
</script>
</body>
</html>
