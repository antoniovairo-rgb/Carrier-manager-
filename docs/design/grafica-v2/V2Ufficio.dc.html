<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Ufficio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <main style="flex-grow: 1; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9aa3b2;">Patrimonio e staff</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; text-transform: uppercase; line-height: 1;">Ufficio</span>
    </div>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Patrimonio</span>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 54px; line-height: 0.9;">€64,3<span style="font-size: 24px;"> mln</span></span>
        <span style="font-size: 13px; font-weight: 700; color: #4ade80;">▲ €1,9 mln</span>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 4px; height: 40px;" role="img" aria-label="Andamento del patrimonio negli ultimi 12 mesi, in crescita">
        <sc-for list="{{spark}}" as="s" hint-placeholder-count="12"><div style="flex-grow: 1; height: {{s.h}}; border-radius: 3px 3px 0 0; background: {{s.c}};"></div></sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
          <div style="background: #11141b; border-radius: 12px; padding: 10px;"><span style="display: block; font-size: 11px; color: #9aa3b2;">{{it.name}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px;">{{it.val}}</span></div>
        </sc-for>
      </div>
    </section>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Personal trainer</span>
        <span style="display: flex; gap: 4px;" aria-label="Livello 3 di 5"><span style="width: 18px; height: 6px; border-radius: 3px; background: #e8b44a;"></span><span style="width: 18px; height: 6px; border-radius: 3px; background: #e8b44a;"></span><span style="width: 18px; height: 6px; border-radius: 3px; background: #e8b44a;"></span><span style="width: 18px; height: 6px; border-radius: 3px; background: #2a2f3b;"></span><span style="width: 18px; height: 6px; border-radius: 3px; background: #2a2f3b;"></span></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center;">
        <div><span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px;">+3</span><span style="font-size: 11px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.1em;">Fisico</span></div>
        <div><span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; color: #4ade80;">Buona</span><span style="font-size: 11px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.1em;">Resa</span></div>
        <div><span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px;">€40k</span><span style="font-size: 11px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.1em;">Al mese</span></div>
      </div>
      <div style="border-left: 3px solid #60a5fa; padding: 2px 0 2px 10px; font-size: 14px; line-height: 1.4; color: #cbd5e1;">Al livello 4 il calo di forma dopo i 30 anni rallenta.</div>
      <div style="display: flex; gap: 8px;">
        <button type="button" aria-label="Riduci livello" style="width: 50px; min-height: 50px; border-radius: 14px; border: 0; background: #262b37; color: #f4f1ea; font-size: 22px; font-weight: 600;">−</button>
        <button type="button" aria-label="Aumenta livello" style="width: 50px; min-height: 50px; border-radius: 14px; border: 0; background: #262b37; color: #f4f1ea; font-size: 22px; font-weight: 600;">+</button>
        <button type="button" style="flex-grow: 1; min-height: 50px; border: 0; border-radius: 14px; background: #f4f1ea; color: #0d0f14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase;">Passa al livello 4</button>
      </div>
    </section>
  </main>

  <nav aria-label="Schede" style="margin: 0 12px 12px; background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 5px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <a href="{{t.href}}" style="min-height: 50px; border-radius: 14px; background: {{t.bg}}; color: {{t.color}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 700;">{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = [44, 46, 47, 47, 50, 52, 54, 55, 58, 60, 62, 64];
    const spark = v.map((x, i) => ({ h: Math.round((x - 40) / 24 * 40) + 'px', c: i === v.length - 1 ? '#4ade80' : '#3a4152' }));
    const items = [{ name: 'Casa', val: '€3,4 mln' }, { name: 'Accademia', val: '12 ragazzi' }, { name: 'Investimenti', val: '€18 mln' }];
    const T = [['Home', 'V2Home.dc.html'], ['Stagione', 'V2Stagione.dc.html'], ['Club', 'V2Club.dc.html'], ['Carriera', 'V2Carriera.dc.html'], ['Agente', 'V2Agente.dc.html'], ['Ufficio', 'V2Ufficio.dc.html', true]];
    const tabs = T.map((t) => ({ label: t[0], href: t[1], bg: t[2] ? '#f4f1ea' : 'transparent', color: t[2] ? '#0d0f14' : '#9aa3b2' }));
    return { spark, items, tabs };
  }
}
</script>
</body>
</html>
