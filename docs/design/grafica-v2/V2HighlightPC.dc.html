<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Highlight su PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) 440px; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <section aria-label="Scena 3D" style="position: relative; overflow: hidden; background: #0a0c11;">
    <svg width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-label="Inquadratura dell'azione: Brandi al limite dell'area, Pohl libero a destra" style="position: absolute; inset: 0;">
      <defs><pattern id="crowdpc" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#ffffff"/></pattern></defs>
      <rect x="0" y="0" width="1000" height="230" fill="#0f1320"/>
      <rect x="0" y="120" width="1000" height="110" fill="{{club}}" opacity="0.55"/>
      <rect x="0" y="120" width="1000" height="110" fill="url(#crowdpc)" opacity="0.45"/>
      <circle cx="90" cy="46" r="20" fill="#fff7d6"/><circle cx="910" cy="46" r="20" fill="#fff7d6"/>
      <polygon points="0,230 1000,230 1000,900 0,900" fill="#2b7a37"/>
      <polygon points="100,230 230,230 0,620 0,420" fill="#2f8440"/><polygon points="370,230 500,230 330,900 110,900" fill="#2f8440"/><polygon points="640,230 770,230 840,900 620,900" fill="#2f8440"/><polygon points="900,230 1000,230 1000,900 1060,900" fill="#2f8440"/>
      <polygon points="240,230 760,230 880,480 120,480" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="4"/>
      <polygon points="410,230 590,230 615,300 385,300" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="4"/>
      <rect x="430" y="170" width="140" height="60" fill="none" stroke="#ffffff" stroke-width="5"/>
      <path d="M260 640 Q 620 520 770 560" fill="none" stroke="#e8b44a" stroke-width="4" stroke-dasharray="12 10"/>
      <ellipse cx="500" cy="240" rx="26" ry="6" fill="rgba(0,0,0,0.35)"/><rect x="484" y="186" width="32" height="54" rx="16" fill="#facc15"/>
      <ellipse cx="380" cy="560" rx="28" ry="8" fill="rgba(0,0,0,0.35)"/><rect x="363" y="488" width="34" height="72" rx="17" fill="#1d4ed8"/>
      <ellipse cx="560" cy="530" rx="28" ry="8" fill="rgba(0,0,0,0.35)"/><rect x="543" y="458" width="34" height="72" rx="17" fill="#1d4ed8"/>
      <ellipse cx="770" cy="590" rx="32" ry="9" fill="rgba(0,0,0,0.35)"/><rect x="751" y="500" width="38" height="90" rx="19" fill="{{club}}" stroke="#ffffff" stroke-width="2.5"/>
      <ellipse cx="260" cy="760" rx="44" ry="12" fill="rgba(0,0,0,0.4)"/><rect x="232" y="630" width="56" height="130" rx="28" fill="{{club}}" stroke="#e8b44a" stroke-width="5"/>
      <circle cx="306" cy="752" r="13" fill="#ffffff" stroke="#0d0f14" stroke-width="2"/>
    </svg>
    <div style="position: absolute; left: 24px; top: 22px; display: flex; align-items: stretch; border-radius: 12px; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.04em; box-shadow: 0 8px 20px rgba(0,0,0,0.45);">
      <span style="background: {{club}}; padding: 6px 14px;">VAL</span><span style="background: #f4f1ea; color: #0d0f14; padding: 6px 14px;">1 – 0</span><span style="background: #1d4ed8; padding: 6px 14px;">RUH</span><span style="background: #0d0f14; color: #e8b44a; padding: 6px 12px;">63'</span>
    </div>
    <span style="position: absolute; left: 730px; top: 462px; background: rgba(13,15,20,0.85); border-radius: 8px; padding: 3px 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.04em;">8 POHL · LIBERO</span>
    <span style="position: absolute; left: 200px; top: 590px; background: #e8b44a; color: #0d0f14; border-radius: 8px; padding: 3px 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.04em;">10 BRANDI</span>
  </section>

  <aside style="background: #11141b; border-left: 1px solid rgba(255,255,255,0.06); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #e8b44a;">La tua giocata</span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 38px; text-transform: uppercase; line-height: 1;">Palla al limite, due uomini addosso</span>
    <div aria-label="Tempo per decidere" style="height: 5px; border-radius: 999px; background: #262b37; overflow: hidden;"><div style="width: 62%; height: 100%; background: #e8b44a;"></div></div>
    <sc-for list="{{choices}}" as="c" hint-placeholder-count="3">
      <button type="button" style="min-height: 84px; border-radius: 18px; border: {{c.border}}; background: {{c.bg}}; color: #f4f1ea; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; text-align: left; font-family: 'Barlow', sans-serif;">
        <span style="display: flex; justify-content: space-between; align-items: baseline; width: 100%;"><span style="font-weight: 700; font-size: 18px;">{{c.label}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.06em; color: #9aa3b2;">{{c.stat}}</span></span>
        <span style="display: flex; align-items: center; gap: 12px; width: 100%;"><span style="flex-grow: 1; height: 7px; border-radius: 999px; background: #2a2f3b; overflow: hidden;"><span style="display: block; width: {{c.pct}}; height: 100%; background: {{c.barColor}};"></span></span><span style="font-size: 13px; font-weight: 700; color: {{c.barColor}}; min-width: 76px; text-align: right;">{{c.risk}}</span></span>
      </button>
    </sc-for>
    <div role="status" style="margin-top: auto; border-radius: 20px; padding: 2px; background: linear-gradient(145deg, #fbe7a1 0%, #e8b44a 35%, #9c6a12 65%, #f5d27a 100%);">
      <div style="border-radius: 18px; background: #14110b; padding: 18px; display: flex; gap: 16px; align-items: center;">
        <div style="width: 70px; height: 70px; border-radius: 50%; background: conic-gradient(#e8b44a 0 75%, #2a2418 0); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><div style="width: 58px; height: 58px; border-radius: 50%; background: #14110b; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; color: #e8b44a;">7.5</div></div>
        <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #e8b44a;">Assist perfetto</span><span style="font-size: 17px; line-height: 1.35;">Uno-due con Pohl, che calcia di prima: 2 – 0.</span></div>
      </div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#8e1f33"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const choices = [
      { label: 'Uno-due con Pohl', stat: 'PASSAGGIO 87', pct: '68%', risk: 'Buona', barColor: '#4ade80', bg: '#1f2a24', border: '1.5px solid #4ade80' },
      { label: 'Finta e cambio di passo', stat: 'DRIBBLING 89', pct: '52%', risk: 'Media', barColor: '#fbbf24', bg: '#1a1e27', border: '1px solid rgba(255,255,255,0.08)' },
      { label: 'Conclusione potente', stat: 'TIRO 92', pct: '31%', risk: 'Difficile', barColor: '#f87171', bg: '#1a1e27', border: '1px solid rgba(255,255,255,0.08)' }
    ];
    return { club: this.props.club ?? '#8e1f33', choices };
  }
}
</script>
</body>
</html>
