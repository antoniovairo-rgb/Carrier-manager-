<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Club</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <header style="position: relative; background: {{club}}; padding: 22px 16px 18px; display: flex; align-items: center; gap: 14px; overflow: hidden;">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 18px, rgba(255,255,255,0) 18px 36px);"></div>
    <div style="position: relative; width: 72px; height: 72px; border-radius: 20px; background: #f4f1ea; color: {{club}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; box-shadow: 0 10px 24px rgba(0,0,0,0.3); flex-shrink: 0;">VAL</div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; text-transform: uppercase; line-height: 1;">FC Valdenau</span>
      <span style="font-size: 13px; color: rgba(255,255,255,0.85);">Deutsche Liga · Stadio Am Wald</span>
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fde68a; margin-top: 2px;">Obiettivo: Coppa dei Campioni</span>
    </div>
  </header>

  <main style="flex-grow: 1; padding: 12px 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{meters}}" as="m" hint-placeholder-count="2">
        <div style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 12px; display: flex; align-items: center; gap: 12px;">
          <div style="width: 50px; height: 50px; border-radius: 50%; background: {{m.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><div style="width: 40px; height: 40px; border-radius: 50%; background: #1a1e27; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px;">{{m.v}}</div></div>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9aa3b2; line-height: 1.3;">{{m.label}}</span>
        </div>
      </sc-for>
    </section>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 6px 6px 14px; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Undici titolare</span>
        <a href="#" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; font-size: 13px; font-weight: 600; text-decoration: none; color: #e8b44a;">Tutta la rosa</a>
      </div>
      <sc-for list="{{mates}}" as="m" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 50px; border-bottom: 1px solid rgba(255,255,255,0.04); background: {{m.bg}};">
          <span style="width: 34px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: {{m.numColor}};">{{m.num}}</span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;"><span style="font-weight: 600; font-size: 15px;">{{m.name}}</span><span style="font-size: 12px; color: #9aa3b2;">{{m.role}}</span></span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; padding: 2px 8px; border-radius: 8px; background: {{m.ovrBg}}; color: {{m.ovrFg}};">{{m.ovr}}</span>
        </div>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Schede" style="margin: 0 12px 12px; background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 5px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <a href="{{t.href}}" style="min-height: 50px; border-radius: 14px; background: {{t.bg}}; color: {{t.color}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 700;">{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#8e1f33"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const meters = [
      { v: '100', label: 'Fiducia del mister', ring: 'conic-gradient(#4ade80 0 100%, #2a2f3b 0)' },
      { v: '88', label: 'Amore dei tifosi', ring: 'conic-gradient(#e8b44a 0 88%, #2a2f3b 0)' }
    ];
    const list = [['1', 'J. Seifert', 'Portiere', 84], ['5', 'M. Langer', 'Difensore centrale', 82], ['8', 'T. Pohl', 'Centrocampista', 85], ['10', 'L. Brandi', 'Attaccante · tu', 90], ['11', 'K. Theis', 'Ala destra', 83], ['14', 'A. Horn', 'Mediano', 80], ['19', 'F. Klein', 'Seconda punta', 81]];
    const mates = list.map((m) => { const me = m[2].indexOf('tu') >= 0; return { num: m[0], name: m[1], role: m[2], ovr: m[3], bg: me ? 'rgba(232,180,74,0.10)' : 'transparent', numColor: me ? '#e8b44a' : '#596273', ovrBg: m[3] >= 85 ? '#e8b44a' : '#262b37', ovrFg: m[3] >= 85 ? '#0d0f14' : '#f4f1ea' }; });
    const T = [['Home', 'V2Home.dc.html'], ['Stagione', 'V2Stagione.dc.html'], ['Club', 'V2Club.dc.html', true], ['Carriera', 'V2Carriera.dc.html'], ['Agente', 'V2Agente.dc.html'], ['Ufficio', 'V2Ufficio.dc.html']];
    const tabs = T.map((t) => ({ label: t[0], href: t[1], bg: t[2] ? '#f4f1ea' : 'transparent', color: t[2] ? '#0d0f14' : '#9aa3b2' }));
    return { club: this.props.club ?? '#8e1f33', meters, mates, tabs };
  }
}
</script>
</body>
</html>
