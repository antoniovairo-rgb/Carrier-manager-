<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Highlight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <section aria-label="Scena 3D" style="position: relative; height: 452px; flex-shrink: 0; overflow: hidden; background: #0a0c11;">
    <svg width="390" height="452" viewBox="0 0 390 452" role="img" aria-label="Inquadratura dell'azione: Brandi al limite dell'area, Pohl libero a destra" style="position: absolute; inset: 0;">
      <rect x="0" y="0" width="390" height="120" fill="#0f1320"/>
      <rect x="0" y="70" width="390" height="56" fill="{{club}}" opacity="0.55"/>
      <rect x="0" y="70" width="390" height="56" fill="url(#crowd)" opacity="0.5"/>
      <circle cx="40" cy="22" r="10" fill="#fff7d6" opacity="0.9"/><circle cx="350" cy="22" r="10" fill="#fff7d6" opacity="0.9"/>
      <polygon points="0,126 390,126 390,452 0,452" fill="#2b7a37"/>
      <polygon points="40,126 92,126 0,300 0,210" fill="#2f8440"/><polygon points="144,126 196,126 120,452 30,452" fill="#2f8440"/><polygon points="248,126 300,126 330,452 240,452" fill="#2f8440"/><polygon points="352,126 390,126 390,452 420,452" fill="#2f8440"/>
      <polygon points="95,126 295,126 340,232 50,232" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>
      <polygon points="160,126 230,126 240,160 150,160" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>
      <rect x="168" y="96" width="54" height="30" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M90 302 Q 240 240 300 260" fill="none" stroke="#e8b44a" stroke-width="2.5" stroke-dasharray="7 6"/>
      <ellipse cx="195" cy="132" rx="12" ry="3" fill="rgba(0,0,0,0.35)"/><rect x="187" y="104" width="16" height="28" rx="8" fill="#facc15"/>
      <ellipse cx="140" cy="262" rx="14" ry="4" fill="rgba(0,0,0,0.35)"/><rect x="131" y="226" width="18" height="36" rx="9" fill="#1d4ed8"/>
      <ellipse cx="210" cy="250" rx="14" ry="4" fill="rgba(0,0,0,0.35)"/><rect x="201" y="214" width="18" height="36" rx="9" fill="#1d4ed8"/>
      <ellipse cx="302" cy="276" rx="16" ry="5" fill="rgba(0,0,0,0.35)"/><rect x="292" y="232" width="20" height="44" rx="10" fill="{{club}}" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="92" cy="350" rx="22" ry="6" fill="rgba(0,0,0,0.4)"/><rect x="78" y="286" width="28" height="64" rx="14" fill="{{club}}" stroke="#e8b44a" stroke-width="3"/>
      <circle cx="114" cy="346" r="7" fill="#ffffff" stroke="#0d0f14" stroke-width="1.5"/>
      <defs><pattern id="crowd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff"/></pattern></defs>
    </svg>

    <div style="position: absolute; left: 12px; top: 12px; display: flex; align-items: stretch; border-radius: 10px; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.04em; box-shadow: 0 6px 16px rgba(0,0,0,0.4);">
      <span style="background: {{club}}; padding: 5px 9px;">VAL</span>
      <span style="background: #f4f1ea; color: #0d0f14; padding: 5px 9px; font-variant-numeric: tabular-nums;">1 – 0</span>
      <span style="background: #1d4ed8; padding: 5px 9px;">RUH</span>
      <span style="background: #0d0f14; color: #e8b44a; padding: 5px 9px;">63'</span>
    </div>

    <span style="position: absolute; left: 292px; top: 210px; transform: translateX(-30%); background: rgba(13,15,20,0.85); border-radius: 6px; padding: 2px 7px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.04em;">8 POHL · LIBERO</span>
    <span style="position: absolute; left: 60px; top: 262px; background: #e8b44a; color: #0d0f14; border-radius: 6px; padding: 2px 7px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.04em;">10 BRANDI</span>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; background: linear-gradient(0deg, #0d0f14 20%, rgba(13,15,20,0) 100%);">
      <span style="display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #e8b44a;">La tua giocata</span>
      <span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; line-height: 1.05;">Palla al limite, due uomini addosso</span>
    </div>
  </section>

  <div aria-label="Tempo per decidere" style="height: 4px; margin: 0 16px; border-radius: 999px; background: #262b37; overflow: hidden;"><div style="width: 62%; height: 100%; background: #e8b44a;"></div></div>

  <section style="flex-grow: 1; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{choices}}" as="c" hint-placeholder-count="3">
      <button type="button" style="min-height: 72px; border-radius: 16px; border: {{c.border}}; background: {{c.bg}}; color: #f4f1ea; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; text-align: left; font-family: 'Barlow', sans-serif;">
        <span style="display: flex; justify-content: space-between; align-items: baseline; width: 100%;">
          <span style="font-weight: 700; font-size: 16px;">{{c.label}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; color: #9aa3b2;">{{c.stat}}</span>
        </span>
        <span style="display: flex; align-items: center; gap: 10px; width: 100%;">
          <span style="flex-grow: 1; height: 6px; border-radius: 999px; background: #2a2f3b; overflow: hidden;"><span style="display: block; width: {{c.pct}}; height: 100%; background: {{c.barColor}};"></span></span>
          <span style="font-size: 12px; font-weight: 700; color: {{c.barColor}}; min-width: 74px; text-align: right;">{{c.risk}}</span>
        </span>
      </button>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#8e1f33"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const choices = [
      { label: 'Uno-due con Pohl', stat: 'PASSAGGIO 87', pct: '68%', risk: 'Buona', barColor: '#4ade80', bg: '#1f2a24', border: '1.5px solid #4ade80' },
      { label: 'Finta e cambio di passo', stat: 'DRIBBLING 89', pct: '52%', risk: 'Media', barColor: '#fbbf24', bg: '#1a1e27', border: '1px solid rgba(255,255,255,0.08)' },
      { label: 'Conclusione potente', stat: 'TIRO 92', pct: '31%', risk: 'Difficile', barColor: '#f87171', bg: '#1a1e27', border: '1px solid rgba(255,255,255,0.08)' }
    ];
    return { club: this.props.club ?? '#8e1f33', choices };
  }
}
</script>
</body>
</html>
