<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Festeggiamenti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 56px 20px 20px; gap: 14px; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden; text-align: center;">

  <svg aria-hidden="true" width="390" height="420" viewBox="0 0 390 420" style="position: absolute; left: 0; top: 0;">
    <g stroke="#e8b44a" stroke-width="2" opacity="0.28">
      <line x1="195" y1="190" x2="195" y2="0"/><line x1="195" y1="190" x2="60" y2="20"/><line x1="195" y1="190" x2="330" y2="20"/><line x1="195" y1="190" x2="0" y2="120"/><line x1="195" y1="190" x2="390" y2="120"/><line x1="195" y1="190" x2="0" y2="280"/><line x1="195" y1="190" x2="390" y2="280"/>
    </g>
    <g><rect x="40" y="60" width="8" height="14" fill="#e8b44a" transform="rotate(25 44 67)"/><rect x="330" y="90" width="8" height="14" fill="{{club}}" transform="rotate(-20 334 97)"/><rect x="90" y="300" width="8" height="14" fill="#f4f1ea" transform="rotate(40 94 307)"/><rect x="300" y="320" width="8" height="14" fill="#e8b44a" transform="rotate(-35 304 327)"/><rect x="70" y="190" width="8" height="14" fill="{{club}}" transform="rotate(15 74 197)"/><rect x="320" y="220" width="8" height="14" fill="#f4f1ea" transform="rotate(60 324 227)"/></g>
  </svg>

  <div style="position: relative; width: 180px; height: 180px; border-radius: 50%; background: conic-gradient(from 210deg, #fbe7a1, #e8b44a, #9c6a12, #f5d27a, #fbe7a1); padding: 6px; box-sizing: border-box;">
    <div style="width: 100%; height: 100%; border-radius: 50%; background: #14110b; display: flex; align-items: center; justify-content: center; color: #e8b44a;">
      <svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Coppa"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/><path d="M12 14v4M8 21h8"/></svg>
    </div>
  </div>

  <span style="position: relative; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #e8b44a; margin-top: 8px;">Korward Champions Cup</span>
  <span style="position: relative; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 58px; text-transform: uppercase; line-height: 0.88;">Campioni<br>d'Europa</span>
  <span style="position: relative; font-size: 16px; line-height: 1.45; color: #d6cfc0; max-width: 310px;">«{{line}}»</span>

  <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; background: #1a1e27; border: 1px solid rgba(232,180,74,0.25); border-radius: 18px; padding: 12px 4px; margin-top: 4px;">
    <div style="display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.08);"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px;">2–1</span><span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">Finale</span></div>
    <div style="display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.08);"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; color: #e8b44a;">11</span><span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">Gol in coppa</span></div>
    <div style="display: flex; flex-direction: column;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px;">4</span><span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">Trofei</span></div>
  </div>

  <div style="position: relative; display: flex; gap: 8px; width: 100%; margin-top: auto;">
    <button type="button" style="flex-grow: 1; min-height: 54px; border: 0; border-radius: 14px; background: #e8b44a; color: #14110b; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase;">Alza la coppa</button>
    <button type="button" style="min-height: 54px; padding: 0 18px; border-radius: 14px; border: 0; background: #1a1e27; color: #f4f1ea; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 15px;">Salta</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#8e1f33"},"variant":{"editor":"enum","default":"1","options":["1","2","3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const lines = {
      '1': 'Da ragazzo guardavo questa coppa in tv. Stasera è anche nostra.',
      '2': 'Undici gol per arrivare fin qui: dedico questa notte alla mia famiglia.',
      '3': 'Valdenau sul tetto d’Europa: nessuno ci credeva, noi sì.'
    };
    return { club: this.props.club ?? '#8e1f33', line: lines[this.props.variant ?? '1'] || lines['1'] };
  }
}
</script>
</body>
</html>
