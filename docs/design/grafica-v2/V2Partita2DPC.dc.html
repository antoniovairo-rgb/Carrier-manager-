<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Partita 2D su PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: grid; grid-template-columns: 1000px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 18px; padding: 22px 26px; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <header style="grid-column: 1 / 3; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: stretch; border-radius: 14px; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: 0.04em; box-shadow: 0 10px 24px rgba(0,0,0,0.4);">
      <span style="background: {{home}}; padding: 10px 20px; font-size: 26px;">VALDENAU</span>
      <span style="background: #f4f1ea; color: #0d0f14; padding: 10px 20px; font-size: 30px; font-variant-numeric: tabular-nums;">1 – 0</span>
      <span style="background: {{away}}; padding: 10px 20px; font-size: 26px;">RUHRPOTT</span>
      <span style="background: #1a1e27; color: #e8b44a; padding: 10px 16px; font-size: 26px;">63'</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; width: 340px;">
      <div style="display: flex; height: 8px; border-radius: 999px; overflow: hidden;"><div style="width: 54%; background: {{home}};"></div><div style="width: 46%; background: {{away}};"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;"><span>Possesso 54%</span><span>46%</span></div>
    </div>
  </header>

  <section aria-label="Campo" style="position: relative; border-radius: 22px; overflow: hidden; background: #0f1320; padding: 14px;">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 14px; background: repeating-linear-gradient(90deg, {{home}} 0 12px, rgba(0,0,0,0.35) 12px 18px);"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: repeating-linear-gradient(90deg, {{home}} 0 12px, rgba(0,0,0,0.35) 12px 18px);"></div>
    <div style="position: relative; width: 972px; height: 600px;">
      <svg width="972" height="600" viewBox="0 0 972 600" role="img" aria-label="Campo visto dall'alto: Valdenau attacca verso destra" style="position: absolute; inset: 0;">
        <rect x="0" y="0" width="972" height="600" rx="12" fill="#2b7a37"/>
        <rect x="0" y="0" width="81" height="600" fill="#2f8440"/><rect x="162" y="0" width="81" height="600" fill="#2f8440"/><rect x="324" y="0" width="81" height="600" fill="#2f8440"/><rect x="486" y="0" width="81" height="600" fill="#2f8440"/><rect x="648" y="0" width="81" height="600" fill="#2f8440"/><rect x="810" y="0" width="81" height="600" fill="#2f8440"/>
        <g fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.5"><rect x="10" y="10" width="952" height="580" rx="4"/><line x1="486" y1="10" x2="486" y2="590"/><circle cx="486" cy="300" r="70"/><rect x="10" y="160" width="130" height="280"/><rect x="10" y="240" width="46" height="120"/><rect x="832" y="160" width="130" height="280"/><rect x="916" y="240" width="46" height="120"/></g>
        <path d="M700 200 L 790 160" stroke="#e8b44a" stroke-width="3" stroke-dasharray="7 6"/>
      </svg>
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="18">
        <div style="position: absolute; left: {{d.left}}; top: {{d.top}}; width: {{d.size}}; height: {{d.size}}; border-radius: 50%; background: {{d.c}}; border: {{d.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; color: #ffffff;">{{d.n}}</div>
      </sc-for>
      <div style="position: absolute; left: 712px; top: 192px; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 2px #0d0f14;"></div>
      <span style="position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(13,15,20,0.85); border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #cbd5e1;">2° tempo · Valdenau attacca verso destra</span>
    </div>
  </section>

  <aside style="display: flex; flex-direction: column; gap: 14px; min-height: 0;">
    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Cronaca</span>
      <sc-for list="{{feed}}" as="f" hint-placeholder-count="4"><div style="display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; font-size: 15px; line-height: 1.4;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; color: {{f.c}};">{{f.min}}</span><span>{{f.text}}</span></div></sc-for>
    </section>
    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div><span style="display: block; font-size: 12px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.1em;">Tiri</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px;">9 – 4</span></div>
      <div><span style="display: block; font-size: 12px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.1em;">In porta</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px;">4 – 1</span></div>
    </section>
    <div style="margin-top: auto; display: flex; gap: 8px;">
      <button type="button" aria-label="Pausa" style="width: 58px; min-height: 54px; border-radius: 16px; border: 0; background: #1a1e27; color: #f4f1ea; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
      <div role="group" aria-label="Velocità" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; flex-grow: 1; background: #1a1e27; border-radius: 16px; padding: 4px;">
        <button type="button" style="min-height: 46px; border: 0; border-radius: 12px; background: transparent; color: #9aa3b2; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px;">1×</button>
        <button type="button" aria-pressed="true" style="min-height: 46px; border: 0; border-radius: 12px; background: #f4f1ea; color: #0d0f14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px;">2×</button>
        <button type="button" style="min-height: 46px; border: 0; border-radius: 12px; background: transparent; color: #9aa3b2; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px;">4×</button>
      </div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"home":{"editor":"color","default":"#8e1f33"},"away":{"editor":"color","default":"#1d4ed8"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const home = this.props.home ?? '#8e1f33';
    const away = this.props.away ?? '#1d4ed8';
    const H = [[40,300,'1'],[160,90,'2'],[150,230,'5'],[150,370,'4'],[160,510,'3'],[340,150,'14'],[420,300,'8'],[480,470,'11'],[620,330,'19'],[700,200,'10']];
    const A = [[930,300,'1'],[820,120,'2'],[830,250,'5'],[830,370,'4'],[820,500,'3'],[700,280,'6'],[680,420,'8'],[560,300,'9']];
    const mk = (p, c, hero) => { const r = hero ? 17 : 14; return { left: (p[0] - r) + 'px', top: (p[1] - r) + 'px', size: (r * 2) + 'px', n: p[2], c, border: hero ? '3px solid #e8b44a' : '2px solid #ffffff' }; };
    const dots = H.map((p) => mk(p, home, p[2] === '10')).concat(A.map((p) => mk(p, away, false)));
    const feed = [
      { min: "62'", text: 'Pohl recupera palla e cerca Brandi sulla corsa…', c: '#e8b44a' },
      { min: "58'", text: 'Seifert esce bene su un cross dalla sinistra.', c: '#9aa3b2' },
      { min: "51'", text: 'Ammonito Krause per un fallo su Pohl.', c: '#fbbf24' },
      { min: "38'", text: 'Gol di Brandi: conclusione potente sul primo palo.', c: '#4ade80' }
    ];
    return { home, away, dots, feed };
  }
}
</script>
</body>
</html>
