<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Ufficio su PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <aside style="width: 236px; flex-shrink: 0; background: #11141b; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; padding: 22px 14px; gap: 22px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #8e1f33; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px;">VAL</div>
      <div style="display: flex; flex-direction: column; line-height: 1.15;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.06em; text-transform: uppercase;">FC Valdenau</span><span style="font-size: 12px; color: #9aa3b2;">St. 14 · G11</span></div>
    </div>
    <nav aria-label="Schede" style="display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" style="min-height: 46px; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 15px; font-weight: {{t.weight}}; color: {{t.color}}; background: {{t.bg}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.dot}};"></span>{{t.label}}</a>
      </sc-for>
    </nav>
  </aside>

  <main style="flex-grow: 1; padding: 28px 32px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: auto auto; gap: 16px; align-content: start; box-sizing: border-box; min-width: 0;">
    <div style="grid-column: 1 / 3; display: flex; flex-direction: column;"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9aa3b2;">Patrimonio e staff</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 48px; text-transform: uppercase; line-height: 1;">Ufficio</span></div>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Patrimonio</span>
      <div style="display: flex; align-items: baseline; gap: 14px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 88px; line-height: 0.85;">€64,3<span style="font-size: 36px;"> mln</span></span><span style="font-size: 16px; font-weight: 700; color: #4ade80;">▲ €1,9 mln questo mese</span></div>
      <div style="display: flex; align-items: flex-end; gap: 8px; height: 120px;" role="img" aria-label="Patrimonio negli ultimi 12 mesi, in crescita"><sc-for list="{{spark}}" as="s" hint-placeholder-count="12"><div style="flex-grow: 1; height: {{s.h}}; border-radius: 4px 4px 0 0; background: {{s.c}};"></div></sc-for></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;"><sc-for list="{{items}}" as="it" hint-placeholder-count="3"><div style="background: #11141b; border-radius: 14px; padding: 14px;"><span style="display: block; font-size: 12px; color: #9aa3b2;">{{it.name}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px;">{{it.val}}</span></div></sc-for></div>
    </section>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Personal trainer</span><span style="display: flex; gap: 5px;" aria-label="Livello 3 di 5"><span style="width: 24px; height: 7px; border-radius: 4px; background: #e8b44a;"></span><span style="width: 24px; height: 7px; border-radius: 4px; background: #e8b44a;"></span><span style="width: 24px; height: 7px; border-radius: 4px; background: #e8b44a;"></span><span style="width: 24px; height: 7px; border-radius: 4px; background: #2a2f3b;"></span><span style="width: 24px; height: 7px; border-radius: 4px; background: #2a2f3b;"></span></span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center;">
        <div><span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px;">+3</span><span style="font-size: 12px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.1em;">Fisico</span></div>
        <div><span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; color: #4ade80;">Buona</span><span style="font-size: 12px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.1em;">Resa</span></div>
        <div><span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px;">€40k</span><span style="font-size: 12px; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.1em;">Al mese</span></div>
      </div>
      <div style="border-left: 3px solid #60a5fa; padding: 2px 0 2px 12px; font-size: 16px; line-height: 1.4; color: #cbd5e1;">Al livello 4 il calo di forma dopo i 30 anni rallenta.</div>
      <div style="display: flex; gap: 10px; margin-top: auto;">
        <button type="button" aria-label="Riduci livello" style="width: 56px; min-height: 56px; border-radius: 16px; border: 0; background: #262b37; color: #f4f1ea; font-size: 24px; font-weight: 600;">−</button>
        <button type="button" aria-label="Aumenta livello" style="width: 56px; min-height: 56px; border-radius: 16px; border: 0; background: #262b37; color: #f4f1ea; font-size: 24px; font-weight: 600;">+</button>
        <button type="button" style="flex-grow: 1; min-height: 56px; border: 0; border-radius: 16px; background: #f4f1ea; color: #0d0f14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase;">Passa al livello 4</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const T = [['Home', 'V2HomePC.dc.html'], ['Stagione', 'V2StagionePC.dc.html'], ['Club', 'V2ClubPC.dc.html'], ['Carriera', 'V2CarrieraPC.dc.html'], ['Agente', 'V2AgentePC.dc.html'], ['Ufficio', 'V2UfficioPC.dc.html', true]];
    const tabs = T.map((t) => ({ label: t[0], href: t[1], weight: t[2] ? 700 : 500, color: t[2] ? '#0d0f14' : '#9aa3b2', bg: t[2] ? '#f4f1ea' : 'transparent', dot: t[2] ? '#8e1f33' : 'transparent' }));
    const v = [44, 46, 47, 47, 50, 52, 54, 55, 58, 60, 62, 64];
    const spark = v.map((x, i) => ({ h: Math.round((x - 40) / 24 * 120) + 'px', c: i === v.length - 1 ? '#4ade80' : '#3a4152' }));
    const items = [{ name: 'Casa a Valdenau', val: '€3,4 mln' }, { name: 'Accademia Brandi', val: '12 ragazzi' }, { name: 'Investimenti', val: '€18 mln' }];
    return { tabs, spark, items };
  }
}
</script>
</body>
</html>
