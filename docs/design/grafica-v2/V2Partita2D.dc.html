<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Partita 2D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <header style="display: flex; align-items: stretch; justify-content: center; border-radius: 12px; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: 0.04em; align-self: center; box-shadow: 0 8px 20px rgba(0,0,0,0.4);">
    <span style="background: {{home}}; padding: 8px 14px; font-size: 20px;">VAL</span>
    <span style="background: #f4f1ea; color: #0d0f14; padding: 8px 14px; font-size: 22px; font-variant-numeric: tabular-nums;">1 – 0</span>
    <span style="background: {{away}}; padding: 8px 14px; font-size: 20px;">RUH</span>
    <span style="background: #1a1e27; color: #e8b44a; padding: 8px 12px; font-size: 20px;">63'</span>
  </header>

  <div aria-label="Possesso" style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px;">
    <div style="display: flex; height: 6px; border-radius: 999px; overflow: hidden;"><div style="width: 54%; background: {{home}};"></div><div style="width: 46%; background: {{away}};"></div></div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9aa3b2;"><span>Possesso 54%</span><span>46%</span></div>
  </div>

  <section aria-label="Campo" style="position: relative; flex-grow: 1; border-radius: 18px; overflow: hidden; background: #0f1320; padding: 10px;">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(180deg, {{home}} 0 10px, rgba(0,0,0,0.35) 10px 14px);"></div>
    <div aria-hidden="true" style="position: absolute; right: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(180deg, {{home}} 0 10px, rgba(0,0,0,0.35) 10px 14px);"></div>
    <svg width="346" height="520" viewBox="0 0 346 520" role="img" aria-label="Campo visto dall'alto: Valdenau attacca verso l'alto" style="display: block; margin: 0 auto;">
      <rect x="0" y="0" width="346" height="520" rx="10" fill="#2b7a37"/>
      <rect x="0" y="0" width="346" height="52" fill="#2f8440"/><rect x="0" y="104" width="346" height="52" fill="#2f8440"/><rect x="0" y="208" width="346" height="52" fill="#2f8440"/><rect x="0" y="312" width="346" height="52" fill="#2f8440"/><rect x="0" y="416" width="346" height="52" fill="#2f8440"/>
      <g fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2">
        <rect x="8" y="8" width="330" height="504" rx="4"/><line x1="8" y1="260" x2="338" y2="260"/><circle cx="173" cy="260" r="44"/>
        <rect x="88" y="8" width="170" height="70"/><rect x="133" y="8" width="80" height="26"/>
        <rect x="88" y="442" width="170" height="70"/><rect x="133" y="486" width="80" height="26"/>
      </g>
      <path d="M200 150 L 240 112" stroke="#e8b44a" stroke-width="2.5" stroke-dasharray="5 5"/>
    </svg>
    <div style="position: absolute; left: 10px; top: 10px; width: 346px; height: 520px;">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="18">
        <div style="position: absolute; left: {{d.left}}; top: {{d.top}}; width: {{d.size}}; height: {{d.size}}; border-radius: 50%; background: {{d.c}}; border: {{d.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: #ffffff;">{{d.n}}</div>
      </sc-for>
      <div style="position: absolute; left: 202px; top: 141px; width: 10px; height: 10px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 0 1.5px #0d0f14;"></div>
    </div>
    <span style="position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(13,15,20,0.85); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #cbd5e1;">2° tempo · Valdenau attacca in alto</span>
  </section>

  <div style="display: flex; gap: 10px; align-items: flex-start; background: #1a1e27; border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.4;">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; color: #e8b44a;">62'</span>
    <span>Pohl recupera palla e cerca Brandi sulla corsa…</span>
  </div>

  <footer style="display: flex; gap: 8px;">
    <button type="button" aria-label="Pausa" style="width: 52px; min-height: 50px; border-radius: 14px; border: 0; background: #1a1e27; color: #f4f1ea; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
    <div role="group" aria-label="Velocità" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; flex-grow: 1; background: #1a1e27; border-radius: 14px; padding: 4px;">
      <button type="button" style="min-height: 42px; border: 0; border-radius: 10px; background: transparent; color: #9aa3b2; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px;">1×</button>
      <button type="button" aria-pressed="true" style="min-height: 42px; border: 0; border-radius: 10px; background: #f4f1ea; color: #0d0f14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px;">2×</button>
      <button type="button" style="min-height: 42px; border: 0; border-radius: 10px; background: transparent; color: #9aa3b2; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px;">4×</button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"home":{"editor":"color","default":"#8e1f33"},"away":{"editor":"color","default":"#1d4ed8"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const home = this.props.home ?? '#8e1f33';
    const away = this.props.away ?? '#1d4ed8';
    const H = [[173,496,'1'],[60,400,'2'],[130,420,'5'],[216,420,'4'],[286,400,'3'],[110,300,'14'],[200,280,'8'],[290,250,'11'],[120,180,'19'],[200,150,'10']];
    const A = [[173,24,'1'],[80,100,'2'],[140,90,'5'],[210,90,'4'],[270,100,'3'],[120,200,'6'],[230,190,'8'],[173,320,'9']];
    const mk = (p, c, hero) => { const r = hero ? 13 : 11; return { left: (p[0] - r) + 'px', top: (p[1] - r) + 'px', size: (r * 2) + 'px', n: p[2], c, border: hero ? '3px solid #e8b44a' : '1.5px solid #ffffff' }; };
    const dots = H.map((p) => mk(p, home, p[2] === '10')).concat(A.map((p) => mk(p, away, false)));
    return { home, away, dots };
  }
}
</script>
</body>
</html>
