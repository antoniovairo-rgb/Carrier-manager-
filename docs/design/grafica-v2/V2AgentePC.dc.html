<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Agente su PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <aside style="width: 236px; flex-shrink: 0; background: #11141b; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; padding: 22px 14px; gap: 22px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #8e1f33; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px;">VAL</div>
      <div style="display: flex; flex-direction: column; line-height: 1.15;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.06em; text-transform: uppercase;">FC Valdenau</span><span style="font-size: 12px; color: #9aa3b2;">St. 14 · G11</span></div>
    </div>
    <nav aria-label="Schede" style="display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <a href="{{t.href}}" style="min-height: 46px; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 15px; font-weight: {{t.weight}}; color: {{t.color}}; background: {{t.bg}};"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.dot}};"></span>{{t.label}}</a>
      </sc-for>
    </nav>
  </aside>

  <main style="flex-grow: 1; padding: 28px 32px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 16px; box-sizing: border-box; min-width: 0;">
    <div style="grid-column: 1 / 3; display: flex; flex-direction: column;"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9aa3b2;">Mercato e contratto</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 48px; text-transform: uppercase; line-height: 1;">Agente</span></div>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 18px; align-self: start;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #262b37; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px;">AT</div>
        <div style="display: flex; flex-direction: column; flex-grow: 1;"><span style="font-weight: 700; font-size: 19px;">Andrea Turati</span><span style="font-size: 14px; color: #9aa3b2;">Procuratore · commissione 15%</span></div>
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4ade80; border: 1px solid rgba(74,222,128,0.4); border-radius: 999px; padding: 5px 12px;">Fiducia alta</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div style="background: #11141b; border-radius: 16px; padding: 16px;"><span style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">Stipendio annuo</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 46px; line-height: 1.05;">€22,2<span style="font-size: 22px;"> mln</span></span></div>
        <div style="background: #11141b; border-radius: 16px; padding: 16px;"><span style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">Scadenza</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 46px; line-height: 1.05;">St. 16</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; font-size: 13px; color: #9aa3b2;"><span>Contratto trascorso</span><span style="color: #fbbf24; font-weight: 700;">2 stagioni rimaste</span></div><div style="height: 8px; border-radius: 999px; background: #2a2f3b; overflow: hidden;"><div style="width: 50%; height: 100%; background: #fbbf24;"></div></div></div>
      <div style="display: flex; gap: 10px;">
        <button type="button" style="flex-grow: 1; min-height: 54px; border: 0; border-radius: 16px; background: #f4f1ea; color: #0d0f14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase;">Negozia rinnovo</button>
        <button type="button" style="min-height: 54px; padding: 0 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #f4f1ea; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 15px;">Chiedi cessione</button>
        <button type="button" style="min-height: 54px; padding: 0 20px; border-radius: 16px; border: 1px solid rgba(248,113,113,0.45); background: transparent; color: #fca5a5; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 15px;">Cambia procuratore</button>
      </div>
    </section>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; overflow: hidden; align-self: start;">
      <div style="padding: 16px 22px; border-bottom: 1px solid rgba(255,255,255,0.06);"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Voci di mercato</span></div>
      <sc-for list="{{offers}}" as="o" hint-placeholder-count="4">
        <a href="V2Offerta.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 0 22px; min-height: 76px; border-bottom: 1px solid rgba(255,255,255,0.04); text-decoration: none;">
          <span style="width: 46px; height: 46px; border-radius: 14px; background: {{o.color}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; flex-shrink: 0;">{{o.abbr}}</span>
          <span style="display: flex; flex-direction: column; flex-grow: 1;"><span style="font-weight: 600; font-size: 17px;">{{o.club}}</span><span style="font-size: 13px; color: #9aa3b2;">{{o.league}}</span></span>
          <span style="display: flex; gap: 4px;" aria-label="{{o.tag}}"><span style="width: 7px; height: 20px; border-radius: 2px; background: {{o.b1}};"></span><span style="width: 7px; height: 20px; border-radius: 2px; background: {{o.b2}};"></span><span style="width: 7px; height: 20px; border-radius: 2px; background: {{o.b3}};"></span></span>
        </a>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const T = [['Home', 'V2HomePC.dc.html'], ['Stagione', 'V2StagionePC.dc.html'], ['Club', 'V2ClubPC.dc.html'], ['Carriera', 'V2CarrieraPC.dc.html'], ['Agente', 'V2AgentePC.dc.html', true], ['Ufficio', 'V2UfficioPC.dc.html']];
    const tabs = T.map((t) => ({ label: t[0], href: t[1], weight: t[2] ? 700 : 500, color: t[2] ? '#0d0f14' : '#9aa3b2', bg: t[2] ? '#f4f1ea' : 'transparent', dot: t[2] ? '#8e1f33' : 'transparent' }));
    const on = '#4ade80', off = '#2a2f3b';
    const offers = [
      { abbr: 'LIS', club: 'FC Lisboa', league: 'Liga Lusitana · interesse forte', color: '#b91c1c', tag: 'Interesse forte', b1: on, b2: on, b3: on },
      { abbr: 'MRV', club: 'Manchester Rovers', league: 'Premier Division · sondaggio', color: '#1d4ed8', tag: 'Sondaggio', b1: on, b2: on, b3: off },
      { abbr: 'IST', club: 'Istanbul', league: 'Liga Anatolica · voce', color: '#b45309', tag: 'Voce', b1: on, b2: off, b3: off },
      { abbr: 'BRE', club: 'FC Brenvar', league: 'Lega A · voce', color: '#166534', tag: 'Voce', b1: on, b2: off, b3: off }
    ];
    return { tabs, offers };
  }
}
</script>
</body>
</html>
