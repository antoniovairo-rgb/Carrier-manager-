<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Agente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <main style="flex-grow: 1; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9aa3b2;">Mercato e contratto</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; text-transform: uppercase; line-height: 1;">Agente</span>
    </div>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 46px; height: 46px; border-radius: 14px; background: #262b37; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px;">AT</div>
        <div style="display: flex; flex-direction: column; flex-grow: 1;"><span style="font-weight: 700; font-size: 16px;">Andrea Turati</span><span style="font-size: 12px; color: #9aa3b2;">Procuratore · commissione 15%</span></div>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4ade80; border: 1px solid rgba(74,222,128,0.4); border-radius: 999px; padding: 4px 10px;">Fiducia alta</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <div style="background: #11141b; border-radius: 14px; padding: 12px;"><span style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">Stipendio</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1;">€22,2<span style="font-size: 16px;"> mln</span></span></div>
        <div style="background: #11141b; border-radius: 14px; padding: 12px;"><span style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">Scadenza</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1;">St. 16</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9aa3b2;"><span>Contratto trascorso</span><span style="color: #fbbf24; font-weight: 700;">2 stagioni rimaste</span></div>
        <div style="height: 6px; border-radius: 999px; background: #2a2f3b; overflow: hidden;"><div style="width: 50%; height: 100%; background: #fbbf24;"></div></div>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px;">
        <button type="button" style="min-height: 50px; border: 0; border-radius: 14px; background: #f4f1ea; color: #0d0f14; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase;">Negozia rinnovo</button>
        <button type="button" style="min-height: 50px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #f4f1ea; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px;">Cessione</button>
      </div>
    </section>

    <section style="background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; overflow: hidden;">
      <div style="padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06);"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Voci di mercato</span></div>
      <sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
        <a href="V2Offerta.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 60px; border-bottom: 1px solid rgba(255,255,255,0.04); text-decoration: none;">
          <span style="width: 38px; height: 38px; border-radius: 12px; background: {{o.color}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; flex-shrink: 0;">{{o.abbr}}</span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;"><span style="font-weight: 600; font-size: 15px;">{{o.club}}</span><span style="font-size: 12px; color: #9aa3b2;">{{o.league}}</span></span>
          <span style="display: flex; gap: 3px;" aria-label="{{o.tag}}">
            <span style="width: 6px; height: 16px; border-radius: 2px; background: {{o.b1}};"></span><span style="width: 6px; height: 16px; border-radius: 2px; background: {{o.b2}};"></span><span style="width: 6px; height: 16px; border-radius: 2px; background: {{o.b3}};"></span>
          </span>
        </a>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Schede" style="margin: 0 12px 12px; background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 5px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <a href="{{t.href}}" style="min-height: 50px; border-radius: 14px; background: {{t.bg}}; color: {{t.color}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 700;">{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = '#4ade80', off = '#2a2f3b';
    const offers = [
      { abbr: 'LIS', club: 'FC Lisboa', league: 'Liga Lusitana · interesse forte', color: '#b91c1c', tag: 'Interesse forte', b1: on, b2: on, b3: on },
      { abbr: 'MRV', club: 'Manchester Rovers', league: 'Premier Division · sondaggio', color: '#1d4ed8', tag: 'Sondaggio', b1: on, b2: on, b3: off },
      { abbr: 'IST', club: 'Istanbul', league: 'Liga Anatolica · voce', color: '#b45309', tag: 'Voce', b1: on, b2: off, b3: off }
    ];
    const T = [['Home', 'V2Home.dc.html'], ['Stagione', 'V2Stagione.dc.html'], ['Club', 'V2Club.dc.html'], ['Carriera', 'V2Carriera.dc.html'], ['Agente', 'V2Agente.dc.html', true], ['Ufficio', 'V2Ufficio.dc.html']];
    const tabs = T.map((t) => ({ label: t[0], href: t[1], bg: t[2] ? '#f4f1ea' : 'transparent', color: t[2] ? '#0d0f14' : '#9aa3b2' }));
    return { offers, tabs };
  }
}
</script>
</body>
</html>
