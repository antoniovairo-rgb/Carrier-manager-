<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>V2 Carriera e figurina</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f4f1ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 16px 16px; background: #0d0f14; color: #f4f1ea; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; overflow: hidden;">

  <div style="width: 250px; height: 350px; border-radius: 22px; padding: 4px; box-sizing: border-box; background: {{frame}}; box-shadow: 0 24px 48px rgba(0,0,0,0.55);">
    <div style="position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: {{club}}; display: flex; flex-direction: column;">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0 14px, rgba(255,255,255,0) 14px 28px);"></div>
      <div style="position: relative; display: flex; justify-content: space-between; padding: 14px 16px 0;">
        <div style="display: flex; flex-direction: column; align-items: center; line-height: 0.9;">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px;">90</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.14em;">ATT</span>
          <span style="margin-top: 8px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,0.25); border-radius: 4px; padding: 2px 6px;">ESP</span>
        </div>
        <svg width="140" height="150" viewBox="0 0 96 104" role="img" aria-label="Ritratto del giocatore (segnaposto)" style="margin-right: -14px;"><circle cx="48" cy="36" r="22" fill="rgba(255,255,255,0.22)"/><path d="M8 104c4-26 20-38 40-38s36 12 40 38z" fill="rgba(255,255,255,0.22)"/></svg>
      </div>
      <div style="position: relative; margin-top: auto; background: rgba(0,0,0,0.28); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; line-height: 1;">Brandi</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 4px; column-gap: 6px;">
          <sc-for list="{{attrs}}" as="a" hint-placeholder-count="6">
            <span style="display: flex; justify-content: center; gap: 5px; font-family: 'Barlow Condensed', sans-serif; font-size: 16px;"><span style="font-weight: 800;">{{a.v}}</span><span style="font-weight: 600; opacity: 0.75; letter-spacing: 0.06em;">{{a.k}}</span></span>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 0.04em;">Luca Brandi</span>
    <span style="font-size: 13px; color: #9aa3b2;">30 anni · FC Valdenau · titolare</span>
  </div>

  <section style="width: 100%; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 12px 4px;">
    <sc-for list="{{totals}}" as="k" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; border-right: {{k.sep}};">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: {{k.color}};">{{k.v}}</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa3b2;">{{k.label}}</span>
      </div>
    </sc-for>
  </section>

  <section style="width: 100%; box-sizing: border-box; background: #1a1e27; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa3b2;">Gol per stagione</span>
      <span style="font-size: 12px; color: #e8b44a; font-weight: 700;">Record: 34 (St. 10)</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 4px; height: 64px;" role="img" aria-label="Gol per stagione dalla 1 alla 14">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="14">
        <div style="flex-grow: 1; height: {{b.h}}; min-height: 2px; border-radius: 3px 3px 0 0; background: {{b.c}};"></div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #9aa3b2;"><span>St. 1</span><span>St. 14</span></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#8e1f33"},"frame":{"editor":"enum","default":"oro","options":["oro","argento","icona"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const frames = {
      oro: 'linear-gradient(145deg, #fbe7a1 0%, #e8b44a 35%, #9c6a12 65%, #f5d27a 100%)',
      argento: 'linear-gradient(145deg, #ffffff 0%, #cbd5e1 40%, #64748b 70%, #e2e8f0 100%)',
      icona: 'conic-gradient(from 200deg, #f5d27a, #f472b6, #60a5fa, #4ade80, #f5d27a)'
    };
    const attrs = [['92', 'TIR'], ['87', 'PAS'], ['89', 'DRI'], ['84', 'VEL'], ['78', 'FIS'], ['81', 'TES']].map((a) => ({ v: a[0], k: a[1] }));
    const sep = '1px solid rgba(255,255,255,0.08)';
    const totals = [{ v: '421', label: 'Pres.', color: '#f4f1ea', sep }, { v: '228', label: 'Gol', color: '#f4f1ea', sep }, { v: '95', label: 'Assist', color: '#f4f1ea', sep }, { v: '3', label: 'Trofei', color: '#e8b44a', sep: 'none' }];
    const gol = [1, 4, 6, 8, 0, 19, 17, 25, 24, 34, 30, 32, 22, 31];
    const bars = gol.map((g) => ({ h: Math.round(g / 34 * 64) + 'px', c: g === 34 ? '#e8b44a' : '#3a4152' }));
    return { club: this.props.club ?? '#8e1f33', frame: frames[this.props.frame ?? 'oro'] || frames.oro, attrs, totals, bars };
  }
}
</script>
</body>
</html>
