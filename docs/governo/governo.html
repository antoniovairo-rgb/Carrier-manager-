a 9/9 · grafica 21/21 · main"],["05/10","7.999.134","**7.999.134 — L'anteprima dell'offerta mostra la classifica che troverai dopo la firma (PO-212).** Causa letta nel codice e misurata: l'anteprima usava la classifica del mondo (`calcWorldStandings`), l'accettazione ne costruiva un'altra (calendario del club nuovo + giornate passate stimate dal prestigio). Ora una sola funzione, `legaDopoTrasferimento212`, per entrambe (anche le «ultime 5»). Misura sul salvataggio S12, club offerente Torino Athletic: anteprima 14ª/31 punti = dopo la firma 14ª/31 (rosso `__CPM_NO_ANTE212`: anteprima 3ª/69, dopo 14ª/31). Residuo dichiarato: firmando, la stagione del club nuovo viene ricostruita e può non coincidere con la classifica di quella lega vista prima nel tab Classifica. Guardiano `anteprima-212`.","✅ catena carriera 27/27 · completa 9/9 · main"],["05/10","7.999.133","**7.999.133 — Figurine con la stessa cornice (PO-208) e statistiche tutte presenti dall'inizio (PO-213).** Figurine: scelta PO «cornice sottile grigia come l'eroe nella home»; quel riquadro è la stessa carta Korward con la cornice nel colore del club, che sulla testata scompare. La carta resta (volto pieno) e la cornice diventa per tutte grigio chiaro. Prima stesura (riquadro bianco col volto in alto) bocciata dalla prova fotografica. Statistiche in partita: le voci a zero si nascondevano e comparivano una alla volta; ora tutte, sempre. Rossi `__CPM_NO_FIG208`, `__CPM_NO_STAT213`; guardiano `figurine-208` (cornice grigia sì/no; 17 voci contro 2).","✅ catena grafica 21/21 · completa 9/9 · main"],["04/10","7.999.132","**7.999.132 — Tre minuti di recupero (PO-202, decisione PO).** La partita del motore finiva al 90' senza recupero; la simulazione rapida gioca fino al 93' e nel finale gli avversari tirano di più. Ora il fischio arriva al 93'. A coppie su 12 partite per braccio (S12, avversari a rotazione): tiri fra 90' e 92' 7 contro 0; vittorie/pari/sconfitte 9/3/0 contro 12/0/0; scarto medio 1,58 contro 2,33; scarti di 3+ gol 4 contro 7 (campione ancora piccolo). Rosso `__CPM_NO_REC202`, guardiano `recupero-202`; l'evento di fine registra ora anche il minuto vero.","✅ `recupero-202` verde con rosso visibile · catena completa 9/9 ✅ (primo giro 8/9: `ball-motion` gi8 casuale, verde da solo e al secondo giro) · catena carriera 26/26 ✅"],["04/10","7.999.131","**7.999.131 — Il motore gioca anche il minuto della scena (PO-202, decisione PO).** Indagine con registrazione e riproduzione del motore (riproduzione identica alla partita vissuta; `docs/governo/misure/2026-10-04-po202-attribuzione.md`): il sistema delle scene dell'eroe toglie agli avversari ~40% dei tiri, e nel minuto di ogni scena il motore era fermo (0 passi invece di 22; ~84 minuti di gioco contro 94). Ora i passi del minuto saltato si recuperano dopo la scena, al massimo 4 per battito del minuto. Prima stesura sui sotto-tick bocciata da `match-sequence` (cronaca diversa fra due giri dalla riga 11); quella al battito è al livello del rosso (1x/1x e 1x/2x 100%; 2x/2x una differenza alla riga 74, il rosso alla 48). A coppie su 6 partite: tiri avversari 7,2 → 9,0, ~110 passi recuperati a partita; gol non leggibili su 6 partite. Rosso `__CPM_NO_MIN202`, guardiano `minuti-202`. Segnalati guardiani superati dal motore unico: `ball-alive` (rosso anche senza modifica) e `trama` (sonda cieca).","✅ `minuti-202` verde con rosso visibile · catena completa 9/9 ✅ · catena carriera 25/25 ✅"],["04/10","7.999.130","**7.999.130 — I club più forti si distinguono in campo (PO-202, decisione PO «alzare il tetto a 99»).** Il motore tagliava la forza a 95: i club fra 95 e 99 erano identici (la squadra dell'eroe a 96 valeva come la prima a 98). Ora il tetto è 99 (rosso `__CPM_NO_TETTO202`); guardiano `tetto-202` nel motore: con lo stesso seme 96-98 e 98-96 danno partite diverse 20 volte su 20, nel rosso 0. Effetto misurato piccolo (100 partite: 96-98 vittorie 25% → 33%). Testimone nuovo `__CPM_TIRI202` (ogni tiro del motore con minuto e lato, vissuta e simulata) per l'indagine: nella vissuta il motore gioca ~25-30% di azioni in meno e gli avversari perdono di più (tiri −37%, cross −41%).","✅ `tetto-202` verde con rosso visibile · catena completa 9/9 ✅ · catena carriera 24/24 ✅"],["04/10","7.999.129","**7.999.129 — Partite più tirate (PO-202, decisione PO «entrambe le leve, a metà»).** Misurato (S12, stessa forza 95-95): nella partita vissuta gli avversari tiravano 7,4 volte e segnavano 0,3-0,8 gol a partita, nella stessa partita simulata 13,4 tiri e 1,2-1,3 gol; e dopo un tiro dell'eroe finito fuori la palla restava alla sua squadra 22 volte su 31. (1) Dopo un tiro dell'eroe fuori o parato riparte l'avversario (rosso `__CPM_NO_RIP202`, guardiano `ripresa-202`). (2) Solo nella partita vissuta: tiri avversari +30% di pericolosità, compagni dell'eroe −15% (rosso `__CPM_NO_FIN202`, guardiano `finale-202` nel motore: subiti 1,18 → 1,50, fatti 0,87 → 0,77). A coppie su 10 partite vissute: fatti 2,1 → 1,4, subiti 0,3 → 0,3, vittorie 10 → 8, scarto medio 1,8 → 1,1. Campione piccolo: l'effetto sui gol subiti non è confermabile.","✅ `ripresa-202` e `finale-202` verdi con rosso visibile · catena completa 9/9 ✅ · catena carriera 23/23 ✅"],["04/10","7.999.128","**7.999.128 — La fila a centrocampo non corre più sul posto (PO-206).** Misurato sul walkout intero (49 s reali, sonda `walk206`): la clip di corsa ha peso ~0 sui corpi fermi; è la clip «idle» stessa (10,2 s) a piegare le ginocchia di 40-55° quasi ogni secondo (gambe 46-72°, la corsa 49-80°). Nel walkout l'idle oscilla piano nella sua finestra calma (0-1 s, al massimo 11°). Rosso `__CPM_NO_FILA206`; guardiano `fila-206` su tutto il walkout: verde 100% dei corpi fermi nella finestra calma, rosso 25%.","✅ catena grafica 20/20 (primo giro 18/20: `premiazione-palco-191` e `coppa-mani-191` rossi, verdi da soli e nel secondo giro) · catena completa 9/9 ✅"],["04/10","7.999.127","**7.999.127 — Scene dell'eroe un po' meno decisive (PO-190 terza parte) e vista Allenamento eliminata (scelte PO 03/10).** Le occasioni su azione dell'eroe (tiro e assist; non rigore e punizione) valgono il 25% in meno, dopo i modificatori di contesto. Misura a coppie, stesse 21 partite S12 (rosso `__CPM_NO_SCENE190`): gol attesi dalle scene 29,9 → 22,4; gol da scena 25 → 23 (scarto casuale ±5: differenza non distinguibile dal caso su 21 partite); gol fatti 2,05 → 2,14, subiti 0,38 → 0,29. Guardiano `scene-190` (motore in node). Vista Allenamento (tab orfano e `TrainPanel`) tolta.","✅ `scene-190` verde con rosso visibile · catena completa 9/9 ✅ · catena carriera 21/21 ✅"],["03/10","7.999.126","**7.999.126 — I portieri hanno i guanti (PO-201) e le formazioni respirano (PO-204); ripartenza dal centro dopo il gol (PO-207).** I corpi non hanno una parte «guanti»: le mani stanno nella pelle. Sul solo portiere, le facce guidate dalle ossa di mano e dita passano a un materiale guanto (chiaro su divisa scura, scuro su divisa chiara), su una copia della geometria: gli altri corpi restano intatti. Misurato: corpo della partita 3.412 facce-guanto su 12.128, tutte su ossa di mano e dita (avambraccio 0); corpi CGTrader degli highlight solo sulle braccia, testa e busto 0. Trovato per strada: three.js r128 non ha `getComponent`, la prima stesura falliva in silenzio. Rosso `__CPM_NO_GUANTI_PO201`. **Formazioni (PO-204):** lo spazio libero sotto la schermata si divide fra le linee dei due campetti (tetto 36 px a linea): su 412×915 36 px a linea, su 360×740 4 px, nessuno scorrimento. Rosso `__CPM_NO_FORMAZ204`. **Ripartenza dal centro (PO-207):** misurato su una partita vera, dopo ogni gol il motore riprendeva dal punto del pallone (i gol da cronaca, piazzato e highlight non passano dallo stato «rete»); ora a ogni aumento del punteggio il motore riparte dal centro con la palla a chi ha subito il gol. Rosso `__CPM_NO_KO207`.","`guanti-201`, `formazioni-204`, `ripartenza-207` verdi con rosso visibile · catena grafica 19/19 ✅ · catena completa 9/9 ✅ (rifatte a macchina libera: il primo giro grafico 15/19 era falsato dal carico)"],["03/10","7.999.125","**7.999.125 — Galà: la busta a tocchi e per ogni premio (PO-199, scelte PO).** Ogni posto si svela solo al tocco («Svela il 3° posto», «Svela il 2° posto», «E il vincitore è…»), senza scorrimento automatico; e la busta si apre per tutti i premi della serata: se vince un altro, la scheda dice chi e in che posizione sei arrivato. Rossi `__CPM_NO_TOCCO201`, `__CPM_NO_TUTTI201`.","`busta-199` 3 giri su 3 verdi, rossi visibili · catena grafica 17/17 ✅"],["03/10","7.999.124","**7.999.124 — Galà con suspense e presentazione «da televisione» (PO-199, PO-200).** Galà: ogni premio si apre in quattro tempi (busta, 3° posto, 2° posto, vincitore), uno ogni 1,6 s, con luci e coriandoli solo al vincitore. Presentazione: in campo i corpi CGTrader al posto del vecchio modello, e al posto dello schieramento di figurine una sola targhetta piccola in basso con volto e nome del chiamato. Rossi `__CPM_NO_BUSTA199`, `__CPM_NO_PRES200`.","`busta-199` verde 0→1→2→3 (vincitore a ~5 s), rosso subito · `presentazione-200` verde 7 corpi e 1 targhetta, rosso 0 e schieramento · catena grafica 17/17 ✅"],["03/10","7.999.123","**7.999.123 — Parata: la squadra vera sul pullman, niente figurine (PO-198).** Foto PO 20:17 «Niente figurine, solo CGTrader!»: dalla 7.949 la parata si costruiva senza corpi (omini a blocchi sul tetto) e con le figurine dei visi sopra. Ora la Fine Stagione monta un componente unico (`ParataCompleta198`) con i corpi CGTrader degli highlight e della premiazione, l'eroe davanti con la coppa, e nessuna figurina. Rosso `__CPM_NO_PARATA198`.","`parata-198` verde 8 corpi e 0 figurine, rosso 0 corpi e figurine · catena grafica 15/15 ✅"],["03/10","7.999.122","**7.999.122 — Goleade: i compagni tornano a segnare (PO-190, seconda parte).** Decisione PO «alleggerire il debito». Ogni scena dell'eroe toglieva ai compagni tutti i suoi gol attesi: dopo la 7.999.121 i compagni segnavano 0,19 gol a partita (quota eroe 86%). Misurato dal salvataggio S12, stessi avversari e semi: debito pieno 1,38 gol a partita, 50% 1,65, **25% 2,00** (compagni 0,67, quota eroe 67%), nessuna partita da 6 gol. Ora la scena toglie un quarto. Rosso `__CPM_NO_DEB190`.","`debito-190` verde 0,1, rosso 0,4 · catena completa 9/9 ✅"],["03/10","7.999.121","**7.999.121 — Goleade: rigori alla frequenza vera (PO-190, prima parte).** Misurato dal salvataggio S12 col testimone dei piazzati: ogni fallo subito in area diventava rigore, la squadra dell'eroe ne riceveva 1,08 a partita e l'eroe li batteva quasi tutti (89% di gol). Premier League 2023/24: 0,29 rigori a partita in totale, 89,6% trasformati (The Analyst). Ora in area solo un contatto su quattro è rigore. Dal salvataggio S12 (stessi avversari e semi): gol fatti 2,72 → 1,38, partite con 6+ gol 1 → 0, gol dell'eroe 2,12 → 1,19. Rosso `__CPM_NO_RIG190`. Seconda parte decisa dal PO: alleggerire il debito del motore.","`rigori-190` verde 0,11, rosso 0,53 · catena completa 9/9 ✅"],["03/10","7.999.120","**7.999.120 — Passaggio a professionista: rivale e sponsor di club subito (PO-176).** Il collaudo di Codex vedeva 6 differenze tra prima e dopo la ricarica: rivale e sponsor di club nascevano solo al caricamento del salvataggio. Ora nascono all'accettazione dell'offerta pro. Rosso `__CPM_NO_PRO176`.","`pro-rivale-176` verde (rivale e sponsor presenti), rosso (entrambi assenti) · catena completa 9/9 ✅"],["03/10","7.999.119","**7.999.119 — Premiazione: nessuno attraversa più il palco (PO-191, quarta parte).** Misurato col testimone delle posizioni nel riferimento del palco rettangolare: per tutta la cerimonia un compagno e un avversario stavano dentro il solido (134 campioni). La spinta fuori dal rettangolo valeva solo per i compagni della festa; ora vale per ogni corpo tranne l'eroe. Rosso `__CPM_NO_PALCO191B`. Con 7.999.116-119 le quattro parti della segnalazione (vola, coppa, posa, attraversamento) hanno correzione e guardiano.","`palco-corpi-191` verde 0, rosso 134 · catena completa 9/9 ✅"],["03/10","7.999.118","**7.999.118 — Premiazione: l'eroe alza la coppa in piedi (PO-191, terza parte).** Misurato scorrendo la clip `mx-victory` (piedi e mani nel testimone): il congelamento al 34% fermava l'eroe in atterraggio dal salto, gambe divaricate e ginocchia piegate (piedi 0,25 sul piano contro 0,12-0,16 da fermo); al 45% è in piedi con le braccia tese (mani 2,14 sopra i piedi) e la coppa in presa. Miglioramento reale ma contenuto. Rosso `__CPM_NO_POSA191`. Resta: un avversario che corre davanti al palco.","`posa-sollevamento-191` verde (0,45 · piedi 0,22 · mani 2,14), rosso (0,34 · piedi 0,25) · catena completa 9/9 ✅"],["03/10","7.999.117","**7.999.117 — Premiazione: la coppa sta nelle mani (PO-191, seconda parte).** Misurato col testimone (coppa e mani nello stesso fotogramma): nel sollevamento la coppa stava 0,45-0,54 sopra la presa. La regola «la coppa non copre il volto» misurava la testa dal riquadro dell'intero corpo con le braccia alzate (2,31) e la spingeva in alto. Ora la testa è quella di un uomo in piedi (tetto 1,85). Rosso `__CPM_NO_COPPA191`. Resta da verificare: posa delle gambe nel sollevamento e un avversario che corre davanti al palco.","`coppa-mani-191` verde scarto 0,08 (volto mai coperto), rosso 0,54 · catena completa 9/9 ✅"],["03/10","7.999.116","**7.999.116 — Premiazione: l'eroe non vola più sopra il palco (PO-191, prima parte).** Misurato nel riferimento del palco rettangolare (7.997): all'inizio del sollevamento l'eroe era ancora sul prato e già a quota 1,05; la regola guardava il beat e un cerchio di raggio 1,7 rimasto dal palco tondo. Ora la quota segue l'impronta vera sotto i piedi (corpo 1,05 · gradino 0,28 · prato 0). Rosso `__CPM_NO_PALCO191`. Resta aperto: la coppa non sta fra le mani visibili e la posa delle gambe nel sollevamento.","`premiazione-palco-191` verde 0 campioni in volo su 29 (21 sul palco), rosso 5 · catena completa 9/9 ✅"],["03/10","7.999.115","**7.999.115 — Nel prepartita i giocatori arrivati stanno fermi (PO-197).** Misurato col testimone `__CPM_WALK197`: l'avvicinamento esponenziale lasciava una coda di strisciamento e il corpo arrivato teneva la clip di corsa piena per 1-1,5 s (5 corpi per 5 s «correvano sul posto»). Ora a meno di 0,15u ci si ferma e, solo nel walkout, velocità stimata e miscela corsa/riposo scendono in fretta. Rosso `__CPM_NO_FERMI197`. Aggiunto anche il testimone dei compagni attorno al podio per PO-191.","`walkout-fermi-197` verde 14 contro rosso 56 corpi-campione (picco 2 contro 6) · catena completa 9/9 ✅"],["03/10","7.999.114","**7.999.114 — Avversarie nel calendario (PO-195) e lega sulle offerte (PO-196).** Ogni casella della griglia dice sigla dell'avversaria, sede (c/t) e punteggio; ogni offerta di fine Under 18 dice lega e bandiera («🇮🇹 Lega B · prima squadra», «🇫🇷 Ligue Nationale», «🇪🇸 Liga Ibérica 2», «Primavera 2 · giovanili»). Rossi `__CPM_NO_AVV195`, `__CPM_NO_LEGA196`.","`calendario-offerte-195` verde (34 caselle, 4 leghe) e rosso (0 e 0) · foto a 412 px · catena grafica 9/9 ✅"],["02/10","7.999.113","**7.999.113 — Mai più la partita già giocata (PO-194) + conferenza e testata (PO-192/193).** RIPRODOTTO sul salvataggio del PO: la conferenza pre-partita si apriva insieme alla partita, ricompariva sulla home della 39ª dopo il fischio e il discorso del mister riapriva la gara della 34ª giornata (testimone: una sola chiamata a `startMatch`). Ora conferenza → discorso → partita, e a fine gara niente resta in sospeso (rosso `__CPM_NO_CONF194`). La domanda «quasi un derby… bolgia» esce solo in un derby tra professionisti (`__CPM_NO_DERBY192`); oltre la 38ª «Fine stagione» al posto di «Settimana 39 di 38» (`__CPM_NO_SETT193`).","`partita-rigiocata-194` verde (conferenza prima del campo, home tranquilla, Altoadige 2 volte) e rosso (conferenza ricompare da sola) · `conferenza-192` verde/rosso · catena completa 9/9 ✅"],["02/10","7.999.112","**7.999.112 — Il campo 2D nasce della misura giusta (PO-189).** Foto del PO: «a ogni caricamento del campo fa uno strano rimbalzo, come se si ridimensionasse». Misurato a 412×915: finché il motore non dava il tabellino la striscia alta non esisteva, il campo si disegnava a tutta altezza e alla sua comparsa il margine alto passava da 0 a 74 px. Ora la striscia c'è dal primo fotogramma. Rosso `__CPM_NO_RIMB189`.","`rimbalzo-189` verde (margine 74 px fisso dal primo disegno), rosso 0→74 · catena grafica 8/8 ✅"],["02/10","7.999.111","**7.999.111 — La scheda pre-partita è un vetro chiaro (PO-188).** Foto del PO: statistiche all'ingresso in campo con sfondo troppo scuro (seconda segnalazione dopo la 7.937). Vetro da 0,74 a 0,45, sfocatura più leggera, ombra sotto il testo per la leggibilità sul prato. Rosso `__CPM_NO_PRE188`.","`pre-188` verde (vetro 0,45 + ombra), rosso 0,74 · catena grafica 7/7 ✅"],["02/10","7.999.110","**7.999.110 — Il riquadro del titolo è in cima e si legge (collaudo PO 02/10).** Foto del PO: «Campioni di Premier Division!» in fondo alla home, con «È matematica» e la frase in crema su bianco. Ora sta subito sotto il pulsante principale, con oro scuro e testo pieno: contrasto 1,11 → 5,93 (scritta) e 14,63 (frase). Rosso `__CPM_NO_TITOLO110`.","catena grafica 6/6 · `titolo-110` verde (sopra la prossima partita, contrasto ≥ 4,5), rosso 1,11 · ✅"],["02/10","7.999.109","**7.999.109 — Il tuffo di testa parte in tempo (PO-077, rilievo Codex gi171).** Riprodotto: su «Stacco in corsa potente» (tuffo di testa) il pallone arrivava alla testa con l'eroe fermo e senza gesto, e il picco arrivava 0,66 s dopo — il «591 ms» di Codex. L'anticipo dello stacco del 7.999.33 escludeva il tuffo: ora vale anche lì, con salto basso. Corretto anche il guardiano, che prendeva per «picco» il salto dell'esultanza dopo il gol. Rosso `__CPM_NO_TUFFO109`.","catena completa 9/9 · `testa-tempismo` 7 scene verde (gi171: gesto al contatto, scarto 0,1 s); rosso: ritardi 0,49–0,69 s · ✅"],["02/10","7.999.108","**7.999.108 — Le etichette delle azioni dicono il gesto che vedrai (PO-187).** Rilievo Codex gi18: «Dribbling netto» mostrato come passaggio, perché il tipo di scena nasce dall'esito. Decisione PO «etichette vere»: censimento completo, 73 azioni da dribbling/finta/scatto con gesto finale tiro o passaggio, 43 non lo dichiaravano; ora tutte lo dicono («Dribbling netto e assist», «Finta, scatto e tiro»…). Solo testo, nessuna scena 3D cambiata.","catena completa 9/9 · `etichette-108` verde (0 su 73), sul sorgente 7.999.107 rosso (43) · ✅"],["02/10","7.999.107","**7.999.107 — Rete di sicurezza per le coppe.** Il recupero 7.999.103 copriva solo il campionato: una gara di coppa nazionale o europea rimasta indietro in una settimana passata (la KCC del salvataggio S.12) restava lì per sempre e la competizione si congelava. Ora viene rinviata alla settimana corrente e si gioca con la logica normale, solo fino alla W.37 (decisione PO-186). Rosso `__CPM_NO107`. Registrati i rilievi Codex del 02/10: PO-187 (azioni da dribbling mostrate come passaggio/tiro, censimento ~10 su 56), colpo di testa gi171 (stacco 591 ms dopo il minimo pallone–testa) su PO-077, contratti PO-181 (2 semi, non 198 contratti).","catena completa 8/9 al primo giro (motion su gi8: 11/21 in movimento, atteso ≥13) e gate rilanciato da solo sulla stessa build ✅ PASS: instabilità del controllo, la release non tocca il 3D · `rinvio-coppe-107` verde, rosso resta indietro · ✅"],["02/10","7.999.106","**7.999.106 — L'avversario della giornata si cerca nel calendario, mai a caso.** Verificata nel codice l'ipotesi dell'audit: se l'avversario non stava nella lega ricalcolata, la partita dal vivo e la Simula pescavano un club a caso e l'avanzamento settimana non simulava la gara. Ora lega → archivio club → classifica; il sorteggio solo se il club non esiste. Misurato anche che al caricamento una migrazione riallinea gli avversari estranei: lo stato vive solo a metà sessione. Rosso `__CPM_NO_AVV106`.","catena completa 9/9 · `avversario-106` verde, rosso null sull’estraneo · `recupero-103`, `euro-attesa-181` verdi · ✅"],["02/10","7.999.105","**7.999.105 — Il riquadro dell'Europeo sulla home dice la verità.** In qualificazione mostrava «vs ?» e «Partita da eliminazione diretta · Nessun pareggio»; nell'attesa fra qualificazioni e girone gridava PRIORITÀ senza gare da giocare. Ora l'avversario vero e «Qualificazione N/2» in qualificazione, «IN ATTESA · il girone inizia alla settimana 24 · Intanto si gioca il campionato» nell'attesa. Solo testo. Rosso `__CPM_NO_RIQ105`. Inoltre: prompt Codex del banco deterministico (`docs/governo/prompt/codex-2026-10-02-banco-deterministico.md`).","catena grafica 5/5 · `riquadro-euro-105` verde con foto, rosso col testo vecchio · ✅"],["02/10","7.999.104","**7.999.104 — CORRETTIVA: la settimana non si ferma più dopo le qualificazioni dell'Europeo (PO-181).** Collaudi Codex: «settimana ferma» al seme 6, S.8 W.21. Causa misurata: finite le qualificazioni il pulsante principale e «Continua» lanciavano ancora la gara della Nazionale («attendi la prossima fase») e il girone si apriva solo da doAdvanceWeek alla W.24 — attraversando la W.24 con una partita il torneo restava in qualificazioni per sempre. Probabile innesco del salto 21→28 del salvataggio S.12 del PO. Rimedi: torneo in attesa che non comanda il pulsante, girone aperto dallo stato (qualificazioni chiuse e W ≥ 24). Rosso `__CPM_NO181`. In più, solo strumenti per PO-185 (banco inquadratura deterministico).","catena completa 9/9 · `euro-attesa-181` verde (W21→W24/girone), rosso fermo a W21 · `recupero-103`, `classifica-102`, `calendario-nazionale`, `career-nat-sim` verdi · ✅"],["02/10","7.999.103","**7.999.103 — CORRETTIVA BLOCCANTE: le sette giornate sparite durante l'Europeo (PO-182, PO-183).** Analisi del salvataggio S.12 del PO: la diagnosi del 7.999.102 (classifica a 14 squadre) NON era la causa di questo salvataggio (18 squadre). Causa misurata: dopo la prima qualificazione dell'Europeo (W.21) il recupero del risultato al fischio ha agganciato quella gara all'amichevole vs Belgio della W.28 e ha spostato la settimana 21→28 senza giocare le giornate 19-25, poi ha rigiocato la qualificazione (due «Belgio 5-0» in natHistory); la rete (H) del rilevatore ha ritirato una giornata mancata per ogni gara giocata dopo e la bonifica 7.418 le ha segnate giocate senza risultato. Rimedi: filtro di competizione per la Nazionale, niente salti di settimana in avanti dal recupero, niente doppioni in natHistory, (H) solo se la classifica conta più gare del calendario, giornate passate senza risultato simulate e contate (ripara i salvataggi colpiti). Rosso `__CPM_NO103`. Sul salvataggio del PO: 18 squadre a 33 partite, prossima la 34ª vs FC Tyneside.","catena completa 9/9 · `recupero-103` 4/4 (rosso fallisce A/B/D) · `classifica-102` verde · ✅"],["01/10","7.999.102","**7.999.102 — CORRETTIVA: la classifica torna quella vera (PO-182) e i nomi seguono i corpi (PO-184).** Foto del PO: classifica con 26 partite per tutte le squadre e calendario alla 34ª giornata. Causa: al caricamento la classifica veniva riconciliata con la lega **ricalcolata** (promozioni e retrocessioni accumulate), che poteva contare meno squadre del calendario nato al cambio stagione; con 14 squadre il tetto «una squadra gioca al massimo 2×(N−1) partite» vale 26, e da lì la classifica si fermava per tutti. Ora la lega della stagione è **quella del calendario**; se classifica e calendario non coincidono, la classifica si ricostruisce dalle giornate giocate con gli stessi semi del gioco (le partite fra le altre squadre si risimulano con quei semi: escono come allora salvo gli spostamenti di prestigio). Il salvataggio rotto si ripara al primo caricamento. Guardiano `classifica-102`: salvataggio come quello del PO (14 squadre a 26) → 18 squadre a 33, gol fatti = subiti; salvataggio sano non toccato; rosso `__CPM_NO_CLASSIFICA102`: resta fermo (4 squadre a 0, le altre a 26). Nomi: con i corpi CGTrader si disegnano 5 giocatori e le targhette restavano sugli altri; ora seguono il corpo (`nomi-51`: 0 senza corpo; rosso `__CPM_NO_NOMI102`: 6). Il «rigioca l'ultima partita» (PO-183) non è ancora riprodotto: serve il salvataggio del PO. Catena completa `npm run ci` 9/9 verdi + `classifica-102`, `classifica-94`, `nomi-51`, `giornaliste-169`.","✅"],["01/10","7.999.101","**7.999.101 — Tetto delle scene secondo la decisione PO sul rilievo 26-D.** Codex aveva misurato sulla 7.999.96 10 highlight in 1 partita su 30 (seme 973182, 5 scene in più nate da origini del motore). Decisione PO «rigore sempre, resto nel tetto»: punizioni e cross in più entrano solo sotto 8 scene, il rigore dell'eroe fino a 9 (tetto assoluto). Regola in una funzione pura, `scenaExtraAmmessa`, che il punto d'inserimento usa; guardiano `tetto-scene` (punizione/cross ammessi a 7 e respinti a 8, rigore ammesso a 8 e respinto a 9; rosso `__CPM_NO_TETTO101`: passano oltre 8). Catena completa `npm run ci` 9/9 verdi + `piazzati-eroe`, `piazzati-catalogo`, `tetto-scene`. Chiuse dal PO: PO-170, PO-144.","✅"],["01/10","7.999.100","**7.999.100 — Esaurito il catalogo, il piazzato dell'eroe resta un piazzato (rilievo Codex 27-B, PO-172).** Codex l'ha riprodotto sulla 7.999.96 (seme 974734 «Rilievi23»): 4 punizioni dell'eroe in una partita, 3 schede di punizione diretta nel catalogo, e alla quarta la scena cadeva su «Rovesciata in corsa!». La scelta passa in una funzione pura, `schedePiazzato(rigore, usate)`: esaurito il catalogo si ripete una scheda dello stesso tipo. Il caso non si forza in modo affidabile su una partita vera (tetto di 4 piazzati, e le punizioni nate dal gioco lo consumano: misurato candidate 3→2→1), quindi il guardiano `piazzati-catalogo` interroga la funzione col catalogo tutto giocato: rigori 2/2 e punizioni 3/3 candidate (rosso `__CPM_NO_PIAZ99`: 0). Dal rapporto Codex anche: 26-C era già chiuso dalla 7.999.98 (occasione d'origine); 26-D (10 highlight in 1 partita su 30, tetto 8) aspetta una decisione PO; 26-A, 26-B, 27-A non verificati. Collaudo goleade parte B (Codex, 20 partite vere sulla 7.999.96): nessun 7+ né scarto 5+, gol e tabellone sempre concordi. Catena completa `npm run ci` 9/9 verdi (rifatta da capo dopo un riavvio del container) + `piazzati-eroe`, `piazzati-catalogo`, `scene-disegnabili`.","✅"],["01/10","7.999.99","**7.999.99 — Giornaliste col volto femminile (PO-169), una sola suite di non regressione con indicatori di stabilità (PO-163), pagina di stato settimanale (PO-165).** (1) La figurina femminile esisteva, ma l'intervista copiava nome, colore e icona della giornalista **perdendo il segno `f`**: Sofia Esposito, Anna Lombardi ed Elena Greco uscivano col volto maschile, e i salvataggi più vecchi non avevano il segno. Nuova `giornalistaDonna(j)` (segno, elenco ufficiale per id/nome, telecroniste) nelle 3 costruzioni e nei 3 disegni; guardiano `giornaliste-169` (verde 0 errori; rosso `__CPM_NO_GIORN169` 8 errori). (2) `npm run ci` è ora la suite unica (catena di CLAUDE.md + `partita-vera` + `design-system`), con `ci:carriera`, `ci:grafica`, `ci:guardiani`; l'esecutore `ci-runner.mjs` registra ogni giro in `docs/governo/STABILITA.json`. Primi giri: carriera 4/4, guardiani 24/25 — `witness-frameskip` instabile anche sulla 7.999.96, tolto e registrato (PO-180). Aggiunto lo script mancante `griglia-mobile`. (3) Pagina di governo con due schede nuove: «Stabilità» (ultimo esito, verdi su giri, durata media, cosa copre) e «Stato settimanale» (release, voci per lotto, collaudi in attesa, decisioni, ultimo giro, rischi alti), calcolate dai documenti. Smistamento (PO-159): tipi del backlog uniformati e controllati dalla pagina. Catena completa `npm run ci` 9/9 verdi (primo giro della suite unica).","✅"],["01/10","7.999.98","**7.999.98 — Goleade con l'eroe nella squadra debole sotto le stesse soglie (PO-179), angolo con una battuta sola, rigore dell'eroe che apre la scheda giusta (PO-178).** (1) Decisione PO «stesse soglie»: la gestione del vantaggio passa a tre gradini (pericolosità dei tiri 0,45 con 3 gol di vantaggio, 0,30 con 4, 0,20 con 5+). Misurato su 600 partite per braccio: eroe 50 contro 95 fuori casa **scarto 5+ da 15,5% a 7,0%**, 7+ da 2,0% a 0,2%; eroe forte 2,5–1,7% di scarti, squadra forte dell'eroe ancora 2,1–2,3 gol di media. Guardiano `goleade` a due bracci (verde 2,0% e 8,0%; `goleade:rosso98` con i gradini di prima 14,0%). (2) Decisione PO «angolo: sì, ora»: con l'origine del motore partivano due battute — quella d'apertura fermava il pallone a 4,6–8,8u dalla bandierina durante la scelta, quella del crossatore lo riportava indietro (salto fino a 203 u/s); ora una sola: `cross-origine` angolo **0 u** (rosso `__CPM_NO_ANGOLO98` 6,8 u). (3) Rigore dell'eroe: con due occasioni nello stesso minuto si registrava la prima dell'elenco e si apriva «Solo davanti al portiere!» al posto del rigore; ora vince l'occasione d'origine (`piazzati-eroe` verde al primo tentativo, rosso `__CPM_NO_ORIG98` 0 scene in 4 tentativi). (4) Triage dei guardiani orfani: `filtrante-intercetto` isolato dalla ripartenza voluta della 7.999.92, `calendario-nazionale` / `numeri-home` / `home-riquadri` allineati all'impaginazione della 7.999.49 (verdi, rossi rossi); `disappunto` verde 2/2 a macchina libera (il rosso del primo giro era carico). Catena completa verde 13/13: gate 14/14, test:logic, typing-shortcuts, save-compat, replay, career-critical, goleade, partita-vera, brain-82, piazzati-eroe, cross-origine, scene-disegnabili.","✅"],["01/10","7.999.97","**7.999.97 — Nomi dei giocatori negli highlight, scene sospese se promettono un gesto senza clip, pulizia delle sonde (PO-051, PO-086, PO-072).** (1) Targhette piccole «numero COGNOME» sopra i giocatori, **solo nelle fasi highlight** e solo entro 18u dal pallone; l'eroe in oro (guardiano `nomi-51`: in cronaca 0 targhette, in scena 6-10 visibili; rosso `__CPM_NO_NOMI51` = 0). (2) Ogni scheda e ogni azione dichiarano in factory il campo `richiede` (gesti promessi senza clip: comando, velo, petto…); la pesca salta le schede che li promettono nel testo o che restano con meno di due azioni disegnabili, le opzioni nascondono le azioni non disegnabili; **riattivazione automatica** appena un gesto è scritto in `GESTI_COLLEGATI`. Misurato: **2 schede sospese su 191** (gi110 «Fai il velo», gi138 «Allineati con la difesa — linea alta»), **6 azioni di comando nascoste**, 0 schede sospese in 2.400 pescate su 400 semi, 0 sospese dopo la riattivazione simulata (guardiano `scene-disegnabili`, rosso `__CPM_NO_RICHIEDE`). (3) Inventario delle sonde (`tools/inventario-sonde.mjs` → `docs/governo/INVENTARIO-SONDE.md`): **149 sonde mai richiamate archiviate** in `tests/visual/archivio/`; trovati **19 guardiani che nessuno script lanciava**, ora collegati a `npm run`: rilanciati, **11 verdi e 8 rossi** (registrati in PO-178 per il triage). Catena completa verde: gate 14/14, test:logic, typing-shortcuts, save-compat, replay, career-critical, gesti-copertura-96, etichette-95.","✅"],["01/10","7.999.96","**7.999.96 — I guardiani misurano quanti gesti promessi il 3D sa davvero disegnare (PO-069).** Il censimento delle scene (per ogni azione: gesto promesso dal testo contro gesto disegnato) diventa il guardiano `gesti-copertura-96`, con una base salvata: rosso se crescono le azioni non disegnabili o le varianti mai raggiunte, o se calano le fedeli (prova del rosso con base più severa di un'unità). Copertura di oggi: **281 azioni su 573 con gesto fedele (49,0%)**, 283 approssimate, **9 non disegnabili** (6 di «comando» ai compagni, 3 del «velo», «Stop di petto e conserva»), **30 varianti su 46 raggiunte**. Corretto il censimento: la roulette risultava non disegnabile, ma dalla 7.999.39 ha la sua clip. Completata PO-087: «Scatto tra le gambe» (#166) era un tunnel detto a parole → «Scatto nello stretto» (resta un tiro dal limite: con «dribbling» nel testo cambiava lo schema dell'azione e `backbone-regression` lo ha fermato); `etichette-95` ora lo riconosce. Catena completa.","✅"],["01/10","7.999.95","**7.999.95 — Le scene non promettono più gesti che il 3D non sa disegnare (PO-087, decisione PO 01/10).** Rinominati 21 testi in 12 scene: «Elastico» → «Finta a rientrare», «Tunnel» → «Dribbling stretto», «Hocus pocus» → «Finta e cross», «Rabona cross» → «Cross d'esterno», «Tacco» → «Appoggio di prima» (passaggi) o «Deviazione di prima» (tiri), «Stop di petto e tiro fulmineo» → «Controllo e tiro fulmineo». La «Roulette» resta (ruleta vera dalla 7.999.39). Misurato prima/dopo su ogni azione toccata cosa sceglie il gioco: i tiri di tacco passano al gesto «tiro di prima», gli appoggi di tacco perdono la variante «tacco» (nel 3D era già un passaggio normale), tutto il resto identico; su #93 e #100 la parola «finta» spostava l'intento della scena da cross a dribbling e l'ho bloccato com'era (`tactic.it`). Guardiano `etichette-95`: 20 promesse senza gesto nella versione precedente, 0 ora. Catena completa.","✅"],["01/10","7.999.94","**7.999.94 — Classifica: dopo un prestito il tuo club promosso o retrocesso è nella lega giusta, e i gol fatti tornano con i gol subiti (PO-175).** Collaudo Codex «classifica gol» (base 7.999.91): nei semi 17 e 35, alla stagione 3 settimana 2, somma gol fatti ≠ gol subiti (+4, −3); il club dell'eroe mancava dalla classifica e il suo risultato andava solo all'avversario. Causa confermata: quando il club della nuova stagione arriva da un prestito (obbligo che scatta, oppure — caso trovato da noi — rientro al club madre) tiene la lega vecchia anche se è appena stato promosso o retrocesso. Ora la lega del club segue sempre gli spostamenti della stagione. Guardiano `classifica-94` (fine stagione vera, club ultimo in Lega A: obbligo, rientro, controllo senza prestito): 2 casi su 3 col difetto col rosso `__CPM_NO_CLASSIFICA94`, 0 col verde. Rigiocato lo script di Codex sui semi 17 e 35: senza correzione prima divergenza alla prima settimana della stagione 3 in entrambi; con la correzione la stagione 3 si gioca intera senza scarti. Limite di questo ambiente: dopo la ricarica della pagina le librerie dal CDN non si ricaricano (anche senza correzione), quindi le stagioni dalla 4 in poi non sono state rigiocate qui. Catena carriera (test:logic, save-compat, replay, career-critical).","✅"],["01/10","7.999.93","**7.999.93 — «Siamo in vantaggio — gestisci!»: porti davvero palla verso l'angolo, e la palla persa non torna indietro da sola (lotto L1, PO-143, taccuino #140).** Misurato a tempo reale: «Porta palla nell'angolo» riuscito era un appoggio di 6u e poi il pallone fermo per 3,9 s; fallito, il pallone arretrava di 4u e restava fermo 2,6 s; il «Passaggio sicuro laterale» troppo forte rimbalzava indietro di 3u. La conduzione era resa come un passaggio corto e la palla persa finiva in una «respinta» di 2,5 s. Ora la conduzione va verso la bandierina (corpo e pallone insieme); sulla palla persa o sul passaggio troppo forte l'avversario più vicino va incontro al pallone, lo prende e riparte verso la nostra porta. Guardiano `conduci-93`: pallone fermo oltre 0,5 s in 4 casi su 4 col rosso `__CPM_NO_CONDUCI93`, 0 su 4 col verde; `daievai-92` resta verde. Il codice 007 «camera salta» (PO-144) **non si riproduce**: fuori dagli stacchi la camera va a 46-48 u/s (massimo sano 65), i passi oltre 2,5u sono fotogrammi headless lunghi; aggiunto il testimone `__CPM_CAMSTEP93` per la prossima nota. Catena completa.","✅"],["01/10","7.999.92","**7.999.92 — Combinazioni e dai e vai: il pallone non resta più fermo dopo il passaggio (lotto L1, PO-147, taccuino #38, codice 011).** Misurato a tempo reale su «Dai e vai», «Triangolazione», «Terzo uomo smarcato», «Dai e vai in verticale» (sonda `_daievai92`): in 5 casi su 8 il pallone restava immobile 1,4-2,5 s. Tre cause: dopo l'intercetto l'avversario si teneva il pallone ma non ripartiva; dopo un passaggio riuscito che crea un'occasione chi riceveva restava fermo; nel dai e vai il pallone tornava all'eroe e lì si fermava. Ora, dopo un attimo di controllo, chi ha il pallone riparte (l'intercettore verso la nostra porta, il compagno o l'eroe verso quella avversaria) e corpo e pallone avanzano insieme. Guardiano `daievai-92` (4 scene × riuscito/fallito): pallone fermo oltre 0,5 s in 5 casi su 8 col rosso `__CPM_NO_DAIEVAI92`, 0 su 8 col verde; codici 005/014/012 a 0 col verde (005 a 3 col rosso). Catena completa. Il collaudo Codex «passaggi» allargherà la misura a 10 scene.","✅"],["01/10","7.999.91","**7.999.91 — Correttiva bloccante: a fine prestito il gioco non va più in errore e ti dice dove rientri (PO-174).** Dal collaudo Codex delle carriere (14 carriere × 10 stagioni su 7.999.86): 10 errori JavaScript «Cannot read properties of null (reading 'parentClub')» in 7 carriere. Le notifiche di fine prestito partivano dopo 400 ms e leggevano il prestito, che nel frattempo era già stato azzerato: errore, e il messaggio «Fine prestito — rientri al …» non compariva mai. Ora il prestito si cattura prima. Guardiano `prestito-91` (prestito, con opzione, con obbligo): 3 errori su 3 col rosso `__CPM_NO_PRESTITO91`, 0 col verde e notifica visibile in 3 casi su 3. Catena carriera (test:logic, save-compat, replay, career-critical). Le altre segnalazioni del rapporto sono in backlog: classifica con gol fatti ≠ gol subiti (PO-175), salvataggio che cambia al ricaricamento (PO-176), nazionale a zero presenze (PO-177).","✅"],["01/10","7.999.90","**7.999.90 — Gol subito nelle scene difensive: l'attaccante porta davvero palla fino al tiro, e il pallone non resta fermo (lotto L1, PO-132, taccuino #134, codici 006/011).** Riprodotto su «Sfida aerea su lancio lungo» e «Cross avversario in area» falliti, misurando a tempo reale: per circa 1,5 s pallone immobile e reparto fermo, poi il tiro partiva da lontano. Causa: l'attaccante che deve avanzare col pallone (7.773) era guidato anche dal sistema di formazione, che lo riportava al suo posto a ogni fotogramma; restava fermo con la palla, oppure non la raggiungeva mai. Ora mentre avanza il corpo è solo dell'avanzata, e se è lontano il pallone rotola verso di lui. Guardiano `reparto-90` (6 giri): pallone fermo prima del tiro 30 campioni su 40 col rosso `__CPM_NO_REPARTO90`, 5 su 32 col verde; spostamento medio dei corpi 0,55u → 1,63u. Apertura di #134 già a posto (7.999.85 tabellone, 7.999.88 scheda). Catena completa.","✅"],["01/10","7.999.89","**7.999.89 — «Recupero sulla linea di fondo»: il pallone è davanti all'eroe, non fuori dallo schermo (lotto L1, PO-151, gi133).** Ultimo caso aperto dei collaudi Codex sulle scene difensive. Misurato (sonda `_fondo89`): in scelta il pallone logico era sul portatore a 6u dall'eroe, ma il pallone 3D stava a metà campo, 27u più in là e fuori quadro. Il 3D agganciava come portatore l'avversario più vicino al corpo dell'eroe nel primo fotogramma, quando il corpo non era ancora arrivato sul punto della scena. Ora aggancia l'avversario più vicino al pallone logico e si riaggancia se quello si allontana. Guardiano `fondo-89` (scene 133, 33, 31, 168, 128): pallone 3D a oltre 15u dal logico e fuori quadro 5 campioni su 25 col rosso `__CPM_NO_FONDO89`, 0 su 25 col verde. Catena completa.","✅"],["01/10","7.999.88","**7.999.88 — Scene difensive: l'attaccante col pallone si vede sopra la scheda delle azioni (lotto L1, PO-151).** Secondo collaudo Codex (su 7.999.84): 24 aperture con avversario e pallone coperti dalla scheda. Nelle scene difensive la camera guarda dal lato dell'attaccante, che quindi cade in basso nello schermo; lo scorrimento della vista aveva un tetto troppo basso. Ora conta anche il portatore e la vista sale fino al 50%. Misurato: pallone o portatore sotto la scheda 27 campioni su 36 col rosso `__CPM_NO_APRE88`, 3 su 36 col verde, eroe sempre in quadro (guardiano `apre-88`). Resta a parte gi133 «Recupero sulla linea di fondo»: lì il pallone finisce dietro la camera (altro difetto). Catena completa.","✅"],["01/10","7.999.87","**7.999.87 — Il difensore che intercetta il tuo passaggio ora si tiene il pallone (lotto L1, PO-146, taccuino #185).** «Scarico e ricevi» fallito: l'intercetto c'era, ma dopo l'esito il pallone restava a 3,5–4,4 unità dal difensore (a terra dopo la scivolata) e ci arrivava solo dopo 4–5 secondi, quindi sembrava mancato. Ora va ai piedi di chi l'ha preso appena il volo finisce: 0,5–0,8 unità un secondo dopo l'esito (rosso `__CPM_NO_RUBA87`: 3,5–4,4; guardiano `ruba-87`). Foto coi corpi 3D: il difensore in piedi col pallone, inquadrato. Catena completa.","✅"],["01/10","7.999.86","**7.999.86 — Nella scelta delle scene difensive l'eroe non finisce più sotto la scheda delle azioni (lotto L1, PO-151, codice 002).** La vista si alzava (7.999.72) solo quando era il pallone a cadere sotto la scheda; nelle scene difensive sotto ci restava l'eroe. Ora conta il più basso fra pallone e busto dell'eroe. Misurato a regime, dopo 2,1 s di scelta: «Muro in area» da −28/−38 px (sotto la scheda) a +42/+50; col rosso `__CPM_NO_SOTTO86` restano sotto gi33 e gi168, col verde nessuna (guardiano `sotto-86`). Resta il primo istante della scelta forzata, quando la camera arriva dalla scena precedente: uguale nei due bracci, da verificare nel gioco vero. Catena completa.","✅"],["01/10","7.999.85","**7.999.85 — Scene difensive: il gol subito entra nel tabellone quando lo vedi, non prima (lotto L1, PO-151).** Dal collaudo Codex difesa 3D (eseguito su 7.999.82): in 6 scene fallite il tabellone segnava 0-1 mentre il tiro era ancora in volo. Il gol dell'eroe aspettava già la rete (6.5.1), quello subito entrava alla risoluzione. Ora aspetta la rivelazione dell'esito. Misurato con la barra «in corso» a schermo: gol anticipato in 4 scene su 4 col rosso `__CPM_NO_GA85`, 0 su 4 col verde, gol sempre presente alla fine (guardiano `ga-85`). Triage del collaudo: 001 e 003-testi già chiusi in 7.999.84; resta il 002 (eroe sotto la scheda). Catena completa.","✅"],["01/10","","**Guardiani stabilizzati e collaudo goleade acquisito (PO-173, PO-021/035, nessuna modifica al gioco).** `tiro-caricato`: il controllo «gambe a inizio scena» giudicava il MASSIMO fra i fotogrammi con l'eroe quasi fermo, e un solo fotogramma di frenata lo faceva scattare (4,09 contro 4); ora giudica il 75° percentile con almeno 3 campioni → verde 3/3, rosso `CPM_NOPASSO=1` ancora rosso (6,9–8,8). `passo-velocita` verde 3/3 senza modifiche. Rapporto Codex goleade (700 partite sulla 7.999.96) unito al ramo: semi 966105 e 966196 (1-7) **riprodotti**; con l'eroe nella squadra debole lo scarto ≥5 arriva all'11,9% su 1.000 partite → PO-179, in attesa di decisione.","✅"],["30/09","7.999.84","**7.999.84 — Scene difensive: l'attaccante col pallone è davanti all'eroe, e il salvataggio non parla più da portiere (lotto L1, PO-151).** Dal collaudo Codex del 30/09 su «Muro in area», «Recupero sulla linea di fondo», «Ultimo uomo». (1) Codice 003: quando l'eroe di movimento salva la porta, sovrimpressione ed esito dicevano «Il portiere dice no!», «Miracolo tra i pali!», «Para in tuffo» — 27 testi da portiere su 36 salvataggi, ora 0 (guardiano `salva-84`, rosso `__CPM_NO_SALVA84`). (2) Codice 001: per 2,4–3 s il pallone restava a metà campo e poi finiva sui piedi dell'EROE (il portatore si leggeva in un aggiornamento di React non ancora eseguito); il portatore partiva a 14–36 unità e il suo bersaglio era dietro l'eroe, quindi lo attraversava. Ora l'avversario più vicino apre 7 unità davanti all'eroe col pallone e si ferma a 4,5: fuori banda 58/60 campioni col rosso, 0/60 col verde (guardiano `palla-84`, rosso `__CPM_NO_PALLA84`). Resta aperto il codice 002 (eroe sotto la scheda nella scelta, gi33). Catena completa.","✅"],["30/09","7.999.83","**7.999.83 — Grafica highlight #94 (PO «migliora la grafica negli highlights: racconto azioni, D-Pad, movimenti, scelta azioni, esiti»).** MISURATO a 412×915 (sonda `_hl94`, scene 24 e 18): la scheda del movimento era alta 259 px e partiva a y 655, col centro dell'eroe a y 615 — gambe e pallone coperti proprio nel passo in cui lo muovi. Ora 203 px da y 711 (margine eroe-scheda 91-96 px contro 37-42): niente maniglia finta, titolo e zona su una riga, barra della pressione senza etichetta, le mosse rimaste DENTRO il D-pad (chevron disegnati, tasto che si illumina alla pressione), aiuto e «Scegli ›» accanto al pad. La barra «in corso» prende la veste della scheda (riquadro icona, «LA GIOCATA», nome a 15 px, tre punti che pulsano). Scelte ed esito invariati (decisioni PO 7.901: niente percentuali). Foto prima/dopo in `reports/hl94/`. Rosso `__CPM_NO_HL94`, guardiano `hl-94` (+ `:rosso`). Catena grafica: hud-c3, design-system, griglia-mobile, test:logic, save-compat, career-critical. Anche: prompt Codex del collaudo difesa 3D (`reports/codex/PROMPT-2026-09-30-collaudo-difesa-3d.md`).","✅"],["30/09","7.999.82","**7.999.82 — Brain unico: la giocata dell'eroe la decide il motore (decisioni PO 30/09: «tutto nel brain», «realismo da serie A»).** Prima: probabilità = xG × q con q da `succRate` fino a ×2, e per dribbling/difese solo `succRate`. Ora `probEroe` nel motore (src/14) usa i suoi modelli — tiro: xG del punto reso buona occasione (0,10+0,8·xG fra 0,10 e 0,45; palla alta 0,08+0,6·xG; rigore e punizione il loro xG) per il duello finalizzazione eroe/difensore; assist: passaggio × occasione del compagno; dribbling e difesa: il duello uomo contro uomo del motore; contesto della scena come `mods`, freni di partita come `mult`. Stessa probabilità per esito, percentuali sui pulsanti e scelta automatica. MISURATO: sul flusso vero l'eroe ha 4-5 scene a partita; eroe da 88 contro difensori da 70 da 1,32 a **0,69 gol a partita** (bersaglio 0,6-0,9), eroe da 95 da 1,43 a 0,73; nella stessa partita vera la somma delle probabilità scende da 0,85 a 0,67 e il 3-0 diventa 2-0. Rosso `__CPM_NO_BRAIN82`; guardiani `brain-82` (verde e rosso) e `motore-unico` (mediana brain 0,15, banda 0,08-0,32 al posto di 0,20-0,55). Gate 14/14 (00001505), test:vision, test:logic, typing-shortcuts, save-compat, replay, career-critical, goleade verdi.","✅"],["30/09","7.999.81","**7.999.81 — la bozza del taccuino non scambia più il tiro per un dribbling sbagliato.** Taccuino 7.999.78 SIT #112 «Dribbling centrale e tiro» («nel dribbling il pallone e l'eroe si separano: 1,5s, max 13,5u»): misurato con la bozza vera sulla scena forzata, la separazione era il VOLO DEL TIRO finale (eroe fermo a x 29, pallone verso la porta): vecchio rilevatore 7,1s e 19,2u, nuovo nessuna riga. Il rilevatore smette di contare quando il pallone parte calciato (oltre 16 u/s mentre si stacca dall'eroe); rosso `__CPM_NO_CALCIO81`, guardiano `taccuino-81`. L'angolo corpo↔porta al tiro (149° sul telefono) in headless è 1-4°: non riprodotto. Il riquadro d'esito della #112 dice «fuori», coerente col 3D. Il codice 007 «camera salta 2,5u / 156 u/s» è esattamente la soglia del rilevatore (2,5u in 16ms) ed è comparso a 4,2s su due scene diverse: sembra un movimento di regia fisso, in coda. test:logic, save-compat, design-system, griglia-mobile, career-critical verdi.","✅"],["30/09","7.999.80","**7.999.80 — nella festa l'eroe corre quando si sposta, e il pannello statistiche/pagelle è più lungo.** (1) Taccuino 7.999.78 «l'eroe nei festeggiamenti post partita continua a volare con le braccia alzate»: sonda `festa-79` — nei beat consegna e festa il corpo si spostava a 10,6-11,8 u/s con la clip delle braccia al cielo a peso pieno e la corsa a 0, cioè scivolava. Oltre 1,5 u/s la clip non si accende e comanda la corsa: 0 campioni in scivolata contro 36 col rosso `__CPM_NO_VOLO80`. (2) «Il pannello statistiche e pagelle deve essere più lungo» (foto 18:54 con la barra di scorrimento): +40 px verso il basso con la cima ferma dove la voleva il PO; margine per la cronaca 214 → 174 (pannello fino a 701, cronaca su tre righe da 724). Rosso `__CPM_NO_LUNGO80`. (3) Stesso taccuino, rigiocato: #185 «Scarico e ricevi sul fondo» (003) — in 8 corse su 8 il pallone finisce a ~1u dall'intercettore; una correzione provata sul rimbalzo non cambiava la misura ed è stata RITIRATA; resta da verificare a occhio il gesto del furto. #38 (005/014/012/011) e #112 (separazione 13,4u, tiro che arretra di 3u e esce largo) misurati, in coda. Gate 14/14 (00001505), test:logic, save-compat, design-system, griglia-mobile, career-critical, stat-77, volo-75, celebration, setpiece-celebration verdi. `hud-voci` rosso e cieco anche sulla 7.999.79 (preesistente, non vede le voci).","✅"],["30/09","7.999.79","**7.999.79 — taccuino S.12 W.30-32: la ribattuta si gioca davanti alla porta, il rigore va dove dice lo stile.** Otto note rigiocate sulla 7.999.78 con la sonda `taccuino-79` (pagina nuova per caso, azione per etichetta, esito forzato). **SIT #151** (005 biliardo, 009 direzione, eroe nella porta, palo davanti nella festa): le corse del build-up spingevano l'eroe fino alla linea di porta e il bersaglio casuale del tiro lo faceva tornare indietro fino a 3,6u → nel build-up chi attacca non va oltre x 94 (rosso `__CPM_NO_TIRO94`), tiro e testa non puntano mai dietro al pallone (rosso `__CPM_NO_AVANTI78`), partenza della #151 al centro dell'area; eroe nello specchio della porta 27-79 fotogrammi → 0 (rosso: 53). **SIT #5** «Potente all'incrocio» uscito centrale: il punto del rigore era casuale e ignorava lo stile → incrocio / angolato / centro-alto decidono il punto (rosso `__CPM_NO_STILE79`; angolato rasoterra in porta a z 2,8 contro -0,2). Non riprodotti sul percorso forzato: #126 e #64 (esito non-gol in rete), #18 (separazione nel dribbling). #140: il pallone arretra di 12u dopo il contrasto fallito, da giudicare a video. #171 già coperto dalla 7.999.76; mani del mister dalla 7.999.78. Il 007 «camera salta 2,5u a 4,2s» ha numeri IDENTICI su due scene diverse (#171 e #126): sospetto strumento, da verificare. Firma golden della #151 aggiornata (partenza 96,38 → 92,42, voluta). Gate 14/14 (00001505), test:vision, test:logic, typing-shortcuts, save-compat, replay, career-critical, celebration, setpiece-celebration, rigore-69, testa-76 verdi. `outcome-not-goal` in modalità forzata è cieco anche sulla 7.999.78 (preesistente).","✅"],["30/09","7.999.78","**7.999.78 — le braccia del mister non si incrociano più nelle feste (Parte 1 del prompt PO).** Causa misurata con la sonda `mister-77`: il mister 3D (actor-presenter) nasce in A-pose, con l'omero già 43,9° sotto l'orizzontale, e il codice lo abbassava di un angolo fisso di 71,6° pensato per la T-pose → braccio a 115,5°, cioè 25,5° oltre la verticale verso l'altro lato: mani 3,7 cm oltre la mediana e avambracci dentro il busto in ogni fase di ogni festa. Sistema unico: le pose sono direzioni nel riferimento del corpo, raggiunte a ogni fotogramma dalla posa di caricamento con una rotazione nello spazio del mondo (nessun angolo locale scritto a mano); lo usa anche il manichino di riserva. Guardiano `mister-77` (27 fasi su 6 feste): 0 violazioni contro 43 col rosso `__CPM_NO_BRACCIA77`; manichino 0 (il vecchio sistema lì non sbagliava: misurato). Punto 5: la panchina in produzione è quella procedurale, che non ruota le braccia; il corpo 3D della panchina è spento dalla modalità CGTrader. Foto prima/dopo in reports/mister77. Gate 14/14, celebration, setpiece-celebration, volo-75, test:logic, save-compat, career-critical verdi; `cerimonie` resta col rosso preesistente dichiarato alla 7.999.77.","✅"],["30/09","7.999.77","**7.999.77 — intervista, festa e statistiche: tre note di collaudo del pomeriggio.** (1) «Prima vittoria stagionale casalinga» dopo un 3-0 in trasferta: la domanda non aveva condizione e la gemella leggeva uno storico che il luogo non lo registra → regola unica letta dal calendario (casa, nessuna vittoria in casa prima); guardiano impulsi-contesto (rosso: sbaglia il caso «già vinta in casa»). (2) «L'eroe vola nella festa»: a volare era la clip d'esultanza, piede più basso a 0,15-0,30 contro 0,118 a terra → piedi ancorati al prato in cerimonia fuori dal podio; volo-75 esteso: 0 contro 0,184 col rosso. Foto prima/dopo in reports/volo77. (3) «Brutte le statistiche con lo scroll»: tolte dal pannello le cinque voci già in striscia e tabellone, righe più fitte → caso peggiore 237 px su 295 (rosso 434); guardiano stat-77. Gate 14/14 (fingerprint 00001505), test:logic 43/43, save-compat 12/12, design-system, griglia-mobile, celebration, setpiece-celebration e career-critical verdi. **Rosso preesistente dichiarato:** `cerimonie` fallisce anche sulla 7.999.76 — dal 24/09 la premiazione di squadra dà a campionato, coppa e nazionale la stessa sequenza e il guardiano pretende sequenze diverse; va nella Parte 2 (scene fuori dal gioco). In coda: braccia del mister (Parte 1), goleade, grafica degli highlight.","✅"],["30/09","7.999.76","**7.999.76 — il colpo di testa in corsa parte quando il pallone è alla testa.** Taccuino PO SIT #171 «Stacco in corsa potente» (000: «la palla è bassa e non è sincronizzata con lo stacco aereo»): misurato, il pallone passava a 0,27u dalla testa all'inizio della clip ma il colpo aspettava il suo caricamento e partiva a quota 0,75, con l'eroe all'apice dello stacco. Il 7.999.64 lo aveva chiuso solo sul cross costruito → ora vale per ogni colpo di testa. Guardiano `testa-76`: 2,3 contro 0,72 del rosso `__CPM_NO_TESTA76`; controlli scene 7 e 64 a 2,41.","✅"],["30/09","7.999.75","**7.999.75 — nella festa l'eroe ha i piedi a terra.** Collaudo PO «l'eroe vola, dovrebbe correre o camminare» (foto 12:26, tripletta 6-1): nella festa di fine partita l'eroe riceveva un saltello continuo fino a 0,22u, pensato per il vecchio corpo procedurale; col corpo 3D la clip di corsa/esultanza ha già il suo movimento e i piedi si staccavano dal prato → niente saltello aggiunto col corpo 3D, sul palco resta la sua quota. Guardiano `volo-75`: quota massima 0 contro 0,22 del rosso `__CPM_NO_VOLO75`.","✅"],["30/09","7.999.74","**7.999.74 — nelle scene difensive si vede chi fa l'intervento.** Il guardiano `hero-in-frame` era rosso già sulla 7.999.67. Due cause misurate fotogramma per fotogramma: (a) con l'eroe nell'angolo della propria area la camera gli stava quasi sopra e lo sguardo non poteva scendere abbastanza (−54° contro −77° necessari, per un limite di quota del punto guardato) → il punto guardato si avvicina lungo la stessa direzione; (b) sulle difensive la guardia-palla ruotava lo sguardo verso il pallone respinto e portava fuori l'eroe → la rotazione si ferma dove l'eroe resterebbe dentro. Guardiano verde: gi138 17% · gi133 3% · gi146 0% · gi33 11% (rosso 73/84/72/35, `CPM_ROSSO74=1`). Censimento 191 scene: eroe fuori quadro 14,7% → 7,2% dei fotogrammi. Resta aperta la TAGLIA dell'eroe (mediana 0,090, soglia 0,11), identica sulla 7.999.67.","✅"],["30/09","7.999.73","**7.999.73 — la barriera della punizione è compatta.** Collaudo Codex 001 sulla scena 81 «muro a 9 metri»: la barriera nasceva spalla a spalla (1,5u di campo) ma marcature, coperture e la bolla di repulsione la allargavano fino a y 49-60 → posizione reimposta dopo tutte le passate, i quattro esenti dalla repulsione fra di loro (guardiano `barriera-73`: larga 4,5u contro 10,9u del rosso). **Aperto, trovato strada facendo:** il guardiano `hero-in-frame` (non in catena) è rosso già sulla 7.999.67 e in parte sulla 7.999.2 — eroe fuori quadro nella conclusione su scene difensive: gi138 67-79%, gi133 65-91%, gi33 28-35%, gi146 70-83%. Non causato dai rilasci di oggi (misurato con e senza le modifiche).","✅"],["30/09","7.999.72","**7.999.72 — tiro murato che non torna verso la porta; azione sopra il pannello delle scelte.** Taccuino PO #110 «Faccio il velo e attacco» (111 «portiere fuori tempo»): era un tiro MURATO a x 21 che poi il post-arco trascinava a x 38,6, verso la porta, col portiere immobile → ora si ferma dove è stato murato, 3u indietro (guardiano `muro-70`: verde Δ −2,5, rosso +12,4). Collaudo Codex 001/002 sulla scena 31: nella scelta il pallone stava a 746-755 px, sotto i pulsanti (736 px) → solo durante la scelta la finestra di proiezione scorre verso il basso fino al 22% (guardiano `pannello-72`: 172 px di spostamento, pallone 129 px più in alto del rosso). Scena 134 (001/006) NON riprodotta sul percorso forzato: il volo di costruzione non parte e i difensori si muovono di 7-11u; resta nel collaudo di Codex.","✅"],["30/09","7.999.71","**7.999.71 — stadi: scritta dello stadio opaca e prato con la grana.** Il pannello LED col nome dello stadio disegnava la griglia a lampadine bucando il canvas: ~44% dei pixel trasparenti, la tribuna dietro traspariva e la scritta sembrava sovrapposta al pubblico → righe scure invece di buchi, colori sRGB (ambra piena), lampeggio al gol mantenuto via luminosità. Prato: le strisce erano tinta unita → grana d'erba leggera con luminosità media compensata (i colori del campo non cambiano). Guardiano `stadi-70` esteso (rossi `__CPM_NO_LED70`, `__CPM_NO_ERBA70`).","✅"],["30/09","7.999.70","**7.999.70 — stadi: il mondo oltre le tribune e gli angoli veri.** Direttiva PO «la grafica degli stadi deve essere migliorata il più possibile». (a) Fondale: prima il cielo era un colore piatto e negli stadi piccoli metà quadro era vuoto; ora un cilindro oltre le tribune con cielo sfumato, alone dei riflettori, stelle, colline/alberi/case/campanile in provincia e palazzi con finestre accese in città, luci lontane di notte, foschia di giorno, orizzonte arancio al tramonto (un solo oggetto, fuori da nebbia e tone mapping). (b) Settori d'angolo: erano cubi col pubblico dipinto su sei facce («blocco a puntini» della galleria), ora gradinate inclinate con fianchi e muro in cemento. Guardiano `stadi-70` (rosso `__CPM_NO_FONDALE70`+`__CPM_NO_ANGOLI70`). Correzione alla fase 1: il pubblico NON è uguale ovunque, i seggiolini seguono già il colore del club di casa (la galleria usava sempre lo stesso club). + Collaudo Codex 003 confermato e corretto: «Dribbling centrale e conduci» (gi30) e «Giratone e conduci» (gi123) ora raccontati come conduzione (guardiano `conduzione-70`: verde 4/4, rosso 3/4).","✅"],["30/09","7.999.69","**7.999.69 — stadi, fase 2 avviata: i pali dei riflettori escono dalla tribuna.** Fase 1 chiusa: galleria di 13 impianti × 4 inquadrature fisse (`npm run galleria-stadi`, pagina di audit consegnata al PO), 13/13 costruzioni complete. Primo elemento della fase 2: con le torri «perimetrali» (comunale, spagnolo) i due pali centrali dei lati lunghi stavano sui primi gradoni della tribuna centrale, in mezzo all'inquadratura TV → ora dietro la tribuna, luci invariate (guardiano `pali-69`: 0 pali davanti su 3 impianti, rosso `__CPM_NO_PALI69` 2 per impianto). Harness: opzioni di `waitForFunction` al terzo argomento (segnalazione Codex, verificata). Prossimi elementi: tabellone davanti all'anello alto, pubblico uguale ovunque, sfondo oltre le tribune basse, scritta dello stadio tagliata.","✅"],["29/09","7.999.68","**7.999.68 — rigore sulla linea e rovesciata vera.** Taccuino PO 7.999.65. #58 «il portiere non è sulla linea»: nel rigore in partita il portiere restava sul bersaglio della scena (x 93,6, cinque unità davanti alla linea 98,6) → ora x 98 (guardiano `rigore-69`, rosso `__CPM_NO_RIG69` 93,5). #1 «Rovesciata!» (000): la sforbiciata non agganciava mai il pallone al piede (cadeva a 0,4 e l'eroe lo superava di 3u) e la clip correva a ~4× → aggancio all'osso del piede e scala nativa, contatto a u 0,287 contro la taratura 0,29, spalle alla porta 171° (guardiano `rovesciata-69`, rosso `__CPM_NO_ROV69`: nessun aggancio). Restano #134 duello aereo (001/006) e #110 velo (111).","✅"],["29/09","7.999.67","**7.999.67 — sala stampa leggibile.** Collaudo PO «alcuni testi sopra non si leggono bene» (foto 23:14): la scena è in scala 0,775, i testi a 11 px arrivavano a ~8,5 px e le due righe basse di marchi stavano dietro microfoni e bottiglietta, tagliate. Marchi a 14 px solo nelle due righe libere in alto, fascia del tabellino più alta, riga «In casa · Il tuo voto · gol» a 14 px scura. Misurato a schermo: riga del voto 10,1 → 13,2 px, marchi dietro i microfoni 6 → 0. Guardiano `leggibile-68`, rosso `__CPM_NO_IV68`. Solo grafica: catena grafica (griglia-mobile, design-system, career-critical, test:logic, save-compat) verde.","fatto"],["29/09","7.999.66","**7.999.66 — prima del tiro dal limite l'eroe non torna indietro.** Taccuino PO #56 (012): nel tiro dal limite col terzo uomo il tocco di preparazione riportava l'eroe 3 unità indietro prima del tiro; ora va verso la porta (+2). Vale anche per #27 «Triangolo e tiro». Guardiano `controllo-67`, rosso `__CPM_NO_CTRL67`. Verificato che la #105 «Cambio gioco» era il passaggio all'indietro della costruzione, già tolto nella 7.999.65. Gate 00001505 e catena verdi.","fatto"],["29/09","7.999.65","**7.999.65 — il passaggio dell'eroe non si gioca due volte.** Taccuino PO sulla 7.999.63, #107 «Filtrante tra i centrali» e #118 «Uno-due e smista» (012 verticalizzazione all'indietro · 014 palla flipper): la costruzione dell'azione conteneva già il filtrante dell'eroe fino all'area e il controllo del compagno, poi la conclusione — lo stesso filtrante — ripartiva dal pallone lontano dall'eroe e sull'intercetto tornava indietro. Ora la costruzione si ferma prima dell'ultimo passaggio dell'eroe, che parte dai suoi piedi. Misurato su gi107: distanza pallone-eroe alla partenza 14,4 → 0,3 u. Guardiano `passaggio-65`, rosso `__CPM_NO_PASS65`. #27 (tiro intercettato): il pallone rotola fino all'intercettatore (regola 7.999.23), non riprodotto come flipper; una correzione provata non cambiava la misura ed è stata tolta. Restano #6 (salto alla bandierina), #74 (tribune da dietro), #105 (lancio corto). Gate 00001505 e catena verdi.","fatto"],["29/09","7.999.64","**7.999.64 — colpo di testa all'altezza della testa; pannello più basso; niente «domani in campo» dopo un'eliminazione; panchina senza interazioni.** (1) Taccuino PO #7 (colpo di testa sul cross, 000): le prove forzate erano sincronizzate, il difetto stava sul flusso vero col cross del motore — l'arco del colpo aveva ancora 0,24 s di caricamento e il pallone scendeva dalla testa alle ginocchia; il cross inoltre puntava dove l'eroe era al lancio. Ora contatto subito alla quota della testa e volo che segue l'eroe. Misurato: quota del pallone all'impatto 2,24-2,26 contro 0,67-0,71 del rosso. Guardiano `testa-vera-63` (partite vere), rossi `__CPM_NO_TESTA63`/`63B`. (2) Collaudo PO «pannello statistiche/pagelle troppo alto»: aperto al 43%, bordo alto 235 → 328 a 412×915, sotto porta e area avversaria (`pannello-61` esteso). (3) «C'è poco da allenarsi dopo un'eliminazione»: CT e rassegna non dicono più «domani in campo»/«settimana di allenamento» dopo un'eliminazione o in Nazionale. Guardiano `elim-64`, rosso `__CPM_NO_ELIM64`. (4) Panchina: nessuna scheda d'interazione con l'eroe fuori dal campo e riquadro «A disposizione» sotto la striscia delle statistiche (0 schede/0 px contro 3/48). Guardiano `panca-64`, rosso `__CPM_NO_PANCA64`. Gate 00001505 e catena verdi.","fatto"],["29/09","7.999.63","**7.999.63 — la volée si calcia in aria.** Taccuino PO #9 «volée: il gesto non è sincronizzato con la velocità del cross» (000): durante il caricamento l'aggancio del tiro al piede portava il pallone del cross a terra (quota 2,2 → 0,2), e l'eroe calciava al volo un pallone fermo sul prato. Ora sulla volée il pallone resta alla quota del contatto aereo e all'impatto si aggancia al piede. Misurato su gi9 «Volée potente»: quota minima nel caricamento 0,23 → 0,92. Guardiano `volee-62`, rosso `__CPM_NO_VOLEE62`. Colpo di testa #7: sul percorso forzato il picco dello stacco coincide con l'arrivo del pallone (scarto 0,00 s su 3 scene); il difetto non si riproduce qui, serve una nuova nota dal telefono. Gate 00001505 e catena verdi.","fatto"],["29/09","7.999.62","**7.999.62 — punizione vera: niente pallone in rete prima del calcio, portiere che si tuffa sulla punizione fuori.** (1) Taccuino PO #13 «Punizione — Bordata potente» (salto del pallone, eroe dentro la porta, 011): sul gol da piazzato festa, onda e affermazione del pallone in rete partivano alla SCELTA — il pallone veniva scritto in rete prima del calcio e la rincorsa portava l'eroe con sé, a x 50,5. Ora aspettano l'ingresso vero in rete (come il gol su azione). Misurato: eroe x max 50,5 → 28,1 · pallone prima del calcio 50,6 → 28 · festa all'ingresso in rete 1/1. Guardiano `punizione-62`, rosso `__CPM_NO_FK62`. È anche la causa della vecchia nota #13 della 7.999.44 («salto 20,6u in porta»). (2) Taccuino #78 «punizione fuori: il portiere non si tuffa»: ora sulla punizione vicina ai pali e sul rigore fuori il portiere si tuffa corto. Misurato 2/2 uscite con tuffo, rosso 2/2 senza gesto. Guardiano `punizione-fuori-62`, rosso `__CPM_NO_FKGK62`. Gate 00001505 e catena verdi. Restano #9/#7 (gesto non sincronizzato col cross, 000).","fatto"],["29/09","7.999.61","**7.999.61 — festa con le braccia al cielo; Statistiche e Pagelle alla stessa altezza, senza coprire la porta.** (1) Collaudo PO «il festeggiamento post partita è tutto accartocciato»: dalla 7.999.57 la festa leggera suonava in loop `mx-victory-jump`, un salto che passa quasi tutto il tempo rannicchiato → ora `mx-victory` (braccia al cielo, la clip del galà), solo nella festa; le esultanze dopo un gol non cambiano. Guardiano `festa-57` esteso (rosso `__CPM_NO_FESTA61` torna al salto). (2) Collaudo PO «altezza e posizione tra pagelle e statistiche differenti»: il pannello prendeva l'altezza dal contenuto → aperto ha sempre la stessa altezza e il contenuto scorre dentro; su richiesta PO non copre la porta (55%: bordo alto da 185 a 235 px a 412x915). Guardiano `pannello-61` (verde 235/426 nelle due viste; rosso 425/236 contro 383/278). Catena completa verde: gate 14/14 fingerprint 00001505, career-critical 11/11, design-system.",""],["29/09","7.999.60","**7.999.60 — gli angoli partono dalla bandierina e ogni cross ha chi lo calcia.** Taccuino PO #76/#6 (corner) «001 apertura scena, la palla rimbalza prima del tiro». Misurato sul flusso vero (`__CPM_ORIG26`): l'angolo partiva da (78,76) — la posizione di chi passa nel motore — con un volo di 0 unità sull'eroe, e i cross partivano senza nessuno a calciarli (`calcia: 0`). Ora l'angolo parte dalla bandierina del lato giusto, il compagno più vicino si mette dietro il pallone e calcia, e sui tiri di prima il cross arriva all'altezza del collo del piede invece di rimbalzare a terra (quest'ultima non misurabile senza schermo). Guardiano `bandierina-60`: verde angoli 3/3 dalla bandierina e crossatore 3/3; rosso `__CPM_NO_BANDIERINA60` 0/1 e 0/2. Catena completa verde: gate 14/14 fingerprint 00001505, career-critical 11/11.",""],["29/09","7.999.59","**7.999.59 — l'ingresso in campo parte a stadio pronto: niente più scatti durante la camminata.** Collaudo PO «le scene 3D all'ingresso in campo sono molto scattose e pesanti». Misurato con long task e profilo CPU: 13 blocchi del thread principale (12,8 s in headless) **durante la camminata** — compilazione degli shader dei corpi CH38 e CGTrader (lavoro sincrono: si sposta, non si rende fluido), upload texture, pittura delle maglie. Ora: (1) le squadre aspettano al tunnel finché CH38 e CGTrader sono pronti e compilati fuori schermo, con un velo «Si accendono i riflettori» (tetto 10 s); (2) il fondo maglia si dipinge una volta per squadra (2,1 s → 0,5 s); (3) niente ridimensionamento a dimensione invariata. Guardiano `ingresso-59`: blocchi durante la camminata **1,4 s contro 8,1 s** del rosso `__CPM_NO_WALKHOLD74`. In headless la GPU è software: il numero vero è il telefono. Catena completa verde: gate 14/14 fingerprint 00001505, career-critical 11/11, design-system.",""],["29/09","7.999.58","**7.999.58 — i rigori si vedono: rigorista di spalle, porta davanti, il portiere si tuffa.** Collaudo PO «non si vede il tiratore ed il portiere non si tuffa ma si sposta un po' a cavolo». Misurato su una serie vera coi corpi 3D: (1) camera pensata per lo schermo orizzontale — col telefono in verticale il rigorista cadeva a 16° dal centro, fuori dai ±12° del quadro → ora dietro il rigorista: inquadrato **100% contro 0%**; (2) il tuffo era solo la rotazione della mesh logica, invisibile al corpo 3D → ora suona la clip `dive` (2 rigori su 2); (3) in porta c'era sempre il portiere ospite, anche sui rigori degli ospiti → para il portiere di chi non tira; (4) il rigorista che rientra in fila attraversava il quadro → nei rigori si disegnano rigorista, portiere ed eroe; (5) un altro scrittore trascinava il pallone dal dischetto verso la camera → resta sul dischetto fino al calcio. Guardiano `rigori-58` (rosso `__CPM_NO_RIGORI58`). Catena completa verde: gate 14/14 fingerprint 00001505, career-critical 11/11.",""],["29/09","7.999.57","**7.999.57 — nella festa di fine partita l'eroe esulta, non resta congelato.** Collaudo PO «scena sballata, l'eroe rimane freezato per un po'» (2-0 col Belgio). Misurato coi corpi 3D: nella festa **leggera** (niente trofeo) la clip `mx-victory-jump` dell'eroe restava in pausa al 34% — a metà salto — per tutti i festeggiamenti; il congelamento all'apice serve a tenere la coppa in mano nella premiazione e valeva anche senza coppa. Ora senza coppa l'esultanza si suona intera e riparte; la premiazione col trofeo non cambia. `__CPM_ANIM_AUDIT` espone il mixer dell'eroe. Guardiano `festa-57`: verde clip sempre in movimento, rosso `__CPM_NO_FESTA57` 8 campioni fermi. Catena completa verde: gate 14/14 fingerprint 00001505, career-critical 11/11.",""],["29/09","7.999.56","**7.999.56 — niente più T-pose negli highlight.** Collaudo PO «sono ritornati in T pose e non corrono i giocatori in 3D» (nota su 7.999.53, scena #110 velo). Riprodotto senza schermo coi corpi accesi (5 corpi a T sulla #110) e **bisezionato: 7.999.36 pulita, 7.999.37 T-pose** — la regressione era in giro da due giorni. Causa: la 7.999.37 saltava la velocità smussata sugli stacchi di scena; se era il primo fotogramma di un corpo il valore restava *undefined* → NaN nel peso idle/corsa (media esponenziale: NaN per sempre) → nessuna clip applicata. Ora lo stacco inizializza a fermo e un peso non finito si ripara; `__CPM_ANIM_AUDIT` conta per corpo i pesi non finiti e i corpi senza clip. Guardiano `tpose-56` sulle scene delle note #110/#6/#76: verde 0 corpi fermi su 12 campioni, rosso `__CPM_NO_TPOSE56` 5 corpi su 5. Catena completa verde: gate 14/14 fingerprint 00001505, logic 43, save-compat, replay, career-critical 11/11.",""],["29/09","7.999.55","**7.999.55 — la partita sopravvive al background anche in Nazionale; il CT ha un nome; i riquadri mostrano tutto.** (1) Collaudo PO «si perde l'avanzamento se metto l'app in background»: misurato nel codice — la ripresa in partita (7.150) **escludeva le gare della Nazionale** (il PO giocava l'Europeo), si scriveva solo all'evento di background (su Android può non arrivare) e solo fra 3' e 86'. Ora Europeo/Mondiale, Coppa delle Nazioni e amichevoli inclusi, scrittura periodica ogni 4 s, finestra fino all'89'. Guardiano `ripresa-55` con riavvio vero della pagina: istantanea al 10' senza evento, rientro in campo al 12'; rosso `__CPM_NO_RIPRESA55` nessuna ripresa. Il fine partita era già coperto dal sidecar al fischio. (2) «Il mister non cambia in Nazionale»: non esisteva un CT, parlava il mister del club — ora `ctDiNazione` (cognome della nazione, nuovo ogni 4 stagioni) nel pop-up, nelle grida, nel commento a fine partita e nel tab Nazionale; guardiano `ct-54`. (3) Censimento dei 66 riquadri: MVP del mese (8 su N) e Memoria della carriera (ultimi 12, tetto 40 → 200) tutti visibili con scroll; Accademia dichiara «gli ultimi N di tot»; Timeline stagioni con scroll. La 7.999.54 non è stata spedita da sola. Catena completa verde: gate 14/14 fingerprint 00001505, logic 43, save-compat, replay, career-critical 11/11, design-system.",""],["29/09","7.999.53","**7.999.53 — il taccuino misura il corpo al tiro; carriera: piazzamenti, allenatori e diario onesti.** (1) Taccuino #3 «al tiro il corpo non guarda la porta»: senza schermo il contatto è a 8-11° dalla porta, quindi il gioco lo misura **sul telefono** — testimone sempre acceso `__CPM_CONT53` e riga «corpo↔porta al contatto: N°» nella bozza (oltre 35° la dichiara girata). Guardiano `contatto-53` (verde 8°, rosso `__CPM_NO_CONT53` vuoto). (2) Club › Piazzamenti: «ultimo» → «ultima stagione»; le stagioni senza registro salivano a scala 7°…13° (hash su chiavi consecutive) ed erano spacciate per «registro della lega» → mescolate e dichiarate stima; il riassunto conta solo le stagioni vere. (3) Storico allenatori: titolo 12, righe 6, una per stagione → una riga per mister con le stagioni unite. (4) Diario: teneva 80 voci (solo l'ultima stagione) e ne mostrava 15 → tetto 400 con sfoltimento delle voci minori vecchie, sfogliabile ◀ Stagione ▶ con scroll interno (le stagioni già perse nei salvataggi esistenti non tornano). Catena completa verde: gate 14/14 fingerprint 00001505, logic 43, save-compat 12, replay, career-critical 11/11, design-system.",""],["28/09","7.999.52","**7.999.52 — galà: niente eroe sul palco, solo i presentatori (PO: «il risultato è terribile»).** L'eroe in smoking non sale più (il corpo si carica solo col varco di prova `__CPM_GALA_EROE51`, per un futuro modello d'abito vero). Il momento del premio è in campo largo: trofeo sotto l'occhio di bue, presentatrice con la busta aperta e presentatore ai lati, coriandoli; la tua figurina resta nella fascia coi numeri. Guardiano `npm run gala-3d` aggiornato (presentatori in scena, nessun eroe) verde, rosso `__CPM_NO_GALA51` riprodotto, `npm run gala` verde. Catena grafica + career-critical 11/11 verdi.",""],["28/09","7.999.51","**7.999.51 — il galà è il momento in 3D (scelte PO: 3D, abito da sera, solo i miei premi in cima, figurine anche piccole).** Tre tempi: apertura coi presentatori in scena e la busta in mano (fascia «Stasera 4 premi · 2 sono per te»), un momento per ogni premio vinto (l'eroe sale sul palco in smoking e alza il trofeo: un tocco), riepilogo degli altri premi con la tua posizione. Prima: 4 tocchi per premio anche per quelli degli altri (~16 per serata), palco 3D vuoto e coperto dall'interfaccia, e il corpo del vincitore mai caricato dal 7.85. Misurato: le clip korward-regular tengono le braccia a T sul corpo (mano a 1,51 m, 0,72 m di lato) → si usa il corpo della partita con le sue idle/walk e `mx-victory` (mani a 1,85 m col trofeo). Smoking: giacca e pantaloni ricolorati, maniche e gambe su tubi appesi alle ossa, camicia/papillon/revers/falde nel riferimento del personaggio (le ossa hanno assi Unreal: la prima camicia finiva dentro il busto). Dopo il galà «I tuoi premi» in cima con la figurina, podi della lega in fisarmonica chiusa. Guardiano `npm run gala-3d` verde e rosso `__CPM_NO_GALA51`; `npm run gala` (serata a buste di riserva) verde. Catena grafica + career-critical 11/11 verdi. **Limiti dichiarati:** capelli dell'eroe nel 3D col colore del modello (la figurina ha quello dell'avatar); nella camminata ravvicinata si vedono le giunture delle maniche (la camera resta larga finché cammina).",""],["28/09","7.999.50","**7.999.50 — le decisioni del questionario PO.** (1) La «Crescita +N» delle offerte era solo mostrata: ora l'offerta accettata scrive `growthBoost {pct,until}` e l'allenamento cresce del N% nella prima stagione (passaggio al professionismo) o fino a fine stagione (trasferimento), dal punto unico della crescita settimanale; campo opzionale, i salvataggi vecchi valgono ×1. (2) «La Scalata» contava qualunque trofeo: ora solo il campionato vinto. Guardiano `npm run decisioni-50`: verde (×1,14 dentro, ×1 dopo e sui salvataggi vecchi; sola coppa = no, campionato = sì) e rosso `__CPM_NO_CRESC49`/`__CPM_NO_SCALATA50` riprodotto. Restano come sono per scelta PO: barra fissa «Vivi la Settimana», nomi delle leghe, sigle sui microfoni. Catena completa verde (gate 00001505, career-critical 11/11, tri-path verde). **In coda (scelta PO): galà «Il momento in 3D» + dopo il galà solo i propri premi in cima.**",""],["28/09","7.999.49","**7.999.49 — Parte A: tutte le revisioni delle schermate (approvate dal PO).** 243 righe dell'analisi critica lavorate in 6 lotti paralleli e unite: **199 fatte dai lotti + 9 chiuse dopo l'unione** (nomi doppi in rosa, importi «€11,4 mln», sigle club uniche, motto del mister, «La tua squadra» nel pre-partita, strisce sostegno/idee in una riga, proposta del procuratore che lascia la Home dopo una settimana, 171 domande d'intervista al «tu», «OVR» nel bilancio di fine stagione). Glossario applicato: esiti V·N·P ovunque (prima P valeva «persa» in un riquadro e «pareggio» in quello sotto), date «St. · Sett.», decimali con la virgola, «Fiducia del mister», «controproposta», «procuratore». Verità: nome della squadra nelle offerte (leggeva `club.name`, le Primavera hanno `n`), «crescita x2» → «Cresce più in fretta fino ai 22 anni» (×1,35), spia «⚠︎ ?g» del pre-partita visibile solo con `__CPM_DIAG`, fine stagione con gol etichettati e «Stagione straordinaria» solo con un premio vero, Nazionale con la soglia vera del CT, finestre una alla volta. **4 righe false** (la stessa finestra non chiusa dal censimento), **6 non fatte** motivate, **5 del banco**. Banco di prova reso coerente (lega vera, contratto, 10 partite noi–loro, classifica a 10 giornate, obiettivi nel formato del gioco: prima facevano crollare la fine stagione) e censimento che dichiara le schermate che non apre invece di fotografare la Home. Catena completa verde (gate 00001505 rilanciato da solo: il primo giro in parallelo coi test di carriera aveva `motion` gi0 12/21 per CPU contesa, da solo 18/21), career-critical 11/11, copyright 0 riferimenti. Unito il rapporto Codex sulla conduzione (bracci non separabili, 0 salti confermati in 5 partite naturali).",""],["28/09","7.999.48","**7.999.48 — festa 3D, le due migliorie chieste dal PO + Parte A consegnata.** (1) Durante la festa/premiazione il tabellone torna casa–trasferta: prima, per lo specchio dal 46' (7.893), si leggeva «0 – 2» sopra la fascia «2 – 0 in casa»; ora «Selezione Granata 2 – 0 Polisportiva Centro» con lo scudo di casa a sinistra (x 11 px contro 254 col rosso `__CPM_NO_TAB48`). (2) La curva canta il cognome dell'eroe: «COGNOME! COGNOME! COGNOME!» poi «C'è solo un …», testo chiaro sulla pillola (il colore del club sul fondo scuro non si leggeva). Rosso `__CPM_NO_CORO48`. Guardiano `npm run festa-3d` esteso: verde, `--rosso`, `--rosso48` tutti come atteso. Catena completa verde (gate 00001505, career-critical 11/11). **Parte A** pubblicata come pagina privata: 243 problemi su 36 schermate, glossario, 10 correzioni prioritarie, autocritica; 14 righe gravi nascono dal banco di prova scritto a mano (non dal gioco) e 8 schermate il censimento non le ha aperte. Nessuna modifica al gioco dalla Parte A finché il PO non approva.",""],["28/09","7.999.47","**7.999.47 — la festa di vittoria è il momento in 3D (scelta PO).** Prima: riquadro scuro di 3,4 s sopra la partita 2D. Ora la vittoria meritata apre la cerimonia 3D leggera (esultanza, abbraccio, festa sotto la curva, ~9,5 s, «Salta festeggiamenti») con una fascia TV in basso coi numeri veri: «Fischio finale · Doppietta», «2 – 0 in casa contro …», 2 gol · 1 assist · voto 8,5. Il tabellone dice «Fine partita» e FT, non più «Premiazione» e la coppa (nessun titolo vinto). Guardiano `npm run festa-3d`: verde (fascia = tabellone, niente testo di premiazione, «Salta» porta alla card) e rosso `__CPM_NO_FESTA3D47` (torna il riquadro di prima, tenuto come riserva). Catena completa verde (gate 00001505, career-critical 11/11). Foto in `docs/collaudo-testi/festa/`. Fuori ambito: il coro col nome dell'eroe; il tabellone specchiato dopo il 45' (7.893) mostra la nostra squadra a destra.",""],["28/09","7.999.46","**7.999.46 — parte A, primo pezzo: censimento delle schermate e italiano evidente corretto (autorizzato dal PO).** Strumento nuovo `censimento-schermate.mjs`: 48 schermate fotografate a 360 e 412 px con le fisarmoniche aperte (menu, opzioni, creazione, offerte dopo i provini, 10 linguette, pop-up di carriera, intervista, offerta, settimane vissute, stagione vissuta fino al galà e alla fine stagione, stagione nuova) e il loro testo visibile in `docs/c
