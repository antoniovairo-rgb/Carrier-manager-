<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Registro di cantiere: una testata stretta, sette schede, tabelle dense e filtrabili colonna per colonna. */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#17201b; --muted:#5b6a61; --rule:#d5ddd6; --accent:#1f7a4d; --accent-ink:#ffffff;
  --st-ok:#1f7a4d; --st-ok-bg:#e1f1e7; --st-run:#8a5a00; --st-run-bg:#fbefd6; --st-open:#a3321f; --st-open-bg:#f8e2dc; --st-wait:#3b5aa8; --st-wait-bg:#e2e8f7;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101512; --panel:#171e1a; --ink:#e4ebe6; --muted:#97a69c; --rule:#2b352f; --accent:#4cc38a; --accent-ink:#0d1611;
  --st-ok:#6fd5a1; --st-ok-bg:#183326; --st-run:#f0c46a; --st-run-bg:#352a12; --st-open:#f29a86; --st-open-bg:#3a1f19; --st-wait:#9db5f2; --st-wait-bg:#1e2740; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --panel:#171e1a; --ink:#e4ebe6; --muted:#97a69c; --rule:#2b352f; --accent:#4cc38a; --accent-ink:#0d1611;
  --st-ok:#6fd5a1; --st-ok-bg:#183326; --st-run:#f0c46a; --st-run-bg:#352a12; --st-open:#f29a86; --st-open-bg:#3a1f19; --st-wait:#9db5f2; --st-wait-bg:#1e2740; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 18px}
h1{font:700 30px/1 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance}
.meta{font:500 12px var(--f-mono);color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:600 15px var(--f-body);border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav button .meta{color:inherit;opacity:.7}
nav button:focus-visible,.ctl:focus-visible,th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{font:15px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;min-width:0}
#cerca{flex:1 1 240px}
.conta{font:500 13px var(--f-mono);color:var(--muted)}
.btn{font:600 14px var(--f-body);background:transparent;color:var(--accent);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;cursor:pointer}
.tbox{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:10px;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:var(--panel);z-index:1}
th button{all:unset;cursor:pointer;font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
th button .fr{font-family:var(--f-mono);color:var(--accent)}
tr.filtri th{padding-top:0;top:34px}
tr.filtri .ctl{width:100%;font-size:13px;padding:5px 7px;box-sizing:border-box}
td{min-width:70px}
td.larga{min-width:260px;max-width:620px}
td.id{font:500 13px var(--f-mono);white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
code{font:500 12.5px var(--f-mono);background:color-mix(in srgb,var(--ink) 7%,transparent);padding:1px 4px;border-radius:4px}
.chip{display:inline-block;font:600 12px var(--f-body);padding:2px 8px;border-radius:999px;white-space:nowrap;margin-bottom:3px}
.c-ok{color:var(--st-ok);background:var(--st-ok-bg)}.c-run{color:var(--st-run);background:var(--st-run-bg)}.c-open{color:var(--st-open);background:var(--st-open-bg)}.c-wait{color:var(--st-wait);background:var(--st-wait-bg)}
.vuoto{padding:24px;color:var(--muted)}
@media (max-width:600px){h1{font-size:25px}td.larga{min-width:220px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

right verde","difetto grave (copyright, coppe)","FATTO — 7.999.210 (giro 357, rilascio automatico 25/11 00:20)","7.999.210","—","—","PO"],["PO-649","24/11 13:10","PO (foto docs/collaudo-po/208-giocatori-volano.png, partita 3D in gioco fluido, camera alle spalle, 90 NUNEZ col pallone, 3 ALBRECHT e 4 KEIL in maglia rossa, portiere 1 WOLF): «i giocatori volano sul campo» — nella foto le ombre stanno staccate e spostate rispetto ai piedi e i corpi sembrano sospesi sopra il prato. Da misurare: quota dei piedi rispetto al prato e posizione dell'ombra per ogni corpo, in gioco fluido e negli highlight, GLB acceso; capire da quale versione (7.999.207/208 o prima)","difetto (partita 3D, corpi)","FATTO — 7.999.215 (giro 366: la posa di guardia dei difensori tiene i piedi sul prato, suola 0,27 → 0,007 u, corpi in aria 11,3% → 5,0%; guardiano volano-366 verde+rosso; residui → PO-663 scivolate, PO-664 stacco di testa, PO-665 misura del pattinamento)","7.999.215","—","—","PO"],["PO-631","23/11 07:12","Dal giro 330 (dubbio 1), PO «Riga in pagina»: se il custode del treno notturno non riesce ad accodarsi entro 280 minuti, la pagina di governo mostra «treno grande di stanotte: non partito» (letto dal riepilogo del custode)","metodo di rilascio (governo)","FATTO — 7.999.207 (giro 333, rilascio automatico 24/11 04:56) (giro 333 unito in lavoro/201 il 23/11 09:55, treno 45139940995)","in coda","—","—","giro 330"],["PO-629","22/11 23:35","PO: «le azioni da colpi testa vanno riviste, non c'è il sincronismo ed il movimento non è naturale» (highlight 3D, nessuna foto; PO 22/11 23:40: «era un cross», cioè colpo di testa su cross dalla fascia; PO 23/11 00:15: «ma in generale tutti i colpi di testa non sono ben congeniati» → l'ambito è TUTTA la famiglia: cross, angolo, punizione, difensivo, tuffo, in tutte le scene). Precedenti chiusi: PO-077 (sincronia col cross, FATTO 7.999.109), PO-056, PO-283, PO-328; da rimisurare sulla 7.999.204: arrivo del pallone alla testa contro stacco e animazione del corpo","difetto (highlight 3D, colpi di testa)","FATTO — 7.999.207 (giro 342, rilascio automatico 24/11 04:56) (giro 342 lanciato il 23/11 10:32)","in coda","—","—","—"],["PO-626","22/11 22:05","Dal giro 329, PO (questionario 22/11): 1) il treno grande di notte controlla se c'è già una corsa e si rimette in coda da solo (oggi con la concorrenza unica può saltare); 2) margine del 10% prima di passare al treno completo (oggi basta un minuto in più); 3) i 4 guardiani della catena «carriera» tornano nei trenini di giorno (via da SOLO_NOTTE_329)","metodo di rilascio (treno)","FATTO — 7.999.206 (giro 330: custode del treno notturno, margine del 10%, guardiani carriera di giorno)","7.999.206","—","—","giro 329 22/11"],["PO-624","22/11 14:35","Madre (difetto del metodo, 22/11): dopo la pubblicazione a mano della 7.999.202 il treno di controllo rimasto in corsa occupava le 20 macchine di GitHub e il deploy del sito è rimasto in coda ~15 minuti finché il PO non ha annullato la corsa a mano; in più i deploy dei soli documenti falliscono spesso nel passo «Deploy to GitHub Pages» (11:06 e 13:12 del 22/11, 20/11). Da fare: il deploy del gioco non deve mai aspettare dietro a un treno (priorità o treno che cede il posto, oppure niente deploy per i soli documenti) e capire i fallimenti del passo di pubblicazione","metodo di rilascio (deploy)","FATTO — 7.999.206 (giri 326, 327, 330: deploy mai dietro al treno, Validate a mano, parti ricostruite dal log)","7.999.206","—","—","22/11"],["PO-623","22/11 11:45","PO (foto docs/collaudo-po/202-home-due-tasti-rossi.jpg, Home al telefono, FC Merseyside St. 17 Sett. 23): «I due pulsanti rossi con le frecce sono molto simili e fanno un po' a cazzotti tra di loro» — «⏭ AVANZA SETTIMANA W.23 → W.24» e «⏩ VAI AL PROSSIMO MOMENTO fino alla partita chiave · sett. 26» uno sotto l'altro, stesso colore pieno e icone quasi uguali. Da proporre al PO: un solo tasto primario (l'altro secondario, o unificati in un tasto con scelta), gerarchia visiva chiara, icone distinte. Collegate: PO-384/400/405/410/411/446 (tasto momento), PO-615 (decisioni in sospeso nella Home)","UI (Home, tasti)","FATTO — 7.999.207 (giro 335, rilascio automatico 24/11 04:56) (giro 335 unito in lavoro/201 il 23/11 09:55, treno 45139940995)","in coda","—","—","foto PO 22/11"],["PO-622","22/11 11:25","PO (foto docs/collaudo-po/202-personal-trainer-consigliato.png, staff → Personal trainer livello 3/3, scelta dell'attributo): «consigliato è sbagliato, magari punto di forza» — l'etichetta «★ consigliato» sotto tecnica 68 e tiro 72 (legenda: «★ pesa di più nel giudizio ed è ancora basso») non è la parola giusta; proposta del PO: «punto di forza». Al momento del giro: allineare etichetta e legenda (se l'etichetta diventa «punto di forza», la legenda va riscritta di conseguenza: oggi segna gli attributi che pesano di più nel ruolo) PO 11:30: «consigliato deve essere sui punti deboli!» → la stella «consigliato» va sugli attributi più deboli da allenare (nella foto passaggio 55, velocità 59, mentalità 59), non su tecnica 68 e tiro 72 come oggi; l'eventuale «punto di forza» resta un'indicazione diversa per gli attributi alti","logica + testo (UI, staff)","FATTO — 7.999.207 (giro 341, rilascio automatico 24/11 04:56) (giro 341 lanciato il 23/11 09:03)","in coda","—","—","foto PO 22/11"],["PO-621","22/11 11:20","PO: «ok metti in coda» — accorciare i trenini: le righe della mappa unica per src/16 (e src/11-12-13) scelgono 120+ guardiani (giro 317: vagone su src/16 = 123 guardiani, ~1 ora di parete). Da fare: misurare quali guardiani guardano davvero ciascun file (per esempio dai simboli/sezioni toccati o dagli esiti storici) e stringere le righe senza perdere copertura; il treno grande notturno resta la rete di sicurezza. Obiettivo misurato: durata del trenino tipico prima/dopo","metodo di rilascio (trenino, mappa)","FATTO — 7.999.205 (giri 328 e 329: righe della mappa più strette, trenini fino a 15 macchine; il seguito è PO-626)","7.999.205","—","mappa-unica, trenino-317","richiesta PO 22/11"],["PO-620","22/11 11:10","Madre (regola PO sugli instabili, verifica 202 docs/sviluppo/VERIFICA202-ROSSI.md): controlli da riparare, dichiarati per ora in ROSSI-DICHIARATI: walkout-fermi-197 (campionamento: verde a ridosso della soglia, rosso sul runner), rigori-296 parte C (braccio rosso «compagno» di ripartenza-piazzato-27 che non mostra il difetto), diagonali-210 (invio dei tasti dipendente dalla velocità della macchina). Più scene-178 rosso sul banco anche su lavoro/201 (giro 320)","controlli (instabili)","FATTO — 7.999.207 (giro 331, rilascio automatico 24/11 04:56) (giro 331 unito il 23/11 06:50: pelle-240 stabile 5/5, walkout-fermi-197 stabile ma con lettura provvisoria da decidere, scene-178 era un difetto vero del gioco, corretto) — già uscita una parte nella 7.999.206 (giro 332)","in coda","—","walkout-fermi-197, rigori-296, diagonali-210, scene-178","verifica 202 22/11"],["PO-619","22/11 09:50","PO: «Rivedi l'intro, il nome del calciatore non deve essere Giovanni Pisano (ex attaccante vero) ma un nome di fantasia». BUG GRAVE (nome di persona reale; controllo copyright bloccante per lo store) → fuori coda. Punti: src/19 intro (didascalia «Giovanni Pisano. Numero 9…» e cognome sulla maglia «PISANO»), src/17 esempio del campo Nome («Es. Giovanni Pisano»), commento in tests/visual/scene-178.mjs. PO sceglie «Gabriel Ferreyra», che risulta un calciatore reale (Franco Gabriel Ferreyra, Wikipedia) → PO: «Gabriel Ferreyro» (nessun calciatore trovato con questo nome, ricerca 22/11). Aggiungere «Giovanni Pisano» alla blocklist _CR_PLAYERS dell'audit copyright","difetto grave (nomi, copyright)","FATTO — 7.999.202 (22/11)","7.999.203","—","audit-copyright","richiesta PO 22/11"],["PO-618","22/11 09:00","PO (foto docs/collaudo-po/201-carriera-stagione-per-stagione.jpg, Carriera → «Stagione per stagione 16», telefono): «Non riesco a richiudere questo box» — difetto: il riquadro aperto non ha il comando per richiuderlo (nella testata manca la freccia delle altre fisarmoniche) e ha uno scorrimento interno; da allineare al comportamento delle fisarmoniche del tema (apri/chiudi dalla testata) e verificare che a telefono non resti intrappolato lo scorrimento della pagina","difetto (UI, Carriera)","FATTO — 7.999.207 (giro 341, rilascio automatico 24/11 04:56) (giro 341 lanciato il 23/11 09:03)","in coda","—","—","foto PO 22/11"],["PO-617","22/11 08:55","PO (foto docs/collaudo-po/201-club-contratto.jpg, scheda Club FC Merseyside, telefono): «Contratto nella schermata club non ha senso» — la riga «Contratto: scade a fine stagione 20 (3 stagioni) · Dettagli in Agente ›» va tolta dalla scheda Club: il contratto è dell'eroe e vive in Agente. Si fa insieme a PO-606 (riquadro «La stagione» nella stessa scheda)","UI (Club)","FATTO — 7.999.207 (giro 337, rilascio automatico 24/11 04:56) (giro 337 unito in lavoro/201 il 23/11 09:55, treno 45139940995)","in coda","—","—","foto PO 22/11"],["PO-616","22/11 08:50","PO (foto docs/collaudo-po/201-albo-tuoi-titoli.jpg, Stagione → «Albo d'oro — storico campioni», telefono): «Nell'albo storico campioni i miei titoli non c'entrano nulla» — il riquadro «I tuoi titoli» (campionati, coppe, coppe europee vinte dall'eroe) sta in cima all'albo dei campioni della lega; va tolto da lì e tenuto nel posto dei trofei personali (Carriera / bacheca), lasciando nell'albo solo la storia della competizione. PO 08:55 (foto docs/collaudo-po/201-albo-leghe-della-carriera.jpg: sotto compaiono le sezioni «Lega A 2 stag.», «Liga Oranje 4 stag.», cioè le leghe in cui ha giocato l'eroe, con le sue stagioni): «Anche sta roba deve sparire. Deve mostrare solo lo storico / almanacco della lega selezionata in quel momento» → l'albo mostra solo la lega selezionata nel selettore, con tutte le sue stagioni, senza sezioni per le leghe della carriera dell'eroe. Si fa insieme a PO-569 (stessa schermata)","UI (Albo d'oro)","FATTO — 7.999.207 (giro 340, rilascio automatico 24/11 04:56) (giro 340 lanciato il 23/11 09:03)","in coda","—","—","foto PO 22/11"],["PO-615","22/11 08:45","PO (foto docs/collaudo-po/201-home-box-sponsor.png, Home: «Patto col mister 0/2 assist» e «Offerta di sponsor · Nexon Worldwide» con «Firmo l'accordo / Non ora»): «questi box all'occorrenza si perdono nella home ed il player potrebbe non accorgersene». Le decisioni in sospeso (offerte, sponsor, scelte) devono farsi notare: da proporre come metterle in evidenza (in cima, nel contatore «Da decidere», o come finestra al momento giusto). Nota: tocca lo stesso tema di PO-224 (finestre al posto dei riquadri), chiusa il 21/11 su decisione del PO; questa è una richiesta nuova e più precisa","UI (Home, decisioni in sospeso)","FATTO — 7.999.207 (giro 335, rilascio automatico 24/11 04:56) (giro 335 unito in lavoro/201 il 23/11 09:55, treno 45139940995)","in coda","—","—","foto PO 22/11"],["PO-614","22/11 08:35","PO (foto docs/collaudo-po/201-formazioni-maglia-eroe.png, schermata Formazioni prima dell'ingresso): «l'eroe non deve avere una maglia diversa» — la maglietta dell'eroe (90 NUNEZ) è disegnata diversa dalle altre (senza le maniche del secondo colore); deve essere la stessa divisa dei compagni. PO 08:40: «ed il quadrato intorno è brutto, lo toglierei» → via anche il riquadro bianco: l'eroe resta riconoscibile solo dal nome in evidenza (giallo)","UI (formazioni)","FATTO — 7.999.207 (giro 339, rilascio automatico 24/11 04:56) (giro 339 lanciato il 23/11 09:03)","in coda","—","—","foto PO 22/11"],["PO-613","22/11 08:30","PO (foto docs/collaudo-po/201-evento-scarpini-veterano.jpg, telefono, FC Merseyside St. 17 Sett. 20): «Fuori luogo per l'età dell'eroe, ha oltre 30 anni!» — evento settimanale «Trovi gli scarpini appesi alla traversa. Il veterano fischietta innocente… domani tocca a te scegliere la vittima» (scherzo al giovane) a un eroe trentenne, che nello spogliatoio è lui il veterano. Da fare: censire gli eventi settimanali che presuppongono un'età o un'anzianità (giovane/nuovo arrivato/veterano) e legarli all'età e agli anni nel club dell'eroe; per i trentenni le varianti dal lato del veterano. Collegate: PO-436 (settimane da trentenne), PO-586 («da anni» al primo anno)","testo/eventi (età)","FATTO — 7.999.209 (giro 352, pubblicata a mano il 24/11)","7.999.209","—","—","foto PO 22/11"],["PO-611","22/11 00:30","PO (foto docs/collaudo-po/200-punizione-in-area.webp, 7.999.200, FC Augusta–FC Kraichgau 0-0, 9'): «punizione in area!» — highlight di punizione con il pallone dentro l'area avversaria (oltre la linea dei 16 m), senza barriera: nel calcio un fallo da punizione diretta in area è un rigore (in area esiste solo la punizione indiretta). Da misurare: in quali scene/posizioni il punto di battuta della punizione cade in area (piazzati, src/12 e motore dei piazzati del giro 204) e correggere: punizione sempre fuori area con barriera, oppure rigore se il fallo è in area","difetto (partita, piazzati, regole)","FATTO — 7.999.207 (giro 343, rilascio automatico 24/11 04:56) (giro 343 lanciato il 23/11 10:32)","in coda","—","piazzato-204","foto PO 22/11"],["PO-610","22/11 00:20","Madre (regola PO sugli instabili): movimento-147 rosso nel treno della 199 (taratura 44882036931), verde nel treno della 200 (44926206097), rosso nel treno della 201 (44947424529): instabile visto due volte → si ripara","controlli (instabile)","FATTO — 7.999.207 (giro 334, rilascio automatico 24/11 04:56) (giro 334 lanciato il 23/11 07:45) — PO 23/11: «Ellisse d'attesa»: il movimento d'attesa dei compagni diventa un piccolo giro (mai velocità zero), soglie invariate, giro dedicato + collaudo PO sul telefono; strumento di movimento-147 già riparato dal giro 331 (nella 207)","in coda","—","movimento-147","treni 21/11"],["PO-609","22/11 00:10","PO (foto docs/collaudo-po/200-classifica-fine-partita.png, fine partita FC Augusta, giornata 5): «la classifica deve essere già aggiornata, non quella della settimana prima...» — oggi il riquadro Classifica dice «Prima dei risultati degli altri campi · questa partita: +1 punto» e mostra Augusta 17° a 0 pt; anche «I tuoi numeri di stagione» è «Prima di questa partita». Da mostrare la classifica e i numeri DOPO la giornata (partita appena giocata + altri campi della stessa giornata, coerente con quella che si vedrà in Home). Nota a margine dalla stessa foto: obiettivo «Finisci nei primi 6» per un club al 17° con 0 pt (vedi PO-606, ambizione)","UI/carriera (fine partita, classifica)","FATTO — 7.999.207 (giro 336, rilascio automatico 24/11 04:56) (giro 336 unito in lavoro/201 il 23/11 09:55, treno 45139940995)","in coda","—","—","foto PO 22/11"],["PO-608","22/11 00:05","PO (foto docs/collaudo-po/200-prepartita-tasti.png, pre-partita FC Berlin–FC Augusta, 7.999.200): «non si capisce che per giocare ‹normalmente› bisogna premere su vedi formazioni!» — tasti oggi: «VEDI LE FORMAZIONI» (verde, primario), «Analisi dell'avversario», «Salta e gioca», riquadro «Gioca solo i momenti salienti», «Torna alla home». Da rendere chiaro che le due strade sono «Gioca la partita» (intera) e «Gioca solo i momenti salienti», con formazioni/analisi come passi o voci secondarie; chiarire anche «Salta e gioca». Si lega a PO-605 (avviso dei salienti) e PO-454 (meno finestre prima del calcio d'inizio)","UI (pre-partita)","FATTO — 7.999.207 (giro 336, rilascio automatico 24/11 04:56) (giro 336 unito in lavoro/201 il 23/11 09:55, treno 45139940995)","in coda","—","—","foto PO 22/11"],["PO-607","22/11 00:00","PO (foto docs/collaudo-po/200-offerta-hannover.png, 7.999.200, FC Augusta St. 2 Sett. 5): «queste offerte sono ridicole» — offerta ufficiale di FC Hannover (Deutsche Liga 2, prestigio 50 contro 66, 12° su 18) come prestito con diritto di riscatto: durata 1 st. contro 4, ruolo Riserva contro «In rotazione», minutaggio 40%, ma presentata col tono di un'offerta vantaggiosa (+16 morale, +8% crescita). Da misurare: quanto spesso arrivano offerte peggiorative (lega inferiore, prestigio più basso, ruolo peggiore) a un giocatore titolare/in rotazione in un club migliore; regole del mercato da rendere credibili (un club più debole non offre prestito-riserva; le offerte devono essere un passo avanti o laterale per qualcosa: minuti, stipendio, ambizione)","bilanciamento (mercato, offerte)","FATTO — 7.999.209 (giro 351, pubblicata a mano il 24/11)","7.999.209","—","—","foto PO 22/11"],["PO-606","21/11 23:45","PO (foto docs/collaudo-po/200-club-obiettivi.png, scheda Club FC Augusta, St. 2): «gli obiettivi della stagione e l'ambizione non è chiara!» — la testata dice solo «Progetto solido» (andamento del club). Questionario: riquadro «La stagione» in cima sotto la testata: ambizione del club, obiettivo di classifica, posizione attuale rispetto all'obiettivo (verde/rosso), obiettivi personali con avanzamento; ambizione con la STESSA regola della riga della Home (giro 298, obiettivo per prestigio/storia), una fonte sola per Home, Club e presidente","UI (Club, obiettivi)","FATTO — 7.999.207 (giro 337, rilascio automatico 24/11 04:56) (giro 337 unito in lavoro/201 il 23/11 09:55, treno 45139940995) — giro 319 fermato su regola PO 21/11: richieste in coda per ordine di arrivo; ramo sviluppo/giro319-club-obiettivi conservato","in coda","—","—","foto PO 21/11"],["PO-605","21/11 23:35","PO (due foto in chat): testi che non convincono. (1) tasto finale della serata di presentazione «🎉 Che la stagione cominci →» (src/18 ~6637) → PO: «Si comincia!»; (2) riga AvvisoSalienti290 «Nella pre-partita puoi giocare solo i momenti salienti» (src/11 ~124, letta come un limite) → PO: «Vuoi giocare solo i momenti salienti? Lo scegli nel pre-partita»","testi (UI)","FATTO — 7.999.202 (22/11)","7.999.203","—","avviso-290","richiesta PO 21/11"],["PO-604","21/11 22:35","PO: «sarebbe meglio fare trenini e quindi far scattare solo i controlli strettamente necessari e velocemente». Questionario: «Trenino + treno grande di notte» — a ogni unione in lavoro/** solo i guardiani delle righe della mappa unica toccate dal vagone + le 17 sentinelle n i gialli dell'eroe ridotti `sim-motore` è rosso di un soffio (2,29 contro soglia 2,3, dichiarato fino alla taratura). Vagone successivo: portare i gol del motore verso 2,6-2,9 a partita senza alterare forza relativa, strisce (giro 309) e determinismo; misura prima/dopo con sim-motore, partita-vera, match-sequence","bilanciamento (motore, gol)","FATTO — 7.999.208 (giro 347, pubblicata a mano il 24/11) — nella 202","7.999.208","—","sim-motore","questionario PO 21/11"],["PO-597","21/11 10:05","Dal salvataggio del PO (S1 FC Augusta, esportato 21/11, analizzato dalla madre in locale, non nel repo): le settimane 1–18 del calendario, giocate dal club mentre l'eroe era in Primavera e marcate «simulated», sono A STAMPO: `legaDopoTrasferimento212` (src/09 ~1900-1925) al trasferimento riempie le giornate passate con soli tre punteggi fissi (2-0, 1-1, 0-1) scelti da `hashStr(seed+\"_\"+matchday)`, che su stringhe vicine dà sequenze correlate: nel salvataggio 7 × «1-1» di fila e poi solo vittorie 2-0 (casa) / 0-2 (trasferta). Le stesse giornate alimentano la classifica (updateStandings col risultato a stampo). Correzione: risultati veri delle giornate passate col motore della simulazione (simulateMatch/simulaPartitaMotore con seme per giornata, come le altre partite), coerenti con la classifica e l'anteprima dell'offerta (PO-212). PO: «il gioco deve assolutamente realistico e bilanciato!». Le 8 sconfitte di fila (sett. 30–38) sono invece partite GIOCATE coi momenti salienti, eroe titolare 90', morale 100, fiducia 99, avversari anche ultimi in classifica (FC Berlin Köpenick, 18 punti): li misura il giro 309","difetto (carriera, risultati a stampo)","FATTO — 7.999.200 (21/11; prima: DA FARE nella 201)","7.999.201","—","—","salvataggio PO 21/11"],["PO-596","21/11 08:50","PO (foto docs/collaudo-po/199-calendario-striscia.png e -intera.png, 7.999.199, FC Augusta Deutsche Liga St.1, Calendario sett. 1–38, 7° posto): «striscia perdente un pò esagerata, puoi verificare il bilanciamento» — settimane 30–37: 7 sconfitte di fila (1-5, 0-2, 1-3, 1-2, 1-3, 0-2, 1-4) dopo un girone d'andata da 5ª. 21/11 08:55 PO (foto docs/collaudo-po/199-calendario-otto-sconfitte.png): «otto di fila» — anche la 38ª persa 0-3 col FC Friburgo: 8 sconfitte consecutive (sett. 30–38) a fine stagione. Visti anche nella stessa foto (non segnalati dal PO): settimane 1–7 tutte «N 1-1» (7 pareggi 1-1 di fila); risultati ripetuti identici «V 2-0» in casa e «V 0-2» in trasferta (sett. 8, 11, 13, 15, 17 e 12, 14, 16, 18). Sospetto di risultati simulati a stampo (punteggi fissi) oltre che di bilanciamento. Da misurare: quali partite erano giocate e quali simulate, distribuzione dei punteggi, lunghezza delle strisce in carriere simulate contro attese (legame con PO-560 simulate severe e PO-583/584)","bilanciamento (risultati, simulazione)","FATTO — 7.999.200 (21/11; prima: DA FARE nella 201)","7.999.201","—","—","chat PO 21/11"],["PO-595","21/11 08:45","PO (foto docs/collaudo-po/199-formazioni-titolo-centrale.png, 7.999.199, schermata Formazioni FC Weser–FC Augusta, giornata 33 di 34, con il nuovo «← Indietro» del giro 294 a sinistra): «la scritta formazioni + lega deve essere centrale» — oggi «FORMAZIONI · DEUTSCHE LIGA» sta a sinistra dopo il tasto Indietro; va centrata nella testata (Indietro a sinistra, giornata a destra o sotto), telefono e PC","UI (formazioni)","FATTO — 7.999.207 (giro 339, rilascio automatico 24/11 04:56) (giro 339 lanciato il 23/11 09:03) — nella 202","in coda","—","ingresso-294","chat PO 21/11"],["PO-592","20/11 21:15","PO: «GitHub actions testalo comunque, magari può aiutarci se è gratuito» — prova di eseguire i guardiani della mappa su GitHub Actions in parti parallele (matrice), senza consumare il limite Claude. Verificato: il repo è pubblico; per la documentazione GitHub i runner standard sono gratuiti nei repo pubblici (i «larger runners» no). Da provare: Chromium headless con GLB e WebGL software sui runner ubuntu, durata dei controlli lunghi, numero di job in parallelo, risultati leggibili dalla madre (artifact o rapporto nel ramo). Nessun segreto, nessuna chiave; non toccare i workflow di deploy e di build Android. Primo giro della 199 insieme a PO-517/527/528","processo (verifica)","FATTO — 7.999.200 (21/11; prima: DA FARE nella 201)","7.999.201","—","—","chat PO 20/11"],["PO-590","20/11 17:50","Dubbio 1 del giro 299: quando il gioco non sa chi è il capitano di un club, la «C» andava al titolare con l'attitudine più alta ricavata dal nome. PO: «Il più anziano» → C al titolare più anziano, VC al secondo (resta prima lo spogliatoio/l'eroe). Giro di ritocchi 302, sopra il 299; coprire il ramo nel guardiano rosa-angoli-299 con un salvataggio senza «capitano» nello spogliatoio (dubbio 2)","UI (Rosa)","FATTO — 7.999.199 (198 normale, 21/11; prima: DA FARE nella 198)","7.999.199","—","rosa-angoli-299","questionario PO 20/11"],["PO-589","20/11 17:50","PO: «La fascia superiore di caricamento scarico i giocatori 3d deve essere più carina, principalmente nel colore» (striscia «Scarico i giocatori 3D · NN%», src/11 _pillola233 ~2163: fondo rgba(5,8,20,.94), barra ambra 38%, testo 11 px). Questionario: «Colori del tema» (fondo superficie scura del tema, barra con sfumatura nel colore d'accento dei tasti principali, testo chiaro un po' più grande); «Nella 198», nel giro di ritocchi 302","UI (caricamento 3D)","FATTO — 7.999.199 (198 normale, 21/11; prima: DA FARE nella 198)","7.999.199","—","—","questionario PO 20/11"],["PO-588","20/11 15:00","Stessa nota KE di PO-587 (W.33 4' vs FC Berlin Köpenick): bozza automatica «l'esito dichiarato è miss ma la palla è finita IN RETE» (corpo↔porta 28°, eroe x 33,8 z −8,5, pallone a 0,7 u, porta a 14,8 u) — esito mostrato in 3D diverso da quello del gioco: grave (gol visto e non contato)","difetto (esito 3D)","FATTO — 7.999.199 (198 normale, 21/11; prima: DA FARE nella 198 (PO 20/11: «Solo PO-588 nella 198»))","7.999.199","—","—","nota KE PO 20/11"],["PO-587","20/11 15:00","PO: «In alcuni tiri i difensori scivolano ed intervengono prima dell'effettivo tiro, non è sincronizzato»; nota KE 7.999.198 S.1 W.33 4' hl vs FC Berlin Köpenick (0-0), SIT shot «Palla buona al limite dell'area!», azione «Piazzato nell'angolo basso»: «il difensore scivola prima dell'effettiva giocata» — scivolata/intervento del difensore da agganciare al momento del tiro","difetto (highlight 3D, sincronia)","FATTO — 7.999.207 (giro 343, rilascio automatico 24/11 04:56) (giro 343 lanciato il 23/11 10:32) — nella 202","in coda","—","—","nota KE PO 20/11"],["PO-586","20/11 15:00","PO (foto docs/collaudo-po/198-storia-equilibrio-anni.png, «La tua storia» · «Quello che conta è oggi»: «In carriera siete lì, testa a testa (8 a 11): un equilibrio che dura da anni»): «un equilibrio che dura da anni è fuori luogo, primo anno tra i professionisti» — il testo della rivalità deve dipendere dagli anni veri di carriera (stagione 1 = niente «da anni»)","testo (storie)","FATTO — 7.999.211 + 7.999.213 (giro 355: niente «da anni» alle prime stagioni; giro 362, 7.999.213: il numero vero di stagioni in ogni frase della rivalità, decisione PO «Sempre il numero»; «ormai»/«col tempo» → PO-657)","7.999.213","—","—","chat PO 20/11"],["PO-584","20/11 14:15","PO: «Gli infortuni e squalifiche sono nel gioco? Non ne vedo quasi mai» → «Simula anche questo e trai le tue considerazioni». Oggi (lettura codice): infortuni solo dell'eroe e solo con fatica di partita >68 (3%) o >82 (7%), −8% per livello del preparatore (src/18 simInjuryRoll ~2167); squalifiche solo da cartellini veri della partita giocata (src/15 ~2045), somma di gialli non trovata. Misura nella stessa simulazione di PO-583: infortuni e squalifiche per stagione (eroe e compagni), con gestione della fatica prudente e trascurata, partite giocate e simulate; poi considerazioni e proposta di taratura al PO (rischio anche sotto 68, squalifica per somma di gialli, infortuni dei compagni che cambiano la formazione). Nessuna modifica senza via del PO","bilanciamento (carriera, misura)","FATTO — 7.999.200 (21/11; prima: DA FARE nella 201)","7.999.201","—","—","chat PO 20/11"],["PO-583","20/11 14:00","PO: «La crescita del prestigio e forza del club è prevista? Se volessi diventare una bandiera di una squadra di serie B e scalare anche nelle coppe europee è fattibile?» → «Si simuliamo». Giro di misura: 10–15 stagioni simulate (più semi) partendo da club di seconda divisione con l'eroe che non cambia mai squadra; misurare anni per la promozione, per la prima qualificazione europea, per il primo trofeo; prestigio per stagione (clubPrestigeShifts, cap con albo d'oro, src/18 ~5700-5760); se i valori della rosa salgono col prestigio o resta solo la forza di calcolo; quanto pesa il rendimento dell'eroe (legame con PO-560). Solo misura e rapporto con proposta al PO; nessuna modifica","bilanciamento (carriera, misura)","FATTO — 7.999.200 (21/11; prima: DA FARE nella 201)","7.999.201","—","—","chat PO 20/11"],["PO-572","20/11 11:10","PO (foto in chat: Impostazioni, riga «Tempo della partita simulata — Gioca 5 partite col motore, senza grafica, e mostra il tempo mediano. Limite: 300 ms» col tasto «Misura», visibile con «Strumenti di collaudo» accesi; src/18 ~6845, aggiunta nella 7.999.4 passo 2): «si può eliminare?» → togliere la riga (strumento di misura per il telefono del PO, non più usato). Verificare che nessun guardiano la usi. Blocco «Pulizia Home e schermate»","UI (Impostazioni, rimozione)","FATTO — 7.999.199 (198 normale, 21/11; prima: DA FARE nella 198)","7.999.199","—","—","chat PO 20/11"],["PO-571","19/11 21:10","PO (foto docs/collaudo-po/198-home-dalla-vetta.png, Home: FC Augusta, Deutsche Liga, St. 1, Sett. 28/38, 5° posto, «−9 DALLA VETTA»): «non deve comparire solo i punti dalla vetta, in base al prestigio ed obiettivi della squadra il messaggio deve cambiare» — la riga deve dipendere dall'obiettivo stagionale del club (titolo, Europa, metà classifica, salvezza): es. punti dalla zona Europa, margine sulla retroce 986.0, 7.995.0","—","«i microfoni e la scena è davvero terribile… Devono comparire in maniera congruente anche le figurine»"],["PO-007","24/09 05:43","Premi della stagione e chiusura: uniformare e abbellire","miglioramento","FATTO","—","7.983.0 (podio, card «La tua stagione»)","—","«va standardizzata e uniformata la schermata, rendila più bella»"],["PO-006","24/09 05:42","Il contorno delle figurine non deve tagliare il volto (agente, classifiche, podio, primo incontro)","difetto","FATTO","—","7.996.0","sonda figurina-volto24","«occhio alla figurina tagliata dell'agente»; «il contorno taglia troppo il volto» (6 commenti, 15:20–15:26)"],["PO-005","24/09 05:42","Offerta: mostrare la situazione del club offerente prima di accettare","miglioramento","FATTO","—","7.981.0, 7.986.0 (ultime 5, ruolo, allenatore)","—","«fai in modo che il player possa vedere il club offerente in che posizione sta»"],["PO-004","24/09 05:40","Toast più curati e freno all'avanzamento compulsivo","miglioramento","FATTO","—","7.981.0","(flag rosso: «settimana saltata»)","«i toast devono essere più carini, e bisogna evitare che il player vada avanti nel gioco in maniera compulsiva»"],["PO-003","24/09 05:38","Uniformare le schermate «Primo incontro», «Ambizione» e «Chiusura»","miglioramento","FATTO","—","7.983.0, 7.993.0 (pop-up nel Modal standard)","—","«schermata da uniformare e standardizzare» (3 commenti)"],["PO-002","24/09 05:37","Premiazione di squadra: palco centrale col nome della competizione, il capitano alza la coppa e la passa all'eroe","nuova funzione","CHIUSO — dal PO il 20/10 (questionario «Chiudi tutte, si riaprono se emergono»); prima: DA VERIFICARE DAL PO — 7.999.173 su main (19/10): giro 64 (fondale del palco) · PARZIALE — PO 01/10: resta in L8","L8","7.981.0 (11 attori), 7.997.0 (palco)","—","«la premiazione deve essere di squadra con palco in mezzo… Il capitano deve alzare la coppa ed eventualmente la passa anche all'eroe». Il passaggio della coppa non è confermato: questionario 24/09 09:28 «Non ancora, la provo»"],["PO-001","24/09 05:34","Galà: via gli spettatori 3D, presentatori con figurine","miglioramento","FATTO","—","7.981.0","—","commento anteprima: «togli gli spettatori 3D, migliora le scena e metti eventualmente le figurine con presentatore e presentatrice»"]],"ordine":[],"menu":["Tipo"],"larga":["Titolo","Fonte/citazione","Stato","Release"]},{"id":"lotti","nome":"Lotti","cols":["#","Lotto","Stato","Osservazioni del team"],"rows":[["L0","**Governo del progetto** (PO-032, PO-158…166, PO-170)","in corso","Documenti in bozza in `docs/governo/`; si chiude con le tue risposte al primo questionario."],["L1","**Fluidità e credibilità di partita e highlight, brain** (PO-021…PO-152, 31 voci aperte o parziali)","in corso","**Decisione PO 30/09: si chiude solo con tutte le 31 voci.** Dentro anche il collaudo Codex difesa 3D."],["L2","~~Braccia del mister nelle feste~~","**fatto** in 7.999.78","Già chiuso (sonda `mister-77`). Si toglie dall'ordine."],["L3","**Salvataggi persistenti (Parte B) + raccolta errori (Parte C)** (PO-167, PO-168)","pronto, **dopo L1** (decisione PO 30/09)","Resta aperto il rischio R-01/R-02 fino ad allora (salvataggio che fallisce senza avviso). Se capita una perdita di dati vera, diventa bloccante e parte subito."],["L4","**Pulizia del progetto** (PO-072, PO-171, PO-173 + DT-01…09)","**quota 20% in ogni lotto** (decisione PO 30/09)","Non è più un lotto a sé: una voce DT per lotto, cominciando da DT-01 (commenti-changelog)."],["L5","**Scene disegnabili + clip mancanti** (PO-086, PO-087, PO-070, PO-061)","da preparare","Stesso lavoro visto da due lati; dipende dal censimento delle scene (185/532)."],["L6","**Sistemi di carriera** (impulsi, nazionale, difficoltà unica, economia) + **archetipi** (PO-098, PO-112, PO-125, PO-153…157)","fase 1 affidabile a Codex","La fase 1 (misura) è di Codex e può partire **subito in parallelo**, perché non tocca il codice: scheda `reports/codex/PROMPT-2026-09-30-collaudo-carriere.md`."],["L7","**Schermate e testi** (+ collaudo carriere Codex) (PO-011, 016, 036, 045, 066, 169)","da preparare","La Parte A «analisi critica schermate» è già una voce aperta."],["L8","**Cerimonie e stadi** (PO-002, PO-071, PO-137, PO-150)","sospeso fino a L8 (decisione PO 30/09)","Il lavoro «cerimonie diverse per competizione» è su `wip/cerimonie-differenziate` con guardiano verde e rosso; mancano le foto con i corpi GLB."]],"ordine":[],"menu":["Lotto","Stato"],"larga":["Osservazioni del team","Lotto"]},{"id":"registro","nome":"Registro release","cols":["Data","Versione","Passo","Esito"],"rows":[["25/11","7.999.215","**7.999.215 — ✅ pubblicata dal rilascio automatico il 25/11 verso le 20:45 Roma.** Un vagone: i giocatori non volano più sul campo — i difensori nella posa di guardia stavano 0,27 u sopra il prato, ora a terra (corpi in aria 11,3% → 5,0%; 366, PO-649; guardiano volano-366 verde+rosso, foto docs/collaudo-po/366-*.png). Restano in coda le scivolate a mezz'aria (PO-663), lo stacco di testa del compagno (PO-664) e la misura del pattinamento (PO-665). Treno 45672152539 verde.","lavoro/201 4a4bcdb0, tag v7.999.215"],["25/11","7.999.214","**7.999.214 — ✅ pubblicata dal rilascio automatico il 25/11 verso le 19:15 Roma (deploy rallentato dal disservizio GitHub).** Un vagone, solo pacchetto Google Play: la TWA porta il numero d'app 1.0 e il workflow «Android AAB (TWA)» timbra solo il versionCode (365, PO-322, decisione PO «Numero da app, 1.0»; store-236 S8 verde 15/15, rosso 15/15). Il gioco non cambia. Treno 45644209518 a mappa intera (31 parti) verde.","lavoro/201 d98d8bb6, tag v7.999.214"],["25/11","7.999.213","**7.999.213 — ✅ pubblicata dal rilascio automatico il 25/11 verso le 16:30 Roma.** Un vagone: la storia col rivale dice il numero vero di stagioni — «da N stagioni», «Rivali da N stagioni», «N stagioni di sfide», nessuna frase sugli anni in 1ª stagione (362, PO-586, decisione PO «Sempre il numero»; guardiano storia-362 verde 297 numeri, rosso 166 formule vaghe). Treno 45630445862 (trenino, 8 parti) verde.","lavoro/201 c9b63364, tag v7.999.213"],["25/11","7.999.212","**7.999.212 — ✅ pubblicata dal rilascio automatico il 25/11 verso le 14:56 Roma.** Due vagoni senza incroci: lo staff personale costa davvero — ingaggio fisso, preparatore di livello 3 a 2 milioni (356+361, PO-557) · il treno grande notturno ha una seconda rete, la sveglia sulle fini dei treni e la pagina «in ritardo» dopo le 3:43 Roma (359, PO-630, da confermare la prima notte). Treno 45601452940 tutto verde (31 parti).","lavoro/201 2eaee607, main 56dd32c0, tag v7.999.212"],["25/11","7.999.211","**7.999.211 — ✅ pubblicata a mano il 25/11 verso le 12:15 Roma (decisione PO 10:20 «a mano»).** «La tua storia» senza «da anni» alle prime stagioni (355, PO-586) · macchina del treno più robusta: highlight-95 in due pezzi, scadenza del job contata dall'inizio, arresto robusto, riepilogo progressivo (358) · gli script di sola prova non salgono mai sul treno (360) · highlight-95 provoca le finte invece di sperarle, pavimento invariato (363). Treni: 45509361966 annullato (timeout di highlight-95), 45550618332 fermo (finto-358, 16 non giudicati), 45571168039 fermo su highlight-95 braccio verde (138/139 a posto) → giro 363 verde e rosso sul banco. Tag non spinto (proxy 403).","lavoro/201 9e4a4bae, main 45fa4b67"],["25/11","7.999.210","**7.999.210 — ✅ pubblicata dal rilascio automatico il 25/11 verso le 00:20 Roma.** Due vagoni senza incroci: sigle di fantasia delle coppe europee in ogni schermata, «Momenti indimenticabili» compresa (357, PO-654, bug grave copyright) · l'evento della settimana e le altre finestre di racconto aspettano il rinnovo del contratto invece di coprire «Vai al rinnovo →» (354, PO-522). Treno 45479038823 a mappa intera su def67606: 31/31 parti, 377 guardiani, 345 verdi, nessun rosso nuovo; deploy 45506275940, sito verificato dalla madre.","main 67a2b1cc"],["24/11","7.999.209","**7.999.209 — ✅ pubblicata a mano il 24/11 verso le 20:00 Roma (decisione PO 17:50 «A mano, come la 208»).** Due vagoni senza incroci: offerte di mercato credibili — un club più debole offre solo il definitivo da titolare con stipendio +15-35%, morale e crescita dai guadagni veri (351, PO-607) · eventi settimanali e impulsi legati all'età e agli anni nel club, fuori età 152 → 0, varianti del veterano per i trentenni (352, PO-613); più il giro 353 di riparazione: impulsi-memoria-154 allineato alla decisione sulle età, render-3d-023 e guardalinee-222 instabili del runner, nessun difetto del gioco. Treno 45406157539 a mappa intera su 09e6de36: 30/30 parti, 375 guardiani; catena del giro 353 21/21 verdi. Tag non spinto (proxy 403).","lavoro/201 642eba32, main 2f17297d"],["24/11","7.999.208","**7.999.208 — ✅ pubblicata a mano il 24/11 verso le 12:55 Roma (decisione PO 11:30 «Pubblico a mano»).** Tre vagoni: l'eroe si allarga davvero sulle richieste di fascia, circa il 9% delle occasioni (345, PO-376) · i passi col pad pesano sulla riuscita della giocata, «moderato», e dopo il palo il pallone cade davanti alla porta a un avversario (346, PO-561/585) · la simulazione rapida passa da 2,33 a 2,80 gol a partita (347, PO-599); più il giro 350 di riparazione: tiro-346 e solo-highlight-166 erano difetti di strumento (identità fra due pagine, tetto d'attesa 420 s), nessuna regressione. Treno 45339800115 a mappa intera su 07e15e4c: 30/30 parti, 373 guardiani, fermo solo per quei due; catena del giro 350 22/22 verdi. Tag v7.999.208 non spinto (proxy 403): il trenino conta dal v7.999.207.","lavoro/201 04d2b4be, main dee9b861"],["24/11","7.999.207","**7.999.207 — ✅ pubblicata il 24/11 alle 04:56 Roma, PRIMO RILASCIO AUTOMATICO DEL TRENO (giro 312, PO-600) e primo senza poc.** Tredici vagoni: instabili 3D (331, PO-620) · treno notturno con custode di riserva ed esito su main (333, PO-630/631) · ellisse d'attesa dei compagni (334, PO-610) · home con i due tasti distinti e box in evidenza (335, PO-615/623) · pre-partita chiaro e classifica già aggiornata a fine partita (336, PO-608/609) · obiettivi e ambizione del club, contratto fuori dalla scheda Club (337, PO-606/617) · governo, interruttore e blocco del rilascio letti da main (338, PO-603) · formazioni col titolo centrale e maglia dell'eroe uguale alle altre (339, PO-595/614) · albo e marcatori per campionato, classifica marcatori della stagione, «I tuoi titoli» fuori dall'albo (340, PO-569/570/616) · fisarmonica richiudibile e «punto di forza» al posto di «consigliato» (341, PO-618/622) · colpi di testa su cross sincronizzati (342, PO-629) · difensori che non intervengono prima del tiro e niente punizioni in area (343, PO-587/611); più tre giri di riparazione dei rossi del treno (344, 348, 349: un difetto vero del 342 corretto, guardiani aggiornati ai cambi voluti dal PO, instabili del runner dichiarati). Quattro corse del treno prima di quella buona; corsa 45303186123 a mappa intera su 0cbe6904: 30/30 parti, 370 guardiani, 337 verdi, nessun rosso nuovo né non giudicato, 2 h 41. Il rilascio ha fatto da sé versione, unione, tag v7.999.207, deploy (45322696535) e controllo del sito (verde; ricontrollato dalla madre).","lavoro/201 31d1bb08, main 209b74ea, tag v7.999.207"],["23/11","7.999.206","**7.999.206 — ✅ pubblicata a mano il 23/11 verso le 07:00 Roma.** Treno più robusto: se GitHub perde i risultati di una parte, il riepilogo li ricostruisce dal log e lo dichiara; il treno notturno si rimette in coda da solo; il treno completo scatta solo se il trenino è più lento del 10%; i 4 guardiani «carriera» di nuovo di giorno (giro 330, PO-624, PO-626). Quattro guardiani instabili resi stabili 5/5 (scelte-201, nomi-182, diagonali-210, rigori-296 C) e due difetti veri del gioco corretti (giro 332, PO-620). Treno a mappa intera 45103228762: 29/29 parti, 358 guardiani, 2 h 26; rilascio automatico fermo per tocco-213 e apertura-261, rossi solo sul runner e verdi sul banco sulla punta e sulla 205 → dichiarati.","lavoro/201 a9987e60, poc/main 48055528"],["23/11","7.999.205","**7.999.205 — ✅ pubblicata a mano il 23/11 verso le 00:10 Roma.** Cronaca, badge e avviso del gol nominano lo stesso marcatore, quello del motore (giro 325, PO-377; guardiano marcatore-325). Curva del salto a gennaio più morbida (metà a 69) e Validate Situations solo a mano (giro 327). Trenini fino a 15 macchine e una sola concorrenza per le corse del treno (giro 329, PO-621). Treno a mappa intera 45066026690: 29/29 parti, 357 guardiani, 2 h 22; rilascio automatico fermo per un rosso nuovo, nomi-182, rosso solo sul runner e verde sul banco 28/28 sulla punta e sulla 203 → dichiarato. Tag v7.999.205 non spinto (proxy della sessione madre).","lavoro/201 55a500d5, poc/main 48fb4da4"],["22/11","7.999.204","**7.999.204 — ✅ pubblicata a mano il 22/11 verso le 21:20 Roma.** In Primavera il mercato di gennaio non è più un tiro di dado: alla settimana 19 l'Indice Primavera decide se arriva la promozione in prima squadra o l'offerta di un club senior (giro 323, PO-356 B; guardiano salto-323). Il deploy del sito non aspetta più dietro a un treno e i soli documenti non fanno deploy (giro 326, PO-624; guardiano deploy-326). Treno completo 45050383306: 8 parti, 136 guardiani, 2 h 12 dal primo inizio all'ultima fine; rilascio automatico fermo perché la parte 03 non ha caricato i risultati (timeout di GitHub), ma il suo log è tutto verde (21/21); rossi nuovi pelle-240 e scelte-201 instabili, verificati sul banco e dichiarati. Tag v7.999.204 non spinto (proxy della sessione madre).","lavoro/201 f6ec052c, poc/main f98c3416"],["22/11","7.999.203","**7.999.203 — ✅ pubblicata il 22/11 alle 16:36 Roma, PRIMO RILASCIO AUTOMATICO (PO-600/604).** Il recupero delle giornate (103) non riconta più una giornata già in classifica al caricamento di un salvataggio (giro 321, PO-349; guardiano salvataggio-321). Trenino 45033490326: 35 guardiani in 3 parti, 1 h 04 dall'unione al rilascio, deploy avviato dal bot e sito verificato (tag v7.999.203, ULTIMO-RILASCIO.json).","lavoro/201 c0dd9cf9, poc/main 22bfd34a"],["22/11","7.999.202","**7.999.202 — ✅ pubblicata il 22/11 verso le 15:15 Roma, a mano (PO: «Pubblico ora a mano»).** Musica della serata di presentazione «The Storm Chasers» (giro 316, PO-602); testi «Si comincia!» e avviso dei salienti (giro 318, PO-605); eroe dell'intro «Gabriel Ferreyro» al posto di un nome reale (giro 320, PO-619, bug grave); trenini a ogni unione, treno grande notturno e blocco dei rilasci (giro 317, PO-604). Treni completi 44992349900 e 45010544455: rilascio automatico fermo due volte per rossi nuovi, tutti chiariti sul banco (verifiche 202 e 202 bis): nessuna regressione; sonde instabili corrette (svincolato-264, squalifica-222, attesa-difesa); dichiarati diagonali-210, rigori-296, walkout-fermi-197 (PO-620); highlight-95 a 6.016 s in DURATE-GUARDIANI.","lavoro/201, poc/main 564dd024"],["22/11","7.999.201","**7.999.201 — ✅ pubblicata il 22/11 verso le 01:30 Roma, a mano (PO: «201 = solo tifosi»).** Serata di presentazione con soli tifosi di casa (giro 314, PO-601: ospiti 1.504 → 0, serata-314 + sentinelle 20/20); rilascio automatico dei vagoni nel treno (giro 312, PO-600, nessun effetto nel gioco). Treno completo 44947424529 sul commit 86a7d74d: 317 verdi su 350, 27 rossi «nuovi» → 24 già rossi nel treno della 200, movimento-147 instabile (PO-610), buildup-sync rosso sul banco anche sulla 200, momento-173 rosso solo sul runner (verifica 201: nessuna regressione). Rossi dichiarati «da verificare lunedì» (37 banco, 6 solo runner).","lavoro/201 2d8f2d5d, poc/main a9f4fae5"],["21/11","7.999.200","**7.999.200 — ✅ pubblicata il 21/11 verso le 17:15 Roma (PO: «Subito», senza attendere il treno in corso).** Vagone 1: metodo di rilascio «Treno» su GitHub Actions, mappa intera dei guardiani a ogni unione (giro 308, PO-592). Vagone 2, bilanciamento (giri 309 misura, 310, 311; PO-596/597/560/583/584): simulate col motore al posto dello stampo, forza del club unica col prestigio cresciuto anche dal vivo, niente deriva negativa per 2 stagioni de nomi-219 90%/37%, difesa-220). Aperto: gk-miss-229 rosso 2/2 in catena su gi6 palo (gk_block dal lato opposto) sotto carico → correzione PO-229 da fare.** Contiene la 7.999.162 + PO-226 primo passo: le interazioni in partita nascono dai fatti del motore, al massimo 3 scelte a partita, la scelta arriva al motore (interazioni-226, rosso __CPM_NO_INT226). Decisione PO 13/10 «integrala la PO-226».",""],["13/10","7.999.162","**7.999.162 — verificata (catena mirata 41/42 + tempo-138 riparato, verde 2/2) ma NON pubblicata da sola: decisione PO 13/10 15:20, il rilascio delle 16 slitta a ~18:30 con la 7.999.163 (162 + PO-226), riga sotto.** Unico rosso della catena: tempo-138, braccio ROSSO («il difetto non si vede», pagato 198 = aperto 198). Causa misurata: SEME-a C3 paga il debito del minuto prima di ogni battito e copre da sola il difetto di PO-138, quindi spegnere solo __CPM_NO_TEMPO138 non lo fa più ricomparire. Riparazione del guardiano (il gioco non cambia): il rosso spegne anche __CPM_NO_SEME → verde residuo 0 (308/308) due volte; rosso residuo 2 e 14 (256 e 246 pagati su 264). (1) Bloccante a: seme della partita (seme-a, rosso __CPM_NO_SEME). (2) PO-232: highlights partono solo con i GLB caricati (glb-pronti-232, rosso __CPM_NO_GLB232). (3) PO-230: finestre in primo piano = Modal del gioco (finestra-230, popup-224, rosso __CPM_NO_MOD230). (4) Bloccante c / CL194: l'avversario della partita dal vivo passa per id alla classifica (classifica-194, rosso __CPM_NO_CL194; solo partite future). (5) PO-229: portiere sui tiri sbagliati v2 (gk-miss-229, rosso __CPM_NO_GK229M).",""],["12/10","7.999.161","**7.999.161 — ✅ rilasciata il 13/10 alle 02:59 (Roma); catene in serie, da sole: carriera 33/33, completa 23/23 (tempo-138 e nomi-219 instabili, verdi alla prova 2 e 3). Il rilascio delle 16:00 era saltato per una catena rossa dovuta al carico.** Catena carriera 32/33 (rimbalzo-189 rosso sotto carico, verde da solo: 24 disegni, margine fermo a 74 px); completa: validate-situations rosso su `motion` (giocatori fermi lontano dal pallone: 161 rosso 3 prove su 3, 160 verde nelle stesse condizioni a 4,6-4,7 fps) → misura dell'agente (sonda-motion-161, bracci alternati): NON è il gioco ma il carico — sotto lo stesso carico anche la 160 è rossa (5 verdi su 7 contro 5 su 8 della 161), a pagina fresca entrambe verdi 3/3; il mio confronto «160 verde, 161 rossa» era una prova sola per braccio. Corretto lo strumento (pavimento di 0,4 s di tempo di scena in sampleMotion, soglie invariate): validate-situations verde 14/14 su e442a7ca. Entra anche PO-229 build-up (e442a7ca, buildup-sync 36/36). tabellino-228: criterio del caso ricreato corretto (ceb4dcb6). (1) PO-229: consegna build-up→conclusione anche dal dribbling (rosso __CPM_NO_DRB229) e uno-due gi38 (rosso __CPM_NO_PO229). (2) PO-224: le finestre aspettano anche l'intervista settimanale. (3) Copyright: 17 nomi di stadio evocativi rinominati (decisione PO). (4) PO-230: cornice standard unica per le finestre in primo piano (finestra-230, rosso __CPM_NO_FIN230). (5) PO-231: intervista post partita sempre (decisione PO; intervista-231, rosso __CPM_NO_IV231). (6) PO-228 k4: un gol del motore dopo il fischio non entra nel tabellino (tabellino-228, rosso __CPM_NO_TAB228). (7) L7: riga della carriera senza a capo a 360-412 px.",""],["11/10","7.999.160","**7.999.160 — PO-224 (impulsi in primo piano), PO-218, PO-227 (fila), PO-229 (highlight dell'eroe), copyright.** (1) «Il mondo fuori» e «Il conto delle parole» in finestra; in finestra la fisarmonica parte aperta (rosso `__CPM_NO_POPAP224`). (2) Nomi reali fra i rivali rinominati e scansionati dal controllo copyright (prova del rosso: «Kylian» trovato). (3) «Sostieni il progetto». (4) PO-218: «Conduci palla al piede e tira» fallita si racconta da tiro (lessico-218 esteso, verde 0/12, rosso 12/12). (5) PO-229: sul gol la finestra d'esito aspetta la conclusione in tempo di scena (goal-postarc 4/6 → 0/8, rosso `__CPM_NO_CK229`); sonde gk-dive-sync, goal-postarc, outcome-not-goal riparate (erano cieche) e due in catena. (6) PO-227: i bambini della fila non corrono più da fermi (fila-227 verde 0/4110, rosso 4132/4132).","✅ carriera 33/33, completa 20/20 (con gk-dive-sync, goal-postarc e fila-227 nuovi in catena); instabili esiti-218 (verde alla 3ª: un tiro fuori raccontato come parata, seme 2021, da indagare) e nomi-219 (copertura 11/12); copyright verde."],["11/10","7.999.159","**7.999.159 — PO-218 (esito dell'eroe coerente) e PO-221 (gol dell'eroe), rilievi delle collaudatrici e di Codex.** (1) Fuorigioco contro intercetto: con la chiave intercept il riquadro segue il motore (rosso `__CPM_NO_FG218`). (2) Un tiro fermato si racconta da tiro: 138 azioni-tiro su 138 prendevano il lessico di passaggio; guardiano `lessico-218` verde 0/138, rosso 138/138. (3) Resa dei tiri delle scene 1,4 → 1,8 (gol dell'eroe 0,50 su 60 partite della collaudatrice 2; misura mia 16 partite 0,62 → 0,75). (4) La punizione aperta da una scena normale conta nel tetto «1 a partita» (seme 740). (5) PO-224: finestre anche per La tua storia, scelte narrative, esonero e procuratore; la finestra aspetta sotto il confronto col procuratore (`popup-224` esteso). (6) Copyright (sviluppatrice, giro 6, unione del ramo): 14 derby e 16 club rinominati, migration dei nomi salvati, blocklist allargata; audit 0 riferimenti. (7) PO-220: slancio difensivo 5,2 → 7,5u e degrado a pressing oltre 8u: gesto giusto visibile al picco 8/12 contro 5/12 (rosso `__CPM_NO_PUSH220`), distanza ancora 6,1u mediana. Prima release con le nuove regole (rilascio notturno, ci-runner con rilancio dei rossi e passi lenti in parallelo). ⏳ sul ramo, rituali in corsa",""],["11/10","7.999.158","**7.999.158 — PO-221 parte 2, PO-224, PO-225 (decisioni PO 10-11/10). Contiene la 7.999.157 (assist: compagno in posizione da gol; varco di collaudo `apriImpulso`), non promossa da sola: catena completa 14/15, `scene-221` rosso a 9,0 scene.** (1) Tetto di 7 scene a partita, rigori esclusi (rosso `__CPM_NO_TETTO7`). (2) Falla del tetto delle punizioni chiusa (rosso `__CPM_NO_PZTOT221`). Misura su 16 partite: scene 8,88 → **6,94** (mediana 7, 11 su 16 in 5-7), punizioni 1,69 → 0,56, gol dell'eroe 0,62. (3) Patto col mister e spogliatoio come finestra sopra la home, uno alla volta (guardiano `popup-224`). (4) Grafica TV pre-partita in dissolvenza dopo 4 s (opacità a 6 s: 0, contro 1 nel rosso `__CPM_NO_TV225`). (5) `nomi-219`: tolta la soglia assoluta del rosso (decisione PO) e campione allargato a 8 partite (col tetto i nominati scendevano a 11 su 12). ✅ carriera 33/33, completa 16/16 (con `popup-224`).",""],["10/10","7.999.156","**7.999.156 — PO-221 «l'eroe fa un sacco di tiri e azioni (forse troppe) e difficilmente segna o effettua un passaggio/assist vincente» (decisioni PO da questionario 09-10/10).** Misura su 6 partite vere (7.999.155): 9,2 scene a partita (4-12), su 53 azioni 5 gol e 1 assist. Ora: 16' fra le occasioni dal gioco invece di 12', al massimo 1 punizione diretta a partita, almeno un'opzione di passaggio in ogni scena offensiva (e nella conclusione quando c'e' un compagno libero), uno-due e finta meno intercettati con statistiche buone, tiro del compagno piu' pulito dopo l'assist, tiri su azione delle scene dell'eroe ×1,4 (rigori, punizioni e simulazione rapida invariati); rossi `__CPM_NO_GAP221/PUNZ221/PASS221/INT221/ASS221/RES221`, globale `__CPM_NO_221`. Misura 12 partite per braccio: scene 8,0 (mediana 7,5; 6 su 12 in 5-7) contro 8,0 (mediana 8,5; 1 su 12) — la media oscilla fra corse (7,0 e 8,0 con le stesse partite); gol dell'eroe 0,75 (obiettivo 0,6-0,9); **assist invariati (0,08)**: il compagno sbaglia il tiro dopo il passaggio riuscito, da trattare nella release successiva (decisione PO). Guardiani nuovi in catena completa: `scene-221` (enumerazione verde/rosso + 6 partite) e `difesa-220` (PO-220, enumerazione 0/1800 contro 1122/1800 «press»). Correzione in corsa: il passo di 16' vale solo nella partita vissuta (la prima stesura toccava anche la simulazione rapida e `brain-202` era sceso a ×1,19).","✅ carriera 33/33 · completa 15/15 · test:logic 43/43 · `main` allineato"],["09/10","7.999.155","**7.999.155 — PO-219 «nella scena ci sono A, B, C ma dice che gliela passa D» + PO-220 «l'eroe nelle scene difensive sembra a passeggio».** PO-219: se la scena nasce da una manovra vera, il compagno nominato dal testo («Uno-due con X», «A apre per B, che ti serve», «Passaggio di X per te») e' il ricevente del cast, e allo stacco d'apertura il 3D lo scambia col compagno piu' vicino all'eroe; anche chi APRE il giro a tre entra nel cast e in scena (PO-219b), e lo scambio non ruba lo slot di un altro nominato ne' quello dell'eroe. Misura onesta: la prima metrica del guardiano (ricevente/difensore del cast entro 25 u) NON separava i bracci — rosso 100% contro verde 96% in una corsa, 93% contro 100% nell'altra — perche' nel braccio rosso il cast nomina un altro uomo. Il guardiano `nomi-219` misura ora i compagni nominati dal preludio, stessi uomini nei due bracci: verde 14/15 entro 25 u, rosso 6/14; l'unico lontano nel verde e' il portiere che apre dal fondo (resta in porta per regola, contato a parte e mai giudicato). PO-220: le chiusure difensive hanno un gesto vero (chiusura/contrasto/anticipo/raddoppio → affondo, scivolata → scivolata), rosso `__CPM_NO_GESTO220`; guardiano `difesa-220` scritto, collaudo dopo la promozione. `nomi-219` gioca ora 6 partite: con 4 la copertura variava fra corse (15 nominati, poi 9) e il pavimento di 12 cadeva per campione, non per difetto.","✅ carriera 33/33 · completa 13/13 · test:logic 43/43 · `main` allineato"],["09/10","7.999.154","**7.999.154 — PO-218 «i pop di chiusura scena non rispecchiano la verità»: un solo tipo d'errore per riquadro, motore e 3D.** Misura su 4 partite vere (40 scene, 7.999.153): passaggi intercettati raccontati come «murato»/«non trova lo specchio», un fallo cercato perso raccontato come «punizione per noi», e il motore che registrava SEMPRE «fuori» per un tiro sbagliato mentre riquadro e 3D dicevano parata/palo/murato. Ora il motore riceve il tipo d'errore deciso dal gioco (outKind) e racconta lo stesso fatto (parata, palo, murato, fuori, fallo subito, passaggio fuori misura); intercetto e palla persa hanno famiglia e frasi proprie, il passaggio sbagliato parla da passaggio; «Tentativo respinto» solo fra le parate. Guardiano nuovo `esiti-218` (in catena completa): verde 0 contraddizioni su 17 scene, rosso `__CPM_NO_ESITI218` 13 su 21.","✅ carriera 33/33 · completa 12/12 · test:logic 43/43 · `main` allineato"],["08/10","7.999.153","**7.999.153 — PO-022 Passo 6, strato 8a (decisione PO 08/10: prima i piazzati, poi la chiusura): rigore e punizione nascono dall'occasione del motore.** Erano il 29% delle azioni dell'eroe (11 su 38 in 4 partite vere) e venivano tutti dal catalogo (3 schede di punizione diretta). La punizione parte dal punto vero del fallo («Punizione dal limite, 21 metri: tocca a te!»), le opzioni pesano la geometria; il rigore è sul dischetto col portiere vero; movimento bloccato come nelle schede; nel live la scena costruita non viene sostituita da schedePiazzato. In partita (scena-motore-147): 7 occasioni su 7 generate in entrambi i semi, nessuna più dal catalogo; il rigore generato non è ancora osservato. `piazzati-eroe` verde. Rosso `__CPM_NO_P6P`.","✅ carriera 33/33 · completa 11/11 · test:logic 43/43 · `main` allineato"],["08/10","7.999.152","**7.999.152 — PO-022 Passo 6, strato 7: la scena difensiva dell'eroe nasce dal motore.** Misura: 0 scene difensive su 38 azioni dell'eroe in 4 partite vere; il portatore avversario arriva entro 4 u dall'eroe 5,2 volte a partita (pressing alto). Decisione PO 08/10: al massimo una scena difensiva a partita, in aggiunta. La prima volta dal 5' il motore dichiara l'occasione «difesa» (cast: il portatore vero); la scena nasce type def («Pressing alto su BAILEY: riconquista palla!») con azioni difensive del catalogo (chiusura, contrasto pulito, scivolata, anticipo, raddoppio); l'esito lo racconta il motore (contrasto o avversario che prosegue). In node 24 partite su 24 con l'occasione, 0 col rosso; in partita (scena-motore-147) la scena nasce all'8' e la partita arriva al fischio. Non ancora verificato con una sonda dedicata il disegno 3D della scena difensiva generata. Rosso `__CPM_NO_P6D`.","✅ carriera 33/33 · completa 11/11 · test:logic 43/43 · `main` allineato"],["08/10","7.999.151","**7.999.151 — PO-022 Passo 6, strato 6: cross e angolo nascono dall'occasione del motore.** Quando il motore dichiara il cross o l'angolo per l'eroe (con chi crossa e da dove) la scena si costruisce invece di pescarla dal catalogo: titolo col crossatore vero («Cross di SPENCER: attacca il pallone in area!»), intento inserimento e pallone alto dichiarati (il 3D non indovina dal testo), opzioni del catalogo già disegnate (testa di potenza, testa piazzata, volée, controllo e tiro); sull'angolo «calcio d'angolo» → bandierina. L'origine (crossatore/bandierina) viaggia con la scena come prima. Misura in partita (scena-motore-147, 2 semi S12): 1 cross generato, 0 angoli capitati — l'angolo generato non è ancora osservato. `bandierina-60` verde; `cross-origine` 1 rosso su 4 giri (pallone a 28,5u dal crossatore in scelta) sulla scheda forzata #88, che non passa dal generatore: instabilità non attribuita, da indagare. Rosso `__CPM_NO_P6X`.","✅ carriera 33/33 · completa 11/11 · test:logic 43/43 · `main` allineato"],["08/10","7.999.150","**7.999.150 — PO-030/PO-022 Passo 6, strato 5: le manovre vere aprono la scena.** Misura (48 partite S12, 306 occasioni): nessuna occasione a centrocampo, 91,8% dopo almeno un passaggio della stessa squadra, uno-due nel 21% (37% fra le linee) — le manovre ci sono già, il motore non deve impararle. Il motore consegna con l'occasione gli ultimi 4 passaggi del possesso (preludio; sola lettura: gol e tiri identici fra i bracci) e l'introduzione della scena racconta la manovra coi nomi veri (uno-due, giro a tre, il passaggio che ti ha servito). Fuori ambito: la costruzione 3D che ripercorre i passaggi. Rosso `__CPM_NO_P6M`; guardiani `manovre-150` (node, preludio 93,8%) e `scena-motore-147`. Nota di misura: le occasioni «fascia» sono l'1,3%. In partita (scena-motore-147, 2 semi S12): 8 scene su 9 aperte dalla manovra vera (5 uno-due, 3 giri a tre); prima stesura rossa e corretta nello stesso rilascio: la copia dell'occasione nel live non portava il preludio.","✅ carriera 33/33 · completa 11/11 · test:logic 43/43 · `main` allineato"],["07/10","7.999.149","**7.999.149 — PO-022 Passo 6, strati 3-4: «fascia» e «fra le linee» nascono dal motore.** Fascia (trequarti esterno): cross sul primo palo, sul secondo palo, basso teso; dribbling sul fondo e cross; «Rientra e tira»; appoggio corto per il compagno del cast. Fra le linee (trequarti centrale): filtrante solo per un compagno libero del motore, col suo nome; uno-due col compagno più vicino; tiro da fuori; conduzione e tiro; finta e cambio di passo. Misura (2 partite S12 per braccio): 12 scene generate su 12 occasioni coperte (6 conclusioni, 4 spalle, 2 fra le linee), 0 col Passo 6 spento; l'assist esce solo con un compagno libero («Servi SPENCER libero», liberi 1). Nessuna occasione «fascia» nelle due partite: lo strato 3 non è ancora osservato in partita. Rossi `__CPM_NO_P6F`, `__CPM_NO_P6L`, globale `__CPM_NO_P6`; guardiano `scena-motore-147` sui quattro tipi. Nello stesso rilascio, dalla catena: al 96' il motore salda tutto il debito del tempo fermo (4 passi su ~308 restavano non pagati al fischio; rosso `__CPM_NO_SALDO149`), e tre guardiani resi indipendenti dalle scene nuove — `recupero-202` (il rosso spegne anche il debito del 138), `tabellino-216` (iniezione a motore nato), `partita-rigiocata-194` (rosso provato dall'ingresso in campo con la conferenza aperta; la riapertura dopo il fischio misurata 1/1 via cerimonia, 0/2 via «ended», resta informativa).","✅ carriera 33/33 · completa 10/10 · test:logic 43/43 · `main` allineato"],["07/10","7.999.148","**7.999.148 — PO-022 Passo 6, strato 2: «spalle alla porta» nasce dal motore.** Quando il motore dichiara l'eroe in area o al limite con pressione da 3 in su, la scena si costruisce dall'occasione. Opzioni: girata secca e tiro; protezione della palla con scarico sul compagno del cast; sponda di prima solo se c'è un compagno libero; fallo cercato resistendo alla carica; tiro di potenza (peso basso). Titolo col nome del marcatore: «BAILEY ti è addosso: spalle alla porta!». Costruttore comune per tutti gli strati. Misura (2 partite S12 per braccio): 6 scene generate su 6 occasioni coperte, 0 col Passo 6 spento, zona di partenza sempre sul punto del motore, 0 opzioni senza clip. Rossi `__CPM_NO_P6S` e globale `__CPM_NO_P6`; guardiano `scena-motore-147` esteso agli strati 1-2.","✅ catena carriera 33/33 · catena completa 10/10 (rifatte dopo due guardiani fragili: tempo-138, il cui rosso ora spegne anche il Passo 6, e ripartenza-207, che ora guarda 6 s; una correzione al gioco provata e ritirata perché non dimostrata)"],["07/10","7.999.147","**7.999.147 — PO-022 Passo 6, strato 1: la conclusione nasce dal motore (decisione PO «Passo 6 completo»).** Quando il motore dichiara un'occasione di tipo «conclusione» (area o limite, pressione sotto 3), la scena non si pesca più fra le schede scritte: si costruisce dall'occasione con la stessa fabbrica delle schede. La zona di partenza contiene il punto in cui il motore ha messo l'eroe; pressione e difensori vicini vengono dal motore; l'1 contro 1 esce solo in area senza pressione. Le 3 opzioni escono da un registro di gesti tutti disegnabili, pesati dalle statistiche dell'eroe: assist solo se il motore ha un compagno libero (col suo nome), pallonetto solo nell'1 contro 1. Titolo e intro usano i nomi del cast. Scelta seminata, partita riproducibile. Misura su 2 partite S12: 5/5 conclusioni generate, zona di partenza sempre sul punto del motore, 0 opzioni senza clip. Rosso `__CPM_NO_P6C`; guardiano `scena-motore-147` (tutte le conclusioni del motore generate; rosso 0). Piano dei restanti 7 strati in `docs/governo/PASSO6.md`.","✅ catena carriera 33/33 · catena completa 10/10"],["07/10","7.999.146","**7.999.146 — PO-143 #18 «Non era un dribbling»: la finta si vede anche prima di assist e cross qualunque.** Il doppio gesto della 7.999.145 copriva solo roulette, doppio passo, rientro e sterzata: «Dribbling netto e assist» (gi18, nota #18 del taccuino) mostrava solo il passaggio. Ora ogni etichetta che promette un dribbling o una finta prima della giocata ha il tratto di finta con il cambio di direzione (39 etichette; escluse le «senza dribblare»; a schermo cambiano 14 azioni di passaggio, cross e 1 contro 1, per i tiri c'era già). Base del backbone aggiornata (+1 tratto, pattern e beat finale invariati). Rosso `__CPM_NO_DRIBBLE150`; guardiano `doppio-gesto-148` esteso al caso generico. Nella stessa giornata, due tentativi sulla difesa PO-185 annullati perché la misura non li sosteneva (vedi CODA-CODEX).","✅ catena grafica 29/29 · catena completa 9/9"],["06/10","7.999.145","**7.999.145 — PO-068: nessuna variante di gesto resta senza strada (decisioni PO 06/10).** Delle 16 varianti mai raggiunte: 9 erano doppioni con la stessa clip e lo stesso profilo (shot_placed, step_over, feint, hocus_pocus, short_pass, long_pass, chip_pass, backheel, tackle/aerial). Sono tolte dalla tabella, e i nomi ancora prodotti dal motore si risolvono sul gemello: a schermo non cambia nulla. cross_rabona e heel sono tolte perché non hanno una clip vera (rabona e tacco restano tra i gesti promessi senza clip). Le altre 5 sono il **doppio gesto**: «Roulette e tiro», «Doppio passo e tiro», «Step-over e cross», «Sterzata… e assist» e «Rientra e tira» ora mostrano il dribbling prima del gesto finale, con un tratto di finta nella sequenza; la roulette usa la clip del PO, gli altri il cambio di direzione (il doppio passo non ha una clip sua). Censimento: varianti raggiunte 30/46 → 35/35, azioni fedeli 281 → 284. Rosso `__CPM_NO_DOPPIO148`; guardiano `doppio-gesto-148` (verde: tratto di finta e cambio di direzione su cross e assist; rosso: niente finta), base di `gesti-copertura-96` aggiornata.","✅ catena grafica 29/29 · catena completa 9/9 (rifatta dopo un rosso degli strumenti di test: estrattori di deriveHL aggiornati)"],["06/10","7.999.144","**7.999.144 — PO-123: i giocatori non sono più statue prima dell'azione (decisione PO «al massimo il 30% fermi»).** La sonda `hl-credibilita` ora misura sul tempo di scena (prima l'orologio reale chiamava «fermo» chi correva al rallentatore). Causa: il congelamento di lettura (5.47.17) teneva tutti fermi mentre l'eroe sceglie, con un respiro di 0,3 u troppo lento per essere movimento. Ora entro 35 u dal pallone i compagni si smarcano e rientrano in diagonale verso la porta e gli avversari accorciano e scalano sulla linea del pallone (±1 u attorno al punto congelato, la scena non cambia geometria). Fermi prima dell'azione, 5 partite per braccio: compagni 47,4 → 10,2%, avversari 47,9 → 9,0%. Rosso `__CPM_NO_ATTIVI147`, guardiano `movimento-147`.","✅ catena grafica 28/28 · catena completa 9/9"],["06/10","7.999.143","**7.999.143 — PO-068 P1-b seconda parte: piede e istante del contatto in una tabella sola, e il pallone al piede anche su passaggio e cross.** Misurato sul picco di velocità del piede (provino-clip, 25 istanti): passaggio sinistro a u 0,96, rigore destro a u 0,54, tiro sinistro a u 0,96. In scena (cross forzati gi16/gi42, corpi 3D) al contatto il pallone stava a 4,69 e 3,64 u dal piede che crossa: l'aggancio valeva solo per il tiro. Ora `CONTATTO_CLIP` riunisce i due elenchi e passaggio e cross agganciano il pallone come il tiro: 0,36 e 0,29 u. Residuo dichiarato: se a inizio gesto il pallone è lontano (palla viva dopo un primo tentativo murato, 9,1 u) arriva al piede in un attimo — da collaudare sul telefono. Rigore fuori: nelle scene forzate il gesto non si monta, quindi non ho la misura. Rosso `__CPM_NO_P1B2`, guardiano `piede-cross-p1b2`. **Nella stessa versione, decisione PO 06/10 «rincorsa»:** misurato che passaggio e cross (clip `pass`) e il calcio `kick` partono e finiscono coi piedi fermi; ora lancio lungo, cross, pallonetto e volée usano la clip coi passi d'appoggio del tiro in corsa (verde 4 gesti su 4, rosso 0), il passaggio corto resta da fermo. Rosso `__CPM_NO_RINC144`, guardiano `rincorsa-144`. **Guardiano `piedi-203` riscritto:** al primo giro di catena era rosso perché il suo braccio rosso dipendeva dal caso (la partita abbassava la quota solo a 0,116); ora la quota si impone a 0,05 (aggancio di prova `__CPM_F077_SET`): verde 0,117, rosso 0,05. **Guardiano `gesti-scena-p1b` riscritto** (secondo giro di catena rosso per lo stesso motivo: il rosso vedeva comunque 0,68 dei gesti grazie ai canali propri della scena): ora giudica le richieste del brain in scena (verde 12, rosso 0 per costruzione) e almeno il 60% dei gesti visti. **Clip del PO (PO-075, decisione «testa + coscia»):** caricate in `cgtrader-clip-po2.glb`; misurato che lo stacco di testa da fermo **peggiora** (testa a 3,0-3,3 u dal pallone contro 1,1 della clip attuale su 2 scene forzate su 3) → sospeso, provabile con `__CPM_SI_TESTA145`; il controllo di coscia è attivo ma in una partita S12 l'eroe non monta mai il gesto di ricezione, quindi non si vede. **Difetto trovato misurando, da decidere col PO:** nel colpo di testa dell'eroe la testa non arriva al pallone (minimo 2,6 u in una partita S12; 3,1-3,3 u al contatto in 2 scene forzate su 3, con entrambe le clip). **Corretto nella stessa versione (decisione PO 06/10, colpo di testa in L1):** l'arco del colpo partiva subito dal punto di consegna del cross, 3 u prima della testa; ora aspetta il pallone (al più 0,8 s) e lo porta sulla testa — distanza testa-pallone al lancio 3,22/3,17 → 0,51/0,77 u (gi36/gi44). Rosso `__CPM_NO_TESTA146`, guardiano `testa-146`. **Guardiano `piedi-203`:** al terzo giro il verde era sceso sotto soglia in catena con i piedi sul prato nella foto; ora giudica la mediana della festa, non il minimo di un fotogramma (da solo: verde 0,117 due volte su due).","✅ catena grafica 27/27 · completa 9/9 (quinto giro; i quattro precedenti rossi per guardiani dipendenti dal caso, riscritti) · main"],["06/10","7.999.142","**7.999.142 — PO-068 P1-b, prima parte: i gesti del brain anche nelle scene.** Misurato (S12, corpi 3D): la tabella BRAIN_GESTI scartava tutti gli eventi del brain (639 su 639) perché il 3D esiste solo negli highlight, e nelle scene i gesti attesi dei corpi che non sono l'eroe si vedevano 9 volte su 22 (portiere pronto 3/7, tuffo 3/7, pressione 1/5). Ora l'evento di scena monta il gesto su quei corpi; l'eroe resta col gesto dell'opzione scelta. Visti 25/26 (secondo giro 12/13 contro 9/17 del rosso). Rosso `__CPM_NO_P1B`, guardiano `gesti-scena-p1b`. Restano di P1-b: colonne `contactAt`/`foot`, rami propri di caduta/cartellino/rovesciata.","✅ catena grafica 24/24 · completa 9/9 · main"],["06/10","7.999.141","**7.999.141 — PO-216: testimone del tabellino.** Foto PO: tabellone 2-2, tabellino della gara (dal motore) 2-3, partita giocata a mano. Non riprodotto: 168 partite vissute registrate (7.999.136-138) e 5 nuove sulla 7.999.140, tutte in autoplay, hanno tabellone = motore. Decisione PO «sì, testimone»: al fischio, se i due punteggi non coincidono, il taccuino annota da solo gol del motore, gol del tabellone e scene. Nessun effetto sul gioco. Rosso `__CPM_NO_TEST216`, guardiano `tabellino-216` (gol iniettato nel motore: verde 1 nota, rosso 0).","✅ catena carriera 33/33 · completa 9/9 · main"],["05/10","7.999.140","**7.999.140 — PO-203: l'eroe non affonda più nell'erba in festa e premiazione.** Misurato su tre partite S12: la quota a terra usata dalla festa era il minimo del piede in tutta la partita e scendeva a ogni scena (0,124 da fermo → 0,102 / 0,095 / 0,094 al fischio); il corpo veniva abbassato fin lì, 2-3 centesimi sotto il prato. Ora la quota non scende sotto il 95% del piede da fermo. Rosso `__CPM_NO_PIEDI203`, guardiano `piedi-203` (premiazione: verde 0,115, rosso 0,093).","✅ catena grafica 23/23 · main"],["05/10","7.999.139","**7.999.139 — PO-210: la schermata post partita come le schede carriera (decisione PO 05/10).** Le sezioni «Il tuo tabellino», «Le connessioni», «Tabellino della gara» e «Il tuo tabellino in numeri» sono fisarmoniche della carriera con card chiare; la tabella della gara perde la doppia cornice. Rosso `__CPM_NO_POST210`, guardiano `post-210` (verde 3 sezioni, rosso 0).","✅ catena grafica 22/22 · completa 9/9 · main"],["05/10","7.999.138","**7.999.138 — PO-202: il motore si ferma sull'occasione dell'eroe e il tempo della scena si restituisce tutto (decisione PO «correggi entrambe»).** Misurato: la 7.999.137 giocava 84,5 minuti di motore contro i 94 della simulata (debito con tetto 66, 4 passi a battito, residuo perso al fischio) e la scena di origine lasciava proseguire il cross in parallelo. Ora fermo immediato sull'occasione (rete: riparte da solo dopo 2 minuti se la scena non si apre), debito senza tetto pagato fino a 8 passi a battito, fischio rinviato finché non è saldato. 24 partite vere: 1,58–0,92, tiri 13,9–9,7 (avversari: erano 6,5; brain da solo 9,9), V/N/P 54/21/25%, gol dell'eroe dalle scene 0,83. Rossi `__CPM_NO_FERMO138`, `__CPM_NO_TEMPO138`, guardiano `tempo-138` (verde 242 passi pagati su 242, rosso 20 persi).","✅ catena carriera 32/32 · completa 9/9 · main"],["05/10","7.999.137","**7.999.137 — PO-202: il brain decide la scena dell'eroe (direttiva PO «il brain deve decidere tutto»; decisione PO «talento nel brain»).** Talento dell'eroe nel motore (K=1, uguale in vissuta e simulata), la scena di tiro/assist la gioca il motore dal punto dell'occasione (`giocaScena`), le scene nascono dalle occasioni naturali del motore, ritirati `fin202` e il debito di xG. Misura su 24 partite vere: 1,50–0,63, tiri 15,7–6,5, V/N/P 58/25/17%, gol dell'eroe 0,67 (obiettivo PO 0,6-0,9); 7.999.136: 1,63–0,67, 58/17/25%, eroe 0,88. Aperto: gli avversari tirano 6,5 contro 9,9 del brain da solo (origini che duplicano il cross, motore fermo in scena). Rosso `__CPM_NO_BRAIN137`, guardiano `brain-202`. Misura: `docs/governo/misure/2026-10-05-po202-brain-da-solo.md`.","✅ catena carriera 31/31 · completa 9/9 · main"],["05/10","7.999.136","**7.999.136 — Il possesso del riquadro «Il tuo tabellino» viene dal motore, come il tabellino della gara (PO-209).** Riprodotto con la sonda post partita sul salvataggio S12 (prestito a Torino Athletic): riquadro 51% contro tabellino 54%. Causa: il riquadro leggeva lo stato della cronaca (`possession`), il tabellino il motore. Guardiano `possesso-209` su partita intera: verde 51 = 51; rosso `__CPM_NO_POSS209` 73 contro 51. Non riprodotti, dichiarati: l'intestazione «FC Laguna» al posto del club in prestito (qui la testata era giusta) e l'intervista «assurda» di PO-211 (qui coerente: TAT 1-0 FC Sardo).","✅ catena carriera 30/30 · completa 9/9 · main"],["05/10","7.999.135","**7.999.135 — Mister senza omonimi e con la figurina (PO-215); presentazione al club nuovo come conferenza stampa prima della prima partita (PO-214).** PO-215: i cognomi dei mister sono 16 ed erano estratti senza guardare chi c'era già stato (nel salvataggio del PO due «Mister Verdiani»); ora un cognome già passato nella carriera si salta (`misterLibero215`, deterministico: anteprima dell'offerta e firma danno lo stesso nome). Misura S12: club che proporrebbero un mister omonimo 0 su 252 (rosso `__CPM_NO_MISTER215`: 75). Storico allenatori con figurina e club per riga, figurina anche nel discorso pre-partita. PO-214: se non ti sei presentato al club, «Gioca» apre la sala stampa del post partita (domanda, rilancio, prima pagina), poi discorso del mister e partita; dal riquadro in home «Vai in sala stampa». Rosso `__CPM_NO_PRES214`. Residuo dichiarato: con «Simula» la presentazione non si apre (resta il riquadro in home). Guardiani `mister-215`, `presentazione-214`.","✅ catena carriera 29/29 · complet
