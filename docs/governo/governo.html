ollaudo-testi/testi.json`. `lint-italiano.mjs` sul testo visibile e `testi-sorgente.mjs` su tutti i 10.878 testi dei sorgenti (commenti esclusi dal parser). **Corretti 226 testi con l'accento scritto come apostrofo** (107 «è», 42 «più», 16 «società», 15 «lì», 11 «metà», poi già, così, perché, i futuri in -rà…) con `tools/accenti-apostrofo.mjs`: solo dentro i testi, verificato che le 178 righe cambiate differiscano solo per l'accento e che ogni file si compili. Una prima stesura dello strumento aveva rotto un tag JSX (`\u003c/Btn>`): scartata e rifatta, con la ricompilazione come cancello. Non toccati: «Rating medio» e «Home» (sono scelte di nome, vanno nella tabella della parte A). **Catena:** validate-situations (fingerprint 00001505, 0 fallimenti), test:vision, test:logic, typing-shortcuts, save-compat, replay, career-critical 11/11 verdi. La tabella della parte A (7 criteri per schermata, glossario, 10 correzioni, autocritica) è il prossimo passo: nessuna modifica prima della tua approvazione.","CPM 7.999.46"],["28/09","7.999.45","**7.999.45 — taccuino PO su 7.999.44 (Portogallo, 6 note): riprodotte e misurate, una gara corretta, le altre dichiarate.** **#3 «Dribbling portiere»:** la scena forzata metteva eroe e pallone a centrocampo (x 37 invece di 82-90) in 5 giri su 8: il battito di fisica del motore (ogni 300 ms) riscriveva eroe e pallone dopo la messa in scena, perché la fase letta era ancora «playing». Ora la scena messa in posizione non viene riscritta finché non si torna a «playing» (`src/15`, rosso `__CPM_NO_STACCO45`): eroe fuori scena 0/6 contro 4/6 col rosso. **In partita naturale la gara non c'è** (0 riscritture in entrambi i bracci): non è la causa del tuo 001 sul telefono. Resta aperto: in partita naturale 2 scene su 7 con l'eroe a 17-24 u dal pallone in scelta (gi88, gi103). Corpo al tiro: al contatto guarda la porta (5-11°), ma nella rincorsa del tiro caricato resta girato di 91-97° e si volta negli ultimi 0,4 s (misurato, non ancora corretto). **#13 «Bordata potente», salto in rete:** non riprodotto (4 prove, corpi accesi e spenti, anche col pulsante vero dello stile: traiettoria intera). **#78 portiere sulla punizione:** nelle prove si tuffa con estensione piena. **#56 «Rimanda al mittente», 012:** scena forzata, passaggio sempre in avanti (+7,6/+9 u), arretramento massimo 4,8 u nel volo di costruzione, sotto la soglia di 12: non riprodotto; decisione PO registrata («il ritorno non va indietro»). **#80, #90:** esiti identici ai tuoi, nessun codice acceso nella scena forzata. Strumenti nuovi: aggancio di prova `__CPM_SETPIECE` (preme il pulsante di stile del piazzato come il giocatore), orientamento e posizione dell'eroe nel testimone del tiro, testimoni `__CPM_CUT45` e `__CPM_STACCO45`, sonde `stacco-eroe`, `stacco-naturale`, `facing-tiro`, `punizione-taccuino`, `ritorno`, `ritardo-eroe`. **Catena:** validate-situations (golden invariato), test:vision, test:logic, typing-shortcuts, save-compat, replay, career-critical 11/11 verdi.","CPM 7.999.45 · 🟡 da collaudare sul telefono"],["28/09","7.999.44","**7.999.44 — piede in conduzione: rapporto di Codex acquisito, due bracci di prova spenti, scheda per il confronto sulla GPU (rapporto Codex `reports/codex/2026-09-28-fluidita-3d.md`, 191 scene a 60 FPS con D3D11).** Letto il rapporto: piede d'appoggio in conduzione mediana 4,15 u/s a 3-6 u/s, 2,69 a 6-9, 1,94 a 9+ (968 fotogrammi, 15 scene); blocco alla prima apertura 755 ms (seconda 150, poi sotto 100); salti del pallone con l'eroe portatore solo gi50 (31 u, probabile artefatto della scena forzata) e gi87 (39 u, da riprodurre in partita naturale). **Misurato da noi:** il piano chiede all'eroe 11 u/s in conduzione (`src/12`, pavimento del 7.236), le gambe arrivano a 8,47 (tetto cadenza 2,5); nel provino a passo fisso il piede scivola 2,59 a 11 u/s contro 1,4 a 8-9,5. Ma Codex misura in partita lo scivolamento peggiore a velocità MEDIA: la causa principale non è la velocità alta. Ipotesi: accelerazioni e frenate, con la cadenza che segue una velocità smussata. Ipotesi del mix corsa/fermo smentita dal codice (per l'eroe la corsa è piena già a 1,6 u/s). In headless il piede non si può giudicare (a pochi FPS risulta alla velocità del corpo). **Quindi nessun cambio di comportamento:** bracci spenti `__CPM_COND44` (conduzione 8,5 u/s) e `__CPM_SPS44` (cadenza più pronta), campo `lag` nel testimone `__CPM_TIRO34` (gi38: l'eroe parte 11,6 u dietro il suo piano e scatta a 12 u/s per recuperare). Sonde `conduzione-test.mjs` (braccio acceso ≤ 8,6 u/s e costruzione ≤ 6 s; default 11 u/s, fallisce come atteso) e `conduzione-piede-sonda.mjs`. Il profilo di Codex attribuisce 955 ms a `_dec918`, un formattatore chiamato due volte per disegno: attribuzione non credibile, profilo da rifare sulla build precompilata. **Scheda per Codex:** `tests/character-lab/PROMPT_CODEX_CONDUZIONE.md` (4 bracci × 16 scene × 3 ripetizioni; profilo sulla build precompilata; gi87 in partita naturale). **Catena:** validate-situations, test:vision, test:logic, typing-shortcuts, save-compat, replay, conduzione (+rosso) verdi; career-critical non rilanciato (nessuna riga di carriera toccata).","CPM 7.999.44 · strumento di collaudo"],["28/09","7.999.43","**7.999.43 — imbracatura del collaudo massivo delle carriere (parte B del prompt PO «analisi schermate + collaudo carriere»).** `window.__CPM_CAREER` (solo `?cpmtest=1`, esclusa dalla build dello store): con `window.__CPM_SIM_NAT=1` il passo `step()` simula la partita della Nazionale con la funzione del bottone «Simula» invece di fermarsi su `blocked:` (prima i banchi chiudevano i tornei d'ufficio con `clearTournaments()`, cioè non li giocavano mai); nuovi `snapshot()` (copia completa dell'eroe) e `screen()` (schermata corrente). Flag spento = comportamento identico. Guardiano nuovo `career-nat-sim-test.mjs`: dalla stagione 4 settimana 20 (Europeo alla 24) 5 partite di Nazionale simulate, torneo chiuso da solo, stagione completata, 0 errori; rosso (flag spento) bloccato a S4W22. Verdi `career-sim-test`, `test:logic`, `save-compat` e gli 11 sotto-test di `career-critical`. Il quality gate `validate-situations` non l'ho rilanciato in locale: la modifica vive solo dentro l'imbracatura di collaudo; lo giudica la CI di main. Scheda per Codex consegnata al PO (36 carriere, 4 partenze × 3 forze × 3 stili, 8 archetipi: nel gioco il ruolo dell'eroe è sempre «Attaccante»).","CPM 7.999.43 · strumento di collaudo"],["28/09","7.999.42","**7.999.42 — punizione e rigore del brain si aprono col pallone già sul punto (taccuino PO su 7.999.34, SIT #81: «codice 001, all'apertura il pallone non è ai piedi di nessuno dei nostri, eroe ≥ 43,3 u»). ⚠️ Rimedio strutturale, NON dimostrabile in headless: il giudice è il telefono.** Causa letta nel codice: il gioco apre la scena del brain senza toccare il pallone, e il pallone raggiunge l'eroe solo con l'effetto che segue la messa in scena, due aggiornamenti dopo il taglio; fino ad allora il 3D ha il pallone di prima (a centrocampo alla prima scena). Ora sul piazzato del brain il punto si sorteggia una volta all'apertura, eroe e pallone ci stanno già nell'aggiornamento che apre la scena, e la messa in scena riusa lo stesso punto (`src/15`, ritirata `__CPM_NO_APERTURA41`). **Misurato in headless:** lo scatto di scena (nuovo testimone `__CPM_SNAP42`, il fotogramma che resta a schermo durante il blocco d'apertura) è sul punto della scelta **in entrambi i bracci**: il long task d'apertura (0,9–4,6 s) include gli effetti di React, quindi la finestra in cui il 3D mostra il pallone vecchio qui non esiste. Sul telefono il disegno può girare fra l'aggiornamento e l'effetto: è la finestra che la tua nota ha misurato (32 campioni). Nel percorso di misura ho trovato e corretto tre errori dello strumento: la fase letta prima che arrivasse al 3D, il fotogramma registrato prima dello scatto, un filtro sui tempi. Controllo di non-regressione `punizione-apertura-sonda.mjs` (scatto entro 3 u dal punto della scelta) in catena. **Protocollo di collaudo:** una punizione o un rigore del brain, guardando i primi istanti; se il pallone parte ancora da centrocampo, il codice 001 nel taccuino lo dirà. **Catena:** tutti verdi tranne `cross-origine`, **instabile anche senza questa modifica** (con `__CPM_NO_APERTURA41`: 1 rosso su 3; con la modifica: 2 rossi su 4, sempre sul caso angolo, pallone a 48–52 u dal battitore in scelta): difetto preesistente mai visto nelle catene 7.999.39–41, in coda da indagare.","CPM 7.999.42 · 🟡 da collaudare sul telefono"],["28/09","7.999.41","**7.999.41 — il disappunto sull'occasione sprecata è la clip del PO («Golf Bad Shot»: «gesto per il disappunto»).** Misurato prima: sul tiro fuori l'eroe montava `missed-chance` (3,4 s) dentro una finestra di 1,4 s, cioè a circa 2,4×: la clip arrivava in fondo in 13 campioni, un gesto frettoloso. Provino della clip del PO sul corpo di gioco (16 istanti): il colpo da golf non si vede, 0,5–2,6 s sono mani alla testa, piegamento, testa bassa; dopo 7 s è posa ferma. Ritagliato quel tratto (`mx-disappunto`, 2,1 s), montato sull'eroe a velocità nativa, finestra della reazione 1,4 → 2,5 s. In headless il tempo di scena scorre più lento del reale e la finestra d'esito chiude a 1,58–1,60 s di clip: il cuore del gesto (fino a 1,05 s) passa sempre; che sul telefono suoni intera non posso confermarlo. Guardiano `disappunto-test.mjs` (verde: clip giusta dopo il tiro, ≥ 1,4 s), rosso `__CPM_NO_DISAPP41` (torna `missed-chance`: fallisce come atteso). Pacchetto `cgtrader-clip-po.glb` 557 → 654 KB, le cinque clip precedenti identiche. **Catena:** disappunto (+rosso), ruleta, cartellino a CPU 6×, fallo-cercato, tiro, testa, esultanza, attesa, piede, gesto-vocabolario, celebration-visible, cross-origine, piazzati, caduta-eroe, gesture-window, test:logic, save-compat, sim-motore, motore-unico, eroe-dal-gioco, validate-situations, dist-web-partita, partita-vera, passo-velocita, cartellino: tutti verdi.","CPM 7.999.41 · 🟡 da collaudare sul telefono"],["28/09","7.999.40","**7.999.40 — il cartellino si vede anche sulle macchine lente (rapporto Codex: `cartellino` 1/10 sulla sua macchina, 0/10 dopo `partita-vera`).** Riprodotto da noi rallentando il processore del browser (nuova opzione `CPM_CPU` di `cartellino-test.mjs`): a 4× nessun cartellino in scena su gi30 e gi150. Causa (ipotesi di Codex, confermata): il cartellino nasce all'evento del motore, alla risoluzione, mentre la scena passa a `hl_result` un aggiornamento di React dopo; sulle macchine lente fra i due c'è almeno un fotogramma del disegno, e lì il controllo «non è ancora esito» lo cancellava. Ora il cartellino in attesa sopravvive nelle fasi dell'highlight che precedono l'esito (al massimo 8 s) e parte solo in `hl_result`. Misurato a CPU 4× e 6×: senza la correzione (`__CPM_NO_CARTA40`, `CPM_ROSSO40=1`) 3 fallimenti su 6 giri; con la correzione 0 su 5, più il giro in catena. Il campione è piccolo: la frequenza esatta non posso confermarla. Nella catena ora c'è anche `cartellino` a CPU 6×. **Catena:** ruleta, cartellino a CPU 6×, fallo-cercato, tiro, testa, esultanza, attesa, piede, gesto-vocabolario, celebration-visible, cross-origine, piazzati, caduta-eroe, gesture-window, test:logic, save-compat, sim-motore, motore-unico, eroe-dal-gioco, validate-situations, dist-web-partita, partita-vera, passo-velocita, cartellino: tutti verdi, nessuno rosso in catena.","CPM 7.999.40 · 🟡 da collaudare sul telefono"],["28/09","7.999.39","**7.999.39 — la finta si vede e la roulette è una ruleta vera (taccuino PO su 7.999.34: #92 «Roulette sul difensore!», codice 003 «esito bugiardo»; clip «Soccer Spin» mandata dal PO).** (1) Misurato su #92: nel tiro preceduto da dribbling (`DRIBBLE_SHOT`) l'eroe non montava NESSUN gesto nel tratto di finta, che era solo uno spostamento di posizione; e «Roulette di classe» era un tiro dal limite senza giro (`EDGE_SHOT`). Ora le parole roulette/ruleta/veronica/giravolta portano il tiro sul dribbling (src/11), e il tratto di finta condotto dall'eroe arma un gesto come il pre-stacco di testa della 7.999.33 (src/12): la ruleta se l'azione la promette, altrimenti la finta generica. Misurato: #92/0 monta `mx-ruleta` prima del tiro, la suona intera (1,29 s di clip) col pallone al piede (massimo 0,56 u); #92/1 «Finta e scatto» monta la finta prima del tiro. Guardiano `ruleta-test.mjs`, rosso `__CPM_NO_FINTA39` (nessun gesto nel tratto di finta, 5 controlli falliti); `__CPM_NO_RULETA39` toglie solo la clip. Pacchetto `cgtrader-clip-po.glb` 477 → 557 KB: le quattro clip di prima identiche (canali e durate confrontati) più `mx-ruleta`. Baseline del backbone aggiornata solo per gi92. (2) **Taccuino, misurato e non ancora corretto:** sulle scene forzate #152/#64/#81/#38 al ritmo del telefono il rilevatore del taccuino non accende né SALTO né 001 né 007 né 012; su 8 scene di partita vera un solo 001 lieve (5,8 u). Il 001 della punizione #81 si riproduce con la punizione chiesta al motore: all'apertura il 3D taglia sul pallone del gioco a centrocampo e la messa in scena arriva un aggiornamento dopo. In headless la **prima** scena di ogni partita blocca il disegno per 1,1 s coi corpi (in `renderer.setSize`: la tela passa da 775 a 791 px) e fino a 3,2 s senza (shader); le scene dopo restano sotto i 150 ms. Quanto pesi sul telefono non posso confermarlo: la grafica headless è emulata dal processore. Misura affidata a Codex con la GPU (sonde `aperture-blocco-sonda.mjs`, `apertura-profilo-sonda.mjs`, sezione nel prompt). **Catena:** ruleta (+rosso), fallo-cercato, testa, esultanza, attesa, piede, gesto-vocabolario, celebration-visible, cross-origine, piazzati, caduta-eroe, gesture-window, test:logic, save-compat, sim-motore, motore-unico, eroe-dal-gioco, validate-situations, dist-web-partita, partita-vera, passo-velocita, cartellino verdi; `tiro-caricato` rosso in catena e verde da solo.","CPM 7.999.39 · 🟡 da collaudare sul telefono"],["27/09","7.999.38","**7.999.38 — fallo cercato: il dribbling provocatorio riuscito mostra il fallo subito (taccuino PO su SIT #150 «Guadagna una punizione!»: «il pallone torna indietro a un compagno, del fallo nessuna traccia», distacco pallone-eroe fino a 10 u).** (1) Causa misurata: le azioni «cerca il fallo / si lascia cadere / guadagna la punizione» avevano esito `assist` e le regole 7.784/7.798 le trasformavano in un passaggio all'indietro e ritorno (scrittore del pallone `buildup-volo`); la caduta dell'eroe (7.999.8) scatta solo con esito `fouled`/`win_freekick`, che per le riuscite non arrivava al 3D. Ora queste azioni sono marcate `falloCercato` (src/04), si disegnano come dribbling (src/11) e, riuscite, danno esito «punizione conquistata» senza catena di passaggi (src/15): inciampo → a terra → rialzo, distacco massimo 2,6-3,5 u. Guardiano nuovo `fallo-cercato-test.mjs` (scena 150, azioni 0 e 1), rosso `__CPM_NO_FALLO38` (nessuna caduta, distacco 6,8/8,4 u). Baseline del backbone aggiornata solo per gi150 (pass → dribble). (2) **CI main rossa su e9355ae6** (`motion`: gi2 12/21 contro soglia 13): misurato in locale 6+6 volte con la 7.999.37 e col suo rosso — distribuzioni uguali (16-21), campioni bassi solo a freddo in entrambe. Non è la 7.999.37: il gate ora rimisura UNA volta una scena sotto soglia e lo scrive negli avvisi (una scena ferma fallisce due volte). (3) `gesture-window` era cieco da solo, non instabile: con lo stacco di testa legato al cross (7.999.33) il gesto di gi44/gi86 finisce dopo i 2,6 s fissi della sonda; ora attesa a sondaggio — verde (vite 1,16/1,17/1,17) e prova del rosso riuscita. (4) Rapporto Codex 7.999.34 letto (ramo `codex/2026-09-27-schede-3-6`): `cartellino` 1/10 sulla sua macchina con ipotesi di azzeramento in `!isResult`, 5 scene con eroe tagliato dalla camera — da riprodurre da noi prima di toccare il gioco. **Catena:** fallo-cercato (+rosso), tiro, occasioni-squadra, calendario, testa, esultanza, piede, gesto-vocabolario, celebration-visible, cross-origine, piazzati, caduta-eroe, gesture-window (+rosso), test:logic, save-compat, sim-motore, motore-unico, eroe-dal-gioco, validate-situations, dist-web-partita, partita-vera, passo-velocita, cartellino verdi; `attesa-difesa` rosso in catena e verde da solo.","CPM 7.999.38 · 🟡 da collaudare sul telefono"],["27/09","7.999.37","**7.999.37 — fluidità: a inizio scena le gambe non partono più al massimo; lo scatto provato e REVOCATO; «pallone perso per strada» non riprodotto (collaudo PO: «movimenti poco fluidi, si perde il pallone per strada»).** (1) Misurato col testimone della scena: allo stacco di scena lo spostamento istantaneo dell'eroe veniva letto come corsa (stima fino a 25 u/s) e le gambe partivano alla cadenza massima con l'eroe fermo (passo 8,75 u/s). Ora uno spostamento oltre 30 u/s non entra nella stima: passo a inizio scena 1,75. Rosso `__CPM_NO_PASSO37`; controllo aggiunto a `tiro-caricato-test.mjs` (rosso: 8,75 e 4,2 u/s). (2) **Scatto revocato con la sua misura:** fondere la corsa con la clip `running` (fase del passo agganciata, provino del passo: appoggio sinistro 0,18/0,175, destro 0,67/0,63) sembrava la cura del piede che scivola in corsa veloce; il nuovo `provino-passo.html` (passo fisso 1/120 s, fuori dal gioco) dice il contrario: scivolamento mediano a 9,5 m/s 1,4 con la sola corsa contro 3,2 con lo scatto. Anche una stima di velocità più pronta è stata ritirata: a pochi fotogrammi al secondo la misura in scena oscilla più dell'effetto (stessa scena 2,3 → 5,9 senza modifiche che la riguardino). (3) **Da decidere (PO):** con la sola corsa, alzare il tetto della cadenza da 2,5 a 3,5 porta lo scivolamento a 11 m/s da 2,6 a 1,5 e a 12,5 m/s da 4,1 a 1,5, ma a quella velocità le gambe fanno ~9 passi al secondo (un velocista 4-5): la causa vera è che nelle scene l'eroe corre a 11-12 u/s. (4) **Pallone perso:** sonda `pallone-perso-sonda.mjs` su una partita vera (distanza del pallone dal giocatore più vicino ogni 200 ms): nelle scene 3D i distacchi trovati sono voli (tiri, passaggi), rincorse delle punizioni e un gol; non riprodotto — serve dal PO la fase in cui lo vede. **Catena:** tiro (+rosso), testa, esultanza, attesa, piede, gesto-vocabolario, celebration-visible, cross-origine, piazzati, caduta-eroe, test:logic, save-compat, sim-motore, motore-unico, eroe-dal-gioco, validate-situations, dist-web-partita, partita-vera, passo-velocita verdi; `tiro-caricato`, `gesture-window` e `cartellino` rossi in catena e verdi da soli (instabili noti, in coda).","CPM 7.999.37 · 🟡 da collaudare sul telefono"],["27/09","7.999.36","**7.999.36 — le occasioni dell'eroe fanno parte della squadra (collaudo PO: «risultato esagerato», Europeo Spagna-Francia 7-1, xG 4,38, eroe 3 gol e 1 assist).** Misurato: la Francia giocava con la sua forza vera (85 contro 90), quindi non era un avversario sottostimato. Al banco il motore segna quanto il suo xG (1,55 gol su 1,54 a partita, 90 contro 85, 300 partite; mai 7 gol) e la partita simulata, dove le occasioni dell'eroe stanno dentro la produzione, fa 1,73. Nella partita VISSUTA invece le scene dell'eroe si SOMMAVANO al gioco del motore: sonda `punteggio-forte-sonda.mjs` (eroe 93, club 90, forma 95; 2 partite di campionato e 2 del girone dell'Europeo) 3-0, 0-0, 4-0, 3-1 = 2,5 gol a partita per la squadra dell'eroe, 1,5 dal motore + 1,25 dalle scene. Ora ogni scena da gol o da assist apre nel motore un DEBITO pari ai suoi gol attesi, e i tiri successivi della squadra dell'eroe lo ripagano col loro xG. Dopo, stesse 4 partite: 4-1, 1-0, 1-3, 0-1 = 1,5 a partita. Guardiano al banco `occasioni-squadra-test.mjs` (300 partite con 4 scene da 0,35): senza scene 1,56 · con scene e correzione 1,76 · rosso `__CPM_NO_PUNT36` 2,94. **Effetto da giudicare:** con un eroe fortissimo le scene valgono ~2 gol attesi a partita, più dell'intera produzione del motore (1,5), quindi i compagni segnano poco (xG dei compagni 0,07-0,27 nelle partite misurate) e l'eroe resta il marcatore principale — coerente con le scelte già fatte (grande occasione 0,28+0,8·xG, 2-6 occasioni), ma è un equilibrio che puoi voler cambiare. **Catena:** occasioni-squadra, test:logic, save-compat, sim-motore, goleade, motore-unico, eroe-dal-gioco, tattiche, validate-situations, dist-web-partita, partita-vera, voto-volume, occasioni-dinamiche, tiro-caricato, testa-tempismo, cross-origine, piazzati verdi.","CPM 7.999.36 · 🟡 da collaudare sul telefono"],["27/09","7.999.35","**7.999.35 — calendario: l'amichevole della Nazionale non finisce più nell'Europeo né sulla card del club (collaudo PO: «calendario sbagliato», home in settimana 28 con «Premier Division · FC Merseyside vs Belgio · 1ª in classifica» mentre si giocava il girone dell'Europeo).** Causa (letta nel codice e riprodotta): la convocazione per l'amichevole prende la prima settimana libera del calendario DEL CLUB, e il torneo della Nazionale vive fuori da quel calendario → amichevole contro il Belgio nella stessa settimana della partita dell'Europeo; la card «Prossima partita» trattava ogni voce come gara di campionato (intestazione della lega, il club in campo, posizione in classifica). Ora: (1) niente amichevoli durante la fase finale di Europeo/Mondiale né dalla settimana 24 mentre è in corso la qualificazione; (2) bonifica al caricamento: un'amichevole non giocata che cade nella fase finale di un torneo in corso si toglie (vale per il salvataggio del PO); (3) l'amichevole in home è «Amichevole Internazionale» con le due Nazionali, senza classifica. Guardiano `calendario-nazionale-test.mjs` (salvataggio sintetico: A Europeo nel girone con amichevole in W28, B amichevole fuori torneo); rosso `__CPM_NO_CAL35` riproduce lo screenshot del PO. La programmazione della convocazione (sorteggio seedato) non ha un test dedicato: coperta da `stab-nat-trigger`. **Catena:** calendario (+rosso), test:logic, save-compat, stab-nat-trigger, tripath, career-critical (11 parti), career-sim, home-riquadri verdi. **Dal telefono del PO:** partita simulata 157 ms (mediana di 5, max 179) — entro il limite di 300 ms (punto aperto dalla 7.999.4). **In coda dal collaudo di stasera:** 7-1 all'Europeo (xG 4,38) · movimenti poco fluidi e pallone che si perde per strada (lo scatto è pronto, in prova) · ingresso in campo a scatti.","CPM 7.999.35 · 🟡 da collaudare sul telefono"],["27/09","7.999.34","**7.999.34 — il tiro dell'eroe si carica (collaudo PO: «il tiro è scoordinato, non viene caricato / preparato prima del calcio», «i movimenti devono essere fluidi»).** Misurato (testimone `__CPM_TIRO34`, 3 scene; provino delle clip): la clip del tiro `kick` dura 0,46 s e parte da FERMO, senza passo d'appoggio né gamba caricata; in scena l'eroe la eseguiva correndo a 8-11 u/s (il piede a terra scivolava a 4-10 u/s) e il gesto si spegneva 0,03 s dopo il calcio. Ora il tiro dell'eroe usa «Strike Forward Jog» del pacchetto Mixamo (già nel repo, mai usata): due passi, appoggio, gamba dietro, colpo a 0,43 s, accompagnamento. La radice della clip avanzava di 3 m (per questo era stata scartata): tolta al caricamento, e durante il gesto l'eroe avanza esattamente quanto avanzava il bacino della clip. La clip va più svelta se l'eroe arriva lanciato (x1,0-1,5) e il pallone parte al contatto; versione specchiata per il sinistro (piede preferito). Esclusi pallonetto, volée e rovesciata; rigori e punizioni invariati. Misurato (`tiro-caricato-test.mjs`, 4 scene, una col sinistro): caricamento 0,30-0,46 s, piede d'appoggio 0,8-1,2 u/s (prima 3,8-10), accompagnamento 0,55-0,81 s (prima 0,03), piede-pallone al contatto 0,12-0,37 u. Rosso `__CPM_NO_TIRO34`: FALLITO (8). **Catena:** tiro, testa, esultanza, attesa, piede, gesto-vocabolario, celebration-visible, cross-origine, piazzati, caduta-eroe, gesture-window, logica, save-compat, sim-motore, motore-unico, eroe-dal-gioco, validate-situations, dist-web-partita, partita-vera, passo-velocita verdi; `cartellino` rosso in catena e verde 2/2 da solo (test instabile già in coda). **Osservato, non corretto:** anche nella corsa normale il piede appoggiato scivola (3-6 u/s misurati in headless, pochi fotogrammi al secondo: da confermare).","CPM 7.999.34 · 🟡 da collaudare sul telefono"],["27/09","7.999.33","**7.999.33 — lo stacco del colpo di testa segue il cross (collaudo PO: «i colpi di testa non sono sincronizzati con la velocità del cross, salta troppo presto»).** Misurato con un testimone per fotogramma (`__CPM_TESTA33`) su 5 scene di testa: il pallone arrivava alla testa con l'eroe ancora a +0,6 u da terra, e il picco del salto (+2,2 u) arrivava 0,5 s DOPO il pallone, perché salto e gesto partivano solo all'arrivo del cross. Ora lo stacco parte durante l'ultimo tratto del cross, quanto basta per arrivare in cima quando arriva il pallone; il gesto riparte dal picco e l'altezza del salto dipende dall'altezza del pallone. Esclusa la testa in tuffo. Misurato (`testa-tempismo-test.mjs`, 5 scene): scarto fra picco e pallone da +0,50 s a 0,04 s di media (0-0,1 s), salto 0,34-0,36 u, distanza minima fra pallone e testa 0,06-0,22. Rosso `__CPM_NO_TESTA33`: scarto 0,49 s, FALLITO. Il provino delle clip (`provino-clip.html`) misura ora anche il picco della testa. **Catena tutta verde:** testa (+rosso), esultanza, attesa, piede, gesto-vocabolario, celebration-visible, cross-origine, piazzati, caduta-eroe, griglia-mobile, logica, save-compat, sim-motore, motore-unico, eroe-dal-gioco, validate-situations, dist-web-partita, partita-vera, e anche passo-velocita e cartellino.","CPM 7.999.33 · 🟡 da ricollaudare sul telefono"],["27/09","7.999.32","**7.999.32 — clip del PO: il pugno e l'attesa in difesa.** (1) **Pugno** (PO: «va bene per l'esultanza con il pugno»): da «Golf Putt Victory» si tiene solo il tratto 4,3-8,0 s (ginocchio su e pugno, poi braccio al cielo), ritagliato in Blender. Prima prova: sorteggiato fra le «braccia al cielo» il guardiano l'ha bocciato (mani mai sopra la testa in 3 esultanze su 5) — giusto, il pugno è un'esultanza SOBRIA: ora esce solo col piano `contained`, gli altri piani restano Victory/Victory Idle. (2) **Attesa in difesa** (idea del PO: Goalkeeper Idle per l'attesa in difesa): ogni corpo di movimento ha due pose ferme, la normale e quella d'attesa (gambe piegate, braccia avanti); in scena difende chi non ha palla — avversari se attacca l'eroe, compagni se la scena è difensiva — e il peso passa dolcemente dall'una all'altra. Portieri, arbitro ed eroe esclusi. Misurato (`attesa-difesa-test.mjs`): scena d'attacco 1.569 campioni in attesa tutti avversari, 0 compagni; scena difensiva 1.536 compagni, 20 avversari = la dissolvenza della scena prima (ammessa fino al 3%). Rosso `__CPM_NO_ATTESA32`: nessuno in attesa. File clip del PO ora `assets/cgtrader-clip-po.glb` (477 KB, 4 clip). **Catena:** logica, save-compat, attesa (+rosso), esultanza, celebration-visible, piede, gesto-vocabolario, sim-motore, motore-unico, eroe-dal-gioco, caduta-eroe, dist-web-partita, piazzati, cross-origine, griglia-mobile, validate-situations, partita-vera verdi; `passo-velocita` (x1,33 in catena, 3/3 verde da solo x1,03-1,06) e `cartellino` rossi in catena come nelle release precedenti — test instabili già in coda.","CPM 7.999.32"],["27/09","7.999.31","**7.999.31 — gesti P1-a: l'eroe esulta davvero e calcia col suo piede.** (1) **Esultanza:** nessun pacchetto aveva una clip di gioia (`celebrate` assente; provino 27/09: `opening` è un gesto col braccio e uno sguardo al polso). Il PO ha mandato 4 FBX Mixamo: sono già sullo scheletro CGTrader, quindi niente riadattamento, solo estrazione con Blender (`bpy` 4.2) e rimozione del nodo `root` (scala 0,01, faceva sparire il corpo). Entrano `Victory` (braccia al cielo, 4,5 s) e `Victory Idle` (salto, 1,9 s) come gesto `lift`; scartate `Golf Putt Victory` (colpo da golf) e `Victory_1` (8,6 s, di riserva). Nuovo asset `assets/cgtrader-clip-esultanze.glb` 206 KB. Riserva procedurale (braccia a V, metodo del cartellino) se la clip non c'è. Misurato: mani sopra la testa in 17-42 fotogrammi per esultanza, clip a 1,0x e montata una volta (`celebration-visible-test`). Rosso `__CPM_NO_ESULTA31`: 0 fotogrammi. (2) **Piede preferito** (decisione PO «mancino: specchiati tiri, passaggi, cross e rigori»): piede di ogni clip misurato sul corpo (picco di velocità del piede) — `kick` e `pass` sinistri, `penalty` destro; nuove specchiate `pass~m`, `penalty~m`; per l'eroe la clip la sceglie `player.foot`, per gli altri resta il sorteggio. Guardiano `piede-preferito-test.mjs`: mancino 5/5 clip sinistre, destro 5/5 destre; rosso `__CPM_NO_PIEDE31` 2-3 su 5 del piede sbagliato. **Dichiarato:** il pallone segue l'osso del piede solo sul tiro; su passaggio e rigore la specchiatura cambia il corpo, non il punto di partenza del pallone; la volée resta fuori (piede incerto). Registro e lista delle clip da cercare: [CLIP_REGISTRY.md](CLIP_REGISTRY.md). **Catena:** logica, save-compat, esultanza (+rosso), piede (+rosso), gesto-vocabolario, sim-motore, pagella, motore-unico, eroe-dal-gioco, passo-velocita, caduta-eroe, dist-web-partita, piazzati, cross-origine, griglia-mobile, validate-situations, partita-vera, celebration-visible verdi. `cartellino` rosso nella catena: **instabile già prima** (misurato da solo: 7.999.30 un rosso su tre, 7.999.31 un rosso su tre, sempre sulla scena gi30 «nessun cartellino visto») → messo in coda come test da stabilizzare, insieme a `passo-velocita`.","CPM 7.999.31"],["27/09","7.999.30","**7.999.30 — i riquadri della home diventano card neutre (collaudo PO: «box fuori standard», Deadline Day giallo e «La tua storia» viola scuro; scelta PO 27/09 «Card neutra»; confermato dal rapporto UI di Codex, criterio 4 sulla Dashboard a tutte le larghezze).** 31 riquadri narrativi della home avevano fondo proprio (27 sfumature scure, 4 tinte chiare) e testo bianco scritto a mano. Ora tutti usano il fondo standard della card (`TH.card`, bordo `TH.cardBorder`). Il colore resta nell'occhiello, portato a contrasto ≥ 4,5 da `semTesto945`; il testo bianco diventa `TH.text`/`TH.muted`, i riquadrini interni `TH.bg`. Ogni valore passa da `_n30(prima, dopo)`: rosso `__CPM_NO_HOME30`. **Guardiano nuovo** `home-riquadri-test.mjs` (carriera alla settimana 19 con Deadline Day e vigilia di finale): «Deadline Day» e «La tua storia» su fondo bianco pieno, nessun testo della home su fondo scuro o sfumato, nessun testo sotto 4,5:1. Il guardiano ha trovato alla prima corsa 3 testi bianco su bianco (colori condizionali di «Il progetto del club» e di altri 6 riquadri) che la conversione automatica non aveva preso: corretti. Col rosso: 19 testi su fondo scuro, «La tua storia» sfumata → FALLITO. Tema scuro: stessi token, quindi segue il tema; non l'ho fotografato. **Fuori da questa release:** Profilo e Nazionale (stesso schema segnalato da Codex) e la Home fuori carriera.","CPM 7.999.30"],["27/09","7.999.29","**7.999.29 — il voto torna proporzionato (collaudo PO: «voto sproporzionato», 9,5 con 2 gol su 4 tiri; decisione PO: doppietta ~8, tripletta ~8,5-9, 10 quasi mai).** Misurato prima (nuovo `tests/brain/voto-gol-census.mjs`, 300 partite del motore): attaccanti con 1 gol 8,16 di media, 2 gol 9,18, 3 gol 9,5 fissi (il tetto), 14 voti ≥ 9 senza gol. Cause: ogni gol valeva 0,95 pieno e al gol si sommava tutto il volume (passaggi, ricezioni, contrasti, fino a +1,5). Ora gol a scalare 0,75 · 0,55 · 0,55 · poi 0,30, assist 0,50 poi 0,35, tiro in porta 0,05, e per l'attaccante un tetto unico di +0,5 al volume; il 10 solo con quattro gol. Dopo: 1 gol 7,40 · doppietta 8,02 · tripletta mediana 8,7 · nessun 9 senza gol · nessun 10. Anche il «voto» del riquadro di fine scena ora è la pagella del motore (era una terza formula). Rosso `__CPM_NO_VOTO29`: il guardiano fallisce (4 controlli su 5). **Nota onesta:** la misura è sul banco del motore, non sulle scene giocate dal giocatore; il caso del PO (2 gol in scena) passa dalla stessa pagella, ma non l'ho riprodotto in una partita vera. **Il guardiano ha trovato un mio errore:** la prima versione ricalcolava la pagella a ogni render del riquadro e `passo-velocita` andava rosso 3 volte su 4 (x1,20-1,32), contro 4 su 4 verdi sulla 7.999.28. Spento il solo riquadro (`__CPM_NO_VOTO20`): verde 3 su 3. Ora il voto si calcola una volta per esito (cache): verde 4 su 4 (x1,04-1,07). **Catena:** logica 43/0, voto-gol, voto-volume, tabellino-schermo, save-compat, sim-motore, tattiche, pagella, motore-unico, eroe-dal-gioco, caduta-eroe, cartellino, dist-web-partita, occasioni-dinamiche, griglia-mobile, validate-situations, partita-vera verdi; dopo la correzione rilanciati da capo quelli della partita live.","CPM 7.999.29"],["27/09","7.999.28","**7.999.28 — le occasioni dell'eroe non sono più un numero fisso deciso al calcio d'inizio (richiesta PO: «devono essere definite in maniera dinamica in base a vari fattori... non un numero fisso scolpito»; decisione PO: forbice 2-6, media ~4).** Prima: numero scelto al fischio d'inizio (2-7) più aggiunte a scatti. Ora una funzione pura `tassoOccasioni28` dà il ritmo atteso (occasioni per 90') dai fattori: forma, morale, fatica pre-partita ed energia in partita, OVR contro prestigio avversario, prestigio delle due squadre, mentalità tattica del mister, peso della partita, meteo, punteggio (sotto nel finale sale), rosso avversario, giallo dell'eroe, gol già segnati. Il live match lo integra minuto per minuto e allunga o accorcia il calendario delle scene non ancora giocate (isteresi di mezza occasione); passo minimo fra due scene; la scena da cross/angolo del brain ora consuma un'occasione invece di aggiungersene una. Non contano: catene (stessa azione), rigori e punizioni dal limite (sempre scena, scelta PO), slot saltati in panchina; chi entra dalla panchina ha minimo 1. Il provino resta a 2-3. **Misurato** (guardiano `occasioni-dinamiche-test.mjs`, due partite di campionato vere col pilota automatico): ritmo neutro 4,00, favorevole 6, sfavorevole 2; eroe favorito in una big → ritmo medio 5,64, 5 scene che contano (10 in tutto con catene e piazzati); eroe stanco e fuori forma in una piccola → ritmo 2,73, 3 scene; media 4,0. Rosso `__CPM_NO_OCC28`: il guardiano fallisce (nessun ricalcolo). **Da tenere d'occhio:** nella partita favorevole le scene totali, catene comprese, sono 10: se al collaudo sembrano troppe, il punto da toccare sono le catene, non il bersaglio. **Catena:** logica 43/0, save-compat, sim-motore, tattiche, eroe-dal-gioco, motore-unico (2,75 gol a partita, mediana 0,27), caduta-eroe, cartellino, dist-web-partita, pagella, piazzati, cross-origine, griglia-mobile, validate-situations, partita-vera verdi. `passo-velocita` e `cartellino` rossi una volta sotto carico (due corsie in parallelo), verdi da soli (passo-velocita 3 su 3, x1,03-1,04); `passo-velocita` oscilla anche sulla 7.999.27 (x1,33 rosso poi x1,02 verde): instabilita' del test, non di questa release.","CPM 7.999.28"],["27/09","7.999.27","**7.999.27 — rigori e punizioni dell'eroe diventano scene (scelta PO: «rigore sempre, punizione se da tiro»).** Misurato prima: 0 rigori e 0 punizioni fra le scene di 6 partite; il motore li calciava senza scena. Ora quando l'eroe è il battitore di un rigore, o di una punizione dal limite tirabile (avanzamento ≥ 78, entro 18 dal centro: la batte lui), il brain dichiara l'occasione con l'origine e aspetta la scena col pallone sul punto (tetto 40 passi, poi calcia lui come prima); il live apre la scena anche fuori dal numero previsto (tetto di sicurezza 4 a partita) e sceglie la scheda del rigore o della punizione diretta. Misurato su 4 partite: 2 scene di punizione diretta dell'eroe (prima 0), 15 scene in tutto. Rigore: guardiano `piazzati-eroe` (rigore chiesto al motore → scena di rigore al primo tentativo; rosso `__CPM_NO_PIAZ27`: nessuna scena). `motore-unico`: 3,00 gol a partita; la mediana 0,20-0,55 ora si misura sulle scene su azione (0,25), i piazzati si riportano a parte (punizioni dirette 0,08-0,16, realistiche) — prima la mediana mischiata era 0,19. Catena verde (18 controlli).","🟡 da collaudare sul telefono"],["26/09","7.999.26","**7.999.26 — il brain decide anche l'origine delle scene dell'eroe: cross, angoli, punizioni in mezzo (collaudo PO: «tutto deve essere deciso dal brain, anche il render 3D degli highlights», «se ne devono vedere di più per dare varietà», «colpo di testa col pallone ai piedi dell'eroe, poi il pallone si sposta all'impazzata e arriva il cross da qualcuno»).** Misurato su 6 partite vere: 17 scene, 14 col pallone già ai piedi dell'eroe, 0 da cross di un compagno, 0 da punizione, 2 da angolo. Ora il cross di un compagno verso l'eroe (anche da angolo o punizione) è un'occasione del motore con la sua ORIGINE (chi crossa, da dove); il live sceglie la scheda coerente nell'intero catalogo; mentre si sceglie il pallone sta sul piede del crossatore e alla risoluzione parte un solo cross a parabola (picco ~5 m) fino all'eroe, che colpisce da lì. Misurato su 4 partite: 14 scene (3,5 a partita contro 2,8), 5 con origine del brain (2 angolo, 2 cross, 1 punizione), 3 dalla fascia (prima 0). **Passi falsi trovati dal guardiano `motore-unico` e corretti:** col crossatore «fermo» sul pallone e 3 scene extra a partita, i gol salivano da 2,25 a 4,75 (tiri della squadra 8-11 → 14-19): tolto il fermo, tolta la richiesta di tipo «cross» (non produceva scene), scene extra ridotte a 1 a partita (tetto PROVVISORIO fino al numero dinamico di occasioni). Scena da palla alta con probabilità propria (0,18+0,6·xG, 0,18-0,40). Corretti anche il colpo che partiva due volte e il salto del pallone di 19-24 u all'arrivo del cross. Catena verde: motore-unico (3,00 gol a partita, mediana dell'eroe 0,25; produzione 2,25), eroe-dal-gioco, partita-vera, sim-motore, tattiche, goleade, voto-volume, validate-situations, career-critical, dist-web-partita, griglia-mobile, passo-velocita, caduta-eroe, cartellino, primo-highlight, test:logic, save-compat. Guardiano `cross-origine` (rosso `__CPM_NO_ORIG26`), censimento `scene-origine-census`.","🟡 da collaudare sul telefono"],["26/09","7.999.25","**7.999.25 — niente più «V» sulle maglie a strisce (dalla lista aperta: strisce del davanti a V).** Misurato sulla geometria della maglia (stessa per i tre livelli di dettaglio): nelle due isole UV del davanti il «verso il basso» è inclinato di +14..+19 e -9..-19 gradi, per cui strisce dritte nella texture si piegavano a V (e i cerchi a V rovesciata). Ora per ogni pixel della maglia si calcola dove sta sul corpo (angolo attorno al busto o al braccio, altezza) e strisce, righine e cerchi si disegnano da lì, coi bordi sfumati: verticali davanti e dietro, lungo il braccio sulle maniche. Mappa cotta una volta per geometria: 32-112 ms in headless, 74% della texture coperta. Foto di prova `tests/character-lab/maglie/strisce-25-*.png` (prima: `strisce-10.png`). Gli altri motivi (maniche, metà, fascia, sciarpa) restano come prima. Guardiano `strisce-corpo` (rosso `__CPM_NO_STRISCE25`).","🟡 da collaudare sul telefono"],["26/09","7.999.24","**7.999.24 — numero del pantaloncino in H1 (collaudo PO: «in zona H1, non G1»).** Stessa coscia sinistra davanti, spostato nella cella sotto della griglia UV (v 0,875-1): parte bassa vicino all'orlo. Foto di prova in `tests/character-lab/maglie/pantaloncino-h1.png`. Guardiano `maglie-numero` invariato (21 pantaloncini numerati).","🟡 da collaudare sul telefono"],["26/09","7.999.23","**7.999.23 — filtrante che non torna indietro, numero sul pantaloncino, numeri della home piu' piccoli (collaudo PO: SIT #25 «014 palla flipper», «012 verticalizzazione all'indietro»; «numero anche sul pantaloncino e kit migliori»; «numeri da restringere»).** Misurato sul filtrante intercettato: dopo il taglio il pallone scivolava di 7,8-8,2 u verso la nostra meta' (la regola 7.403 lo lasciava arretrare fino a 9 u dal punto di perdita); stesso difetto sul filtrante in fuorigioco (8 u). Ora si ferma ai piedi dell'intercettatore, oppure dove si e' fermato in caso di fuorigioco: 0-0,2 u. Il taglio non avviene mai prima del 45% della linea. Pantaloncini CGTrader col numero sulla coscia sinistra davanti (21 su 21 in partita). Qualita' dei kit: provata la trama della texture originale moltiplicata sul colore, ma misurato che aggiungeva solo lo stemma del modello originale come macchia scura sul petto: TOLTA, dichiarato che la qualita' del tessuto NON e' migliorata. Home: valori dei riquadri da 24 a 20 px e mai a capo, numeri della stagione da 32 a 24 px. Guardiani `filtrante-intercetto` (rosso `__CPM_NO_FILTR23`), `maglie-numero` esteso (rosso `CPM_ROSSO=pant` → `__CPM_NO_PANT23`), `numeri-home` (rosso `__CPM_NO_NUM23`).","🟡 da collaudare sul telefono"],["26/09","7.999.22","**7.999.22 — braccia a posto e campo 2D a tutta altezza (collaudo PO: «corrono con le braccia troppo alte, formando una T», «campo 2D inizializzato piccolo»).** Entrambi regressioni MIE: alzare la clavicola (7.999.21) alzava tutto il braccio — misurato in partita 61 gradi dalla verticale contro 38 originali; ora l'omero ruota dello stesso angolo all'indietro e il braccio torna a 36 con la spalla che resta a 21 gradi. Il campo 2D si schiacciava sopra le linguette per la regola 0,6 del 7.999.19: ora il margine in basso si riserva solo con le linguette in fondo. Guardiani `spalle` (esteso alle braccia, rosso `__CPM_NO_BRACCIA22`) e `campo-striscia` (esteso: campo mai schiacciato).","braccio 61° → 36° (originale 38°); campo margine basso 255 → 0 px"],["26/09","7.999.21","**7.999.21 — spalle e proporzioni dei corpi CGTrader (collaudo PO: «spalle troppo spioventi», «troppo grandi rispetto a campo e porta»).** Misurato sulle ossa animate: dalla base del collo all'attacco del braccio la linea scendeva di 37,5 gradi in gioco (42 da fermi). La correzione del 23/09 allargava ma non alzava. Ora le clavicole salgono di 0,45 rad: 21 gradi in gioco, provino fotografico in `tests/character-lab/spalle/provino.png` (da fermi le braccia restano un po' piu' aperte: da giudicare sul telefono). I giocatori in campo sono ridotti del 10% (1,8 → 1,62 unita' contro una porta di 2,44), con le quote di contatto aereo scalate nella stessa misura. Guardiano `spalle` (rosso `__CPM_NO_SPALLE21`); rosso della dimensione `__CPM_NO_SCALA21`.","pendenza collo-spalla 37,5° → 21°"],["26/09","7.999.20","**7.999.20 — voto unico, «una rete», corpo verso la porta (collaudo PO: pagella 8 contro «voto 6.8» in stampa, «1 reti», «colpo di testa non in direzione della porta»).** Il pannello mostrava la pagella del motore ma carriera, stampa e procuratore ricevevano la vecchia formula dei bonus: ora il voto registrato e' quello della pagella. Sui tiri sbagliati il corpo si girava verso il punto dove finiva la palla (misurato: bersaglio a x 41,5 e z 3,8, fuori dai pali): ora guarda dentro la porta. Corretto anche un mio errore del 7.999.19 (senza bersaglio `null+0` girava il corpo verso l'angolo zero): per questo la 7.999.19 non e' andata su main da sola. Guardiani `mira-porta` (rosso `__CPM_NO_MIRA20`) e `tabellino-schermo` esteso al voto (rosso `__CPM_NO_VOTO20`).","angolo corpo-porta mediano 76° → 10-17°"],["26/09","7.999.19","**7.999.19 — goleade, campo 2D, rovesciata (collaudo PO: 10-0, statistiche coperte, «rovesciata al contrario»).** (1) Il motore da solo aveva una CODA di goleade con divari grandi (95 contro 50: 7+ gol nel 5%, scarto 5+ nel 12,5%): ora chi conduce di 3 gestisce (pericolosita' dei tiri al 60%, al 40% da +5). La velocita' 2x NON c'entra: stesse partite identiche a 1x e 2x. Il 10-0 preciso del PO non l'ho riprodotto (Non posso confermarne la causa esatta: 3 gol erano dell'eroe in scena). (2) Campo 2D: con le linguette a meta' schermo una sicura azzerava anche il margine in alto e la porta finiva sotto la striscia delle statistiche; ora il margine in alto si rispetta sempre. (3) Rovesciata: la clip cade all'indietro e manda la palla dietro le spalle, ma il corpo veniva girato verso la porta; ora le da' le spalle. Guardiani `goleade`, `campo-striscia`, `rovesciata-spalle`; `caduta-eroe` non e' piu' instabile.","95 vs 50: 7+ gol 5% → 1,5%, scarto 5+ 12,5% → 6%, media 2,70 → 2,49; rovesciata: angolo corpo-tiro 5° → 167°"],["26/09","7.999.18","**7.999.18 — maglie con numero e motivo del club (appunti PO: «mancano i numeri», «maglie senza strisce/bande»).** I GLB dei corpi CGTrader non contengono le mesh del motivo che il codice accendeva (0 su 7 nodi) e la maglia era colorata in tinta unita. Ora la maglia riceve una texture disegnata: motivo del club (strisce, strisce sottili, cerchi, metà, fascia verticale od orizzontale, banda diagonale) e numero sulla schiena. Il layout UV e' stato misurato con una griglia di prova sul corpo vero. **Resta:** sul petto le strisce verticali diventano una «V» (il pannello frontale e' diviso in due metà ruotate); niente nome sopra il numero. Guardiano `maglie-numero` (rosso `__CPM_NO_MAGLIA18`).","22 maglie numerate per partita, nessun doppione per squadra; 24 texture da 512 px"],["26/09","7.999.17","**7.999.17 — voto credibile (collaudo PO «voto assurdo»: 8,4 senza gol, 17 tiri).** Ricostruito dagli screenshot: l'8,4 era la pagella del motore con un gol dell'eroe nel gioco fluido mai mostrato (il motore 2-0, il tabellone 1-0) — difetto chiuso nel 7.999.13. Ma anche oggi il 7,6% delle partite senza gol dava voto >= 8, sempre per VOLUME (55 passaggi +1,65, 78 palloni ricevuti +0,94): ora il volume ha un tetto e il gol clamorosamente sprecato toglie 0,5 (prima valeva quanto un tiro fuori). Il «17 tiri» del TUO tabellino erano i tiri della squadra: ora sono i tuoi, dalla stessa fonte del riquadro «in numeri». Guardiani `voto-volume` (rosso `__CPM_NO_VOTO16`) e `tabellino-schermo` (rosso `__CPM_NO_TIRI17`).","300 partite: voto >= 8 senza gol 7,6% → 0% (massimo 8,5 → 7,9); pagella media della rosa 7,04 → 6,82; con gol mediana 8,3"],["26/09","7.999.16","**7.999.16 — prima scena meno bloccata (appunti PO sul tap-in: 001 palla lontana, 007 camera che salta).** Profilo CPU all'apertura del PRIMO highlight: un blocco di 2-3,5 s — 1,5-1,8 s per caricare sulla scheda grafica le texture dei corpi CGTrader, 1,4 s per compilare gli shader d'ombra. In quel buco eroe, palla e camera arrivano in fotogrammi diversi. Ora le texture si caricano durante la cronaca (poche per volta) e gli shader con un fotogramma di prova prima del fischio. Guardiano `primo-highlight` (rosso `__CPM_NO_TEX16`: 541 texture in attesa e 4 shader nuovi alla prima scena). **Resta aperto:** il ridimensionamento del canvas 3D all'apertura della scena (775 → 791 px) costa ~1,4 s in headless; sul telefono non misurato.","buco massimo alla prima scena ~3,5 s → ~2,7 s (headless, 2+2 prove); texture in attesa 541 → 0; shader nuovi in scena 4 → 0"],["26/09","7.999.15","**7.999.15 — occasioni dell'eroe dinamiche + taccuino onesto sul «IN RETE».** Via il tetto fisso di 6 occasioni (domanda PO): il ritmo segue il punteggio — 12' di base, 9' se la squadra dell'eroe e' sotto nella ripresa, 16' se conduce di 2+. Il limite resta la partita: palla all'eroe nell'ultimo terzo. La bozza del taccuino diceva «esito miss ma la palla e' finita IN RETE» su tiri usciti accanto al palo o sopra la traversa (soglia 3,9 × 2,7 contro porta 3,66 × 2,44) e sul riposizionamento dopo la scena: ora serve la palla oltre la linea, fra i pali, dentro la scena. Guardiano `taccuino-rete` (rosso `__CPM_NO_RETE15`), rosso motore `__CPM_NO_DIN15`.","300 partite per incrocio: occasioni 0-9 (prima 0-6), gol/partita 2,66-3,19 (prima 2,57-3,23), eroe 8+ tiri 0%"],["26/09","7.999.14","**7.999.14 — «Affari» diventa AGENTE + UFFICIO (scelta PO).** AGENTE: consiglio, procuratore, contratto, mercato, compito settimanale. UFFICIO: patrimonio, staff privato, accademia, beni, investimenti. Barra a sette voci verificata a 360 px. Guardiani di staff, accademia, beni e investimenti aggiornati alla nuova scheda.","barra: 7 voci su 360 px, Opzioni compresa"],["26/09","7.999.13","**7.999.13 — l'eroe tira solo nelle sue scene (partite assurde, gol dell'eroe non mostrati) + pannello fermo.** Nel gioco fluido l'eroe era il giocatore piu' forte e piu' cercato: nel 4% delle partite tirava 10+ volte e quei gol non diventavano highlight. Ora nel gioco fluido non tira (tiro, primo tocco, testa su cross): le sue conclusioni nascono dalle scene; nella simulazione rapida occasioni ogni 12 minuti al massimo, e non piu' di 6. Il pannello Statistiche/Pagelle ha uno spazio fisso (guardiano `pannello-fermo`, rosso `__CPM_NO_FERMO13`). `gol-interazione` ora forza la coincidenza gol+interazione invece di cercarla in una partita fortunata. **Dichiarati aperti:** rigori 0,75 a partita con forte divario di forza (c'era gia'); voto 8,4 senza gol; «esito miss ma palla in rete» su testa e tap-in; apertura di scena col pallone lontano (001); corpo dell'eroe sproporzionato; numeri di maglia e nomi nel 3D; maglie senza strisce.","partite con 10+ tiri dell'eroe 4% → 0% · tiri dell'eroe fuori scena ~1 a partita (rigori e punizioni) · sim rapida 2,58 gol, 23% pareggi · pannello: escursione 21 → 0 px"],["26/09","7.999.12","**7.999.12 — lotto di collaudo PO.** Grafica rotta dopo il background (prato 2D ridisegnato quando la tela e' persa o la pagina torna visibile; guardiano `sfondo-ritorno`, rosso `__CPM_NO_SFONDO12`); «Rivedi l'intro» si apriva sotto le Opzioni; pre-partita con competizione e giornata centrate; codici del taccuino in un menu a tendina; portatore con anello bianco tratteggiato (il giallo sembrava un cartellino); campo 2D nello spazio libero fra le barre; intervista: 5 rilanci per tono che cambiano a ogni partita e scena in scala (tutto in una schermata); il procuratore giudica l'ultima partita in qualunque competizione. **Aperti:** partite con goleade e 17-20 tiri dell'eroe, voto 8,4 senza gol, tabellone 1-0 contro tabellino 2-0, nome della scheda Affari, compagni e difensori fermi.","prato: nero → verde dopo il ritorno (headless, danno simulato) · intervista: scena 40% → 31% dello schermo"],["26/09","7.999.11","**7.999.11 — il sito serve la versione precompilata (app che si riavvia in background).** Nel codice non c'e' nessun ricaricamento: e' Android che chiude la scheda quando pesa, e al ritorno riparte da capo (l'auto-ripresa riporta carriera e partita). La pagina compilava tutto il gioco con Babel a ogni apertura. Ora GitHub Pages pubblica la build precompilata (`tools/build-dist.mjs --web`, verificata offline dalla CI prima del deploy); il sorgente resta per lo sviluppo e per il gate. Guardiano `dist-web-partita`. **Da verificare sul telefono:** se la scheda viene ancora chiusa.","avvio fino alla home 6,9 → 0,3 s · memoria JS alla home 80 → 6 MB · in partita 95 → 21 MB (headless)"],["26/09","7.999.10","**7.999.10 — passaggi credibili (primo dei tre problemi del collaudo) + tabellino giusto.** Misura di partenza (sonda `hl-credibilita`, 18 highlight veri): passaggi falliti che finivano sui piedi dell'avversario, 56% dei compagni e 58% degli avversari fermi, portatore senza nessuno entro 5 m nel 65% dei fotogrammi. (1) Il passaggio intercettato ora e' tagliato da chi puo' arrivarci: prima l'intercettore partiva a 9,1 m dal punto e gli sarebbero serviti 26,8 m/s; ora 6,4 m/s e arriva sul pallone (0,32 m). Guardiano `intercetto-credibile`, rosso `__CPM_NO_INT10`. (2) Segnalazione PO sul 0-3 in trasferta: tabellino di fine gara con le colonne invertite, i due gol su assist non contati, «sotto di due» sul 3-0 — tre difetti corretti. Guardiano `tabellino-lati`, rosso `__CPM_NO_TAB10`. (3) Trovato cercando il gol mancante: un gol del motore spariva dal tabellone quando nello stesso minuto scattava un'interazione (tabellone 3-0 contro motore 4-0 sulla partita riprodotta); ora la scheda aspetta il minuto dopo. Guardiano `gol-interazione`, rosso `__CPM_NO_GOLINTX10`. `delivery-arrival` non termina piu' (aspetta scene che dal 7.999.6 sono ~4 a partita): da sistemare negli strumenti. **Dichiarato:** `pass-landing` e `gesture-window` sono ciechi (misure insufficienti) gia' sulla 7.999.9; compagni fermi e difensori finti sono le prossime due release.","intercettore: velocita' necessaria 26,8 → 6,4 m/s · sopra 10 m/s 93% → 3% · assist senza ricevente: 0 → 2 gol contati"],["25/09","7.999.9","**7.999.9 — Passo 4, secondo gesto: il cartellino.** Prima il fallo subito dall'eroe in scena non passava mai dall'arbitro, e nel 3D l'arbitro usciva dal campo durante ogni highlight. Ora il motore decide il cartellino per chi ferma l'eroe con la stessa regola di ogni fallo della partita; il giallo dell'eroe (deciso dalla partita, con le sue conseguenze di carriera) diventa anch'esso un fatto del motore e va nel tabellino; il cartellino all'avversario entra nei momenti chiave. Nel 3D l'arbitro raggiunge il colpevole, si mette di lato alla camera e alza il braccio col cartellino (nessuna clip nel pacchetto: braccio puntato verso l'alto a mano). Il colpevole è lo stesso corpo che fa il contrasto in scena (regola B4). Difetti trovati dalla misura e corretti: la «mano» agganciava un osso di IK fuori dal braccio; l'arbitro copriva il colpevole (spostato di lato); arbitro e colpevole non erano fra i corpi disegnati. Guardiano `cartellino`, rosso `__CPM_NO_CARTA9`. **Non verificato:** il cartellino all'eroe stesso nella scena vera (coperto solo dal motore da solo); il giudizio a occhio resta al telefono del PO.","400 falli subiti in scena → un cartellino ogni 5,9 (regola della partita 5-6) · arbitro a 2,4 u dal colpevole · mano 0,26 sopra la testa · cartellino visibile in 57-64 fotogrammi"],["25/09","7.999.8","**7.999.8 — Passo 4, primo gesto: l'eroe cade quando subisce fallo.** Su esito «fallo subito» o «punizione conquistata» l'eroe inciampa, resta a terra e si rialza. Le tre clip c'erano già ma la radice era rotta (provino `tests/visual/provino-clip.html`: inciampo che scivola 4 m, a terra che galleggia a 1,1 m, rialzo che vola a 6,4 m): riparate al caricamento. In scena la misura ha trovato altri due difetti, corretti: il gesto veniva rilasciato a fine clip (eroe in piedi fra inciampo e a terra) e la clip era accelerata ×2,4 (il rialzo non arrivava). Guardiano `caduta-eroe`, rosso `__CPM_NO_CADUTA8`. Il guardiano `gesto-vocabolario` era rosso già su 7.999.7: si aspettava `kick` per cross e passaggio, che dal 23/09 hanno clip dedicate nella tabella GESTI; attese allineate (verde + rosso ok). **Resta al telefono del PO il giudizio a occhio.** Prossimi gesti del Passo 4: cartellino dell'arbitro, esultanza, contatto piede-palla.","bacino dell'eroe sopra la radice: inciampo 1,14 → 0,13 m · a terra 0,20 m · rialzo fino a 1,04 m · 0 fotogrammi senza clip"],["25/09","7.999.7","**7.999.7 — fluidità 3D, primo passo: il passo segue la velocità.** Misurato che in headless il pattinamento dei piedi non si può misurare (a corpi 3D accesi la scena avanza 0,2–0,6 s di animazione al minuto): scelta PO «correggi, giudico a occhio». La cadenza della corsa ora è velocità / velocità naturale della clip (misurata una volta su un clone fuori scena), al posto della formula fissa. Guardiano `npm run passo-velocita`, rosso `__CPM_NO_PASSO7`. Da giudicare sul telefono.","rapporto velocità/cadenza fra le fasce: prima 1,75–3,72 (×2,1), ora 3,3 costante (×1,01) · clip «jog» 1,80 altezze-corpo/s"],["25/09","7.999.6","**7.999.6 — l'eroe dal gioco e il banco che gioca il motore vero.** (1) Il banco e la simulazione passavano i ruoli con nomi che il motore non riconosce: la taratura storica girava senza reparti. Col motore vero 3,85 gol e 33 tiri: ritaratura su 4 parametri misurati. (2) Eroe dal gioco (scelta PO): niente bonus +26, niente spostamento su punti fissi, niente scena forzata dopo 14'; i compagni lo cercano per fiducia e forma, un difensore lo marca; se all'85' non c'è stata scena la cronaca lo dice. (3) Gol del motore all'89' ora arriva sul tabellone. Guardiano `npm run eroe-dal-gioco`, rossi `__CPM_NO_EROEGIOCO` e `__CPM_NO_GOL90`.","banco 1000 con stili: 2,76 gol (reali 2,82), in porta 35,7% (35), gol/tiro 11,2% (11,1), pareggi 22% · simulazione 2,81 gol, 25% pareggi · ricezioni eroe 58,5 → 46,3 · eroe 0,65 gol a partita · scene 4/4 nate da un fatto"],["25/09","7.999.5","**7.999.5 — tattiche nel motore (punto B).** Cinque manopole per squadra (pressing, linea, ampiezza, mentalità, diretto/palleggio): squadra dell'eroe = stile del mister (neutro in nazionale), avversario = persona NPC; valgono nel live e nella simulazione. Ritaratura nella stessa release: banco 1000 partite per scenario con stili a caso verde su tutte le bande reali, stile neutro identico a prima. Guardiano `npm run tattiche`, rosso `__CPM_NO_TATTICA`. Aperti: PPDA del contropiede non sopra il neutro; costo difensivo della linea alta ancora piccolo.","pressing PPDA 8,5 vs 10,5 e recuperi +3,8 · contropiede lanci +30%, recuperi −2 · possesso palla +3,4 punti · sim 2,42 gol"],["25/09","7.999.4","**7.999.4 — motore unico passo 2.** La partita dell'eroe simulata (campionato e nazionale) la gioca il motore del live senza grafica: stesso seme ⇒ stessa partita, risultato con la stessa forma (salvataggi invariati). Il Poisson resta per le partite fra altri club e per le amichevoli del ritiro (punto aperto). Misura del tempo sul telefono: Opzioni → Strumenti di collaudo → «Misura». Guardiano `npm run sim-motore`, rosso `__CPM_NO_SIMV2`.","headless 73-105 ms a partita, prima partita della sessione fino a 486 ms · gol 2,39 · pareggi 32% · carriera 3/3 settimane dal motore · career-sim 2 stagioni OK"],["25/09","7.999.3","**7.999.3 — motore unico passo 3.** Gli highlight su azione erano già decisi dal dado del motore; restavano due strade fuori: rigore e punizione dell'eroe (dado proprio, gol mai nel tabellino del motore) e il gol subito in scena difensiva (tabellone sì, motore no). Ora li decide e li conta il motore. Guardiani `npm run risolvi-eroe` e `motore-unico` (tabellone = motore a fine partita), rosso `__CPM_NO_RISOLVI`.","6/6 piazzati decisi e allineati · rosso: 0/2 · rigore p≈0,74, punizione p≈0,29-0,33 · gate 191 verde"],["25/09","7.999.2","**7.999.2 — motore unico passo 1.** Direzione PO: 2D + highlight dell'eroe, il 3D continuo è ritirato. Le patch v2 vivono in src/14; i gol della 2D li decide solo il motore (microsim spento); niente più turni forzati dalla quota della vecchia cronaca; il tiro dell'eroe vale una «grande occasione» (scelta PO). Guardiano `npm run motore-unico`, rosso `__CPM_NO_V2`.","falli 8-9 → 20 · tiri 10,6 per squadra · gol 3,0 (4 partite) · mediana gol eroe 0,33 · cronaca dal motore 95% · gate 191 verde"],["25/09","","**Autocritica brain «partita vera» (richiesta PO).** Documento `docs/AUTOCRITICA-BRAIN-2026-09-24.md`: A in parte · **B no** (le tattiche non entrano nel motore) · C in parte (occasioni dell'eroe fabbricate) · D in parte (un solo corpo per evento, niente foot-lock). Nuova rotta: tattiche nel motore, eroe dal gioco, metriche PPDA e foot skating ratio con fonti.","9 coefficienti contro 4 comportamenti nelle 7.980-7.987"],["25/09","","**Decisioni PO sulla rotta A-B-C-D** (questionario). Ordine: Passo 3 → Passo 2 → Tattiche (entrambe le squadre, ritaratura nella stessa release) → Eroe dal gioco (meno scene ma vere, almeno una a partita) → Fluidità 3D solo sui 3-5 corpi in scena. Simulazione rapida col motore sotto 0,3 s.","dettaglio nella sezione 6 di `docs/AUTOCRITICA-BRAIN-2026-09-24.md`"],["24/09 00:05","","**Piano grafico chiuso.** Ultimi punti: telecronisti con figurina (Wanda Trevisiol), postura dei corpi CGTrader, LED dello stadio che non vola piu' negli stadi piccoli (era quello il «tabellone volante»), ombrelli/sciarpe col meteo, Opzioni senza «Grafica»","spalle 0,357→0,396 m · testa in corsa 58°→43° · LED y 23,5→2,42 (tribuna 6,44) · figurina giornalista_f nel commento tecnico · Opzioni: Grafica/Musica/Telecronaca assenti · test:logic 43/43"],["24/09","7.999.1","**7.999.1 in produzione.** Conflitto 1 della Fase 0 corretto (scelta PO): il tabellino dell'intervista in trasferta non inverte più i gol (rosso `__CPM_NO_TAB25`, sonda intervista24 col caso trasferta).","CI locale 8/8"],["24/09","7.999.0","**7.999.0 in produzione.** La tab «Staff» diventa «Affari» (💼), scelta PO; id interno invariato.","CI locale 7/7"],["24/09","7.998.0","**7.998.0 in produzione.** Dal telefono del PO: coppe europee in Home come sezione standard (nome per intero, fase, punti, prossima partita) subito dopo la partita della settimana; pulsante appiccicato opaco senza fascia (il gradiente era all'80%); Formazioni in uno schermo (807 → 597 px, pressing tolto; sonda formazioni24); intervista con la scena nel 40% alto (le risposte entrano).","CI locale 10/10"],["24/09","7.997.0","**7.997.0 in produzione.** Premiazione: palco rettangolare, coppa per i manici che non copre mai il volto (sovrapposizione 0; in altezza era già 0,31x l'eroe, il difetto era la presa), squadra in due file ferme dietro il palco (velocità 0, distanza minima 1,0), camera più vicina.","CI locale 8/8 + partita-vera"],["24/09","7.996.0","**7.996.0 in produzione.** Commenti sulle anteprime: figurine col volto intero sotto i 120 px (rapporto foto 0,80-0,93 → ≥1,00; sonda figurina-volto24), niente cognome doppione sul podio, coppa del pullman senza piedistallo al 40% dell'eroe.","CI locale 9/9"],["24/09","7.995.0","**7.995.0 in produzione.** Intervista: il tavolo della sala stampa disegnato (tovaglia del club, segnaposto, microfoni delle testate vere, bottiglietta dello sponsor).","CI locale 10/10"],["24/09","7.994.0","**7.994.0 in produzione.** Intervista a tre passi (scelte PO): tabellino sul pannello, sala viva, rilancio del giornalista con No comment, prima pagina di domani con gli effetti mostrati dopo la scelta (direttiva 6.5.4).","CI locale 13/13"],["24/09","7.993.0","**7.993.0 in produzione.** Fisarmoniche su ~60 sezioni (operative aperte, da consultare chiuse) e 14 popup fatti a mano nel Modal standard (scelte PO).","CI locale 13/13 · GitHub ✅"],["24/09","7.992.0","**7.992.0 in produzione.** Patrimonio F4: beni sobri/vistosi con reazione di tifosi e mister; il patrimonio conta nell'eredità (fino a +60 al Legacy, card al ritiro: misurato +40 = 18+10+12). Segnalazioni PO: cambio procuratore nel Modal standard; fisarmoniche su Status, Statistiche, Lo spogliatoio; Coppe e Nazionale spiegano cosa arriva (corretto un dato falso: la Coppa Nazionale c'è dal primo anno pro); via la card Scorciatoie.","CI locale 13/13"],["24/09","7.991.0","**7.991.0 in produzione.** Patrimonio F3: investimenti a fine stagione, resa deterministica. Misura su 400 stagioni: prudente +3,44% [2;5], bilanciato +3,11% [−4;10], rischioso +5,68% [−20;29,9].","CI locale 10/10"],["24/09","7.990.0","**7.990.0 in produzione.** Patrimonio F2: accademia col tuo nome (un ragazzo deterministico a fine stagione, popolarità +2/+4, pausa automatica a fondi finiti). La tab Agente diventa **Staff** (id interno invariato).","CI locale 9/9"],["24/09","7.989.0","**7.989.0 in produzione.** Patrimonio F1: staff privato a 3 livelli (trainer, nutrizionista, fisioterapista, mental coach). Livello 1 = costi/effetti storici; fisio L3 −23,9% infortuni (4000 semi), mental coach +0,54/+1,54 morale a settimana.","CI locale 9/9"],["24/09","7.988.0","**7.988.0 in produzione — CI di GitHub di nuovo verde.** Dal 7.980 il job validate su main falliva a intermittenza (final-state gi152: un corpo a x 105-107, dentro la rete avversaria); non riproducibile in locale. Recinto: nessun corpo oltre ±50,5 durante la partita (rosso `__CPM_NO_RECINTO24`). Run GitHub sul commit promosso: success. Un solo run verde non prova che l'intermittenza sia sparita: la sorveglio sui prossimi.","GitHub ✅"],["24/09","7.987.0","**7.987.0** (promossa con la 7.988). Brain: tiri 17,1 → 15,4 e quota in porta 23% → 32% (Premier 2024-25: 12,96 e 35%, StatMuse); tetto unico al passo a fine battito (test:logic «passi umani» 43/43). Ancora aperti: tiri +2,4 sopra il riferimento, passaggi 240 al 91% contro 446 all'84%.","CI locale 7/7"],["24/09","7.986.0","**7.986.0 in produzione.** Intervista con la figurina dell'eroe; offerta con ultime 5, ruolo in rosa e allenatore (mister deterministico per club). ⚠️ GitHub rossa (final-state gi152), sistemata dalla 7.988.","CI locale 7/7 · GitHub rossa"],["24/09","7.985.0","**7.985.0 in produzione.** Via i birilli dalle scene: l'unica folla a cilindro+sfera visibile era quella del pullman (7.982); ora folla dipinta lungo i marciapiedi, nessuna figura 3D (rosso `__CPM_BIRILLI23`). In partita nessun birillo (sonda birilli.mjs).","CI 7/7 in locale · ⚠️ GitHub rossa (final-state gi152)"],["24/09","7.984.0","**7.984.0 in produzione.** Brain ai numeri veri (Premier League 2024-25, StatMuse, 20 squadre x 38): fuorigioco 3,4 → 1,7 (vero 1,69) · falli 17,8 → 12,1 (vero 11,04; 1,55 erano punizioni da fuorigioco contate come falli). Ritirati due tentativi sui tiri che la misura non reggeva. test:logic «passi umani» rosso (12,7u) per la corsa del cross della 7.980: dimezzata, 43/43.","CI 7/7 + partita-vera"],["24/09","7.983.0","**7.983.0 in produzione.** fisarmoniche su 9 sezioni (Club, Carriera, Agente); tendina della lega senza l'anello spesso dopo la scelta (misurato: fuoco no, outline 0, bordo normale); premi di fine stagione a podio; card «La tua stagione». Catena CI 7/7 verde (gate 14/14 fp 00001505).","CI 7/7"],["24/09","7.982.0","**7.982.0 in produzione.** pullman scoperto rifatto: 8 corpi CGTrader (testimone cg23=8), braccia all'apice misurato (0,475 della clip), eroe con la coppa, finestre accese, tifosi con sciarpe, coriandoli a taglia fissa, regia senza l'alta da dietro. Rosso `__CPM_NO_PULLMAN23`. Catena 7/7 verde.","CI 7/7"],["24/09","7.981.0","**7.981.0 in produzione.** commenti PO sulle anteprime: premiazione di squadra (11 attori su 11, prima 4), una finestra alla volta, freno all'avanzamento (19/20 tocchi trattenuti; rosso: settimana saltata), situazione del club nell'offerta, galà con presentatori, toast centrato. ⚠️ Due gate rossi (`motion` 12/21 e 11/21) causati da processi browser in parallelo, verde 14/14 da solo: **i rituali si lanciano uno alla volta**.","CI 7/7 in locale · ⚠️ GitHub rossa (final-state gi152)"],["24/09","7.980.0","**7.980.0 in produzione.** POC CGTrader + brain «partita vera» su `main`; CI 7/7 verificata a posteriori sul commit promosso.","CI 7/7 in locale · ⚠️ GitHub rossa (final-state gi152)"],["24/09","","**Ciclo «partita vera» — Fase 0 (sola lettura) consegnata, in attesa dell'ok del PO.** Report: https://claude.ai/artifact/YDF83D6q3bUJUVxxdX5dKv — almeno 5 punti del codice decidono la partita (sim, microsim, motore del possesso, highlight, render) con semi diversi; tabellino post-partita invertito in trasferta; 2 conflitti con lavori consegnati (7.994 tabellino intervista in trasferta; taratura brain 7.984/7.987 misurata senza decideExecution) riportati, non corretti.","nessun file di gioco toccato"],["24/09","","**Fase 1 «partita vera» consegnata, in attesa dell'ok del PO.** Proposta: https://claude.ai/artifact/MAEEsrYmVppDedLmCTHnRp — il motore del possesso diventa l'unica fonte di verità (gol compresi), sim rapida = motore senza grafica (56 ms a partita in Node, stesso seme = stesso tabellino), bande reali da 4.337 partite (football-data.co.uk, 4 campionati, 2022-2025), criteri del 3D, gesti esistenti/mancanti, piano di test.","nessun file di gioco toccato"],["24/09","","**Fase 2 «partita vera» consegnata, in attesa dell'approvazione del PO.** Report: https://claude.ai/artifact/TVEZK7inUcfavNusvEYAR8 · prototipo: https://antoniovairo-rgb.github.io/Carrier-manager-/prototipo/partita-vera/ — un solo motore (src/14 + 22 patch generate), banco verde su 1000 partite per scenario contro 4.337 partite vere, determinismo 20/20 semi, rosso col motore di oggi (0 gol nel 100%); vista 3D verticale r128 con corpi lod2, HUD, scelta dell'eroe, gesti, replay dagli stessi fotogrammi. Da misurare sul telefono: FPS e caricamento.","gioco non toccato"],["24/09","","**Prototipo ritoccato dopo il collaudo PO sul telefono.** FPS misurati dal PO: 60,7-61,1 medi e 60,6 all'1% (obiettivo ≥55/≥40 raggiunto), caricamento 1,2-2,0 s. Correzioni: contatore FPS senza le pause della pagina, scheda grafica preparata all'avvio (scatto del 45' a 30,5 all const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
const testo=s=>String(s).replace(/\*\*|`/g,'');
// stato normalizzato: la prima parola chiave, per il menu a tendina
const statoBase=s=>{const t=testo(s).toUpperCase();
  for(const k of ['FATTO','DOPPIONE','VERIFICATO','CHIUSO','CHIUSA','PARZIALE','APERTO','IN CORSO','IN CODA','IN ATTESA','DA COLLAUDARE','NON RIPRODOTTO','SOSPESO','NON POSSO CONFERMARLO'])if(t.startsWith(k))return k.charAt(0)+k.slice(1).toLowerCase();
  return testo(s).split(/[ —(,]/)[0]||'—';};
const chipCls=b=>/^(Fatto|Doppione|Verificato|Chiuso|Chiusa)/.test(b)?'c-ok':/^(Parziale|In corso)/.test(b)?'c-run':/^In coda/.test(b)?'c-wait':/^(Aperto|Non riprodotto)/.test(b)?'c-open':'c-wait';
let tab=0;try{const v=localStorage.getItem('gov-tab');if(v!==null&&DATI.tabs[+v])tab=+v;}catch(e){}
const F={};let ord=null;
function valMenu(T,c,v){return T.cols[c]==='Stato'?statoBase(v):testo(v)||'—';}
function disegna(){
  const T=DATI.tabs[tab];
  $('#tabs').innerHTML=DATI.tabs.map((x,i)=>'<button role="tab" type="button" id="tab-'+x.id+'" aria-selected="'+(i===tab)+'" data-i="'+i+'">'+x.nome+' <span class="meta">'+x.rows.length+'</span></button>').join('');
  const filtri=T.cols.map((c,ci)=>{
    if(T.menu.includes(c)){const vals=[...new Set(T.rows.map(r=>valMenu(T,ci,r[ci])))].sort((a,b)=>a.localeCompare(b,'it',{numeric:true}));
      return '<th><select class="ctl" id="f-'+T.id+'-'+ci+'" data-c="'+ci+'" aria-label="Filtra '+esc(c)+'"><option value="">tutti</option>'+vals.map(v=>'<option'+(F[T.id+ci]===v?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select></th>';}
    return '<th><input class="ctl" id="f-'+T.id+'-'+ci+'" data-c="'+ci+'" type="search" placeholder="filtra" aria-label="Filtra '+esc(c)+'" value="'+esc(F[T.id+ci]||'')+'"></th>';}).join('');
  $('#t').innerHTML='<thead><tr>'+T.cols.map((c,ci)=>'<th><button type="button" data-s="'+ci+'">'+esc(c)+' <span class="fr">'+(ord&&ord.c===ci?(ord.d>0?'▲':'▼'):'')+'</span></button></th>').join('')+'</tr><tr class="filtri">'+filtri+'</tr></thead><tbody id="tb"></tbody>';
  righe();
}
function righe(){
  const T=DATI.tabs[tab],q=$('#cerca').value.trim().toLowerCase();
  let R=T.rows.filter(r=>{
    for(let ci=0;ci<T.cols.length;ci++){const f=F[T.id+ci];if(!f)continue;
      if(T.menu.includes(T.cols[ci])){if(valMenu(T,ci,r[ci])!==f)return false;}
      else if(!testo(r[ci]).toLowerCase().includes(f.toLowerCase()))return false;}
    return !q||r.some(c=>testo(c).toLowerCase().includes(q));});
  if(ord)R=[...R].sort((a,b)=>ord.d*testo(a[ord.c]).localeCompare(testo(b[ord.c]),'it',{numeric:true}));
  $('#tb').innerHTML=R.length?R.map(r=>'<tr>'+r.map((c,ci)=>{const col=T.cols[ci];
    if(col==='Stato'){const b=statoBase(c);return '<td class="larga"><span class="chip '+chipCls(b)+'">'+esc(b)+'</span><br>'+md(c)+'</td>';}
    const cls=T.larga.includes(col)?'larga':(col==='ID'||col==='Versione'?'id':'');
    return '<td class="'+cls+'">'+md(c)+'</td>';}).join('')+'</tr>').join(''):'<tr><td class="vuoto" colspan="'+T.cols.length+'">Nessuna riga con questi filtri. Usa «Azzera filtri».</td></tr>';
  $('#conta').textContent=R.length+' di '+T.rows.length+' righe';
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;tab=+b.dataset.i;ord=null;try{localStorage.setItem('gov-tab',tab);}catch(err){}disegna();});
$('#t').addEventListener('input',e=>{const c=e.target.dataset.c;if(c==null)return;F[DATI.tabs[tab].id+c]=e.target.value;righe();});
$('#t').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b)return;const c=+b.dataset.s;ord=ord&&ord.c===c?(ord.d>0?{c,d:-1}:null):{c,d:1};disegna();});
$('#cerca').addEventListener('input',righe);
$('#azzera').addEventListener('click',()=>{for(const k in F)delete F[k];$('#cerca').value='';ord=null;disegna();});
if(DATI.meta.notte){const n=$('#notte');n.hidden=false;n.className='chip '+DATI.meta.notte.cls;n.textContent=DATI.meta.notte.testo;}
$('#meta').textContent='CPM '+DATI.meta.ver+' · commit '+DATI.meta.commit+' · generata '+DATI.meta.quando;
disegna();
</script>
