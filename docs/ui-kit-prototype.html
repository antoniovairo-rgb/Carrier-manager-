<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CPM UI Kit — Style Guide (prototipo)</title>
<!-- Setup identico al gioco (CARRIER-MANAGER-AV.html righe 31-40, 225): React 18.2 + Babel 7.23.6, preset react. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;}
  #root{min-height:100vh;}
  .cpm-num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;}
  /* scaffold di layout SOLO (nessun colore): affianca LIGHT|DARK, stack su mobile */
  .duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const React = window.React;
const { useState } = React;

/* ===== TOKENS (inline da src/theme.js — unica fonte di verita') ===== */
const T = {
  brand: { base:"#8e1f33", dark:"#6a1326", tint:"#f7e9ec", border:"#e3c3cb", on:"#ffffff" },
  surfaces: {
    light: { bg0:"#f0f7ff", bg1:"#f4f7fb", bg2:"#ffffff", text:"#1e293b", text2:"#64748b", muted:"#94a3b8", border:"#e6edf5", scrim:"rgba(15,23,42,0.45)" },
    dark:  { bg0:"#0f172a", bg1:"#172033", bg2:"#1e293b", text:"#f1f5f9", text2:"#94a3b8", muted:"#64748b", border:"#2c3a52", scrim:"rgba(0,0,0,0.62)" },
    cinematic: { bg0:"#050810", bg1:"#0b1224", bg2:"#141c30", text:"#ffffff", text2:"#94a3b8", muted:"#64748b", border:"#243049", scrim:"rgba(0,0,0,0.62)" },
  },
  semantic: {
    success:  { solid:"#16a34a", on:"#ffffff", light:{fg:"#166534",bg:"#f0fdf4",bd:"#bbf7d0"}, dark:{fg:"#86efac",bg:"#102b1d",bd:"#1d4d33"} },
    danger:   { solid:"#dc2626", on:"#ffffff", light:{fg:"#b91c1c",bg:"#fff1f2",bd:"#fecaca"}, dark:{fg:"#fca5a5",bg:"#2c1518",bd:"#5b2530"} },
    warning:  { solid:"#d97706", on:"#ffffff", light:{fg:"#92400e",bg:"#fef3c7",bd:"#fcd34d"}, dark:{fg:"#fcd34d",bg:"#2a1f0c",bd:"#5a430f"} },
    info:     { solid:"#2563eb", on:"#ffffff", light:{fg:"#1e40af",bg:"#eff6ff",bd:"#bfdbfe"}, dark:{fg:"#93c5fd",bg:"#16233b",bd:"#1e3a5f"} },
    neutral:  { solid:"#64748b", on:"#ffffff", light:{fg:"#1e293b",bg:"#f4f7fb",bd:"#e6edf5"}, dark:{fg:"#f1f5f9",bg:"#172033",bd:"#2c3a52"} },
    highlight:{ solid:"#f59e0b", grad:"linear-gradient(135deg,#f59e0b,#d97706)", on:"#ffffff", gold:"#b45309" },
  },
  outcome: {
    win:  { light:{fg:"#15803d",bg:"#e7f6ec",bd:"#b7e4c4"}, dark:{fg:"#4ade80",bg:"#12321f",bd:"#1d4d33"} },
    draw: { light:{fg:"#a16207",bg:"#fbf3dd",bd:"#f0dca6"}, dark:{fg:"#fbbf24",bg:"#2c2410",bd:"#4a3a12"} },
    loss: { light:{fg:"#b91c1c",bg:"#fbe9e9",bd:"#f3c9c9"}, dark:{fg:"#f87171",bg:"#331519",bd:"#5b2530"} },
  },
  spacing: { xs:4, sm:8, md:12, lg:16, xl:24, xxl:32 },
  radius: { sm:8, md:12, lg:16, pill:999 },
  shadow: {
    light:{ s1:"0 2px 12px rgba(0,0,0,0.07)", s2:"0 4px 16px rgba(0,0,0,0.10)", s3:"0 12px 40px rgba(0,0,0,0.18)" },
    dark: { s1:"0 2px 12px rgba(0,0,0,0.4)",  s2:"0 4px 16px rgba(0,0,0,0.5)",  s3:"0 12px 48px rgba(0,0,0,0.6)" },
  },
  typography: {
    family:"-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif",
    size:{ caption:11, small:12, body:13, bodyLg:15, subhead:17, title:20, h:24, display:32 },
    weight:{ regular:400, medium:500, semibold:600, bold:700, black:800 },
    tracking:{ normal:0, wide:1.5, wider:2 },
  },
  zIndex:{ base:1, overlay:3, sticky:16, dropdown:60, modal:9998, toast:9999, top:99999 },
};

/* ===== helper: ricavano SEMPRE dai TOKENS (mai literal nei componenti) ===== */
const isDark = (m) => m !== "light";
const sur = (m) => T.surfaces[m] || T.surfaces.light;
const shadow = (m, lvl) => (isDark(m) ? T.shadow.dark : T.shadow.light)["s" + (lvl || 1)];
const semTint = (m, name) => (isDark(m) ? T.semantic[name].dark : T.semantic[name].light);
const outTint = (m, name) => (isDark(m) ? T.outcome[name].dark : T.outcome[name].light);

/* ===== COMPONENTI (zero valori hardcoded — tutto da T) ===== */

function Card({ mode, tone, children, style }) {
  const s = sur(mode);
  let bg = s.bg2, bd = s.border, fg = s.text;
  if (tone) { const tt = semTint(mode, tone); bg = tt.bg; bd = tt.bd; fg = tt.fg; }
  return (
    <div style={{ background: bg, border: "1px solid " + bd, borderRadius: T.radius.md, padding: T.spacing.lg, boxShadow: shadow(mode, 1), color: fg, ...style }}>
      {children}
    </div>
  );
}

function SectionHeader({ mode, children, accent }) {
  const s = sur(mode);
  const col = accent ? T.semantic[accent].solid : s.text2;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: T.spacing.sm, marginBottom: T.spacing.md }}>
      {accent ? <span style={{ width: 3, height: 14, borderRadius: T.radius.sm, background: col }} /> : null}
      <span style={{ fontSize: T.typography.size.caption, fontWeight: T.typography.weight.bold, letterSpacing: T.typography.tracking.wide, textTransform: "uppercase", color: col }}>{children}</span>
    </div>
  );
}

function Btn({ mode, v, children, disabled }) {
  const s = sur(mode);
  const styles = {
    primary:   { background: T.brand.base,             color: T.brand.on,             border: "1px solid " + T.brand.base },
    success:   { background: T.semantic.success.solid, color: T.semantic.success.on,  border: "1px solid " + T.semantic.success.solid },
    danger:    { background: T.semantic.danger.solid,  color: T.semantic.danger.on,   border: "1px solid " + T.semantic.danger.solid },
    secondary: { background: s.bg2,                    color: s.text2,                border: "1px solid " + s.border },
    ghost:     { background: "transparent",            color: s.text2,                border: "1px solid " + s.border },
  };
  const st = styles[v] || styles.primary;
  return (
    <button disabled={disabled} style={{ ...st, padding: T.spacing.sm + "px " + T.spacing.lg + "px", minHeight: 40, borderRadius: T.radius.sm, cursor: disabled ? "not-allowed" : "pointer", fontFamily: "inherit", fontSize: T.typography.size.body, fontWeight: T.typography.weight.bold, letterSpacing: T.typography.tracking.normal, opacity: disabled ? 0.4 : 1 }}>
      {children}
    </button>
  );
}

function StatBlock({ mode, value, label, meaning }) {
  const s = sur(mode);
  const col = meaning === "growth" ? T.semantic.success.solid
            : meaning === "decline" ? T.semantic.danger.solid
            : meaning === "energy" ? T.semantic.info.solid
            : s.text;
  return (
    <div style={{ textAlign: "center", padding: T.spacing.sm }}>
      <div className="cpm-num" style={{ fontSize: T.typography.size.h, fontWeight: T.typography.weight.black, color: col, lineHeight: 1 }}>{value}</div>
      <div style={{ fontSize: T.typography.size.caption, color: s.muted, textTransform: "uppercase", letterSpacing: T.typography.tracking.wide, marginTop: T.spacing.xs }}>{label}</div>
    </div>
  );
}

function Badge({ mode, tone, children }) {
  const tt = semTint(mode, tone || "neutral");
  return <span style={{ display: "inline-block", background: tt.bg, color: tt.fg, border: "1px solid " + tt.bd, borderRadius: T.radius.pill, padding: "3px 10px", fontSize: T.typography.size.caption, fontWeight: T.typography.weight.bold, letterSpacing: T.typography.tracking.normal }}>{children}</span>;
}

function OutcomePill({ mode, kind }) {
  const tt = outTint(mode, kind);
  const label = kind === "win" ? "VITTORIA" : kind === "draw" ? "PAREGGIO" : "SCONFITTA";
  return <span style={{ display: "inline-block", background: tt.bg, color: tt.fg, border: "1px solid " + tt.bd, borderRadius: T.radius.pill, padding: "3px 12px", fontSize: T.typography.size.caption, fontWeight: T.typography.weight.bold }}>{label}</span>;
}

function ResultRow({ mode, home, away, hs, as, kind }) {
  const s = sur(mode);
  const tt = outTint(mode, kind);
  const letter = kind === "win" ? "V" : kind === "draw" ? "P" : "S";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: T.spacing.md, padding: T.spacing.sm + "px " + T.spacing.md + "px", background: s.bg2, border: "1px solid " + s.border, borderRadius: T.radius.sm }}>
      <span style={{ flex: 1, fontSize: T.typography.size.body, fontWeight: T.typography.weight.semibold, color: s.text, textAlign: "right" }}>{home}</span>
      <span className="cpm-num" style={{ fontSize: T.typography.size.bodyLg, fontWeight: T.typography.weight.black, color: s.text }}>{hs}-{as}</span>
      <span style={{ flex: 1, fontSize: T.typography.size.body, fontWeight: T.typography.weight.semibold, color: s.text }}>{away}</span>
      <span style={{ width: 22, height: 22, borderRadius: T.radius.sm, background: tt.bg, color: tt.fg, border: "1px solid " + tt.bd, display: "flex", alignItems: "center", justifyContent: "center", fontSize: T.typography.size.caption, fontWeight: T.typography.weight.black }}>{letter}</span>
    </div>
  );
}

const STANDINGS = [
  { pos: 1, team: "FC Salernum", p: 12, gd: "+18", pts: 30, you: true },
  { pos: 2, team: "AC Fiorenza", p: 12, gd: "+11", pts: 26, you: false },
  { pos: 3, team: "Real Castilla", p: 12, gd: "+9", pts: 24, you: false },
  { pos: 4, team: "Nord United", p: 12, gd: "+3", pts: 19, you: false },
];
function StandingsTable({ mode }) {
  const s = sur(mode);
  const cell = { padding: T.spacing.sm + "px " + T.spacing.md + "px", fontSize: T.typography.size.small };
  return (
    <div style={{ background: s.bg2, border: "1px solid " + s.border, borderRadius: T.radius.md, overflow: "hidden" }}>
      <div style={{ display: "grid", gridTemplateColumns: "40px 1fr 40px 52px 44px", background: s.bg1, color: s.text2, fontSize: T.typography.size.caption, fontWeight: T.typography.weight.bold, textTransform: "uppercase", letterSpacing: T.typography.tracking.wide }}>
        <div style={cell}>#</div><div style={cell}>Club</div><div style={{ ...cell, textAlign: "center" }}>PG</div><div style={{ ...cell, textAlign: "center" }}>DR</div><div style={{ ...cell, textAlign: "center" }}>Pt</div>
      </div>
      {STANDINGS.map((r, i) => (
        <div key={r.pos} style={{ display: "grid", gridTemplateColumns: "40px 1fr 40px 52px 44px", alignItems: "center", background: r.you ? T.brand.tint : (i % 2 ? s.bg1 : s.bg2), borderLeft: r.you ? "3px solid " + T.brand.base : "3px solid transparent", color: r.you ? T.brand.dark : s.text }}>
          <div style={cell}><span style={{ display: "inline-flex", width: 20, height: 20, borderRadius: T.radius.pill, background: r.you ? T.brand.base : s.bg1, color: r.you ? T.brand.on : s.text2, alignItems: "center", justifyContent: "center", fontSize: T.typography.size.caption, fontWeight: T.typography.weight.bold }}>{r.pos}</span></div>
          <div style={{ ...cell, fontWeight: r.you ? T.typography.weight.bold : T.typography.weight.semibold }}>{r.team}</div>
          <div className="cpm-num" style={{ ...cell, textAlign: "center" }}>{r.p}</div>
          <div className="cpm-num" style={{ ...cell, textAlign: "center" }}>{r.gd}</div>
          <div className="cpm-num" style={{ ...cell, textAlign: "center", fontWeight: T.typography.weight.black }}>{r.pts}</div>
        </div>
      ))}
    </div>
  );
}

function ModalDemo({ mode }) {
  const s = sur(mode);
  return (
    <div style={{ position: "relative", background: s.scrim, borderRadius: T.radius.md, padding: T.spacing.xl, minHeight: 240, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ width: "100%", maxWidth: 320, background: s.bg2, border: "1px solid " + s.border, borderRadius: T.radius.lg, boxShadow: shadow(mode, 3), padding: T.spacing.xl, color: s.text }}>
        <div style={{ textAlign: "center", fontSize: T.typography.size.h }}>{"\u{1F30D}"}</div>
        <div style={{ textAlign: "center", fontSize: T.typography.size.subhead, fontWeight: T.typography.weight.black, marginTop: T.spacing.xs }}>Coppa delle Nazioni</div>
        <div style={{ textAlign: "center", fontSize: T.typography.size.caption, color: s.text2, marginBottom: T.spacing.md }}>S.10 · Italia</div>
        <div style={{ display: "flex", flexDirection: "column", gap: T.spacing.xs, marginBottom: T.spacing.md }}>
          <ResultRow mode={mode} home="Italia" away="Germania" hs={2} as={1} kind="win" />
          <ResultRow mode={mode} home="Italia" away="Spagna" hs={3} as={3} kind="draw" />
        </div>
        <div style={{ textAlign: "center", background: outTint(mode, "win").bg, color: outTint(mode, "win").fg, border: "1px solid " + outTint(mode, "win").bd, borderRadius: T.radius.md, padding: T.spacing.md, fontWeight: T.typography.weight.black, fontSize: T.typography.size.body }}>
          {"\u{1F3C6}"} CAMPIONI! Finale vinta ai rigori
        </div>
        <div style={{ marginTop: T.spacing.md }}><Btn mode={mode} v="primary">Continua</Btn></div>
      </div>
    </div>
  );
}

function MatchHUD() {
  const m = "cinematic";
  const s = sur(m);
  const bar = (aPct, aCol, bCol) => (
    <div style={{ height: 6, borderRadius: T.radius.pill, overflow: "hidden", display: "flex", background: s.border }}>
      <div style={{ width: aPct + "%", background: aCol }} /><div style={{ flex: 1, background: bCol }} />
    </div>
  );
  return (
    <div style={{ background: s.bg0, borderRadius: T.radius.md, padding: T.spacing.lg, color: s.text }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", gap: T.spacing.md }}>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: T.typography.size.small, color: s.text2, letterSpacing: T.typography.tracking.wide }}>ITALIA</div>
          <div className="cpm-num" style={{ fontSize: T.typography.size.display, fontWeight: T.typography.weight.black, color: T.semantic.success.solid }}>1</div>
        </div>
        <div style={{ textAlign: "center" }}>
          <div style={{ display: "inline-block", background: T.semantic.danger.solid, color: T.semantic.danger.on, borderRadius: T.radius.pill, padding: "2px 10px", fontSize: T.typography.size.caption, fontWeight: T.typography.weight.black }}>78'</div>
          <div style={{ fontSize: T.typography.size.caption, color: s.muted, marginTop: T.spacing.xs, letterSpacing: T.typography.tracking.wide }}>FINALE</div>
        </div>
        <div style={{ textAlign: "left" }}>
          <div style={{ fontSize: T.typography.size.small, color: s.text2, letterSpacing: T.typography.tracking.wide }}>SPAGNA</div>
          <div className="cpm-num" style={{ fontSize: T.typography.size.display, fontWeight: T.typography.weight.black, color: s.text }}>1</div>
        </div>
      </div>
      <div style={{ marginTop: T.spacing.md }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: T.typography.size.caption, color: s.text2 }}><span className="cpm-num">54%</span><span style={{ letterSpacing: T.typography.tracking.wide }}>POSSESSO</span><span className="cpm-num">46%</span></div>
        {bar(54, T.brand.base, T.semantic.info.solid)}
      </div>
      <div style={{ marginTop: T.spacing.sm }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: T.typography.size.caption, color: s.text2 }}><span>{"⚡"}</span><span style={{ letterSpacing: T.typography.tracking.wide }}>MOMENTUM</span><span>{"⚡"}</span></div>
        {bar(64, T.semantic.highlight.solid, s.border)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: T.spacing.sm, marginTop: T.spacing.lg }}>
        <button style={{ background: T.brand.base, color: T.brand.on, border: "none", borderRadius: T.radius.sm, padding: T.spacing.md, fontFamily: "inherit", fontSize: T.typography.size.body, fontWeight: T.typography.weight.bold }}>Conclusione</button>
        <button style={{ background: "transparent", color: s.text, border: "1px solid " + s.border, borderRadius: T.radius.sm, padding: T.spacing.md, fontFamily: "inherit", fontSize: T.typography.size.body, fontWeight: T.typography.weight.bold }}>Scavetto</button>
      </div>
    </div>
  );
}

/* ===== impaginazione: ogni componente in LIGHT e DARK affiancati ===== */
function Panel({ mode, title, children }) {
  const s = sur(mode);
  return (
    <div style={{ background: s.bg0, border: "1px solid " + s.border, borderRadius: T.radius.lg, padding: T.spacing.lg }}>
      <div style={{ fontSize: T.typography.size.caption, fontWeight: T.typography.weight.bold, letterSpacing: T.typography.tracking.wide, textTransform: "uppercase", color: s.muted, marginBottom: T.spacing.md }}>{title}</div>
      {children}
    </div>
  );
}
function Duo({ children }) { return <div className="duo">{children}</div>; }
function Section({ title, render }) {
  const head = sur("light");
  return (
    <div style={{ marginBottom: T.spacing.xxl }}>
      <div style={{ fontSize: T.typography.size.subhead, fontWeight: T.typography.weight.black, color: head.text, marginBottom: T.spacing.md, letterSpacing: T.typography.tracking.normal }}>{title}</div>
      <Duo>
        <Panel mode="light" title="Light">{render("light")}</Panel>
        <Panel mode="dark" title="Dark">{render("dark")}</Panel>
      </Duo>
    </div>
  );
}

function App() {
  const s = sur("light");
  const stack = { display: "flex", flexDirection: "column", gap: T.spacing.md };
  const rowWrap = { display: "flex", flexWrap: "wrap", gap: T.spacing.sm, alignItems: "center" };
  return (
    <div style={{ background: s.bg0, minHeight: "100vh", padding: T.spacing.xl, color: s.text }}>
      <div style={{ maxWidth: 1180, margin: "0 auto" }}>
        <div style={{ borderLeft: "4px solid " + T.brand.base, paddingLeft: T.spacing.md, marginBottom: T.spacing.xl }}>
          <div style={{ fontSize: T.typography.size.h, fontWeight: T.typography.weight.black, color: T.brand.base }}>CPM · UI Kit</div>
          <div style={{ fontSize: T.typography.size.small, color: s.text2 }}>Style guide — ogni componente in Light e Dark, tutto dai TOKENS (brand bordeaux {T.brand.base}).</div>
        </div>

        <Section title="Card / Panel" render={(m) => (
          <div style={stack}>
            <Card mode={m}><div style={{ fontWeight: T.typography.weight.bold }}>Card standard</div><div style={{ fontSize: T.typography.size.small, color: sur(m).text2 }}>Superficie bg2, bordo, ombra s1.</div></Card>
            <Card mode={m} tone="info"><div style={{ fontWeight: T.typography.weight.bold }}>Card tono info</div><div style={{ fontSize: T.typography.size.small }}>Colore semantico, mai decorativo.</div></Card>
            <Card mode={m} tone="warning"><div style={{ fontWeight: T.typography.weight.bold }}>Card tono warning</div></Card>
          </div>
        )} />

        <Section title="SectionHeader" render={(m) => (
          <div style={stack}>
            <SectionHeader mode={m}>Panoramica</SectionHeader>
            <SectionHeader mode={m} accent="info">Con accento semantico</SectionHeader>
            <SectionHeader mode={m} accent="success">Obiettivi raggiunti</SectionHeader>
          </div>
        )} />

        <Section title="Button — una sola primaria (brand)" render={(m) => (
          <div style={rowWrap}>
            <Btn mode={m} v="primary">Primaria</Btn>
            <Btn mode={m} v="success">Conferma</Btn>
            <Btn mode={m} v="danger">Elimina</Btn>
            <Btn mode={m} v="secondary">Secondaria</Btn>
            <Btn mode={m} v="ghost">Ghost</Btn>
            <Btn mode={m} v="primary" disabled={true}>Disabled</Btn>
          </div>
        )} />

        <Section title="StatBlock — colore dal significato" render={(m) => (
          <div style={rowWrap}>
            <StatBlock mode={m} value="85" label="OVR" />
            <StatBlock mode={m} value="+4" label="Crescita" meaning="growth" />
            <StatBlock mode={m} value="-2" label="Forma" meaning="decline" />
            <StatBlock mode={m} value="72" label="Energia" meaning="energy" />
          </div>
        )} />

        <Section title="Badge / Pill" render={(m) => (
          <div style={rowWrap}>
            <Badge mode={m} tone="success">FORMA 95</Badge>
            <Badge mode={m} tone="info">MORALE 100</Badge>
            <Badge mode={m} tone="danger">LIVE</Badge>
            <Badge mode={m} tone="warning">DERBY</Badge>
            <OutcomePill mode={m} kind="win" />
            <OutcomePill mode={m} kind="draw" />
            <OutcomePill mode={m} kind="loss" />
          </div>
        )} />

        <Section title="ResultRow — win / draw / loss" render={(m) => (
          <div style={stack}>
            <ResultRow mode={m} home="Italia" away="Germania" hs={2} as={1} kind="win" />
            <ResultRow mode={m} home="Italia" away="Spagna" hs={3} as={3} kind="draw" />
            <ResultRow mode={m} home="Italia" away="Inghilterra" hs={2} as={4} kind="loss" />
          </div>
        )} />

        <Section title="StandingsTable — zebra + riga 'sei tu'" render={(m) => (<StandingsTable mode={m} />)} />

        <Section title="Modal (Coppa delle Nazioni)" render={(m) => (<ModalDemo mode={m} />)} />

        <div style={{ marginBottom: T.spacing.xxl }}>
          <div style={{ fontSize: T.typography.size.subhead, fontWeight: T.typography.weight.black, color: s.text, marginBottom: T.spacing.md }}>HUD Match (superficie cinematica)</div>
          <div style={{ maxWidth: 460 }}><MatchHUD /></div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
