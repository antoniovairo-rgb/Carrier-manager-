function AvatarSVG({id=0, size=60, border=false}) {
  const p = AVATARS[id%AVATARS.length];
  const Hair = () => {
    const f = p.hair;
    switch(p.style){
      case "bald": return null;
      case "short": return <ellipse cx="50" cy="24" rx="28" ry="16" fill={f}/>;
      case "long": return <><ellipse cx="50" cy="24" rx="28" ry="16" fill={f}/><path d="M23 32 Q17 62 24 80" stroke={f} strokeWidth="10" fill="none" strokeLinecap="round"/><path d="M77 32 Q83 62 76 80" stroke={f} strokeWidth="10" fill="none" strokeLinecap="round"/></>;
      case "afro": return <circle cx="50" cy="20" r="32" fill={f}/>;

      case "straight": default: return <ellipse cx="50" cy="24" rx="28" ry="14" fill={f}/>;
    }
  };
  return (
    <svg viewBox="0 0 100 100" width={size} height={size} style={{borderRadius:"50%",display:"block",overflow:"hidden",border:border?"2px solid "+TH.primary:"none"}}>
      <circle cx="50" cy="50" r="50" fill="#dbeafe"/>

      <rect x="44" y="65" width="12" height="12" rx="3" fill={p.skin}/>
      <ellipse cx="50" cy="50" rx="27" ry="30" fill={p.skin}/>
      <Hair/>
      <ellipse cx="23" cy="50" rx="4" ry="7" fill={p.skin}/>
      <ellipse cx="77" cy="50" rx="4" ry="7" fill={p.skin}/>
      <path d="M33 38 Q40 35 45 38" stroke={p.hair} strokeWidth="2.5" fill="none" strokeLinecap="round"/>
      <path d="M55 38 Q60 35 67 38" stroke={p.hair} strokeWidth="2.5" fill="none" strokeLinecap="round"/>

      <circle cx="39" cy="46" r="3.2" fill={p.eye}/>
      <circle cx="40" cy="45" r="1.2" fill="black"/>

      <circle cx="61" cy="46" r="3.2" fill={p.eye}/>

      <path d="M41 64 Q50 71 59 64" stroke={p.skin==="%f5c5a3"?"#c08070":"#8b4040"} strokeWidth="2.2" fill="none" strokeLinecap="round"/>
      {p.beard && <ellipse cx="50" cy="68" rx="22" ry="10" fill={p.hair} opacity="0.42"/>}
    </svg>
  );
}

const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rng(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const wPick=evts=>{const tot=evts.reduce((s,e)=>s+(e.w||1),0);let r=Math.random()*tot;for(const e of evts){r-=(e.w||1);if(r<=0)return e;}return evts[0];};
function baseStats(){return{velocità:clamp(rng(55,72),1,99),tecnica:clamp(rng(54,70),1,99),fisico:clamp(rng(50,68),1,99),mentalità:clamp(rng(50,68),1,99),tiro:clamp(rng(60,74),1,99),passaggio:clamp(rng(48,65),1,99),dribbling:clamp(rng(55,72),1,99),posizionamento:clamp(rng(55,70),1,99)};}
function calcOvr(s){return Math.round((s.tiro*2.5+s.tecnica*2+s.velocità*1.5+s.dribbling*1.5+s.posizionamento*1.5+s.mentalità+s.fisico+s.passaggio)/11.5);}
function succRate(action,stats,playerX,oppPrestige=65){
  const sv=stats[action.stat]||60;
  const base=(sv/99)*0.65+0.20+(action.bon||0)/100+(playerX-50)/100*0.06;
  const diffPenalty=Math.max(0,(oppPrestige-65)/300);
  return Math.round(clamp(base-diffPenalty,0.10,0.92)*100);
}
// opponent strength affects goal probability in background events
function oppGoalProb(oppPrestige,playerOvr){
  return clamp(0.02+(oppPrestige-60)/800,0.01,0.06);
}
// Returns clubs from player's current league (for standings + opponents)
function getLeagueClubs(player){
  const isU18=(player?.proStatus||"u18")==="u18"||(player?.club?.isU18&&!player?.club?.transferType);
  if(isU18||!player?.club)return U18_CLUBS;
  const lg=player.club.lg||player.club.league;
  if(lg){const lc=CLUBS.filter(c=>c.lg===lg);if(lc.length>=4)return lc;}
  const nat=player.club.nat;
  if(nat){const nc=CLUBS.filter(c=>c.nat===nat);if(nc.length>=4)return nc;}
  return CLUBS.slice(0,16);
}
// contextual start position: player spawns inside the situation zone
function getStartPos(sit){
  const sz=sit?.startZone||{x:[55,72],y:[30,70]};
  return{x:rng(sz.x[0],sz.x[1]),y:rng(sz.y[0],sz.y[1])};
}
// generate transfer offer based on player OVR and prestige match
function generateTransferOffer(player){
  const clubPool=CLUBS.filter(c=>c.id!==player.club?.id&&c.n!==player.club?.n);
  const pOvr=player.ovr||60;
  const targetPrestige=clamp(pOvr*1.2+rng(-15,15),45,99);
  const candidates=clubPool.filter(c=>Math.abs(c.p-targetPrestige)<25);
  if(!candidates.length)return null;
  const club=pick(candidates);
  const types=["prestito","prestito con riscatto","trasferimento definitivo"];
  const type=pOvr<65?"prestito":pOvr<75?pick(types.slice(0,2)):pick(types);
  return{club,type,minutaggio:type.includes("prest")?rng(30,70):rng(50,90),moralBonus:rng(5,20),growthBonus:rng(5,15),prestigeRatio:club.p/Math.max(1,(player.club?.p||65))};
}
// Generate pro contract offers at end of U18 career
function generateProContracts(player){
  const ovr=player.ovr||60;
  const u18S=player.u18Seasons||0;
  const forced=u18S>=2; // max 2 seasons: MUST leave
  const perf=Math.min(10,(player.goals||0)*0.35+(player.matches||0)*0.12+(ovr-50)/6);
  const offers=[];
  // 1. Same club first pro contract (always available)
  const parentName=((player.club?.n||player.club?.name||"?")+"").replace(/\s+U18\s*$/i,"").trim();
  const parentClub={...(player.club||{}),n:parentName,name:parentName,isU18:false,p:(player.club?.p||55)+12};
  offers.push({id:"same_pro",club:parentClub,contractType:"Primo contratto professionistico",wage:rng(600,Math.max(700,ovr*22)),duration:rng(1,3),role:ovr>=72?"Titolare giovane":ovr>=65?"Giovane promessa":"Riserva/Giovane",moralBonus:14,growthBonus:perf>5?20:10,isMain:true});
  // 2. External club (if performance decent or forced)
  if(perf>2||forced){
    const extPool=CLUBS.filter(c=>ovr>=68?c.p>=65&&c.p<=90:c.p>=50&&c.p<=72);
    const ext=pick(extPool.length?extPool:CLUBS);
    offers.push({id:"external",club:ext,contractType:ovr>=65?"Trasferimento definitivo":"Prestito annuale",wage:rng(400,ovr*16),duration:ovr>=65?rng(1,3):1,role:ovr>=70?"Titolare":"Titolare garantito",moralBonus:8,growthBonus:15});
  }
  // 3. Loan to smaller club (always as fallback)
  const loanPool=CLUBS.filter(c=>c.p<68);
  const loanClub=pick(loanPool.length?loanPool:CLUBS);
  offers.push({id:"loan_small",club:loanClub,contractType:"Prestito",wage:rng(300,900),duration:1,role:"Minutaggio garantito",moralBonus:4,growthBonus:10});
  // 4. Stay another year in U18 (ONLY if under limit)
  if(!forced){
    const isLast=u18S>=1;
    offers.push({id:"stay_u18",club:player.club,contractType:`Resta in Under 18 (${u18S+1}/2)`,wage:player.contract?.wage||200,duration:1,role:"Protagonista U18",moralBonus:-6,growthBonus:4,isStayU18:true,isLastChance:isLast});
  }
  return{offers,forced,perf:Math.round(perf*10)/10};
}
const SAVE_VERSION=4;
const SLOT_KEYS=["cpm-v3","cpm-v3-s2","cpm-v3-s3"]; // slot 0 backward-compatible
const storage={
  save:async(d,slot=0)=>{
    const key=SLOT_KEYS[slot]||SLOT_KEYS[0];
    const payload={...d,savedAt:Date.now(),saveVersion:SAVE_VERSION};
    try{const s=JSON.stringify(payload);if(window.storage)await window.storage.set(key,s);else localStorage.setItem(key,s);return true;}catch{return false;}
  },
  load:async(slot=0)=>{
    const key=SLOT_KEYS[slot]||SLOT_KEYS[0];
    try{
      let s;if(window.storage){const r=await window.storage.get(key);s=r?.value;}else s=localStorage.getItem(key);
      if(!s)return null;
      const d=JSON.parse(s);
      // Integrity: require player with name
      if(!d?.player?.name)return null;
      return d;
    }catch{return null;}
  },
  del:async(slot=0)=>{
    const key=SLOT_KEYS[slot]||SLOT_KEYS[0];
    try{if(window.storage)await window.storage.delete(key);else localStorage.removeItem(key);}catch{}
  },
  listSlots:async()=>{
    const out=[];
    for(let i=0;i<SLOT_KEYS.length;i++){
      const d=await storage.load(i);
      out.push(d?{slot:i,name:d.player.name,club:d.player.club?.name||d.player.club?.n||"–",season:d.player.season||1,week:d.player.week||1,ovr:d.player.ovr||60,avatarId:d.player.avatarId||0,savedAt:d.savedAt||0}:null);
    }
    return out;
  },
};

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h)^s.charCodeAt(i);h=h>>>0;}return h;}
function generateTeamRoster(club,season){
  const nat=club?.nat||"🇮🇹";
  const names=NAME_BY_NAT[nat]||NAME_BY_NAT["🇮🇹"];
  const roles=["Portiere","Difensore","Difensore","Terzino","Terzino","Mediano","Centrocampista","Trequartista","Ala","Ala","Centravanti"];
  const base=hashStr((club?.id||club?.n||"x")+"_"+(season||1));
  return roles.map((role,i)=>{const s=(base+(i*7919))>>>0;const first=names.first[s%names.first.length];const last=names.last[(s>>4)%names.last.length];return{name:`${first} ${last}`,role};});
}
function seededShuffle(arr,seed){
  const a=[...arr];let s=(seed*1664525+1013904223)>>>0;
  for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
// calendar-driven match scheduling
function generateSeasonCalendar(playerClub,leagueClubs,seed){
  if(!playerClub||!leagueClubs?.length)return[];
  const opps=leagueClubs.filter(c=>c.id!==playerClub.id&&c.n!==playerClub.n);
  if(!opps.length)return[];
  const s=seed||1;
  const h1=seededShuffle([...opps],s);
  const h2=seededShuffle([...opps],s+999);
  const all=[...h1,...h2];
  const cal=[];let week=1;
  for(let i=0;i<all.length&&week<=38;i++){
    cal.push({matchday:i+1,week,opponentId:all[i].id,opponentName:all[i].n||all[i].name,isHome:i<h1.length,played:false,result:null});
    week+=1+(i%3===2?1:0);
  }
  return cal;
}
// standings start at zero each season, updated incrementally via updateStandings
function initStandings(clubs){
  return[...clubs].map(c=>({...c,played:0,wins:0,draws:0,losses:0,gf:0,ga:0,gd:0,pts:0}));
}
// simulate all other matches when player matchday ends
function updateStandings(standings,playerClubId,playerResult){
  if(!standings?.length)return[];
  const s=standings.map(t=>({...t}));
  if(playerResult){
    const pt=s.find(t=>t.id===playerClubId||t.n===playerClubId);
    if(pt){
      pt.played++;pt.gf+=playerResult.homeScore;pt.ga+=playerResult.awayScore;
      if(playerResult.won){pt.wins++;pt.pts+=3;}else if(playerResult.drew){pt.draws++;pt.pts+=1;}else{pt.losses++;}
      pt.gd=pt.gf-pt.ga;
    }
  }
  const myId=playerClubId;
  const others=s.filter(t=>t.id!==myId&&t.n!==myId);
  for(let i=0;i+1<others.length;i+=2){
    const h=others[i],a=others[i+1];
    const diff=((h.p||65)-(a.p||65))/30;
    const hG=Math.max(0,Math.round(1.2+diff+(Math.random()*2.6-1.3)));
    const aG=Math.max(0,Math.round(0.9-diff*0.5+(Math.random()*2.6-1.3)));
    h.played++;a.played++;h.gf+=hG;h.ga+=aG;h.gd=h.gf-h.ga;
    a.gf+=aG;a.ga+=hG;a.gd=a.gf-a.ga;
    if(hG>aG){h.wins++;h.pts+=3;a.losses++;}else if(hG<aG){a.wins++;a.pts+=3;h.losses++;}
    else{h.draws++;h.pts++;a.draws++;a.pts++;}
  }
  return s.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
// context-aware realistic attendance
function calcAttendance(homeClub,context){
  const ctx=context||"career";
  if(ctx==="trial")return rng(80,320);
  const p=homeClub?.p||homeClub?.prestige||60;
  const isU18=homeClub?.isU18;
  if(isU18)return rng(150,900);
  if(p>=93)return rng(40000,76000);
  if(p>=80)return rng(16000,42000);
  if(p>=68)return rng(7000,20000);
  if(p>=55)return rng(2500,8000);
  return rng(600,3000);
}
// Quick simulation for skipped/missed match weeks
function simulateMatch(playerClub,opponent,playerOvr,isHome=true){
  const homeFactor=isHome?5:-5;
  const diff=(playerOvr||65)-(opponent?.p||65)+homeFactor;
  const hG=Math.max(0,Math.round(1.2+diff/30+(Math.random()*3-1.5)));
  const aG=Math.max(0,Math.round(1.0-diff/40+(Math.random()*3-1.5)));
  return{homeScore:hG,awayScore:aG,won:hG>aG,drew:hG===aG,goals:0,assists:0,rating:hG>aG?6.5:hG===aG?6.0:5.5,opponent:opponent?.n||opponent?.name,oppAbbr:opponent?.a||opponent?.abbr,oppCol:opponent?.c||opponent?.col,simulated:true};
}

======================================== */
function makeCrowdTex(homeBias,homeHex,awayHex,prestige=70){
  const W=512,H=320,c=document.createElement("canvas");c.width=W;c.height=H;
  const ctx=c.getContext("2d");
  // Gradient background — depth effect: darker at top
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,"#0e0e1c");gr.addColorStop(1,"#1a1a2e");
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  // Concrete step lines between rows
  const rows=Math.ceil(10+prestige/18),cols=Math.ceil(20+prestige/10);
  const rH=H/rows,cW=W/cols;
  for(let r=0;r<rows;r++){
    ctx.fillStyle="rgba(100,100,130,0.25)";ctx.fillRect(0,r*rH,W,1.5);
  }
  const SKINS=["#f5c5a3","#e8a870","#c8956a","#8B5030","#7c4a1e"];
  for(let r=0;r<rows;r++){
    for(let cl=0;cl<cols;cl++){
      const bx=cl*cW,by=r*rH;
      const x=bx+cW/2+(Math.random()-.5)*cW*0.22;
      const y=by+rH*0.7;
      const isH=Math.random()<homeBias;
      // Empty seat occasionally
      if(Math.random()<0.05){ctx.fillStyle="#303040";ctx.fillRect(bx+1,by+rH*0.72,cW-2,rH*0.28);continue;}
      // Seat
      ctx.fillStyle="#3a3a50";ctx.fillRect(bx+1,by+rH*0.72,cW-2,rH*0.28);
      // Body (jersey)
      ctx.fillStyle=isH?homeHex:awayHex;
      ctx.fillRect(x-cW*0.3,y-rH*0.08,cW*0.6,rH*0.42);
      // Head
      ctx.fillStyle=SKINS[Math.floor(Math.random()*SKINS.length)];
      ctx.beginPath();ctx.arc(x,y-rH*0.22,cW*0.23,0,Math.PI*2);ctx.fill();
      // Hair
      ctx.fillStyle=["#1a0800","#3d2000","#c0c0c0","#d4a820","#8B4513"][Math.floor(Math.random()*5)];
      ctx.beginPath();ctx.arc(x,y-rH*0.32,cW*0.23,Math.PI,Math.PI*2);ctx.fill();
      // Flag (rare)
      if(Math.random()<0.04){
        ctx.fillStyle="#aaaacc";ctx.fillRect(x+cW*0.1,y-rH*0.85,1.8,rH*0.65);
        ctx.fillStyle=isH?homeHex:awayHex;ctx.fillRect(x+cW*0.1,y-rH*0.85,cW*0.42,rH*0.2);
      }
      // Scarf
      if(Math.random()<0.07){ctx.fillStyle=isH?homeHex:awayHex;ctx.fillRect(x-cW*0.3,y+rH*0.05,cW*0.6,rH*0.1);}
    }
  }
  return new THREE.CanvasTexture(c);
}

function buildStadium(scene,homeHex,awayHex,stadCfg={prestige:65,style:0}){
  // Scale by prestige: XL(>88) / LG(>72) / MD(>55) / SM(<55)
  const p=typeof stadCfg==="number"?stadCfg:stadCfg.prestige||65;
  const style=typeof stadCfg==="object"?stadCfg.style||0:0;
  const xl=p>88,lg=p>72,md=p>55;
  const endZ=xl?64:lg?56:md?50:44;
  const sideX=xl?78:lg?70:md?64:58;
  const endH=xl?22:lg?16:md?13:10;
  const sideH=xl?20:lg?14:md?11:8;
  const endD=xl?28:lg?20:md?16:13;
  const sideD=xl?26:lg?20:md?16:13;
  const endW=xl?126:lg?118:md?110:100;
  const sideW=xl?84:lg?76:md?68:60;
  const crowdBias=xl?0.91:lg?0.80:md?0.65:0.50;
  // Style variation: 0=standard, 1=modern dark, 2=compact bowl, 3=traditional
  const roofOpacity=style===1?0.90:style===2?0.70:0.80;
  const roofColor=style===1?0x333344:style===3?0x888877:0x555566;
  const floodH=xl?32:lg?28:md?24:20; // floodlight pole height
  const cM=new THREE.MeshLambertMaterial({color:0x32323e});
  const stM=new THREE.MeshLambertMaterial({color:0x808088});
  const roofM=new THREE.MeshLambertMaterial({color:roofColor,transparent:true,opacity:roofOpacity});
  const hTex=makeCrowdTex(0.88,homeHex,awayHex,p);
  const aTex=makeCrowdTex(0.12,homeHex,awayHex,p);
  const mTex=makeCrowdTex(crowdBias,homeHex,awayHex,p);

  // Helper: create a tiered stand section
  const addStand=(cx,cz,rotY,standW,standD,standH,crowdTex)=>{
    const g=new THREE.Group();
    // Main crowd wall (slightly angled for perspective)
    const wallMat=new THREE.MeshLambertMaterial({color:0xffffff,map:crowdTex});
    const wall=new THREE.Mesh(new THREE.BoxGeometry(standW,standH,standD),wallMat);
    wall.position.set(0,standH/2,0);wall.receiveShadow=true;g.add(wall);
    // Concrete base strip
    const base=new THREE.Mesh(new THREE.BoxGeometry(standW+2,3,standD+3),cM);
    base.position.set(0,1.5,0);g.add(base);
    // Roof overhang
    const roof=new THREE.Mesh(new THREE.BoxGeometry(standW+8,0.8,standD*0.4),roofM);
    roof.position.set(0,standH+1.4,-(standD*0.3));g.add(roof);
    // Roof supports (pillars at edges)
    [-standW/2+4,standW/2-4].forEach(px=>{
      const pl=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,standH+2,8),stM);
      pl.position.set(px,standH/2+1,-(standD*0.28));g.add(pl);
    });
    // Fence rail at pitch-side bottom
    const fence=new THREE.Mesh(new THREE.BoxGeometry(standW,0.9,0.3),new THREE.MeshLambertMaterial({color:0x2a6038}));
    fence.position.set(0,0.45,-(standD/2+0.15));g.add(fence);
    g.position.set(cx,0,cz);g.rotation.y=rotY;
    scene.add(g);
  };

  // End stands (behind goals) — scaled by prestige
  addStand(0,-endZ,0,       endW,endD,endH,hTex); // Home end
  addStand(0, endZ,Math.PI, endW,endD,endH,aTex); // Away end
  // Side stands — scaled
  addStand(sideX, 0, Math.PI/2, sideW,sideD,sideH,mTex); // Right side
  addStand(-sideX,0,-Math.PI/2, sideW,sideD,sideH,mTex); // Left side
  // Corner sections — filled or open based on style
  const hasCorners=style!==3; // style 3 = traditional, open corners
  if(hasCorners)[[-sideX,-endZ,Math.PI/4],[sideX,-endZ,-Math.PI/4],[-sideX,endZ,3*Math.PI/4],[sideX,endZ,-3*Math.PI/4]].forEach(([x,z,ry])=>{
    const cH=Math.round((endH+sideH)/2)*0.8;
    const cm=new THREE.Mesh(new THREE.BoxGeometry(24,cH,24),new THREE.MeshLambertMaterial({color:0xffffff,map:mTex}));
    cm.position.set(x,cH/2,z);cm.rotation.y=ry;scene.add(cm);
    const cb=new THREE.Mesh(new THREE.BoxGeometry(24,2,24),cM);cb.position.set(x,1,z);scene.add(cb);
  });

  // Floodlights — height scales with stadium size
  const lightColor=style===1?0xffe0cc:style===2?0xfff0e0:0xfff8e8;
  [[-sideX+8,-endZ+8],[sideX-8,-endZ+8],[-sideX+8,endZ-8],[sideX-8,endZ-8]].forEach(([x,z])=>{
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,floodH,8),stM);
    pole.position.set(x,floodH/2,z);pole.castShadow=true;scene.add(pole);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,8),stM);
    arm.position.set(x+(x>0?-4:4),floodH+2,z);scene.add(arm);
    const head=new THREE.Mesh(new THREE.BoxGeometry(5,0.6,2),new THREE.MeshBasicMaterial({color:0xfff5aa}));
    head.position.set(x+(x>0?-4:4),floodH+2.5,z);scene.add(head);
    const fl=new THREE.PointLight(lightColor,1.1,280);fl.position.set(x+(x>0?-5:5),floodH+4,z);scene.add(fl);
  });

  // Goal nets (wireframe-style transparent planes)
  const netM=new THREE.MeshBasicMaterial({color:0xfafafa,transparent:true,opacity:0.14,side:THREE.DoubleSide,wireframe:false});
  [[-51,1],[ 51,-1]].forEach(([gx,sign])=>{
    // Back net
    const back=new THREE.Mesh(new THREE.PlaneGeometry(7.32,2.44),netM);
    back.rotation.y=Math.PI/2;back.position.set(gx+sign*1.6,1.22,0);scene.add(back);
    // Side nets
    [-3.66,3.66].forEach(gz=>{
      const side=new THREE.Mesh(new THREE.PlaneGeometry(2,2.44),netM);
      side.position.set(gx+sign*0.85,1.22,gz);scene.add(side);
    });
    // Top net
    const top=new THREE.Mesh(new THREE.PlaneGeometry(7.32,2),netM);
    top.rotation.x=Math.PI/2;top.position.set(gx+sign*0.85,2.44,-sign*0.5);scene.add(top);
  });

  // Advertising boards — alternate home/away colors, more realistic
  const hColor=new THREE.Color(homeHex),aColor=new THREE.Color(awayHex);
  const wColor=new THREE.Color(0xfafafa);
  const addAd=(ax,az,aw,ah,rotY,idx)=>{
    const col=idx%3===0?hColor:idx%3===1?aColor:wColor;
    const m=new THREE.Mesh(new THREE.BoxGeometry(aw,ah,0.22),new THREE.MeshLambertMaterial({color:col}));
    m.position.set(ax,ah/2,az);m.rotation.y=rotY;scene.add(m);
    // Small text-like stripe on top
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(aw,0.15,0.24),new THREE.MeshLambertMaterial({color:0x111111}));
    stripe.position.set(ax,ah+0.075,az);stripe.rotation.y=rotY;scene.add(stripe);
  };
  let idx=0;
  for(let i=-44;i<=44;i+=11){addAd(i,-33.2,9,1.3,0,idx++);addAd(i,33.2,9,1.3,Math.PI,idx++);}
  for(let i=-28;i<=28;i+=12){addAd(53.2,i,9,1.3,Math.PI/2,idx++);addAd(-53.2,i,9,1.3,-Math.PI/2,idx++);}

  // Corner flags (thicker, more visible)
  const flagMat=new THREE.MeshLambertMaterial({color:new THREE.Color(homeHex)});
  const poleMat=new THREE.MeshLambertMaterial({color:0xffffff});
  [[-50,-30],[-50,30],[50,-30],[50,30]].forEach(([fx,fz])=>{
    const fp=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.6,8),poleMat);fp.position.set(fx,0.8,fz);scene.add(fp);
    const flag=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.65),flagMat);
    flag.position.set(fx+(fx>0?-0.55:0.55),1.75,fz);flag.rotation.y=Math.PI/4;flag.castShadow=true;scene.add(flag);
  });

  // Player tunnel
  const tun=new THREE.Mesh(new THREE.BoxGeometry(6,4.5,3.5),new THREE.MeshLambertMaterial({color:0x181824}));
  tun.position.set(-71.5,2.25,-2);scene.add(tun);

  // Pitch perimeter track (orange)
  const trackMat=new THREE.MeshLambertMaterial({color:0xbb4c0a});
  const tN=new THREE.Mesh(new THREE.PlaneGeometry(106,5),trackMat);tN.rotation.x=-Math.PI/2;tN.position.set(0,0.02,-33);scene.add(tN);

/* ========================================
   THREE FIELD  (full-screen, camera zoom, 22 players)
======================================== */
function ThreeField({playerX,playerY,zone,homeCol="#22c55e",oppCol="#ef4444",opponents=[],matchPhase="match",onWalkoutDone,avatarId=0,actionZoom=false,allPlayers=[],homeClub=null}){
  const mountRef=useRef(null);
  const sr=useRef({});
  const wRef=useRef({active:false,angle:-Math.PI*0.6,progress:0});
  const cbRef=useRef(onWalkoutDone);
  const homeClubRef=useRef(homeClub); // stable ref for init effect
  useEffect(()=>{cbRef.current=onWalkoutDone;},[onWalkoutDone]);

  useEffect(()=>{
    const mount=mountRef.current;if(!mount)return;
    // Full-screen sizing: 65% viewport height, max 540px
    const W=mount.parentElement?.clientWidth||window.innerWidth;
    const getH=()=>Math.max(Math.round(Math.min(window.innerHeight*0.65,540)),260);
    const H=getH();
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x050810);scene.fog=new THREE.Fog(0x050810,160,280);
    const camera=new THREE.PerspectiveCamera(54,W/H,0.1,380);
    // Elevated sideline camera — starts high and behind home end, looks OVER the stands
    camera.position.set(-12,40,-70);camera.lookAt(8,2,2);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
    renderer.setSize(W,H);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    // set clear color immediately to avoid gray flash before first frame
    renderer.setClearColor(0x050810,1);
    mount.appendChild(renderer.domElement);
    // Render one frame immediately so canvas is visible before animate() loop starts
    renderer.render(new THREE.Scene(),camera);
    // Responsive resize
    const ro=new ResizeObserver(()=>{
      const nW=mount.parentElement?.clientWidth||window.innerWidth;
      const nH=getH();
      renderer.setSize(nW,nH);camera.aspect=nW/nH;camera.updateProjectionMatrix();
    });
    ro.observe(mount);

    scene.add(new THREE.AmbientLight(0xffffff,0.50));
    const sun=new THREE.DirectionalLight(0xfff4d6,0.85);sun.position.set(10,45,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x8899cc,0x2a3a20,0.35));

    // Pitch
    const grassMat=new THREE.MeshLambertMaterial({color:0x1a5c0d});
    const grass=new THREE.Mesh(new THREE.PlaneGeometry(100,60),grassMat);grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;scene.add(grass);
    for(let i=0;i<10;i++){const sm=new THREE.MeshLambertMaterial({color:i%2?0x1e6611:0x174e0c});const s=new THREE.Mesh(new THREE.PlaneGeometry(10,60),sm);s.rotation.x=-Math.PI/2;s.position.set(-45+i*10,0.01,0);scene.add(s);}

    const lm=new THREE.LineBasicMaterial({color:0xffffff,opacity:0.85,transparent:true});
    const addL=pts=>{const g=new THREE.BufferGeometry().setFromPoints(pts.map(([x,y,z])=>new THREE.Vector3(x,y,z)));scene.add(new THREE.Line(g,lm));};
    const addR=(cx,cz,w,d,y=0.02)=>addL([[cx-w/2,y,cz-d/2],[cx+w/2,y,cz-d/2],[cx+w/2,y,cz+d/2],[cx-w/2,y,cz+d/2],[cx-w/2,y,cz-d/2]]);
    addR(0,0,100,60);addL([[0,0.02,-30],[0,0.02,30]]);
    const cc=[];for(let i=0;i<=64;i++){const a=(i/64)*Math.PI*2;cc.push([Math.cos(a)*9.15,0.02,Math.sin(a)*9.15]);}addL(cc);
    addR(-33.5,0,33,40);addR(-45.5,0,11,18);addR(33.5,0,33,40);addR(45.5,0,11,18);
    const spm=new THREE.MeshBasicMaterial({color:0xffffff});
    [0,-38,38].forEach(x=>{const sp=new THREE.Mesh(new THREE.CircleGeometry(0.28,12),spm);sp.rotation.x=-Math.PI/2;sp.position.set(x,0.02,0);scene.add(sp);});

    const pm=new THREE.MeshLambertMaterial({color:0xeeeeee});
    const mkGoal=side=>{const g=new THREE.Group();const pg=new THREE.CylinderGeometry(0.1,0.1,2.44,8);[-3.66,3.66].forEach(z=>{const p=new THREE.Mesh(pg,pm);p.position.set(0,1.22,z);p.castShadow=true;g.add(p);});const cb=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,7.32,8),pm);cb.rotation.z=Math.PI/2;cb.rotation.x=Math.PI/2;cb.position.set(0,2.44,0);g.add(cb);const net=new THREE.Mesh(new THREE.PlaneGeometry(1.8,2.44),new THREE.MeshBasicMaterial({color:0xffffff,opacity:.08,transparent:true,side:THREE.DoubleSide}));net.rotation.y=Math.PI/2;net.position.set(side<0?-0.9:0.9,1.22,0);g.add(net);g.position.set(side,0,0);scene.add(g);};
    mkGoal(-51);mkGoal(51);
    const pres=homeClubRef.current?.p||homeClubRef.current?.prestige||65;
    const sid=(homeClubRef.current?.id||"x").split("").reduce((a,c)=>a+c.charCodeAt(0),0)%4;
    buildStadium(scene,homeCol,oppCol,{prestige:pres,style:sid});

    const zh=new THREE.Mesh(new THREE.PlaneGeometry(1,60),new THREE.MeshBasicMaterial({color:0xe8c547,opacity:0,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
    zh.rotation.x=-Math.PI/2;zh.position.y=0.04;scene.add(zh);

    const mkChar=(colHex,isUser=false)=>{
      const g=new THREE.Group();const col=new THREE.Color(colHex);
      const jM=new THREE.MeshLambertMaterial({color:col}),sM=new THREE.MeshLambertMaterial({color:0x111111}),skM=new THREE.MeshLambertMaterial({color:0xdba88a}),hM=new THREE.MeshLambertMaterial({color:0x2e1800});
      [-0.18,0.18].forEach(xo=>{const bt=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.14,0.34),new THREE.MeshLambertMaterial({color:0x111111}));bt.position.set(xo,0.07,0.06);g.add(bt);});
      [-0.18,0.18].forEach(xo=>{const lg=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.10,0.52,8),skM);lg.position.set(xo,0.36,0);g.add(lg);});
      const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.28,0.38,8),sM);sh.position.y=0.63;g.add(sh);
      const bd=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.36,1.02,8),jM);bd.position.y=1.13;bd.castShadow=true;g.add(bd);
      [-0.44,0.44].forEach(xo=>{const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.08,0.62,6),jM);arm.rotation.z=xo>0?Math.PI/6:-Math.PI/6;arm.position.set(xo,1.1,0);g.add(arm);});
      const nk=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.12,0.18,8),skM);nk.position.y=1.70;g.add(nk);
      const hd=new THREE.Mesh(new THREE.SphereGeometry(0.30,12,10),skM);hd.position.y=1.90;hd.castShadow=true;g.add(hd);
      const hr=new THREE.Mesh(new THREE.SphereGeometry(0.23,10,8),hM);hr.position.set(0,2.08,-0.02);g.add(hr);
      if(isUser){const rg=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.07,6,28),new THREE.MeshBasicMaterial({color:0xe8c547}));rg.rotation.x=Math.PI/2;rg.position.y=0.1;g.add(rg);}
      g.castShadow=true;return g;
    };

    const pMesh=mkChar(homeCol,true);pMesh.visible=false;scene.add(pMesh);
    const bMesh=new THREE.Mesh(new THREE.SphereGeometry(0.22,14,10),new THREE.MeshLambertMaterial({color:0xffffff}));bMesh.castShadow=true;bMesh.visible=false;scene.add(bMesh);
    const patchMat=new THREE.MeshLambertMaterial({color:0x222222});
    [[0,0.22,0],[0.16,0.15,0],[0,0.12,0.18],[-0.16,0.15,0]].forEach(([x,y,z])=>{const p=new THREE.Mesh(new THREE.SphereGeometry(0.075,6,5),patchMat);p.position.set(x,y,z);bMesh.add(p);});
    const oMeshes=(opponents||[]).map(opp=>{const m=mkChar(oppCol);const p=toThree(opp.x,opp.y);m.position.set(p.x,0,p.z);m.rotation.y=Math.PI;m.visible=false;scene.add(m);return m;});
    // Background players — simplified char (body + head), all 22 + referee
    const mkBgChar=(colHex,isRef=false)=>{const g=new THREE.Group();const jM=new THREE.MeshLambertMaterial({color:isRef?0x1a1a1a:new THREE.Color(colHex)});const skM=new THREE.MeshLambertMaterial({color:0xdba88a});const bd=new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.27,0.95,7),jM);bd.position.y=0.48;g.add(bd);const hd=new THREE.Mesh(new THREE.SphereGeometry(0.22,7,5),skM);hd.position.y=1.18;g.add(hd);if(isRef){const fl=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.08,0.22),new THREE.MeshLambertMaterial({color:0xffd700}));fl.position.set(0.28,0.65,0);g.add(fl);}g.castShadow=true;return g;};
    const bgMeshes=(allPlayers||[]).map(p=>{const isRef=p.team==="ref";const col=p.team==="home"?homeCol:p.team==="away"?oppCol:"#000";const m=mkBgChar(col,isRef);const pos=toThree(p.x,p.y);m.position.set(pos.x,0,pos.z);m.rotation.y=p.team==="away"?Math.PI:0;m.visible=false;scene.add(m);return m;});

    sr.current={scene,camera,renderer,pMesh,bMesh,oMeshes,bgMeshes,zh,camTarget:new THREE.Vector3(-12,40,-70),lookAt:new THREE.Vector3(8,2,2)};

    let animId,t=0;
    const animate=()=>{
      animId=requestAnimationFrame(animate);t+=0.016;
      const r=sr.current;const w=wRef.current;
      if(w.active){
        // Cinematic walkout orbit — wider radius, higher altitude
        w.angle+=0.005;w.progress+=0.0035;
        camera.position.set(Math.cos(w.angle)*80,35+Math.sin(w.angle*0.6)*5,Math.sin(w.angle)*80);
        camera.lookAt(0,4,0);
        if(w.progress>=1){w.active=false;cbRef.current?.();}
      }else{
        // Smooth follow
        camera.position.lerp(r.camTarget,r.actionZoom?0.12:0.045);camera.lookAt(r.lookAt);
      }
      if(r.bMesh&&r.bMesh.visible){r.bMesh.position.y=0.22+Math.abs(Math.sin(t*2.8))*0.26;r.bMesh.rotation.y+=0.06;}
      r.oMeshes?.forEach((m,i)=>{if(m.visible)m.position.y=Math.sin(t*1.2+i)*0.02;});
      r.bgMeshes?.forEach((m,i)=>{if(m.visible){m.position.y=Math.sin(t*0.7+i*1.9)*0.012;}});
      renderer.render(scene,camera);
    };
    animate();sr.current.stopAnim=()=>cancelAnimationFrame(animId);
    return()=>{
      ro.disconnect();
      sr.current.stopAnim?.();
      sr.current.scene?.traverse(obj=>{
        if(obj.geometry)obj.geometry.dispose();
        const mats=obj.material?Array.isArray(obj.material)?obj.material:[obj.material]:[];
        mats.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});
      });
      renderer.dispose();
      if(mount.contains(renderer.domElement))mount.removeChild(renderer.domElement);
    };
  },[]);// eslint-disable-line

  useEffect(()=>{
    const r=sr.current;if(!r.pMesh)return;
    const isMatch=matchPhase!=="walkout";
    r.pMesh.visible=isMatch;r.bMesh.visible=isMatch;r.oMeshes?.forEach(m=>m.visible=isMatch);r.bgMeshes?.forEach(m=>m.visible=isMatch);
    if(matchPhase==="walkout"){wRef.current.active=true;wRef.current.angle=-Math.PI*0.6;wRef.current.progress=0;}
  },[matchPhase]);

  useEffect(()=>{
    const r=sr.current;if(!r.pMesh||!r.bMesh)return;
    const{x,z}=toThree(playerX,playerY);
    r.pMesh.position.x=x;r.pMesh.position.z=z;r.pMesh.rotation.y=Math.PI/2;
    r.bMesh.position.x=x+1.1;r.bMesh.position.z=z-0.35;
    r.actionZoom=actionZoom; // used for lerp speed in animate loop
    if(actionZoom){
      // Spalla — camera bassa, vicina, quasi di spalle al giocatore
      r.camTarget.set(x-11,4.5,z+2.5);
      r.lookAt.set(x+20,1.2,z);
    }else{
      const camX=x*0.55-12;
      r.camTarget.set(camX,38,-70);
      r.lookAt.set(camX+14,2,2);
    }
  },[playerX,playerY,actionZoom]);

  useEffect(()=>{
    const r=sr.current;if(!r.zh)return;
    const zd=ZONES[zone];if(!zd){r.zh.material.opacity=0;return;}
    const x1=zd.x[0]-50,x2=zd.x[1]-50;
    r.zh.scale.x=x2-x1;r.zh.position.x=(x1+x2)/2;
    const zc={propria:0x6366f1,difesa:0x3b82f6,centro:0x10b981,trequarti:0xf59e0b,bordo:0xef4444,area:0xdc2626};
    r.zh.material.color.setHex(zc[zone]||0xe8c547);r.zh.material.opacity=0.20;
  },[zone]);

  return<div ref={mountRef} style={{width:"100%",height:"clamp(260px, 65vh, 540px)",borderRadius:"0 0 12px 12px",overflow:"hidden",background:"#050810"}}/>;
}

/* WALKOUT OVERLAY */
function WalkoutOverlay({homeTeam,onDone}){
  const [tick,setTick]=useState(0);
  useEffect(()=>{if(tick>=100)return;const t=setTimeout(()=>setTick(n=>n+1),40);return()=>clearTimeout(t);},[tick]);
  useEffect(()=>{if(tick>=100)onDone();},[tick,onDone]);
  const nameList=["Portiere","Difensore","Difensore","Terzino","Terzino","Mediano","Centrocampista","Trequartista","Ala Sinistra","Ala Destra","Centravanti"];
  const visible=Math.floor(tick/9);
  return(
    <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:10,borderRadius:"0 0 12px 12px",backdropFilter:"blur(2px)"}}>
      <div style={{fontSize:10,color:"rgba(255,255,255,0.7)",letterSpacing:4,textTransform:"uppercase",marginBottom:8}}>Ingresso in campo</div>
      <div style={{fontSize:20,fontWeight:900,color:"#fff",marginBottom:16}}>{homeTeam?.name||homeTeam?.n}</div>
      <div style={{display:"flex",flexDirection:"column",gap:4,minHeight:130}}>
        {nameList.slice(0,visible).map((role,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,animation:"slideIn 0.3s ease"}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:homeTeam?.col||"#22c55e",flexShrink:0}}/>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.85)"}}>{role}</div>
          </div>
        ))}
      </div>
      <div style={{width:200,height:3,background:"rgba(255,255,255,0.1)",borderRadius:2,marginTop:14}}>
        <div style={{height:"100%",width:`${tick}%`,background:`linear-gradient(90deg,${homeTeam?.col||"#22c55e"},#f59e0b)`,borderRadius:2,transition:"width .04s"}}/>
      </div>
    </div>
  );
}

/* ========================================
   LIVE MATCH  (req #3,#4,#5,#6,#8)
======================================== */
function LiveMatch({player,opponent,context="career",onMatchEnd}){
  const [numHL]=useState(()=>context==="trial"?rng(2,4):rng(2,6));
  const [hlTimes]=useState(()=>{const step=Math.floor(82/numHL)||12;return Array.from({length:numHL},(_,i)=>8+step*i+rng(0,Math.max(1,step-4)));});
  const [situations]=useState(()=>shuffle(SITUATIONS).slice(0,numHL));
  const [stadium]=useState(()=>pick(STADIUMS));
  // context-aware realistic attendance
  const [attendance]=useState(()=>calcAttendance(context==="trial"?null:(player.club||opponent),context));
  // persistent seeded rosters for both teams
  const [homeRoster]=useState(()=>{const r=generateTeamRoster(player.club||opponent,player.season||1);r[10]={name:player.name,role:"Centravanti"};return r;});
  const [awayRoster]=useState(()=>generateTeamRoster(opponent,player.season||1));
  // 22 players + referee — generated once per match
  const [matchPlayers]=useState(()=>{
    const j=(x,y,d=4)=>({x:clamp(x+rng(-d,d),3,97),y:clamp(y+rng(-d,d),3,97)});
    return[
      // Home team (10 outfield + GK, protagonist is separate)
      {...j(5,50),team:"home"},{...j(18,12),team:"home"},{...j(18,38),team:"home"},
      {...j(18,62),team:"home"},{...j(18,88),team:"home"},{...j(38,25),team:"home"},
      {...j(38,50),team:"home"},{...j(38,75),team:"home"},{...j(55,22),team:"home"},{...j(55,78),team:"home"},
      // Away team (11)
      {...j(95,50),team:"away"},{...j(82,12),team:"away"},{...j(82,38),team:"away"},
      {...j(82,62),team:"away"},{...j(82,88),team:"away"},{...j(62,25),team:"away"},
      {...j(62,50),team:"away"},{...j(62,75),team:"away"},{...j(48,20),team:"away"},
      {...j(48,50),team:"away"},{...j(48,80),team:"away"},
      // Referee
      {...j(50,52,8),team:"ref"},
    ];
  });

  const [clock,setClock]=useState(0);
  const [score,setScore]=useState({home:0,away:0});
  const [phase,setPhase]=useState(context==="trial"?"playing":"matchday");
  const [hlIdx,setHlIdx]=useState(0);
  // position resets to situation startZone on each new highlight
  const [pPos,setPPos]=useState(()=>getStartPos(situations[0])||{x:58,y:50});
  const [mStats,setMStats]=useState({goals:0,assists:0,rb:0});
  const [energy,setEnergy]=useState(100);
  const [coms,setComs]=useState([]);
  const [outcome,setOutcome]=useState(null);
  const [chosenAct,setChosenAct]=useState(null);
  // Possession: based on player OVR vs opponent prestige (read directly from prop, not from oppPrestige var)
  const [possession,setPossession]=useState(()=>{
    const opp=opponent?.p||opponent?.prestige||65;
    const diff=(player.ovr||65)-opp;
    return clamp(Math.round(50+diff*0.28+rng(-5,5)),22,78);
  });

  const keysRef=useRef(new Set());
  const moveRef=useRef(null);
  const zone=getZone(pPos.x);
  const oppPrestige=opponent?.p||opponent?.prestige||65;
  const opponents=useRef([{x:76,y:35},{x:82,y:50},{x:79,y:65}]);

  const addCom=useCallback((text,color,t)=>{setComs(p=>[{text,color,t:t??clock},...p].slice(0,16));},[clock]);

  // reset position when highlight changes
  useEffect(()=>{
    if(phase==="hl_move"){
      const sp=getStartPos(situations[hlIdx]);
      setPPos(sp);
    }
  },[hlIdx,phase]);// eslint-disable-line

  // Clock — more commentary, possession updates
  useEffect(()=>{
    if(phase!=="playing")return;
    const iv=setInterval(()=>{
      setClock(c=>{
        const nx=c+1;
        if(nx>=90){setPhase("ended");return 90;}
        if(hlIdx<hlTimes.length&&nx>=hlTimes[hlIdx]){setPhase("hl_move");return nx;}
        // Commentary ~30% chance per tick (1 every ~3 min average)
        if(Math.random()<0.30){
          const eligible=BG_MATCH.filter(e=>!e.minClock||nx>=e.minClock);
          const ev=wPick(eligible);
          if(ev.ef==="team_goal")setScore(s=>({...s,home:s.home+1}));
          if(ev.ef==="opp_goal"){setScore(s=>({...s,away:s.away+1}));setPossession(p=>clamp(p-4,20,80));}
          if(ev.poss)setPossession(p=>clamp(p+(ev.poss||0),20,80));
          const cColor=ev.ef==="team_goal"?"#16a34a":ev.ef==="opp_goal"?"#dc2626":TH.faint;
          addCom(ev.txt,cColor,nx);
        }
        // Possession drift every ~8 ticks
        if(nx%8===0)setPossession(p=>clamp(p+rng(-2,2),20,80));
        return nx;
      });
    },300);
    return()=>clearInterval(iv);
  },[phase,hlIdx,addCom,oppPrestige,player.ovr]);

  // Keyboard — W/↑=forward, req #4: key 0 manual action start
  useEffect(()=>{
    const onD=e=>{
      keysRef.current.add(e.key);
      if((phase==="hl_move"||phase==="hl_choose")&&["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d"].includes(e.key))e.preventDefault();
      if(phase==="hl_choose"&&["1","2","3"].includes(e.key)){e.preventDefault();const idx=parseInt(e.key)-1;const sit=situations[hlIdx];if(sit?.actions[idx])handleAction(sit.actions[idx]);}
      // key 0 to advance action
      if(e.key==="0"||e.key==="Numpad0"){
        e.preventDefault();
        if(phase==="hl_move")setPhase("hl_choose");
        else if(phase==="hl_result")handleContinue();
        else if(phase==="playing"&&hlIdx<hlTimes.length){setClock(hlTimes[hlIdx]);setPhase("hl_move");}
      }
    };
    const onU=e=>keysRef.current.delete(e.key);
    document.addEventListener("keydown",onD);document.addEventListener("keyup",onU);
    return()=>{document.removeEventListener("keydown",onD);document.removeEventListener("keyup",onU);};
  },[phase,hlIdx,situations]);// eslint-disable-line

  // Movement RAF — req #3: movement limited by situation moveZone
  useEffect(()=>{
    if(phase!=="hl_move"&&phase!=="hl_choose"){if(moveRef.current)cancelAnimationFrame(moveRef.current);return;}
    const sit=situations[hlIdx];
    const mz=sit?.moveZone||{x:[0,100],y:[0,100]};
    const loop=()=>{
      const k=keysRef.current;let dx=0,dy=0;
      if(k.has("ArrowUp")   ||k.has("w"))dx=+1.8;
      if(k.has("ArrowDown") ||k.has("s"))dx=-1.8;
      if(k.has("ArrowRight")||k.has("d"))dy=+1.8;
      if(k.has("ArrowLeft") ||k.has("a"))dy=-1.8;
      // clamp movement to situation moveZone
      if(dx||dy)setPPos(p=>({x:clamp(p.x+dx,mz.x[0],mz.x[1]),y:clamp(p.y+dy,mz.y[0],mz.y[1])}));
      moveRef.current=requestAnimationFrame(loop);
    };
    moveRef.current=requestAnimationFrame(loop);
    return()=>{if(moveRef.current)cancelAnimationFrame(moveRef.current);};
  },[phase,hlIdx,situations]);

  const handleDPad=(dx,dy)=>{
    if(phase!=="hl_move"&&phase!=="hl_choose")return;
    const sit=situations[hlIdx];const mz=sit?.moveZone||{x:[0,100],y:[0,100]};
    setPPos(p=>({x:clamp(p.x+dx,mz.x[0],mz.x[1]),y:clamp(p.y+dy,mz.y[0],mz.y[1])}));
  };

  const handleAction=useCallback((action)=>{
    if(phase!=="hl_choose")return;
    // pass opponent prestige for difficulty scaling
    const rate=succRate(action,player.stats,pPos.x,oppPrestige)/100;
    const ok=Math.random()<clamp(rate+(Math.random()-.5)*.18,0.08,0.93);
    const key=ok?action.rew:action.fail;
    const txt=pick(OUTCOME_TX[key]||["Azione completata."]);
    setEnergy(e=>clamp(e-action.nrg,0,100));
    setMStats(s=>{let{goals,assists,rb}={...s};if(ok){if(key==="goal"){goals++;rb+=5;setScore(sc=>({...sc,home:sc.home+1}));}if(key==="assist"){assists++;rb+=3;setScore(sc=>({...sc,home:sc.home+1}));}if(!["goal","assist"].includes(key))rb+=1;}else{if(key==="goal_against"){rb-=3;setScore(sc=>({...sc,away:sc.away+1}));}if(key==="miss_easy")rb-=2;}return{goals,assists,rb};});
    addCom(txt,ok?"#16a34a":"#dc2626",clock);
    setOutcome({text:txt,ok,actionLabel:action.label});setChosenAct(action);setPhase("hl_result");
  },[phase,player.stats,pPos.x,clock,addCom,oppPrestige]);

  const handleContinue=()=>{const nx=hlIdx+1;if(nx>=numHL){setPhase("ended");}else{setHlIdx(nx);setOutcome(null);setChosenAct(null);setPhase("playing");}};
  const handleEnd=()=>{const raw=clamp(6.0+mStats.rb*.12+(score.home>score.away?.3:score.home===score.away?0:-.2),4.0,10.0);onMatchEnd({goals:mStats.goals,assists:mStats.assists,homeScore:score.home,awayScore:score.away,won:score.home>score.away,drew:score.home===score.away,opponent:opponent?.name||opponent?.n,oppAbbr:opponent?.abbr||opponent?.a,oppCol:opponent?.col||opponent?.c,rating:Math.round(raw*10)/10,context});};

  // Auto-continue 2 s after action result — no need to press 0
  useEffect(()=>{
    if(phase!=="hl_result")return;
    const t=setTimeout(handleContinue,2000);
    return()=>clearTimeout(t);
  },[phase,hlIdx]);// eslint-disable-line

  const curSit=situations[hlIdx];
  const winning=score.home>score.away,losing=score.home<score.away;
  const pct=Math.round((clock/90)*100);
  const show3D=["playing","hl_move","hl_choose","hl_result"].includes(phase);
  const matchPhase3D=phase==="walkout"?"walkout":"match";

  return(
    <div style={{width:"100%"}}>
      {phase==="matchday"&&<MatchdayCard homeTeam={player.club||opponent} awayTeam={opponent} stadium={stadium} attendance={attendance} league={player.club?.lg||(player.club?.isU18||context==="trial"?"Primavera U18":null)} onContinue={()=>setPhase("formations")} onSkip={()=>setPhase("playing")}/>}
      {phase==="formations"&&<FormationView homeTeam={player.club||opponent} awayTeam={opponent} player={player} homeRoster={homeRoster} awayRoster={awayRoster} onContinue={()=>setPhase("walkout")} onSkip={()=>setPhase("playing")}/>}

      {(show3D||phase==="walkout")&&(
        <Card style={{padding:0,overflow:"hidden",marginBottom:10}} shadow>
          {/* Scoreboard */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 18px",borderBottom:"1px solid "+TH.cardBorder,background:"#f8fafc"}}>
            <div style={{textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
              <TeamBadge team={player.club||opponent} size={28}/>
              <div><div style={{fontSize:9,color:TH.muted,fontWeight:700}}>{player.club?.abbr||player.club?.a||"TUA"}</div><div style={{fontSize:34,fontWeight:900,color:TH.success,lineHeight:1}}>{score.home}</div></div>
            </div>
            <div style={{textAlign:"center",flex:1}}>
              <div style={{display:"inline-block",padding:"3px 12px",borderRadius:20,fontSize:13,fontWeight:800,background:winning?"#dcfce7":losing?"#fee2e2":"#f1f5f9",color:winning?TH.success:losing?TH.danger:TH.muted,border:`1px solid ${winning?"#bbf7d0":losing?"#fecaca":TH.cardBorder}`}}>{phase==="walkout"?"🏃":phase==="ended"?"90'":phase==="matchday"||phase==="formations"?"–":`${clock}'`}</div>
              <div style={{fontSize:8,color:TH.faint,marginTop:2}}>{phase==="walkout"?"Ingresso":phase==="ended"?"Fine":`Azione ${hlIdx+1}/${numHL}`}</div>
              {show3D&&<div style={{marginTop:4,padding:"0 6px"}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:9,marginBottom:2}}>
                  <span style={{color:TH.success,fontWeight:700}}>{possession}%</span>
                  <span style={{color:TH.faint,fontSize:8}}>poss.</span>
                  <span style={{color:TH.danger,fontWeight:700}}>{100-possession}%</span>
                </div>
                <div style={{height:3,background:"#e2e8f0",borderRadius:2,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${possession}%`,background:`linear-gradient(90deg,${TH.success},${TH.primary})`,borderRadius:2,transition:"width .8s"}}/>
                </div>
              </div>}
            </div>
            <div style={{textAlign:"right",display:"flex",alignItems:"center",gap:8,flexDirection:"row-reverse"}}>
              <TeamBadge team={opponent} size={28}/>
              <div><div style={{fontSize:9,color:TH.muted,fontWeight:700}}>{opponent?.abbr||opponent?.a}</div><div style={{fontSize:34,fontWeight:900,color:TH.danger,lineHeight:1}}>{score.away}</div></div>
            </div>
          </div>

          {/* 3D Field + Action Overlay — controls visible without scrolling */}
          <div style={{position:"relative"}}>
            <ThreeField playerX={pPos.x} playerY={pPos.y} zone={zone}
              homeCol={player.club?.col||player.club?.c||"#22c55e"} oppCol={opponent?.col||opponent?.c||"#ef4444"}
              opponents={opponents.current} matchPhase={matchPhase3D} avatarId={player.avatarId||0}
              actionZoom={phase==="hl_move"||phase==="hl_choose"||phase==="hl_result"}
              allPlayers={matchPlayers}
              homeClub={player.club||opponent}
              onWalkoutDone={()=>setPhase("playing")}/>
            {phase==="walkout"&&<WalkoutOverlay homeTeam={player.club||opponent} onDone={()=>setPhase("playing")}/>}

            {/* HL_MOVE overlay */}
            {phase==="hl_move"&&curSit&&(
              <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(5,8,16,0.82)",backdropFilter:"blur(4px)",borderTop:"1px solid rgba(255,255,255,0.1)",padding:"6px 10px",zIndex:5}}>
                <div style={{color:"#f59e0b",fontSize:11,fontWeight:700,marginBottom:4}}>{clock}' — {curSit.text}</div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <DPad onMove={handleDPad} dark/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:9,color:"rgba(255,255,255,0.45)",marginBottom:5}}>📍 {ZONES[zone]?.label} · W/S/A/D</div>
                    <button onClick={()=>setPhase("hl_choose")} style={{width:"100%",padding:"9px",borderRadius:8,border:"none",background:"#2563eb",color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>✅ Pronto · [0]</button>
                  </div>
                </div>
              </div>
            )}

            {/* HL_RESULT — auto-continues after 2s */}
            {phase==="hl_result"&&outcome&&(
              <div style={{position:"absolute",bottom:0,left:0,right:0,background:outcome.ok?"rgba(5,50,20,0.88)":"rgba(50,5,5,0.88)",backdropFilter:"blur(4px)",borderTop:`1px solid ${outcome.ok?"rgba(34,197,94,0.4)":"rgba(239,68,68,0.4)"}`,padding:"10px 14px",zIndex:5,textAlign:"center"}}>
                <div style={{fontSize:16,fontWeight:900,color:outcome.ok?"#4ade80":"#f87171",marginBottom:3}}>{outcome.ok?"✅":"❌"} {chosenAct?.label}</div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.85)",marginBottom:6}}>{outcome.text}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>Continua automaticamente…</div>
              </div>
            )}
            {phase==="hl_choose"&&curSit&&(
              <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(5,8,16,0.86)",backdropFilter:"blur(4px)",borderTop:"1px solid rgba(255,255,255,0.1)",padding:"6px 8px",zIndex:5}}>
                <div style={{fontSize:9,color:"rgba(255,255,255,0.5)",marginBottom:5}}>{clock}' — {curSit.text} · <strong style={{color:"#f59e0b"}}>1·2·3</strong></div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5}}>
                  {curSit.actions.map((a,i)=>{
                    const rate=succRate(a,player.stats,pPos.x,oppPrestige);
                    const rc=rate>70?"#22c55e":rate>50?"#f59e0b":"#ef4444";
                    return(
                      <button key={i} onClick={()=>handleAction(a)} style={{padding:"6px 4px",background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.16)",borderRadius:9,color:"#fff",cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>
                        <div style={{fontSize:8,color:"rgba(255,255,255,0.35)"}}>Tasto {i+1}</div>
                        <div style={{fontSize:10,fontWeight:600,margin:"2px 0",color:"#e2e8f0"}}>{a.label}</div>
                        <div style={{fontSize:17,fontWeight:900,color:rc,lineHeight:1}}>{rate}%</div>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          {/* Progress bar */}
          {show3D&&<div style={{height:3,background:TH.cardBorder}}><div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,"+TH.success+","+TH.warning+")",transition:"width .3s"}}/></div>}
        </Card>
      )}

      {/* Match stats strip */}
      {show3D&&(
        <div style={{display:"flex",gap:6,marginBottom:8}}>
          {[{l:"⚽ Gol",v:mStats.goals},{l:"🎯 Assist",v:mStats.assists}].map(s=>(
            <Card key={s.l} style={{flex:1,padding:"7px",textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:900,color:TH.text}}>{s.v}</div>
              <div style={{fontSize:10,color:TH.muted}}>{s.l}</div>
            </Card>
          ))}
          <Card style={{flex:1,padding:"7px",textAlign:"center"}}>
            <div style={{fontSize:12,fontWeight:700,color:energy>50?TH.success:energy>25?TH.warning:TH.danger}}>{energy}%</div>
            <div style={{fontSize:10,color:TH.muted}}>⚡ Energ.</div>
          </Card>
          <Card style={{flex:2,padding:"7px",textAlign:"center"}}>
            <div style={{fontSize:10,color:TH.primary,fontWeight:700}}>{ZONES[zone]?.label||zone}</div>
            <div style={{fontSize:9,color:TH.faint}}>zona</div>
          </Card>
        </div>
      )}

      {/* Commentary */}
      {coms.length>0&&show3D&&(
        <Card style={{padding:"8px 12px",marginBottom:8}} shadow={false} bg="#f8fafc">
          {coms.map((c,i)=>(
            <div key={i} style={{fontSize:11,color:c.color,padding:"2px 0",borderBottom:i<coms.length-1?"1px solid "+TH.cardBorder:"none"}}>
              <span style={{color:TH.faint,marginRight:7,fontSize:9}}>{c.t}'</span>{c.text}
            </div>
          ))}
        </Card>
      )}

      {/* HL RESULT */}
      {phase==="hl_result"&&outcome&&(
        <Card border={outcome.ok?"#bbf7d0":"#fecaca"} bg={outcome.ok?"#f0fdf4":"#fff1f2"} style={{padding:"14px",display:"flex",alignItems:"center",gap:14}}>
          <div style={{fontSize:32}}>{outcome.ok?"✅":"❌"}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,color:outcome.ok?TH.success:TH.danger}}>{chosenAct?.label}</div>
            <div style={{fontSize:12,color:TH.text,marginTop:2}}>{outcome.text}</div>
          </div>
          <div style={{fontSize:10,color:TH.faint,textAlign:"right"}}>
            <div style={{fontSize:18,fontWeight:900,color:TH.faint}}>2s</div>
            <div>auto</div>
          </div>
        </Card>
      )}

      {/* ENDED */}
      {phase==="ended"&&(
        <Card style={{textAlign:"center",padding:"22px"}}>
          <div style={{fontSize:10,color:TH.muted,letterSpacing:2,marginBottom:8}}>FISCHIO FINALE</div>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"center",gap:14,marginBottom:6}}>
            <span style={{fontSize:50,fontWeight:900,color:TH.success}}>{score.home}</span>
            <span style={{fontSize:20,color:TH.faint}}>–</span>
            <span style={{fontSize:50,fontWeight:900,color:TH.danger}}>{score.away}</span>
          </div>
          <p style={{color:TH.muted,fontSize:12,margin:"0 0 16px"}}>{player.club?.name||player.club?.n||"La tua squadra"} vs {opponent?.name||opponent?.n}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
            {[{l:"Gol",v:mStats.goals,e:"⚽"},{l:"Assist",v:mStats.assists,e:"🎯"}].map(s=>(
              <Card key={s.l} style={{padding:"10px 6px",textAlign:"center"}}>
                <div style={{fontSize:17,marginBottom:2}}>{s.e}</div><div style={{fontSize:24,fontWeight:900,color:TH.warning}}>{s.v}</div><div style={{fontSize:10,color:TH.muted}}>{s.l}</div>
              </Card>
            ))}
          </div>
          {(()=>{const raw=clamp(6.0+mStats.rb*.12+(winning?.3:losing?-.2:0),4.0,10.0),rating=Math.round(raw*10)/10,rc=rating>=8?TH.success:rating>=6.5?TH.warning:TH.danger;return<div style={{marginBottom:18}}><div style={{fontSize:10,color:TH.muted,marginBottom:4}}>VALUTAZIONE</div><div style={{fontSize:52,fontWeight:900,color:rc,lineHeight:1}}>{rating}</div><div style={{fontSize:12,color:rc,marginTop:4}}>{rating>=8?"Eccellente!":rating>=7?"Buona partita":rating>=6?"Sufficiente":"Da migliorare"}</div></div>;})()}
          <Btn onClick={handleEnd} v={context==="trial"?"primary":"green"} fw style={{padding:"13px",fontSize:14}}>
            {context==="trial"?"📋 Risultati provino":"🏟️ Torna alla carriera"}
