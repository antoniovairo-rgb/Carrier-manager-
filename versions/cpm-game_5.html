    const onKey=e=>{
      // Don't capture when typing in inputs
      if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")return;
      if(e.key==="Escape"){
        e.preventDefault();
        if(screen==="match"){setScreen("dashboard");setTab("dashboard");}
        else if(screen==="postmatch"){setScreen("dashboard");setTab("dashboard");}
        else if(weekLiveModal){setWeekLiveModal(null);}
        else if(showAdvanceConfirm){setShowAdvanceConfirm(false);}
        else if(transferOffer){setTransferOffer(null);}
      }
      if((e.key===" "||e.code==="Space")){
        e.preventDefault();
        if(weekLiveModal){setWeekLiveModal(null);}
        else if(showAdvanceConfirm){doAdvanceWeek();}
        else if(screen==="postmatch"){setScreen("dashboard");setTab("dashboard");}
      }
      if(e.key==="Enter"&&screen==="dashboard"&&!weekLiveModal&&!showAdvanceConfirm&&!transferOffer){
        e.preventDefault();
        if(getThisWeekMatchday())startMatch();
      }
      if((e.key==="0"||e.code==="Numpad0")&&screen==="dashboard"&&!weekLiveModal&&!showAdvanceConfirm){
        e.preventDefault();
        setShowAdvanceConfirm(true);
      }
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[screen,weekLiveModal,showAdvanceConfirm,transferOffer]);// eslint-disable-line

  // Autosave — debounced 600ms to avoid redundant writes during rapid state updates
  const saveTimerRef=useRef(null);
  useEffect(()=>{
    if(saveTimerRef.current)clearTimeout(saveTimerRef.current);
    saveTimerRef.current=setTimeout(()=>{
      storage.save({phase:"career",player},currentSlot).then(ok=>{if(ok)setLastSaved(Date.now());});
    },600);
    return()=>{if(saveTimerRef.current)clearTimeout(saveTimerRef.current);};
  },[player]);// eslint-disable-line

  // Manual save
  const doSave=useCallback(async()=>{
    const ok=await storage.save({phase:"career",player},currentSlot);
    if(ok){setLastSaved(Date.now());notify("💾 Carriera salvata!",TH.success);if(onRefreshSlots)onRefreshSlots();}
    else notify("⚠️ Errore nel salvataggio.",TH.danger);
  },[player,currentSlot,onRefreshSlots]);// eslint-disable-line

  // Export to JSON
  const exportSave=()=>{
    const data={phase:"career",player,savedAt:Date.now(),saveVersion:SAVE_VERSION};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;
    a.download=`cpm-${player.name.replace(/\s/g,"-")}-S${player.season||1}.json`;
    a.click();URL.revokeObjectURL(url);
    notify("📁 File esportato!",TH.success);
  };

  const goTab=t=>{setTab(t);setScreen(t);};
  // only allow playing if current week has a scheduled match
  const getThisWeekMatchday=()=>{
    const cal=player.calendar||[];
    return cal.find(md=>md.week===(player.week||1)&&!md.played)||null;
  };
  const startMatch=()=>{
    if(player.injured){notify("Sei infortunato!",TH.danger);return;}
    const md=getThisWeekMatchday();
    if(!md){notify("Nessuna partita programmata questa settimana.",TH.warning);return;}
    const lc=getLeagueClubs(player);
    const opp=lc.find(c=>c.id===md.opponentId)||lc.find(c=>c.n===md.opponentName)||pick(lc.filter(c=>c.id!==player.club?.id&&c.n!==player.club?.n));
    if(!opp){notify("Nessun avversario disponibile.",TH.danger);return;}
    setMatchOpp(opp);setScreen("match");
  };

  const onMatchEnd=result=>{
    setLastMatch(result);
    setPlayer(p=>{
      let ns={...p.stats};
      if(Math.random()<.3&&p.age<22){const k=pick(Object.keys(p.stats));ns={...ns,[k]:clamp(p.stats[k]+1,1,99)};}
      if(result.goals>1&&Math.random()<.5)ns={...ns,tiro:clamp(ns.tiro+1,1,99)};
      if(result.assists>0&&Math.random()<.4)ns={...ns,passaggio:clamp(ns.passaggio+1,1,99)};
      const newOvr=calcOvr(ns);
      const moD=result.won?6:result.drew?2:-4;
      const logE=`⚽ vs ${result.opponent} (${result.homeScore}-${result.awayScore}) | ${result.goals}⚽ ${result.assists}🎯 | ${result.rating}★`;
      const newHistory=[...(p.matchHistory||[]),{week:p.week||1,opponent:result.opponent,oppAbbr:result.oppAbbr,oppCol:result.oppCol,homeScore:result.homeScore,awayScore:result.awayScore,goals:result.goals,assists:result.assists,rating:result.rating,won:result.won,drew:result.drew}].slice(-200);
      // update standings with player result + simulate other matches
      const clubId=p.club?.id||p.club?.n;
      const newStandings=updateStandings(p.standings||initStandings(getLeagueClubs(p)),clubId,result);
      // mark calendar entry as played
      const newCal=(p.calendar||[]).map(md=>md.week===(p.week||1)&&!md.played?{...md,played:true,result:{homeScore:result.homeScore,awayScore:result.awayScore,won:result.won,drew:result.drew}}:md);
      return{...p,stats:ns,ovr:newOvr,goals:p.goals+result.goals,assists:p.assists+result.assists,matches:p.matches+1,totalGoals:p.totalGoals+result.goals,totalAssists:p.totalAssists+result.assists,totalMatches:p.totalMatches+1,morale:clamp(p.morale+moD,0,100),fatigue:clamp(p.fatigue+rng(12,22),0,100),week:(p.week||1)+1,weekLived:false,log:[logE,...(p.log||[])].slice(0,60),matchHistory:newHistory,standings:newStandings,calendar:newCal};
    });
    setScreen("postmatch");setTab("dashboard");
  };

  // "Vivi la settimana" — applies events/form changes, does NOT advance week counter
  const liveCurrentWeek=()=>{
    if(player.weekLived){notify("Hai già vissuto questa settimana. Avanza per passare alla prossima.",TH.warning);return;}
    setPlayer(p=>{
      if(p.week>38)return p; // nothing to do if season ended
      const ev=Math.random()<0.78?wPick(WEEKLY_EVENTS):null;
      let upd={weekLived:true};
      if(ev){
        const ef=ev.ef||{};
        const extras={
          morale:clamp((p.morale||70)+(ef.morale||0),0,100),
          fatigue:clamp((p.fatigue||0)+(ef.fatigue||0),0,100),
          form:clamp((p.form||70)+(ef.form||0),0,100),
          popularity:clamp((p.popularity||20)+(ef.popularity||0),0,100),
          coachTrust:clamp((p.coachTrust||60)+(ef.coachTrust||0),0,100),
          value:Math.max(0.5,(p.value||0.8)+(ef.value||0)),
        };
        const newStats={...p.stats};
        if(ef.tecnica)newStats.tecnica=clamp(p.stats.tecnica+(ef.tecnica),1,99);
        if(ef.velocità)newStats.velocità=clamp(p.stats.velocità+(ef.velocità),1,99);
        if(ef.tiro)newStats.tiro=clamp(p.stats.tiro+(ef.tiro),1,99);
        if(ef.passaggio)newStats.passaggio=clamp(p.stats.passaggio+(ef.passaggio),1,99);
        if(ef.fisico)newStats.fisico=clamp(p.stats.fisico+(ef.fisico),1,99);
        if(ef.posizionamento)newStats.posizionamento=clamp(p.stats.posizionamento+(ef.posizionamento),1,99);
        if(ef.mentalità)newStats.mentalità=clamp(p.stats.mentalità+(ef.mentalità),1,99);
        upd={...upd,...extras,stats:newStats,ovr:calcOvr(newStats),log:[ev.txt,...(p.log||[])].slice(0,60)};
        setTimeout(()=>setWeekLiveModal({event:ev,changes:{morale:ef.morale||0,form:ef.form||0,fatigue:ef.fatigue||0}}),50);
      }else{
        setTimeout(()=>setWeekLiveModal({event:{txt:"⚽ Settimana di allenamento regolare. Nessun evento particolare."},changes:{}}),50);
      }
      return{...p,...upd};
    });
  };

  // advance week: calendar-driven, simulates missed matches, resets season at week>38
  const doAdvanceWeek=()=>{
    setShowAdvanceConfirm(false);
    const isInU18=(player.proStatus||"u18")==="u18";
    const weekVal=player.week||1;
    if(isInU18&&weekVal>=38){
      const hist={season:player.season||1,club:player.club?.name||player.club?.n,goals:player.goals||0,assists:player.assists||0,matches:player.matches||0,ovr:player.ovr||60};
      setPlayer(p=>({...p,u18Seasons:(p.u18Seasons||0)+1,history:[...(p.history||[]),hist],log:[`🏁 Fine U18 S.${p.season||1}: ${p.goals||0}⚽ ${p.assists||0}🎯`,...(p.log||[])].slice(0,60)}));
      setScreen("proTransition");
      return;
    }
    setPlayer(p=>{
      if(p.week>38){
        // new season: reset stats, standings, calendar
        const hist={season:p.season,club:p.club?.name||p.club?.n,goals:p.goals,assists:p.assists,matches:p.matches,ovr:p.ovr};
        const newSeason=(p.season||1)+1;
        const lc=getLeagueClubs(p);
        const newStandings=initStandings(lc);
        const seed=newSeason*777+hashStr(p.club?.id||p.club?.n||"u18");
        const newCalendar=generateSeasonCalendar(p.club||{id:"u18",n:"U18"},lc,seed);
        const newContract={...p.contract,duration:(p.contract?.duration||1)-1,expiresAtSeason:p.contract?.expiresAtSeason||newSeason+1};
        return{...p,season:newSeason,age:p.age+1,week:1,weekLived:false,goals:0,assists:0,matches:0,fatigue:0,skillPoints:(p.skillPoints||0)+2,contract:newContract,history:[...(p.history||[]),hist],log:[`🏁 Fine S.${p.season}: ${p.goals}⚽ ${p.assists}🎯`,...(p.log||[])].slice(0,60),standings:newStandings,calendar:newCalendar,matchHistory:[]};
      }
      // if this week had a scheduled unplayed match, auto-simulate it
      const md=(p.calendar||[]).find(m=>m.week===(p.week||1)&&!m.played);
      let updP={...p};
      if(md){
        const lc=getLeagueClubs(p);
        const opp=lc.find(c=>c.id===md.opponentId)||lc.find(c=>c.n===md.opponentName);
        if(opp){
          const sim=simulateMatch(p.club,opp,p.ovr||65,md.isHome);
          const clubId=p.club?.id||p.club?.n;
          const newSt=updateStandings(p.standings||initStandings(getLeagueClubs(p)),clubId,sim);
          const newCal=(p.calendar||[]).map(m=>m.week===(p.week||1)&&!m.played?{...m,played:true,result:{homeScore:sim.homeScore,awayScore:sim.awayScore,won:sim.won,drew:sim.drew},simulated:true}:m);
          const newHistory=[...(p.matchHistory||[]),{week:p.week||1,opponent:opp.n,oppAbbr:opp.a,oppCol:opp.c,homeScore:sim.homeScore,awayScore:sim.awayScore,goals:0,assists:0,rating:sim.rating,won:sim.won,drew:sim.drew,simulated:true}].slice(-200);
          updP={...updP,standings:newSt,calendar:newCal,matchHistory:newHistory,matches:(p.matches||0)+1,goals:p.goals,assists:p.assists,morale:clamp(p.morale+(sim.won?3:sim.drew?1:-2),0,100)};
        }
      }
      if(Math.random()<0.08&&p.matches>3){const offer=generateTransferOffer(p);if(offer)setTransferOffer(offer);}
      if(p.injured&&(p.injuryWeeks||0)>0){return{...updP,week:(p.week||1)+1,weekLived:false,injuryWeeks:p.injuryWeeks-1,injured:p.injuryWeeks-1>0,fatigue:Math.max(0,(p.fatigue||0)-8)};}
      return{...updP,week:(p.week||1)+1,weekLived:false};
    });
    notify("⏭️ Settimana avanzata");
  };

  // pro transition: generate fresh calendar + standings for new club/league
  const onProChoose=useCallback((offer)=>{
    setPlayer(p=>{
      const newAge=(p.age||17)+1;
      const newSeason=(p.season||1)+1;
      const targetClub=offer.isStayU18?p.club:offer.club;
      const _lc0=offer.isStayU18?[]:CLUBS.filter(c=>c.lg===offer.club?.lg);
      const lc=offer.isStayU18?getLeagueClubs(p):(_lc0.length>=4?_lc0:getLeagueClubs({...p,club:offer.club,proStatus:"pro"}));
      const newStandings=initStandings(lc.length?lc:getLeagueClubs(p));
      const seed=newSeason*777+hashStr(targetClub?.id||targetClub?.n||"u18");
      const newCalendar=generateSeasonCalendar(targetClub||{id:"u18",n:"U18"},lc.length?lc:getLeagueClubs(p),seed);
      const base={...p,week:1,weekLived:false,season:newSeason,age:newAge,goals:0,assists:0,matches:0,matchHistory:[],fatigue:clamp((p.fatigue||0)-30,0,100),skillPoints:(p.skillPoints||0)+2,morale:clamp((p.morale||70)+(offer.moralBonus||0),0,100),contract:{duration:offer.duration||1,wage:offer.wage||500,expiresAtSeason:newSeason+(offer.duration||1)},standings:newStandings,calendar:newCalendar};
      if(offer.isStayU18){
        return{...base,log:[`🔄 Resto in Under 18 (S.${newSeason})`,...(p.log||[])].slice(0,60)};
      }
      return{...base,club:offer.club,isU18:false,proStatus:"pro",value:Math.max(0.5,(p.value||0.8)+0.5),popularity:clamp((p.popularity||20)+15,0,100),log:[`🎓 PROFESSIONISTA! ${offer.contractType} con ${offer.club?.n||offer.club?.name}!`,...(p.log||[])].slice(0,60)};
    });
    setScreen("dashboard");setTab("dashboard");
    notify("🎓 Nuova stagione iniziata!",TH.success);
  },[]);// eslint-disable-line

  const upgradeSkill=k=>{if(!player.skillPoints)return;setPlayer(p=>{const ns={...p.stats,[k]:clamp(p.stats[k]+rng(1,3),1,99)};return{...p,stats:ns,ovr:calcOvr(ns),skillPoints:p.skillPoints-1};});notify(`${k} migliorato!`,TH.accent);};

  // accept transfer: update club, league, calendar, standings
  const acceptTransfer=()=>{
    if(!transferOffer)return;
    const tc=transferOffer;
    setPlayer(p=>{
      const newClub={...tc.club,transferType:tc.type,isU18:false};
      const lc=CLUBS.filter(c=>c.lg===tc.club.lg);
      const lc2=CLUBS.filter(c=>c.nat===tc.club.nat);
      const lcs=lc.length>=4?lc:lc2.length>=4?lc2:CLUBS.slice(0,16);
      const newStandings=initStandings(lcs);
      const seed=(p.season||1)*777+hashStr(tc.club.id||tc.club.n||"x");
      const newCalendar=generateSeasonCalendar(newClub,lcs,seed);
      return{...p,
        club:newClub,isU18:false,proStatus:"pro",
        morale:clamp(p.morale+(tc.moralBonus||10),0,100),
        offerHistory:[...(p.offerHistory||[]),{club:tc.club.n,type:tc.type,season:p.season,accepted:true}],
        log:[`🔄 ${tc.type}: ${tc.club.n} (${tc.club.lg||tc.club.nat})!`,...(p.log||[])].slice(0,60),
        standings:newStandings,calendar:newCalendar,
      };
    });
    setTransferOffer(null);
    notify(`✅ Benvenuto a ${tc.club.n}!`,TH.success);
  };

  const ovr=player.ovr||calcOvr(player.stats),week=player.week||1,season=player.season||1;

  if(screen==="proTransition")return(
    <div style={{width:"100%"}}>
      <ProTransitionScreen player={player} onChoose={onProChoose}/>
    </div>
  );

  if(screen==="match"&&matchOpp)return(
    <div style={{width:"100%"}}>
      <button onClick={()=>{setScreen("dashboard");setTab("dashboard");}} style={{background:"none",border:"none",color:TH.muted,cursor:"pointer",fontSize:13,marginBottom:8,display:"flex",alignItems:"center",gap:6}}>← Carriera</button>
      <LiveMatch player={player} opponent={matchOpp} context="career" onMatchEnd={onMatchEnd}/>
    </div>
  );

  if(screen==="postmatch"&&lastMatch){
    const r=lastMatch,rating=r.rating,rc=rating>=8?TH.success:rating>=6.5?TH.warning:TH.danger;
    return <div style={{width:"100%"}}><Card style={{textAlign:"center",padding:"24px",maxWidth:560,margin:"0 auto"}}><div style={{fontSize:10,color:TH.muted,letterSpacing:2,marginBottom:8}}>POST MATCH</div><div style={{fontSize:28,fontWeight:900,marginBottom:4,color:TH.text}}><span style={{color:TH.success}}>{r.homeScore}</span><span style={{color:TH.faint,margin:"0 10px"}}>–</span><span style={{color:TH.danger}}>{r.awayScore}</span></div><p style={{color:TH.muted,fontSize:12,margin:"0 0 14px"}}>vs {r.opponent}</p><div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>{[{l:"Gol",v:r.goals,e:"⚽"},{l:"Assist",v:r.assists,e:"🎯"},{l:"Voto",v:rating,e:"⭐",c:rc}].map(s=><Card key={s.l} style={{padding:"10px 6px",textAlign:"center"}}><div style={{fontSize:16,marginBottom:2}}>{s.e}</div><div style={{fontSize:20,fontWeight:900,color:s.c||TH.warning}}>{s.v}</div><div style={{fontSize:9,color:TH.muted}}>{s.l}</div></Card>)}</div><div style={{fontSize:50,fontWeight:900,color:rc,lineHeight:1,marginBottom:4}}>{rating}</div><div style={{fontSize:12,color:rc,marginBottom:18}}>{rating>=8?"Eccellente!":rating>=7?"Buona partita":rating>=6?"Sufficiente":"Da migliorare"}</div><Btn onClick={()=>setScreen("dashboard")} v="green" fw style={{padding:"13px",fontSize:14}}>🏟️ Torna alla Dashboard</Btn></Card></div>;
  }

  const tabs=[{id:"dashboard",e:"🏠",l:"Home"},{id:"calendar",e:"📅",l:"Calendario"},{id:"standings",e:"📊",l:"Classifica"},{id:"training",e:"💪",l:"Allena"},{id:"profile",e:"👤",l:"Profilo"}];

  return(
    <div className="cpm-career">
      <Notif msg={notif?.msg} color={notif?.color}/>
      {/* Week event toast */}
      {weekEvent&&<div style={{position:"fixed",top:70,left:"50%",transform:"translateX(-50%)",background:TH.card,border:"1px solid "+TH.cardBorder,color:TH.text,padding:"12px 20px",borderRadius:12,fontSize:12,fontWeight:600,zIndex:9998,boxShadow:TH.shadow,maxWidth:340,textAlign:"center"}}>{weekEvent.txt}</div>}

      {/* == WeekLife modal == */}
      {weekLiveModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:9997,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <Card style={{maxWidth:380,width:"100%",padding:"22px"}}>
            <div style={{fontSize:11,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:6}}>Settimana {player.week} — {player.club?.name||player.club?.n}</div>
            <div style={{fontSize:18,marginBottom:14}}>📋 Questa settimana</div>
            <Card bg="#f0fdf4" border="#bbf7d0" shadow={false} style={{padding:"12px 14px",marginBottom:12}}>
              <div style={{fontSize:13,color:TH.text,lineHeight:1.7}}>{weekLiveModal.event.txt}</div>
            </Card>
            {Object.keys(weekLiveModal.changes||{}).length>0&&(
              <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                {weekLiveModal.changes.morale!==undefined&&weekLiveModal.changes.morale!==0&&<div style={{padding:"4px 10px",borderRadius:20,background:weekLiveModal.changes.morale>0?"#dcfce7":"#fee2e2",color:weekLiveModal.changes.morale>0?TH.success:TH.danger,fontSize:11,fontWeight:700}}>😄 Morale {weekLiveModal.changes.morale>0?"+":""}{weekLiveModal.changes.morale}</div>}
                {weekLiveModal.changes.form!==undefined&&weekLiveModal.changes.form!==0&&<div style={{padding:"4px 10px",borderRadius:20,background:weekLiveModal.changes.form>0?"#dcfce7":"#fee2e2",color:weekLiveModal.changes.form>0?TH.success:TH.danger,fontSize:11,fontWeight:700}}>💪 Forma {weekLiveModal.changes.form>0?"+":""}{weekLiveModal.changes.form}</div>}
                {weekLiveModal.changes.fatigue!==undefined&&weekLiveModal.changes.fatigue!==0&&<div style={{padding:"4px 10px",borderRadius:20,background:weekLiveModal.changes.fatigue<0?"#dcfce7":"#fef9c3",color:weekLiveModal.changes.fatigue<0?TH.success:TH.warning,fontSize:11,fontWeight:700}}>⚡ Fatica {weekLiveModal.changes.fatigue>0?"+":""}{weekLiveModal.changes.fatigue}</div>}
              </div>
            )}
            <div style={{fontSize:11,color:TH.faint,marginBottom:14}}>La settimana è stata vissuta. Clicca "Avanza" per passare alla prossima o gioca la partita prima.</div>
            <Btn onClick={()=>setWeekLiveModal(null)} v="primary" fw style={{padding:"11px"}}>✅ Capito</Btn>
          </Card>
        </div>
      )}

      {/* == Advance week confirm == */}
      {showAdvanceConfirm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:9996,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <Card style={{maxWidth:360,width:"100%",padding:"22px",textAlign:"center"}}>
            <div style={{fontSize:28,marginBottom:10}}>⏭️</div>
            <div style={{fontSize:16,fontWeight:800,marginBottom:6,color:TH.text}}>Avanzare alla W.{(player.week||1)+1}?</div>
            <div style={{fontSize:12,color:TH.muted,marginBottom:18,lineHeight:1.7}}>Proseguendo verranno consolidati gli eventi della settimana, il calendario verrà avanzato e le prossime statistiche aggiornate.</div>
            <div style={{display:"flex",gap:10}}>
              <Btn onClick={()=>setShowAdvanceConfirm(false)} v="secondary" fw>Annulla</Btn>
              <Btn onClick={doAdvanceWeek} v="primary" fw>⏭️ Conferma avanzamento</Btn>
            </div>
          </Card>
        </div>
      )}

      {/* req #13: transfer offer modal */}
      {transferOffer&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:9997,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <Card style={{maxWidth:380,width:"100%",padding:"24px"}}>
            <div style={{textAlign:"center",marginBottom:16}}>
              <TeamBadge team={transferOffer.club} size={56}/>
              <div style={{fontSize:18,fontWeight:900,color:TH.text,marginTop:8}}>{transferOffer.club.n}</div>
              <div style={{fontSize:12,color:TH.muted}}>{transferOffer.club.nat} · {transferOffer.club.lg}</div>
            </div>
            <Card style={{padding:"12px",marginBottom:14}} bg="#eff6ff" border="#bfdbfe" shadow={false}>
              <div style={{fontSize:13,fontWeight:700,color:TH.primary,marginBottom:4}}>📩 Offerta: {transferOffer.type}</div>
              <div style={{fontSize:12,color:TH.muted,lineHeight:1.7}}>
                Minutaggio stimato: <strong>{transferOffer.minutaggio}%</strong><br/>
                Morale: <strong style={{color:TH.success}}>+{transferOffer.moralBonus}</strong><br/>
                Crescita: <strong style={{color:TH.accent}}>+{transferOffer.growthBonus}</strong><br/>
                Prestigio club: <strong>{transferOffer.club.p}</strong>
              </div>
            </Card>
            <div style={{display:"flex",gap:10}}>
              <Btn onClick={()=>setTransferOffer(null)} v="secondary" fw>Rifiuta</Btn>
              <Btn onClick={acceptTransfer} v="primary" fw>Accetta →</Btn>
            </div>
          </Card>
        </div>
      )}

      {/* HEADER */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
        <AvatarSVG id={player.avatarId||0} size={52}/>
        <div style={{flex:1}}>
          <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:2}}>{player.nation} · Attaccante</div>
          <h1 style={{margin:"1px 0 0",fontSize:17,fontWeight:900,letterSpacing:-.5,color:TH.text}}>{player.name}</h1>
          <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:4,marginTop:1}}>
            <span style={{fontSize:11,color:player.club?.col||player.club?.c||TH.primary,fontWeight:700}}>{player.club?.n||player.club?.name||"–"}</span>
            {player.club?.transferType&&<span style={{fontSize:9,background:"#eff6ff",color:TH.primary,padding:"1px 7px",borderRadius:8,fontWeight:600,border:"1px solid #bfdbfe"}}>{player.club.transferType}</span>}
            <span style={{fontSize:10,color:TH.muted}}>{player.club?.lg?`· ${player.club.lg}`:player.proStatus==="u18"?"· U18":""} · S.{season} W.{week}/38</span>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end"}}>
          <OvrRing value={ovr}/>
          <button onClick={doSave} title="Salva carriera" style={{fontSize:10,color:TH.muted,background:"none",border:"1px solid "+TH.cardBorder,borderRadius:7,padding:"2px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
            💾 Salva{lastSaved?<span style={{color:TH.faint}}> · {new Date(lastSaved).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</span>:null}
          </button>
        </div>
      </div>

      {/* DASHBOARD */}
      {tab==="dashboard"&&(
        <div className="cpm-dash-grid">
          <Card border="#bbf7d0" bg="#f0fdf4">
            <div style={{fontSize:10,color:TH.success,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Stagione {season} · W.{week}/38</div>
            <div style={{display:"flex",justifyContent:"space-around",marginBottom:14}}>{[{l:"Partite",v:player.matches||0},{l:"Gol",v:player.goals||0},{l:"Assist",v:player.assists||0}].map(s=><div key={s.l} style={{textAlign:"center"}}><div style={{fontSize:28,fontWeight:900,color:TH.success}}>{s.v}</div><div style={{fontSize:10,color:TH.muted}}>{s.l}</div></div>)}</div>
            {(()=>{
              const md=getThisWeekMatchday();
              const hasMatch=!!md&&!player.injured;
              const alreadyPlayed=!!(player.calendar||[]).find(m=>m.week===(player.week||1)&&m.played);
              if(player.injured)return<div style={{padding:"10px 14px",background:"#fee2e2",borderRadius:9,color:TH.danger,fontSize:13,marginBottom:10}}>🩹 Infortunato — {player.injuryWeeks||0} sett. di recupero</div>;
              if(alreadyPlayed){const mh=(player.matchHistory||[]).find(m=>m.week===(player.week||1));return<div style={{padding:"10px 14px",background:mh?.won?"#f0fdf4":mh?.drew?"#fefce8":"#fff1f2",borderRadius:9,border:`1px solid ${mh?.won?"#bbf7d0":mh?.drew?"#fde68a":"#fecaca"}`,color:mh?.won?TH.success:mh?.drew?TH.warning:TH.danger,fontSize:12,marginBottom:10,fontWeight:700}}>✅ Partita giocata W.{player.week||1} — {mh?`${mh.homeScore}–${mh.awayScore} vs ${mh.opponent||""}`:""}{mh?.simulated?" (simulata)":""}</div>;}
              if(hasMatch)return<Btn onClick={startMatch} v="green" fw style={{padding:"14px",fontSize:15,marginBottom:10}}>⚽ GIOCA vs {md.opponentName} {md.isHome?"🏟️":"✈️"} · W.{md.week} [Enter]</Btn>;
              return<div style={{padding:"10px 14px",background:"#f8fafc",borderRadius:9,border:"1px solid "+TH.cardBorder,color:TH.faint,fontSize:12,marginBottom:10,textAlign:"center"}}>⏳ Nessuna partita questa settimana — avanza con ⏭️</div>;
            })()}
            {/* "Vivi la settimana" — events/form but NO week advance */}
            <div style={{background:player.weekLived?"linear-gradient(135deg,#334155,#374151)":"linear-gradient(135deg,#1e3a5f,#1e4d3a)",borderRadius:12,padding:"12px 14px",cursor:player.weekLived?"default":"pointer",opacity:player.weekLived?0.7:1,marginBottom:8}}
              onClick={!player.weekLived?liveCurrentWeek:undefined}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <div style={{fontSize:13,fontWeight:800,color:"#fff"}}>{player.weekLived?"✅ Settimana già vissuta":"⚡ Vivi la Settimana"}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.55)"}}>W.{week}</div>
              </div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>
                {player.weekLived?"Hai già vissuto questa settimana. Avanza per passare alla prossima.":"Allenamento, eventi, crescita e imprevisti — senza avanzare il tempo."}
              </div>
            </div>
            {/* "Avanza settimana" — always with confirmation */}
            <button onClick={()=>setShowAdvanceConfirm(true)} style={{width:"100%",padding:"10px 14px",borderRadius:12,border:`1px solid ${TH.cardBorder}`,background:TH.card,cursor:"pointer",fontFamily:"inherit",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontSize:13,fontWeight:700,color:TH.text}}>⏭️ Avanza Settimana</span>
              <span style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:9,background:"#e2e8f0",borderRadius:4,padding:"1px 5px",color:TH.muted,fontFamily:"monospace"}}>0</span>
                <span style={{fontSize:11,color:TH.muted}}>W.{week}→{week+1}</span>
              </span>
            </button>
            {/* Export */}
            <button onClick={exportSave} style={{width:"100%",padding:"7px",borderRadius:9,border:`1px solid ${TH.cardBorder}`,background:"transparent",cursor:"pointer",fontFamily:"inherit",fontSize:11,color:TH.faint,marginBottom:0}}>📁 Esporta salvataggio JSON</button>
            <div style={{height:3,background:"#e2e8f0",borderRadius:2,marginTop:10}}><div style={{height:"100%",width:`${(week/38)*100}%`,background:TH.success,borderRadius:2,transition:"width .4s"}}/></div>
          </Card>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[{l:"Morale",v:player.morale||70,e:"😄",c:((player.morale||70)>60)?TH.success:((player.morale||70)>30)?TH.warning:TH.danger},{l:"Forma",v:100-(player.fatigue||0),e:"💪",c:((player.fatigue||0)<40)?TH.success:((player.fatigue||0)<70)?TH.warning:TH.danger},{l:"Fiducia mister",v:player.coachTrust||60,e:"🤝",c:TH.primary},{l:"Popolarità",v:player.popularity||20,e:"⭐",c:TH.accent}].map(it=>(
              <Card key={it.l} style={{padding:"12px 14px"}}>
                <div style={{fontSize:18,marginBottom:3}}>{it.e}</div><div style={{fontSize:10,color:TH.muted,marginBottom:2}}>{it.l}</div>
                <div style={{fontSize:18,fontWeight:800,color:it.c}}>{it.v}</div>
                <div style={{height:3,background:"#e2e8f0",borderRadius:2,marginTop:5}}><div style={{height:"100%",width:`${it.v}%`,background:it.c,borderRadius:2}}/></div>
              </Card>
            ))}
          </div>
          {(player.log||[]).length>0&&<Card style={{padding:"12px 14px"}}><div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:6}}>Ultime notizie</div>{(player.log||[]).slice(0,5).map((e,i)=><div key={i} style={{fontSize:11,color:TH.text,padding:"3px 0",borderBottom:i<4?"1px solid "+TH.cardBorder:"none"}}>{e}</div>)}</Card>}
        </div>
      )}

      {/* CALENDAR  (BUG 4 — shows real scheduled matches) */}
      {tab==="calendar"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {/* Upcoming matches from calendar */}
          {(player.calendar||[]).length>0&&(()=>{
            const upcoming=(player.calendar||[]).filter(md=>md.week>=(week)&&!md.played).slice(0,5);
            const lc=getLeagueClubs(player);
            if(!upcoming.length)return null;
            return(
              <Card>
                <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Prossime partite</div>
                {upcoming.map((md,i)=>{
                  const opp=lc.find(c=>c.id===md.opponentId)||lc.find(c=>c.n===md.opponentName)||{n:md.opponentName,a:"???",c:"#888",c2:"#fff"};
                  const isCur=md.week===week;
                  return(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:i<upcoming.length-1?"1px solid "+TH.cardBorder:"none",background:isCur?"#eff6ff":"transparent",borderRadius:isCur?6:0,paddingLeft:isCur?8:0}}>
                      <div style={{width:28,height:28,flexShrink:0}}><TeamBadge team={opp} size={28}/></div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:isCur?700:500,color:isCur?TH.primary:TH.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {isCur&&"▶ "}{md.isHome?"🏟️":"✈️"} vs {md.opponentName}
                        </div>
                        <div style={{fontSize:10,color:TH.muted}}>Giornata {md.matchday} · W.{md.week}</div>
                      </div>
                      {isCur&&<Btn onClick={startMatch} v="green" style={{padding:"6px 12px",fontSize:11}}>Gioca →</Btn>}
                    </div>
                  );
                })}
              </Card>
            );
          })()}
          {/* Match history */}
          {(player.matchHistory||[]).length>0&&(
            <Card>
              <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Partite giocate — S.{season}</div>
              {[...(player.matchHistory||[])].reverse().slice(0,10).map((m,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 0",borderBottom:i<9?"1px solid "+TH.cardBorder:"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:m.won?TH.success:m.drew?TH.warning:TH.danger,flexShrink:0}}/>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:TH.text}}>vs {m.opponent}{m.simulated&&<span style={{fontSize:9,color:TH.faint,marginLeft:4}}>(sim.)</span>}</div>
                      <div style={{fontSize:10,color:TH.muted}}>W.{m.week}</div>
                    </div>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:13,fontWeight:700,color:TH.text}}>{m.homeScore}–{m.awayScore}</div>
                    <div style={{fontSize:9,color:TH.muted}}>⚽{m.goals} 🎯{m.assists}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:18,fontWeight:900,color:m.rating>=8?TH.success:m.rating>=6.5?TH.warning:TH.danger}}>{m.rating}</div>
                    <div style={{fontSize:9,color:TH.faint}}>voto</div>
                  </div>
                </div>
              ))}
            </Card>
          )}
          {/* Week grid — shows ⚽ on match weeks even if not yet played */}
          <Card>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Stagione {season} — calendario</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:3}}>
              {Array.from({length:38},(_,i)=>{
                const w=i+1,past=w<week,cur=w===week;
                const mh=(player.matchHistory||[]).find(m=>m.week===w);
                const calEntry=(player.calendar||[]).find(m=>m.week===w);
                const hasScheduled=!!calEntry;
                return<div key={w}
                  title={mh?`vs ${mh.opponent}: ${mh.homeScore}-${mh.awayScore}`:(calEntry?`vs ${calEntry.opponentName}${calEntry.isHome?" 🏟️":" ✈️"}`:"–")}
                  style={{borderRadius:6,padding:"5px 3px",textAlign:"center",fontSize:10,
                    background:cur?"#eff6ff":mh?mh.won?"#f0fdf4":mh.drew?"#fefce8":"#fff1f2":past?"#f8fafc":"transparent",
                    border:`1px solid ${cur?TH.primary:mh?mh.won?TH.success:mh.drew?TH.warning:TH.danger:past?TH.cardBorder:TH.cardBorder}`,
                    color:cur?TH.primary:mh?mh.won?TH.success:mh.drew?TH.warning:TH.danger:past?TH.faint:TH.faint,
                    fontWeight:cur||mh?700:400}}>
                  {w}
                  {mh?<div style={{fontSize:8,marginTop:1}}>{mh.won?"W":mh.drew?"D":"L"}</div>:hasScheduled?<div style={{fontSize:7,color:cur?TH.primary:TH.faint,marginTop:1}}>⚽</div>:null}
                </div>;
              })}
            </div>
          </Card>
        </div>
      )}

      {/* STANDINGS */}
      {tab==="standings"&&(
        <Card>
          <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>
            Classifica {player.club?.lg||(player.proStatus==="u18"?"U18 Primavera":"–")} — S.{season}
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <thead><tr>{["#","Club","G","V","P","S","Gf","Gs","Diff","Pts"].map(h=><th key={h} style={{textAlign:h==="Club"?"left":"center",padding:"4px 4px",fontSize:9,color:TH.faint,textTransform:"uppercase",letterSpacing:.5,borderBottom:"1px solid "+TH.cardBorder}}>{h}</th>)}</tr></thead>
              <tbody>
                {(player.standings||[]).map((t,i)=>{const my=t.id===player.club?.id||t.n===player.club?.n;return<tr key={t.id||t.n} style={{background:my?"#eff6ff":"transparent"}}><td style={{textAlign:"center",padding:"5px 4px",color:i<3?TH.warning:TH.muted,fontWeight:i<3?700:400}}>{i+1}</td><td style={{padding:"5px 4px",fontWeight:my?700:400,color:my?TH.primary:TH.text,whiteSpace:"nowrap"}}><span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",background:t.col||t.c,marginRight:4,verticalAlign:"middle"}}/>{t.abbr||t.a}{my&&" ★"}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.muted}}>{t.played}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.success}}>{t.wins}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.muted}}>{t.draws}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.danger}}>{t.losses}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.muted}}>{t.gf}</td><td style={{textAlign:"center",padding:"5px 4px",color:TH.muted}}>{t.ga}</td><td style={{textAlign:"center",padding:"5px 4px",color:t.gd>0?TH.success:t.gd<0?TH.danger:TH.muted}}>{t.gd>0?"+":""}{t.gd}</td><td style={{textAlign:"center",padding:"5px 4px",fontWeight:700,color:TH.warning}}>{t.pts}</td></tr>;})}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* TRAINING */}
      {tab==="training"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Card>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5}}>Attributi</div>{(player.skillPoints||0)>0&&<div style={{background:"#f3e8ff",color:TH.accent,padding:"3px 12px",borderRadius:20,fontSize:11,fontWeight:700}}>💡 {player.skillPoints} punti</div>}</div>
            {Object.entries(player.stats).map(([k,v])=>(
              <div key={k} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <div style={{flex:1}}><StatBar label={k} value={v}/></div>
                {(player.skillPoints||0)>0&&<button onClick={()=>upgradeSkill(k)} style={{width:24,height:24,borderRadius:"50%",border:"1px solid "+TH.accent,background:"#f3e8ff",color:TH.accent,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>}
              </div>
            ))}
          </Card>
          <Card>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:6}}>Allenamento libero</div>
            <p style={{fontSize:12,color:TH.muted,margin:"0 0 10px"}}>Migliora un attributo casuale (+fatica).</p>
            <Btn onClick={()=>{if((player.fatigue||0)>80){notify("Sei troppo stanco!",TH.danger);return;}const k=pick(Object.keys(player.stats));setPlayer(p=>{const ns={...p.stats,[k]:clamp(p.stats[k]+rng(1,2),1,99)};return{...p,stats:ns,ovr:calcOvr(ns),fatigue:clamp((p.fatigue||0)+10,0,100)};});notify(`Allenamento: ${k} +1!`,TH.success);}} fw>💪 Allenati (Fatica +10)</Btn>
          </Card>
        </div>
      )}

      {/* PROFILE  (req #12 – avatar/colori) */}
      {tab==="profile"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {/* U18 status banner */}
          {(player.proStatus||"u18")==="u18"&&(
            <Card bg="#eff6ff" border="#bfdbfe" style={{padding:"12px 14px"}}>
              <div style={{fontSize:10,color:TH.primary,textTransform:"uppercase",letterSpacing:1.5,fontWeight:700,marginBottom:8}}>🏫 Status Under 18</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                <div style={{background:"#dbeafe",borderRadius:8,padding:"8px 10px"}}>
                  <div style={{fontSize:9,color:TH.faint}}>STAGIONI U18</div>
                  <div style={{fontSize:20,fontWeight:900,color:TH.primary}}>{player.u18Seasons||0}<span style={{fontSize:12,color:TH.faint}}>/2</span></div>
                </div>
                <div style={{background:(player.u18Seasons||0)>=1?"#fee2e2":"#dcfce7",borderRadius:8,padding:"8px 10px"}}>
                  <div style={{fontSize:9,color:TH.faint}}>OBIETTIVO</div>
                  <div style={{fontSize:11,fontWeight:700,color:(player.u18Seasons||0)>=1?TH.danger:TH.success}}>{(player.u18Seasons||0)>=1?"⚠️ Transizione obbligatoria":"🎯 Valutazione fine stagione"}</div>
                </div>
              </div>
              <div style={{height:5,background:"#e2e8f0",borderRadius:3,overflow:"hidden",marginBottom:4}}>
                <div style={{height:"100%",width:`${(player.u18Seasons||0)*50}%`,background:(player.u18Seasons||0)>=1?"#ef4444":TH.warning,borderRadius:3}}/>
              </div>
              <div style={{fontSize:10,color:TH.muted}}>
                {(player.u18Seasons||0)===0&&"Prima stagione in Under 18. Ottieni risultati per attrarre offerte pro."}
                {(player.u18Seasons||0)===1&&"⚠️ Ultima stagione possibile in U18. Al termine DEVI passare al professionismo."}
              </div>
            </Card>
          )}
          {/* Pro status */}
          {(player.proStatus||"u18")!=="u18"&&(
            <Card bg="#f0fdf4" border="#bbf7d0" style={{padding:"12px 14px"}}>
              <div style={{fontSize:10,color:TH.success,textTransform:"uppercase",letterSpacing:1.5,fontWeight:700,marginBottom:4}}>✅ Calciatore professionista</div>
              <div style={{fontSize:11,color:TH.muted}}>Stagioni da pro: {Math.max(0,(player.season||1)-1-(player.u18Seasons||0))}</div>
            </Card>
          )}
          {/* Contract card */}
          {player.contract&&<Card style={{padding:"12px 14px"}}>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>📄 Contratto</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {[{l:"Stipendio",v:`€${player.contract.wage||"–"}/sett.`},{l:"Durata",v:`${player.contract.duration||"–"} stagion${player.contract.duration===1?"e":"i"}`},{l:"Scade stagione",v:`S.${player.contract.expiresAtSeason||"–"}`},{l:"Status",v:(player.proStatus||"u18")==="u18"?"Under 18":"Professionista"}].map(s=><div key={s.l} style={{background:"#f8fafc",borderRadius:8,padding:"7px",border:"1px solid "+TH.cardBorder}}><div style={{fontSize:9,color:TH.faint,marginBottom:2}}>{s.l}</div><div style={{fontSize:12,fontWeight:700,color:TH.text}}>{s.v}</div></div>)}
            </div>
          </Card>}
          <Card>
            <div style={{display:"flex",gap:14,alignItems:"center",marginBottom:14}}>
              <AvatarSVG id={player.avatarId||0} size={64}/>
              <div style={{flex:1}}>
                <h2 style={{margin:0,fontSize:17,fontWeight:900,color:TH.text}}>{player.name}</h2>
                <div style={{fontSize:11,color:TH.muted,marginTop:2}}>{player.nation} · Attaccante · Età {player.age}</div>
                <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:4,marginTop:2}}>
                  <span style={{fontSize:11,color:player.club?.col||player.club?.c||TH.primary,fontWeight:700}}>{player.club?.n||player.club?.name||"–"}</span>
                  {player.club?.transferType&&<span style={{fontSize:9,background:"#eff6ff",color:TH.primary,padding:"1px 7px",borderRadius:8,border:"1px solid #bfdbfe"}}>{player.club.transferType}</span>}
                  {player.club?.lg&&<span style={{fontSize:10,color:TH.muted}}>· {player.club.lg}</span>}
                  {player.club?.nat&&<span style={{fontSize:10}}>{player.club.nat}</span>}
                </div>
              </div>
              <OvrRing value={ovr} size={48}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
              {[{l:"Gol stag.",v:player.goals||0},{l:"Assist stag.",v:player.assists||0},{l:"Partite stag.",v:player.matches||0},{l:"Gol tot.",v:player.totalGoals||0},{l:"Assist tot.",v:player.totalAssists||0},{l:"Valore",v:`${player.value||0.8}M€`}].map(s=><div key={s.l} style={{background:"#f8fafc",borderRadius:8,padding:"7px",border:"1px solid "+TH.cardBorder}}><div style={{fontSize:9,color:TH.faint,marginBottom:2}}>{s.l}</div><div style={{fontSize:14,fontWeight:700,color:TH.text}}>{s.v}</div></div>)}
            </div>
          </Card>
          <Card>
            <div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Attributi</div>
            {Object.entries(player.stats).map(([k,v])=><StatBar key={k} label={k} value={v}/>)}
          </Card>
          {(player.history||[]).length>0&&<Card><div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Stagioni precedenti</div>{(player.history||[]).map((h,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:i<(player.history||[]).length-1?"1px solid "+TH.cardBorder:"none"}}><div><div style={{fontWeight:700,fontSize:12,color:TH.text}}>S.{h.season}</div><div style={{fontSize:10,color:TH.muted}}>{h.club}</div></div><div style={{display:"flex",gap:10,fontSize:11}}><span>⚽{h.goals}</span><span>🎯{h.assists}</span><span style={{color:TH.warning,fontWeight:700}}>{h.ovr}ovr</span></div></div>)}</Card>}
          <Card><div style={{fontSize:10,color:TH.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Obiettivi</div>{[{l:"Prima partita",done:(player.totalMatches||0)>=1,e:"🎮"},{l:"10 gol",done:(player.totalGoals||0)>=10,e:"⚽"},{l:"50 gol",done:(player.totalGoals||0)>=50,e:"🔥"},{l:"OVR 80+",done:ovr>=80,e:"⭐"},{l:"OVR 90+",done:ovr>=90,e:"🌟"},{l:"5 stagioni",done:(player.season||1)>5,e:"📅"}].map(o=><div key={o.l} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid "+TH.cardBorder}}><span style={{fontSize:14}}>{o.e}</span><span style={{flex:1,fontSize:11,color:o.done?TH.text:TH.faint}}>{o.l}</span><span>{o.done?"✅":"⬜"}</span></div>)}</Card>
        </div>
      )}

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:600,zIndex:100}}>
      <div style={{background:"rgba(240,247,255,0.97)",borderTop:"1px solid "+TH.cardBorder,padding:"2px 8px",display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        {[{k:"Enter",l:"Gioca"},{k:"0",l:"Avanza"},{k:"Esc",l:"Indietro"},{k:"Spc",l:"Conferma"}].map(h=>(
          <span key={h.k} style={{fontSize:9,color:TH.muted,display:"flex",alignItems:"center",gap:3}}>
            <span style={{background:"#e2e8f0",borderRadius:3,padding:"1px 5px",fontFamily:"monospace",fontSize:9,color:TH.text}}>{h.k}</span>
            {h.l}
          </span>
        ))}
      </div>
      <div style={{background:TH.navBg,backdropFilter:"blur(12px)",borderTop:"1px solid "+TH.cardBorder,display:"flex"}}>
        {tabs.map(t=><button key={t.id} onClick={()=>goTab(t.id)} style={{flex:1,padding:"10px 4px 8px",border:"none",background:"transparent",cursor:"pointer",fontFamily:"inherit",color:tab===t.id?TH.primary:TH.faint,borderTop:`2px solid ${tab===t.id?TH.primary:"transparent"}`,transition:"all .15s"}}><div style={{fontSize:17}}>{t.e}</div><div style={{fontSize:9,marginTop:2,letterSpacing:.3}}>{t.l}</div></button>)}
      </div>
      </div>{/* end bottom nav wrapper */}
    </div>
  );
}

/* ========================================
   APP ROOT
======================================== */
function App(){
  const[phase,setPhase]=useState("loading");
  const[player,setPlayer]=useState(null);
  const[trials,setTrials]=useState([]);
  const[slots,setSlots]=useState([null,null,null]);
  const[currentSlot,setCurrentSlot]=useState(0);
  const[appMsg,setAppMsg]=useState(null);

  const appNotify=(msg,color=TH.danger)=>{setAppMsg({msg,color});setTimeout(()=>setAppMsg(null),3500);};

  const refreshSlots=()=>storage.listSlots().then(s=>setSlots(s));
  useEffect(()=>{refreshSlots().then(()=>setPhase("home"));},[]);// eslint-disable-line

  const loadSave=async(slot=0)=>{
    const d=await storage.load(slot);
    if(d?.player){setPlayer(d.player);setCurrentSlot(slot);setPhase("career");}
    else appNotify("Salvataggio non valido o corrotto.");
  };
  const startNew=(slot=0)=>{setCurrentSlot(slot);setPhase("create");};
  const deleteSlot=async(slot)=>{await storage.del(slot);await refreshSlots();};
  const importSave=(file)=>{
    const r=new FileReader();
    r.onload=async e=>{
      try{
        const d=JSON.parse(e.target.result);
        if(!d?.player?.name)throw new Error();
        const emptySlot=slots.findIndex(s=>!s);
        const slot=emptySlot>=0?emptySlot:0;
        await storage.save({phase:"career",player:d.player},slot);
        await refreshSlots();
        appNotify(`✅ Importato in Slot ${slot+1}`,TH.success);
      }catch{appNotify("File di salvataggio non valido o corrotto.");}
    };
    r.readAsText(file);
  };
  const onCreate=p=>{setPlayer(p);setPhase("trial");};
  const onTrials=r=>{setTrials(r);setPhase("offers");};
  const onChoose=club=>{
    // generate initial calendar + standings when first choosing a club
    const lc=U18_CLUBS;
    const seed=1*777+hashStr(club?.id||club?.n||"u18");
    const calendar=generateSeasonCalendar(club,lc,seed);
    const standings=initStandings(lc);
    const p={...player,club,calendar,standings,log:[`🏟️ Hai scelto ${club.name||club.n}!`]};
    setPlayer(p);setPhase("career");
    storage.save({phase:"career",player:p},currentSlot);
    refreshSlots();
  };
  const wrap=ch=>(
    <div className="cpm-root" style={{minHeight:"100vh",background:TH.bgGrad,color:TH.text,fontFamily:"'Barlow','Segoe UI',sans-serif"}}>
      <style>{`
        *{box-sizing:border-box;}
        .cpm-root{padding:12px 8px 100px;}
        @media(min-width:560px){.cpm-root{padding:14px 14px 100px;}}
        @media(min-width:900px){.cpm-root{padding:16px 28px 100px;}}
        @media(min-width:1280px){.cpm-root{padding:18px 48px 100px;}}
        /* Responsive page containers — replaces all fixed maxWidth */
        .cpm-page{width:100%;}
        @media(min-width:900px){.cpm-page{max-width:960px;margin:0 auto;}}
        @media(min-width:1280px){.cpm-page{max-width:1140px;}}
        /* Career main area */
        .cpm-career{width:100%;position:relative;padding-bottom:72px;}
        @media(min-width:900px){.cpm-career{max-width:1140px;margin:0 auto;}}
        /* Dashboard 2-column grid on desktop */
        .cpm-dash-grid{display:flex;flex-direction:column;gap:12px;}
        @media(min-width:900px){.cpm-dash-grid{display:grid;grid-template-columns:1fr 1fr;align-items:start;}}
        /* Offer cards grid */
        .cpm-offers{display:flex;flex-direction:column;gap:10px;}
        @media(min-width:900px){.cpm-offers{display:grid;grid-template-columns:1fr 1fr;}}
        /* ProTransition offers */
        .cpm-proto{display:flex;flex-direction:column;gap:8px;}
        @media(min-width:900px){.cpm-proto{display:grid;grid-template-columns:1fr 1fr;}}
        /* HomeScreen slots */
        .cpm-slots{display:flex;flex-direction:column;gap:8px;}
        @media(min-width:900px){.cpm-slots{display:grid;grid-template-columns:1fr 1fr 1fr;}}
        /* Create screen 2-col on desktop */
        .cpm-create{display:flex;flex-direction:column;gap:16px;}
        @media(min-width:900px){.cpm-create{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:20px;}}
        select option{background:#fff;}
        ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px;}
        button:hover:not(:disabled){filter:brightness(0.96);}
        button:active:not(:disabled){transform:scale(.97);}
        input,select{outline:none;}
        input:focus,select:focus{border-color:${TH.primary}!important;}
        @keyframes slideIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
      `}</style>
      <Notif msg={appMsg?.msg} color={appMsg?.color}/>
      {ch}
    </div>
  );
  if(phase==="loading")return wrap(<div style={{textAlign:"center",paddingTop:80,color:TH.faint}}>Caricamento…</div>);
  if(phase==="home")return wrap(<HomeScreen slots={slots} onNew={startNew} onLoad={loadSave} onDelete={deleteSlot} onImport={importSave}/>);
  if(phase==="create")return wrap(<CreateScreen onCreate={onCreate}/>);
  if(phase==="trial"&&player)return wrap(<TrialFlow player={player} onComplete={onTrials}/>);
  if(phase==="offers"&&player)return wrap(<OffersScreen player={player} trialStats={trials} onChoose={onChoose}/>);
  if(phase==="career"&&player)return wrap(<CareerApp player={player} currentSlot={currentSlot} onRefreshSlots={refreshSlots}/>);
  return wrap(<div style={{textAlign:"center",color:TH.faint}}>Stato non riconosciuto.</div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
requestAnimationFrame(window._hide);
</script>
</body>
</html>
