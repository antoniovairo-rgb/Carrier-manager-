name: Android AAB

# Compila l'Android App Bundle di Elevora (PWA → Capacitor) sui runner GitHub,
# dove l'Android SDK è disponibile. Produce un .aab come artifact, firmato se i
# secret della keystore sono presenti, altrimenti unsigned (firmabile dopo).
on:
  workflow_dispatch: {}          # avvio manuale dalla tab Actions
  push:
    tags: ['v*']                 # oppure su tag versione (es. v1.0.0)

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # dipendenze: gate (per build-dist: babel + librerie da inlinare) + Capacitor (root)
      - name: Install dependencies
        run: |
          npm --prefix tests/visual install
          npm install

      # 1.1/1.2/1.6/6 — build web di produzione offline (precompila JSX, inline libs, storage nativo)
      - name: Build web (dist/)
        run: npm run build:web

      # genera il progetto nativo android/ (non versionato) e sincronizza dist/
      - name: Capacitor add + sync Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build AAB (release, unsigned)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release

      # firma SOLO se i secret della keystore sono configurati (Settings → Secrets):
      #   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
      - name: Sign AAB (se keystore configurata)
        id: sign
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore $RUNNER_TEMP/upload.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "${{ secrets.ANDROID_KEY_ALIAS }}"
          jarsigner -verify "$AAB" && echo "✅ AAB firmato e verificato"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevora-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
