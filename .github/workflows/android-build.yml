name: Android AAB

# Compila l'Android App Bundle di Korward Elite (PWA → Capacitor) sui runner GitHub,
# dove l'Android SDK è disponibile. Produce un .aab come artifact, firmato se i
# secret della keystore sono presenti, altrimenti unsigned (firmabile dopo).
on:
  workflow_dispatch: {}          # avvio manuale dalla tab Actions
  push:
    tags: ['v*']                 # oppure su tag versione (es. v1.0.0)

permissions:
  contents: write   # serve per pubblicare la GitHub Release sui tag

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # dipendenze: gate (per build-dist: babel + librerie da inlinare) + Capacitor (root)
      - name: Install dependencies
        run: |
          npm --prefix tests/visual install
          npm install

      # 1.1/1.2/1.6/6 — build web di produzione offline (precompila JSX, inline libs, storage nativo)
      - name: Build web (dist/)
        run: npm run build:web

      # genera il progetto nativo android/ (non versionato) e sincronizza dist/
      - name: Capacitor add + sync Android
        run: |
          npx cap add android
          npx cap sync android

      # versionCode AUTOMATICO: il progetto android/ nasce fresco a ogni run (versionCode 1) e Play
      # rifiuta un codice già usato → si stampa un codice monotòno dal numero di run + la versionName
      # dal tag (v1.2.3 → 1.2.3). Nessun file da toccare a mano per rilasciare.
      - name: Stamp versionCode/versionName
        run: |
          VC=$((100 + ${{ github.run_number }}))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VN="${GITHUB_REF_NAME#v}"; else VN="0.0.${{ github.run_number }}"; fi
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build AAB (release, unsigned)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release

      # firma SOLO se i secret della keystore sono configurati (Settings → Secrets):
      #   ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
      - name: Sign AAB (se keystore configurata)
        id: sign
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore $RUNNER_TEMP/upload.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "${{ secrets.ANDROID_KEY_ALIAS }}"
          jarsigner -verify "$AAB" && echo "✅ AAB firmato e verificato"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: korward-elite-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # ── su TAG v* : pubblica una GitHub Release con l'AAB allegato (rinominato con la versione) ──
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp android/app/build/outputs/bundle/release/app-release.aab "release/korward-elite-${GITHUB_REF_NAME}.aab"

      # ── PUBBLICAZIONE DIRETTA SU PLAY CONSOLE (se il service account è configurato) ──
      # Secret PLAY_SERVICE_ACCOUNT_JSON = JSON del service account con accesso all'app in Play Console.
      # ⚠️ Funziona dal SECONDO rilascio in poi: il PRIMO AAB va caricato una volta a mano in Console
      # (requisito di Google). Track di default: internal (promuovibile a closed/production dalla Console).
      - name: Publish to Play Console (track internal)
        if: env.HAS_PLAY_SA == 'true' && env.HAS_KEYSTORE == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.korward.elite
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Korward Elite ${{ github.ref_name }}
          files: release/korward-elite-*.aab
          fail_on_unmatched_files: true
          body: |
            **Korward Elite ${{ github.ref_name }}** — Android App Bundle (.aab)

            Firma: ${{ env.HAS_KEYSTORE == 'true' && 'firmato con upload key ✅' || '⚠️ UNSIGNED — firmare prima del caricamento su Play Console (vedi PACKAGING.md)' }}

            Build automatica via GitHub Actions (PWA → Capacitor).
