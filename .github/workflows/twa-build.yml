name: Android AAB (TWA)

# [giro 120 · PO-322] Compila l'Android App Bundle della Trusted Web Activity com.korward.elite (cartella twa/android/,
# scritta a mano sullo stampo di PLINTO). PLINTO non ha un workflow: il PO compila in Android Studio. Qui c'e' in piu' la
# strada «senza PC», con gli STESSI segreti del workflow Capacitor (android-build.yml): stessa app, stessa chiave di caricamento.
# Senza segreti esce un .aab NON firmato (firmabile dopo). Nessuna pubblicazione automatica su Play: il primo caricamento e'
# manuale e lo fa il PO. Il pacchetto Capacitor offline resta la riserva (android-build.yml, invariato).
on:
  workflow_dispatch: {}
  push:
    tags: ['twa-v*']

permissions:
  contents: read

jobs:
  build-twa-aab:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # PO 25/11 (prima corsa fallita): il default di setup-android installa il pacchetto «tools», che nei cmdline-tools 16.0
      # delle macchine GitHub non esiste piu' («Failed to find package 'tools'», exit 1). Si chiede solo platform-tools;
      # piattaforma 36 e build-tools li scarica Gradle (le licenze le accetta questo passo).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # versionCode: Play rifiuta un numero gia' visto (anche di bozze cancellate). 2000 + numero della corsa, sopra ogni
      # codice che il workflow Capacitor puo' aver stampato (100 + corsa). versionName: numero dell'APP, non la GAME_VERSION
      # (giro 365, decisione PO 25/11 «Numero da app, 1.0»: la TWA apre il sito, il gioco si aggiorna senza nuovo pacchetto);
      # si cambia a mano (build.gradle + twa-manifest.json) solo quando cambia il pacchetto. Guardiano store-236 S8.
      - name: Stamp versionCode
        run: |
          VC=$((2000 + ${{ github.run_number }}))
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/" twa/android/app/build.gradle
          grep -E "versionCode|versionName" twa/android/app/build.gradle

      - name: Build AAB (release, non firmato)
        run: |
          gradle -p twa/android --no-daemon bundleRelease
          ls -la twa/android/app/build/outputs/bundle/release

      # firma SOLO se i segreti ci sono (Settings → Secrets): ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD ·
      # ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD — gli stessi del workflow Capacitor.
      - name: Sign AAB (se keystore configurata)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS=$RUNNER_TEMP/upload.ks
          echo "$KS_B64" | base64 -d > "$KS"
          AAB=twa/android/app/build/outputs/bundle/release/app-release.aab
          # [PO 25/11, seconda corsa] Un .p12 creato da PowerShell (Export-PfxCertificate) non usa il nome dato come alias:
          # jarsigner «Certificate chain not found». Se l'alias del segreto non c'e' e il file ha UNA sola chiave privata,
          # si usa quella (l'alias trovato non si stampa). Con piu' chiavi o nessuna: errore chiaro, niente firma a caso.
          ALIAS="$KEY_ALIAS"
          if ! keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            keytool -list -keystore "$KS" -storepass "$KS_PASS" >/dev/null 2>&1 || { echo "::error::Keystore illeggibile: password del file (ANDROID_KEYSTORE_PASSWORD) o testo base64 sbagliati"; exit 1; }
            N=$(keytool -list -keystore "$KS" -storepass "$KS_PASS" 2>/dev/null | grep -c 'PrivateKeyEntry')
            if [ "$N" != "1" ]; then echo "::error::Alias del segreto non trovato e il file ha $N chiavi private: correggere ANDROID_KEY_ALIAS"; exit 1; fi
            ALIAS=$(keytool -list -keystore "$KS" -storepass "$KS_PASS" 2>/dev/null | grep 'PrivateKeyEntry' | head -1 | sed 's/,.*//')
            echo "::add-mask::$ALIAS"
            echo "Alias del segreto non presente nel file: uso l'unica chiave privata che contiene"
          fi
          KP="$KEY_PASS"; [ -n "$KP" ] || KP="$KS_PASS"
          jarsigner -keystore "$KS" -storepass "$KS_PASS" -keypass "$KP" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$ALIAS"
          jarsigner -verify "$AAB" | grep -q 'jar verified' && echo "AAB firmato e verificato"
          rm -f "$KS"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: korward-elite-twa-aab
          path: twa/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
