name: Validate Situations (quality gate)

# Quality gate del motore Situations: gira l'intera suite di validazione
# (determinismo, stato iniziale/finale, movimenti, orientamento, visivo, golden,
# coerenza dati) su ogni push e PR. Fallisce il workflow se un solo check hard fallisce.
on:
  push:
    branches: ['main', 'staging', 'claude/**']
    paths:
      - 'CARRIER-MANAGER-AV.html'
      - 'tests/**'
      - '.github/workflows/validate-situations.yml'
  pull_request:
    paths:
      - 'CARRIER-MANAGER-AV.html'
      - 'tests/**'
  workflow_dispatch: {}

# [security audit 2026-08-13] MINIMO PRIVILEGIO. Questo workflow non dichiarava alcun
# `permissions`, quindi ereditava il default del repository — che puo' essere di SCRITTURA.
# Il gate non scrive nulla: fa checkout, installa, esegue test e carica un artifact (che
# non richiede permessi sui contenuti). Sola lettura, esplicita.
permissions:
  contents: read

# annulla run obsolete sullo stesso ref
concurrency:
  group: validate-situations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/visual
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Test node-side (veloci, no browser): falliscono PRIMA del gate costoso (fail-fast)
      - name: Unit tests — AI Vision engine (test:vision, 28)
        run: npm run test:vision

      # ⚠️ Se questo passo fallisce con «BACKBONE REGRESSION», la prima domanda NON e' «rigenero la
      #    baseline?»: e' «gli scostamenti sono corretti?». La baseline e' rimasta ferma dal 7.368.0 al
      #    7.385.0 — undici giorni di CI rossa a ogni push — perche' quel commit cambio' la derivazione
      #    del pattern (un passaggio in una situazione `through` non e' piu' una COMBINATION) e non la
      #    rigenero'. Si verifica scostamento per scostamento, poi: npm run test:logic:update-baseline
      - name: Logic tests — Decision Engine + cine backbone + backbone regression (test:logic)
        run: npm run test:logic

      # [7.386.0] la tastiera non deve rubare i tasti a chi scrive: difetto trovato negli appunti di
      #   collaudo del PO (mancava ogni «p»), non da una sonda. Costa pochi secondi e sta prima del gate.
      - name: Tastiera — le scorciatoie non mangiano il testo
        run: npm run typing-shortcuts

      - name: Run quality gate (191 Situations, 14 categorie)
        run: npm run validate-situations

      # Save path GATE-BLIND: esercita la migration reale su save storici sintetici (AC-131..140)
      - name: Save-compat test (migration)
        run: npm run save-compat

      # D1 Replay Engine: registra + valida la completezza dei replay (AC-051..055)
      - name: Replay completeness (D1)
        run: npm run replay

      - name: Upload report (HTML + screenshot)
        if: always()  # carica il report anche quando il gate fallisce
        uses: actions/upload-artifact@v4
        with:
          name: situations-validation-report
          path: tests/visual/out/validate
          retention-days: 14
          if-no-files-found: ignore

  # [messa in sicurezza · FASE 5] CRITICAL CAREER TEST SUITE.
  # L'audit forense ha trovato il buco sistemico: il gate proteggeva benissimo cio' che si VEDE (il
  # motore 3D delle situazioni) e quasi per niente cio' che si PERDE (salvataggi, calendario, risultati,
  # classifica). Nessun guardiano di carriera girava in CI, 225 file di test su 280 non avevano nemmeno
  # uno script npm, e uno era morto da tempo con un import sbagliato senza che nessuno se ne accorgesse.
  # Questi otto attraversano il runtime vero, rileggono lo stato PERSISTITO e falliscono se la logica
  # difettosa viene reintrodotta (ognuno porta la sua prova del rosso).
  # Job SEPARATO: gira in parallelo al gate, cosi' non ne allunga il tempo ne' rischia il timeout.
  career-critical:
    name: Critical Career Suite (carriera · calendario · persistenza)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Critical Career Suite
        run: npm run career-critical
