name: Deploy to GitHub Pages

# Deploy DURABILE di GitHub Pages via Actions (sostituisce il deploy "legacy da branch",
# che aveva smesso di auto-buildare i push su main → produzione bloccata su una versione vecchia).
# Pubblica il contenuto statico (CARRIER-MANAGER-AV.html + asset di root) ad ogni push su main.

on:
  push:
    branches: ['main']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# una deploy alla volta; non annullare un deploy in corso
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' \
                --exclude='tests' --exclude='node_modules' \
                ./ _site/
          # index.html = copia del file di gioco → l'URL nudo della Pages funziona
          cp _site/CARRIER-MANAGER-AV.html _site/index.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
