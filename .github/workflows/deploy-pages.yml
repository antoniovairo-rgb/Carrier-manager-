name: Deploy to GitHub Pages

# Deploy DURABILE di GitHub Pages via Actions (sostituisce il deploy "legacy da branch",
# che aveva smesso di auto-buildare i push su main → produzione bloccata su una versione vecchia).
# Pubblica il contenuto statico (CARRIER-MANAGER-AV.html + asset di root) ad ogni push su main.

on:
  push:
    branches: ['main']
    # [giro 326, PO-624] un push di SOLI documenti di governo o di .md non cambia niente del sito (nessun .md e niente di
    # docs/governo va online: lo vieta la «Guardia» qui sotto) e non deve prendere una macchina ne' mettersi in coda nel
    # gruppo «pages». Basta un file fuori da questi percorsi (src/, assets/, docs/sviluppo/giro149 ...) e il deploy parte.
    # Il rilascio automatico avvia comunque il deploy con workflow_dispatch, che non guarda i percorsi.
    paths-ignore:
      - 'docs/governo/**'
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# una deploy alla volta; non annullare un deploy in corso
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # [7.999.11 collaudo PO «si riavvia l'app quando la metto pochi secondi in background»] il sito serve la versione
      # PRECOMPILATA (niente Babel nel browser): avvio 6,9 s -> 0,3 s, memoria JS 80 -> 6 MB misurati in headless.
      # Android chiude prima le schede che pesano. Stessa build del Play Store ma SENZA il flag store (tools/build-dist.mjs --web).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build precompilata per il sito (+ verifica offline)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          (cd tests/visual && npm install)
          node tools/build-dist.mjs --web
          (cd tests/visual && npx playwright install --with-deps chromium)
          node tools/validate-dist.mjs --web

      - name: Build static site
        run: |
          # [security audit 2026-08-13] LISTA ESPLICITA di cio' che va online.
          # Prima qui c'era `rsync -a` dell'INTERA root con sole quattro esclusioni
          # (.git, _site, tests, node_modules): finivano pubblicati sul sito anche i
          # documenti interni (CLAUDE.md, MASTER_PROMPT.md, BACKLOG, ROADMAP, docs/ con
          # gli audit), le skill in .claude/, i workflow di CI, tools/ e versions/ —
          # 48 build storiche del gioco per 42 MB. Materiale pubblico SENZA MOTIVO: il
          # gioco e' client-side e deve arrivare al browser, la strategia di sviluppo no.
          # Effetto collaterale importante: con la copia integrale, rendere PRIVATO il
          # repository non avrebbe sottratto nulla alla rete, perche' il sito serviva
          # comunque quei file per URL diretto.
          # Ora si elenca cio' che serve al gioco; tutto il resto resta fuori per
          # costruzione (una voce dimenticata fa fallire il passo e il deploy si ferma:
          # meglio un rilascio mancato che un rilascio che pubblica troppo).
          # VERIFICATO prima del rilascio, servendo il sito ristretto a un browser vero:
          # 47 file / 29,3 MB, il gioco parte, zero 404, zero errori JS, privacy.html
          # risponde (e' l'URL dichiarato a Google Play), nessun documento interno
          # raggiungibile.
          mkdir -p _site
          cp CARRIER-MANAGER-AV.html privacy.html sw.js manifest.webmanifest _site/
          # [21/09] rete per gli indirizzi sbagliati: un collegamento vecchio non deve piu' finire
          # sulla pagina 404 di GitHub, che fa credere al giocatore che il gioco non esista piu'.
          cp 404.html _site/
          cp icon-192.png icon-512.png icon-maskable-512.png _site/
          # [giro 120 PO-322] manifest web della TWA (letto da Bubblewrap, twa/twa-manifest.json) + icona mascherabile 192. Solo questi due:
          # il progetto Android in twa/android/ NON va sul sito.
          mkdir -p _site/twa && cp twa/manifest-twa.webmanifest twa/icone/icon-maskable-192.png _site/twa/
          cp -r assets _site/
          # [giro 129 PO-330] banco della folla da aprire sul telefono (studio 128 aggiornato): solo la pagina e il suo script.
          mkdir -p _site/prototipi/folla-128 && cp prototipi/folla-128/banco.html prototipi/folla-128/folla-proto.js _site/prototipi/folla-128/
          # [giro 149 PO-351] pagina d'ascolto dell'audio CC0 (prima/dopo di ogni evento, registrati dal gioco): la pagina, le misure e gli MP3.
          mkdir -p _site/prototipi/audio-149 && cp docs/sviluppo/giro149/ascolto.html _site/prototipi/audio-149/index.html \
            && cp docs/sviluppo/giro149/misure.json _site/prototipi/audio-149/ && cp -r docs/sviluppo/giro149/prima docs/sviluppo/giro149/dopo _site/prototipi/audio-149/
          # [giro 161] pagina d'ascolto del giro 161 (gol subito, «ohh» registrato, musica delle cerimonie): stesso schema della 149.
          mkdir -p _site/prototipi/audio-161 && cp docs/sviluppo/giro161/ascolto.html _site/prototipi/audio-161/index.html \
            && cp docs/sviluppo/giro161/misure.json _site/prototipi/audio-161/ && cp -r docs/sviluppo/giro161/prima docs/sviluppo/giro161/dopo _site/prototipi/audio-161/
          # [7.999.11] radice e indirizzo storico servono la versione PRECOMPILATA (dist-web): stesso gioco, senza Babel nel browser
          cp dist-web/index.html _site/index.html
          cp dist-web/index.html _site/CARRIER-MANAGER-AV.html
          touch _site/.nojekyll
          # [21/09] il deploy non puo' dirsi riuscito senza il file che serve la radice: se un domani
          # la copia cambia e index.html non c'e', il passo si ferma QUI invece di pubblicare un sito
          # che risponde 404 alla radice — il difetto che il PO ha fotografato il 21/09.
          for f in index.html CARRIER-MANAGER-AV.html 404.html manifest.webmanifest sw.js; do
            [ -s "_site/$f" ] || { echo "::error::manca _site/$f: il sito risponderebbe 404"; exit 1; }
          done
          echo "radice servita da index.html ($(wc -c < _site/index.html) byte)"

      # [giro 237 PO-502] verifica del sito COSI' COME VA ONLINE: la pagina servita su «/» e su «/CARRIER-MANAGER-AV.html» e' gia'
      # tradotta (non scarica ne' esegue Babel), arriva al menu sotto 4 s e carica un salvataggio esistente. Rosso = il deploy si ferma.
      # Ritirata dichiarata (NON da pubblicare): node tools/build-dist.mjs --web --babel-browser → dist-web-babel/.
      - name: Verifica del sito — pagina gia' tradotta (web-237)
        run: |
          grep -q 'type="text/babel"' _site/index.html && { echo "::error::_site/index.html traduce il JSX nel browser"; exit 1; } || true
          grep -q 'type="text/babel"' _site/CARRIER-MANAGER-AV.html && { echo "::error::_site/CARRIER-MANAGER-AV.html traduce il JSX nel browser"; exit 1; } || true
          (cd tests/visual && CPM_WEB237_DIR=_site node web-237.mjs)

      - name: Guardia — nessun materiale interno nel sito
        run: |
          # rete permanente: se un domani la copia viene riallargata, il deploy si ferma
          # qui invece di pubblicare in silenzio i documenti interni.
          intrusi=$(find _site -maxdepth 2 \( -name '*.md' -o -name '.claude' -o -name 'tools' \
                    -o -name 'versions' -o -name 'docs' -o -name 'tests' -o -name '.github' \
                    -o -name 'test.html' -o -name 'package*.json' \) -print)
          if [ -n "$intrusi" ]; then
            echo "::error::materiale interno finito nel sito pubblico:"; echo "$intrusi"; exit 1
          fi
          echo "sito pulito: $(find _site -type f | wc -l) file, $(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      # [giro 326, PO-624] NUOVI TENTATIVI. Undici deploy falliti dal 20 al 22/11: nove con «No artifacts named github-pages
      # were found for this workflow run» mezzo secondo dopo un caricamento riuscito (l'artefatto appena caricato non e' ancora
      # visibile all'API: corse 45011839594, 44965736526, 44952019086, 44947465519, 44881369408, 44881288955, 44872934649,
      # 44809496280, 45041697914) e uno con «Failed to create deployment (status: 502)» (45026223795). Sono di GitHub, e il
      # messaggio stesso dice di riprovare: si aspetta prima del primo tentativo e si riprova due volte, poi si fallisce davvero.
      - name: Attesa che l'artefatto sia visibile
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pausa prima del secondo tentativo
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (secondo tentativo)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pausa prima del terzo tentativo
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (terzo tentativo)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Esito del deploy
        run: |
          echo "tentativi: 1=${{ steps.deployment.outcome }} 2=${{ steps.deployment2.outcome }} 3=${{ steps.deployment3.outcome }}"
          echo "### Deploy: 1° ${{ steps.deployment.outcome }} · 2° ${{ steps.deployment2.outcome }} · 3° ${{ steps.deployment3.outcome }}" >> "$GITHUB_STEP_SUMMARY"
