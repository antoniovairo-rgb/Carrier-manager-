name: Treno — trenino a ogni unione, treno grande di notte

# [giro 317, PO-604 — decisioni PO 21/11 22:35 «Trenino + treno grande di notte», «Rilasci fermi finche' non si ripara»]
# push su lavoro/**|prova/** → TRENINO: solo i guardiani delle righe della mappa toccate dal vagone (diff fra l'ultimo rilascio — tag v*
#   o punta di main — e la punta) + le 17 sentinelle (tools/trenino-317.mjs scegli). Un file che nessuna riga copre → TRENO COMPLETO, dichiarato.
# notte (dal giro 330 avviata dal custode treno-notte-330.yml alle 01:07 UTC, tipo=notte) → TRENO GRANDE: mappa intera sulla punta del lavoro corrente
#   (lavoro/<numero piu' alto>) o di main se il lavoro e' gia' tutto rilasciato; scrive docs/governo/BLOCCO-RILASCI.json su main (giro 338).
# a mano → tipo mappa (treno grande, default) | trenino | notte (stesso percorso della notte).

# [giro 308, PO-592/517/527 — decisioni PO 20/11 21:05 «Treno + controlli a livelli» e 23:40 «mappa intera, parti da max 120 minuti,
# avvio su push al ramo di rilascio + a mano»]. Base: workflow di prova del giro 303 (ramo prova-ci/giro303-actions).
# Cosa gira: ogni guardiano nominato in CATENE e nella MAPPA di tests/visual/ci-runner.mjs (o l'elenco dato a mano).
# Come si taglia: tests/visual/ci-treno-308.mjs piano — parti bilanciate sulle durate misurate (docs/governo/DURATE-GUARDIANI.json).
# LA CORSA NON FALLISCE MAI PER UN GUARDIANO ROSSO (ogni corsa rossa = una mail «Run failed» al PO): l'esito sta nel riepilogo
# della corsa, nell'artifact «riepilogo-totale» (riepilogo-totale.json/.md + esito-treno.json) e distingue rosso nuovo / rosso noto
# (docs/governo/ROSSI-DICHIARATI.json) / non giudicato. Finche' la taratura non e' chiusa il giudice resta il banco.
# Solo runner standard ubuntu-latest, sola lettura sui contenuti, nessun segreto.
on:
  push:
    branches: ['lavoro/**', 'prova/**']
    paths-ignore: ['docs/**', '**/*.md']
  # [giro 330, PO-626 a] niente piu' schedule qui: il cron delle 01:07 sta in treno-notte-330.yml (custode della coda), che avvia
  # questo workflow con tipo=notte quando il posto in attesa della concorrenza e' libero e si rimette in coda se viene scalzato.
  workflow_dispatch:
    inputs:
      tipo:
        description: 'mappa = treno grande sul ramo scelto · trenino = solo le righe toccate dal vagone + sentinelle · notte = come la corsa notturna (bersaglio e blocco)'
        required: false
        type: choice
        options: ['mappa', 'trenino', 'notte']
        default: 'mappa'
      base:
        description: 'Solo trenino in modo prova: base del vagone al posto dell ultimo rilascio (vuoto = ultimo rilascio)'
        required: false
        default: ''
      elenco:
        description: 'Guardiani separati da spazio (vuoto = mappa intera)'
        required: false
        default: ''
      obiettivo_min:
        description: 'Durata attesa massima di una parte, in minuti (il job ha comunque il tetto di 120)'
        required: false
        default: '70'
      rilascio:
        description: 'Rilascio a treno pulito (giro 312): auto = segue l interruttore, prova = rami prova/cd-<corsa>-* senza deploy, no = niente'
        required: false
        type: choice
        options: ['auto', 'prova', 'no']
        default: 'auto'
      rosso_finto:
        description: 'Solo col modo prova: aggiunge un rosso nuovo finto (il rilascio deve fermarsi)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# [giro 329, PO-621 — decisione PO 22/11 19:40 «trenini fino a 15 macchine»] UNA concorrenza per TUTTE le corse del treno (trenino,
# treno grande, mappa a mano, su qualunque ramo): una alla volta, senza annullare quella in corsa. Con trenino 15 e treno grande 15 due
# corse insieme prenderebbero 30 macchine su 20; cosi' il treno ne usa al massimo 15 (+ il deploy che avvia il rilascio) e restano
# sempre posti liberi per «Deploy to GitHub Pages». Prima (giro 317) il gruppo era per ramo con cancel-in-progress: un push nuovo sullo
# stesso lavoro annullava il trenino in corsa. Limite di GitHub: nel gruppo stanno UNA corsa in corso e UNA in attesa; una terza
# corsa in coda sostituisce (annulla) quella in attesa, non quella in corsa. Guardiano: npm run deploy-326 (sezione C).
concurrency:
  group: treno-guardiani
  cancel-in-progress: false

jobs:
  piano:
    name: Piano (taglio in parti)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrice: ${{ steps.piano.outputs.matrice }}
      paralleli: ${{ steps.piano.outputs.paralleli }}   # [giro 326] tetto di parti alla volta (ci-treno-308.mjs piano)
      tipo: ${{ steps.piano.outputs.tipo }}
      chiesto: ${{ steps.bers.outputs.tipo_chiesto }}
      scelta: ${{ steps.piano.outputs.scelta }}
      sha: ${{ steps.bers.outputs.sha }}
      ramo: ${{ steps.bers.outputs.ramo }}
      grande: ${{ steps.bers.outputs.grande }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # [giro 317] il trenino calcola il diff dall'ultimo rilascio (tag o main): serve la storia
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tipo e bersaglio (giro 317)
        id: bers
        env:
          EVENTO: ${{ github.event_name }}
          TIPO_MANO: ${{ github.event.inputs.tipo }}
          ELENCO: ${{ github.event.inputs.elenco }}
          RILASCIO: ${{ github.event.inputs.rilascio }}
        run: |
          tipo="mappa"
          [ "$EVENTO" = "push" ] && tipo="trenino"
          [ "$EVENTO" = "schedule" ] && tipo="notte"
          [ "$EVENTO" = "workflow_dispatch" ] && [ -n "$TIPO_MANO" ] && tipo="$TIPO_MANO"
          if [ "$tipo" = "notte" ]; then
            node tools/trenino-317.mjs bersaglio --uscita bersaglio.json
            sha=$(node -p 'require("./bersaglio.json").sha'); ramo=$(node -p 'require("./bersaglio.json").ramo')
            git checkout -q "$sha"
          else sha="$GITHUB_SHA"; ramo="$GITHUB_REF_NAME"; fi
          # il treno grande (notte, o mappa intera a mano su lavoro/** o main) scrive il blocco dei rilasci
          grande=false
          if [ -z "$ELENCO" ] && { [ "$tipo" = "notte" ] || { [ "$tipo" = "mappa" ] && [[ "$ramo" == lavoro/* || "$ramo" == main ]]; }; }; then grande=true; fi
          # in modo prova la notte si puo' provare con un elenco corto: il blocco va su un ramo prova/cd-<corsa>-blocco, mai su main
          if [ "$tipo" = "notte" ] && [ "$RILASCIO" = "prova" ]; then grande=true; fi
          echo "tipo_chiesto=$tipo" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "ramo=$ramo" >> "$GITHUB_OUTPUT"; echo "grande=$grande" >> "$GITHUB_OUTPUT"
          echo "tipo $tipo · bersaglio $ramo $sha · treno grande $grande"
      - name: Piano e matrice
        id: piano
        working-directory: tests/visual
        env:
          CPM_TRENO_ELENCO: ${{ github.event.inputs.elenco }}
          CPM_TRENO_OBIETTIVO_MIN: ${{ github.event.inputs.obiettivo_min }}
          CPM_TRENO_TIPO: ${{ steps.bers.outputs.tipo_chiesto }}
          CPM_TRENO_SHA: ${{ steps.bers.outputs.sha }}
          CPM_TRENO_BASE: ${{ github.event.inputs.rilascio == 'prova' && github.event.inputs.base || '' }}
        run: |
          if [ -n "$CPM_TRENO_OBIETTIVO_MIN" ]; then export CPM_TRENO_OBIETTIVO_S=$(( CPM_TRENO_OBIETTIVO_MIN * 60 )); fi
          node ci-treno-308.mjs piano

  guardiani:
    name: ${{ matrix.nome }}
    needs: piano
    runs-on: ubuntu-latest
    timeout-minutes: 120   # [giro 358] = CPM_JOB_TIMEOUT_MIN qui sotto: cambiarli insieme (guardiano treno-tempo-358)
    continue-on-error: true   # un job caduto non fa fallire la corsa: se manca il suo riepilogo, il Riepilogo lo dichiara «non giudicato»
    strategy:
      fail-fast: false
      # [giro 326, PO-624] mai tutte e 20 le macchine dell'account: treno grande 15, trenino 15 dal giro 329 (ci-treno-308.mjs, TETTO_*),
      # una corsa del treno alla volta (concurrency in testa al file).
      # Restano posti per il deploy del gioco, che il 22/11 e' rimasto in coda dietro al treno fino all'annullo a mano.
      max-parallel: ${{ fromJSON(needs.piano.outputs.paralleli || '15') }}
      matrix: ${{ fromJSON(needs.piano.outputs.matrice) }}
    defaults:
      run:
        working-directory: tests/visual
    env:
      CPM_CI_PAR: '0'
      VISION_PROVIDER: none
      CPM_TRENO_BILANCIO_S: '6600'   # 110 min per i guardiani: la parte si chiude da sola prima del timeout del job
      CPM_JOB_TIMEOUT_MIN: '120'     # [giro 358] il bilancio si conta anche dall'inizio del JOB (CPM_JOB_T0), con 8 min di margine per il caricamento
    steps:
      - name: Inizio del job (giro 358)
        working-directory: ${{ github.workspace }}
        run: echo "CPM_JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.piano.outputs.sha }}   # [giro 317] di notte il bersaglio non e' il ramo dell'evento
          fetch-depth: 0   # alcuni bracci rossi leggono commit vecchi con `git show` (accessibilita-234: ea02adf0^); col clone corto erano rossi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dipendenze di tests/visual (npm install)
        run: |
          t0=$(date +%s)
          npm install --no-audit --no-fund
          echo "CPM_INSTALL_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
      - name: Chromium (Playwright, nel runner)
        run: |
          t0=$(date +%s)
          npx playwright install --with-deps chromium
          chrome=$(node -e "import('playwright').then(m=>console.log(m.chromium.executablePath()))")
          test -x "$chrome"
          echo "CPM_CHROME=$chrome" >> "$GITHUB_ENV"
          echo "CPM_CHROMIUM_S=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          "$chrome" --version; nproc; free -m | head -2
      - name: Guardiani di questa parte (esce sempre 0)
        timeout-minutes: 113   # [giro 358] rete dietro la rete: il passo muore prima del job e il caricamento (if: always) porta il riepilogo progressivo
        env:
          CPM_PARTE: ${{ matrix.nome }}
          CPM_ATTESI_S: ${{ matrix.attesi_s }}
        run: node ci-treno-308.mjs esegui "${{ matrix.guardiani }}"
      # [giro 330, PO-624] il caricamento puo' cadere per un guasto di GitHub (treno 45050383306, parte 03: 21 guardiani verdi,
      # «Failed to CreateArtifact ... Request timeout» dopo 5 tentativi interni, rilascio fermo). Due difese indipendenti:
      # (1) un secondo caricamento dopo 90 s, che sovrascrive l'eventuale artifact a meta'; (2) se manca lo stesso, il Riepilogo
      # ricostruisce la parte dalla riga CPM_PARTE330 stampata nel log da `esegui` (ci-treno-308.mjs) e lo dichiara.
      - name: Uscita come artifact
        id: up1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: guardiani-parte-${{ matrix.parte }}
          path: |
            tests/visual/out/
            !tests/visual/out/.precompilata-237/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Attesa prima del secondo caricamento (giro 330)
        if: always() && steps.up1.outcome == 'failure'
        run: sleep 90
      - name: Uscita come artifact, secondo tentativo (giro 330)
        if: always() && steps.up1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: guardiani-parte-${{ matrix.parte }}
          overwrite: true
          path: |
            tests/visual/out/
            !tests/visual/out/.precompilata-237/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  riepilogo:
    name: Riepilogo
    needs: [piano, guardiani]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read   # [giro 330, PO-624] leggere i log delle parti senza artifact (ricostruzione dalla riga CPM_PARTE330)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: parti
          pattern: guardiani-parte-*
      - name: Tabella unica e classificazione dei rossi (nel log, nel riepilogo e come artifact)
        env:
          CPM_TRENO_MATRICE: ${{ needs.piano.outputs.matrice }}
          CPM_TRENO_ELENCO: ${{ github.event.inputs.elenco }}
          CPM_TRENO_TIPO: ${{ needs.piano.outputs.tipo }}
          CPM_TRENO_SCELTA: ${{ needs.piano.outputs.scelta }}
          CPM_TRENO_SHA: ${{ needs.piano.outputs.sha }}
          CPM_TRENO_RAMO: ${{ needs.piano.outputs.ramo }}
          GH_TOKEN: ${{ github.token }}
        run: node tests/visual/ci-treno-308.mjs riunisci parti || true
      - uses: actions/upload-artifact@v4
        id: upr1
        continue-on-error: true
        with:
          name: riepilogo-totale
          path: |
            parti/riepilogo-totale.json
            parti/riepilogo-totale.md
            parti/esito-treno.json
          if-no-files-found: warn
          retention-days: 14
      - name: Attesa prima del secondo caricamento del riepilogo (giro 330)
        if: steps.upr1.outcome == 'failure'
        run: sleep 60
      - uses: actions/upload-artifact@v4
        if: steps.upr1.outcome == 'failure'
        with:
          name: riepilogo-totale
          overwrite: true
          path: |
            parti/riepilogo-totale.json
            parti/riepilogo-totale.md
            parti/esito-treno.json
          if-no-files-found: warn
          retention-days: 14

  # [giro 317, PO-604] BLOCCO DEI RILASCI dal treno grande (notte, o mappa intera a mano su lavoro/** o main).
  # [giro 338] Scrive docs/governo/BLOCCO-RILASCI.json su main SOLO quando cambia l'insieme dei guardiani bloccanti (niente commit ogni notte):
  # rossi nuovi e non giudicati della corsa = blocco acceso; un treno grande senza quei rossi = blocco spento (sbloccati).
  # Push senza force sulla punta di main (riprova fino a 4 volte rileggendo main; un push di soli docs/governo non avvia il deploy). Modo prova: ramo nuovo prova/cd-<corsa>-blocco.
  # Traccia anonima: stato «treno-grande» sul commit giudicato. Il job non fa mai fallire la corsa.
  blocco:
    name: Blocco dei rilasci (treno grande)
    needs: [piano, riepilogo]
    if: always() && needs.piano.outputs.grande == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      statuses: write
    env:
      MODO: ${{ github.event.inputs.rilascio || 'auto' }}
      CPM_CORSA: ${{ github.run_id }}
      CPM_CORSA_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      RAMO_BLOCCO: main
      SHA_GIUDICATO: ${{ needs.piano.outputs.sha }}
      RAMO_GIUDICATO: ${{ needs.piano.outputs.ramo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: riepilogo-totale
          path: esito
      - name: Nuovo blocco e scrittura su main
        run: |
          set -e
          F=docs/governo/BLOCCO-RILASCI.json; dest="$RAMO_BLOCCO"; [ "$MODO" = "prova" ] && dest="prova/cd-$CPM_CORSA-blocco"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scritto=no
          # lo strumento vive sul ramo della corsa, non su main: si copia fuori prima di passare a main (prova 44952982008: «Cannot find module»)
          cp tools/trenino-317.mjs /tmp/trenino-317.mjs
          for i in 1 2 3 4; do
            git fetch -q origin "+refs/heads/$RAMO_BLOCCO:refs/remotes/origin/$RAMO_BLOCCO"
            git checkout -q -B blocco-317 "origin/$RAMO_BLOCCO"
            node /tmp/trenino-317.mjs blocco --esito esito/esito-treno.json --prec "$F" --uscita /tmp/nuovo.json --ramo "$RAMO_GIUDICATO"
            prima=$(node -e 'try{const b=require(process.argv[1]);console.log(JSON.stringify((b.rossi||[]).map(x=>x.guardiano).sort()))}catch{console.log("nessuno")}' "$PWD/$F")
            dopo=$(node -e 'const b=require("/tmp/nuovo.json");console.log(JSON.stringify((b.rossi||[]).map(x=>x.guardiano).sort()))')
            attivo=$(node -p 'require("/tmp/nuovo.json").attivo')
            echo "attivo=$attivo" > /tmp/blocco-stato.txt
            if [ "$MODO" != "prova" ] && { [ "$prima" = "$dopo" ] || { [ "$prima" = "nessuno" ] && [ "$attivo" = "false" ]; }; }; then echo "blocco invariato ($dopo): nessun commit"; scritto=invariato; break; fi
            cp /tmp/nuovo.json "$F"; git add "$F"
            git commit -q -m "Treno grande: rilasci $([ "$attivo" = true ] && echo BLOCCATI || echo sbloccati) (corsa $CPM_CORSA)" -m "Bloccanti: $dopo · prima: $prima · commit giudicato $SHA_GIUDICATO su $RAMO_GIUDICATO · $CPM_CORSA_URL"
            if git push -q origin "HEAD:refs/heads/$dest"; then scritto=si; break; fi
            echo "push rifiutato (main si e' mosso): rileggo e riprovo"; sleep $((i * 5))
          done
          echo "scritto=$scritto dest=$dest" | tee -a /tmp/blocco-stato.txt
          echo "### Blocco dei rilasci: $(cat /tmp/blocco-stato.txt | tr '\n' ' ') · bloccanti $dopo" >> "$GITHUB_STEP_SUMMARY"
      - name: Stato del commit giudicato (leggibile senza credenziali)
        if: always()
        run: |
          a=$(grep -o 'attivo=[a-z]*' /tmp/blocco-stato.txt 2>/dev/null | cut -d= -f2)
          if [ "$a" = "false" ]; then st=success; t="treno grande: nessun rosso nuovo, rilasci liberi"; elif [ "$a" = "true" ]; then st=failure; t="treno grande: rilasci BLOCCATI ($(node -p 'require("/tmp/nuovo.json").rossi.map(x=>x.guardiano).join(", ")' | cut -c1-90))"; else st=error; t="treno grande: blocco non calcolato"; fi
          ctx="treno-grande"; [ "$MODO" = "prova" ] && ctx="treno-grande-prova"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA_GIUDICATO" -f state="$st" -f context="$ctx" -f description="$t" -f target_url="$CPM_CORSA_URL" > /dev/null || echo "::warning::stato del commit non scritto"

  # [giro 312, PO-600 — decisioni PO 21/11 17:25] RILASCIO AUTOMATICO DEL VAGONE a treno pulito.
  # Si rilascia SOLO se: interruttore acceso (docs/governo/RILASCIO-AUTO.json su main con "attivo": true, e la variabile di
  # repository CPM_RILASCIO_AUTO diversa da «spento»), ramo lavoro/**, mappa intera, tutte le parti arrivate, NESSUN rosso nuovo
  # e NESSUN non giudicato (solo rossi di ROSSI-DICHIARATI), commit provato ancora in punta, almeno un'unione «Unione sviluppo/...».
  # Poi: GAME_VERSION +1 con la nota, build-src + check-src IDENTICO, commit sul lavoro, [giro 338] unione --no-ff DIRETTAMENTE in
  # main (conflitti in docs/governo -> main), tag annotato, UN push --atomic senza force, deploy di Pages avviato a mano
  # (un push col GITHUB_TOKEN non fa partire on:push) e controllo che il sito serva la versione nuova.
  # Tracce leggibili senza credenziali: tag v<versione>, docs/governo/ULTIMO-RILASCIO.json su main, stato del commit
  # «rilascio-vagone» (anche quando si ferma, sul commit provato), artifact «esito-rilascio». Il job non fa MAI fallire la corsa.
  # Modo prova (avvio a mano, rilascio=prova): rami nuovi prova/cd-<corsa>-{lavoro,main}, tag prova-v<versione>-<corsa>, niente deploy.
  # Logica: tools/rilascio-vagone-312.mjs · guardiano: npm run rilascio-312 (rosso CPM_NO_G312=1).
  rilascio:
    name: Rilascio del vagone
    needs: [piano, riepilogo]
    # [giro 317] la notte NON rilascia: scrive solo il blocco (dubbio per il PO nel RAPPORTO-giro317)
    if: always() && needs.piano.outputs.chiesto != 'notte' && github.event_name != 'schedule' && (github.event_name == 'push' || github.event.inputs.rilascio != 'no')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    concurrency:
      group: rilascio-vagone
      cancel-in-progress: false
    permissions:
      contents: write   # commit, unione, tag e push atomico
      actions: write    # avviare «Deploy to GitHub Pages» (workflow_dispatch) e seguirne la corsa
      statuses: write   # stato del commit «rilascio-vagone», leggibile senza credenziali
      pages: read       # indirizzo del sito
    env:
      MODO: ${{ github.event.inputs.rilascio || 'auto' }}
      CPM_RILASCIO_AUTO: ${{ vars.CPM_RILASCIO_AUTO }}
      CPM_CORSA: ${{ github.run_id }}
      CPM_CORSA_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: riepilogo-totale
          path: esito
      - name: Decisione (esce sempre 0)
        id: dec
        env:
          ROSSO_FINTO: ${{ github.event.inputs.rosso_finto }}
        run: |
          rf=""; [ "$ROSSO_FINTO" = "true" ] && rf="--rosso-finto"
          node tools/rilascio-vagone-312.mjs decidi --esito esito/esito-treno.json --modo "$MODO" --ramo "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" $rf --uscita decisione.json || echo "rilascia=false" >> "$GITHUB_OUTPUT"
      - name: Prepara (versione, build, check, commit, unione, tag)
        id: prep
        if: steps.dec.outputs.rilascia == 'true'
        run: node tools/rilascio-vagone-312.mjs prepara --decisione decisione.json
      - name: Pubblica (un push atomico, mai force)
        id: pub
        if: steps.dec.outputs.rilascia == 'true' && steps.prep.outcome == 'success'
        run: node tools/rilascio-vagone-312.mjs pubblica --decisione decisione.json
      - name: Deploy di Pages e controllo del sito
        id: dep
        if: steps.pub.outcome == 'success' && env.MODO == 'auto'
        env:
          VERSIONE: ${{ steps.dec.outputs.versione }}
        run: |
          t0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy-pages.yml --ref main -R "$GITHUB_REPOSITORY" || { echo "deploy=non_avviato" >> "$GITHUB_OUTPUT"; exit 0; }
          id=""
          for i in $(seq 1 30); do sleep 10
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-pages.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt \
                 --jq "[.[] | select(.createdAt >= \"$t0\")] | last | .databaseId // empty")
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || { echo "deploy=non_trovato" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "deploy_corsa=$id" >> "$GITHUB_OUTPUT"
          if gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null; then echo "deploy=verde" >> "$GITHUB_OUTPUT"; else echo "deploy=rosso" >> "$GITHUB_OUTPUT"; exit 0; fi
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          [ -n "$url" ] || url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "sito_url=$url" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 12); do
            if curl -fsSL -H 'Cache-Control: no-cache' "${url%/}/index.html?v=$VERSIONE-$i" | grep -qF "$VERSIONE"; then echo "sito=verde" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 20
          done
          echo "sito=rosso" >> "$GITHUB_OUTPUT"
      - name: Esito leggibile (stato del commit, riepilogo, artifact)
        if: always()
        env:
          RILASCIA: ${{ steps.dec.outputs.rilascia }}
          VERSIONE: ${{ steps.dec.outputs.versione }}
          PREP: ${{ steps.prep.outcome }}
          PUB: ${{ steps.pub.outcome }}
          DEPLOY: ${{ steps.dep.outputs.deploy }}
          SITO: ${{ steps.dep.outputs.sito }}
          DEPLOY_CORSA: ${{ steps.dep.outputs.deploy_corsa }}
        run: |
          node -e '
            const fs=require("fs"); let d={}; try{d=JSON.parse(fs.readFileSync("decisione.json","utf8"))}catch{}
            const E=process.env, prova=E.MODO==="prova"; let stato="failure", testo, sha=E.GITHUB_SHA;
            if(E.RILASCIA!=="true") testo="fermo: "+((d.motivi||[])[0]||"decisione non arrivata");
            else if(E.PREP!=="success") testo="fermo in preparazione (versione/build/check/unione): vedi la corsa";
            else if(E.PUB!=="success") testo="fermo: push atomico rifiutato, nessun ramo cambiato";
            else { sha=d.commit_main||sha;
              if(prova){ stato="success"; testo=`prova: ${E.VERSIONE} su ${d.dest.main}, deploy saltato`; }
              else if(E.DEPLOY==="verde"&&E.SITO==="verde"){ stato="success"; testo=`${E.VERSIONE} pubblicata: deploy verde, il sito serve ${E.VERSIONE}`; }
              else testo=`${E.VERSIONE} su main, ma deploy=${E.DEPLOY||"?"} sito=${E.SITO||"?"}`; }
            const esito={...d, esito:{stato, testo, sha, preparazione:E.PREP||null, push:E.PUB||null, deploy:E.DEPLOY||null, deploy_corsa:E.DEPLOY_CORSA||null, sito:E.SITO||null}};
            fs.writeFileSync("esito-rilascio.json", JSON.stringify(esito,null,1)+"\n");
            fs.writeFileSync("stato-stato.txt", stato); fs.writeFileSync("stato-sha.txt", sha); fs.writeFileSync("stato-testo.txt", testo.replace(/\n/g," ").slice(0,138));
            fs.appendFileSync(E.GITHUB_STEP_SUMMARY, `\n### Esito del rilascio: ${stato==="success"?"✅":"⛔"} ${testo}\n`);
            console.log(JSON.stringify(esito.esito));'
          STATO=$(cat stato-stato.txt); SHA=$(cat stato-sha.txt); TESTO=$(cat stato-testo.txt)
          ctx="rilascio-vagone"; [ "$MODO" = "prova" ] && ctx="rilascio-vagone-prova"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$STATO" -f context="$ctx" -f description="$TESTO" -f target_url="$CPM_CORSA_URL" > /dev/null || echo "::warning::stato del commit non scritto"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esito-rilascio
          path: |
            decisione.json
            esito-rilascio.json
          if-no-files-found: warn
          retention-days: 30
