name: Treno grande di notte — custode della coda (giro 330)

# [giro 330, PO-626 a — decisione PO 22/11] Il cron non lancia piu' il treno grande dentro verifica-guardiani.yml: li' la concorrenza
# unica «treno-guardiani» (giro 329) tiene UNA corsa in corso e UNA in attesa, e un push arrivato dopo annullava il treno grande in
# attesa (quella notte niente blocco dei rilasci). Il custode sta FUORI da quel gruppo: aspetta che il posto in attesa sia libero,
# avvia verifica-guardiani.yml con tipo=notte (workflow_dispatch, stesso percorso del cron di prima: bersaglio, mappa intera, blocco,
# nessun rilascio) e, se il suo treno grande viene annullato prima di partire, si rimette in coda da solo. Logica:
# tools/custode-notte-330.mjs (guardiano npm run treno-330, rosso CPM_NO_G330=1). Occupa UNA macchina mentre aspetta: treno 15 +
# custode 1 + deploy 1 + Validate Situations a mano 2 = 19 su 20. La corsa non fallisce mai: l'esito sta nel riepilogo.
on:
  schedule:
    - cron: '7 1 * * *'   # 01:07 UTC = 02:07 a Roma d'inverno, come il cron del giro 317
    # [giro 333, PO-630] rete di riserva: GitHub dichiara che uno schedule puo' essere ritardato o PERSO sotto carico. Il secondo
    # orario (02:43 UTC, minuto lontano dall'inizio dell'ora) rifa' la veglia: se stanotte il treno grande c'e' gia' non fa nulla,
    # se il primo custode e' ancora sveglio aspetta in coda nel gruppo custode-notte, e la notte finisce per tutti alle 05:47 UTC.
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # [giro 333, PO-631] scrivere docs/governo/TRENO-NOTTE.json su main (push senza force)
  actions: write   # leggere le corse del treno e avviare verifica-guardiani.yml (workflow_dispatch)

concurrency:
  group: custode-notte
  cancel-in-progress: false

jobs:
  custode:
    name: Custode della coda notturna
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Veglia (si accoda quando il posto in attesa e' libero, si rimette in coda se scalzato)
        env:
          GH_TOKEN: ${{ github.token }}
          # [giro 333] di notte la veglia finisce alle 05:47 UTC per tutti i custodi; avviato a mano conta solo la scadenza relativa
          CPM_ENTRO_NOTTE: ${{ github.event_name == 'schedule' && '05:47' || '' }}
        run: node tools/custode-notte-330.mjs veglia --scadenza-min 280 --passo-s 60 --ref "${{ github.event.repository.default_branch }}" --esito /tmp/esito-notte.json
      # [giro 333, PO-631] l'esito della notte (partito / non partito) va in docs/governo/TRENO-NOTTE.json su main, dove lo legge la
      # pagina di governo. Solo per le corse del cron; un record gia' presente per la stessa notte non si riscrive (niente commit inutili).
      # Push senza force sulla punta di main, riprova fino a 4 volte rileggendolo. Non fa mai fallire la corsa.
      - name: Esito della notte su main (PO-631)
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          RAMO: main  # [giro 338] il ramo di appoggio non esiste piu': l'esito della notte va su main (solo docs/governo: nessun deploy)
        run: |
          F=docs/governo/TRENO-NOTTE.json
          [ -f /tmp/esito-notte.json ] || node --input-type=module -e 'import { notteDi } from "./tools/notte-333.mjs"; import fs from "node:fs"; fs.writeFileSync("/tmp/esito-notte.json", JSON.stringify({ notte: notteDi(Date.now()), esito: "non_partito", perche: "il custode si e fermato senza scrivere un esito" }))'
          cp tools/notte-333.mjs /tmp/notte-333.mjs
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git sparse-checkout set tools docs/governo
          for i in 1 2 3 4; do
            git fetch -q --depth 1 origin "+refs/heads/$RAMO:refs/remotes/origin/$RAMO"
            git checkout -q -B notte-333 "origin/$RAMO"
            rm -f /tmp/nuovo-notte.json
            node /tmp/notte-333.mjs registra --esito /tmp/esito-notte.json --prec "$F" --uscita /tmp/nuovo-notte.json
            [ -f /tmp/nuovo-notte.json ] || { echo "### Esito della notte: gia' registrato, nessun commit" >> "$GITHUB_STEP_SUMMARY"; break; }
            cp /tmp/nuovo-notte.json "$F"; git add "$F"
            git commit -q -m "Treno grande di notte: $(node -p 'const j=require("/tmp/nuovo-notte.json");j.notte+" "+j.esito') (custode $GITHUB_RUN_ID)"
            if git push -q origin "HEAD:refs/heads/$RAMO"; then echo "### Esito della notte scritto su $RAMO: $(node -p 'require("/tmp/nuovo-notte.json").esito')" >> "$GITHUB_STEP_SUMMARY"; break; fi
            echo "push rifiutato (main si e' mosso): rileggo e riprovo"; sleep $((i * 5))
          done
